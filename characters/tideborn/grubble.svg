<?xml version="1.0" encoding="UTF-8"?>
<!-- Grubblefin (melee) - Ashfall Road art v2. Small, frenzied Gurgling brawler.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93cdb4"/><stop offset=".5" stop-color="#5fa38a"/><stop offset="1" stop-color="#3a7360"/></linearGradient>
    <linearGradient id="skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8f78"/><stop offset="1" stop-color="#2e5c4d"/></linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4efc4"/><stop offset="1" stop-color="#a9c48e"/></linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f9fc4"/><stop offset=".5" stop-color="#2f6f8f"/><stop offset="1" stop-color="#1c455c"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcc7a"/><stop offset="1" stop-color="#c07a22"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a7048"/><stop offset="1" stop-color="#5a3c24"/></linearGradient>
    <linearGradient id="flint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e9f0"/><stop offset="1" stop-color="#7d8a9c"/></linearGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="20" ry="3.4" fill="#000" opacity=".35"/>
  <g transform="translate(50 94) scale(.8) translate(-50 -94)">
    <g stroke="#15121d" stroke-width="1.85" stroke-linejoin="round" stroke-linecap="round">
      <!-- spiky fin crest -->
      <path d="M60 23 L59.5 6 L53 17 L46.5 5 L44 19 L35 11 L37.5 26 L26.5 24 L36.5 35 L28.5 41 L40 43 Z" fill="url(#fin)"/>
      <!-- back arm -->
      <path d="M39 53 Q33 60 33 67 L38.5 68 Q38.5 61 43 56 Z" fill="url(#skinD)"/>
      <path d="M31 66.5 L30.5 73 L33.5 70.5 L35.5 74 L37.5 70.5 L40 72 L39.5 66.5 Z" fill="url(#skinD)"/>
      <!-- legs + webbed feet -->
      <path d="M43 76 h7 l-1 12.5 h-7 z" fill="url(#skinD)"/>
      <path d="M35.5 93.5 L37 89 Q42 86 49 88.5 L49.5 93.5 Z" fill="#2e5c4d"/>
      <path d="M52 76 h7 l2 12.5 h-7 z" fill="url(#skin)"/>
      <path d="M52.5 93.5 L53 88.5 Q60 86 65 89 L68.5 93.5 Z" fill="#3a7360"/>
      <!-- pot-bellied body -->
      <path d="M38 50 Q33 66 40 79 Q50 84 61 79 Q67 65 62 50 Q50 45 38 50 Z" fill="url(#skin)"/>
      <path d="M47 55 Q54 53 59 57 Q62 68 57 78 Q51 80 47 77 Q43 66 47 55 Z" fill="url(#belly)"/>
      <path d="M39.5 72 Q50 77 61.5 72 L61 77 Q50 81.5 40 77 Z" fill="url(#fin)"/>
      <path d="M47 78.5 L54 78.5 L52.5 86 L48.5 85 Z" fill="url(#fin)"/>
      <path d="M58.5 50.5 L42 71 L44.5 73 L61 52.5 Z" fill="url(#orange)"/>
      <!-- big head -->
      <path d="M38 38 Q37 22 53 21 Q68 21 70 33 Q71 41 66 45 Q58 51 48 50 Q39 48 38 38 Z" fill="url(#skin)"/>
      <path d="M70 33.5 Q62 37.5 53 37 Q58 48 66.5 44.5 Q70.5 40 70 33.5 Z" fill="#3a1420"/>
      <circle cx="61" cy="27" r="5.2" fill="#f4f1e2"/>
      <!-- crude spear -->
      <g transform="rotate(40 68.5 62)">
        <rect x="67.2" y="14" width="2.6" height="61" rx="1" fill="url(#wood)"/>
        <path d="M68.5 1 L72.8 9 L71.2 15 L65.8 15 L64.2 9 Z" fill="url(#flint)"/>
        <rect x="66" y="14" width="5" height="4.6" rx="1" fill="url(#orange)"/>
      </g>
      <!-- front arm -->
      <path d="M57 54 L68 59 L66 64.5 L55 60 Z" fill="url(#skin)"/>
      <circle cx="68.5" cy="62" r="3.5" fill="url(#skin)"/>
    </g>
    <!-- mouth: tongue + teeth -->
    <path d="M56 40.5 Q61 46.5 66 43.5 Q63 41 56 40.5 Z" fill="#d0606e"/>
    <g fill="#fff">
      <path d="M67.3 34.7 l1.8 -.6 l-.4 2.2 z"/>
      <path d="M63.5 35.9 l2 -.4 l-.7 2.1 z"/>
      <path d="M59.6 36.7 l2 -.2 l-1 2 z"/>
      <path d="M59 44.2 l2 .3 l-1.2 -2 z"/>
      <path d="M63 45.1 l2 -.3 l-1.3 -1.9 z"/>
    </g>
    <!-- eye -->
    <circle cx="62.3" cy="27.3" r="2.7" fill="#15121d"/>
    <circle cx="61.3" cy="26.1" r="1" fill="#fff"/>
    <path d="M55.5 21.8 Q61 19.5 66.5 23" stroke="#15121d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- gills, spots, fin ribs -->
    <path d="M45 34 q-2 3.5 0 7 M48.5 33.5 q-2 3.5 0 7" stroke="#2f6f8f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g fill="#3a7360" opacity=".85"><circle cx="46" cy="27" r="1.6"/><circle cx="50.5" cy="24.5" r="1.1"/><circle cx="42" cy="40" r="1.2"/><circle cx="41" cy="60" r="1.3"/></g>
    <path d="M56 22 L58.8 9.5 M48 21 L47 8.5 M40.5 27 L36.5 14.5 M38 33 L30 26.5" stroke="#e8a548" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M57.5 90 l1.5 3.5 M61.5 89.5 l2 4" stroke="#15121d" stroke-width="1" stroke-linecap="round"/>
    
    <!-- highlights -->
    <path d="M42 30 Q44 24 50 22.5" stroke="#fff" stroke-width="1.5" fill="none" opacity=".7" stroke-linecap="round"/>
    <path d="M38 58 Q39 53 42 51" stroke="#fff" stroke-width="1.3" fill="none" opacity=".6" stroke-linecap="round"/>
    <!-- bubbles -->
    <g fill="none" stroke="#bfeee6" stroke-width="1.2"><circle cx="76" cy="38" r="1.8"/><circle cx="80" cy="31" r="1.2"/><circle cx="73" cy="30" r=".9"/></g>
  </g>
</svg>
