    <path d="M47 43 h8 l2 47 q-6 1 -12 0 z" fill="url(#mp-fin)" opacity=".55"/>
    <!-- wave embroidery on robe -->
    <path d="M39 70 q3 -2 6 0 q3 2 6 0 q3 -2 6 0" stroke="#5fb8c2" stroke-width=".7" fill="none" opacity=".5"/>
    <path d="M40 75 q2.5 -1.5 5 0 q2.5 1.5 5 0 q2.5 -1.5 5 0 q2.5 1.5 5 0" stroke="#5fb8c2" stroke-width=".6" fill="none" opacity=".4"/>
