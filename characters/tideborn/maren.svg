    <circle class="wpn" cx="67" cy="17.5" r="6" fill="url(#mp-pearl)"/>
    <circle class="wpn" cx="67" cy="17.5" r="5.5" fill="url(#mp-irid)" opacity=".5"/>
  </g>
  <!-- fin crest ribs -->
  <path d="M47 23 L46.5 13 M51 20.5 L51 10.5 M55 19.5 L57 12.5 M58.5 20 L61 16.5 M46.5 31 L41 27 M46.5 32 L40.5 33" stroke="#a8607e" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- pearl necklace - beads with lustre -->
  <g fill="#fff7e6" stroke="#e3d5b8" stroke-width=".4">
    <circle cx="46" cy="44" r="1"/><circle cx="47.8" cy="44.8" r="1.1"/><circle cx="49.8" cy="45.5" r="1.2"/>
    <circle cx="51.8" cy="45.8" r="1.3"/><circle cx="53.8" cy="45.3" r="1.1"/><circle cx="55.5" cy="44.5" r="1"/>
  </g>
  <g fill="#fff" opacity=".6"><!-- pearl lustre highlights -->
    <circle cx="47.4" cy="44.4" r=".35"/><circle cx="49.4" cy="45.1" r=".4"/><circle cx="51.4" cy="45.4" r=".45"/><circle cx="53.4" cy="44.9" r=".35"/>
  </g>
  <!-- face -->
  <circle cx="57.8" cy="29.8" r="1.5" fill="#1d2130"/><circle cx="58.3" cy="29.3" r=".45" fill="#fff"/><circle cx="57.5" cy="30.2" r=".25" fill="#3a4a60" opacity=".5"/>
  <path d="M56 27 q2 -.9 3.9 0" stroke="#3f6b63" stroke-width=".9" fill="none" stroke-linecap="round"/><!-- eyebrow -->
  <path d="M58 35 q1.5 1.2 3.2 .3" stroke="#3f6b63" stroke-width=".8" fill="none" stroke-linecap="round"/><!-- serene smile -->
  <path d="M50.5 38 q-1 2 0 4 M52.5 38 q-1 2 0 4 M54.2 37.5 q-.8 1.5 0 3" stroke="#436f67" stroke-width=".8" fill="none" stroke-linecap="round"/><!-- gills -->
  <circle cx="56" cy="33" r="1.8" fill="#f2c6d8" opacity=".25"/><!-- cheek tint -->
  <!-- robe trim + highlights -->
  <path d="M43 46 Q45 44 48 43.5" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M46 24.5 Q50 20.5 55 20.5" stroke="#fff" stroke-width="1.1" fill="none" opacity=".7" stroke-linecap="round"/>
  <!-- shell motif embroidery -->
  <path d="M51 70 q-3 4.5 0 6.5 q3 -2 0 -6.5 z" fill="#fff7e6" stroke="#a8607e" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M47.5 80 q1.75 -1.5 3.5 0 q1.75 1.5 3.5 0" stroke="#fff7e6" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M49 83 q1 -1 2 0 q1 1 2 0" stroke="#fff7e6" stroke-width=".8" fill="none" stroke-linecap="round" opacity=".6"/>
  <!-- pearl specular highlights -->
  <circle class="wpn" cx="64.7" cy="15.4" r="1.8" fill="#fff" opacity=".9"/><circle class="wpn" cx="65.5" cy="16" r=".6" fill="#fff"/>
  <!-- tiny fish near staff -->
  <g class="wpn" fill="#bfeee6" opacity=".6"><path d="M77 22 L79.5 23 L77 24 Z"/><ellipse cx="76" cy="23" rx="1.8" ry="1"/><circle cx="75" cy="22.8" r=".3" fill="#1d2130"/></g>
  <!-- ambient bubbles -->
  <g class="wpn" fill="none" stroke="#bfeee6" stroke-width=".9">
    <circle cx="78" cy="28" r="1.7"/><circle cx="57" cy="7" r="1.2"/><circle cx="79.5" cy="11" r="1.1"/><circle cx="75" cy="37" r="1"/>
    <circle cx="81" cy="20" r=".8"/><circle cx="55" cy="3" r=".7"/><circle cx="73" cy="42" r=".6"/>
  </g>
  <g class="wpn" fill="#fff" opacity=".5"><circle cx="77.5" cy="27.2" r=".35"/><circle cx="79" cy="10.3" r=".25"/></g><!-- bubble highlights -->
</svg>
