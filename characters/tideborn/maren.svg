    <path d="M44 25 Q35 35 36 54 Q41 50 46 45 L49 31 Z" fill="url(#mp-fin)"/>
    <path d="M45 27 Q37 38 38 56 Q42 52 45 47 L47 33 Z" fill="url(#mp-finT)" opacity=".6"/>
