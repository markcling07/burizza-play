    <path d="M43.5 29 Q40 18 46 11 L48.5 16 L51 8.5 L53.5 15 L57 10.5 L58 17 L62 15 Q62.5 20 60.5 22.5 Q52 19 43.5 29 Z" fill="url(#mp-fin)"/>
    <path d="M45 14 Q47 15 48.5 16 M49.5 11 Q51 13 51.5 15 M54 12 Q55.5 14 56.5 16 M58 13 Q59 15 60 17" stroke="#fbe3ec" stroke-width=".5" fill="none" opacity=".4"/>
    <!-- ear fin -->
    <path d="M48 28.5 L40 25.5 L42 30 L39 34 L48 33 Z" fill="url(#mp-fin)"/>
    <!-- front arm + hand -->
    <path d="M56 44 Q64 46 67 57 L62 60 Q57 52 54 50 Z" fill="url(#mp-robe)"/>
    <circle cx="66.8" cy="58" r="2.8" fill="url(#mp-skin)"/>
    <!-- scallop pauldron with ridges -->
    <path d="M53.5 48.5 Q53 41.5 59.5 41 Q66 41.5 65.5 48 Q59.5 50.5 53.5 48.5 Z" fill="url(#mp-shell)"/>
    <path d="M59.5 49.5 V42 M56.5 48.8 L57 42.6 M62.5 48.8 L62 42.6 M55 47.5 L55.5 43.5 M64 47 L63.5 43" stroke="#b48a62" stroke-width=".7" stroke-linecap="round"/>
    <path d="M55 48 Q59.5 50 64 47.5" stroke="#d4a86a" stroke-width=".5" fill="none"/>
