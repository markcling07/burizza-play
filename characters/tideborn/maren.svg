    <rect class="wpn" x="65.3" y="25" width="3" height="67" rx="1" fill="url(#mp-coral)"/>
    <path class="wpn" d="M65.8 35 Q66.5 34 67.8 35 M65.8 50 Q66.5 49 67.8 50 M65.8 65 Q66.5 64 67.8 65" stroke="#943844" stroke-width=".5" fill="none"/>
