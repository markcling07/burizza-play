    <!-- upper coral branches -->
    <path class="wpn" d="M66 29 Q60.5 27 59.5 19 L62.3 18.6 Q63.3 24 67 25.5 Z" fill="url(#mp-coral)"/>
    <path class="wpn" d="M67.6 29 Q73.2 27 74.4 18.6 L71.6 18.2 Q70.6 24 66.6 25.5 Z" fill="url(#mp-coral)"/>
    <!-- small secondary branches -->
    <path class="wpn" d="M60.5 21 Q58.5 18.5 59 16 L60.5 16.5 Q60.2 18 61 19.5 Z" fill="url(#mp-coralD)"/>
    <path class="wpn" d="M73 21 Q75 18 74.5 15.5 L73 16 Q73.5 18 72.5 19.5 Z" fill="url(#mp-coralD)"/>
    <!-- lower branch -->
    <path class="wpn" d="M68 43 Q72 42 72.5 38 L70.5 37.6 Q70 40 67.8 40.5 Z" fill="url(#mp-coral)"/>
    <!-- anemone tufts at branch tips -->
    <g class="wpn" stroke="#f7a296" stroke-width=".6" fill="none" stroke-linecap="round" opacity=".7">
      <path d="M59.5 16 Q58.5 14 59 12.5 M60 16.5 Q59.5 14.5 60.5 13 M60.5 16 Q61 14 60 12"/>
      <path d="M73.5 16 Q74.5 14 74 12 M73 16 Q73 14 74 12.5 M74 15.5 Q75 14 74.5 12"/>
    </g>
    <!-- seahorse near staff -->
    <path class="wpn" d="M73 32 Q74.5 30 74 28 Q73 27 72.5 28.5 Q72 30 73 31 L72.5 33 Q71.5 34 72 34.5" stroke="#f2c6d8" stroke-width=".7" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <path d="M48.5 36 h7 v8 h-7 z" fill="url(#mp-skin)"/>
    <circle cx="52.5" cy="30" r="9" fill="url(#mp-skin)"/>
