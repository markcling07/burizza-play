<?xml version="1.0" encoding="UTF-8"?>
<!-- Maren Pearlheart (support) - Ashfall Road art v2. Pearl priestess of the reef.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66.8,58">
  <defs>
    <linearGradient id="mp-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b0d9d0"/><stop offset=".5" stop-color="#7fb3a8"/><stop offset="1" stop-color="#56877d"/></linearGradient>
    <linearGradient id="mp-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b9a90"/><stop offset="1" stop-color="#436f67"/></linearGradient>
    <linearGradient id="mp-robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset=".55" stop-color="#e9e4d8"/><stop offset="1" stop-color="#b3aa96"/></linearGradient>
    <linearGradient id="mp-robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3ccbb"/><stop offset="1" stop-color="#9c937f"/></linearGradient>
    <linearGradient id="mp-fin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe3ec"/><stop offset=".5" stop-color="#f2c6d8"/><stop offset="1" stop-color="#cf8eaa"/></linearGradient>
    <linearGradient id="mp-finT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe3ec" stop-opacity=".8"/><stop offset="1" stop-color="#cf8eaa" stop-opacity=".4"/></linearGradient>
    <linearGradient id="mp-coral" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7a296"/><stop offset="1" stop-color="#c24f5c"/></linearGradient>
    <linearGradient id="mp-coralD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4756a"/><stop offset="1" stop-color="#943844"/></linearGradient>
    <linearGradient id="mp-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb8c2"/><stop offset="1" stop-color="#2a7f8f"/></linearGradient>
    <linearGradient id="mp-shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#e3b98f"/></linearGradient>
    <radialGradient id="mp-pearl" cx=".38" cy=".35" r=".65"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#fff7e6"/><stop offset=".7" stop-color="#f0dfc8"/><stop offset="1" stop-color="#dcc6a2"/></radialGradient>
    <radialGradient id="mp-pearlGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7e6" stop-opacity=".9"/><stop offset=".5" stop-color="#ffe8cc" stop-opacity=".4"/><stop offset="1" stop-color="#5fb8c2" stop-opacity="0"/></radialGradient>
    <radialGradient id="mp-irid" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".4" stop-color="#e8f0ff" stop-opacity=".3"/><stop offset="1" stop-color="#ffe8f8" stop-opacity="0"/></radialGradient>
    <filter id="mp-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="mp-glowSm" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- pearl outer glow + light rays -->
