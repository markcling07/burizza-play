    <path d="M42 88 h8 v5.5 h-10 z" fill="url(#mp-skinD)"/>
    <path d="M52 88 h8 l2.5 5.5 h-11 z" fill="url(#mp-skin)"/>
    <path d="M44 93 v-3 M46 93 v-2.5 M48 93 v-2" stroke="#436f67" stroke-width=".5" fill="none" opacity=".5"/>
    <path d="M54 93 v-3 M56 93 v-2.5 M58 93 v-2" stroke="#56877d" stroke-width=".5" fill="none" opacity=".5"/>
    <!-- back sleeve -->
    <path d="M40 44 Q33 54 34 66 L42 64 Q41 55 44 49 Z" fill="url(#mp-robeD)"/>
    <path d="M37 56 Q39 54 41 56" stroke="#9c937f" stroke-width=".6" fill="none" opacity=".5"/>
