<?xml version="1.0" encoding="UTF-8"?>
<!-- Maren Pearlheart (support) - Ashfall Road art v2. Pearl priestess of the reef.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b0d9d0"/><stop offset=".5" stop-color="#7fb3a8"/><stop offset="1" stop-color="#56877d"/></linearGradient>
    <linearGradient id="skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b9a90"/><stop offset="1" stop-color="#436f67"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset=".55" stop-color="#e9e4d8"/><stop offset="1" stop-color="#b3aa96"/></linearGradient>
    <linearGradient id="robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3ccbb"/><stop offset="1" stop-color="#9c937f"/></linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe3ec"/><stop offset=".5" stop-color="#f2c6d8"/><stop offset="1" stop-color="#cf8eaa"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7a296"/><stop offset="1" stop-color="#c24f5c"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb8c2"/><stop offset="1" stop-color="#2a7f8f"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#e3b98f"/></linearGradient>
    <radialGradient id="pearl" cx=".38" cy=".35" r=".65"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fff7e6"/><stop offset="1" stop-color="#dcc6a2"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- pearl light -->
  <circle cx="67" cy="17.5" r="12.5" fill="#fff7e6" opacity=".7" filter="url(#glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- fin tresses -->
    <path d="M44 25 Q35 35 36 54 Q41 50 46 45 L49 31 Z" fill="url(#fin)"/>
    <path d="M44.5 30 Q39 39 38.5 50 M47 34 Q43 41 42 47" stroke="#c07e9c" stroke-width=".9" fill="none"/>
    <!-- feet -->
    <path d="M42 88 h8 v5.5 h-10 z" fill="url(#skinD)"/>
    <path d="M52 88 h8 l2.5 5.5 h-11 z" fill="url(#skin)"/>
    <!-- back sleeve -->
    <path d="M40 44 Q33 54 34 66 L42 64 Q41 55 44 49 Z" fill="url(#robeD)"/>
    <!-- robe -->
    <path d="M40 42 Q50 38 61 42 L65 89 Q51 92.5 36 89 Z" fill="url(#robe)"/>
    <path d="M47 43 h8 l2 47 q-6 1 -12 0 z" fill="url(#fin)"/>
    <path d="M36.4 85 Q51 88.5 65.6 85 L66 89 Q51 92.5 36 89 Z" fill="url(#sea)"/>
    <rect x="39" y="60" width="24" height="3.6" rx="1" fill="url(#sea)"/>
    <!-- scallop shell buckle -->
    <path d="M47 65.5 Q46.5 59.5 51 59 Q55.5 59.5 55 65.5 Q51 67 47 65.5 Z" fill="url(#shell)"/>
    <!-- coral staff -->
    <rect x="65.3" y="25" width="3" height="67" rx="1" fill="url(#coral)"/>
    <path d="M66 29 Q60.5 27 59.5 19 L62.3 18.6 Q63.3 24 67 25.5 Z" fill="url(#coral)"/>
    <path d="M67.6 29 Q73.2 27 74.4 18.6 L71.6 18.2 Q70.6 24 66.6 25.5 Z" fill="url(#coral)"/>
    <path d="M68 43 Q72 42 72.5 38 L70.5 37.6 Q70 40 67.8 40.5 Z" fill="url(#coral)"/>
    <!-- head -->
    <path d="M48.5 36 h7 v8 h-7 z" fill="url(#skin)"/>
    <circle cx="52.5" cy="30" r="9" fill="url(#skin)"/>
    <!-- fin crest -->
    <path d="M43.5 29 Q40 18 46 11 L48.5 16 L51 8.5 L53.5 15 L57 10.5 L58 17 L62 15 Q62.5 20 60.5 22.5 Q52 19 43.5 29 Z" fill="url(#fin)"/>
    <path d="M48 28.5 L40 25.5 L42 30 L39 34 L48 33 Z" fill="url(#fin)"/>
    <!-- front arm + shell pauldron -->
    <path d="M56 44 Q64 46 67 57 L62 60 Q57 52 54 50 Z" fill="url(#robe)"/>
    <circle cx="66.8" cy="58" r="2.8" fill="url(#skin)"/>
    <path d="M53.5 48.5 Q53 41.5 59.5 41 Q66 41.5 65.5 48 Q59.5 50.5 53.5 48.5 Z" fill="url(#shell)"/>
    <!-- pearl -->
    <circle cx="67" cy="17.5" r="6" fill="url(#pearl)"/>
  </g>
  <!-- fin ribs -->
  <path d="M47 23 L46.5 13 M51 20.5 L51 10.5 M55 19.5 L57 12.5 M58.5 20 L61 16.5 M46.5 31 L41 27 M46.5 32 L40.5 33" stroke="#a8607e" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- shell ridges -->
  <path d="M51 65.8 V60 M48.8 65.3 L49.2 60.6 M53.2 65.3 L52.8 60.6" stroke="#b48a62" stroke-width=".8" stroke-linecap="round"/>
  <path d="M59.5 49.5 V42 M56.5 48.8 L57 42.6 M62.5 48.8 L62 42.6" stroke="#b48a62" stroke-width=".8" stroke-linecap="round"/>
  <!-- pearl necklace -->
  <g fill="#fff7e6" stroke="#15121d" stroke-width=".6"><circle cx="47" cy="44.4" r="1"/><circle cx="49.2" cy="45.6" r="1"/><circle cx="51.5" cy="46" r="1.2"/><circle cx="53.8" cy="45.5" r="1"/></g>
  <!-- face -->
  <circle cx="57.8" cy="29.8" r="1.5" fill="#1d2130"/>
  <circle cx="58.3" cy="29.3" r=".45" fill="#fff"/>
  <path d="M56 27 q2 -.9 3.9 0" stroke="#3f6b63" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M58 35 q1.5 1 3 0" stroke="#3f6b63" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M50.5 38 q-1 2 0 4 M52.5 38 q-1 2 0 4" stroke="#436f67" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- robe trim + highlights -->
  <path d="M43 46 Q45 44 48 43.5" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M46 24.5 Q50 20.5 55 20.5" stroke="#fff" stroke-width="1.1" fill="none" opacity=".7" stroke-linecap="round"/>
  <path d="M51 70 q-3 4.5 0 6.5 q3 -2 0 -6.5 z" fill="#fff7e6" stroke="#a8607e" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M47.5 80 q1.75 -1.5 3.5 0 q1.75 1.5 3.5 0" stroke="#fff7e6" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <circle cx="64.7" cy="15.4" r="1.6" fill="#fff"/>
  <!-- bubbles -->
  <g fill="none" stroke="#bfeee6" stroke-width="1"><circle cx="78" cy="28" r="1.7"/><circle cx="57" cy="7" r="1.2"/><circle cx="79.5" cy="11" r="1.1"/><circle cx="75" cy="37" r="1"/></g>
</svg>
