  <g class="wpn" stroke="#fff7e6" stroke-width=".7" opacity=".35" stroke-linecap="round">
    <line x1="67" y1="17.5" x2="58" y2="6"/><line x1="67" y1="17.5" x2="76" y2="5"/>
    <line x1="67" y1="17.5" x2="79" y2="14"/><line x1="67" y1="17.5" x2="56" y2="12"/>
  </g>
  <g stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
