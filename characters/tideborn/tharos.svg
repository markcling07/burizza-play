    <path d="M44 28 l3 2.5 l-1 .3 l-2.5 -2.2 z" fill="#7a96a8" opacity=".5"/>
    <path d="M59 48 Q61 50 60 52.5 M42 55 l2 1.5" stroke="#7a96a8" stroke-width=".55" fill="none" opacity=".42"/>
    <!-- trident -->
    <g transform="rotate(12 66 59)">
      <rect class="wpn" x="64.4" y="22" width="3.2" height="60" rx="1" fill="url(#tr-shaft)"/>
      <!-- coral encrustations -->
      <path class="wpn" d="M64.4 40 Q63 41 63.2 43 Q64 42.5 64.4 42" fill="url(#tr-coral)" opacity=".7"/>
      <path class="wpn" d="M67.6 48 Q69 49 68.8 51 Q68 50.5 67.6 50" fill="url(#tr-coral)" opacity=".65"/>
      <path class="wpn" d="M64.4 55 Q63.5 55.5 63.6 57 Q64.2 56.5 64.4 56" fill="url(#tr-coral)" opacity=".55"/>
      <!-- shaft bindings -->
      <path class="wpn" d="M64 30 l4 1.5 l-.2 1 l-4 -1.5 z M64 35 l4 1.5 l-.2 1 l-4 -1.5 z" fill="#6a5a3a" opacity=".58"/>
      <!-- barbed trident head -->
      <path class="wpn" d="M59 13 Q58.5 22 61.5 24.5 Q66 27.5 70.5 24.5 Q73.5 22 73 13 L70.8 13 Q71 20 68.5 21.8 L67.6 22 L67.6 11 L64.4 11 L64.4 22 L63.5 21.8 Q61 20 61.2 13 Z" fill="url(#tr-gold)"/>
      <!-- barbs on prongs -->
      <path class="wpn" d="M60 16 l-1.2 -.5 l1 -1 z M59.5 19 l-1.1 -.4 l.9 -.9 z" fill="url(#tr-gold)"/>
      <path class="wpn" d="M72 16 l1.2 -.5 l-1 -1 z M72.5 19 l1.1 -.4 l-.9 -.9 z" fill="url(#tr-gold)"/>
      <!-- prong tips -->
      <path class="wpn" d="M57.6 14 L60.1 7 L62.6 14 Z" fill="url(#tr-gold)"/>
      <path class="wpn" d="M69.4 14 L71.9 7 L74.4 14 Z" fill="url(#tr-gold)"/>
      <path class="wpn" d="M63.2 12 L66 3.5 L68.8 12 Z" fill="url(#tr-gold)"/>
      <path class="wpn" d="M59 10 l-1 .3 l.6 -1.2 z M73 10 l1 .3 l-.6 -1.2 z" fill="#d4b44a"/>
      <!-- collar with grooves -->
      <rect class="wpn" x="63.3" y="25.5" width="5.4" height="3" rx="1" fill="url(#tr-gold)"/>
      <path class="wpn" d="M63.8 26 h4.4 M63.8 27.5 h4.4" stroke="#8a6c28" stroke-width=".4" opacity=".5"/>
      <!-- pommel -->
      <circle class="wpn" cx="66" cy="83" r="2.2" fill="url(#tr-gold)"/>
      <circle class="wpn" cx="66" cy="83" r="1" fill="#d4b44a" opacity=".5"/>
    </g>
    <!-- front arm -->
    <path d="M57 47 L67 56 L63.5 61 L54.5 52 Z" fill="url(#tr-skin)"/>
    <path d="M59 49 Q63 53 64 57" stroke="#5a7080" stroke-width=".45" fill="none" opacity=".35"/>
    <circle cx="65.5" cy="59" r="3.3" fill="url(#tr-skin)"/>
    <!-- shell pauldron with ridges and iridescence -->
    <path d="M54.5 51 Q54 44.5 60.5 44 Q67 44.5 67 51 Q60.5 53.5 54.5 51 Z" fill="url(#tr-shell)"/>
    <path d="M56 47 Q60.5 45 65 47 M55.5 49 Q60.5 47 65.5 49 M55.8 51 Q60.5 49.5 65 51" stroke="#c2b99c" stroke-width=".45" fill="none" opacity=".5"/>
    <path d="M60.5 44.5 Q60.5 48 60.5 52" stroke="#d4c78e" stroke-width=".35" fill="none" opacity=".35"/>
  </g>
  <!-- teeth - upper row with size variation -->
  <path d="M73.4 31.2 L72.8 33.2 L72 31.6 L71.2 33.5 L70.3 32 L69.5 34 L68.6 32.4 L67.8 34.2 L67 32.8 L66.2 34.5 L65.4 33.2 L64.6 34.8 L63.8 33.5 L63 35 L62.2 33.8 L61.4 35.1 L60.6 34 L59.8 34.8 L59 34.2 Q66 34 73.4 31.2 Z" fill="#fff"/>
  <!-- teeth - lower row -->
  <path d="M60.5 36.2 l.8 -1.3 l.8 1.4 l.7 -1.2 l.8 1.3 l.7 -1.3 l.8 1.4 l.7 -1.1 l.8 1.2 l.6 -1 l.7 1.1 Z" fill="#fff"/>
  <!-- inner tooth row hint -->
  <path d="M64 34.8 l.5 -.6 l.5 .7 l.5 -.6 l.5 .7 l.5 -.5 l.4 .6" stroke="#e8e4d8" stroke-width=".3" fill="none" opacity=".6"/>
  <!-- eye with depth -->
  <circle cx="64" cy="25.5" r="1.8" fill="#15121d"/>
  <circle cx="64.6" cy="24.9" r=".55" fill="#fff"/>
  <circle cx="63.4" cy="26" r=".25" fill="#222" opacity=".5"/>
  <!-- brow ridge -->
  <path d="M60.5 22.6 l6 1.4" stroke="#3a4d5e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M60.5 22.4 l6 1.4" stroke="#5a7080" stroke-width=".7" stroke-linecap="round" fill="none" opacity=".5"/>
  <!-- gills - layered slits with depth shading -->
  <path d="M45.5 29 q-1.8 3.8 0 7.6 M48.5 29.8 q-1.8 3.8 0 7.6 M51.5 31 q-1.4 3.2 0 6.4" stroke="#1e2e3a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M45.5 29.5 q-1.4 3.2 0 6.5 M48.5 30.3 q-1.4 3.2 0 6.5 M51.5 31.5 q-1 2.6 0 5.2" stroke="#374655" stroke-width=".45" fill="none" stroke-linecap="round" opacity=".55"/>
  <!-- belly lines and sash studs -->
  <path d="M47.5 52 h7.5 M47.5 56.5 h7.5 M47.5 61 h7.5" stroke="#a99f84" stroke-width=".9" stroke-linecap="round"/>
  <path d="M60.5 52.3 V45 M57.5 51.7 L58 45.5 M63.5 51.7 L63 45.5" stroke="#8a7036" stroke-width=".8" stroke-linecap="round"/>
  <path d="M38 69 Q42 71 46 69 M54 69 Q58 71 62 69" stroke="#6e86a3" stroke-width=".9" fill="none" opacity=".8"/>
  <!-- highlights -->
  <path d="M45 24.5 Q49 19.5 55.5 18.5" stroke="#fff" stroke-width="1.3" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M40 8 Q48 8.5 52 14" stroke="#fff" stroke-width="1.1" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M39 48.5 Q41 45.5 44.5 44.5" stroke="#fff" stroke-width="1.3" fill="none" opacity=".7" stroke-linecap="round"/>
  <path d="M56.5 46.5 q2.5 -1.6 5 -1.4" stroke="#fff" stroke-width="1.1" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M60 51 Q62 54 63 57" stroke="#fff" stroke-width=".7" fill="none" opacity=".4" stroke-linecap="round"/>
  <!-- water drips from trident -->
  <g class="wpn" fill="#9fdcff" stroke="none" stroke-width=".7">
    <path d="M87 15 q-2 3.2 0 4.4 q2 -1.2 0 -4.4 z"/>
    <path d="M91 27 q-1.5 2.4 0 3.3 q1.5 -.9 0 -3.3 z"/>
    <path d="M84 21 q-1.2 2 0 2.8 q1.2 -.8 0 -2.8 z" opacity=".7"/>
  </g>
  <!-- splash mist at feet -->
  <circle cx="38" cy="92" r=".8" fill="#9fdcff" opacity=".3"/>
  <circle cx="64" cy="91.5" r=".6" fill="#9fdcff" opacity=".25"/>
  <circle cx="42" cy="93" r=".5" fill="#9fdcff" opacity=".2"/>
</svg>
