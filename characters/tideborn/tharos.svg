<?xml version="1.0" encoding="UTF-8"?>
<!-- Tharos Razorfin (melee) - Ashfall Road art v2. Shark-folk trident warrior.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66,59">
  <defs>
    <linearGradient id="tr-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6b8c7"/><stop offset=".5" stop-color="#6f8597"/><stop offset="1" stop-color="#48596a"/></linearGradient>
    <linearGradient id="tr-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#62778a"/><stop offset="1" stop-color="#374655"/></linearGradient>
    <linearGradient id="tr-belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1e2"/><stop offset="1" stop-color="#c2b99c"/></linearGradient>
    <linearGradient id="tr-slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c7491"/><stop offset=".5" stop-color="#3b4f63"/><stop offset="1" stop-color="#212d3a"/></linearGradient>
    <linearGradient id="tr-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e8b6"/><stop offset="1" stop-color="#a88c48"/></linearGradient>
    <linearGradient id="tr-shaft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d6c4a"/><stop offset="1" stop-color="#4c3625"/></linearGradient>
    <linearGradient id="tr-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e8b6"/><stop offset=".35" stop-color="#d4c78e"/><stop offset=".65" stop-color="#b8d4c8"/><stop offset="1" stop-color="#a88c48"/></linearGradient>
    <linearGradient id="tr-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b86c4a"/><stop offset="1" stop-color="#6e3a28"/></linearGradient>
    <linearGradient id="tr-finray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6880"/><stop offset="1" stop-color="#1e2e3a"/></linearGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="25" ry="3.6" fill="#000" opacity=".35"/>
  <g stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- dorsal fin with cartilage veins and notches -->
    <path d="M43.5 22 Q43 12 34.5 5 Q51 5.5 57.5 19 Z" fill="url(#tr-skinD)"/>
    <path d="M42 17 Q41 11.5 37 7.5 M45 19 Q44 13 40.5 9 M48 20 Q47.5 15 44 11.5" stroke="#374655" stroke-width=".6" fill="none" opacity=".55"/>
    <path d="M39 9.5 l.6 -.8 l-.3 1.2 M44.5 13 l.4 -1 l-.2 1.3" fill="#374655" opacity=".38"/>
    <!-- back arm with elbow fin -->
    <path d="M33.5 52 L26 57.5 L34.5 58 Z" fill="url(#tr-skinD)"/>
    <path d="M36 46 Q32 54 34 62 L40 62 Q40 54 44 49 Z" fill="url(#tr-skinD)"/>
    <circle cx="37" cy="63" r="3.3" fill="url(#tr-skinD)"/>
    <path d="M35.5 50 Q34 55 34.8 60" stroke="#2b3a48" stroke-width=".5" fill="none" opacity=".4"/>
    <!-- legs -->
    <path d="M42 71 h8 l-1 17 h-8 z" fill="url(#tr-skinD)"/>
    <path d="M37 88 h12 v5.5 h-13.5 z" fill="#37465a"/>
    <path d="M51 71 h8 l3 17 h-8 z" fill="url(#tr-skin)"/>
    <path d="M53 88 h12 l3 5.5 h-15 z" fill="#4f6273"/>
    <!-- shin wraps with knee curves -->
    <path d="M41.6 78 h8.2 l-.3 5 h-8.2 z" fill="url(#tr-slate)"/>
    <path d="M52 78 h8.3 l.8 5 h-8.3 z" fill="url(#tr-slate)"/>
    <path d="M44 75 Q46 73.5 48 75 M55 75 Q57 73.5 59 75" stroke="#5a7080" stroke-width=".6" fill="none" opacity=".5"/>
    <!-- fin kilt with fin-ray structure -->
    <path d="M37 64 L63 64 L65.5 80.5 L58 76.5 L51 82.5 L44 76.5 L34.5 80.5 Z" fill="url(#tr-slate)"/>
    <path d="M65.5 80.5 L64 72 M58 76.5 L57.5 70 M51 82.5 L51 72 M44 76.5 L44.5 70 M34.5 80.5 L36 72" stroke="url(#tr-finray)" stroke-width=".6" fill="none" opacity=".7"/>
    <path d="M63 68 L65 78 M56 68 L57.5 75 M49 68 L50 77 M42 68 L43 75 M37 68 L35.5 78" stroke="#1e2e3a" stroke-width=".35" fill="none" opacity=".4"/>
    <path d="M62 66 L64.8 79 M40 66 L35.2 79" stroke="#4a6880" stroke-width=".4" fill="none" opacity=".3"/>
    <!-- torso -->
    <path d="M40 45 L42 34 L56 36 L58 45 Z" fill="url(#tr-skin)"/>
    <path d="M36 45 Q50 39 64 45 L62 67 Q50 70 38 67 Z" fill="url(#tr-skin)"/>
    <path d="M45 47 Q51 45 57 47 L56 65 Q50 67 46 65 Z" fill="url(#tr-belly)"/>
    <!-- sash -->
    <path d="M40 45 L61 63 L58 65.5 L37.5 48 Z" fill="url(#tr-slate)"/>
    <!-- belt with buckle and rivets -->
    <rect x="36.5" y="62.5" width="27" height="4.5" rx="1" fill="url(#tr-gold)"/>
    <circle cx="50" cy="64.7" r="1.4" fill="#d4b44a" stroke="#8a6c28" stroke-width=".4"/>
    <path d="M42 63.5 h3 M55 63.5 h3" stroke="#8a6c28" stroke-width=".5" opacity=".6"/>
    <!-- muscle definition -->
    <path d="M47 49 Q50 48 53 49 M47.5 53 Q50 52 52.5 53" stroke="#8a9dae" stroke-width=".45" fill="none" opacity=".33"/>
    <path d="M39 48 Q41 52 40 56 M61 48 Q63 52 62 56" stroke="#5a7080" stroke-width=".5" fill="none" opacity=".3"/>
    <!-- shark head -->
    <path d="M41 38 Q38 24 47 19 Q57 15 66 20 Q72 24 75 30 Q75 34.5 70 37.5 Q62 42.5 52 42.5 Q44 43 41 38 Z" fill="url(#tr-skin)"/>
    <path d="M75 30 Q75 34.5 70 37.5 Q62 42.5 52 42.5 Q47 42.5 44 40.5 Q55 40 62 36.5 Q69 33.5 75 30 Z" fill="url(#tr-belly)"/>
    <path d="M74.2 30.8 Q66 34.5 57 34 Q62 40 70.5 35.8 Z" fill="#3a1622"/>
    <!-- dermal denticle texture -->
    <path d="M50 22 l.4 .5 l-.8 0 z M54 21 l.4 .5 l-.8 0 z M58 22.5 l.4 .5 l-.8 0 z M62 23 l.35 .45 l-.7 0 z M52 25 l.35 .45 l-.7 0 z M56 24.5 l.35 .45 l-.7 0 z M60 25.5 l.3 .4 l-.6 0 z" fill="#5a7080" opacity=".25"/>
    <path d="M41 50 l.4 .5 l-.8 0 z M43 54 l.4 .5 l-.8 0 z M59 50 l.4 .5 l-.8 0 z M61 54 l.4 .5 l-.8 0 z M42 58 l.35 .45 l-.7 0 z M60 58 l.35 .45 l-.7 0 z" fill="#5a7080" opacity=".2"/>
