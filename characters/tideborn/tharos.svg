<?xml version="1.0" encoding="UTF-8"?>
<!-- Tharos Razorfin (melee) - Ashfall Road art v2. Shark-folk trident warrior.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6b8c7"/><stop offset=".5" stop-color="#6f8597"/><stop offset="1" stop-color="#48596a"/></linearGradient>
    <linearGradient id="skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#62778a"/><stop offset="1" stop-color="#374655"/></linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1e2"/><stop offset="1" stop-color="#c2b99c"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c7491"/><stop offset=".5" stop-color="#3b4f63"/><stop offset="1" stop-color="#212d3a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e8b6"/><stop offset="1" stop-color="#a88c48"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d6c4a"/><stop offset="1" stop-color="#4c3625"/></linearGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="25" ry="3.6" fill="#000" opacity=".35"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- dorsal fin -->
    <path d="M43.5 22 Q43 12 34.5 5 Q51 5.5 57.5 19 Z" fill="url(#skinD)"/>
    <!-- back arm with fin -->
    <path d="M33.5 52 L26 57.5 L34.5 58 Z" fill="url(#skinD)"/>
    <path d="M36 46 Q32 54 34 62 L40 62 Q40 54 44 49 Z" fill="url(#skinD)"/>
    <circle cx="37" cy="63" r="3.3" fill="url(#skinD)"/>
    <!-- legs -->
    <path d="M42 71 h8 l-1 17 h-8 z" fill="url(#skinD)"/>
    <path d="M37 88 h12 v5.5 h-13.5 z" fill="#37465a"/>
    <path d="M51 71 h8 l3 17 h-8 z" fill="url(#skin)"/>
    <path d="M53 88 h12 l3 5.5 h-15 z" fill="#4f6273"/>
    <path d="M41.6 78 h8.2 l-.3 5 h-8.2 z" fill="url(#slate)"/>
    <path d="M52 78 h8.3 l.8 5 h-8.3 z" fill="url(#slate)"/>
    <!-- fin kilt -->
    <path d="M37 64 L63 64 L65.5 80.5 L58 76.5 L51 82.5 L44 76.5 L34.5 80.5 Z" fill="url(#slate)"/>
    <!-- torso -->
    <path d="M40 45 L42 34 L56 36 L58 45 Z" fill="url(#skin)"/>
    <path d="M36 45 Q50 39 64 45 L62 67 Q50 70 38 67 Z" fill="url(#skin)"/>
    <path d="M45 47 Q51 45 57 47 L56 65 Q50 67 46 65 Z" fill="url(#belly)"/>
    <path d="M40 45 L61 63 L58 65.5 L37.5 48 Z" fill="url(#slate)"/>
    <rect x="36.5" y="62.5" width="27" height="4.5" rx="1" fill="url(#gold)"/>
    <!-- shark head -->
    <path d="M41 38 Q38 24 47 19 Q57 15 66 20 Q72 24 75 30 Q75 34.5 70 37.5 Q62 42.5 52 42.5 Q44 43 41 38 Z" fill="url(#skin)"/>
    <path d="M75 30 Q75 34.5 70 37.5 Q62 42.5 52 42.5 Q47 42.5 44 40.5 Q55 40 62 36.5 Q69 33.5 75 30 Z" fill="url(#belly)"/>
    <path d="M74.2 30.8 Q66 34.5 57 34 Q62 40 70.5 35.8 Z" fill="#3a1622"/>
    <!-- trident -->
    <g transform="rotate(12 66 59)">
      <rect x="64.4" y="22" width="3.2" height="60" rx="1" fill="url(#shaft)"/>
      <path d="M59 13 Q58.5 22 61.5 24.5 Q66 27.5 70.5 24.5 Q73.5 22 73 13 L70.8 13 Q71 20 68.5 21.8 L67.6 22 L67.6 11 L64.4 11 L64.4 22 L63.5 21.8 Q61 20 61.2 13 Z" fill="url(#gold)"/>
      <path d="M57.6 14 L60.1 7 L62.6 14 Z" fill="url(#gold)"/>
      <path d="M69.4 14 L71.9 7 L74.4 14 Z" fill="url(#gold)"/>
      <path d="M63.2 12 L66 3.5 L68.8 12 Z" fill="url(#gold)"/>
      <rect x="63.3" y="25.5" width="5.4" height="3" rx="1" fill="url(#gold)"/>
      <circle cx="66" cy="83" r="2.2" fill="url(#gold)"/>
    </g>
    <!-- front arm + shell pauldron -->
    <path d="M57 47 L67 56 L63.5 61 L54.5 52 Z" fill="url(#skin)"/>
    <circle cx="65.5" cy="59" r="3.3" fill="url(#skin)"/>
    <path d="M54.5 51 Q54 44.5 60.5 44 Q67 44.5 67 51 Q60.5 53.5 54.5 51 Z" fill="url(#gold)"/>
  </g>
  <!-- teeth -->
  <path d="M73.4 31.2 L72.5 33 L71.4 31.9 L70.4 33.8 L69.2 32.5 L68.2 34.3 L67 33 L66 34.7 L64.8 33.4 L63.8 34.9 L62.6 33.7 L61.6 35 L60.4 34 L59 34.2 Q65.8 34.1 73.4 31.2 Z" fill="#fff"/>
  <path d="M61 36.6 l1 -1.5 l1 1.6 l1 -1.5 l1 1.6 l1 -1.5 l1 1.4 Z" fill="#fff"/>
  <!-- eye, brow, gills -->
  <circle cx="64" cy="25.5" r="1.8" fill="#15121d"/>
  <circle cx="64.6" cy="24.9" r=".55" fill="#fff"/>
  <path d="M60.5 22.6 l6 1.4" stroke="#15121d" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M46 30 q-1.6 3.5 0 7 M49 30.5 q-1.6 3.5 0 7 M52 31.5 q-1.3 3 0 6" stroke="#2b3a48" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- body details -->
  <path d="M47.5 52 h7.5 M47.5 56.5 h7.5 M47.5 61 h7.5" stroke="#a99f84" stroke-width=".9" stroke-linecap="round"/>
  <path d="M60.5 52.3 V45 M57.5 51.7 L58 45.5 M63.5 51.7 L63 45.5" stroke="#8a7036" stroke-width=".8" stroke-linecap="round"/>
  <path d="M38 69 Q42 71 46 69 M54 69 Q58 71 62 69" stroke="#6e86a3" stroke-width=".9" fill="none" opacity=".8"/>
  <!-- highlights -->
  <path d="M45 24.5 Q49 19.5 55.5 18.5" stroke="#fff" stroke-width="1.3" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M40 8 Q48 8.5 52 14" stroke="#fff" stroke-width="1.1" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M39 48.5 Q41 45.5 44.5 44.5" stroke="#fff" stroke-width="1.3" fill="none" opacity=".7" stroke-linecap="round"/>
  <path d="M56.5 46.5 q2.5 -1.6 5 -1.4" stroke="#fff" stroke-width="1.1" fill="none" opacity=".8" stroke-linecap="round"/>
  <!-- droplets -->
  <g fill="#9fdcff" stroke="#15121d" stroke-width=".7">
    <path d="M87 15 q-2 3.2 0 4.4 q2 -1.2 0 -4.4 z"/>
    <path d="M91 27 q-1.5 2.4 0 3.3 q1.5 -.9 0 -3.3 z"/>
  </g>
</svg>
