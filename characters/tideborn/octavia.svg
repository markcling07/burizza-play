<?xml version="1.0" encoding="UTF-8"?>
<!-- Octavia Inkveil (ranged) - Ashfall Road art v2. Octopus-folk ink caster.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="71,50.3">
  <defs>
    <linearGradient id="oi-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8a0d6"/><stop offset=".5" stop-color="#9b6aa8"/><stop offset="1" stop-color="#673f76"/></linearGradient>
    <linearGradient id="oi-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#875a99"/><stop offset="1" stop-color="#543163"/></linearGradient>
    <linearGradient id="oi-robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5d9a"/><stop offset=".55" stop-color="#4b3d6e"/><stop offset="1" stop-color="#2a2142"/></linearGradient>
    <linearGradient id="oi-robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43375f"/><stop offset="1" stop-color="#241c38"/></linearGradient>
    <linearGradient id="oi-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e9a8"/><stop offset=".5" stop-color="#d4c46e"/><stop offset="1" stop-color="#b09a3a"/></linearGradient>
    <linearGradient id="oi-goldD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b050"/><stop offset="1" stop-color="#8a7528"/></linearGradient>
    <radialGradient id="oi-ink" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1a1230"/><stop offset=".35" stop-color="#2e2050"/><stop offset=".65" stop-color="#5a4a8a"/><stop offset="1" stop-color="#8f7ad0"/></radialGradient>
    <radialGradient id="oi-inkCore" cx=".4" cy=".4" r=".45"><stop offset="0" stop-color="#e0d4ff" stop-opacity=".6"/><stop offset=".5" stop-color="#7b6ab8" stop-opacity=".3"/><stop offset="1" stop-color="#241b40" stop-opacity="0"/></radialGradient>
    <radialGradient id="oi-bio" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c0e8ff"/><stop offset=".5" stop-color="#7bb8e0" stop-opacity=".6"/><stop offset="1" stop-color="#5a90b8" stop-opacity="0"/></radialGradient>
