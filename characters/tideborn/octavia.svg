    <path d="M74 61 q-1.5 2.4 0 3.3 q1.5-.9 0-3.3z"/>
    <path d="M85 55 q-1.2 1.8 0 2.5 q1.2-.7 0-2.5z"/>
    <circle cx="91" cy="49" r="1.1"/>
    <circle cx="72" cy="42" r=".8"/>
    <circle cx="87" cy="57" r=".6"/>
