  <path class="wpn" d="M77.5 47 Q79.5 46.5 80.5 48 Q81 50 79.5 51 Q78 51.5 77 50" stroke="#e2d8ff" stroke-width=".5" fill="none" stroke-linecap="round" opacity=".5"/>
