  <path d="M54 44 Q57 43 60 44.5" stroke="#9b8fd0" stroke-width="1" fill="none" stroke-linecap="round" opacity=".6"/>
  <path d="M41 87 l2.5-2 l2.5 2 M47 87 l2.5-2 l2.5 2 M55 87 l2.5-2 l2.5 2 M61 87 l1.5-1.5" stroke="#7c6a2a" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- bioluminescent body accents -->
  <circle cx="44" cy="70" r=".6" fill="#a0d8f0" opacity=".35"/><circle cx="58" cy="50" r=".5" fill="#a0d8f0" opacity=".3"/>
</svg>
