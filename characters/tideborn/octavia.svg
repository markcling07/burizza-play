  <path class="wpn" d="M70 40 Q77 35.5 85 40.5" stroke="#3b2f63" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path class="wpn" d="M87 52 Q86 59.5 77.5 60.5" stroke="#c4b0ff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/>
  <path class="wpn" d="M87 52 Q86 59.5 77.5 60.5" stroke="#3b2f63" stroke-width="1.5" fill="none" stroke-linecap="round"/>
