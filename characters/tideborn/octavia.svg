<?xml version="1.0" encoding="UTF-8"?>
<!-- Octavia Inkveil (ranged) - Ashfall Road art v2. Octopus-folk ink caster.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8a0d6"/><stop offset=".5" stop-color="#9b6aa8"/><stop offset="1" stop-color="#673f76"/></linearGradient>
    <linearGradient id="skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#875a99"/><stop offset="1" stop-color="#543163"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5d9a"/><stop offset=".55" stop-color="#4b3d6e"/><stop offset="1" stop-color="#2a2142"/></linearGradient>
    <linearGradient id="robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43375f"/><stop offset="1" stop-color="#241c38"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e9a8"/><stop offset="1" stop-color="#b09a3a"/></linearGradient>
    <radialGradient id="ink" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#241b40"/><stop offset=".65" stop-color="#5a4a8a"/><stop offset="1" stop-color="#8f7ad0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="25" ry="3.6" fill="#000" opacity=".35"/>
  <!-- ink glow -->
  <circle cx="78.5" cy="49" r="12.5" fill="#a48cf0" opacity=".6" filter="url(#glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tentacle feet -->
    <path d="M47 86 Q43 93.5 35 93.5 Q30 93.5 30.5 89.5 Q31 87.5 33 88.5 Q32.5 91 35.5 91 Q40.5 90.5 42 85 Z" fill="url(#skinD)"/>
    <path d="M54 86 Q58 93.5 66 93.5 Q71 93.5 70.5 89.5 Q70 87.5 68 88.5 Q68.5 91 65.5 91 Q60.5 90.5 59 85 Z" fill="url(#skin)"/>
    <path d="M46 88 Q49 94.5 52.5 93.5 Q55 92.5 54 88 Z" fill="url(#skinD)"/>
    <!-- back sleeve -->
    <path d="M40 45 Q34 52 34 62 L40.5 63 Q40 55 44 50 Z" fill="url(#robeD)"/>
    <circle cx="37" cy="64" r="2.7" fill="url(#skinD)"/>
    <!-- robe -->
    <path d="M39 43 Q50 39 61 43 L64.5 88.5 Q51 92 35.5 88.5 Z" fill="url(#robe)"/>
    <path d="M36 84.5 Q51 88 64.2 84.5 L64.5 88.5 Q51 92 35.5 88.5 Z" fill="url(#gold)"/>
    <rect x="38.5" y="60" width="24" height="4" rx="1" fill="url(#gold)"/>
    <!-- octopus head / mantle -->
    <path d="M44 40 Q37 37 35 29 Q32 18 39 12 Q47 7 55 9.5 Q63 12.5 64 23 Q64.5 30 62 35 Q57 40 50 41 Z" fill="url(#skin)"/>
  </g>
  <!-- tentacle beard (outline + fill strokes) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 37 Q44 45 43 49 Q42.5 52 45.5 51.5" stroke="#15121d" stroke-width="5.2"/>
    <path d="M48 37 Q44 45 43 49 Q42.5 52 45.5 51.5" stroke="#7a4d8b" stroke-width="2.4"/>
    <path d="M52 38 Q52 46 49 51 Q47.5 54.5 51 54.5" stroke="#15121d" stroke-width="5.2"/>
    <path d="M52 38 Q52 46 49 51 Q47.5 54.5 51 54.5" stroke="#8a5c9a" stroke-width="2.4"/>
    <path d="M56 38 Q58 47 55 53 Q54 56.5 57.5 55.5" stroke="#15121d" stroke-width="5.2"/>
    <path d="M56 38 Q58 47 55 53 Q54 56.5 57.5 55.5" stroke="#9b6aa8" stroke-width="2.4"/>
    <path d="M60 36 Q65 43 62 49 Q61 52 64 51.5" stroke="#15121d" stroke-width="5.2"/>
    <path d="M60 36 Q65 43 62 49 Q61 52 64 51.5" stroke="#a979b6" stroke-width="2.4"/>
  </g>
  <g fill="#ecd3f2"><circle cx="58" cy="46" r=".7"/><circle cx="56.8" cy="50" r=".7"/><circle cx="63.6" cy="44" r=".7"/><circle cx="63.4" cy="47.5" r=".7"/><circle cx="51.6" cy="47" r=".6"/></g>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- front sleeve reaching to the orb -->
    <path d="M55 44 Q63 43.5 70 47 L68.5 53 Q62 51.5 56 53 Z" fill="url(#robe)"/>
    <path d="M66.2 45.6 L70 47 L68.5 53 L64.8 52.2 Z" fill="url(#gold)"/>
    <circle cx="71" cy="50.3" r="2.8" fill="url(#skin)"/>
    <!-- ink orb -->
    <circle cx="78.5" cy="49" r="6.5" fill="url(#ink)"/>
  </g>
  <!-- orb rim + swirl -->
  <circle cx="78.5" cy="49" r="5.1" fill="none" stroke="#c4b0ff" stroke-width="1" opacity=".85"/>
  <path d="M76 49.5 Q76 46 79 46 Q82 46.5 81.5 49.5 Q81 52 78.5 51.5 Q77 51 77.6 49.5" stroke="#e2d8ff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- swirling ink -->
  <path d="M70 40 Q77 36 84.5 41" stroke="#c4b0ff" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M70 40 Q77 36 84.5 41" stroke="#3b2f63" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M87 52 Q86 59 78 60" stroke="#c4b0ff" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M87 52 Q86 59 78 60" stroke="#3b2f63" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <g fill="#5a4a8a" stroke="#c4b0ff" stroke-width=".8">
    <path d="M89 42 q-1.8 2.8 0 3.9 q1.8 -1.1 0 -3.9 z"/>
    <path d="M74 61 q-1.5 2.4 0 3.3 q1.5 -.9 0 -3.3 z"/>
    <circle cx="91" cy="49" r="1.1"/>
  </g>
  <!-- mantle spots + highlight -->
  <g fill="#6a4378" opacity=".75"><circle cx="42" cy="21" r="2.4"/><circle cx="48.5" cy="14.5" r="1.8"/><circle cx="40" cy="29" r="1.6"/><circle cx="55" cy="13.5" r="1.2"/></g>
  <path d="M39.5 17 Q43 12 48.5 10.8" stroke="#fff" stroke-width="1.3" fill="none" opacity=".75" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="57.5" cy="26.5" r="3.2" fill="url(#gold)" stroke="#15121d" stroke-width="1.1"/>
  <rect x="55" y="25.9" width="5" height="1.6" rx=".8" fill="#15121d"/>
  <path d="M53.5 25.3 Q57.5 21 61.8 25.3 Q57.5 23.6 53.5 25.3 Z" fill="url(#skinD)" stroke="#15121d" stroke-width="1" stroke-linejoin="round"/>
  <!-- robe trim -->
  <path d="M50.5 64 L51.3 87" stroke="url(#gold)" stroke-width="1.6"/>
  <path d="M42 46 Q44 44 47 43.5" stroke="#9b8fd0" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M41 87 l2.5 -2 l2.5 2 M55 87 l2.5 -2 l2.5 2" stroke="#7c6a2a" stroke-width=".9" fill="none" stroke-linecap="round"/>
</svg>
