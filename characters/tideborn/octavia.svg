  <path class="wpn" d="M83 44 Q86 42 87 44.5" stroke="#5a4a8a" stroke-width="1" fill="none" stroke-linecap="round" opacity=".6"/>
  <g class="wpn" fill="#5a4a8a" stroke="#c4b0ff" stroke-width=".7">
