    <path d="M45 21 Q33 26 35 42 Q34 54 26 64 Q37 66 43 57 Q47 49 47 40 L52 26 Z" fill="url(#sw-hair)"/>
    <path d="M44 22 Q30 30 32 48 Q30 58 24 66 Q27 67 30 63 Q33 55 34 45 Q35 33 45 25 Z" fill="url(#sw-hair)" opacity=".7"/>
