    <circle cx="35" cy="57.8" r=".7" fill="#f7e8d0"/>
    <!-- mermaid gown + iridescent shimmer -->
    <path d="M40 43 Q50 39 60 43 L60.5 64 Q60 76 64 84 Q70 89 73 93.5 Q63 92 56 93.5 Q48 92 42 93.5 Q35 92 28 93 Q33 88 37 84 Q41 76 40 64 Z" fill="url(#sw-dress)"/>
    <path d="M40 43 Q50 39 60 43 L60.5 64 Q60 76 64 84 Q70 89 73 93.5 Q63 92 56 93.5 Q48 92 42 93.5 Q35 92 28 93 Q33 88 37 84 Q41 76 40 64 Z" fill="url(#sw-shimmer)"/>
