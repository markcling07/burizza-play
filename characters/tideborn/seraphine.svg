    <rect x="39.6" y="59.5" width="21.2" height="3.4" rx="1" fill="url(#sw-pale)"/>
    <circle cx="50.2" cy="61.2" r="1.7" fill="#f2c6d8" stroke="#d4b896" stroke-width=".5"/>
    <path d="M49 61.2 Q50.2 60 51.4 61.2 Q50.2 60.5 49 61.2" fill="#fce0eb" opacity=".6"/>
    <path d="M50.5 63 L51 84" stroke="#e9e4d8" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
    <!-- head -->
    <path d="M48 36 h7 v8 h-7 z" fill="url(#sw-skin)"/>
    <circle cx="52" cy="30" r="9" fill="url(#sw-skin)"/>
    <path d="M42 33 Q40 18.5 52 18.5 Q62 18.5 62.3 27 Q57 22.5 51 24.5 Q47.5 26 47.5 33 Q46.5 39 43.5 40.5 Z" fill="url(#sw-hair)"/>
    <path d="M55 22 Q58 23.5 60 26" stroke="#5f95d8" stroke-width="1" fill="none" opacity=".5"/>
