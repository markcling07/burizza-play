<?xml version="1.0" encoding="UTF-8"?>
<!-- Seraphine Wavecaller (ranged) - Ashfall Road art v2. Siren whose song drowns sailors.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="69.5,47.3">
  <defs>
    <linearGradient id="sw-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdeee8"/><stop offset=".5" stop-color="#9fd0c8"/><stop offset="1" stop-color="#6da59c"/></linearGradient>
    <linearGradient id="sw-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86b9b1"/><stop offset="1" stop-color="#55877f"/></linearGradient>
    <linearGradient id="sw-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f95d8"/><stop offset=".5" stop-color="#3d6fb0"/><stop offset="1" stop-color="#22426f"/></linearGradient>
    <linearGradient id="sw-hairHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc4f0"/><stop offset="1" stop-color="#5f95d8" stop-opacity="0"/></linearGradient>
    <linearGradient id="sw-dress" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43a6b4"/><stop offset=".55" stop-color="#2a7f8f"/><stop offset="1" stop-color="#16505d"/></linearGradient>
    <linearGradient id="sw-shimmer" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#6dd4d8" stop-opacity=".4"/><stop offset=".5" stop-color="#43a6b4" stop-opacity="0"/><stop offset="1" stop-color="#8ee4d0" stop-opacity=".3"/></linearGradient>
    <linearGradient id="sw-fin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a7f8f"/><stop offset="1" stop-color="#16505d" stop-opacity=".6"/></linearGradient>
    <linearGradient id="sw-pale" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9e4d8"/><stop offset="1" stop-color="#b6ae9a"/></linearGradient>
    <radialGradient id="sw-orb" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#fce0eb"/><stop offset=".7" stop-color="#f2c6d8"/><stop offset="1" stop-color="#d887ad"/></radialGradient>
    <radialGradient id="sw-orbCore" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9ec2" stop-opacity=".8"/><stop offset="1" stop-color="#d887ad" stop-opacity="0"/></radialGradient>
    <linearGradient id="sw-earFin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e4d8" stop-opacity=".8"/><stop offset="1" stop-color="#c8f0e8" stop-opacity=".4"/></linearGradient>
    <linearGradient id="sw-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e8d0"/><stop offset="1" stop-color="#d4b896"/></linearGradient>
    <filter id="sw-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="sw-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="sw-ambient" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <!-- ground shadow + ambient water-light aura -->
