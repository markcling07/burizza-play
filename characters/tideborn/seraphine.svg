    <path d="M48 28.5 L37 22.5 L39.5 28 L34.5 31 L39 33.5 L35.5 37.5 L48 34 Z" fill="url(#sw-earFin)"/>
    <path d="M48 29 L40 24.5 L41 28 L36.5 31 L40.5 33 L37.5 36 L48 33.5 Z" fill="#c8f0e8" opacity=".2"/>
    <path d="M47.5 29.5 L39 25 M47 31 L36.5 31 M47 32.8 L38 36" stroke="#b6ae9a" stroke-width=".7" fill="none" stroke-linecap="round"/>
    <path d="M47.5 30.2 L41 27 M47 32 L38 33.5" stroke="#c8e0d8" stroke-width=".4" fill="none" stroke-linecap="round" opacity=".5"/>
    <!-- front arm + coral ring -->
    <path d="M55 45 Q62 43 69 44.5 L68.5 50 Q61 50 56 52 Z" fill="url(#sw-skin)"/>
    <circle cx="69.5" cy="47.3" r="2.8" fill="url(#sw-skin)"/>
    <circle cx="69.5" cy="47.3" r="3.2" fill="none" stroke="#d4b896" stroke-width=".6" opacity=".7"/>
    <!-- siren orb -->
    <circle class="wpn" cx="77.5" cy="45" r="7.8" fill="none" stroke="#f2c6d8" stroke-width=".5" opacity=".35"/>
    <circle class="wpn" cx="77.5" cy="45" r="6.2" fill="url(#sw-orb)"/>
    <circle class="wpn" cx="77" cy="44" r="3" fill="url(#sw-orbCore)"/>
    <path class="wpn" d="M75 43 Q77 41 79 43.5" stroke="#fff" stroke-width=".5" fill="none" opacity=".6"/>
    <path class="wpn" d="M76 46 Q78 44.5 80 46" stroke="#fce0eb" stroke-width=".4" fill="none" opacity=".5"/>
  </g>
  <!-- fin hem rays -->
  <path d="M37 84 L31 92.5 M34 86 L29 93" stroke="url(#sw-fin)" stroke-width=".8" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M38 86 L32.5 92 M41 86 L38 93" stroke="#16505d" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M44 86.5 L42.5 92.5 M48 86.5 L47 93 M51 86.5 L51.5 92.5 M54 86 L55.5 93" stroke="#16505d" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M57.5 86 L60 92 M62 84.5 L68 91.5 M65 84 L71.5 92" stroke="#16505d" stroke-width="1" fill="none" stroke-linecap="round"/>
