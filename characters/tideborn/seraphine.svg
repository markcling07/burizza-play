    <path d="M43 55 Q46 53 49 55 Q52 53 55 55 Q58 53 60 55" stroke="#5bc4c8" stroke-width=".5" fill="none" opacity=".35"/>
    <path d="M41.5 61 Q44.5 59 47.5 61 Q50.5 59 53.5 61 Q56.5 59 59.5 61" stroke="#5bc4c8" stroke-width=".5" fill="none" opacity=".3"/>
    <path d="M40.5 67 Q43.5 65 46.5 67 Q49.5 65 52.5 67 Q55.5 65 58.5 67 Q61 65.5 62 67" stroke="#5bc4c8" stroke-width=".5" fill="none" opacity=".25"/>
    <path d="M39 73 Q42 71 45 73 Q48 71 51 73 Q54 71 57 73 Q60 71.5 63 73" stroke="#5bc4c8" stroke-width=".45" fill="none" opacity=".2"/>
    <path d="M37 80 Q40 78 43 80 Q46 78 49 80 Q52 78 55 80 Q58 78 61 80 Q64 78.5 66 80" stroke="#5bc4c8" stroke-width=".4" fill="none" opacity=".15"/>
