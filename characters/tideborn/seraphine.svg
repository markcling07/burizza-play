  <path d="M31 92.5 Q36 90 42.5 92.5 M47 93 Q51 91 55.5 93 M60 92 Q64 89 71.5 92" stroke="#43a6b4" stroke-width=".5" fill="none" opacity=".3"/>
  <!-- coral ankle chain -->
  <path d="M39 85 Q43 83.5 47 85 Q51 83.5 55 85" stroke="#d4b896" stroke-width=".6" fill="none" opacity=".6"/>
  <circle cx="43" cy="84.2" r=".5" fill="#f7e8d0" opacity=".7"/><circle cx="49" cy="84.2" r=".5" fill="#f2c6d8" opacity=".7"/>
  <!-- starfish hair clip -->
  <path d="M47 18.5 l1 2.4 l2.6 .2 l-2 1.7 l.7 2.5 l-2.3 -1.4 l-2.3 1.4 l.7 -2.5 l-2 -1.7 l2.6 -.2 z" fill="#f2a6c0" stroke="#d8879f" stroke-width=".5" stroke-linejoin="round"/>
  <circle cx="47" cy="20.5" r=".6" fill="#d8879f"/>
  <path d="M47 18.8 L47 19.8 M48.8 20.6 L48 20.5 M46.5 22.6 L46.8 21.8 M44.8 20.3 L45.7 20.4 M47.5 19.2 L47.8 20" stroke="#d8879f" stroke-width=".35" fill="none" opacity=".6"/>
  <!-- face: singing expression -->
  <circle cx="57.3" cy="29.3" r="1.4" fill="#1d2130"/>
  <circle cx="57.7" cy="28.9" r=".4" fill="#fff" opacity=".8"/>
  <path d="M55.3 26.6 q2 -1 4 .1" stroke="#22426f" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M55.5 28.5 L54.5 27.8 M56 28 L55.5 27" stroke="#22426f" stroke-width=".5" fill="none" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="59.6" cy="35" rx="1.2" ry="1.6" fill="#5a2340"/>
  <path d="M58.6 34 Q59.6 33.5 60.6 34" stroke="#d887ad" stroke-width=".4" fill="none"/>
  <circle cx="57" cy="32.6" r="1.3" fill="#f2a6c0" opacity=".55"/>
  <circle cx="56.5" cy="33" r=".8" fill="#f2a6c0" opacity=".3"/>
  <!-- highlights -->
  <path d="M44.5 23.5 Q47 20 52 19.6" stroke="#fff" stroke-width="1.2" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M43 27 Q45 23 49 21.5" stroke="#8fc4f0" stroke-width=".8" fill="none" opacity=".4" stroke-linecap="round"/>
  <path d="M42 51 Q42.5 47.5 45 46.5" stroke="#fff" stroke-width="1.2" fill="none" opacity=".6" stroke-linecap="round"/>
  <!-- orb specular highlights -->
  <circle class="wpn" cx="75.6" cy="43" r="1.5" fill="#fff" opacity=".9"/>
  <circle class="wpn" cx="76.5" cy="42.5" r=".6" fill="#fff" opacity=".6"/>
  <!-- song ripples from orb -->
  <path class="wpn" d="M86.5 37 Q90.5 45 86.5 53" stroke="#f2c6d8" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".9"/>
  <path class="wpn" d="M91 33 Q97 45 91 57" stroke="#f2c6d8" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".7"/>
  <path class="wpn" d="M94 30 Q101 45 94 60" stroke="#fce0eb" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".4"/>
  <!-- vocal ripples from singing -->
  <path d="M63.5 32 q2 3 0 6" stroke="#f2c6d8" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M66.3 30.5 q3 4.5 0 9" stroke="#f2c6d8" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M68.5 29 q3.5 5.5 0 11" stroke="#fce0eb" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".45"/>
  <!-- music notes -->
  <g class="wpn" fill="#f2c6d8" stroke="none" stroke-linejoin="round">
    <ellipse cx="70" cy="24" rx="2.2" ry="1.6" transform="rotate(-20 70 24)"/>
    <path d="M71.6 23.4 V15.5 q3.5 1 3.8 4.6 q-1.6 -1.8 -2.6 -1.6 V23.4 Z"/>
    <ellipse cx="83" cy="27" rx="1.7" ry="1.25" transform="rotate(-20 83 27)"/>
    <path d="M84.2 26.6 V21 h1 V26.6 Z"/>
  </g>
  <!-- smaller harmonic notes -->
  <g class="wpn" fill="#f2c6d8" opacity=".6"><ellipse cx="88" cy="38" rx="1.2" ry=".9" transform="rotate(-15 88 38)"/><path d="M88.9 37.7 V34 h.7 V37.7 Z"/></g>
  <g class="wpn" fill="#fce0eb" opacity=".45"><ellipse cx="76" cy="18" rx="1" ry=".7" transform="rotate(-25 76 18)"/><path d="M76.7 17.7 V15 h.6 V17.7 Z"/></g>
  <!-- ambient sparkles -->
  <circle cx="30" cy="50" r=".6" fill="#8fc4f0" opacity=".4"/><circle cx="25" cy="62" r=".5" fill="#c8f0e8" opacity=".35"/>
  <circle cx="72" cy="60" r=".5" fill="#f2c6d8" opacity=".4"/><circle cx="65" cy="72" r=".4" fill="#8fc4f0" opacity=".3"/>
</svg>
