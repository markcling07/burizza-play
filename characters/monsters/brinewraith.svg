<?xml version="1.0" encoding="UTF-8"?>
<!-- Brine Wraith (monster) - Ashfall Road art v2. A drowned sailor: knit watch cap, torn striped jersey,
     a coil of wet rope, salt water pouring from his singing mouth, a twist of sea for legs. Floats.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="bw-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcecef"/><stop offset=".5" stop-color="#9fb9c6"/><stop offset="1" stop-color="#5f7a8c"/></linearGradient>
    <linearGradient id="bw-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f9bb0"/><stop offset="1" stop-color="#465e70"/></linearGradient>
    <linearGradient id="bw-shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46667c"/><stop offset=".5" stop-color="#2f4a5e"/><stop offset="1" stop-color="#18293a"/></linearGradient>
    <linearGradient id="bw-shirtD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4254"/><stop offset="1" stop-color="#132130"/></linearGradient>
    <linearGradient id="bw-stripe" gradientUnits="userSpaceOnUse" x1="42" y1="38" x2="66" y2="66"><stop offset="0" stop-color="#e8f8f4"/><stop offset=".5" stop-color="#a9e6dd"/><stop offset="1" stop-color="#5f9a98"/></linearGradient>
    <linearGradient id="bw-cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0605a"/><stop offset=".5" stop-color="#6e3834"/><stop offset="1" stop-color="#42201f"/></linearGradient>
    <linearGradient id="bw-rope" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9b994"/><stop offset=".5" stop-color="#92825f"/><stop offset="1" stop-color="#5a4f3c"/></linearGradient>
    <linearGradient id="bw-weed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a8a44"/><stop offset="1" stop-color="#26421f"/></linearGradient>
    <linearGradient id="bw-tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f6a80" stop-opacity=".95"/><stop offset=".55" stop-color="#4f8ea0" stop-opacity=".75"/><stop offset="1" stop-color="#a9e6dd" stop-opacity=".15"/></linearGradient>
