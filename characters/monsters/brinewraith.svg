    <path d="M61 34.6 Q63 33.4 65.2 34.6" stroke="#5f7a8c" stroke-width=".6" fill="none" opacity=".8"/>
    <path d="M61 36.4 Q62.6 39.2 65.4 38 Q67.6 44 67.2 50 Q67 56 68.8 62.6 L65 63.2 Q63 56.6 63.4 50 Q63.6 43.6 61 36.4 Z" fill="url(#bw-water)"/>
    <path d="M63.2 38.4 Q64.6 43.6 64.4 49 M66 40 Q67 44 66.4 48" stroke="#fff" stroke-width=".55" fill="none" opacity=".65"/>
    <g fill="#d6faf3" opacity=".75"><circle cx="68.6" cy="64.4" r=".7"/><circle cx="64.4" cy="65.6" r=".55"/><circle cx="70.6" cy="62" r=".45"/><circle cx="66.6" cy="67.6" r=".5"/></g>
