    <path d="M59 41.4 Q65.6 40 69 44.6 Q71.4 47.6 71.6 50.4 L70 49.6 L69.2 51.6 L67.8 50.6 L66.6 52.2 Q65.2 48.6 62 46.6 Z" fill="url(#bw-shirt)"/>
    <g clip-path="url(#bw-sleeveClip)">
      <path d="M58 43 L72 41 M58 46.4 L72 44.4 M58 49.8 L72 47.8" stroke="url(#bw-stripe)" stroke-width="1.5" fill="none" stroke-linecap="butt"/>
    </g>
    <path d="M67.6 48.6 Q73 46 78 44 L79.4 47.6 Q74.2 50 69.2 52.4 Z" fill="url(#bw-skin)"/>
    <path d="M72.4 47.2 v2.2 M71.6 48 h1.6 M71.4 49.2 q1 .8 2 0" stroke="#2f4a5e" stroke-width=".45" fill="none" opacity=".85"/>
    <path d="M77.4 43.4 Q81 42 83.6 43.6 Q84.4 46 82 47.8 Q79.4 48.6 78 47.6 Z" fill="url(#bw-skin)"/>
    <path d="M83 43.4 Q86 41.6 88.4 42.2 M83.8 45.2 Q87 44.8 89 46.2 M82.6 47.2 Q85 48.6 86.4 50.6" stroke="#9fb9c6" stroke-width="1.3" fill="none"/>
    <path d="M80 48.4 q.4 2.4 -.2 4.4 M84 50.6 q.6 2 0 3.6" stroke="url(#bw-water)" stroke-width=".8" fill="none"/>
    <path d="M60.4 41 Q65 40.6 68.4 44" stroke="#fff" stroke-width=".7" fill="none" opacity=".35"/>
    <path d="M62.4 41.4 Q66 45 65.4 50" stroke="url(#bw-weed)" stroke-width="1.2" fill="none"/>
    <path d="M55.4 23.6 Q58.6 21.8 62.6 21.6" stroke="#fff" stroke-width=".7" fill="none" opacity=".3"/>
  </g>
