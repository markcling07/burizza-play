    <ellipse cx="64.6" cy="28.2" rx="2.4" ry="2.1" fill="#1d3442"/>
    <circle cx="58.8" cy="28.6" r="2.8" fill="url(#bw-eye)"/>
    <circle cx="64.6" cy="28.2" r="3.1" fill="url(#bw-eye)"/>
    <circle cx="58.9" cy="28.6" r=".8" fill="#f2fffc"/><circle cx="64.7" cy="28.2" r=".9" fill="#f2fffc"/>
    <path d="M56.8 25.8 Q58.8 25 60.6 25.8 M62.6 25.4 Q64.8 24.6 66.8 25.6" stroke="#465e70" stroke-width=".8" fill="none"/>
