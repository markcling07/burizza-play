    <path d="M53.2 23 Q52.6 14.8 59.4 13.8 Q66.4 13.4 68.4 21.8 Q60.6 19.8 53.2 23 Z" fill="url(#bw-cap)"/>
    <path d="M52.4 25.8 Q60.4 22.4 69.2 24.8 L68.8 21.4 Q60.4 18.8 52.6 22.2 Z" fill="#7e423d"/>
    <path d="M54.6 22 v2.8 M56.8 21.2 v2.8 M59 20.6 v2.8 M61.2 20.4 v2.8 M63.4 20.6 v2.8 M65.6 21 v2.8 M67.6 21.6 v2.6" stroke="#42201f" stroke-width=".55" opacity=".75"/>
    <path d="M55 18.8 Q56.6 15.4 60.4 14.8" stroke="#fff" stroke-width=".7" fill="none" opacity=".35"/>
