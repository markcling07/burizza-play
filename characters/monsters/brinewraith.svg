    <radialGradient id="bw-aura" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#a9e6dd" stop-opacity=".22"/><stop offset="1" stop-color="#a9e6dd" stop-opacity="0"/></radialGradient>
    <clipPath id="bw-torsoClip"><path d="M43 41 Q52 36.6 63 40 Q66 46 65 54 Q64.4 59 64.6 63 L61.6 61.4 L60 65.4 L57 62 L54.4 66.6 L51.6 62.4 L48.6 65.4 L46.4 61.6 L43.6 64.4 L41.4 61 Q40 51 43 41 Z"/></clipPath>
