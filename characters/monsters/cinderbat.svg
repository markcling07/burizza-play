<!-- Cinder Bat (monster) - Ashfall Road art v2. A roof-nesting cave bat diving on a screech: wings
     spread wide, their edges smouldering and burnt through in holes, sparks trailing, jaws wide open.
     It hovers in the upper middle; its shadow is far below.
     Canvas 100x100, faces right, feet on y=94. -->
