  <defs>
    <linearGradient id="cb-fur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6679"/><stop offset=".5" stop-color="#4f3746"/><stop offset="1" stop-color="#2a1d25"/></linearGradient>
    <linearGradient id="cb-furD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#45323d"/><stop offset="1" stop-color="#1d1419"/></linearGradient>
    <linearGradient id="cb-wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#755466"/><stop offset=".5" stop-color="#47323f"/><stop offset="1" stop-color="#2b1e27"/></linearGradient>
    <linearGradient id="cb-wingD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d2c37"/><stop offset=".5" stop-color="#2c1f28"/><stop offset="1" stop-color="#170f14"/></linearGradient>
    <linearGradient id="cb-smoulder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity="0"/><stop offset="1" stop-color="#ff6a2a" stop-opacity=".45"/></linearGradient>
    <linearGradient id="cb-fang" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ea"/><stop offset=".5" stop-color="#eadfcc"/><stop offset="1" stop-color="#b9aa94"/></linearGradient>
    <radialGradient id="cb-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4d0"/><stop offset=".45" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="cb-maw" cx=".35" cy=".4" r=".7"><stop offset="0" stop-color="#9a2a22"/><stop offset="1" stop-color="#2a0a0c"/></radialGradient>
    <radialGradient id="cb-spark" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff0c4"/><stop offset=".4" stop-color="#ffb35a"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
