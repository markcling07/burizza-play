    <linearGradient id="lh-glove" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5468"/><stop offset=".5" stop-color="#2a2230"/><stop offset="1" stop-color="#100c14"/></linearGradient>
