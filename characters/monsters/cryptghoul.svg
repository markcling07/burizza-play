<?xml version="1.0" encoding="UTF-8"?>
<!-- Crypt Ghoul (monster) - Ashfall Road art v2. Hunched, starved grave-eater: long clawed arms,
     burial rags, a jaw that opens too far, eyes like marsh-lights.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="cg-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c4a6"/><stop offset=".5" stop-color="#7f8b6f"/><stop offset="1" stop-color="#4c5543"/></linearGradient>
    <linearGradient id="cg-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66715a"/><stop offset="1" stop-color="#363d30"/></linearGradient>
    <linearGradient id="cg-skinH" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#dfe6cc"/><stop offset="1" stop-color="#9aa686" stop-opacity="0"/></linearGradient>
    <linearGradient id="cg-rag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5246"/><stop offset=".55" stop-color="#3f362e"/><stop offset="1" stop-color="#26201b"/></linearGradient>
    <linearGradient id="cg-ragD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3129"/><stop offset="1" stop-color="#1e1915"/></linearGradient>
    <linearGradient id="cg-nail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2ead2"/><stop offset="1" stop-color="#a99e82"/></linearGradient>
    <radialGradient id="cg-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fbffd6"/><stop offset=".45" stop-color="#d9ef5a"/><stop offset="1" stop-color="#d9ef5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="cg-maw" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#5a1f22"/><stop offset="1" stop-color="#1c0d0e"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="25" ry="3.6" fill="#000" opacity=".38"/>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- back arm: hangs low, knuckles near the floor -->
    <path d="M47 46 Q39 54 37 64 Q36 70 35.5 75 L39.5 76 Q40.5 69 42.5 63 Q45.5 55 51 50 Z" fill="url(#cg-skinD)"/>
    <path d="M40 60 Q38.5 65 38 70" stroke="#2c3226" stroke-width=".6" fill="none" opacity=".6"/>
    <path d="M35 74.5 Q33 78 31.5 82 M37 76 Q36 80 35.5 84.5 M39 76 Q39.5 80 40 84" stroke="url(#cg-nail)" stroke-width="1.3" fill="none"/>
    <!-- back leg: bent, splayed toes -->
    <path d="M43 70 Q38.5 76 40 82 Q40.5 86 40 91 L45 91.5 Q45 85 46 80 Q47.5 75 48.5 71 Z" fill="url(#cg-skinD)"/>
    <path d="M37.5 92.5 Q41 90 46.5 91 L47 93.5 Q41 94.2 37.5 93.6 Z" fill="#363d30"/>
    <path d="M37.5 93 L35.5 93.6 M40 93.3 L38.6 94.2" stroke="url(#cg-nail)" stroke-width=".9"/>
    <!-- burial rags hanging off the hips -->
    <path d="M40 66 Q48 63 58 66 L60 76 L56.5 73 L55 79 L51.5 74.5 L49 80.5 L46.5 74.5 L43 79 L42 73 L38.5 76 Z" fill="url(#cg-rag)"/>
    <path d="M44 68 L45 74 M50 67.5 L50.5 74 M55 68 L54.5 73" stroke="#211b16" stroke-width=".5" opacity=".6"/>
    <!-- hunched torso, spine curving up into the shoulders -->
    <path d="M41 68 Q37 57 43 48 Q49 40 59 40.5 Q66 41.5 67 48 Q66.5 56 61 62 Q58 66.5 58.5 69 Q50 70.5 41 68 Z" fill="url(#cg-skin)"/>
    <path d="M43 50 Q47 44.5 54 42.5" stroke="url(#cg-skinH)" stroke-width="2.4" fill="none" opacity=".75"/>
    <!-- spine knuckles along the back -->
    <g fill="#9ba88a" opacity=".9">
      <circle cx="44.5" cy="48.5" r="1.3"/><circle cx="42.5" cy="52.5" r="1.3"/><circle cx="41.5" cy="56.8" r="1.2"/><circle cx="41.4" cy="61" r="1.1"/>
    </g>
    <!-- ribs showing through -->
    <path d="M51 52 Q56 50.5 61 53 M50 56 Q55 54.5 60 57 M49.5 60 Q54 59 58.5 61" stroke="#4c5543" stroke-width=".9" fill="none" opacity=".8"/>
    <path d="M51 51.3 Q55.5 50 60 52" stroke="#d7e0c3" stroke-width=".5" fill="none" opacity=".55"/>
    <!-- shredded shroud over the shoulders -->
    <path d="M44 47 Q52 39 62 41.5 L60.5 46 L57.5 44.5 L55.5 49 L52.5 45.5 L49.5 50.5 L48 46.5 L44.5 50 Z" fill="url(#cg-ragD)" opacity=".95"/>
    <!-- front leg -->
    <path d="M52 69 Q56.5 74 58.5 80 Q59.5 85 60 91 L55 91.5 Q54.5 86 53 81.5 Q50.5 76 49 71 Z" fill="url(#cg-skin)"/>
    <path d="M55.5 76 Q57 79 57.5 82" stroke="#4c5543" stroke-width=".6" fill="none" opacity=".6"/>
    <path d="M53 91 Q58 89.5 64 91.2 L64.5 93.8 Q58 94.6 53 93.8 Z" fill="#5d6852"/>
    <path d="M64 92 L66.5 92.8 M63.5 93.3 L65.8 94.3" stroke="url(#cg-nail)" stroke-width=".9"/>
    <!-- neck craned forward -->
    <path d="M60 44 Q65 40 70 41.5 L71 47.5 Q66 47 62 50 Z" fill="url(#cg-skinD)"/>
    <path d="M63 44.5 L66.5 46.5 M65.5 43 L69 45" stroke="#2c3226" stroke-width=".55" opacity=".55"/>
    <!-- head: long skull, sunken cheek -->
    <path d="M65 37 Q66 28.5 74 27.5 Q82 27 84 33.5 Q85 37.5 83.5 40.5 L80 43 Q75 46 69.5 44.5 Q65 42 65 37 Z" fill="url(#cg-skin)"/>
    <path d="M67.5 32.5 Q70 29 75 28.6" stroke="url(#cg-skinH)" stroke-width="2" fill="none" opacity=".8"/>
    <path d="M73 38.5 Q76 41 79.5 40" stroke="#4c5543" stroke-width=".8" fill="none" opacity=".7"/>
    <!-- lank hair -->
    <path d="M67 30 Q63 33 62 39 M69.5 28.5 Q65.5 33.5 66 40 M72.5 27.8 Q70 31 70.5 35" stroke="#2a2621" stroke-width=".8" fill="none" opacity=".85"/>
    <!-- ear -->
    <path d="M68 34.5 Q65.8 33 64.8 35.6 Q66 37.6 68.4 37" fill="#66715a"/>
    <!-- brow ridge and marsh-light eye -->
    <path d="M74.5 31.6 Q78.5 30 82.3 32" stroke="#454d40" stroke-width="1.3" fill="none"/>
    <circle cx="79" cy="34" r="3.6" fill="url(#cg-eye)"/>
    <circle cx="79.2" cy="34" r="1.25" fill="#f8ffc6"/>
    <!-- the jaw, hanging open -->
    <path d="M76.5 40 Q82 39 86.5 42 Q86 46.5 81 48.5 Q76 49 73.5 45.5 Z" fill="url(#cg-maw)"/>
    <path d="M76.5 40 Q82 39 86.5 42 Q86 46.5 81 48.5 Q76 49 73.5 45.5" stroke="#454d40" stroke-width="1.2" fill="none"/>
    <path d="M77 40.4 L77.8 42.6 L78.6 40.2 L79.6 42.7 L80.5 40.1 L81.5 42.6 L82.4 40.4 L83.3 42.6 L84.2 41" fill="#ece5cc"/>
    <path d="M76 46.5 L77 44.6 L78 46.9 L79.2 44.9 L80.3 47.3 L81.5 45.2 L82.6 46.8" fill="#ddd5bb"/>
    <path d="M80.5 48 Q81 51 80 53.5" stroke="#9a3b3f" stroke-width=".8" fill="none" opacity=".75"/>
    <!-- front arm reaching for the mark, claws spread -->
    <path d="M60.5 47 Q68 52 72 58 L77 61 L75.6 64.5 L70 62 Q64.5 57.5 58 54 Z" fill="url(#cg-skin)"/>
    <path d="M62.5 51 Q66.5 54 69.5 58" stroke="#4c5543" stroke-width=".7" fill="none" opacity=".6"/>
    <circle cx="70.6" cy="59.6" r="2.2" fill="#7f8b6f"/>
    <path d="M75.5 60.5 Q79.5 60.5 81.5 62.5 Q80 65.5 76.5 65.5 Z" fill="url(#cg-skin)"/>
    <path d="M80.5 60.8 Q84.5 58.6 88 59.5 M81.6 62.6 Q85.8 62 89 64 M80.5 64.6 Q83.8 66 86 68.5" stroke="url(#cg-nail)" stroke-width="1.35" fill="none"/>
    <path d="M77.5 65 Q78.5 68 78 70.5" stroke="url(#cg-nail)" stroke-width="1.1" fill="none"/>
    <!-- grave dirt on the shin -->
    <path d="M56.5 85 q1.5 1 3 .5 M55.8 88 q1.8 .9 3.4 .4" stroke="#3a3128" stroke-width=".8" opacity=".6"/>
  </g>
</svg>
