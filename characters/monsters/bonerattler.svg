    <radialGradient id="br-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4cc"/><stop offset=".45" stop-color="#ffb84d"/><stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/></radialGradient>
