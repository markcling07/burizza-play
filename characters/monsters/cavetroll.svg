    <path d="M64.4 31 Q64 23.4 70.6 22 Q77.4 21 80.4 26.4 L81.6 30.6 Q84.6 32 84 35.4 Q82.6 37.4 80.2 37 L74 38 Q68 39.4 65.6 36 Q64.6 34 64.4 31 Z" fill="url(#ct-skin)"/>
    <path d="M66.4 27 Q67.6 23.6 71.4 22.6" stroke="#fff" stroke-width=".9" fill="none" opacity=".5"/>
