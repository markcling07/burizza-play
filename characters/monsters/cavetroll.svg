<?xml version="1.0" encoding="UTF-8"?>
<!-- Cave Troll (monster) - Ashfall Road art v2. A hulking grey-green troll, head sunk low between
     mossy shoulders: tiny eyes, a tusked underbite, a pot belly over a hide loincloth, a broken
     stalactite for a club, and a fresh wound already knitting shut in green light.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="ct-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3b08a"/><stop offset=".5" stop-color="#6d7a5a"/><stop offset="1" stop-color="#424b35"/></linearGradient>
    <linearGradient id="ct-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c684b"/><stop offset="1" stop-color="#30382a"/></linearGradient>
    <linearGradient id="ct-belly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c49e"/><stop offset=".5" stop-color="#85916c"/><stop offset="1" stop-color="#525c41"/></linearGradient>
    <linearGradient id="ct-hide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ad7d4c"/><stop offset=".5" stop-color="#8a5a32"/><stop offset="1" stop-color="#55341b"/></linearGradient>
    <linearGradient id="ct-hideD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4426"/><stop offset="1" stop-color="#3a2413"/></linearGradient>
    <linearGradient id="ct-stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6cab0"/><stop offset=".5" stop-color="#a39478"/><stop offset="1" stop-color="#635845"/></linearGradient>
    <linearGradient id="ct-moss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8c454"/><stop offset=".6" stop-color="#6e8c30"/><stop offset="1" stop-color="#46601e"/></linearGradient>
    <linearGradient id="ct-tusk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf4de"/><stop offset=".5" stop-color="#e6dcbf"/><stop offset="1" stop-color="#b3a684"/></linearGradient>
    <radialGradient id="ct-regen" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d6ffc0" stop-opacity=".9"/><stop offset=".45" stop-color="#7ee86a" stop-opacity=".45"/><stop offset="1" stop-color="#7ee86a" stop-opacity="0"/></radialGradient>
    <radialGradient id="ct-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c0"/><stop offset=".5" stop-color="#f0c840"/><stop offset="1" stop-color="#f0c840" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="30" ry="4" fill="#000" opacity=".4"/>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- back arm, hanging long, knuckles near the floor -->
    <path d="M40 30 Q28 34 24 48 Q20.6 60 20.6 74 L27.4 75.6 Q27.4 64 29.6 54 Q32 44 41 39 Z" fill="url(#ct-skinD)"/>
    <path d="M26.6 50 Q24.4 57 24 64 M29 44 Q26.6 47 25.6 51" stroke="#2a3122" stroke-width=".7" fill="none" opacity=".6"/>
    <path d="M18 74.4 Q16.8 80 19.4 84.6 Q24.4 87.4 28.6 84.2 Q30.4 79 27.8 74.8 Q22.8 72.4 18 74.4 Z" fill="url(#ct-skinD)"/>
