    <path d="M66 36.6 Q72 38.6 80 37.4 Q84.6 37 86 39.6 Q86.4 43.4 82.4 45 Q75 46.8 69 44.4 Q65.4 42 66 36.6 Z" fill="url(#ct-skin)"/>
    <path d="M68 41.6 Q74 44 81 42.6" stroke="#424b35" stroke-width=".7" fill="none" opacity=".55"/>
