    <circle cx="61" cy="26.2" r=".7" fill="#ddd8ae"/>
    <!-- fist round the club -->
    <path d="M72.6 58.4 Q78 55.6 82.4 58.6 Q84.4 62.6 82.4 66.6 Q78 69 73.8 67 Q71.4 63 72.6 58.4 Z" fill="url(#ct-skin)"/>
