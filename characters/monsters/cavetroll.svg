    <circle cx="76.4" cy="30.6" r="1.9" fill="url(#ct-eye)"/>
    <circle cx="76.5" cy="30.6" r=".55" fill="#2a2414"/>
    <path d="M79.6 29.6 Q84.6 29 85.4 32.4 Q85 35 81.6 35.2 Q79.4 34 79.6 29.6 Z" fill="url(#ct-belly)"/>
    <ellipse cx="83.6" cy="34" rx=".8" ry=".55" fill="#2a3122"/>
    <!-- front arm: a slab of shoulder and a forearm like a log -->
    <path d="M57.6 41 Q62.6 48.6 66.6 55.6 Q69.4 60.6 72 64.6 L68.4 64.6 Q65 59.4 62 54.4 Q58.4 48.6 55.4 43.4 Z" fill="#2f3826" opacity=".35"/>
    <path d="M54 31 Q60 24 67 28 Q72 33 73.6 41 Q75.6 47 78.4 52 Q81 56 80.6 60 L73.6 63.4 Q70.4 59 68 54.6 Q64 49 60.4 44 Q55 38 54 31 Z" fill="url(#ct-skin)"/>
    <path d="M64 42 Q67.4 46 69.4 50.6 M70.4 46 Q73.4 50 75 54" stroke="#424b35" stroke-width=".7" fill="none" opacity=".55"/>
    <path d="M53 33 Q54.6 24.4 62.6 24.6 Q69.6 26 70.4 32.6 Q65.6 37.6 60 38.4 Q55 38 53 33 Z" fill="url(#ct-skin)"/>
    <path d="M55 31.4 Q57.4 26.4 63 26.2" stroke="#fff" stroke-width="1" fill="none" opacity=".45"/>
