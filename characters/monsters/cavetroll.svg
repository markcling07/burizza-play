    <g fill="#ddd8ae"><circle cx="41.4" cy="21.8" r="1"/><circle cx="54" cy="19.2" r=".8"/><circle cx="60.6" cy="20.4" r=".9"/><circle cx="36.4" cy="26" r=".6"/></g>
    <g fill="#d39a46"><circle cx="47" cy="19.8" r=".7"/><circle cx="57.4" cy="21.6" r=".5"/></g>
