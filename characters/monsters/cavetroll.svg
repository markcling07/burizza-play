    <path d="M78.6 70 Q82 69.6 85 68 M79.4 76 Q83.6 75.6 87.4 73.6 M80.2 82.6 Q85 82.2 89.8 79.8 M80.8 88.4 Q86 88.2 92.2 85.2" stroke="#635845" stroke-width=".7" fill="none" opacity=".65"/>
    <path d="M77 56 Q78 64 79.6 72 Q80.6 80 81.6 88" stroke="#fff" stroke-width=".8" fill="none" opacity=".4"/>
    <path d="M77.2 58.2 L81.6 56.8 M77.6 60.6 L82.4 59 M78 63 L83.2 61.4" stroke="#55341b" stroke-width="1.4"/>
