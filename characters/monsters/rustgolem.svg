<?xml version="1.0" encoding="UTF-8"?>
<!-- Rust Golem (monster) - Ashfall Road art v2. A dwarf-built ore-hauler of stone slabs bound in
     rusted iron: a furnace burning in its chest, a mine-cart hopper of ore on its back, a stubby head
     with slit eyes and hands like anvils, still hauling for a foreman long gone.
     Canvas 100x100, faces right, feet on y=94. -->
