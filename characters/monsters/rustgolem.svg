  <defs>
    <linearGradient id="rg-stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ad9b8e"/><stop offset=".5" stop-color="#7a6658"/><stop offset="1" stop-color="#4a3c33"/></linearGradient>
    <linearGradient id="rg-stoneD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67564b"/><stop offset="1" stop-color="#332a24"/></linearGradient>
    <linearGradient id="rg-rust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8703f"/><stop offset=".5" stop-color="#7e4426"/><stop offset="1" stop-color="#4a2614"/></linearGradient>
    <linearGradient id="rg-rustD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e3c22"/><stop offset="1" stop-color="#36190c"/></linearGradient>
    <linearGradient id="rg-ore" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e9098"/><stop offset=".5" stop-color="#5c5e66"/><stop offset="1" stop-color="#34363c"/></linearGradient>
    <radialGradient id="rg-core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6dc"/><stop offset=".35" stop-color="#ffc47a"/><stop offset=".75" stop-color="#ff9a4a"/><stop offset="1" stop-color="#c8501e"/></radialGradient>
    <radialGradient id="rg-heat" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9a4a" stop-opacity=".5"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2cc"/><stop offset=".45" stop-color="#ff9a4a"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/></radialGradient>
  </defs>
