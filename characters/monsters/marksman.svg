    <linearGradient id="gm-felt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4c58"/><stop offset=".5" stop-color="#1c1d24"/><stop offset="1" stop-color="#0a0a0e"/></linearGradient>
