  <defs>
    <linearGradient id="dk-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e6080"/><stop offset=".5" stop-color="#1e2636"/><stop offset="1" stop-color="#090d15"/></linearGradient>
    <linearGradient id="dk-plateD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26304a"/><stop offset="1" stop-color="#070a10"/></linearGradient>
    <linearGradient id="dk-ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef8ff"/><stop offset=".5" stop-color="#7fb0ff"/><stop offset="1" stop-color="#2c5596"/></linearGradient>
    <linearGradient id="dk-blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2faff"/><stop offset=".45" stop-color="#a8ccff"/><stop offset="1" stop-color="#4a78c4"/></linearGradient>
