<?xml version="1.0" encoding="UTF-8"?>
<!-- The Dread King (boss) - Ashfall Road art v2. Direhold's frost lich-king holding court: a crown of
     ice spikes on a gaunt blue-grey face with frost-light eyes, a long rimed beard, dark plate under a
     fur-and-frost mantle grown with ice, a tattered cape, and an ice greatsword planted between his
     feet with ice cracking out of the floor round it. Canvas 100x100, faces right, feet on y=94. -->
