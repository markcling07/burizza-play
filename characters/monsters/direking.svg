    <linearGradient id="dk-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dee6ef"/><stop offset=".55" stop-color="#aab6c4"/><stop offset="1" stop-color="#667284"/></linearGradient>
    <linearGradient id="dk-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset=".5" stop-color="#cdd8e4"/><stop offset="1" stop-color="#8592a6"/></linearGradient>
    <linearGradient id="dk-cape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e3a52"/><stop offset=".5" stop-color="#141a28"/><stop offset="1" stop-color="#06080d"/></linearGradient>
    <linearGradient id="dk-frost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6ff" stop-opacity="0"/><stop offset="1" stop-color="#cfe6ff" stop-opacity=".55"/></linearGradient>
