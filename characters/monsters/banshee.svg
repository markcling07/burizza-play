      <circle cx="63.2" cy="25.9" r=".8" fill="#f4fffd"/><circle cx="66.2" cy="25.5" r=".55" fill="#f4fffd"/>
    </g>
    <!-- the scream -->
    <path d="M70.9 31.4 A6 6 0 0 1 72.2 39" stroke="#e8fffb" stroke-width="1.5" fill="none" opacity=".85"/>
    <path d="M73.1 28.7 A9.5 9.5 0 0 1 75.6 40" stroke="#e8fffb" stroke-width="1.2" fill="none" opacity=".6"/>
