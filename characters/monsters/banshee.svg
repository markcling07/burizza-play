<?xml version="1.0" encoding="UTF-8"?>
<!-- Banshee (monster) - Ashfall Road art v2. A gaunt woman-spirit mid-scream: wild white hair
     streaming back, the jaw stretched open with the scream ringing out in front of it, both clawed
     hands raised, a tattered grave-shroud thinning into a long tail.
     Canvas 100x100, faces right, floats: shadow on y=94, lowest tatter ~y 90. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="bs-shroud" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#86aaa8"/><stop offset=".55" stop-color="#4a6a6a"/><stop offset=".84" stop-color="#3a5656" stop-opacity=".65"/><stop offset="1" stop-color="#2a3f3f" stop-opacity="0"/></linearGradient>
    <linearGradient id="bs-cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c9e9d"/><stop offset=".5" stop-color="#4a6a6a"/><stop offset="1" stop-color="#2b4242"/></linearGradient>
    <linearGradient id="bs-clothD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f5c5c"/><stop offset="1" stop-color="#1e3030"/></linearGradient>
    <linearGradient id="bs-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fdfb"/><stop offset=".5" stop-color="#bfe8e2"/><stop offset="1" stop-color="#7aa49f"/></linearGradient>
    <linearGradient id="bs-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f4f1"/><stop offset=".5" stop-color="#abc8c3"/><stop offset="1" stop-color="#6e8f8a"/></linearGradient>
    <linearGradient id="bs-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#88a8a3"/><stop offset="1" stop-color="#4b6965"/></linearGradient>
    <linearGradient id="bs-claw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6fffd"/><stop offset="1" stop-color="#8fb0ab"/></linearGradient>
    <radialGradient id="bs-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f2fffd"/><stop offset=".45" stop-color="#9ffff0"/><stop offset="1" stop-color="#9ffff0" stop-opacity="0"/></radialGradient>
    <radialGradient id="bs-maw" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#2c4a4a"/><stop offset="1" stop-color="#081212"/></radialGradient>
