    <path d="M41.5 50.5 Q46.5 54 48 61.5 M46 48.5 Q51 52.5 52.2 59" stroke="#1b120c" stroke-width="1.7" fill="none" opacity=".55"/>
    <path d="M41.5 50.5 Q46.5 54 48 61.5 M46 48.5 Q51 52.5 52.2 59" stroke="#b9917a" stroke-width=".7" fill="none" opacity=".85"/>
    <!-- the bristle ridge -->
    <path d="M69 41.5 L66.4 30.6 L63.6 36.4 L59 25.6 L57.2 32.6 L51.8 24 L51 32.4 L45.2 27 L45 35.8 L38.8 31.4 L39.4 39.4 L32.8 36.6 L34 42.6 L27.4 41.4 L29 46.6 Q40 44.6 49.6 38 Q57.6 33.6 63.6 36 Q67.4 38 69 41.5 Z" fill="url(#gb-bristle)"/>
    <path d="M59.3 26.8 L60.5 30.8 M52.1 25.3 L52.7 29.3 M45.6 28.2 L46 31.8 M39.2 32.6 L39.8 35.8 M33.2 37.6 L34 40.2 M66.5 31.9 L67.1 34.7 M27.8 42.2 L28.6 44.4" stroke="#b4957a" stroke-width=".6" opacity=".75"/>
