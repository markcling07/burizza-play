    <path d="M54.6 39.6 q-1.6 3 -1.2 6.4 M59.4 40 q-1.4 3 -1 6.2 M49.6 42 q-1.6 3 -1.2 6 M63.6 42.6 q-1.2 3 -.6 6 M57 56 q-1 2.4 -.6 5 M45 64 q-1 2.6 -.4 5" stroke="#241812" stroke-width=".8" fill="none" opacity=".65"/>
