<?xml version="1.0" encoding="UTF-8"?>
<!-- Gnash Boar (monster) - Ashfall Road art v2. A warren boar dropped into a charge: a ridge of stiff
     bristles, huge curved tusks, one milky blind eye and one small red one, old scars, steaming snout.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="gb-hide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#80604a"/><stop offset=".5" stop-color="#4a3626"/><stop offset="1" stop-color="#2a1c13"/></linearGradient>
    <linearGradient id="gb-hideD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c2b1e"/><stop offset="1" stop-color="#1b120c"/></linearGradient>
    <linearGradient id="gb-hideH" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#b8916e"/><stop offset="1" stop-color="#80604a" stop-opacity="0"/></linearGradient>
    <linearGradient id="gb-bristle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#806450"/><stop offset=".45" stop-color="#241812"/><stop offset="1" stop-color="#140c08"/></linearGradient>
    <linearGradient id="gb-tusk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaee"/><stop offset=".5" stop-color="#e8dcc4"/><stop offset="1" stop-color="#ad9c7c"/></linearGradient>
    <linearGradient id="gb-tuskD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9bb9d"/><stop offset="1" stop-color="#857558"/></linearGradient>
    <linearGradient id="gb-snout" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a87e6c"/><stop offset=".5" stop-color="#714e42"/><stop offset="1" stop-color="#3e2822"/></linearGradient>
    <linearGradient id="gb-hoof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c3e34"/><stop offset="1" stop-color="#140e0a"/></linearGradient>
    <radialGradient id="gb-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe2c8"/><stop offset=".45" stop-color="#ff4a2a"/><stop offset="1" stop-color="#ff4a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb-milk" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#f6fafa"/><stop offset=".6" stop-color="#c8d2d6"/><stop offset="1" stop-color="#8e9a9e"/></radialGradient>
    <radialGradient id="gb-steam" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f2ede6" stop-opacity=".5"/><stop offset="1" stop-color="#f2ede6" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="30" ry="3.8" fill="#000" opacity=".38"/>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- tail, flicked up mid-charge -->
    <path d="M18 58 Q12 54.5 10.5 58.5 Q10 61.5 12 63" stroke="#2a1c13" stroke-width="1.6" fill="none"/>
    <path d="M11.8 62.4 l-1.9 2.6 M12.5 63 l-.3 3.1" stroke="#241812" stroke-width="1.1"/>
    <!-- far legs: hind leg driving, foreleg braced -->
    <path d="M33 70 L41.5 71 Q41.5 80 38.6 85 L38.2 91 L32.4 91.4 L33 85 Q32 78 33 70 Z" fill="url(#gb-hideD)"/>
    <path d="M31.8 90.4 Q35.2 89.6 38.8 90.6 L39.4 94 L31.2 94 Z" fill="url(#gb-hoof)"/>
    <path d="M54.5 72 L63.5 73 Q62.5 80 60 85 L58.6 91 L52.4 91.4 L53.8 85 Q54.8 79 54.5 72 Z" fill="url(#gb-hideD)"/>
    <path d="M51.6 90.4 Q55.4 89.6 59 90.6 L59.6 94 L51 94 Z" fill="url(#gb-hoof)"/>
