    <path d="M35.8 57.6 Q36.6 67 32 74.4" stroke="#2a1c13" stroke-width=".8" fill="none" opacity=".6"/>
    <path d="M24.5 74 L34 75 Q31.6 81 28.2 85.6 L27 90.6 L19.6 91 L21 85 Q22.4 79 24.5 74 Z" fill="url(#gb-hide)"/>
    <path d="M18.6 90.4 Q22.6 89.4 26.6 90.4 L27.4 94 L18 94 Z" fill="url(#gb-hoof)"/>
    <path d="M22.8 90.2 V94" stroke="#0c0806" stroke-width=".6"/>
    <path d="M21 53.4 Q23.4 51 27.4 50.8" stroke="#fff" stroke-width=".8" fill="none" opacity=".35"/>
    <!-- near foreleg, reaching into the charge -->
    <path d="M60 64 Q67.5 61 72 69 L74.2 78.5 Q76 83.6 77.4 88 L78.2 91 L71 91.5 Q70 87.4 68.4 84.4 Q63.6 79.6 60.6 74 Z" fill="url(#gb-hide)"/>
    <path d="M66.4 76.4 Q69 80.8 71.8 84.2" stroke="#2a1c13" stroke-width=".7" fill="none" opacity=".6"/>
    <path d="M70.4 90.4 Q74.4 89.4 78.4 90.6 L79.2 94 L69.8 94 Z" fill="url(#gb-hoof)"/>
    <path d="M74.6 90.2 L75 94" stroke="#0c0806" stroke-width=".6"/>
    <!-- head, slung low: a long wedge down to the snout -->
    <path d="M63 39 Q68 36.5 73 40.5 Q80 47 86.5 62.5 L89 65.5 Q91.5 66.5 91.6 70 L91.4 75.5 Q90.6 78.4 87.6 78.6 L80.5 79.2 Q73.5 80.4 67.5 77 Q60.5 71 60 60 Q60 46 63 39 Z" fill="url(#gb-hide)"/>
    <path d="M62.4 69.6 L63.4 78.4 L65.2 75 L66.8 80.4 L68.6 76.6 L70.8 80.6 L72.4 77 Q67.4 76.6 62.4 69.6 Z" fill="#241812"/>
    <path d="M64.6 63 Q68.4 71.6 76 76.8" stroke="#2a1c13" stroke-width=".9" fill="none" opacity=".6"/>
    <path d="M82.4 60.2 q1.6 -.6 2.8 .6 M83.8 63.6 q1.6 -.6 2.8 .6 M80.6 57.2 q1.4 -.6 2.6 .4" stroke="#241812" stroke-width=".7" fill="none" opacity=".7"/>
    <path d="M65.4 40.6 Q69 38 72.6 40.4" stroke="#fff" stroke-width=".9" fill="none" opacity=".45"/>
    <!-- snout disc and mouth -->
    <ellipse cx="90.3" cy="72" rx="2.4" ry="5.2" fill="url(#gb-snout)"/>
    <ellipse cx="91" cy="70" rx=".7" ry="1.1" fill="#1e120e"/>
    <ellipse cx="91" cy="74.4" rx=".7" ry="1.1" fill="#1e120e"/>
    <path d="M89 78.2 Q84 78.2 79.6 76.4" stroke="#1e120e" stroke-width=".9" fill="none"/>
    <!-- near ear, laid back -->
    <path d="M63 43 L54.6 32.6 Q62.4 32.4 68.4 39.6 Z" fill="url(#gb-hide)"/>
    <path d="M62.2 40.8 L57.6 35 Q61.6 35 65.6 38.8 Z" fill="#714e42" opacity=".85"/>
    <!-- eyes: one milky and blind under an old claw scar, one small and red -->
    <path d="M77 46.6 L81.2 48.2" stroke="#1b120c" stroke-width="1.1"/>
    <circle cx="79.3" cy="50" r="2.8" fill="url(#gb-eye)"/>
    <circle cx="79.3" cy="50" r=".85" fill="#ffd8c2"/>
    <path d="M68.6 49.4 Q72 46.8 75.6 49" stroke="#1b120c" stroke-width="1.3" fill="none"/>
    <ellipse cx="72.4" cy="51.2" rx="2.3" ry="1.9" fill="url(#gb-milk)"/>
    <path d="M69.2 46.2 L75.8 56.2" stroke="#1b120c" stroke-width="1.5" opacity=".55"/>
    <path d="M69.2 46.2 L75.8 56.2" stroke="#c49c86" stroke-width=".6" opacity=".9"/>
    <!-- near tusk, the big one, and the short upper whetter -->
    <path d="M79 78.5 Q86 85 92 78 Q95 72 91.5 61 Q92.2 71 88.6 76 Q84.5 79.6 80.2 75.2 Z" fill="url(#gb-tusk)"/>
    <path d="M81 80 Q86.6 83.4 91.2 78.4" stroke="#8a7a5e" stroke-width=".6" fill="none" opacity=".6"/>
    <path d="M89.6 76.6 Q92.6 72.6 91.8 65" stroke="#fff" stroke-width=".7" fill="none" opacity=".7"/>
    <path d="M82.4 77 Q85.6 76.6 86 72.6 Q84.6 74.6 82 74.8 Z" fill="url(#gb-tusk)"/>
    <!-- slobber, and steam snorting from the snout -->
    <path d="M85.2 78.8 q.5 2.4 -.4 4.2" stroke="#d8d4cc" stroke-width=".5" fill="none" opacity=".55"/>
    <ellipse cx="93.2" cy="83.4" rx="3.6" ry="2.6" fill="url(#gb-steam)"/>
    <ellipse cx="90.6" cy="87.2" rx="3" ry="2.1" fill="url(#gb-steam)" opacity=".8"/>
    <!-- dirt flung up by the hind hoof -->
    <g fill="#3a2a1d" opacity=".8"><circle cx="13.5" cy="89.5" r=".9"/><circle cx="10.6" cy="86.6" r=".6"/><circle cx="14.6" cy="85.4" r=".5"/></g>
  </g>
</svg>
