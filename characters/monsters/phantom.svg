      <path d="M79.4 37.4 Q86.7 39.2 89.8 34.4 Q88.6 34 88.8 32.8 Q83.9 31.3 79.4 37.4 Z"/>
      <path d="M79.4 37.4 Q87.4 35.7 88.2 29.6 Q86.8 29.8 86.6 28.6 Q81.1 29.4 79.4 37.4 Z"/>
