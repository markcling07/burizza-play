<?xml version="1.0" encoding="UTF-8"?>
<!-- Pale Phantom (monster) - Ashfall Road art v2. The manor's maid, still on duty: a frilled cap
     and neat collar, a starched apron tied in a bow, a feather duster held out for the dead, polite
     blank eyes, the long skirt thinning into wisps.
     Canvas 100x100, faces right, floats: shadow on y=94, lowest wisp ~y 90. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="pp-dress" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2d6ee"/><stop offset=".5" stop-color="#b8a6c8"/><stop offset="1" stop-color="#7b6893"/></linearGradient>
    <linearGradient id="pp-skirt" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#d9cbe7"/><stop offset=".45" stop-color="#b8a6c8" stop-opacity=".95"/><stop offset=".8" stop-color="#8d7aa6" stop-opacity=".55"/><stop offset="1" stop-color="#6f5c86" stop-opacity="0"/></linearGradient>
    <linearGradient id="pp-dressD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7ca6"/><stop offset="1" stop-color="#55456c"/></linearGradient>
    <linearGradient id="pp-apron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfbff"/><stop offset=".5" stop-color="#e6dcf2"/><stop offset="1" stop-color="#b4a4c8"/></linearGradient>
    <linearGradient id="pp-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f3fc"/><stop offset=".55" stop-color="#dcd0e8"/><stop offset="1" stop-color="#a796bb"/></linearGradient>
    <linearGradient id="pp-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a593ba"/><stop offset=".5" stop-color="#7d6b93"/><stop offset="1" stop-color="#55466b"/></linearGradient>
    <linearGradient id="pp-feather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4effa"/><stop offset=".5" stop-color="#c4b4d8"/><stop offset="1" stop-color="#85729e"/></linearGradient>
    <linearGradient id="pp-featherD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3a2c9"/><stop offset="1" stop-color="#6c5987"/></linearGradient>
    <linearGradient id="pp-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8c7894"/><stop offset="1" stop-color="#4b3d56"/></linearGradient>
