    <path d="M53 27.6 Q52.6 22.6 56 20.2 M55.4 26 Q55.6 23 58.6 21.6" stroke="#55466b" stroke-width=".5" fill="none" opacity=".6"/>
    <ellipse cx="54.6" cy="27.8" rx="1" ry="1.5" fill="#cbbedb"/>
