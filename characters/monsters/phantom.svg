    <radialGradient id="pp-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d9a8ff" stop-opacity=".16"/><stop offset="1" stop-color="#d9a8ff" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="17" ry="3" fill="#000" opacity=".25"/>
  <ellipse cx="53" cy="52" rx="27" ry="35" fill="url(#pp-aura)"/>
