    <g fill="#efe6fa" opacity=".55"><circle cx="92.6" cy="25.6" r=".6"/><circle cx="90.4" cy="22.8" r=".45"/><circle cx="94" cy="30.4" r=".5"/><circle cx="86.4" cy="22.6" r=".4"/></g>
