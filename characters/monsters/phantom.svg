    <path d="M51.2 21.6 Q56 16.6 62.4 19.4 L62.8 20.8 Q56.4 18.4 51.8 23 Z" fill="url(#pp-apron)"/>
    <g fill="#f8f4fd"><circle cx="51.4" cy="20.4" r="1.15"/><circle cx="52.9" cy="18.6" r="1.15"/><circle cx="54.9" cy="17.4" r="1.15"/><circle cx="57.2" cy="16.9" r="1.15"/><circle cx="59.5" cy="17.2" r="1.15"/><circle cx="61.5" cy="18.2" r="1.1"/></g>
    <path d="M51.8 22.4 Q56.6 18.6 62.6 20.6" stroke="#9c86b4" stroke-width=".8" fill="none"/>
