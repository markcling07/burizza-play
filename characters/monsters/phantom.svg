    <path d="M79.8 35.6 Q80 31 79 28.8 M80.6 35.4 Q82.2 31 83 27.6 M81.4 35.8 Q84.4 32.6 87 29.6 M82 36.6 Q86 35.6 88.8 33.4 M81.8 37.6 Q85 38.4 87.6 37.6" stroke="#85729e" stroke-width=".45" fill="none" opacity=".6"/>
