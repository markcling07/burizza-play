    <linearGradient id="tm-kelp" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9a44"/><stop offset=".5" stop-color="#58682a"/><stop offset="1" stop-color="#323e18"/></linearGradient>
    <linearGradient id="tm-water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7d96" stop-opacity=".95"/><stop offset=".5" stop-color="#213a4c" stop-opacity=".95"/><stop offset="1" stop-color="#16303f" stop-opacity=".95"/></linearGradient>
    <linearGradient id="tm-spill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6fffb" stop-opacity=".95"/><stop offset="1" stop-color="#7fe3d4" stop-opacity=".1"/></linearGradient>
