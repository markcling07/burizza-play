<?xml version="1.0" encoding="UTF-8"?>
<!-- The Tide Mother (boss) - Ashfall Road art v2. A ship's figurehead the sea brought to life: flaking
     carved wood, kelp-and-wave hair, a coral crown, a gaping sea-lit mouth, arms spread with a trident,
     and a twisting column of seawater for legs. Canvas 100x100, faces right, feet on y=94. -->
