  <defs>
    <linearGradient id="tm-paint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4f4"/><stop offset=".5" stop-color="#b9cbd1"/><stop offset="1" stop-color="#7894a2"/></linearGradient>
    <linearGradient id="tm-paintD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94aab4"/><stop offset="1" stop-color="#566f7e"/></linearGradient>
    <linearGradient id="tm-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b48c64"/><stop offset=".5" stop-color="#86623f"/><stop offset="1" stop-color="#523a26"/></linearGradient>
    <linearGradient id="tm-gown" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c5e76"/><stop offset=".5" stop-color="#213a4c"/><stop offset="1" stop-color="#0f1e2a"/></linearGradient>
