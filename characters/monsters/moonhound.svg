<?xml version="1.0" encoding="UTF-8"?>
<!-- Moon Hound (monster) - Ashfall Road art v2. A lean, long-legged warren wolf with its head thrown
     back mid-howl: moon-silver glints on slate fur, a pale crescent on the shoulder, eyes like moonlight.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="mh-fur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7f90"/><stop offset=".5" stop-color="#36404a"/><stop offset="1" stop-color="#1c2229"/></linearGradient>
    <linearGradient id="mh-furD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e3640"/><stop offset="1" stop-color="#14181d"/></linearGradient>
    <linearGradient id="mh-ruff" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4d2e0"/><stop offset=".5" stop-color="#8494a6"/><stop offset="1" stop-color="#4a5664"/></linearGradient>
    <linearGradient id="mh-moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f9ff"/><stop offset=".5" stop-color="#aebfcf"/><stop offset="1" stop-color="#76879a"/></linearGradient>
    <linearGradient id="mh-fang" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f0"/><stop offset="1" stop-color="#bdb5a4"/></linearGradient>
    <radialGradient id="mh-maw" cx=".4" cy=".6" r=".7"><stop offset="0" stop-color="#5a2230"/><stop offset="1" stop-color="#150a0e"/></radialGradient>
    <radialGradient id="mh-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#cfe8ff"/><stop offset="1" stop-color="#cfe8ff" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="26" ry="3.6" fill="#000" opacity=".38"/>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- the song, rising to a moon it cannot see -->
    <path d="M85 10.4 A6 6 0 0 1 88.9 17 M86.3 7 A9.5 9.5 0 0 1 92.4 17.6" stroke="#cfe8ff" stroke-width=".8" fill="none" opacity=".45"/>
    <!-- bushy tail, hung low -->
    <path d="M22 54 Q14 53.6 10.6 61.6 Q8.2 68.6 9.4 77.4 L11.2 74.4 L12.2 76.6 Q13.4 70.6 15.2 66.2 Q17.8 60.4 23.4 58.6 Z" fill="url(#mh-fur)"/>
    <path d="M9.4 77.4 L11.2 74.4 L12.2 76.6 Q12.4 74 13.2 71.6 Q10.6 71.6 9.4 77.4 Z" fill="url(#mh-moon)"/>
    <path d="M20 55.2 Q14 56 11.8 62.4" stroke="#aebfcf" stroke-width=".9" fill="none" opacity=".7"/>
    <!-- far legs -->
    <path d="M35.6 61.6 Q41 62.6 41.4 67 Q38.6 74 34.8 80.4 L34.8 89.4 Q37 90.8 37.2 92.4 Q37 93.8 35.4 93.8 L29.6 93.8 Q28.4 93.4 29.2 91.6 L30 83 L29 81.2 Q30.4 74 33.2 67 Z" fill="url(#mh-furD)"/>
    <path d="M51 61 L58.2 61.6 Q58 70 56.6 78 Q56.2 82.4 56.6 84.6 Q58.4 88.2 60.2 90.4 Q61.2 92.4 59.8 93.8 L53.2 93.8 Q52.2 92.8 53 90.8 L53 85.6 L52.2 84 Q52.8 79 52.4 74 Q51.8 67 51 61 Z" fill="url(#mh-furD)"/>
