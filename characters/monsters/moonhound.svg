    <path d="M37.6 51.2 Q43 50.6 47.6 51 M50 50.4 Q53 49.6 55 48" stroke="#aebfcf" stroke-width="1" fill="none" opacity=".7"/>
    <path d="M57.4 43.6 Q58.4 40 61 36.6" stroke="#aebfcf" stroke-width="1" fill="none" opacity=".6"/>
    <path d="M40 54 l-2.6 1.4 M46 54.4 l-2.6 1.4 M52 52.6 l-2.4 1.6 M44 59 l-2.4 1.2" stroke="#1c2229" stroke-width=".7" opacity=".6"/>
    <!-- pale throat ruff -->
    <path d="M77 31.6 Q78 42 72.6 51 Q70.6 56 69.4 60 L67 57.6 L67.4 61.4 L65 59.4 Q66.6 52 67.6 46 L70 47.4 L69.6 42.4 L72.6 43.4 L71.8 38 L74.6 38.6 L73.4 33.4 Z" fill="url(#mh-ruff)"/>
    <!-- near haunch and hind leg -->
    <path d="M24 51 Q34 50 35.6 58 Q36 64 33.6 69 Q30.4 74.4 26.4 80.4 L26.4 89.4 Q28.6 90.8 28.8 92.4 Q28.6 93.8 27 93.8 L21.2 93.8 Q20 93.4 20.8 91.6 L21.6 83 L20.6 81.2 Q21.4 76 24 71.6 L21.2 71 L22 68.8 L19 67.8 L19.8 65.6 L17.4 64.2 Q16.8 57.4 19 53.8 Q21 51.4 24 51 Z" fill="url(#mh-fur)"/>
    <path d="M34.4 60.4 Q34 66 31 70.6" stroke="#1c2229" stroke-width=".7" fill="none" opacity=".6"/>
    <path d="M20.4 54.4 Q23 51.8 27.6 51.4" stroke="#fff" stroke-width=".8" fill="none" opacity=".45"/>
    <path d="M23 92.2 v1.4 M25 92.2 v1.4" stroke="#14181d" stroke-width=".5" opacity=".7"/>
    <!-- near foreleg, planted -->
    <path d="M55.6 54 Q60.6 50.6 64.8 54.4 Q66.6 58 64.6 63 Q64.4 70 63 78 Q62.6 82.4 63 84.6 Q64.8 88.2 66.6 90.4 Q67.6 92.4 66.2 93.8 L59.6 93.8 Q58.6 92.8 59.4 90.8 L59.4 85.6 L58.6 84 Q59.2 79 58.8 74 Q58 68 56.6 64.6 Q54 60 55.6 54 Z" fill="url(#mh-fur)"/>
    <path d="M59.2 67 Q60.2 75 60.4 82" stroke="#aebfcf" stroke-width=".7" fill="none" opacity=".5"/>
    <path d="M56.4 62.6 Q57.4 65.6 59.4 67" stroke="#14181d" stroke-width=".6" fill="none" opacity=".6"/>
    <!-- the crescent mark on the shoulder -->
    <path d="M61 50.8 Q55 52.4 55.8 57.6 Q57.2 61.6 62.4 61 Q58.6 59.4 58.4 55.8 Q58.2 52.6 61 50.8 Z" fill="url(#mh-moon)"/>
    <path d="M62.4 92 v1.6 M64.4 91.8 v1.8" stroke="#14181d" stroke-width=".5" opacity=".7"/>    <!-- head, thrown back: skull and upper jaw -->
    <path d="M63.4 35 Q61.4 26.4 66.4 22.2 Q70 19.4 73.6 20.2 L78.6 13.2 Q80.4 11.6 81.8 13.6 L77.6 25.4 Q77.4 30 76.6 33 Q71 36.4 63.6 35 Z" fill="url(#mh-fur)"/>
    <path d="M80.6 16.3 L82.7 17.8 L80.2 17.7 Z" fill="url(#mh-fang)"/>
    <ellipse cx="80.9" cy="12.9" rx="1.5" ry="1.1" transform="rotate(-50 80.9 12.9)" fill="#0e1216"/>
    <path d="M74.4 21.4 L78.8 15" stroke="#e8f0f8" stroke-width=".9" opacity=".6"/>
    <path d="M65 25.6 Q68 22.4 72 21.6" stroke="#fff" stroke-width=".8" fill="none" opacity=".45"/>
    <!-- near ear, folded back -->
    <path d="M65 31.6 L57.4 26.2 Q61.4 25.4 68 28.2 Z" fill="url(#mh-fur)"/>
    <path d="M64 30 L60 27.2 Q62.4 27 65.6 28.4 Z" fill="#1c2229" opacity=".7"/>
    <!-- moonlight eye -->
    <path d="M69 24.4 Q71.6 22.6 74.2 23.4" stroke="#14181d" stroke-width="1" fill="none"/>
    <circle cx="71.8" cy="26" r="3.2" fill="url(#mh-eye)"/>
    <path d="M70.4 26.6 Q71.8 25 73.4 25.4" stroke="#fff" stroke-width="1" fill="none"/>
    <!-- silver glints in the fur -->
    <g fill="#e6f0fa"><circle cx="33" cy="51.2" r=".6"/><circle cx="47" cy="50.6" r=".5"/><circle cx="59.4" cy="38.4" r=".5"/><circle cx="14" cy="60" r=".5"/></g>
  </g>
</svg>
