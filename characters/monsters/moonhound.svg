    <path d="M76.2 28.6 L81.6 13.8 L85.2 19.4 Z" fill="url(#mh-maw)"/>
    <path d="M73 30 L84.6 19.6 Q86.6 19 86.6 21 Q83.4 27.6 77.6 33.6 Q74.4 33.4 73 30 Z" fill="url(#mh-fur)"/>
    <path d="M76.4 28.2 Q80 24.6 83.4 21.4" stroke="#b25a6c" stroke-width="1.3" fill="none"/>
    <path d="M82.5 21.5 L81.7 19.5 L83.5 20.5 Z" fill="url(#mh-fang)"/>
    <!-- lean body: deep chest, tucked belly, a ruff down the back of the neck -->
