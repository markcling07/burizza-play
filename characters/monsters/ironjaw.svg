    <linearGradient id="ij-dial" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbf0"/><stop offset="1" stop-color="#dcd0b4"/></linearGradient>
    <radialGradient id="ij-fire" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e0"/><stop offset=".35" stop-color="#ffd27a"/><stop offset=".75" stop-color="#ffb347"/><stop offset="1" stop-color="#e0661e"/></radialGradient>
    <radialGradient id="ij-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".6"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <radialGradient id="ij-maw" cx=".55" cy=".6" r=".6"><stop offset="0" stop-color="#ffe6a0"/><stop offset=".35" stop-color="#ffb347"/><stop offset=".75" stop-color="#b8461a"/><stop offset="1" stop-color="#2a1208"/></radialGradient>
