<?xml version="1.0" encoding="UTF-8"?>
<!-- Foreman Ironjaw (boss) - Ashfall Road art v2. The mine's great overseer-engine: a boiler body under
     a sooty smokestack, furnace eyes, a hinged ore-bucket jaw full of teeth, the brass shift whistle
     still blowing by the clock at its temple, piston limbs, a drop-hammer fist and the foreman's lantern.
     Canvas 100x100, faces right, feet on y=94. -->
