  <defs>
    <linearGradient id="ij-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aab0bc"/><stop offset=".5" stop-color="#5a5f6a"/><stop offset="1" stop-color="#2b2f37"/></linearGradient>
    <linearGradient id="ij-steelD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f5a"/><stop offset="1" stop-color="#1c1f25"/></linearGradient>
    <linearGradient id="ij-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffeaa8"/><stop offset=".5" stop-color="#e3a94a"/><stop offset="1" stop-color="#8a5c1a"/></linearGradient>
    <linearGradient id="ij-brassD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8862e"/><stop offset="1" stop-color="#5a3c0e"/></linearGradient>
