    <radialGradient id="sj-maw" cx=".25" cy=".45" r=".8"><stop offset="0" stop-color="#2a0a10"/><stop offset=".55" stop-color="#6a1a26"/><stop offset="1" stop-color="#a8384a"/></radialGradient>
    <radialGradient id="sj-eye" cx=".4" cy=".35" r=".6"><stop offset="0" stop-color="#3a4c58"/><stop offset=".5" stop-color="#0c1418"/><stop offset="1" stop-color="#020405"/></radialGradient>
