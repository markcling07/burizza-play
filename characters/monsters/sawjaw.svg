    <linearGradient id="sj-belly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6fafc"/><stop offset=".5" stop-color="#d9e6ee"/><stop offset="1" stop-color="#9fb4c2"/></linearGradient>
