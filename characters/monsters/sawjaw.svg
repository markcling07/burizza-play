<!-- Sawjaw Reaver (monster) - Ashfall Road art v2. A reef-shark that grew legs to follow the blood
     onto the sand: hunched on two clawed legs, a huge head with the jaws gaping on rows of saw teeth,
     a swept dorsal fin, gill slits, a pale belly, webbed claws and dead black eyes.
     Canvas 100x100, faces right, feet on y=94. -->
