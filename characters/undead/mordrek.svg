<?xml version="1.0" encoding="UTF-8"?>
<!-- Mordrek the Interred (Undead, melee) - Burizza art v1. A trudging zombie bruiser who dug himself
     out of his own grave: burial suit rotted to rags, grave dirt caked on shoulders, knees and hands,
     torn turf and roots still clinging, split skin over bared ribs, sunken cheeks, a lolling jaw and
     grave-green pinpoint eyes. Sagging hunch, front shoulder dragged low. Canvas 100x100, faces right,
     feet on y=94. The iron grave cross he tore out of the ground with him is his weapon (class="wpn"):
     upright, crossbar, worn nameplate, rust, base spike and wire grip wrap, drawn at data-hand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66,58">
  <defs>
    <linearGradient id="md-flesh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c9a4"/><stop offset=".5" stop-color="#97a884"/><stop offset="1" stop-color="#63704f"/></linearGradient>
    <linearGradient id="md-fleshD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d8c6c"/><stop offset="1" stop-color="#46523a"/></linearGradient>
    <linearGradient id="md-rags" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e7059"/><stop offset=".5" stop-color="#5a5c4a"/><stop offset="1" stop-color="#3b3c30"/></linearGradient>
    <linearGradient id="md-ragsD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4c3d"/><stop offset="1" stop-color="#2a2b22"/></linearGradient>
    <linearGradient id="md-trim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6b5c"/><stop offset=".6" stop-color="#47564a"/><stop offset="1" stop-color="#2b352d"/></linearGradient>
    <linearGradient id="md-iron" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa0a6"/><stop offset=".45" stop-color="#5c6168"/><stop offset="1" stop-color="#2c3035"/></linearGradient>
    <linearGradient id="md-ironD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e535a"/><stop offset="1" stop-color="#20242a"/></linearGradient>
    <linearGradient id="md-rust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a2e"/><stop offset=".6" stop-color="#6a3f1e"/><stop offset="1" stop-color="#3f2411"/></linearGradient>
    <linearGradient id="md-dirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4530"/><stop offset="1" stop-color="#2e2319"/></linearGradient>
    <linearGradient id="md-bone" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#e9e3cb"/><stop offset="1" stop-color="#b6ae95"/></linearGradient>
