<?xml version="1.0" encoding="UTF-8"?>
<!-- Mortessa (support) - Pale Host art v1. Necromancer and grave-priestess of the Undead.
     "Brings the coffin everywhere, for anyone." Nature: The Dead Listen - the grave knows her voice.
     Canvas 100x100, faces right, hem on y=94. Staff, floating coffin and grave-motes are class="wpn".
     Her hair carries class="hair" (front locks class="hair hair-r") for the Second Burial revive ritual. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="67,56">
  <defs>
    <linearGradient id="mo-robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55665a"/><stop offset=".45" stop-color="#3c4a42"/><stop offset="1" stop-color="#1b2420"/></linearGradient>
    <linearGradient id="mo-sleeve" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a7d6e"/><stop offset=".55" stop-color="#47564d"/><stop offset="1" stop-color="#2a352f"/></linearGradient>
    <linearGradient id="mo-robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e3a33"/><stop offset="1" stop-color="#121917"/></linearGradient>
    <linearGradient id="mo-mantle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#28332c"/><stop offset=".55" stop-color="#161d19"/><stop offset="1" stop-color="#090d0b"/></linearGradient>
    <linearGradient id="mo-trim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8edd9"/><stop offset=".45" stop-color="#9fc4a2"/><stop offset="1" stop-color="#5c7d61"/></linearGradient>
    <linearGradient id="mo-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f1e8"/><stop offset=".55" stop-color="#ddd8cb"/><stop offset="1" stop-color="#aea899"/></linearGradient>
    <linearGradient id="mo-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#f1efe6"/><stop offset="1" stop-color="#a9b0a6"/></linearGradient>
    <linearGradient id="mo-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3d3229"/><stop offset=".5" stop-color="#241d18"/><stop offset="1" stop-color="#11100d"/></linearGradient>
    <linearGradient id="mo-woodL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d3e31"/><stop offset=".6" stop-color="#2b231c"/><stop offset="1" stop-color="#161310"/></linearGradient>
    <radialGradient id="mo-orb" cx=".36" cy=".32" r=".72"><stop offset="0" stop-color="#eafff0"/><stop offset=".28" stop-color="#8ee6a0"/><stop offset=".7" stop-color="#3f9c5c"/><stop offset="1" stop-color="#17402a"/></radialGradient>
    <radialGradient id="mo-orbCore" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d8ffe4" stop-opacity=".75"/><stop offset="1" stop-color="#8ee6a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="mo-pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8ee6a0" stop-opacity=".5"/><stop offset=".6" stop-color="#8ee6a0" stop-opacity=".16"/><stop offset="1" stop-color="#8ee6a0" stop-opacity="0"/></radialGradient>
    <filter id="mo-glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="mo-glowSm" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".38"/><!-- ground shadow -->
  <ellipse cx="50" cy="92.6" rx="27" ry="6" fill="url(#mo-pool)"/><!-- grave-light pooling on the ground -->
  <g fill="#8ee6a0" opacity=".32"><circle cx="35" cy="22" r=".5"/><circle cx="77" cy="46" r=".45"/><circle cx="38" cy="78" r=".55"/><circle cx="71" cy="74" r=".4"/></g>
  <!-- HER COFFIN: carried everywhere, floating at her side on grave-light, lid ajar and leaking -->
  <ellipse class="wpn" cx="20.5" cy="61.5" rx="13" ry="19" fill="#8ee6a0" opacity=".16" filter="url(#mo-glow)"/>
  <ellipse class="wpn" cx="23" cy="80" rx="9.5" ry="2.8" fill="#8ee6a0" opacity=".55" filter="url(#mo-glow)"/><!-- the light it rides on -->
  <g class="wpn" transform="translate(20.5,61.5) rotate(-11)" stroke-linejoin="round">
    <path class="wpn" d="M-4.2 -14 L4.2 -14 L7 -4.5 L3.4 14 L-3.4 14 L-7 -4.5 Z" fill="url(#mo-wood)" stroke="#6f8f76" stroke-width=".7"/><!-- coffin body -->
    <path class="wpn" d="M-3.8 -12.6 L3.8 -12.6 L6.3 -4.05 L3.06 12.6 L-3.06 12.6 L-6.3 -4.05 Z" fill="#8ee6a0"/><!-- the light inside -->
    <path class="wpn" d="M-3.96 -12.4 L2.76 -12.4 L5 -4.8 L2.12 10 L-3.32 10 L-6.2 -4.8 Z" fill="url(#mo-woodL)" stroke="#5c7d61" stroke-width=".5"/><!-- lid, slid ajar -->
    <path class="wpn" d="M2.76 -12.4 L5 -4.8 L2.12 10 L-3.32 10" stroke="#dfffe8" stroke-width=".7" fill="none"/><!-- light leaking from the seam -->
    <path class="wpn" d="M-.6 -9.4 V2.6 M-4 -4.6 H2.8" stroke="url(#mo-trim)" stroke-width="1.6" stroke-linecap="round"/><!-- grave-marker cross -->
    <path class="wpn" d="M5.9 -1.6 q3.1 1.9 .2 4.3 M-5.9 -1.6 q-3.1 1.9 -.2 4.3" stroke="#9fc4a2" stroke-width="1" fill="none" stroke-linecap="round"/><!-- handles -->
    <g class="wpn" fill="url(#mo-trim)"><path class="wpn" d="M-4.1 -14.1 h2.8 v1.5 h-2.8 z"/><path class="wpn" d="M1.3 -14.1 h2.8 v1.5 h-2.8 z"/><path class="wpn" d="M-3.6 12.6 h2.5 v1.5 h-2.5 z"/><path class="wpn" d="M1 12.6 h2.5 v1.5 h-2.5 z"/></g><!-- fittings -->
    <path class="wpn" d="M-4.9 -8.2 l1.7 -.5 M3.5 -8.8 l1.6 .5" stroke="#9fc4a2" stroke-width=".8" stroke-linecap="round" opacity=".8"/>
  </g>
  <circle class="wpn" cx="67" cy="15" r="12" fill="#8ee6a0" opacity=".45" filter="url(#mo-glow)"/><!-- orb halo -->
  <circle class="wpn" cx="67" cy="15" r="7" fill="#dfffe8" opacity=".2" filter="url(#mo-glowSm)"/>

  <g stroke="none">
    <path d="M46 37 Q38 45 35.8 62 Q34 78 32.8 91 Q38.5 93.2 43.8 91.8 L50 42 Z" fill="url(#mo-mantle)"/><!-- mourning mantle, back drape -->
    <!-- long hair, loose and lifted on the draught out of an open grave -->
    <path class="hair" d="M50.5 17 Q37.6 21.4 34 38 Q30.6 53 32.2 65 Q29.8 71 31.9 75.2 Q36.4 68.4 39 60 Q36.4 46 41.2 34 Q44.6 26 51.4 22 Z" fill="url(#mo-hair)"/>
    <path class="hair" d="M34.8 33.4 Q28.2 30.6 23.2 34.2 Q28.6 32.8 32.4 35.6 Q33.8 36.6 34.2 38.2 Z" fill="url(#mo-hair)" opacity=".92"/>
    <path class="hair" d="M33.2 56 Q30 53.6 28.8 49.4 Q30.4 52.6 32 52.4 Q32.8 52.6 33.6 53.6 Z" fill="url(#mo-hair)" opacity=".8"/>
    <!-- robe: narrow through the waist, long and columnar -->
    <path d="M41.5 42 Q51 38 60.5 42 L59.5 58 L65 90.5 Q50.5 97.5 36.5 90.5 L42.5 58 Z" fill="url(#mo-robe)"/>
    <path d="M47 43.5 h7.6 l2.6 47.9 Q50.5 94.8 44.4 91.7 Z" fill="url(#mo-robeD)"/><!-- central funeral panel -->
    <path d="M47 43.5 L44.4 91.7 M54.6 43.5 L57.2 91.4" stroke="url(#mo-trim)" stroke-width=".8" fill="none" opacity=".9"/>
    <path d="M44.6 46 Q42.6 68 40.4 88 M57.4 46 Q59.6 68 61.4 88" stroke="#273029" stroke-width=".8" fill="none" opacity=".85"/>
    <path d="M51 46.4 v6 M48.6 48.8 h4.8 M50.8 68 v4.4 M49 69.8 h3.6" stroke="url(#mo-trim)" stroke-width=".85" stroke-linecap="round"/><!-- marker crosses -->
    <path d="M48.6 76 h4.4 M48.8 79 h3 M48.6 82 h4.6 M49 85 h2.8" stroke="#9fc4a2" stroke-width=".45" opacity=".6"/><!-- whispered names -->
    <path d="M36.8 88 Q50.5 92.5 64.7 88 L65 90.5 Q50.5 97.5 36.5 90.5 Z" fill="url(#mo-mantle)"/><!-- hem layer -->
    <path d="M37.3 89.8 Q50.5 94.2 64.3 89.8" stroke="url(#mo-trim)" stroke-width="1.2" fill="none"/>
    <path d="M40 92.2 h2.6 M43.8 92.9 h1.8 M46.9 93.3 h3 M51 93.5 h2 M54.6 93.1 h2.6 M58.4 92.4 h2.2" stroke="#9fc4a2" stroke-width=".45" opacity=".7"/><!-- hem script -->
    <g stroke="url(#mo-trim)" stroke-width=".8" fill="none" stroke-linecap="round"><!-- grave-lilies embroidered at the hem -->
      <path d="M43 87.6 v-3.6 M43 86.1 q-1.9-1.3 -2.4-3.2 q2 .6 2.4 3.2 M43 86.1 q1.9-1.3 2.4-3.2 q-2 .6 -2.4 3.2"/>
      <path d="M50.8 89 v-3.6 M50.8 87.5 q-1.9-1.3 -2.4-3.2 q2 .6 2.4 3.2 M50.8 87.5 q1.9-1.3 2.4-3.2 q-2 .6 -2.4 3.2"/>
      <path d="M58.6 87.6 v-3.6 M58.6 86.1 q-1.9-1.3 -2.4-3.2 q2 .6 2.4 3.2 M58.6 86.1 q1.9-1.3 2.4-3.2 q-2 .6 -2.4 3.2"/>
    </g>
    <!-- belt + chatelaine of grave goods -->
    <path d="M42.2 56.4 Q50.8 59.4 59.6 56.4 L59.9 60.2 Q50.8 63.6 41.9 60.2 Z" fill="url(#mo-robeD)"/>
    <path d="M42.5 58.2 Q50.8 61.2 59.4 58.2" stroke="url(#mo-trim)" stroke-width=".9" fill="none"/>
    <path d="M54.5 62.2 v2 M58.4 61.6 v2 M50.6 62.6 v2.2 M62 60.6 q.8 1.6 .4 3" stroke="#9fc4a2" stroke-width=".55" fill="none"/><!-- chains -->
    <path d="M57 63.6 h2.8 v1.6 l1.3 1.9 v4.6 h-5.4 v-4.6 l1.3-1.9 z" fill="#8ee6a0" opacity=".7" stroke="#d8edd9" stroke-width=".45"/><!-- vial of grave-dust -->
    <path d="M60.7 66.4 q0-4.2 1.7-4.2 q1.7 0 1.7 4.2 z" fill="url(#mo-trim)"/><circle cx="62.4" cy="67.4" r=".75" fill="#9fc4a2"/><!-- tiny bell -->
    <ellipse cx="54.5" cy="66.5" rx="2" ry="2.4" fill="url(#mo-trim)"/><path d="M54.5 64.6 v3.8" stroke="#2e3a33" stroke-width=".45"/><!-- locket -->
    <path d="M50 64.8 h1.3 v5.6 H50 z M49 70.4 h3.3 v1 H49 z M49.2 72.2 h2 v.9 h-2 z" fill="url(#mo-trim)"/><!-- key -->
    <!-- staff of dark wood -->
    <rect class="wpn" x="65.7" y="19.5" width="2.7" height="72.5" rx="1.2" fill="url(#mo-wood)"/>
    <path class="wpn" d="M66.5 24 q.8 5 0 10 M66.5 39 q.8 5 0 10 M66.5 64 q.8 5 0 10 M66.5 78 q.8 5 0 10" stroke="#5e5042" stroke-width=".5" fill="none" opacity=".75"/>
    <rect class="wpn" x="64.9" y="50.4" width="4.3" height="2.2" rx=".6" fill="url(#mo-trim)"/>
    <rect class="wpn" x="64.9" y="60" width="4.3" height="2.2" rx=".6" fill="url(#mo-trim)"/>
    <rect class="wpn" x="64.8" y="89.3" width="4.5" height="2.6" rx=".6" fill="url(#mo-trim)"/>
    <!-- high mourning collar, standing behind the head -->
    <path d="M45 44 Q40.8 37 42 25.4 Q44.8 30.6 47.2 24.4 Q50 30 52.8 24 Q55.8 30 59.4 25.6 Q63.6 34 62.2 44 Z" fill="url(#mo-mantle)"/>
    <path d="M42.7 27.6 Q45.2 32.4 47.5 26.2 Q50.3 31.6 53 25.8 Q56 31.8 59 27.6" stroke="url(#mo-trim)" stroke-width=".9" fill="none"/>
    <path d="M50.3 32.6 h7 v9 h-7 z" fill="url(#mo-skin)"/><!-- neck -->
    <path d="M42.2 40.6 Q51 35.6 61.4 40.6 L63.8 47.8 Q50.8 52.2 40.8 47.8 Z" fill="url(#mo-mantle)"/><!-- veil over the shoulders -->
    <path d="M41.9 47 Q50.8 51.2 63.3 47" stroke="url(#mo-trim)" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M51.6 42.4 l1.6 2.1 l-1.6 2.1 l-1.6-2.1 z" fill="#8ee6a0"/><!-- collar clasp -->
    <!-- head + hair -->
    <circle cx="53.8" cy="26" r="8.2" fill="url(#mo-skin)"/>
    <path class="hair" d="M45.4 28.8 Q44.2 16 54.2 15.3 Q63.6 16 64.2 25.6 Q61.2 20.4 56.2 20.9 Q50.6 21.6 48.8 27.2 Q47.3 31.2 47.6 35.6 Q45.9 33.2 45.4 28.8 Z" fill="url(#mo-hair)"/>
    <path class="hair hair-r" d="M62.8 22.4 Q67.3 28 67 36.6 Q66.8 43.2 64.3 47.6 Q63 44.2 64.2 39.8 Q65 33.8 63.5 28.8 Q62.5 25.4 62.8 22.4 Z" fill="url(#mo-hair)"/>
    <path class="hair hair-r" d="M63.4 20.6 Q68.6 17.6 71.6 21.2 Q67.4 19.6 64.4 23.2 Z" fill="url(#mo-hair)" opacity=".85"/>
    <path d="M36.6 40 Q34 52 35.4 63 M39.6 36 Q37.6 48 38.8 57 M33.8 48 Q32.4 56 33.4 63" stroke="#b6bcb2" stroke-width=".55" fill="none" opacity=".65"/><!-- strands -->
    <path d="M47.6 19.6 Q51.8 16.4 56.8 16.8 M50 23 Q48.6 28 48.8 33" stroke="#ffffff" stroke-width=".9" fill="none" opacity=".75" stroke-linecap="round"/>
    <path d="M64 26.4 q1 6 .6 11" stroke="#b6bcb2" stroke-width=".55" fill="none" opacity=".6"/>
    <!-- face: solemn, grave-green eyes -->
    <path d="M56.5 23.2 q2.4-1 4.4 .3 M51 23.8 q1.8-.8 3.3 0" stroke="#9aa196" stroke-width=".75" fill="none" stroke-linecap="round"/>
    <circle cx="58.6" cy="26.4" r="2.95" fill="#8ee6a0" opacity=".5" filter="url(#mo-glowSm)"/>
    <circle cx="53.2" cy="26.9" r="2.65" fill="#8ee6a0" opacity=".4" filter="url(#mo-glowSm)"/>
    <circle cx="58.6" cy="26.4" r="1.45" fill="#8ee6a0"/><circle cx="58.8" cy="26" r=".48" fill="#eafff0"/>
    <circle cx="53.2" cy="26.9" r="1.25" fill="#8ee6a0"/><circle cx="53.4" cy="26.5" r=".4" fill="#eafff0"/>
    <path d="M57.3 28.5 q1.5 .5 2.7 -.3 M52.1 28.9 q1.2 .4 2.3 -.2" stroke="#c4bfb1" stroke-width=".45" fill="none" opacity=".5"/><!-- hollow under the eyes -->
    <path d="M60 28.6 q1.1 1.5 -.3 2.4" stroke="#aea899" stroke-width=".6" fill="none" stroke-linecap="round"/><!-- nose -->
    <path d="M56.4 31.9 q1.8 .9 3 -.5" stroke="#6b6459" stroke-width=".95" fill="none" stroke-linecap="round"/><!-- calm mouth -->
    <path d="M50.6 30.2 q.7 2 2.1 3.1" stroke="#c4bfb1" stroke-width=".5" fill="none" opacity=".45"/><!-- far cheek -->
    <!-- front arm, cuff, hand closed on the grip -->
    <path d="M56.4 42.6 Q64.6 45.4 67.4 54.6 L62.4 58.2 Q58.6 49.6 54.2 47.4 Z" fill="url(#mo-sleeve)"/>
    <path d="M56.4 42.6 Q57.6 46.6 54.2 47.4" stroke="#1b2420" stroke-width=".8" fill="none" opacity=".7"/><!-- arm/body separation -->
    <path d="M58.4 46 q3.6 2.4 5.4 6" stroke="#9fc4a2" stroke-width=".5" fill="none" opacity=".45"/>
    <path d="M61.4 53.4 Q65.4 49.8 70.8 52.4 L69.8 60 Q65 61 61.4 58.6 Z" fill="url(#mo-robeD)"/><!-- cuff -->
    <path d="M61.6 55 Q65.6 51.4 70.6 53.8 M62.4 58.4 Q65.8 60.4 69.8 59.4" stroke="url(#mo-trim)" stroke-width=".9" fill="none" stroke-linecap="round"/>
    <path d="M64.8 55.6 v2.2 M63.8 56.6 h2 M68 54.9 v2.2 M67 55.9 h2" stroke="#9fc4a2" stroke-width=".45" opacity=".85"/><!-- cuff crosses -->
    <circle cx="67" cy="56" r="2.7" fill="url(#mo-skin)"/>
    <path d="M65.2 54.6 q1.6 -.8 3.3 .2 M65.2 56.4 q1.6 -.7 3.2 .3" stroke="#aea899" stroke-width=".4" fill="none" opacity=".8"/><!-- fingers -->
    <!-- orb cradle + grave-green orb -->
    <path class="wpn" d="M63.2 20 Q63.8 14.6 60.8 11.2 Q64.8 13.6 65.5 19.8 Z M70.8 20 Q70.2 14.6 73.2 11.2 Q69.2 13.6 68.5 19.8 Z" fill="url(#mo-trim)"/>
    <circle class="wpn" cx="67" cy="15" r="5.4" fill="url(#mo-orb)"/>
    <circle class="wpn" cx="67" cy="15" r="2.9" fill="url(#mo-orbCore)"/>
    <path class="wpn" d="M64.1 13 q1-1.9 3-2.1" stroke="#ffffff" stroke-width="1.1" fill="none" opacity=".85" stroke-linecap="round"/>
    <path class="wpn" d="M64.6 16.4 q2.4-2.4 5 -.6" stroke="#eafff0" stroke-width=".5" fill="none" opacity=".45"/>
    <circle class="wpn" cx="69.4" cy="13.2" r=".45" fill="#ffffff" opacity=".7"/>
  </g>
  <!-- pale moths drawn to the grave-light -->
  <g fill="#f1efe6" opacity=".6" stroke="#f1efe6" stroke-width=".3" stroke-linecap="round">
    <path d="M29 29.8 l-3.6-2.1 l.8 3.2 z M29 29.8 l3.6-2.1 l-.8 3.2 z M28.7 28.9 h.6 l-.3 2.4 z"/><path d="M28.6 28.5 l-1.1-1.3 M29.4 28.5 l1.1-1.3" fill="none"/>
    <path d="M77 65.4 l-2.9-1.7 l.6 2.6 z M77 65.4 l2.9-1.7 l-.6 2.6 z M76.75 64.7 h.5 l-.25 2 z" opacity=".85"/>
  </g>
  <!-- grave-green wisps and motes drifting upward -->
  <g class="wpn" stroke="#8ee6a0" stroke-width=".45" fill="none" opacity=".45" stroke-linecap="round">
    <path d="M28.5 44 q2.6-4 1.2-8.6"/><path d="M30 74 q-2.4-4.6 -.4-9"/><path d="M73.5 36 q2.6-4 1.6-8"/><path d="M63.5 72 q2-4 .6-7.6"/>
  </g>
  <g class="wpn" fill="#8ee6a0"><circle cx="29.5" cy="34.6" r=".85"/><circle cx="33" cy="25" r=".55"/><circle cx="27.8" cy="50" r=".7"/><circle cx="26" cy="70" r=".5"/><circle cx="36" cy="84" r=".45"/>
    <circle cx="74" cy="31" r=".8"/><circle cx="79" cy="20" r=".6"/><circle cx="72" cy="48" r=".5"/><circle cx="76.5" cy="58" r=".65"/><circle cx="58" cy="9.5" r=".55"/><circle cx="81" cy="40" r=".45"/><circle cx="68" cy="80" r=".5"/></g>
  <g class="wpn" fill="#dfffe8" opacity=".85"><circle cx="29.6" cy="47" r=".5"/><circle cx="32.6" cy="41" r=".4"/><circle cx="28" cy="57" r=".45"/><circle cx="31.4" cy="65" r=".4"/><circle cx="72" cy="24" r=".4"/></g><!-- sparks off the coffin seam -->
</svg>
