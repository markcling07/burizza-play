    <!-- clavicles + shoulder girdle -->
    <path d="M52.2 32.4 Q58.4 30.8 63 33.4" stroke="url(#vu-bone)" stroke-width="1.8" fill="none"/>
    <path d="M52.2 32.4 Q48.2 31.4 46.4 33.4" stroke="url(#vu-boneD)" stroke-width="1.6" fill="none"/>
    <ellipse cx="63.4" cy="34.6" rx="2.6" ry="2.7" fill="url(#vu-bone)"/><ellipse cx="47.4" cy="34.4" rx="2.3" ry="2.7" fill="url(#vu-boneD)"/>
    <!-- bow arm: lead arm extended forward to the grip -->
    <path d="M63.4 34.8 L69.2 39 L73.4 41.8" stroke="url(#vu-bone)" stroke-width="2.9" fill="none"/>
