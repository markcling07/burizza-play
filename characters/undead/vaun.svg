<?xml version="1.0" encoding="UTF-8"?>
<!-- Vaun Shroudfletch (ranged) - Undead faction archer. A bare skeleton in a rotted burial
     shroud, ribs snapped out of his own chest to fletch his arrows; no lungs left to shake
     a shot. Weapon is the bone recurve bow with its nocked rib-fletched arrow (class="wpn"),
     gripped at data-hand. Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="74,42">
  <defs>
    <linearGradient id="vu-bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f2e4"/><stop offset=".5" stop-color="#e2dcc4"/><stop offset="1" stop-color="#b0a888"/></linearGradient>
    <linearGradient id="vu-boneD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6ae92"/><stop offset="1" stop-color="#736d56"/></linearGradient>
    <linearGradient id="vu-boneHL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf4"/><stop offset="1" stop-color="#d2cbaf"/></linearGradient>
    <linearGradient id="vu-shroud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e7155"/><stop offset=".5" stop-color="#44523f"/><stop offset="1" stop-color="#222a1f"/></linearGradient>
    <linearGradient id="vu-shroudD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36422f"/><stop offset="1" stop-color="#141a12"/></linearGradient>
    <linearGradient id="vu-wrap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55654d"/><stop offset="1" stop-color="#2a3426"/></linearGradient>
    <radialGradient id="vu-eye" cx=".4" cy=".35" r=".65"><stop offset="0" stop-color="#eaffea"/><stop offset=".45" stop-color="#8ee696"/><stop offset="1" stop-color="#2d7439"/></radialGradient>
    <radialGradient id="vu-socket" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#0c120c"/><stop offset="1" stop-color="#2c3124"/></radialGradient>
    <filter id="vu-glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="vu-glowSm" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation=".7"/></filter>
  </defs>
  <!-- ground shadow + grave bloom -->
  <ellipse cx="54" cy="94" rx="22" ry="3.4" fill="#000" opacity=".35"/>
  <ellipse cx="54" cy="93.4" rx="13" ry="2.6" fill="#8ee696" opacity=".14" filter="url(#vu-glow)"/>
  <!-- drifting grave dust, behind -->
