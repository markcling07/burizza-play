    <path d="M70.6 41.4 Q70 44.6 67.8 46.4 M47.6 40.4 Q46.6 43.6 44.4 45 M63.8 86.6 Q66 88.4 65.6 91.4" stroke="#36422f" stroke-width="1.05" fill="none"/>
