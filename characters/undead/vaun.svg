  <path d="M58.4 26.2 Q61.6 26.8 64.2 24.8" stroke="#c6bfa4" stroke-width=".7" fill="none" opacity=".8"/>
  <path d="M55.6 29.2 Q59.4 31.3 62.9 29.6 L62.7 31.5 Q59.2 33.1 55.4 31 Z" fill="url(#vu-boneHL)"/>
  <path d="M53.8 29.6 Q54.4 34.6 59.6 35.3 Q63.2 35.2 63.5 32.3 L62.7 31.5 Q59.2 33.1 55.4 31 Z" fill="url(#vu-bone)"/>
  <path d="M56.7 30 v1.9 M58.1 30.8 v2 M59.5 31.2 v2 M60.9 31.1 v1.9 M62.1 30.5 v1.8" stroke="#6e6854" stroke-width=".4"/>
  <!-- tattered hood -->
  <path d="M46.8 30.6 Q43.4 12.4 56.4 11 Q67.2 11.6 67.4 20.8 Q63.2 15 56.6 16.6 Q51.2 18.4 51 28.6 L51.6 34.2 L49.8 31.6 L48.6 34 Q46.9 33.2 46.8 30.6 Z" fill="url(#vu-shroud)"/>
  <path d="M51.4 21.4 Q53 16 59.8 16 Q64.6 17.6 66.6 20.6 Q62.4 17 56.6 18.4 Q52.6 19.6 51.4 21.4 Z M53 14.4 Q54.6 12.6 56.6 12.6 Q54.6 13.6 53 14.4 Z" fill="#141a12" opacity=".4"/>
  <path d="M47.4 29.4 Q45.8 20 49.2 13.8" stroke="#6e8263" stroke-width=".8" fill="none" opacity=".55"/>
  <!-- BONE BOW: a pair of ribs lashed into a recurve, grip on data-hand 74,42 -->
  <path class="wpn" d="M68.6 6.6 Q64.6 8.4 66 11.6 Q82 42 66 72.4 Q64.6 75.6 68.6 77.4" stroke="#6b6450" stroke-width="4.4" fill="none" stroke-linecap="round"/>
  <path class="wpn" d="M68.6 6.6 Q64.6 8.4 66 11.6 Q82 42 66 72.4 Q64.6 75.6 68.6 77.4" stroke="url(#vu-bone)" stroke-width="2.7" fill="none" stroke-linecap="round"/>
  <path class="wpn" d="M68.4 13.6 Q76.4 25 78.2 35 M78 49 Q76 59 68.6 70" stroke="#fffdf4" stroke-width=".78" fill="none" stroke-linecap="round" opacity=".6"/>
