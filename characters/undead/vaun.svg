  <g fill="#8ee696" opacity=".4"><circle cx="67" cy="50" r=".55"/><circle cx="52" cy="66" r=".5"/><circle cx="79" cy="30" r=".45"/><circle cx="44" cy="52" r=".6"/><circle cx="71" cy="84" r=".5"/><circle cx="63" cy="8" r=".45"/></g>
  <path d="M57.2 24.8 Q56.4 28 57.6 30.6 M62.6 24.8 Q62.2 27.4 63.2 29.4" stroke="#8ee696" stroke-width=".55" fill="none" opacity=".28" filter="url(#vu-glowSm)"/>
