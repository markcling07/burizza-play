  </g>
  <!-- eye sockets, burning grave-green -->
  <ellipse cx="57.2" cy="22" rx="3.1" ry="2.9" fill="url(#vu-socket)"/><ellipse cx="62.4" cy="22.3" rx="2.7" ry="2.7" fill="url(#vu-socket)"/>
  <circle cx="57.2" cy="22" r="2.4" fill="#8ee696" opacity=".5" filter="url(#vu-glow)"/><circle cx="62.4" cy="22.3" r="2.2" fill="#8ee696" opacity=".45" filter="url(#vu-glow)"/>
