    <path d="M50 25 Q35 39 32 82 L34.5 75 L36.5 86 L39 76.5 L41.5 87 L44 76 L46.5 84 L49 71 L52.5 36 Z" fill="url(#vu-shroudD)"/>
    <path d="M48 28 Q38 42 36 74" stroke="#5e7155" stroke-width=".7" fill="none" opacity=".4"/>
    <path d="M38 54 Q40 51 41.5 54 Q40 57 38 54 Z M35.5 64 Q37 62 38.5 64 Q37 66.5 35.5 64 Z" fill="#101510" opacity=".55"/>
