    <linearGradient id="cd-mantleD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#354539"/><stop offset="1" stop-color="#14201a"/></linearGradient>
    <linearGradient id="cd-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ebe4cc"/><stop offset=".6" stop-color="#cdc4a6"/><stop offset="1" stop-color="#948a70"/></linearGradient>
    <linearGradient id="cd-shaft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8e2ca"/><stop offset=".45" stop-color="#cfc8ad"/><stop offset="1" stop-color="#7f7760"/></linearGradient>
