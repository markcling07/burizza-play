<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadris Gravecall (ranged) - Burizza art v2. Undead faction necromancer. Raises what the
     road leaves behind, and spends it freely. A gaunt revenant - parchment skin drawn tight
     over a lipless skull - in layered bone-white burial wrappings and a dark-green mantle, hung
     with bone-thrift trophies: finger-bone necklace, rib shoulder pieces, belt darts.
     Weapon: fused-vertebrae bone staff with grave-cloth grip, finger-bone cradle and pale-green
     soul orb - shaft, vertebrae, wrapping, cradle, orb, glow and motes all class="wpn",
     grip drawn at data-hand. Canvas 100x100, faces right, feet on y=94. -->
