    <linearGradient id="cd-bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efe9d4"/><stop offset=".5" stop-color="#d6cfb6"/><stop offset="1" stop-color="#9c9479"/></linearGradient>
