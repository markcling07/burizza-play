  <path d="M15 91 q5-3 10-1 M33 87.5 q6-3 12 -.5 M57 85.5 q7-3 13 .5 M78 88 q5-2 9 1.5" stroke="#8a7550" stroke-width=".7" fill="none" opacity=".45"/>
  <path d="M12.5 94.5 q3-7 1-13 M18 93.5 q5-6 4.5-11.5 M86 94.5 q-3-6 -1.5-12 M91 93.5 q-5-5 -4.5-10.5" stroke="#4a3b24" stroke-width=".85" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M24 86 q4-4 9-3 M66 84.5 q5-4 10-2" stroke="#7f9a55" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".55"/>
  <g stroke="none" stroke-linejoin="round" stroke-linecap="round">
