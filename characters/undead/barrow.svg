  <path d="M64.4 58 q4.2-2 8.2 .2 M64.4 61 q4.2-2 8.2 .2 M64.9 64 q3.7-2 7.2 .2" stroke="#6b7360" stroke-width=".75" fill="none" stroke-linecap="round" opacity=".65"/>
