    <path d="M47 42 Q56 39 65 42 L65 49 Q56 52 47 49 Z" fill="url(#bo-skin)"/>
    <path d="M50 45.5 q3-1.5 6 0 M51 48 q3-1.2 5 0" stroke="#8b9279" stroke-width=".6" fill="none" opacity=".6"/>
    <path d="M39.5 46 Q56 39.5 71.5 46 L70.5 54.5 Q56 61 40.5 54.5 Z" fill="url(#bo-ironD)"/>
    <path d="M42.5 48 Q56 43 68.5 48 M43 52 Q56 47.5 68 52" stroke="#6b7360" stroke-width=".7" fill="none" opacity=".5"/>
    <!-- horned great-helm -->
    <path d="M46 44.5 L45.5 28 Q45.5 16.5 56.5 16 Q68 16.5 68.5 28 L69 42.5 Q58 49 46 44.5 Z" fill="url(#bo-iron)"/>
    <path d="M45.5 28 L45.6 17.5 Q48.5 16.2 51.5 16.2 L50.5 45.8 Q47.5 45.4 46 44.5 Z" fill="#262b20" opacity=".5"/><path d="M50 25.8 Q57.5 20.8 66.5 25.2" stroke="#8e977c" stroke-width=".8" fill="none" opacity=".45"/>
    <path d="M46.5 38 q4-3 7 0 q-3 4 -7 1 Z" fill="url(#bo-moss)" opacity=".5"/>
