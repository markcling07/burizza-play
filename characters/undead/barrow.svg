    <path class="wpn2" d="M16.2 30.5 l1.3 5 h-2.6 z M23.7 29 l1.3 5 h-2.6 z M31.2 28.5 l1.3 5 h-2.6 z M38.7 29.5 l1.3 5 h-2.6 z" fill="#8ee696" filter="url(#bo-glow)"/><path class="wpn2" d="M16.2 31.5 l.8 3 h-1.6 z M23.7 30 l.8 3 h-1.6 z M31.2 29.5 l.8 3 h-1.6 z M38.7 30.5 l.8 3 h-1.6 z" fill="#e8ffe8"/>
