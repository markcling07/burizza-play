    <path class="wpn" d="M60 34 l5 -3.5 l4 4.5 l7 -5" fill="none" stroke="#4a4e45" stroke-width="1" stroke-linejoin="round"/><path class="wpn" d="M60 34.6 l5 -3.5 l4 4.5 l7 -5" fill="none" stroke="#a9ab9c" stroke-width=".4" stroke-linejoin="round" opacity=".5"/>
