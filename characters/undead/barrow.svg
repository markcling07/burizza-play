    <path d="M48 22 l2.2 -4 l2.2 4 M55 21.5 l2.2 -4.5 l2.2 4.5 M62 22 l2.2 -4 l2.2 4" fill="url(#bo-bone)"/><rect x="44.8" y="21.5" width="24.4" height="3.8" rx="1.2" fill="url(#bo-bone)"/>
    <g fill="#6f6440"><circle cx="48" cy="23.4" r=".55"/><circle cx="54" cy="23.4" r=".55"/><circle cx="60" cy="23.4" r=".55"/><circle cx="66" cy="23.4" r=".55"/></g>
    <!-- grave-horns -->
    <path d="M46.5 28.5 Q37 26 33 16 Q32 12 34 9.5 Q35.5 17.5 42 21.5 Q45 23.5 48 25 Z M68 27.5 Q76 24.5 79 15.5 Q80 11.5 78 9 Q77 17 71 21 Q68.5 23 66.5 24.5 Z" fill="url(#bo-bone)"/>
