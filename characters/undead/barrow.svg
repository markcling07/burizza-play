    <!-- back pauldron + off arm -->
    <path d="M19 59 Q18 45 31 43.5 Q43 45 44 57 L29 64 Z" fill="url(#bo-ironD)"/>
    <path d="M22 50 Q30 46 39 49.5" stroke="#6b7360" stroke-width=".8" fill="none" opacity=".55"/>
    <path d="M26 59 Q21 67 23 77 L34 78 Q32 68 39 62 Z" fill="url(#bo-ironD)"/>
    <!-- short bowed legs -->
    <path d="M30 71 h17 l-1 11 l-1 8 h-14.5 l1.5 -8 z" fill="url(#bo-ironD)"/>
    <path d="M53 71 h17.5 l2 11 l1 8 h-15 l-2 -8 z" fill="url(#bo-iron)"/>
    <path d="M31 78 h15 M32 83 h14 M54 78 h17.5 M55 83 h17.5" stroke="#262b1e" stroke-width=".7" opacity=".55"/>
    <!-- sabatons, planted -->
    <path d="M26 86.5 h20 q3 0 3.5 7.5 h-26 q0-7.5 2.5-7.5 z" fill="url(#bo-ironD)"/>
    <path d="M54 86.5 h19 q4.5 0 5.5 7.5 h-27 q0-7.5 2.5-7.5 z" fill="url(#bo-iron)"/>
    <path d="M34 88.5 v5.5 M41 88.5 v5.5 M62 88.5 v5.5 M70 88.5 v5.5" stroke="#21261b" stroke-width=".75" opacity=".7"/>
    <path d="M27 91 q5-2 9 1 M56 91 q6-2 10 1" stroke="#5a4a2e" stroke-width="1.2" fill="none" opacity=".5"/>
