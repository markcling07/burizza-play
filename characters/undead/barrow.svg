    <g fill="#8d8257"><circle cx="30" cy="70.5" r=".8"/><circle cx="36.5" cy="70.5" r=".8"/><circle cx="43" cy="70.5" r=".8"/><circle cx="57" cy="70.5" r=".8"/><circle cx="63.5" cy="70.5" r=".8"/><circle cx="70" cy="70.5" r=".8"/></g>
