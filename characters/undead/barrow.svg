<?xml version="1.0" encoding="UTF-8"?>
<!-- Barrow, Lord of the Mound (melee tank) - Burizza art v2. A barrow-wight in the
     grave-plate of a lord nobody remembers: corroded green iron, moss in every
     crevice, barrow earth packed in the joints, a burial shroud hanging in rags.
     Main hand hoists a cracked HEADSTONE as a club - class="wpn".
     Off hand carries a torn-off section of iron GRAVEYARD FENCE - class="wpn2".
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="68,60">
  <defs>
    <linearGradient id="bo-iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#848c72"/><stop offset=".5" stop-color="#5c6350"/><stop offset="1" stop-color="#343a2c"/></linearGradient>
    <linearGradient id="bo-ironD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e5543"/><stop offset="1" stop-color="#21261b"/></linearGradient>
    <linearGradient id="bo-bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe3b7"/><stop offset=".5" stop-color="#c7b98a"/><stop offset="1" stop-color="#8a7e52"/></linearGradient>
    <linearGradient id="bo-shroud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d4439"/><stop offset=".55" stop-color="#2b302a"/><stop offset="1" stop-color="#0f1209"/></linearGradient>
    <linearGradient id="bo-skin" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#d4dac2"/><stop offset=".5" stop-color="#b9c0a6"/><stop offset="1" stop-color="#8b9279"/></linearGradient>
    <linearGradient id="bo-stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#adaf9f"/><stop offset=".55" stop-color="#83867a"/><stop offset="1" stop-color="#53564d"/></linearGradient>
    <linearGradient id="bo-rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#929a87"/><stop offset=".45" stop-color="#4e5446"/><stop offset="1" stop-color="#242820"/></linearGradient>
    <linearGradient id="bo-moss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ebb6d"/><stop offset=".6" stop-color="#7f9a55"/><stop offset="1" stop-color="#4f6430"/></linearGradient>
    <linearGradient id="bo-earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f5e40"/><stop offset="1" stop-color="#2d2517"/></linearGradient>
    <radialGradient id="bo-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f0fff0"/><stop offset=".4" stop-color="#8ee696"/><stop offset="1" stop-color="#2e7a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="bo-mist" cx=".5" cy=".85" r=".6"><stop offset="0" stop-color="#8ee696" stop-opacity=".28"/><stop offset="1" stop-color="#8ee696" stop-opacity="0"/></radialGradient>
    <filter id="bo-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="bo-haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <!-- ground shadow + grave mist (he is enormous) -->
  <ellipse cx="50" cy="94" rx="36" ry="4.8" fill="#000" opacity=".42"/>
  <ellipse cx="50" cy="92" rx="28" ry="4.2" fill="url(#bo-mist)" filter="url(#bo-haze)"/>
  <!-- the opened mound he clawed out of -->
