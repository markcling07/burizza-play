    <rect class="wpn" x="65.2" y="37" width="5.8" height="26" rx="1.8" fill="url(#bo-stone)"/>
    <path class="wpn" d="M60 43 L60 24 Q60 11 68 11 Q76 11 76 24 L76 43 Q68 46.5 60 43 Z" fill="url(#bo-stone)"/>
