  <g fill="url(#bo-eye)" opacity=".95"><ellipse cx="56.4" cy="32.5" rx="3.8" ry="3.3"/><ellipse cx="63" cy="32.7" rx="4.2" ry="3.5"/></g>
  <circle cx="56.4" cy="32.5" r="1.4" fill="#8ee696" filter="url(#bo-glow)"/><circle cx="63" cy="32.7" r="1.6" fill="#8ee696" filter="url(#bo-glow)"/>
  <circle cx="56.4" cy="32.5" r=".65" fill="#eaffea"/><circle cx="63" cy="32.7" r=".75" fill="#eaffea"/>
  <g stroke="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- huge front pauldron -->
    <path d="M58 57 Q58 43 70 41.5 Q83 43 83 56.5 L68 64 Z" fill="url(#bo-iron)"/>
    <path d="M61 48.5 Q70.5 44.5 80 48.5" stroke="#8e977c" stroke-width=".9" fill="none" opacity=".5"/>
    <path d="M62 54 q5-3 9 0 q-4 4 -9 1 Z" fill="url(#bo-moss)" opacity=".55"/>
    <g fill="#8d8257"><circle cx="63" cy="51.5" r=".7"/><circle cx="70" cy="50" r=".7"/><circle cx="77" cy="51.5" r=".7"/></g>
    <!-- front arm -->
    <path d="M61 55 Q74 55 78.5 62.5 L72 69.5 L59 62 Z" fill="url(#bo-iron)"/>
    <path d="M65 58.5 q5.5 .5 8.5 3.5" stroke="#3a4131" stroke-width=".7" fill="none" opacity=".5"/>
  </g>
