      <rect class="wpn" x="56" y="20" width="20" height="4" fill="url(#dg-steelD)"/>
      <rect class="wpn" x="54" y="13.5" width="3.5" height="17" rx="1" fill="url(#dg-steelD)"/>
      <rect class="wpn" x="74.5" y="13.5" width="3.5" height="17" rx="1" fill="url(#dg-steelD)"/>
