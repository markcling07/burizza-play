      <path class="wpn" d="M65 17 l1.5 2 l1.5 -2 v4" stroke="#d4dae6" stroke-width=".7" fill="none" opacity=".5"/>
      <path class="wpn" d="M71 17 v4 h2" stroke="#d4dae6" stroke-width=".7" fill="none" opacity=".5"/>
