<?xml version="1.0" encoding="UTF-8"?>
<!-- Durgan Anvilbeard (melee) - Ashfall Road art v2. Dwarf hammer warrior.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66,62">
  <defs>
    <linearGradient id="dg-leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7650"/><stop offset=".5" stop-color="#6b4f32"/><stop offset="1" stop-color="#3d2c1b"/></linearGradient>
    <linearGradient id="dg-leatherD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c442b"/><stop offset="1" stop-color="#2e2116"/></linearGradient>
    <linearGradient id="dg-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f5fa"/><stop offset=".5" stop-color="#b4bccb"/><stop offset="1" stop-color="#6a7285"/></linearGradient>
    <linearGradient id="dg-steelD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa3b5"/><stop offset="1" stop-color="#4c5366"/></linearGradient>
    <linearGradient id="dg-beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e07a44"/><stop offset=".55" stop-color="#b5562b"/><stop offset="1" stop-color="#7c3517"/></linearGradient>
    <linearGradient id="dg-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6b42"/><stop offset="1" stop-color="#5a3b22"/></linearGradient>
    <linearGradient id="dg-bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf5e4"/><stop offset="1" stop-color="#c2b08a"/></linearGradient>
    <linearGradient id="dg-ironCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a919e"/><stop offset="1" stop-color="#4a5060"/></linearGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="26" ry="3.8" fill="#000" opacity=".38"/>
