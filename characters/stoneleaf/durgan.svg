  <path d="M56 42.8 l1 -.8 M59 42.2 l1 .3" stroke="#9a4a20" stroke-width=".6" stroke-linecap="round" opacity=".5"/>
  <!-- helm / pauldron / torso highlights -->
  <path d="M45 35.5 Q47 31.8 52 31.2" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M61 54.5 q3 -1.6 6.5 -.4" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M34 56 Q47 50.5 57 51" stroke="#c49a6a" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/>
</svg>
