<?xml version="1.0" encoding="UTF-8"?>
<!-- Aelira Swiftwind (ranged) - Ashfall Road art v2. Elf longbow archer.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="tunic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fa070"/><stop offset=".5" stop-color="#3f7a4f"/><stop offset="1" stop-color="#23472d"/></linearGradient>
    <linearGradient id="tunicD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f5e3c"/><stop offset="1" stop-color="#18321f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e9b8"/><stop offset=".5" stop-color="#d9c58a"/><stop offset="1" stop-color="#9d8a52"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf3cf"/><stop offset=".5" stop-color="#e8d9a0"/><stop offset="1" stop-color="#b3a065"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c08a56"/><stop offset="1" stop-color="#6e4826"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93683f"/><stop offset="1" stop-color="#4f3420"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f5fa"/><stop offset="1" stop-color="#7d8698"/></linearGradient>
  </defs>
  <ellipse cx="52" cy="94" rx="22" ry="3.6" fill="#000" opacity=".35"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- flowing hair -->
    <path d="M48 17 Q37 25 38.5 52 Q44 48 47.5 41 L51 26 Z" fill="url(#hair)"/>
    <!-- quiver -->
    <g transform="rotate(-20 42 46)">
      <path d="M40 28.5 l-1.5 -5 l3 2.5 l3 -2.5 l-1.5 5 z" fill="#f2efe4" stroke-width="1.1"/>
      <rect x="38" y="30" width="8" height="24" rx="2" fill="url(#leather)"/>
      <rect x="37.6" y="33" width="8.8" height="2.6" fill="url(#gold)" stroke-width="1"/>
    </g>
    <!-- legs + boots -->
    <path d="M48 64 h5.5 l-.5 24 h-5 z" fill="#3b3a2c"/>
    <path d="M45.5 87.5 h7.5 v6 h-9 z" fill="#4a3020"/>
    <path d="M55 64 h5.5 l1.5 24 h-5.5 z" fill="#4c4a38"/>
    <path d="M56 87.5 h6.5 l3.5 6 h-10.5 z" fill="#6a4529"/>
    <!-- tunic -->
    <path d="M46 35 Q54 32 62 35 L63 57 L65.5 71 Q54 74 43.5 71 L46 57 Z" fill="url(#tunic)"/>
    <path d="M44.5 67.5 Q54 70.5 65 67.5 L65.5 71 Q54 74 43.5 71 Z" fill="url(#gold)"/>
    <rect x="45.5" y="54" width="18" height="3.6" rx="1" fill="url(#gold)"/>
    <!-- head -->
    <circle cx="55" cy="22" r="8.5" fill="#f0d2b4"/>
    <path d="M46.5 25 Q45.5 12.5 55.5 12.5 Q64 12.5 64 20 Q58 16.8 52.5 18.5 Q50 20 50 28.5 Z" fill="url(#hair)"/>
    <!-- long ear -->
    <path d="M48.5 22.5 Q42 17 36 12 Q41 21.5 48.5 27 Z" fill="#f0d2b4"/>
    <!-- bow arm (far) -->
    <path d="M57 37 L78 39 L78 43.5 L57 43.5 Z" fill="url(#tunicD)"/>
  </g>
  <!-- longbow -->
  <path d="M71 6 Q91 41 71 77" stroke="#15121d" stroke-width="4.6" fill="none" stroke-linecap="round"/>
  <path d="M71 6 Q91 41 71 77" stroke="url(#wood)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M73.5 12 Q80 22 82 30" stroke="#ecc590" stroke-width="1" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M71.3 7 L57.5 41 L71.3 76" stroke="#f2ecdc" stroke-width=".9" fill="none" stroke-linejoin="round"/>
  <!-- arrow -->
  <path d="M53 41 H90" stroke="#15121d" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M53 41 H90" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M89 38.3 L95.5 41 L89 43.7 Z" fill="url(#steel)" stroke="#15121d" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M51 38 h5 l2 3 l-2 3 h-5 l2 -3 z" fill="#f2efe4" stroke="#15121d" stroke-width="1" stroke-linejoin="round"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- bow hand -->
    <rect x="76.5" y="37.6" width="5" height="7" rx="2.4" fill="#f0d2b4"/>
    <!-- draw arm (near) -->
    <path d="M52.5 35.5 Q45 36.5 44.5 41 Q46.5 45.5 58 44 L58 39 Z" fill="url(#tunic)"/>
    <circle cx="58.3" cy="41.2" r="2.6" fill="#f0d2b4"/>
  </g>
  <!-- circlet + face -->
  <path d="M50.5 18 Q56 15.5 63.5 18" stroke="url(#gold)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="57" cy="16.6" r="1.1" fill="#7fe0a0" stroke="#15121d" stroke-width=".6"/>
  <path d="M58.4 22.6 q1.4 -1 2.8 0 q-1.4 1 -2.8 0 z" fill="#1d2130" stroke="#1d2130" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M57.8 20.2 q1.8 -.9 3.8 -.1" stroke="#a89452" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M59.5 27.2 q1.3 .6 2.6 -.1" stroke="#b97a64" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <circle cx="60.3" cy="25" r="1.2" fill="#f2a08a" opacity=".45"/>
  <!-- tunic details -->
  <path d="M54.5 36 V54" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M48 39 Q49.5 36.5 52 35.8" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M40.5 30 Q40 40 41.5 47" stroke="#fffbe6" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".75"/>
</svg>
