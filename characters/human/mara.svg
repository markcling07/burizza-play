<?xml version="1.0" encoding="UTF-8"?>
<!-- Mara Holt (ranged) - Ashfall Road art v2. Musketeer with a steady hand.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a6c96"/><stop offset="1" stop-color="#1f324b"/></linearGradient>
    <linearGradient id="coatD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f4a6b"/><stop offset="1" stop-color="#18263a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ead08e"/><stop offset="1" stop-color="#a77f3a"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a0714a"/><stop offset="1" stop-color="#5e3f26"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b93a6"/><stop offset="1" stop-color="#3a3f4f"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4058"/><stop offset="1" stop-color="#1c1f2c"/></linearGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ponytail -->
    <path d="M43 27 Q34 30 35 42 Q39 37 44 34 Z" fill="#5a3520"/>
    <!-- legs + boots -->
    <path d="M42 70 h7.5 l-1 12 h-7.5 z" fill="#2a2f3f"/>
    <path d="M40 80 h9 v8 l1 5.5 h-12 l1 -5.5 z" fill="#5a3a26"/>
    <path d="M51 70 h7.5 l2 12 h-7.5 z" fill="#353b4f"/>
    <path d="M53 80 h9 l1 8 l2 5.5 h-12.5 l.5 -5.5 z" fill="#6e4a30"/>
    <!-- coat with tails -->
    <path d="M38 43 Q50 39 61 43 L62 66 L61 80 L46 76 Q40 81 33 80 L38 64 Z" fill="url(#coat)"/>
    <path d="M38 64 L33 80 Q40 81 46 76 L44 66 Z" fill="url(#coatD)"/>
    <rect x="38" y="62" width="23.5" height="4" rx="1" fill="#5e3f26"/>
    <rect x="47" y="61.5" width="5" height="5" rx="1" fill="url(#gold)"/>
    <!-- bandolier -->
    <path d="M41 44 L60 62 L57 64.5 L38.5 47 Z" fill="#6e4a30"/>
    <!-- back arm reaching to the barrel -->
    <path d="M41 45 L68 47 L68 53 L43 53 Z" fill="url(#coatD)"/>
    <!-- head -->
    <circle cx="52" cy="31" r="9.5" fill="#c68f6a"/>
    <path d="M42.5 32 Q41.5 21 51 21 Q59 21 61 27 Q55 24.5 49 26 Q45 28 45 36 Z" fill="#5a3520"/>
    <!-- tricorn -->
    <path d="M44 22 Q44.5 12 52.5 12 Q60 12 60.5 21.5 Z" fill="url(#hat)"/>
    <path d="M37 24 Q50 15 66 23 Q59 21.5 52 22 Q44 22.5 37 24 Z" fill="url(#hat)"/>
  </g>
  <!-- hat trim + feather -->
  <path d="M38.5 23.5 Q50 16.5 64.5 22.6" stroke="url(#gold)" stroke-width="1.3" fill="none"/>
  <path d="M46 15 Q36 9 29 15 Q37 13.5 45 18 Z" fill="#e9e4d8" stroke="#15121d" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M45 16.5 Q38 13 32 14.5" stroke="#c9c2b2" stroke-width=".8" fill="none"/>
  <!-- face -->
  <circle cx="57.5" cy="30.5" r="1.5" fill="#1d2130"/>
  <path d="M55.4 27.6 l4 -.5" stroke="#3a2214" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M57.5 36 h3" stroke="#8a5a40" stroke-width=".9" stroke-linecap="round"/>
  <!-- coat details -->
  <path d="M55 44 L58 62" stroke="url(#gold)" stroke-width="1.5"/>
  <g fill="url(#gold)" stroke="#15121d" stroke-width=".6"><circle cx="56.6" cy="48" r="1.1"/><circle cx="57.2" cy="53" r="1.1"/><circle cx="57.8" cy="58" r="1.1"/></g>
  <g fill="url(#gold)"><rect x="43.3" y="47.2" width="1.8" height="2.6" rx=".4" transform="rotate(43 44.2 48.5)"/><rect x="47.3" y="51" width="1.8" height="2.6" rx=".4" transform="rotate(43 48.2 52.3)"/><rect x="51.3" y="54.8" width="1.8" height="2.6" rx=".4" transform="rotate(43 52.2 56.1)"/></g>
  <path d="M33.5 79 Q40 80 45.5 75.5" stroke="url(#gold)" stroke-width="1.3" fill="none"/>
  <!-- musket -->
  <g transform="rotate(-5 56 50)" stroke="#15121d" stroke-width="1.3" stroke-linejoin="round">
    <path d="M45 46.5 L59 48.5 L59 52.5 L47.5 56 Q43.5 52.5 45 46.5 Z" fill="url(#wood)"/>
    <rect x="59" y="50.8" width="24" height="2.8" fill="url(#wood)"/>
    <rect x="59" y="47.8" width="35" height="3.4" rx=".8" fill="url(#iron)"/>
    <rect x="67" y="48" width="1.8" height="5.4" fill="url(#gold)" stroke-width=".8"/>
    <rect x="77" y="48" width="1.8" height="5.4" fill="url(#gold)" stroke-width=".8"/>
    <path d="M59 48.5 l1.5 -3 h2.5 l-.5 3 z" fill="url(#iron)"/>
    <path d="M60 53 q1.5 3 3.5 1" fill="none" stroke-width="1"/>
  </g>
  <!-- hands -->
  <circle cx="70" cy="49" r="2.7" fill="#c68f6a" stroke="#15121d" stroke-width="1.2"/>
  <path d="M56 44 L63 47 L62 56 L56 55 Z" fill="url(#coat)" stroke="#15121d" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="60.5" cy="55" r="2.5" fill="#c68f6a" stroke="#15121d" stroke-width="1.2"/>
  <!-- muzzle wisp -->
  <path d="M94 44.5 q2 -2 1 -4.5 q2.5 1 2.5 -2" stroke="#c9c2b2" stroke-width="1.2" fill="none" opacity=".7" stroke-linecap="round"/>
</svg>
