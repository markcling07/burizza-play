    <circle class="wpn" cx="66.2" cy="40" r="1" fill="none" stroke="#2080c8" stroke-width=".7"/><!-- rune: ring -->
    <path class="wpn" d="M65.2 40 h2 M66.2 39 v2" stroke="#2080c8" stroke-width=".5"/>
    <path class="wpn" d="M65.5 44 v3 h1.4 v-3" stroke="#2080c8" stroke-width=".6" fill="none" stroke-linecap="round"/><!-- rune: bracket -->
    <path class="wpn" d="M66.2 49 l-1 1.5 l2 0 l-1 1.5" stroke="#2080c8" stroke-width=".7" fill="none" stroke-linecap="round"/><!-- rune: zigzag -->
    <path class="wpn" d="M66.2 27 v4 M65 29 h2.4" stroke="#60c0ff" stroke-width="1.5" opacity=".25" filter="url(#wr-glowSm)"/>
    <!-- cross-guard + gem -->
    <rect class="wpn" x="59" y="56.5" width="14.5" height="3.4" rx="1.5" fill="url(#wr-gold)"/>
    <circle class="wpn" cx="59.8" cy="58.2" r="1" fill="#ffe6a0" opacity=".6"/><circle class="wpn" cx="72.7" cy="58.2" r="1" fill="#ffe6a0" opacity=".6"/>
    <path class="wpn" d="M62 57.5 h8.5" stroke="#8a6010" stroke-width=".3" opacity=".5"/>
    <circle class="wpn" cx="66.2" cy="58.2" r="1.2" fill="#7fd3ff"/><circle class="wpn" cx="66.2" cy="58.2" r=".5" fill="#fff" opacity=".6"/>
    <!-- grip + pommel -->
