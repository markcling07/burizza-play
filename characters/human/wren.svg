    <path d="M39 55 Q36 68 32 80" stroke="#5570a0" stroke-width=".4" fill="none" opacity=".3"/>
    <path d="M38 58 Q37 62 35 66 M40 65 Q39 70 37 75 M36 72 Q35 77 33 82" stroke="#2a4080" stroke-width=".35" fill="none" opacity=".25"/>
