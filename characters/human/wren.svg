    <path d="M54 31 Q56 29 56 27 L58 27 Q58 30 55 33 Z" fill="url(#wr-steelD)" opacity=".7"/>
    <path d="M52 23 v8" stroke="#a0aabf" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M51.3 28 h1.4" stroke="#a0aabf" stroke-width=".8"/>
