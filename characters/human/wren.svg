    <path class="wpn" d="M64.8 61 h2.8 M64.8 62.5 h2.8 M64.8 64 h2.8 M64.8 65.5 h2.8" stroke="#5a3520" stroke-width=".5"/>
    <circle class="wpn" cx="66.2" cy="68.5" r="2" fill="url(#wr-gold)"/><circle class="wpn" cx="66.2" cy="68.5" r=".8" fill="#ffe6a0" opacity=".5"/>
  </g>
  <!-- arcane sparks -->
  <g class="wpn" fill="#c8efff">
    <path d="M80 15 l.8 2.2 l2.2 .8 l-2.2 .8 l-.8 2.2 l-.8 -2.2 l-2.2 -.8 l2.2 -.8 z"/>
    <path d="M91 33 l.6 1.6 l1.6 .6 l-1.6 .6 l-.6 1.6 l-.6 -1.6 l-1.6 -.6 l1.6 -.6 z"/>
    <path d="M73 26 l.5 1.3 l1.3 .5 l-1.3 .5 l-.5 1.3 l-.5 -1.3 l-1.3 -.5 l1.3 -.5 z"/>
    <path d="M86 22 l.4 1 l1 .4 l-1 .4 l-.4 1 l-.4 -1 l-1 -.4 l1 -.4 z" opacity=".6"/>
  </g>
</svg>
