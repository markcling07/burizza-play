    <path d="M58 47 L66 58 L62 62 L55 52 Z" fill="url(#wr-steel)"/>
    <path d="M57 50 L63 59" stroke="#7882a0" stroke-width=".4" opacity=".4"/>
    <circle cx="64.5" cy="59.5" r="3.4" fill="url(#wr-steel)"/>
    <path d="M62 60 Q62 62 63 63 M63 59.5 Q63.5 62 64 63.5 M64.5 59 Q65 62 65.5 63 M66 59.5 Q66 61.5 66.5 62.5" stroke="#8892a8" stroke-width=".5" fill="none"/>
