<?xml version="1.0" encoding="UTF-8"?>
<!-- Wren (melee) - Ashfall Road art v3. Spellblade of the Aldmere guard.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="65,60">
  <defs>
    <linearGradient id="wr-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f4fa"/><stop offset=".3" stop-color="#c8d0e0"/><stop offset=".65" stop-color="#a0aabf"/><stop offset="1" stop-color="#5c6678"/></linearGradient>
    <linearGradient id="wr-steelD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#95a0b8"/><stop offset=".4" stop-color="#727e96"/><stop offset="1" stop-color="#3e4860"/></linearGradient>
    <linearGradient id="wr-cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a72c4"/><stop offset=".35" stop-color="#3b5fb0"/><stop offset=".7" stop-color="#2a4590"/><stop offset="1" stop-color="#162050"/></linearGradient>
    <linearGradient id="wr-lining" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3040"/><stop offset="1" stop-color="#3a1525"/></linearGradient>
    <linearGradient id="wr-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a0"/><stop offset=".3" stop-color="#f0c560"/><stop offset=".7" stop-color="#c8901f"/><stop offset="1" stop-color="#8a6010"/></linearGradient>
    <linearGradient id="wr-blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#c8edff"/><stop offset=".75" stop-color="#80c8f0"/><stop offset="1" stop-color="#5ab0e8"/></linearGradient>
    <linearGradient id="wr-bladeCore" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b0e0ff"/></linearGradient>
    <linearGradient id="wr-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c8a0"/><stop offset=".5" stop-color="#e2b48f"/><stop offset="1" stop-color="#c89870"/></linearGradient>
    <linearGradient id="wr-boot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3e52"/><stop offset=".5" stop-color="#3a3346"/><stop offset="1" stop-color="#2a2030"/></linearGradient>
    <filter id="wr-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="wr-glowSm" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/><!-- ground shadow -->
