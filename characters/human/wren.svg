    <path class="wpn" d="M64.4 57 V25 L66.2 20.5 L68 25 V57 Z" fill="url(#wr-blade)"/>
    <path class="wpn" d="M66.2 23 V55" stroke="url(#wr-bladeCore)" stroke-width="1" opacity=".5"/>
    <path class="wpn" d="M64.6 26 V55" stroke="#fff" stroke-width=".3" opacity=".5"/>
    <path class="wpn" d="M67.8 26 V55" stroke="#80c8f0" stroke-width=".3" opacity=".4"/>
    <path class="wpn" d="M66.2 27 v4 M65 29 h2.4" stroke="#2080c8" stroke-width=".8" stroke-linecap="round"/><!-- rune: cross -->
