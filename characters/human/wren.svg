<?xml version="1.0" encoding="UTF-8"?>
<!-- Wren (melee) - Ashfall Road art v2. Spellblade of the Aldmere guard.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2f8"/><stop offset=".5" stop-color="#a9b3c6"/><stop offset="1" stop-color="#646e84"/></linearGradient>
    <linearGradient id="steelD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b95aa"/><stop offset="1" stop-color="#4a5367"/></linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f63b5"/><stop offset="1" stop-color="#1d2b5e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#c27d1f"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fdcff"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- cape -->
    <path d="M43 41 Q33 60 26 87 Q36 90 45 85 L51 46 Z" fill="url(#cape)"/>
    <!-- back arm -->
    <circle cx="41" cy="46" r="5" fill="url(#steelD)"/>
    <!-- legs -->
    <path d="M42 71 h8 l-1 18 h-8 z" fill="url(#steelD)"/>
    <path d="M38 88 h11.5 v5.5 h-12.5 z" fill="#3a3346"/>
    <path d="M51 71 h8 l3 18 h-8 z" fill="url(#steel)"/>
    <path d="M53 88 h11.5 l1.5 5.5 h-13 z" fill="#3a3346"/>
    <!-- torso -->
    <path d="M38 44 Q50 39 62 44 L61 70 Q50 74 39 70 Z" fill="url(#steel)"/>
    <path d="M46 44 h8 v31 l-4 4 l-4 -4 z" fill="url(#cape)"/>
    <rect x="38" y="64" width="24" height="4.5" rx="1" fill="url(#gold)"/>
    <rect x="47.5" y="63.5" width="5" height="5.5" rx="1" fill="#7fd3ff"/>
    <!-- head + open helm -->
    <circle cx="52" cy="30" r="9.5" fill="#e2b48f"/>
    <path d="M47 17 Q39 7 29 11 Q36 13 41 20 Z" fill="#e8a548"/>
    <path d="M40.5 34 Q39 16.5 51.5 16.5 Q63 16.5 63 27 L55 27 Q53 27.5 52.5 31 L53 37 Q46 41 41.5 37 Z" fill="url(#steel)"/>
    <!-- front arm -->
    <path d="M58 47 L66 58 L62 62 L55 52 Z" fill="url(#steel)"/>
    <circle cx="60" cy="46" r="6.2" fill="url(#steel)"/>
  </g>
  <!-- helm + face details -->
  <path d="M44 19.5 Q51 14.5 59 18" stroke="url(#gold)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="57.5" cy="30" r="1.5" fill="#1d2130"/>
  <path d="M55.5 27.2 h4" stroke="#6b4a33" stroke-width="1" stroke-linecap="round"/>
  <path d="M58 35.2 q1.6 .6 3 -.3" stroke="#a5705a" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M50 50 l2.4 3 l-2.4 3 l-2.4 -3 z" fill="url(#gold)"/>
  <path d="M41 47.5 Q43.5 44.5 46 44.5" stroke="#fff" stroke-width="1.3" opacity=".7" fill="none" stroke-linecap="round"/>
  <path d="M57 43.5 q2.5 -1.5 5 0" stroke="#fff" stroke-width="1.2" opacity=".75" fill="none" stroke-linecap="round"/>
  <!-- glowing spellblade -->
  <g transform="rotate(32 66 60)">
    <rect x="63" y="20" width="6.5" height="40" rx="3" fill="#6fd0ff" opacity=".85" filter="url(#glow)"/>
    <path d="M64.4 57 V25 L66.2 20.5 L68 25 V57 Z" fill="url(#blade)" stroke="#15121d" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M66.2 28 v3 M66.2 35 v3 M66.2 42 v3 M66.2 49 v3" stroke="#2f8fd8" stroke-width="1.1" stroke-linecap="round"/>
    <rect x="59" y="56.5" width="14.5" height="3.4" rx="1.5" fill="url(#gold)" stroke="#15121d" stroke-width="1.1"/>
    <rect x="64.8" y="59.9" width="2.8" height="7" fill="#6b4630" stroke="#15121d" stroke-width="1"/>
    <circle cx="66.2" cy="68.5" r="2" fill="url(#gold)" stroke="#15121d" stroke-width="1"/>
  </g>
  <circle cx="64.5" cy="59.5" r="3.4" fill="url(#steel)" stroke="#15121d" stroke-width="1.4"/>
  <!-- arcane sparks -->
  <g fill="#c8efff">
    <path d="M80 15 l.8 2.2 l2.2 .8 l-2.2 .8 l-.8 2.2 l-.8 -2.2 l-2.2 -.8 l2.2 -.8 z"/>
    <path d="M91 33 l.6 1.6 l1.6 .6 l-1.6 .6 l-.6 1.6 l-.6 -1.6 l-1.6 -.6 l1.6 -.6 z"/>
    <path d="M73 26 l.5 1.3 l1.3 .5 l-1.3 .5 l-.5 1.3 l-.5 -1.3 l-1.3 -.5 l1.3 -.5 z"/>
  </g>
</svg>
