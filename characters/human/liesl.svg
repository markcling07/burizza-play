    <path d="M36.5 64 h8 v10 h-8 z" fill="url(#li-book)"/>
    <path d="M37 65 h1.5 v8 h-1.5 z" fill="#f0e8d8"/><path d="M37 65 v8" stroke="#5a1a25" stroke-width=".4"/>
    <rect x="42.5" y="67.5" width="1.5" height="2" rx=".3" fill="url(#li-gold)"/>
    <path d="M40 64 v-2 q1 1 2 0" stroke="#c8673a" stroke-width=".7" fill="none"/>
    <path d="M40.5 66 v4 M39 68 h3" stroke="url(#li-gold)" stroke-width=".8" stroke-linecap="round"/>
    <!-- staff: twisted golden shaft -->
    <rect class="wpn" x="65" y="27" width="3.4" height="65" rx="1" fill="url(#li-staff)"/>
    <path class="wpn" d="M65.5 32 q1.7 2 3 0 M65.5 38 q1.7 2 3 0 M65.5 44 q1.7 2 3 0 M65.5 50 q1.7 2 3 0 M65.5 56 q1.7 2 3 0 M65.5 62 q1.7 2 3 0 M65.5 68 q1.7 2 3 0 M65.5 74 q1.7 2 3 0 M65.5 80 q1.7 2 3 0" stroke="#b8861f" stroke-width=".6" fill="none"/>
    <!-- staff filigree + gem mount -->
    <path class="wpn" d="M64 26 q2.7-2 5.4 0" stroke="url(#li-gold)" stroke-width="1" fill="none"/>
    <path class="wpn" d="M64.5 25 q2.2-1.5 4.4 0" stroke="#f0c85a" stroke-width=".6" fill="none"/>
    <circle class="wpn" cx="66.7" cy="28" r="1.8" fill="url(#li-gold)"/><circle class="wpn" cx="66.7" cy="28" r="1" fill="#e04040"/>
    <rect class="wpn" x="64.5" y="90" width="4.4" height="2" rx=".5" fill="url(#li-gold)"/>
    <!-- head -->
    <circle cx="52.5" cy="30" r="9" fill="#f0c9a6"/>
    <!-- veil/wimple with fabric folds -->
    <path d="M42.5 34 Q40 17 52.5 17 Q63 17 63 27 Q60 22 54 22.5 Q48.5 23 47.5 31 L48 40 Q44 40 42.5 34 Z" fill="url(#li-veil)"/>
    <path d="M44 28 Q45 24 48 23" stroke="#ddd6c6" stroke-width=".6" fill="none"/>
    <path d="M43 33 Q44 30 46 28" stroke="#ddd6c6" stroke-width=".5" fill="none"/>
    <!-- gold circlet + gem -->
    <path d="M47.6 31 Q48.5 23 54 22.5 Q60 22 63 27" stroke="url(#li-gold)" stroke-width="1.8" fill="none"/>
    <circle cx="55" cy="22.5" r="1" fill="#e04040"/>
    <!-- wimple under chin -->
    <path d="M48 37 Q50 40 55 39 Q53 41 48 40 Z" fill="url(#li-veil)"/>
    <!-- face: hair, eye, brow, nose, smile, blush -->
    <path d="M51 23.5 Q55 22 58.5 24.5 Q55 24.6 53 27 Q52 25 51 23.5 Z" fill="#c9a25e"/>
    <ellipse cx="57.6" cy="30" rx="1.6" ry="1.5" fill="#fff"/>
    <circle cx="58" cy="30.2" r="1" fill="#6b4a20"/><circle cx="58.2" cy="29.9" r=".4" fill="#fff"/>
    <path d="M55.5 27.6 q2.5-1 4 0" stroke="#a07b3e" stroke-width=".8" fill="none" stroke-linecap="round"/>
    <path d="M59.5 32 q.5 1 0 2" stroke="#d4a88a" stroke-width=".6" fill="none" stroke-linecap="round"/>
    <path d="M57.5 35 q2 1.5 3.5 .5" stroke="#b97a64" stroke-width=".8" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="33" r="1.6" fill="#f2a08a" opacity=".4"/>
    <!-- front arm + sleeve detail -->
    <path d="M56 44 Q64 46 67 57 L62 60 Q57 52 54 50 Z" fill="url(#li-robe)"/>
    <path d="M62 59 Q60 55 58 52" stroke="#e8d8b8" stroke-width="1.2" fill="none"/>
    <path d="M56 44 Q54 49 54 50" stroke="url(#li-gold)" stroke-width=".8" fill="none"/>
    <path d="M43 46 Q45 44 48 43.5" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- hand -->
    <circle cx="66.7" cy="58" r="2.8" fill="#f0c9a6"/>
    <!-- sun disc: outer ring, main, inner ring, face -->
    <circle class="wpn" cx="66.7" cy="19" r="7.5" fill="none" stroke="#f2c45a" stroke-width="1.2"/>
    <circle class="wpn" cx="66.7" cy="19" r="6.5" fill="url(#li-sun)"/>
    <circle class="wpn" cx="66.7" cy="19" r="4" fill="none" stroke="#f5d878" stroke-width=".7"/>
    <circle class="wpn" cx="66.7" cy="19" r="2.2" fill="#fffcf0"/>
    <path class="wpn" d="M65.5 18.5 q1.2 .6 2.4 0" stroke="#f0c85a" stroke-width=".6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- sun rays -->
  <g class="wpn" stroke="#f2c45a" stroke-linecap="round">
    <path d="M66.7 7 v4" stroke-width="1.8"/><path d="M66.7 27 v4" stroke-width="1.8"/>
    <path d="M55 19 h4" stroke-width="1.8"/><path d="M74.4 19 h4" stroke-width="1.8"/>
    <path d="M58.5 11 l2.5 2.5" stroke-width="1.6"/><path d="M72.4 24.5 l2.5 2.5" stroke-width="1.6"/>
    <path d="M58.5 27 l2.5-2.5" stroke-width="1.6"/><path d="M72.4 13.5 l2.5-2.5" stroke-width="1.6"/>
    <path d="M62 9.5 l1.5 1.5" stroke-width="1"/><path d="M71.5 9.5 l-1.5 1.5" stroke-width="1"/>
    <path d="M62 28.5 l1.5-1.5" stroke-width="1"/><path d="M71.5 28.5 l-1.5-1.5" stroke-width="1"/>
  </g>
  <!-- light motes with ray-cross variations -->
  <g class="wpn" fill="#fff1b8">
    <circle cx="78" cy="31" r="1"/><circle cx="57" cy="9" r=".9"/><circle cx="80" cy="10" r=".7"/><circle cx="74" cy="38" r=".7"/><circle cx="82" cy="22" r=".6"/>
    <g stroke="#fff1b8" stroke-width=".5" stroke-linecap="round">
      <circle cx="76" cy="6" r=".5"/><path d="M76 4.8 v2.4 M74.8 6 h2.4"/>
      <circle cx="83" cy="16" r=".5"/><path d="M83 14.8 v2.4 M81.8 16 h2.4"/>
    </g>
  </g>
</svg>
