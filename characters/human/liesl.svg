<?xml version="1.0" encoding="UTF-8"?>
<!-- Sister Liesl (support) - Ashfall Road art v3. Cleric of the dawn chapel.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66.7,58">
  <defs>
    <linearGradient id="li-robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffef8"/><stop offset=".25" stop-color="#faf5e8"/><stop offset=".55" stop-color="#ede6d4"/><stop offset=".8" stop-color="#d8d0be"/><stop offset="1" stop-color="#b3aa96"/></linearGradient>
    <linearGradient id="li-robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8e0cc"/><stop offset="1" stop-color="#a89e8a"/></linearGradient>
    <linearGradient id="li-veil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#f5f0e6"/><stop offset="1" stop-color="#c9c1ad"/></linearGradient>
    <linearGradient id="li-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe490"/><stop offset=".4" stop-color="#f0c85a"/><stop offset="1" stop-color="#b8861f"/></linearGradient>
    <linearGradient id="li-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b25a"/><stop offset=".5" stop-color="#e89040"/><stop offset="1" stop-color="#c8673a"/></linearGradient>
    <linearGradient id="li-staff" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0c85a"/><stop offset=".3" stop-color="#ffe490"/><stop offset=".7" stop-color="#daa830"/><stop offset="1" stop-color="#b8861f"/></linearGradient>
    <linearGradient id="li-book" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8c3040"/><stop offset="1" stop-color="#5a1a25"/></linearGradient>
    <radialGradient id="li-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#fffcf0"/><stop offset=".5" stop-color="#fff1b8"/><stop offset=".75" stop-color="#f5d878"/><stop offset="1" stop-color="#f2c45a"/></radialGradient>
    <radialGradient id="li-warm" cx=".3" cy=".3" r=".7"><stop offset="0" stop-color="#fff8e0" stop-opacity=".3"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/></radialGradient>
    <filter id="li-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="li-sglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- holy light ambient -->
  <circle class="wpn" cx="67" cy="19" r="14" fill="#fff1b8" opacity=".5" filter="url(#li-glow)"/>
  <circle class="wpn" cx="67" cy="19" r="8" fill="#fffcf0" opacity=".3" filter="url(#li-sglow)"/>

  <g stroke="none">
    <!-- veil back drape -->
    <path d="M42 24 Q34 38 35 58 Q37 55 40 50 Q41 54 46 47 L48 30 Z" fill="url(#li-veil)"/>
    <path d="M36 48 Q38 44 40 50" stroke="#d8d0be" stroke-width=".7" fill="none"/>
    <!-- sandals under hem -->
    <path d="M42 89 h8 v4.5 h-10 z" fill="#6e4a30"/><path d="M44 91 v2.5 M47 91 v2.5" stroke="#5a3a22" stroke-width=".6"/>
    <path d="M52 89 h8 l2 4.5 h-11 z" fill="#7d5636"/><path d="M55 91 v2.5 M58 91 v2.5" stroke="#6a4028" stroke-width=".6"/>
    <!-- robe body -->
    <path d="M40 42 Q50 38 61 42 L65 89 Q51 92.5 36 89 Z" fill="url(#li-robe)"/>
    <path d="M44 50 Q43 65 41 85" stroke="#d5ccb8" stroke-width=".8" fill="none"/>
    <path d="M56 48 Q58 68 60 85" stroke="#d5ccb8" stroke-width=".7" fill="none"/>
    <path d="M48 55 Q47 72 46 88" stroke="#ddd4c2" stroke-width=".5" fill="none"/>
    <!-- layered hem -->
    <path d="M36 86 Q51 89 65 86 Q63 90 51 92.5 Q39 90 36 86 Z" fill="url(#li-robeD)"/>
    <path d="M37 88 Q51 91 64 88" stroke="url(#li-gold)" stroke-width=".8" fill="none"/>
    <!-- warm light cast from sun disc -->
    <ellipse cx="58" cy="50" rx="10" ry="14" fill="url(#li-warm)"/>
    <!-- dawn vestment panel -->
    <path d="M47 43 h8 l2 47 Q53 91 51 91 Q49 91 45 90 z" fill="url(#li-dawn)"/>
    <path d="M51 48 v8 M48 51 h6" stroke="#fff4d6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M51 62 v6 M49 64.5 h4" stroke="#fff4d6" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M51 76 v5 M49.5 78 h3" stroke="#fff4d6" stroke-width="1" stroke-linecap="round"/>
    <!-- vestment gold edge trim -->
    <path d="M47 43 L45 90" stroke="url(#li-gold)" stroke-width="1" fill="none"/>
    <path d="M55 43 L57 90" stroke="url(#li-gold)" stroke-width="1" fill="none"/>
    <!-- belt with scrollwork -->
    <rect x="39" y="60" width="24" height="3.6" rx="1" fill="url(#li-gold)"/>
    <path d="M41 61 q1.5 1.5 3 0 q1.5-1.5 3 0 q1.5 1.5 3 0 q1.5-1.5 3 0 q1.5 1.5 3 0" stroke="#b8861f" stroke-width=".6" fill="none"/>
    <!-- rosary beads -->
    <path d="M43 63.6 v4" stroke="#c9a25e" stroke-width=".6"/>
    <g fill="url(#li-gold)"><circle cx="43" cy="68" r=".8"/><circle cx="43" cy="70" r=".8"/><circle cx="43" cy="72" r=".8"/><path d="M42 73.5 h2 v2.5 h-2 z"/></g>
    <!-- herb pouch + holy water vial -->
    <path d="M56 63.6 Q57 66 58.5 67 Q56 68 55 67 Q54 66 56 63.6 Z" fill="#5a6b3a"/>
    <path d="M55.5 65.5 h3" stroke="#7a8b4a" stroke-width=".5"/>
    <path d="M60 63.6 v3.5" stroke="#b8861f" stroke-width=".8"/>
    <ellipse cx="60" cy="68.5" rx="1.3" ry="2" fill="#8ab8d8" opacity=".7"/>
    <ellipse cx="60" cy="68.5" rx="1.3" ry="2" fill="none" stroke="#b8861f" stroke-width=".5"/>
