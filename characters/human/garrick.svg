    <path d="M27.5 49.5 h20.5 v13.5 q0 12 -10.25 17 q-10.25 -5 -10.25 -17 z" fill="url(#gv-blue)"/>
    <path d="M29.5 51.5 h16.5 v11.5 q0 10.5 -8.25 15 q-8.25 -4.5 -8.25 -15 z" fill="none" stroke="url(#gv-gold)" stroke-width="1.5"/>
    <!-- Shield boss -->
    <circle cx="38" cy="61" r="5" fill="url(#gv-gold)" stroke="url(#gv-goldD)" stroke-width=".6"/>
    <circle cx="38" cy="61" r="3.2" fill="url(#gv-goldD)"/><circle cx="38" cy="61" r="1.8" fill="url(#gv-gold)"/>
