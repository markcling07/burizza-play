<?xml version="1.0" encoding="UTF-8"?>
<!-- Sir Garrick Vane (melee) - Ashfall Road art v3. Heavily armored paladin.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66,60">
  <defs>
    <linearGradient id="gv-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#f0f2f7"/><stop offset=".4" stop-color="#dde1ec"/><stop offset=".6" stop-color="#c5cad8"/><stop offset=".8" stop-color="#a8afc2"/><stop offset="1" stop-color="#8c94a6"/></linearGradient>
    <linearGradient id="gv-plateD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8afbf"/><stop offset=".4" stop-color="#7d869a"/><stop offset="1" stop-color="#5d6578"/></linearGradient>
    <linearGradient id="gv-plateH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#eef0f5"/><stop offset="1" stop-color="#c8cdd9"/></linearGradient>
    <linearGradient id="gv-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe999"/><stop offset=".3" stop-color="#f5d56b"/><stop offset=".6" stop-color="#d4a832"/><stop offset="1" stop-color="#b8861f"/></linearGradient>
    <linearGradient id="gv-goldD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4a832"/><stop offset="1" stop-color="#8a6318"/></linearGradient>
    <linearGradient id="gv-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b8fd4"/><stop offset=".4" stop-color="#5c80c4"/><stop offset="1" stop-color="#28407a"/></linearGradient>
    <linearGradient id="gv-plume" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7ba0e0"/><stop offset=".3" stop-color="#5c80c4"/><stop offset=".7" stop-color="#3d5da0"/><stop offset="1" stop-color="#28407a"/></linearGradient>
    <linearGradient id="gv-cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf8f0"/><stop offset=".5" stop-color="#f0ece0"/><stop offset="1" stop-color="#cfc7b4"/></linearGradient>
    <linearGradient id="gv-leather" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b4630"/><stop offset=".5" stop-color="#8a5c3c"/><stop offset="1" stop-color="#5a3a24"/></linearGradient>
