<?xml version="1.0" encoding="UTF-8"?>
<!-- Old Mother Hesk (support) - Ashfall Road art v2. Shaman who keeps the war drums.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="69.5,54">
  <defs>
    <linearGradient id="hk-robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#77649a"/><stop offset=".55" stop-color="#4b3d5e"/><stop offset="1" stop-color="#2a2236"/></linearGradient>
    <linearGradient id="hk-robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43375a"/><stop offset="1" stop-color="#211a2c"/></linearGradient>
    <linearGradient id="hk-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3c494"/><stop offset=".5" stop-color="#8a9d6a"/><stop offset="1" stop-color="#5a6b42"/></linearGradient>
    <linearGradient id="hk-bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6eedb"/><stop offset="1" stop-color="#b8a684"/></linearGradient>
    <linearGradient id="hk-hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#a8a8ae"/></linearGradient>
