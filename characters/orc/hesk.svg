<?xml version="1.0" encoding="UTF-8"?>
<!-- Old Mother Hesk (support) - Ashfall Road art v2. Shaman who keeps the war drums.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#77649a"/><stop offset=".55" stop-color="#4b3d5e"/><stop offset="1" stop-color="#2a2236"/></linearGradient>
    <linearGradient id="robeD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43375a"/><stop offset="1" stop-color="#211a2c"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3c494"/><stop offset=".5" stop-color="#8a9d6a"/><stop offset="1" stop-color="#5a6b42"/></linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6eedb"/><stop offset="1" stop-color="#b8a684"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#a8a8ae"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6644"/><stop offset="1" stop-color="#4e3522"/></linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b0704a"/><stop offset="1" stop-color="#6a3a22"/></linearGradient>
    <radialGradient id="orb" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffe0d6"/><stop offset=".4" stop-color="#e0645a"/><stop offset="1" stop-color="#8a2420"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- orb glow -->
  <circle cx="72" cy="15" r="11" fill="#e0645a" opacity=".6" filter="url(#glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <path d="M40 88 h9 v5.5 h-11 z" fill="#2a2220"/>
    <path d="M52 88 h9 l3 5.5 h-12 z" fill="#3a2e2a"/>
    <!-- hair down the back -->
    <path d="M52 36 Q38 36 35 48 Q33 58 36 66 Q39 58 43 54 Q44 46 52 44 Z" fill="url(#hair)"/>
    <!-- hunched robe -->
    <path d="M36.5 54 Q33.5 41 45 38.5 Q57 37.5 62 46 L66 89 Q50.5 92.5 35 89 Q35.5 70 36.5 54 Z" fill="url(#robe)"/>
    <path d="M35.3 84.5 Q50.5 88 65.6 84.5 L66 89 Q50.5 92.5 35 89 Z" fill="url(#bone)"/>
    <path d="M52 46 Q54 66 54.5 89" fill="none"/>
    <rect x="38" y="62" width="25" height="4" rx="1" fill="url(#bone)"/>
    <!-- war drum on hip -->
    <path d="M30 65 h14 v9 q-7 2.5 -14 0 z" fill="url(#drum)"/>
    <ellipse cx="37" cy="65" rx="7" ry="2.2" fill="url(#bone)"/>
    <path d="M30.5 67 l4 6 M37 67.2 v8.5 M43.5 67 l-4 6" fill="none" stroke="#3a2214" stroke-width="1"/>
    <!-- staff -->
    <rect x="68.4" y="20" width="3.2" height="72" rx="1" fill="url(#wood)"/>
    <path d="M66 22 Q66 9 72 7.5 Q78 9 77.5 15 L75 15 Q75 11 72 11 Q69 12 69.5 22 Z" fill="url(#wood)"/>
    <circle cx="72" cy="16" r="5.2" fill="url(#orb)"/>
    <!-- charms -->
    <path d="M67 22 Q63 25 62.5 31" fill="none" stroke-width="1"/>
    <path d="M62.5 30 Q59.5 34 61.5 39 Q65 35 62.5 30 Z" fill="#e0645a"/>
    <path d="M67.5 23 Q66.5 27 65.8 31" fill="none" stroke-width="1"/>
    <rect x="64.2" y="31" width="3.2" height="5.5" rx="1.4" fill="url(#bone)"/>
    <!-- head -->
    <path d="M51 38 Q50 28 58.5 27.5 Q66.5 27.5 67 34.5 L69.5 39 L67.4 40.5 Q68 45.5 63.5 47.5 Q57 49 53.5 46 Q50.5 42.5 51 38 Z" fill="url(#skin)"/>
    <path d="M53 34 L44.5 31.5 L51.5 40 Z" fill="url(#skin)"/>
    <!-- wild hair -->
    <path d="M50.5 40 Q47 30 54 26.5 Q60 23.5 66 27 Q67.5 29 67 31.5 Q61 29 56 31.5 Q53.5 35 54 43 Q51.5 43 50.5 40 Z" fill="url(#hair)"/>
    <!-- front arm on staff -->
    <path d="M56 46 Q63 46.5 68 53 L64.5 57 Q60 52.5 54.5 52 Z" fill="url(#robe)"/>
    <circle cx="69.5" cy="54" r="3" fill="url(#skin)"/>
    <!-- bone necklace collar -->
    <path d="M51 47 Q55 51 61 49.5" fill="none" stroke="url(#bone)" stroke-width="2"/>
  </g>
  <!-- necklace teeth -->
  <path d="M53 49.5 l-.3 2.6 M56 50.6 v2.6 M59 50.2 l.3 2.6" stroke="#f6eedb" stroke-width="1.4" stroke-linecap="round"/>
  <!-- face -->
  <path d="M60 35 L66 36.4" stroke="#15121d" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="63" cy="37.6" r="1.2" fill="#e0645a"/>
  <path d="M60.5 40.2 q1.5 .8 3 .4" stroke="#5a6b42" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M62.5 44.5 Q65 45.2 67.5 43.8" stroke="#15121d" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M63.6 45.6 L63.6 42 L65.4 45.1 Z" fill="#f1ead6" stroke="#15121d" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M60.5 30.5 L62 36 M57 31.5 L58.2 36" stroke="#d8c8a8" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <!-- runes + highlights -->
  <path d="M42 70 l2 -3 l2 3 l-2 3 z" fill="none" stroke="url(#bone)" stroke-width="1.2"/>
  <path d="M41 46 Q44 42.5 48 41.5" stroke="#9d8ac0" stroke-width="1.3" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M70 13.5 q1 -1.6 2.8 -1.6" stroke="#fff" stroke-width="1.2" fill="none" opacity=".9" stroke-linecap="round"/>
  <g fill="#ff9a8a"><circle cx="80" cy="9" r=".9"/><circle cx="63" cy="7" r=".7"/><circle cx="81" cy="21" r=".7"/></g>
</svg>
