  <circle cx="63" cy="37.6" r="1.2" fill="#e0645a"/>
  <circle cx="63.3" cy="37.4" r=".4" fill="#2a0e0c"/>
  <path d="M60.5 30.5 L62 36 M57 31.5 L58.2 36" stroke="#d8c8a8" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
