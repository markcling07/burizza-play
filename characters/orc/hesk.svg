    <circle cx="80" cy="9" r=".9" opacity=".9"/><circle cx="63" cy="7" r=".7" opacity=".8"/>
    <circle cx="81" cy="21" r=".7" opacity=".7"/><circle cx="78" cy="5" r=".5" opacity=".5"/>
    <circle cx="65" cy="12" r=".6" opacity=".6"/><circle cx="83" cy="15" r=".5" opacity=".4"/>
