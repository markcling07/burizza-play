    <radialGradient id="hk-orb" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffe0d6"/><stop offset=".4" stop-color="#e0645a"/><stop offset="1" stop-color="#8a2420"/></radialGradient>
    <radialGradient id="hk-orbCore" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".6" stop-color="#ff6a5a" stop-opacity=".3"/><stop offset="1" stop-color="#8a2420" stop-opacity="0"/></radialGradient>
    <filter id="hk-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="hk-glowSm" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.5"/></filter>
