<?xml version="1.0" encoding="UTF-8"?>
<!-- Drekka Firegut (ranged) - Ashfall Road art v2. Bomb and firepot thrower.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="70,38">
  <defs>
    <linearGradient id="dk-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#abc47c"/><stop offset=".5" stop-color="#7d9a4f"/><stop offset="1" stop-color="#4f6630"/></linearGradient>
    <linearGradient id="dk-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a8543"/><stop offset="1" stop-color="#3d5126"/></linearGradient>
    <linearGradient id="dk-leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8574a"/><stop offset=".5" stop-color="#7a3b2e"/><stop offset="1" stop-color="#4a2018"/></linearGradient>
    <linearGradient id="dk-leatherD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e2c22"/><stop offset="1" stop-color="#341510"/></linearGradient>
    <linearGradient id="dk-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#c27d1f"/></linearGradient>
    <linearGradient id="dk-pot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a7088"/><stop offset=".5" stop-color="#3a3f52"/><stop offset="1" stop-color="#1e2130"/></linearGradient>
    <linearGradient id="dk-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d78a5a"/><stop offset="1" stop-color="#8a4a2a"/></linearGradient>
    <linearGradient id="dk-boot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a221c"/><stop offset="1" stop-color="#1a0e0a"/></linearGradient>
    <linearGradient id="dk-smoke" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#888" stop-opacity=".3"/><stop offset="1" stop-color="#aaa" stop-opacity="0"/></linearGradient>
    <radialGradient id="dk-spark" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c2"/><stop offset=".4" stop-color="#ffb347"/><stop offset="1" stop-color="#e5482c" stop-opacity="0"/></radialGradient>
    <radialGradient id="dk-lens" cx=".35" cy=".3" r=".65"><stop offset="0" stop-color="#ffe8a0"/><stop offset=".5" stop-color="#d4940a"/><stop offset="1" stop-color="#8a5a00"/></radialGradient>
    <radialGradient id="dk-belly" cx=".5" cy=".4" r=".55"><stop offset="0" stop-color="#abc47c"/><stop offset="1" stop-color="#6a8543"/></radialGradient>
    <filter id="dk-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="dk-smog" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="50" cy="94" rx="27" ry="3.8" fill="#000" opacity=".38"/>
  <!-- fuse glow -->
  <circle class="wpn" cx="82" cy="19" r="9" fill="#ff8a3d" opacity=".6" filter="url(#dk-glow)"/>
  <!-- smoke wisps -->
