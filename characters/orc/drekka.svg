    <path d="M84 15 Q87 10 85 5 Q84 1 86 -1" fill="none" stroke="url(#dk-smoke)" stroke-width="2" stroke-linecap="round"/>
    <path d="M78 12 Q75 6 78 2" fill="none" stroke="url(#dk-smoke)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
