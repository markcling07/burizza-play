    <path d="M46.5 27 L36.5 22 L44.5 33.5 Z" fill="url(#dk-skinD)"/>
    <path d="M44 30 Q42.5 18 52.5 17 Q62.5 16.5 64 25 L66.5 30 L64.8 32 Q66.5 37.5 61 40.5 Q54 43 47.5 40 Q44 36 44 30 Z" fill="url(#dk-skin)"/>
    <!-- war paint + cheek scar -->
    <path d="M48 32 l-1 4 M50 31 l-1.5 5" stroke="#8b2500" stroke-width="1" opacity=".55" stroke-linecap="round"/>
    <path d="M62 33 l3 2.5 M62.5 34.5 l2 -1" stroke="#4f6630" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
    <!-- leather cap -->
    <path d="M44.3 27 Q43 17.5 52.5 17 Q61.5 16.5 63.5 23.5 Q53 20.5 44.3 27 Z" fill="url(#dk-leatherD)"/>
    <path d="M45 23 Q47 17 52.5 16.5 Q58 16.2 61 18" stroke="#241008" stroke-width=".5" fill="none" opacity=".5"/>
    <!-- goggles -->
    <circle cx="53" cy="20.8" r="3.8" fill="#341510"/><circle cx="60.2" cy="21.2" r="3.6" fill="#341510"/>
    <circle cx="53" cy="20.8" r="3.3" fill="url(#dk-lens)"/><circle cx="60.2" cy="21.2" r="3.1" fill="url(#dk-lens)"/>
    <path d="M56.2 21 h1" stroke="#341510" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M49.5 21.5 Q47 22 45 24 M63.2 22 Q64.5 23 65 25" stroke="#5e2c22" stroke-width="1" fill="none"/>
    <!-- front arm -->
    <path d="M58 45.5 L68 38.5 L73 43.5 L63.5 51.5 Z" fill="url(#dk-skin)"/>
    <path d="M62 41 Q65 43 64 47" stroke="#4f6630" stroke-width=".7" fill="none" opacity=".4"/>
