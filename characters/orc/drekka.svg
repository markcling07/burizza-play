    <path class="wpn" d="M70 29 Q74 27 78 29 M69.5 33 Q74 35 78.5 33" stroke="#4a5068" stroke-width=".6" fill="none" opacity=".5"/>
    <rect class="wpn" x="72" y="22" width="5" height="3.5" rx="1" fill="url(#dk-amber)" transform="rotate(18 74.5 23.75)"/>
    <path class="wpn" d="M76 22.5 Q78 18 82 19" fill="none" stroke="#c9b28a" stroke-width="1.4"/>
    <path class="wpn" d="M81 18.5 l1.5 -.8 M81.5 19.5 l1.2 .5" stroke="#a89070" stroke-width=".6" stroke-linecap="round"/>
    <!-- hand -->
    <path d="M65.5 40 Q65 36 69.5 35.5 L74.5 38 Q75.5 42 71.5 43.5 Z" fill="url(#dk-skin)"/>
    <path d="M68 37 Q70 36.5 72 37.5" stroke="#4f6630" stroke-width=".5" fill="none" opacity=".5"/>
    <!-- shoulder pad -->
    <path d="M55 45 Q56 38.5 63.5 38.5 Q70 40 69.5 47.5 L58.5 51 Z" fill="url(#dk-leather)"/>
    <path d="M58 42 Q63 39.5 67 42" stroke="#4a2018" stroke-width=".6" fill="none" opacity=".5"/>
    <circle cx="59" cy="44" r=".8" fill="#c27d1f" opacity=".7"/><circle cx="65" cy="44" r=".8" fill="#c27d1f" opacity=".7"/>
  </g>
  <!-- bandolier pots -->
  <g stroke="none" stroke-width="1.2" stroke-linejoin="round">
    <circle cx="58.5" cy="50" r="3.3" fill="url(#dk-clay)"/><circle cx="52" cy="57.8" r="3.3" fill="url(#dk-clay)"/><circle cx="45.5" cy="65.5" r="3.3" fill="url(#dk-clay)"/>
    <path d="M57 48 h3 M50.5 55.8 h3 M44 63.5 h3" stroke="#8a4a2a" stroke-width=".5" opacity=".6"/>
  </g>
  <path d="M57 47.2 h3 M50.5 55 h3 M44 62.7 h3" stroke="url(#dk-amber)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M59.8 47.5 l1 -1.5 M53.2 55.2 l1 -1.5 M46.8 63 l1 -1.5" stroke="#c9b28a" stroke-width=".7" stroke-linecap="round"/>
  <!-- bomb shine + spark effects -->
  <path class="wpn" d="M69.5 28.5 Q70.5 25.8 73.5 25.2" stroke="#fff" stroke-width="1.4" fill="none" opacity=".8" stroke-linecap="round"/>
  <path class="wpn" d="M71 34 Q72 35.5 74.5 35.8" stroke="#8a9ab0" stroke-width=".8" fill="none" opacity=".4" stroke-linecap="round"/>
  <circle class="wpn" cx="82" cy="19" r="4.5" fill="url(#dk-spark)"/>
  <path class="wpn" d="M82 13 v3 M82 22 v3 M76 19 h3 M85 19 h3 M78 15 l1.6 1.6 M84.4 21.4 l1.6 1.6 M78 23 l1.6 -1.6 M84.4 16.6 l1.6 -1.6" stroke="#ffd27a" stroke-width="1.1" stroke-linecap="round"/>
  <circle class="wpn" cx="82" cy="19" r="1.6" fill="#fff6c2"/>
  <g class="wpn" fill="#ffb347"><circle cx="88" cy="12" r=".9"/><circle cx="90" cy="22" r=".7"/><circle cx="85" cy="9" r=".6"/><circle cx="77" cy="11" r=".5" opacity=".7"/><circle cx="87" cy="16" r=".4" opacity=".6"/></g>
  <!-- face -->
  <path d="M54.5 26 L63.5 27.8" stroke="#3d5126" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="59.8" cy="29.8" r="1.4" fill="#ffcf5a"/><circle cx="59.8" cy="29.8" r=".5" fill="#1a1a00"/>
  <path d="M56.5 37 Q60.5 38.2 64.5 36" stroke="#3d5126" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M58 38.6 L57.8 33.4 L60.6 37.8 Z M62.6 37.2 L63.3 32.4 L64.8 36.1 Z" fill="#f1ead6" stroke="none" stroke-width=".85" stroke-linejoin="round"/>
  <path d="M47.5 36 q2.5 1 4 .2" stroke="#3d5126" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- goggle shine -->
  <path d="M51.5 19.6 q1 -1 2.2 -.9 M58.8 20 q1 -1 2.2 -.8" stroke="#fff" stroke-width="1" fill="none" stroke-linecap="round" opacity=".9"/>
  <circle cx="54.5" cy="22" r=".6" fill="#fff" opacity=".4"/><circle cx="61.5" cy="22.2" r=".5" fill="#fff" opacity=".35"/>
  <!-- body highlights -->
  <path d="M40 55 Q43 50 50 49" stroke="#fff" stroke-width="1.2" fill="none" opacity=".45" stroke-linecap="round"/>
  <path d="M57.5 43.5 Q60 40.5 64 40.5" stroke="#fff" stroke-width="1.2" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M36 64 Q38 61 40 60" stroke="#fff" stroke-width=".8" fill="none" opacity=".25" stroke-linecap="round"/>
</svg>
