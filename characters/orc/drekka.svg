    <path d="M33 87.5 h15 v2.5 l-2 3.5 h-14 z" fill="url(#dk-boot)"/>
    <path d="M34 90 h13 M33.5 93 l1 1 h3 l1-1" stroke="#5e2c22" stroke-width=".7" fill="none"/>
    <path d="M53.5 87.5 h14 l1 2.5 l1 3.5 h-16 z" fill="url(#dk-boot)"/>
    <path d="M54.5 90 h13 M55 93 l1 1 h3 l1-1" stroke="#5e2c22" stroke-width=".7" fill="none"/>
