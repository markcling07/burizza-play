    <rect x="47" y="67.3" width="6.5" height="7" rx="1.2" fill="url(#dk-amber)"/>
    <line x1="50.2" y1="68.5" x2="50.2" y2="73" stroke="#8a5a00" stroke-width=".7"/>
    <circle cx="40" cy="71" r=".7" fill="#c27d1f" opacity=".7"/><circle cx="60" cy="71" r=".7" fill="#c27d1f" opacity=".7"/>
