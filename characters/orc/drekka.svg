    <ellipse cx="44" cy="82" rx="3" ry="2" fill="url(#dk-leatherD)" opacity=".5"/>
    <ellipse cx="58" cy="82" rx="3" ry="2" fill="url(#dk-leather)" opacity=".4"/>
