    <linearGradient id="vk-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#557c58"/><stop offset="1" stop-color="#2f4a33"/></linearGradient>
    <linearGradient id="vk-leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#977350"/><stop offset=".5" stop-color="#6b4f32"/><stop offset="1" stop-color="#40301e"/></linearGradient>
    <linearGradient id="vk-leatherD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4229"/><stop offset="1" stop-color="#2f2216"/></linearGradient>
