  <path d="M57.5 43.5 Q60 41.2 63.5 41" stroke="#fff" stroke-width="1.2" fill="none" opacity=".8" stroke-linecap="round"/>
  <path class="wpn" d="M88 17.5 L94 18.6" transform="rotate(-10 36 19)" stroke="#fff" stroke-width="1" opacity=".9" stroke-linecap="round"/>
