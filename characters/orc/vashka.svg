<?xml version="1.0" encoding="UTF-8"?>
<!-- Vashka Spearthrower (ranged) - Ashfall Road art v2. Javelin hunter of the steppe.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="36,19">
  <defs>
