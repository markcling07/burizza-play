<?xml version="1.0" encoding="UTF-8"?>
<!-- Mogra Ironhide (melee) - Ashfall Road art v2. Shield-and-mace bruiser.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9c78c"/><stop offset=".5" stop-color="#7a9a5e"/><stop offset="1" stop-color="#4e6a3b"/></linearGradient>
    <linearGradient id="skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66844e"/><stop offset="1" stop-color="#3b5230"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa0b2"/><stop offset=".5" stop-color="#5c6172"/><stop offset="1" stop-color="#33363f"/></linearGradient>
    <linearGradient id="plateD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5f6e"/><stop offset="1" stop-color="#2a2c34"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f6"/><stop offset=".5" stop-color="#a8b0c0"/><stop offset="1" stop-color="#5f6779"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c27a"/><stop offset="1" stop-color="#8f5f28"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93704a"/><stop offset=".55" stop-color="#6b4f32"/><stop offset="1" stop-color="#43301e"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5e3c"/><stop offset="1" stop-color="#4e321f"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a30"/><stop offset="1" stop-color="#1e1612"/></linearGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="27" ry="3.8" fill="#000" opacity=".38"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- braid -->
    <path d="M46 24 Q35 30 35 50 L40 50 Q40 34 49 28 Z" fill="url(#hair)"/>
    <rect x="33.8" y="48" width="7.2" height="4" rx="1.2" fill="url(#bronze)"/>
    <path d="M35 52 L37.5 58 L40 52 Z" fill="url(#hair)"/>
    <!-- back pauldron -->
    <path d="M31 51 Q30 42 39 40.5 L45 46 L37 55 Z" fill="url(#plateD)"/>
    <!-- legs -->
    <path d="M39 71 h10.5 l-1 17 h-10.5 z" fill="url(#plateD)"/>
    <path d="M34 87.5 h14.5 v6 h-15.5 z" fill="#2a2228"/>
    <path d="M52 71 h10.5 l2.5 17 h-10.5 z" fill="url(#plate)"/>
    <path d="M53.5 87.5 h13.5 l2 6 h-15.5 z" fill="#3a3440"/>
    <path d="M52.8 78 h10.6 l.4 3 h-10.8 z" fill="url(#bronze)"/>
    <!-- torso -->
    <path d="M32 46 Q50 38 68 46 L64 72 Q50 76 36 72 Z" fill="url(#plate)"/>
    <path d="M36 70 h28 l2.5 10 q-16 3.5 -33 0 z" fill="#4a3626"/>
    <path d="M44 70.5 v9.5 M51 71 v10 M58 70.5 v9.5" fill="none"/>
    <rect x="35" y="65" width="30" height="5.5" rx="1.2" fill="url(#bronze)"/>
    <path d="M44 42 Q50 47 57 42" fill="none" stroke="url(#bronze)" stroke-width="2.4"/>
    <!-- ear -->
    <path d="M47 27.5 L37.5 22.5 L45 34 Z" fill="url(#skinD)"/>
    <!-- head -->
    <path d="M45 30 Q43.5 18.5 53 18 Q62 17.5 63.5 25 L65.5 30 L63.8 32 Q65 37 60.5 39.5 Q54 42 48.5 39.5 Q45 36 45 30 Z" fill="url(#skin)"/>
    <!-- hair cap + topknot -->
    <circle cx="50" cy="13.5" r="5" fill="url(#hair)"/>
    <rect x="46" y="16.5" width="8" height="3.4" rx="1.2" fill="url(#bronze)"/>
    <path d="M45 30.5 Q43 18.5 53 18.5 Q60 18.5 62 22.5 Q55.5 21.8 51.5 24.2 Q48.8 27 47.8 31.5 Z" fill="url(#hair)"/>
    <!-- mace -->
    <g transform="rotate(14 67 59)">
      <rect x="65.4" y="27" width="3.2" height="40" rx="1" fill="url(#wood)"/>
      <g transform="translate(67 23) scale(1.3) translate(-67 -23)" stroke-width="1.15">
      <path d="M66 14.5 L67 8 L68 14.5 Z" fill="url(#steel)"/>
      <path d="M60 19 L63 15 h8 l3 4 v9 l-3 4 h-8 l-3 -4 z" fill="url(#steel)"/>
      <path d="M60 22 L55.5 23.5 L60 25 Z M74 22 L78.5 23.5 L74 25 Z" fill="url(#steel)"/>
      <rect x="59.5" y="22" width="15" height="3" fill="url(#bronze)"/>
      </g>
      <circle cx="67" cy="68.5" r="2.2" fill="url(#bronze)"/>
    </g>
    <!-- front arm + pauldron -->
    <path d="M60 50 L69 56.5 L64.5 62.5 L57 56 Z" fill="url(#skin)"/>
    <circle cx="67" cy="59.5" r="3.9" fill="url(#plateD)"/>
    <path d="M54 45 Q55 37 63.5 37.5 Q71 39 70 49.5 L58 52 Z" fill="url(#plate)"/>
    <path d="M56 49 Q63 46.5 70 49.5" fill="none" stroke="url(#bronze)" stroke-width="2"/>
    <!-- round shield -->
    <circle cx="37" cy="59" r="14" fill="url(#shield)"/>
    <circle cx="37" cy="59" r="11.6" fill="none" stroke="url(#bronze)" stroke-width="2"/>
    <circle cx="37" cy="59" r="4.6" fill="url(#steel)"/>
  </g>
  <!-- shield planks + rivets -->
  <path d="M30.5 48.5 v6.5 M30.5 63 v6.5 M43.5 48.5 v6.5 M43.5 63 v6.5" stroke="#3a2a1a" stroke-width="1" stroke-linecap="round"/>
  <g fill="#f0c27a"><circle cx="37" cy="47.4" r=".9"/><circle cx="37" cy="70.6" r=".9"/><circle cx="25.4" cy="59" r=".9"/><circle cx="48.6" cy="59" r=".9"/></g>
  <path d="M35 57 q1.2 -1.3 2.6 -1.2" stroke="#fff" stroke-width="1.1" fill="none" opacity=".9" stroke-linecap="round"/>
  <path d="M27 54 Q29.5 49 34 47.5" stroke="#c49a6a" stroke-width="1.2" fill="none" opacity=".8" stroke-linecap="round"/>
  <!-- face -->
  <path d="M55 26 L63 27.6" stroke="#15121d" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="59.6" cy="29.6" r="1.4" fill="#ffcf5a"/>
  <path d="M57 36.6 Q60.5 37.6 64 35.8" stroke="#15121d" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M58.3 38.2 L58.2 33.6 L60.6 37.6 Z M62.6 36.8 L63.2 32.6 L64.5 36 Z" fill="#f1ead6" stroke="#15121d" stroke-width=".8" stroke-linejoin="round"/>
  <circle cx="40.6" cy="28" r="1.6" fill="none" stroke="url(#bronze)" stroke-width="1.2"/>
  <!-- highlights -->
  <path d="M48 23 Q50 20.5 53.5 19.8" stroke="#fff" stroke-width="1.2" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M57 43.5 Q60 40 64.5 39.8" stroke="#fff" stroke-width="1.3" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M53 49 Q56 47 59 47.5" stroke="#fff" stroke-width="1.2" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M60 16.5 Q61.5 14 64 13.8" transform="rotate(14 67 59)" stroke="#fff" stroke-width="1.2" fill="none" opacity=".9" stroke-linecap="round"/>
</svg>
