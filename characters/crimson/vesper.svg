<?xml version="1.0" encoding="UTF-8"?>
<!-- Vesper Nightshade (melee) - Burizza art v2. Vampire lord and duelist.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5070"/><stop offset=".5" stop-color="#46293c"/><stop offset="1" stop-color="#271722"/></linearGradient>
    <linearGradient id="coatD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3045"/><stop offset="1" stop-color="#21141e"/></linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2534"/><stop offset=".5" stop-color="#1a1018"/><stop offset="1" stop-color="#0c070b"/></linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ee5566"/><stop offset=".5" stop-color="#c0303f"/><stop offset="1" stop-color="#781522"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7fa"/><stop offset=".55" stop-color="#e8dfe6"/><stop offset="1" stop-color="#b7a6b6"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#40404f"/><stop offset=".5" stop-color="#1b1b22"/><stop offset="1" stop-color="#0a0a0e"/></linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3344"/><stop offset="1" stop-color="#121016"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8861f"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d3d9e6"/><stop offset="1" stop-color="#8a94a8"/></linearGradient>
    <linearGradient id="lace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfc6d2"/></linearGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd0d6"/><stop offset=".5" stop-color="#ff3048"/><stop offset="1" stop-color="#ff3048" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- blade glow -->
  <g transform="rotate(52 68 57)"><rect x="65.5" y="22" width="5" height="30" rx="2.5" fill="#ff2a40" opacity=".45" filter="url(#glow)"/></g>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tattered cape -->
    <path d="M44 42 Q31 54 26.5 68 Q22.5 80 19 91 L24.5 88.5 L27 93 L32 88.5 L36.5 92.5 L40 87 L46 46 Z" fill="url(#crimson)"/>
    <path d="M44.5 42 Q34 54 29.5 67.5 Q26 79 23.5 87.5 L27.5 85.5 L29.5 89.5 L33.5 85.5 L37.5 89 L40 84 L46 46 Z" fill="url(#cape)"/>
    <!-- back arm (raised en garde) -->
    <path d="M44 45 L34 42 L32.5 47 L42.5 50.5 Z" fill="url(#coatD)"/>
    <path d="M31.8 46 L28.3 36.5 L32.8 35 L36.5 44.5 Z" fill="url(#coatD)"/>
    <circle cx="30.2" cy="34" r="2.6" fill="#c9bcc8"/>
    <!-- high collar -->
    <path d="M40.5 47 Q34 33 36.5 18.5 Q44 24 50 34 L56 42 Z" fill="url(#coat)"/>
    <path d="M42.5 44 Q38 33 39 22.5 Q44.5 27.5 49 35 Z" fill="url(#crimson)"/>
    <!-- coat tail -->
    <path d="M40 59 L51 60 Q47 73 43 85 L39.2 81.5 L35 86 Q33.5 72 40 59 Z" fill="url(#coatD)"/>
    <path d="M45 66 Q43.5 75 42 82 L40 80 Q42.5 72 45 66 Z" fill="url(#crimson)" stroke-width="1"/>
    <!-- legs: back leg trails, front leg leads -->
    <path d="M41 69 h9 l-5 19 h-9 z" fill="url(#coatD)"/>
    <path d="M37.4 79.5 h9.6 l-2.2 8.5 h-9.4 z" fill="url(#boot)"/>
    <path d="M30.5 87.5 h13.5 v6 h-14.5 z" fill="#15121d"/>
    <path d="M51 69 h9 l5 19 h-9 z" fill="url(#coat)"/>
    <path d="M53.4 79.5 h9.6 l2.2 8.5 h-9.4 z" fill="url(#boot)"/>
    <path d="M55.5 87.5 h12.5 l2.5 6 h-15 z" fill="#2a2430"/>
    <!-- coat skirt -->
    <path d="M39.8 60 L60.2 60 L62 70 Q56.5 72.5 52 69.5 L50.5 67 L48.8 69.5 Q44 72.5 38.6 70 Z" fill="url(#coat)"/>
    <!-- torso -->
    <path d="M40 45 Q50 40.5 60 45 L59 64 Q50 67 41 64 Z" fill="url(#coat)"/>
    <path d="M50 43.5 h7 l-.5 19.5 h-6 z" fill="url(#crimson)"/>
    <rect x="40.5" y="59.5" width="19" height="4.2" rx="1" fill="#1a1018"/>
    <rect x="51.2" y="58.8" width="5" height="5.6" rx="1" fill="url(#gold)"/>
    <path d="M52 39.5 L58.5 39.5 L57.5 46 L55.2 48.5 L53 46 Z" fill="url(#lace)"/>
    <!-- head -->
    <path d="M44 30 Q44 19.5 53 19.5 Q61.5 19.5 62 26 L64.5 31 L62 32 Q62.3 37 58.5 39.6 Q54.5 41.5 50.5 39.6 Q45 37 44 30 Z" fill="url(#skin)"/>
    <path d="M47.5 34 L43 33.5 L40 31 L42.6 29.5 L38.8 25.5 L42.5 24 Q44 17 52 16.5 Q61 15.5 63 22.5 L60.2 22.2 L58.3 26.3 L56.2 22.6 Q52.5 23.5 50 28 Z" fill="url(#hair)"/>
    <path d="M50.5 27.5 L45.5 23 L48 33 Q50 33.8 51 31 Z" fill="url(#skin)"/>
    <!-- front arm -->
    <path d="M55.5 45.5 L66.5 53 L63.5 58.5 L53 51.5 Z" fill="url(#coat)"/>
    <path d="M63.8 51.8 L68.2 54.6 L65.4 59.6 L61.4 56.8 Z" fill="url(#crimson)"/>
    <circle cx="57.5" cy="47" r="5.4" fill="url(#coat)"/>
    <path d="M52.8 45.6 Q56.5 41 62.6 43.6 L62.2 47 Q57.8 45.4 53.6 47.8 Z" fill="url(#gold)"/>
  </g>
  <!-- rapier -->
  <g transform="rotate(52 68 57)" stroke="#15121d" stroke-linejoin="round" stroke-linecap="round">
    <path d="M67.1 52.5 L67.4 26 L68 21.5 L68.6 26 L68.9 52.5 Z" fill="url(#blade)" stroke-width="1.1"/>
    <rect x="67" y="54" width="2" height="7.5" rx=".6" fill="#2a1a22" stroke-width="1"/>
    <path d="M63.6 54 Q68 61.5 72.4 54 Z" fill="url(#crimson)" stroke-width="1.1"/>
    <rect x="62" y="52" width="12" height="2.6" rx="1.3" fill="url(#gold)" stroke-width="1.1"/>
    <circle cx="62" cy="53.3" r="1.5" fill="url(#gold)" stroke-width="1"/>
    <circle cx="68" cy="63.2" r="2.1" fill="url(#gold)" stroke-width="1.1"/>
  </g>
  <circle cx="68.2" cy="57.2" r="3" fill="url(#skin)" stroke="#15121d" stroke-width="1.4"/>
  <g transform="rotate(52 68 57)" fill="none" stroke-linecap="round">
    <path d="M74 53.3 Q77.5 60 69.5 64" stroke="#15121d" stroke-width="3.6"/>
    <path d="M74 53.3 Q77.5 60 69.5 64" stroke="url(#gold)" stroke-width="1.8"/>
    <circle cx="74" cy="53.3" r="1.5" fill="url(#gold)" stroke="#15121d" stroke-width="1"/>
    <circle cx="68" cy="63.2" r=".8" fill="#ff3048" stroke="none"/>
    <path d="M68 28 V50" stroke="#a7afc0" stroke-width=".6"/>
  </g>
  <!-- face -->
  <path d="M55.3 26.3 L61.2 27.6" stroke="#15121d" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="58.5" cy="29.3" r="2.8" fill="url(#eye)"/>
  <path d="M56.6 29.2 Q58.6 27.9 60.7 28.9 Q58.7 30.6 56.6 29.2 Z" fill="#ff3048" stroke="#15121d" stroke-width=".6"/>
  <circle cx="59.1" cy="29" r=".5" fill="#fff"/>
  <path d="M58.6 35.5 Q60.6 36 62.3 35" stroke="#15121d" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M59.4 35.7 l.5 1.7 l.6 -1.6 Z M61.2 35.5 l.4 1.4 l.5 -1.6 Z" fill="#fff" stroke="#15121d" stroke-width=".4" stroke-linejoin="round"/>
  <path d="M53.5 33.5 Q55.5 36.5 58 37.3" stroke="#b7a6b6" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- hair sheen -->
  <path d="M45 22.5 Q49 18.8 55 18.6 M44.5 26.5 Q47 23.5 50.5 22.5" stroke="#6c6c84" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".9"/>
  <!-- coat trim -->
  <path d="M50 44 L50.4 58.6 M56.8 54.6 L56.6 58.6" stroke="#e0b450" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M39.4 69.4 Q44 71.4 48.6 69 M52.3 69 Q56.8 71.4 61.6 69.4" stroke="#c0303f" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <g fill="url(#gold)" stroke="#15121d" stroke-width=".6"><circle cx="45.5" cy="50" r=".9"/><circle cx="45.5" cy="55" r=".9"/></g>
  <path d="M40.4 64 L39.4 69.6 M60.2 64 L61.3 69.6" stroke="#c0303f" stroke-width="1.2" opacity=".9"/>
  <path d="M41.5 48.5 Q43.5 45 47 44" stroke="#fff" stroke-width="1.2" fill="none" opacity=".45" stroke-linecap="round"/>
  <path d="M38.5 30 Q38 24 37.6 21" stroke="#fff" stroke-width="1" fill="none" opacity=".35" stroke-linecap="round"/>
  <!-- blood motes -->
  <g fill="#ff4a5c">
    <path d="M84 15 l.7 2 l2 .7 l-2 .7 l-.7 2 l-.7 -2 l-2 -.7 l2 -.7 z"/>
    <path d="M77 24 l.5 1.3 l1.3 .5 l-1.3 .5 l-.5 1.3 l-.5 -1.3 l-1.3 -.5 l1.3 -.5 z"/>
  </g>
</svg>
