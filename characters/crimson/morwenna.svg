<?xml version="1.0" encoding="UTF-8"?>
<!-- Morwenna Bloodweaver (support) - Burizza art v2. Blood witch of the Court.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a3a50"/><stop offset=".5" stop-color="#5a1f2e"/><stop offset="1" stop-color="#34101b"/></linearGradient>
    <linearGradient id="gownD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a1826"/><stop offset="1" stop-color="#260a12"/></linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e2030"/><stop offset=".5" stop-color="#2a1018"/><stop offset="1" stop-color="#14070b"/></linearGradient>
    <linearGradient id="lining" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d23a4c"/><stop offset="1" stop-color="#7a1424"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a42a3c"/><stop offset="1" stop-color="#560e1c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".5" stop-color="#d9b44a"/><stop offset="1" stop-color="#93701f"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf8fa"/><stop offset=".55" stop-color="#efe4ea"/><stop offset="1" stop-color="#c8b4c6"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2eff7"/><stop offset=".5" stop-color="#c9c2d6"/><stop offset="1" stop-color="#857a9e"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4c4258"/><stop offset="1" stop-color="#1a1520"/></linearGradient>
    <radialGradient id="orb" cx=".38" cy=".35" r=".68"><stop offset="0" stop-color="#ffd8dc"/><stop offset=".3" stop-color="#ef4a5c"/><stop offset=".72" stop-color="#c0303f"/><stop offset="1" stop-color="#5e0c18"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- orbiting blood drop (behind) -->
  <g fill="#c0303f" stroke="#15121d" stroke-width=".7" stroke-linejoin="round">
    <path d="M71.8 4.93 q1.2 1.6 1.2 2.27 a1.2 1.2 0 0 1 -2.4 0 q0 -0.67 1.2 -2.27 z"/>
  </g>
  <!-- blood orb light -->
  <circle cx="67.5" cy="14.5" r="11.5" fill="#d0303f" opacity=".6" filter="url(#glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- cape -->
    <path d="M46 36 Q36 43 32.5 62 Q30 77 28.5 90.5 Q37 93 45 91 L52 42 Z" fill="url(#cape)"/>
    <path d="M33.6 66 Q31.2 78 30.4 90.6 Q32.6 91.6 35 91.8 Q35 78 37.4 64 Z" fill="url(#lining)" stroke-width="1"/>
    <!-- high collar -->
    <path d="M51 41 L39 35.5 Q36.5 28 37.5 20.5 L41.5 25 L43 18.5 L46.5 24 L49.5 21 Q50 32 54 37 Z" fill="url(#cape)"/>
    <path d="M50 38.5 L41 34 Q39.5 29 40 25.5 L42.5 28.5 L44 23.5 L46.8 28 L48.7 26.5 Q49.5 33 52 36.5 Z" fill="url(#lining)" stroke-width="1"/>
