  <path d="M37 49 l4 4 l-1.5 4 l4 3 M53 45.5 l-2.5 4.5 l3 3 M60.5 75 l2 3 l-1 3.5 M42.5 75.5 l-1.5 4.5 M26 54 l2 4 M52.5 24 l2 3" fill="none" stroke="#ffd166" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round"/>
