  <path d="M33 45 Q38 40 45 38.5" stroke="#fff" stroke-width="1.3" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M57 46 Q60 42.5 65 42.2" stroke="#fff" stroke-width="1.2" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M84 13 Q86 19 84 25" transform="rotate(14 68 61)" stroke="#fff" stroke-width="1.2" fill="none" opacity=".85" stroke-linecap="round"/>
