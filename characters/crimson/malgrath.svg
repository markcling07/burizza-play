<?xml version="1.0" encoding="UTF-8"?>
<!-- Malgrath the Unbound (melee) - Burizza art v2. Demon brute freed from the pit.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9585e"/><stop offset=".5" stop-color="#a8323a"/><stop offset="1" stop-color="#6a1c24"/></linearGradient>
    <linearGradient id="skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8c2a31"/><stop offset="1" stop-color="#4f1419"/></linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4862"/><stop offset=".5" stop-color="#2d2230"/><stop offset="1" stop-color="#16101a"/></linearGradient>
    <linearGradient id="armorD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33283a"/><stop offset="1" stop-color="#120d15"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e8a548"/><stop offset="1" stop-color="#9a6a1c"/></linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4e58"/><stop offset=".5" stop-color="#1f1a1f"/><stop offset="1" stop-color="#0b090b"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e8a9c"/><stop offset=".5" stop-color="#4a4656"/><stop offset="1" stop-color="#1f1c25"/></linearGradient>
    <linearGradient id="ironD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5a68"/><stop offset="1" stop-color="#1f1c25"/></linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3a34"/><stop offset="1" stop-color="#2a1a1c"/></linearGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#ffd166"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
