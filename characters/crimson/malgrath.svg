    <g stroke="#9a96a8" stroke-width="1.2"><ellipse cx="22.3" cy="67.5" rx="1.3" ry="2"/><path d="M21.9 70.6 L21.5 73.4"/><ellipse cx="21.2" cy="76.4" rx="1.3" ry="2"/><path d="M20.8 79.5 L20.4 82"/></g>
    <g stroke="#15121d" stroke-width="2.8"><ellipse cx="60.2" cy="65.6" rx="1.3" ry="2"/><path d="M60 68.7 L59.8 71.5"/><ellipse cx="59.6" cy="74.5" rx="1.3" ry="2"/><path d="M59.4 77.6 L59.1 80.3"/></g>
    <g stroke="#b3afc0" stroke-width="1.2"><ellipse cx="60.2" cy="65.6" rx="1.3" ry="2"/><path d="M60 68.7 L59.8 71.5"/><ellipse cx="59.6" cy="74.5" rx="1.3" ry="2"/><path d="M59.4 77.6 L59.1 80.3"/></g>
