    <g fill="none" stroke="#8b919b" stroke-width=".55"><circle cx="44" cy="71" r=".8"/><circle cx="47.5" cy="69.5" r=".8"/><circle cx="54.5" cy="69.5" r=".8"/><circle cx="57.5" cy="71.5" r=".8"/></g>
