    <circle cx="24" cy="91.5" r=".55" fill="#9ca0a6" opacity=".45"/><circle cx="77" cy="90" r=".5" fill="#9ca0a6" opacity=".4"/>
    <ellipse cx="50" cy="94.5" rx="22" ry="1.5" fill="#7040a0" opacity=".15"/>
  </g>

