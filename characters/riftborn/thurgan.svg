<?xml version="1.0" encoding="UTF-8"?>
<!-- Thurgan (melee, Gravity) - Burizza art v3. A red-skinned orc bruiser in a low power stance, a
     three-headed stone maul reared back over his shoulder to swing at the enemy. Leather harness and a
     war-chain across a bare muscled chest, plated war-kilt, greaves and bracers. Canvas 100x100, faces
     right, feet on y=93. The maul is his weapon (class="wpn"): a racked weapon hides it and draws at data-hand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="56,49">
  <defs>
    <linearGradient id="th-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d85644"/><stop offset=".55" stop-color="#bb3e30"/><stop offset="1" stop-color="#8f2a20"/></linearGradient>
    <linearGradient id="th-skin2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8463700"/><stop offset="0" stop-color="#c04535"/><stop offset="1" stop-color="#7d2318"/></linearGradient>
    <linearGradient id="th-leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5636"/><stop offset=".6" stop-color="#543a22"/><stop offset="1" stop-color="#352414"/></linearGradient>
    <linearGradient id="th-metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2c8d0"/><stop offset=".5" stop-color="#8b919b"/><stop offset="1" stop-color="#565c66"/></linearGradient>
    <linearGradient id="th-stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ca0a6"/><stop offset=".5" stop-color="#73777e"/><stop offset="1" stop-color="#4c4f55"/></linearGradient>
    <linearGradient id="th-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6038"/><stop offset="1" stop-color="#5a3c22"/></linearGradient>
    <linearGradient id="th-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d060"/><stop offset=".5" stop-color="#d9a93a"/><stop offset="1" stop-color="#8a6b22"/></linearGradient>
    <linearGradient id="th-tusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f0d8"/><stop offset=".4" stop-color="#e8ddb8"/><stop offset="1" stop-color="#c8b888"/></linearGradient>
    <radialGradient id="th-grav" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9060d0"/><stop offset=".6" stop-color="#7040a0"/><stop offset="1" stop-color="#50307000"/></radialGradient>
  </defs>

