<?xml version="1.0" encoding="UTF-8"?>
<!-- Vharo (Riftborn, ranged, Light) - Burizza art v2. An old light-channeler, arms folded, rows of
     level swords of pure light hanging in the air behind him, every point aimed at the enemy.
     Canvas 100x100, faces right, feet on y=94. The light-swords are his Force, not a held weapon,
     so nothing here is marked class="wpn": a racked weapon is drawn at data-hand and the swords stay. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="60,47">
  <defs>
    <linearGradient id="vh-blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset=".5" stop-color="#ffe489"/><stop offset="1" stop-color="#e8b23a"/></linearGradient>
    <linearGradient id="vh-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#d9a23a"/><stop offset="1" stop-color="#8f5e16"/></linearGradient>
    <linearGradient id="vh-cape" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4b34"/><stop offset=".6" stop-color="#4a3022"/><stop offset="1" stop-color="#2a1a12"/></linearGradient>
    <linearGradient id="vh-robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d97d6"/><stop offset=".5" stop-color="#3f68a8"/><stop offset="1" stop-color="#25406f"/></linearGradient>
    <linearGradient id="vh-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8333a"/><stop offset="1" stop-color="#6e1a22"/></linearGradient>
    <linearGradient id="vh-cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e8ee"/><stop offset=".6" stop-color="#a9adbb"/><stop offset="1" stop-color="#6f7486"/></linearGradient>
    <linearGradient id="vh-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a90a2"/><stop offset="1" stop-color="#3c4150"/></linearGradient>
    <linearGradient id="vh-hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c4b8"/></linearGradient>
    <radialGradient id="vh-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe489" stop-opacity=".5"/><stop offset="1" stop-color="#ffe489" stop-opacity="0"/></radialGradient>
    <filter id="vh-glow" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="vh-haze" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <ellipse cx="48" cy="94" rx="27" ry="3.6" fill="#000" opacity=".35"/>
  <!-- the light gathered behind him -->
  <ellipse cx="56" cy="34" rx="34" ry="26" fill="url(#vh-aura)"/>
  <!-- swords of light behind him, level, every point aimed straight at the enemy -->
  <g transform="translate(30 12)">
    <path d="M-14 0 Q-8 -2.6 -3 -1 Q-8 1.4 -14 0 Z" fill="#ffd66b" opacity=".55" filter="url(#vh-haze)"/>
    <path d="M-2 -2.4 L46.5 -2.4 L53.5 0 L46.5 2.4 L-2 2.4 Z" fill="#ffd66b" opacity=".7" filter="url(#vh-glow)"/>
    <path d="M0 -1.25 L46.5 -1.25 L52.0 0 L46.5 1.25 L0 1.25 Z" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7" stroke-linejoin="round"/>
    <path d="M1.5 -.2 L47.0 -.2" stroke="#fffdf0" stroke-width=".6" stroke-linecap="round"/>
    <rect x="-1.2" y="-4.4" width="2.4" height="8.8" rx="1" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7"/>
    <rect x="-6.4" y="-.95" width="5.4" height="1.9" rx=".8" fill="#f2c94c" stroke="#b07a1e" stroke-width=".6"/>
    <circle cx="-7.3" cy="0" r="1.5" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".6"/>
  </g>
  <g transform="translate(21 23)">
    <path d="M-14 0 Q-8 -2.6 -3 -1 Q-8 1.4 -14 0 Z" fill="#ffd66b" opacity=".55" filter="url(#vh-haze)"/>
    <path d="M-2 -2.4 L54.5 -2.4 L61.5 0 L54.5 2.4 L-2 2.4 Z" fill="#ffd66b" opacity=".7" filter="url(#vh-glow)"/>
    <path d="M0 -1.25 L54.5 -1.25 L60.0 0 L54.5 1.25 L0 1.25 Z" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7" stroke-linejoin="round"/>
    <path d="M1.5 -.2 L55.0 -.2" stroke="#fffdf0" stroke-width=".6" stroke-linecap="round"/>
    <rect x="-1.2" y="-4.4" width="2.4" height="8.8" rx="1" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7"/>
    <rect x="-6.4" y="-.95" width="5.4" height="1.9" rx=".8" fill="#f2c94c" stroke="#b07a1e" stroke-width=".6"/>
    <circle cx="-7.3" cy="0" r="1.5" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".6"/>
  </g>
  <g transform="translate(13 45)">
    <path d="M-14 0 Q-8 -2.6 -3 -1 Q-8 1.4 -14 0 Z" fill="#ffd66b" opacity=".55" filter="url(#vh-haze)"/>
    <path d="M-2 -2.4 L66.5 -2.4 L73.5 0 L66.5 2.4 L-2 2.4 Z" fill="#ffd66b" opacity=".7" filter="url(#vh-glow)"/>
    <path d="M0 -1.25 L66.5 -1.25 L72.0 0 L66.5 1.25 L0 1.25 Z" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7" stroke-linejoin="round"/>
    <path d="M1.5 -.2 L67.0 -.2" stroke="#fffdf0" stroke-width=".6" stroke-linecap="round"/>
    <rect x="-1.2" y="-4.4" width="2.4" height="8.8" rx="1" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7"/>
    <rect x="-6.4" y="-.95" width="5.4" height="1.9" rx=".8" fill="#f2c94c" stroke="#b07a1e" stroke-width=".6"/>
    <circle cx="-7.3" cy="0" r="1.5" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".6"/>
  </g>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- cape, blown back off his shoulders -->
    <path d="M44 40 C31 44 20 58 9 83 Q16 80 21 84 Q25 80 30 85 Q34 81 38 84 C35 72 39 59 48 48 Z" fill="url(#vh-cape)"/>
