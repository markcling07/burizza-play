    <path d="M40 42 Q51 38 62 42 L63 58 L39 58 Z" fill="url(#vh-cloth)"/>
    <!-- back pauldron -->
    <path d="M35 43 Q38 36 46 38.5 L45.5 46 Q39.5 47.5 35 43 Z" fill="url(#vh-steel)"/>
    <path d="M36 42 Q39 38.5 45 40" fill="none" stroke="url(#vh-gold)" stroke-width="1.6"/>
    <!-- ornate gold belt and its boss -->
    <path d="M38.5 53 Q51 50 63.5 53 L63.5 61 Q51 64 38.5 61 Z" fill="url(#vh-gold)"/>
    <circle cx="51" cy="57" r="3.3" fill="url(#vh-gold)"/>
    <path d="M53.5 61.5 Q55 66 53 70 M55.5 61.5 Q58 65 57.5 69" fill="none" stroke="#c9a14a" stroke-width="1.1"/>
    <!-- arms, folded across the chest: back forearm under, front arm over -->
    <path d="M42.5 49.5 L60.5 44.5 L62 49.5 L44 54.5 Z" fill="url(#vh-cloth)"/>
    <circle cx="61.5" cy="46.8" r="2.4" fill="#e2b48f"/>
    <path d="M57 43.5 Q65 43 66.5 51.5 L61.5 54 Q59 48.5 56 47.5 Z" fill="url(#vh-cloth)"/>
    <path d="M65.5 48.5 L45.5 45.8 L44.8 51 L63 54.2 Z" fill="url(#vh-cloth)"/>
    <path d="M58 46.5 L52 45.7 L51.4 50.6 L57.4 51.4 Z" fill="url(#vh-gold)" stroke-width="1"/>
    <circle cx="44.4" cy="48.4" r="2.5" fill="#e2b48f"/>
    <!-- front pauldron, gold over steel -->
    <path d="M54 40 Q63 34.5 68.5 41.5 Q65 47.5 57 46.5 Z" fill="url(#vh-steel)"/>
    <path d="M55 39.6 Q62.5 35.5 67.4 41 Q63 38.8 56.5 42.5 Z" fill="url(#vh-gold)"/>
    <!-- head -->
    <circle cx="53" cy="29.5" r="8.6" fill="#e2b48f"/>
    <!-- white hair, streaming back on the wind -->
    <path d="M44.6 31 Q42.5 21.5 51 19.6 Q59.5 18.6 61.6 25.4 Q57 22.4 51 24.4 Q47.6 26 46.6 33 Q43 37.5 37 41.5 Q31 43 26.5 41 Q33 39.5 37.5 35.5 Q41.5 32.5 44.6 31 Z" fill="url(#vh-hair)"/>
    <path d="M45.5 24.5 Q38 21 30 24.5 Q37 24.6 43.5 28" fill="url(#vh-hair)" stroke-width="1.2"/>
    <!-- long white beard over the chest -->
    <path d="M47 32.4 Q46.5 44 51.5 50.5 Q53.5 47 56.5 49.5 Q60.5 41.5 61.2 32 Q57.8 35.6 54.4 34.6 Q50.6 34.4 47 32.4 Z" fill="url(#vh-hair)"/>
  </g>
  <!-- face: heavy brow, light in the eye, drooping moustache -->
  <path d="M54 26.6 Q57.5 24.8 61 26.6" stroke="#f4f2ec" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M54.6 27.2 Q57.6 26.2 60.4 27.6" stroke="#15121d" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <circle cx="57.6" cy="29.4" r="2.4" fill="#ffe489" opacity=".55"/>
  <circle cx="57.6" cy="29.4" r="1.25" fill="#1d2130"/>
  <circle cx="57.9" cy="29.1" r=".45" fill="#fff8de"/>
  <path d="M60.2 31.2 Q61.6 32.4 61.2 33.2" stroke="#b07a5a" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M54.6 34.4 Q57.6 33 60.8 34.6 Q60.2 37.8 58.2 38.6 M54.6 34.4 Q53.4 36.6 53.8 38.8" stroke="#ffffff" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <path d="M50.5 38 q1.6 5.5 4.5 8.8 M55 40 q1 4 3 6" stroke="#c9c4b8" stroke-width=".8" fill="none" stroke-linecap="round"/>
  <!-- trims -->
  <path d="M40 40.5 Q51 37 62 40.5" stroke="url(#vh-gold)" stroke-width="1.4" fill="none"/>
  <path d="M51.3 59 L50.8 91" stroke="#e8c46a" stroke-width="1" opacity=".8"/>
  <path d="M55.4 59 L58.6 90.8" stroke="#e8c46a" stroke-width="1" opacity=".8"/>
  <path d="M41 70 Q39 80 35.5 88" stroke="#8fb4ea" stroke-width="1.2" fill="none" opacity=".7" stroke-linecap="round"/>
  <!-- and two passing in front of him: across his folded arms and across the robe -->
  <g transform="translate(14 49)">
    <path d="M-14 0 Q-8 -2.6 -3 -1 Q-8 1.4 -14 0 Z" fill="#ffd66b" opacity=".55" filter="url(#vh-haze)"/>
    <path d="M-2 -2.4 L70.5 -2.4 L77.5 0 L70.5 2.4 L-2 2.4 Z" fill="#ffd66b" opacity=".7" filter="url(#vh-glow)"/>
    <path d="M0 -1.25 L70.5 -1.25 L76.0 0 L70.5 1.25 L0 1.25 Z" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7" stroke-linejoin="round"/>
    <path d="M1.5 -.2 L71.0 -.2" stroke="#fffdf0" stroke-width=".6" stroke-linecap="round"/>
    <rect x="-1.2" y="-4.4" width="2.4" height="8.8" rx="1" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7"/>
    <rect x="-6.4" y="-.95" width="5.4" height="1.9" rx=".8" fill="#f2c94c" stroke="#b07a1e" stroke-width=".6"/>
    <circle cx="-7.3" cy="0" r="1.5" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".6"/>
  </g>
  <g transform="translate(15 70)">
    <path d="M-14 0 Q-8 -2.6 -3 -1 Q-8 1.4 -14 0 Z" fill="#ffd66b" opacity=".55" filter="url(#vh-haze)"/>
    <path d="M-2 -2.4 L69.5 -2.4 L76.5 0 L69.5 2.4 L-2 2.4 Z" fill="#ffd66b" opacity=".7" filter="url(#vh-glow)"/>
    <path d="M0 -1.25 L69.5 -1.25 L75.0 0 L69.5 1.25 L0 1.25 Z" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7" stroke-linejoin="round"/>
    <path d="M1.5 -.2 L70.0 -.2" stroke="#fffdf0" stroke-width=".6" stroke-linecap="round"/>
    <rect x="-1.2" y="-4.4" width="2.4" height="8.8" rx="1" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".7"/>
    <rect x="-6.4" y="-.95" width="5.4" height="1.9" rx=".8" fill="#f2c94c" stroke="#b07a1e" stroke-width=".6"/>
    <circle cx="-7.3" cy="0" r="1.5" fill="url(#vh-blade)" stroke="#b07a1e" stroke-width=".6"/>
  </g>
  <!-- motes of light -->
  <g fill="#fff4c2"><circle cx="78" cy="12" r=".9"/><circle cx="88" cy="30" r=".7"/><circle cx="30" cy="22" r=".8"/><circle cx="24" cy="46" r=".6"/><circle cx="92" cy="47" r=".6"/></g>
</svg>
