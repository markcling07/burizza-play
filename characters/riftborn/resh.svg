    <circle cx="50.5" cy="28" r="8.2" fill="url(#rs-skin)"/>
    <path d="M41.5 29 Q40 18.5 49.5 17.5 Q58.5 17 60 25 Q56 21.5 52 23.5 Q49 28 46 30.5 Q45 36 43 40 Q41.5 34 41.5 29 Z" fill="url(#rs-hair)"/>
    <path d="M52.6 23.2 Q57.8 23.4 59.4 29 Q57.8 26.6 55.4 26.4 Z" fill="url(#rs-hair)" stroke-width="1.1"/>
    <path d="M49.5 17.6 Q50.5 11.5 56 10.5 Q52.5 13.5 52.5 17.4" fill="none" stroke="#15202a" stroke-width="1.6"/>
  </g>
  <!-- face: brow ridge, sunken eye with teal glint, cheekbone, nose, sinister grin -->
  <path d="M53.2 27.2 Q55.4 26 58.8 27.4" stroke="#2a1a22" stroke-width=".8" fill="none" stroke-linecap="round"/>
