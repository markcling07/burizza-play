<?xml version="1.0" encoding="UTF-8"?>
<!-- Resh (Riftborn, support, Sound) - Burizza art v2. A gaunt, grinning sound-shaper: hair to the ground in
     long black tendrils, a tattered coat, long pale hands hanging empty - his violin and bow play
     themselves in the air at his shoulder, and the music rolls off them toward the enemy in teal waves.
     Canvas 100x100, faces right, feet on y=94. The violin and bow are his weapon (class="wpn"): a racked
     weapon hides them and is drawn in his front hand at data-hand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="61.5,67">
  <defs>
    <linearGradient id="rs-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c3d4a"/><stop offset=".5" stop-color="#15202a"/><stop offset="1" stop-color="#0a0f14"/></linearGradient>
    <linearGradient id="rs-coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4570"/><stop offset=".55" stop-color="#352845"/><stop offset="1" stop-color="#1c1427"/></linearGradient>
    <linearGradient id="rs-vest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3442"/><stop offset="1" stop-color="#4a1820"/></linearGradient>
    <linearGradient id="rs-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4cdd9"/><stop offset="1" stop-color="#9a91a6"/></linearGradient>
    <linearGradient id="rs-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8603a"/><stop offset=".55" stop-color="#7a3420"/><stop offset="1" stop-color="#4a1c12"/></linearGradient>
    <linearGradient id="rs-trousers" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3a46"/><stop offset="1" stop-color="#22222c"/></linearGradient>
    <radialGradient id="rs-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fcad1" stop-opacity=".45"/><stop offset="1" stop-color="#5fcad1" stop-opacity="0"/></radialGradient>
    <filter id="rs-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <ellipse cx="49" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- the hum around the instrument -->
  <circle class="wpn" cx="70" cy="31" r="17" fill="url(#rs-aura)"/>
  <g stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- hair: behind him, streaming to the ground in long tendrils -->
    <path d="M42 22 Q33 26 30 38 Q27 50 20 58 Q14 66 13 78 Q17 70 22 66 Q20 75 22 86 Q26 74 30 66 Q30 76 34 84 Q35 70 38 58 Q42 44 46 34 Z" fill="url(#rs-hair)"/>
    <path d="M55 24 Q61 30 62 42 Q63 54 68 64 Q73 74 74 88 Q69 79 66 72 Q66 81 63 89 Q62 76 60 66 Q57 54 56 44 Z" fill="url(#rs-hair)"/>
    <!-- trousers and shoes -->
    <path d="M42 74 L47 74 L45.5 89 L41 89 Z" fill="url(#rs-trousers)"/>
    <path d="M51 74 L56 74 L59 89 L54.5 89 Z" fill="url(#rs-trousers)"/>
    <path d="M39 88.5 h7.5 v5 h-9.5 Q36.5 90 39 88.5 Z" fill="#5a3a26"/>
    <path d="M53.5 88.5 h7 l4 5 h-12 Z" fill="#6e4a30"/>
    <!-- the long coat, tattered at the hem -->
    <path d="M38 40 Q48 35.5 59 40 L62 58 L66 79 L63.5 76.5 L62 81 L59.5 77 L57.5 82 L55 77.5 L53 75 L50 75 L46 76 L44 81 L42 76.5 L39.5 81.5 L38 76 L35.5 79.5 L35 75 L32.5 77 L35 58 Z" fill="url(#rs-coat)"/>
    <!-- waistcoat and shirt in the open front -->
    <path d="M45 40 Q50 38.5 55 40.5 L54 62 L49.5 64.5 L46 62 Z" fill="url(#rs-vest)"/>
    <path d="M47 40 L50.2 46.5 L53 40.6 Q50 39.4 47 40 Z" fill="#d9d4e0"/>
    <!-- lapels -->
    <path d="M45 40 L49 52 L44 58 L42 42 Z" fill="#2a1f36"/>
    <path d="M55 40.5 L52 52 L56.5 57 L58 42 Z" fill="#2a1f36"/>
    <!-- back arm: sleeve hanging, ragged cuff, long pale hand -->
    <path d="M38.5 41 Q34 48 34 60 L38.5 62 Q39 52 41.5 45 Z" fill="url(#rs-coat)"/>
    <path d="M33.6 60 l1.2 3 l1.4 -2 l1.2 3 l1.4 -2.4 l.6 1.6 L38.5 62 Z" fill="url(#rs-coat)" stroke-width="1"/>
    <path d="M34.5 63.5 Q33.5 67 34 70 M35.8 63.8 Q35.6 67.6 36.6 70.6 M37.2 63.6 Q37.6 67 38.8 69.4" fill="none" stroke="url(#rs-skin)" stroke-width="1.8"/>
    <!-- front arm -->
    <path d="M57.5 40.5 Q63 46 63.5 60 L58.5 61.5 Q58 52 55.5 46 Z" fill="url(#rs-coat)"/>
    <path d="M58.2 61 l1 3.2 l1.3 -2.2 l1.3 3 l1.2 -2.6 l1 1.8 L63.5 60 Z" fill="url(#rs-coat)" stroke-width="1"/>
    <path d="M59.4 64.5 Q59 68 59.6 71 M60.8 64.8 Q61 68.6 62.2 71.4 M62.2 64.4 Q63 67.8 64.4 70" fill="none" stroke="url(#rs-skin)" stroke-width="1.9"/>
    <!-- head, bowed forward, half hidden in the hair -->
    <circle cx="50.5" cy="28" r="8.2" fill="url(#rs-skin)"/>
    <path d="M41.5 29 Q40 18.5 49.5 17.5 Q58.5 17 60 25 Q56 21.5 52 23.5 Q49 28 46 30.5 Q45 36 43 40 Q41.5 34 41.5 29 Z" fill="url(#rs-hair)"/>
    <path d="M52.6 23.2 Q57.8 23.4 59.4 29 Q57.8 26.6 55.4 26.4 Z" fill="url(#rs-hair)" stroke-width="1.1"/>
    <path d="M49.5 17.6 Q50.5 11.5 56 10.5 Q52.5 13.5 52.5 17.4" fill="none" stroke-width="1.6"/>
  </g>
  <!-- face: sunken eye with a teal glint, and that wide grin -->
  <path d="M53.6 27.6 Q56.4 26.4 58.6 28" stroke="none" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <ellipse cx="56.2" cy="29.4" rx="1.9" ry="1.5" fill="#2a2236"/>
  <circle cx="56.5" cy="29.4" r=".8" fill="#5fcad1"/>
  <circle cx="56.5" cy="29.4" r="2.2" fill="#5fcad1" opacity=".35" filter="url(#rs-glow)"/>
  <path d="M51.5 33.2 Q55 35.6 58.8 33" stroke="none" stroke-width="1.2" fill="#2a1a22" stroke-linejoin="round"/>
  <path d="M52.6 33.7 l.5 1.2 M54 34.2 l.4 1.3 M55.5 34.4 l.3 1.3 M57 34.1 l.2 1.2" stroke="#f4f0e6" stroke-width=".8" stroke-linecap="round"/>
  <path d="M49.8 31.4 Q50.6 33 50.4 35" stroke="#7d728c" stroke-width=".8" fill="none" stroke-linecap="round"/>
  <!-- coat details: a button, a pinned flower, the stitches of old repairs -->
  <circle cx="49.6" cy="52" r="1.1" fill="#c9a14a" stroke="none" stroke-width=".6"/>
  <path d="M44.8 46 l1.2 -1 l.4 1.4 z" fill="#7fd08a"/>
  <path d="M60.2 50 l1.6 .4 M60 52 l1.6 .4 M60.4 54 l1.6 .3" stroke="#a89bbf" stroke-width=".7" stroke-linecap="round"/>
  <path d="M36.6 52 l1.4 .6 M36.4 54 l1.4 .6" stroke="#a89bbf" stroke-width=".7" stroke-linecap="round"/>
  <!-- a few loose strands in front -->
  <path d="M46 30 Q44 42 46.5 50 M47.4 30.4 Q46.6 40 49 46" stroke="none" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- the violin, playing itself at his shoulder -->
  <g class="wpn" stroke="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-16 66 33) translate(66.5 33) scale(1.45) translate(-65.5 -33)">
    <path d="M59.5 33 Q59 28.2 62.8 28.4 Q64.4 29.6 66 28.6 Q68.6 27 70.4 29.8 Q71.4 31.2 71.4 33 Q71.4 34.8 70.4 36.2 Q68.6 39 66 37.4 Q64.4 36.4 62.8 37.6 Q59 37.8 59.5 33 Z" fill="url(#rs-wood)"/>
    <path d="M63 31 q1 .6 0 1.2 M63 34.4 q1 .6 0 1.2" stroke-width=".7" fill="none"/>
    <rect x="71" y="32" width="12" height="2" rx=".6" fill="#2a1a14"/>
    <path d="M83 31.2 Q86.6 30.6 86.8 33 Q86.6 35.4 83 34.8 Z" fill="url(#rs-wood)"/>
    <circle cx="85.4" cy="33" r=".9" fill="#2a1a14" stroke-width=".6"/>
    <path d="M60.6 33 L83 33" stroke="#e6dccf" stroke-width=".5"/>
    <rect x="64.6" y="31.4" width="1" height="3.2" fill="#2a1a14" stroke-width=".5"/>
  </g>
  <!-- the bow, drawn across the strings -->
  <g class="wpn" stroke-linecap="round">
    <path d="M45 50 L92 24" stroke="none" stroke-width="2.6"/>
    <path d="M45 50 L92 24" stroke="#6e3a24" stroke-width="1.4"/>
    <path d="M46.6 51.6 L91.6 26.6" stroke="#e8e2d6" stroke-width=".8"/>
    <rect x="43.4" y="48.6" width="3.4" height="2.4" rx=".6" fill="#c9a14a" stroke="none" stroke-width=".7" transform="rotate(-29 45 50)"/>
  </g>
  <!-- the music, rolling off toward the enemy -->
  <g class="wpn" fill="none" stroke="#5fcad1" stroke-linecap="round">
    <path d="M86 40 Q90 44 86 48" stroke-width="1.6" opacity=".9"/>
    <path d="M90 37 Q96 44 90 51" stroke-width="1.4" opacity=".65"/>
    <path d="M94 34 Q101 44 94 54" stroke-width="1.2" opacity=".4"/>
  </g>
  <g class="wpn" fill="#5fcad1" stroke="none" stroke-width=".6">
    <ellipse cx="78" cy="15.5" rx="1.6" ry="1.2" transform="rotate(-20 78 15.5)"/>
    <path d="M79.4 15 L79.4 9 L82 10" fill="none" stroke="#5fcad1" stroke-width="1"/>
    <ellipse cx="91" cy="27" rx="1.3" ry="1" transform="rotate(-20 91 27)"/>
    <path d="M92.2 26.6 L92.2 21.6" fill="none" stroke="#5fcad1" stroke-width=".9"/>
  </g>
</svg>
