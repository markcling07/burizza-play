  <path d="M49.8 31.4 Q50.6 33 50.4 35" stroke="#7d728c" stroke-width=".8" fill="none" stroke-linecap="round"/>
  <!-- wide sinister grin with individual teeth -->
  <path d="M51.5 33.2 Q55 35.6 58.8 33" stroke="none" stroke-width="1.2" fill="url(#rs-grin)" stroke-linejoin="round"/>
  <path d="M52.2 33.6 l.4 1.1 M53.2 34 l.35 1.2 M54.2 34.3 l.3 1.3 M55.2 34.5 l.25 1.2 M56.2 34.4 l.3 1.2 M57.2 34.1 l.35 1.1 M58.2 33.6 l.3 .9" stroke="#f4f0e6" stroke-width=".65" stroke-linecap="round"/>
  <path d="M51.8 33.2 Q51.2 33.8 51 33.2 M58.6 33 Q59.2 33.6 59.4 33" stroke="#2a1a22" stroke-width=".5" fill="none"/>
