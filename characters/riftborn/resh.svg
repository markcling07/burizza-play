    <path d="M57.5 40.5 Q63 46 63.5 60 L58.5 61.5 Q58 52 55.5 46 Z" fill="url(#rs-coat)"/>
    <path d="M58.2 61 l1 3.2 l1.3 -2.2 l1.3 3 l1.2 -2.6 l1 1.8 L63.5 60 Z" fill="url(#rs-coat)" stroke-width="1"/>
