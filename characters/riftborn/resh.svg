    <path d="M48 41 L50.2 44 L52.2 41.2" stroke="#c4bdd0" stroke-width=".4" fill="none"/>
    <circle cx="50" cy="48" r=".7" fill="#c9a14a"/><circle cx="50" cy="53" r=".7" fill="#c9a14a"/><circle cx="50.2" cy="58" r=".7" fill="#c9a14a"/>
    <path d="M50 53 Q53 54.5 54.5 53 Q55.5 52 55 50.5" stroke="#c9a14a" stroke-width=".5" fill="none"/><circle cx="55" cy="50.5" r=".6" fill="#c9a14a"/>
