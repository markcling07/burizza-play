  <path d="M44.8 46 l1.2 -1 l.4 1.4 z" fill="#7fd08a"/><circle cx="45.4" cy="45.6" r=".4" fill="#e8d44a"/>
  <path d="M44.2 46.4 l-.6 .8 M45.8 45.2 l.4 -.8 M44.4 45.4 l-.8 -.2" stroke="#5a9a64" stroke-width=".4" fill="none"/>
  <path d="M60.2 50 l1.6 .4 M60 52 l1.6 .4 M60.4 54 l1.6 .3" stroke="#a89bbf" stroke-width=".7" stroke-linecap="round"/>
  <path d="M36.6 52 l1.4 .6 M36.4 54 l1.4 .6 M36.8 56 l1.2 .5" stroke="#a89bbf" stroke-width=".7" stroke-linecap="round"/>
  <path d="M40 62 Q42 61 44 62.5 M56 60 Q58 59 60 60.5" stroke="#352845" stroke-width=".5" fill="none" opacity=".6"/>
  <!-- a few loose strands in front -->
  <path d="M46 30 Q44 42 46.5 50 M47.4 30.4 Q46.6 40 49 46" stroke="#15202a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M45.2 31 Q43.5 38 44.5 44" stroke="url(#rs-hair)" stroke-width="1" fill="none" opacity=".6"/>
  <!-- the violin, playing itself at his shoulder -->
  <g class="wpn" stroke="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-16 66 33) translate(66.5 33) scale(1.45) translate(-65.5 -33)">
    <path d="M59.5 33 Q59 28.2 62.8 28.4 Q64.4 29.6 66 28.6 Q68.6 27 70.4 29.8 Q71.4 31.2 71.4 33 Q71.4 34.8 70.4 36.2 Q68.6 39 66 37.4 Q64.4 36.4 62.8 37.6 Q59 37.8 59.5 33 Z" fill="url(#rs-wood)"/>
    <path d="M62.4 30.6 q.6 .4 .2 1 q-.4 .5 -.2 1.2 M62.4 34 q.6 .4 .2 1 q-.4 .5 -.2 1.2" stroke="#2a1a14" stroke-width=".55" fill="none"/>
    <path d="M59.8 34.5 Q59 35 59.2 36.5 Q59.4 37 60 37" stroke="#2a1a14" stroke-width=".6" fill="#3a2418"/>
