<?xml version="1.0" encoding="UTF-8"?>
<!-- Resh (Riftborn, support, Sound) - Burizza art v2. A gaunt, grinning sound-shaper: hair to the ground in
     long black tendrils, a tattered coat, long pale hands hanging empty - his violin and bow play
     themselves in the air at his shoulder, and the music rolls off them toward the enemy in teal waves.
     Canvas 100x100, faces right, feet on y=94. The violin and bow are his weapon (class="wpn"): a racked
     weapon hides them and is drawn in his front hand at data-hand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="61.5,67">
  <defs>
    <linearGradient id="rs-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c3d4a"/><stop offset=".5" stop-color="#15202a"/><stop offset="1" stop-color="#0a0f14"/></linearGradient>
    <linearGradient id="rs-coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4570"/><stop offset=".55" stop-color="#352845"/><stop offset="1" stop-color="#1c1427"/></linearGradient>
    <linearGradient id="rs-vest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3442"/><stop offset="1" stop-color="#4a1820"/></linearGradient>
    <linearGradient id="rs-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4cdd9"/><stop offset="1" stop-color="#9a91a6"/></linearGradient>
    <linearGradient id="rs-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8603a"/><stop offset=".55" stop-color="#7a3420"/><stop offset="1" stop-color="#4a1c12"/></linearGradient>
    <linearGradient id="rs-trousers" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3a46"/><stop offset="1" stop-color="#22222c"/></linearGradient>
    <linearGradient id="rs-grin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a12"/><stop offset="1" stop-color="#0a0408"/></linearGradient>
    <linearGradient id="rs-shoe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5236"/><stop offset="1" stop-color="#3a2416"/></linearGradient>
    <radialGradient id="rs-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fcad1" stop-opacity=".45"/><stop offset="1" stop-color="#5fcad1" stop-opacity="0"/></radialGradient>
    <radialGradient id="rs-wisp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fcad1" stop-opacity=".22"/><stop offset="1" stop-color="#5fcad1" stop-opacity="0"/></radialGradient>
    <filter id="rs-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <ellipse cx="49" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- spectral wisps drifting around the figure -->
  <ellipse cx="30" cy="60" rx="10" ry="5" fill="url(#rs-wisp)" transform="rotate(-18 30 60)"/>
  <ellipse cx="62" cy="72" rx="8" ry="4" fill="url(#rs-wisp)" transform="rotate(12 62 72)"/>
  <path d="M24 78 Q28 70 22 62 Q18 68 24 78 Z" fill="#5fcad1" opacity=".08"/>
  <path d="M66 82 Q70 74 64 68 Q62 74 66 82 Z" fill="#5fcad1" opacity=".06"/>
