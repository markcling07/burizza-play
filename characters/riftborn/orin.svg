<?xml version="1.0" encoding="UTF-8"?>
<!-- Orin, the Conductor (Riftborn, support) - Burizza art v2. A small orange walker built round a
     glass-eyed sphere, a camera head on a bent stalk looking over it, standing on blade legs. He carries
     no Force of his own, so all four ride on him as lights - Gravity, Light, Sound, Void - ready to lay.
     Canvas 100x100, faces right, feet on y=94. No hands and no painted weapon: a racked weapon is
     slung from his side strut at data-hand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66,64">
  <defs>
    <linearGradient id="or-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".4" stop-color="#f6a12e"/><stop offset="1" stop-color="#b8600e"/></linearGradient>
    <linearGradient id="or-shellD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9862a"/><stop offset="1" stop-color="#7a3c0a"/></linearGradient>
    <linearGradient id="or-blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc35a"/><stop offset=".5" stop-color="#e88a22"/><stop offset="1" stop-color="#a8540c"/></linearGradient>
    <linearGradient id="or-bladeD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8701c"/><stop offset="1" stop-color="#6e3608"/></linearGradient>
    <linearGradient id="or-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9d0b4"/><stop offset="1" stop-color="#7d8670"/></linearGradient>
    <linearGradient id="or-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa0aa"/><stop offset="1" stop-color="#4a4f5a"/></linearGradient>
    <radialGradient id="or-lens" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e8ece0"/><stop offset="1" stop-color="#b9c0ac"/></radialGradient>
    <radialGradient id="or-pupil" cx=".38" cy=".35" r=".65"><stop offset="0" stop-color="#ff8a7a"/><stop offset=".55" stop-color="#e5322a"/><stop offset="1" stop-color="#8a1410"/></radialGradient>
    <filter id="or-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <ellipse cx="50" cy="93" rx="31" ry="3.8" fill="#000" opacity=".35"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- far legs, in shadow behind the body -->
    <path d="M47 70 L44.5 74 L45.5 91.5 L48.5 74 Z" fill="url(#or-bladeD)"/>
    <path d="M33 47.5 L37.5 49 L39 90 L35 60 Z" fill="url(#or-bladeD)"/>
    <!-- back fin -->
    <path d="M60 51 L66.5 41.5 Q69.5 41 69 44.5 L64.5 54 Z" fill="url(#or-shellD)"/>
    <!-- antenna -->
    <path d="M44 23.5 Q41.5 16 43 9.5 Q44 5.5 42 3.5" fill="none" stroke-width="1.1"/>
    <!-- the stalk the camera head rides on -->
    <path d="M50 48.5 Q48 44 50.5 41 Q53 38.5 52 35.5" fill="none" stroke-width="3.6"/>
    <path d="M50 48.5 Q48 44 50.5 41 Q53 38.5 52 35.5" fill="none" stroke="#5a3a2a" stroke-width="1.6"/>
    <path d="M44.5 49.5 Q50 46 55.5 49.5 L55 52 L45 52 Z" fill="url(#or-ring)"/>
    <!-- camera head: a fat tube, fins at the back, a lens looking forward -->
    <path d="M44 23 L63 25.5 Q65 31 63 37.5 L44.5 36.5 Q40.5 30 44 23 Z" fill="url(#or-shell)"/>
    <path d="M45 23.2 L39 18.5 Q37.5 22 41.5 26 Z" fill="url(#or-shellD)"/>
    <path d="M45.5 36.4 L40 41 Q39 37 42.5 34 Z" fill="url(#or-shellD)"/>
    <path d="M52 24.2 L57 21.6 Q59.5 21.8 58.6 24.6 Z" fill="url(#or-shell)"/>
    <rect x="52.5" y="27.5" width="4.2" height="2.8" rx=".6" fill="url(#or-shellD)" stroke-width="1"/>
    <ellipse cx="63.4" cy="31.4" rx="5.6" ry="7.4" fill="url(#or-ring)"/>
    <ellipse cx="64" cy="31.4" rx="4.2" ry="5.8" fill="url(#or-lens)"/>
    <circle cx="64.6" cy="31.4" r="2.3" fill="url(#or-pupil)"/>
    <!-- the body: an orange sphere with a white band and a dark keel -->
    <circle cx="50" cy="63" r="14" fill="url(#or-shell)"/>
    <path d="M47 49.4 Q46 63 48 76.5 L51.6 76.8 Q50 63 50.8 49.1 Z" fill="#f2efe4" stroke-width="1"/>
    <path d="M37.5 71 Q50 79.5 62.5 71 L61.5 75.5 Q50 82 38.5 75.5 Z" fill="#5a3a26"/>
    <!-- near legs: blades on piston struts -->
    <path d="M38 66 L27 57" fill="none" stroke-width="3.6"/>
    <path d="M38 66 L27 57" fill="none" stroke="url(#or-steel)" stroke-width="2"/>
    <path d="M23.5 44.5 L29.5 48 L31.5 93 L25 60 Z" fill="url(#or-blade)"/>
    <path d="M62 66 L72.5 57" fill="none" stroke-width="3.6"/>
    <path d="M62 66 L72.5 57" fill="none" stroke="url(#or-steel)" stroke-width="2"/>
    <path d="M78 44 L71.5 48 L68 93 L75.5 60 Z" fill="url(#or-blade)"/>
    <circle cx="27" cy="57" r="1.7" fill="url(#or-steel)" stroke-width="1"/>
    <circle cx="72.5" cy="57" r="1.7" fill="url(#or-steel)" stroke-width="1"/>
    <circle cx="61.6" cy="66.6" r="2.4" fill="#3a2a22" stroke-width="1"/>
    <!-- the great eye on the body -->
    <circle cx="56" cy="62.5" r="7.6" fill="url(#or-ring)"/>
    <circle cx="56.4" cy="62.5" r="5.8" fill="url(#or-lens)"/>
    <circle cx="57" cy="62.5" r="2.7" fill="url(#or-pupil)"/>
  </g>
  <!-- lens cross-hairs, glints and wear -->
  <path d="M64 25.8 V37 M60 31.4 H68" stroke="#9aa58a" stroke-width=".6"/>
  <path d="M56.4 56.8 V68.2 M50.8 62.5 H62" stroke="#9aa58a" stroke-width=".6"/>
  <circle cx="63.8" cy="30.6" r=".8" fill="#fff"/>
  <circle cx="56.2" cy="61.6" r=".9" fill="#fff"/>
  <path d="M41.5 56 Q44.5 52 49 50.6" stroke="#fff" stroke-width="1.3" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M46.5 25.6 L60 27.2" stroke="#fff" stroke-width="1.1" fill="none" opacity=".55" stroke-linecap="round"/>
  <g fill="#7a4410"><circle cx="40" cy="61" r=".6"/><circle cx="41" cy="66" r=".6"/><circle cx="53.4" cy="51.6" r=".6"/><circle cx="58.6" cy="53.4" r=".6"/></g>
  <path d="M55 73.6 h1.2 M57 73.4 h1.2 M59 73 h1.2" stroke="#15121d" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M26.5 70 l2 -1 M27.4 74 l2 -1 M71.2 70 l2 1" stroke="#fff3d6" stroke-width=".9" opacity=".7" stroke-linecap="round"/>
  <!-- the four Forces he can lay, lit along his band: Gravity, Light, Sound, Void -->
  <g stroke="#15121d" stroke-width=".6">
    <circle cx="44" cy="55" r="1.5" fill="#6b74c8"/><circle cx="43.2" cy="59.6" r="1.5" fill="#e8d26a"/>
    <circle cx="43" cy="64.2" r="1.5" fill="#5fcad1"/><circle cx="43.4" cy="68.8" r="1.5" fill="#8a5ad6"/>
  </g>
  <g filter="url(#or-glow)" opacity=".75">
    <circle cx="44" cy="55" r="1.6" fill="#6b74c8"/><circle cx="43.2" cy="59.6" r="1.6" fill="#e8d26a"/>
    <circle cx="43" cy="64.2" r="1.6" fill="#5fcad1"/><circle cx="43.4" cy="68.8" r="1.6" fill="#8a5ad6"/>
  </g>
</svg>
