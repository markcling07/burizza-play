<?xml version="1.0" encoding="UTF-8"?>
<!-- Sawtooth (melee) - Ashfall Road art v3. Scrapper with buzzsaw arms.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="80,62">
  <defs>
    <linearGradient id="st-rust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8a472"/><stop offset=".2" stop-color="#d4864a"/>
      <stop offset=".45" stop-color="#b0693e"/><stop offset=".7" stop-color="#8e5032"/><stop offset="1" stop-color="#4a2818"/></linearGradient>
    <linearGradient id="st-rustD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4830"/><stop offset=".5" stop-color="#5c3420"/><stop offset="1" stop-color="#3a1e10"/></linearGradient>
    <linearGradient id="st-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a7d90"/><stop offset=".35" stop-color="#5c5f70"/>
      <stop offset=".7" stop-color="#3e4050"/><stop offset="1" stop-color="#24262e"/></linearGradient>
    <linearGradient id="st-blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#e4e8f0"/>
      <stop offset=".5" stop-color="#c2c8d6"/><stop offset=".8" stop-color="#9aa0b0"/><stop offset="1" stop-color="#6e7488"/></linearGradient>
    <linearGradient id="st-yel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c8"/><stop offset=".5" stop-color="#ffd54f"/><stop offset="1" stop-color="#d49a1a"/></linearGradient>
    <radialGradient id="st-heat" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e0"/><stop offset=".3" stop-color="#ffcc44"/>
      <stop offset=".6" stop-color="#ff8822"/><stop offset="1" stop-color="#c0300a" stop-opacity="0"/></radialGradient>
    <linearGradient id="st-soot" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5c5f70"/><stop offset=".3" stop-color="#4a3830"/>
      <stop offset=".7" stop-color="#886048"/><stop offset="1" stop-color="#3a2e28"/></linearGradient>
    <linearGradient id="st-piston" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ccd8"/><stop offset=".5" stop-color="#8a8e9a"/><stop offset="1" stop-color="#606478"/></linearGradient>
    <linearGradient id="st-patch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a8068"/><stop offset="1" stop-color="#4a5038"/></linearGradient>
    <linearGradient id="st-copper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c87848"/><stop offset="1" stop-color="#7a4428"/></linearGradient>
    <filter id="st-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="st-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".5"/></filter>
  </defs>
  <ellipse cx="52" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
  <!-- exhaust heat + embers -->
  <circle cx="37" cy="24" r="6" fill="url(#st-heat)" filter="url(#st-glow)"/>
  <g fill="#ffaa33" opacity=".7"><circle cx="34" cy="20" r=".6"/><circle cx="36" cy="17.5" r=".4"/><circle cx="32" cy="22" r=".5"/></g>
  <g stroke="none">
    <!-- exhaust pipe + soot bands + spark arrestor -->
    <path d="M42 46 L36 28 L40 27 L46.5 44 Z" fill="url(#st-soot)"/>
    <path d="M37.5 30 L39.5 29 L39.8 31 L37.8 31.8 Z" fill="#886048" opacity=".6"/>
    <path d="M38 33.5 L40 32.8 L40.2 34.2 L38.2 34.8 Z" fill="#aa7858" opacity=".5"/>
    <path d="M36 28 l1.5-.5 l.3 1.8 l-1.5.5 z" fill="#5c5f70"/>
    <line x1="36.5" y1="28" x2="37" y2="29.3" stroke="#3e4050" stroke-width=".3"/>
    <line x1="37" y1="27.8" x2="37.5" y2="29.1" stroke="#3e4050" stroke-width=".3"/>
    <!-- back arm + cable -->
    <path d="M44 48 L32 55 L29 51 L41 44 Z" fill="url(#st-rustD)"/>
    <path d="M40 46 Q36 50 33 53" stroke="#222" stroke-width=".8" fill="none"/>
    <!-- small back saw -->
    <g class="wpn" transform="translate(25 57) rotate(12)">
      <path d="M4,0 L7.6,2.5 L3.2,2.4 L4.7,6.5 L1.2,3.8 L0,8 L-1.2,3.8 L-4.7,6.5 L-3.2,2.4 L-7.6,2.5 L-4,0 L-7.6,-2.5 L-3.2,-2.4 L-4.7,-6.5 L-1.2,-3.8 L0,-8 L1.2,-3.8 L4.7,-6.5 L3.2,-2.4 L7.6,-2.5 Z" fill="#8790a3"/>
      <circle r="3.2" fill="url(#st-iron)"/><circle r="1.2" fill="#222"/>
      <path d="M5 1 l1.5.5 M-3-5 l-.8-1" stroke="#6e7488" stroke-width=".4" opacity=".6"/>
    </g>
    <!-- back leg -->
    <path d="M41 67 L50 69.5 L47 81 L41.5 79 Z" fill="url(#st-rustD)"/>
    <rect x="43" y="71" width="1.6" height="7" rx=".4" fill="url(#st-piston)" transform="rotate(5 43 71)"/>
    <path d="M41.5 78 L47 79.5 L48 88.5 L42.5 88.5 Z" fill="url(#st-iron)"/>
    <path d="M42 81 L46 82 L45.5 86 L42.3 85.5 Z" fill="url(#st-rustD)" opacity=".7"/>
    <path d="M37.5 88 h11 v5.5 h-12 z" fill="#3a2a22"/>
    <path d="M39 90 h8 M39 92 h7.5" stroke="#2a1a14" stroke-width=".6"/>
    <!-- front leg -->
    <path d="M51.5 67 L61 68 L61 81 L53.5 80.5 Z" fill="url(#st-rust)"/>
    <rect x="55" y="70" width="2" height="8" rx=".5" fill="url(#st-piston)" transform="rotate(-3 55 70)"/>
    <path d="M53 72 Q56 76 54 80" stroke="#1a1a22" stroke-width=".7" fill="none"/>
    <path d="M54 79 L61 79.5 L63 88.5 L56.5 88.5 Z" fill="url(#st-iron)"/>
    <path d="M55 81 L60 81.5 L59.5 86 L55.5 85.5 Z" fill="url(#st-rust)" opacity=".8"/>
    <path d="M53 88 h11 l2.5 5.5 h-14 z" fill="#4a352a"/>
    <path d="M66.5 93.5 l1.5.5" stroke="#4a352a" stroke-width="1" stroke-linecap="round"/>
    <path d="M55 90 h9 M55 92 h8.5" stroke="#3a2518" stroke-width=".6"/>
    <!-- hunched torso -->
    <path d="M40 46 Q47 36 61 39 L63 64 Q54 72 43 69 Z" fill="url(#st-rust)"/>
    <path d="M42 62 Q52 66 62.5 60 L63 64 Q54 72 43 69 Z" fill="url(#st-iron)"/>
    <path d="M48 58 L50 58 L50 63 L48 63 Z" fill="#1a1822" opacity=".6"/>
    <path d="M44 52 Q50 50 56 53" stroke="#1a1822" stroke-width=".9" fill="none"/>
    <path d="M44 53 Q50 51 56 54" stroke="#8b2020" stroke-width=".6" fill="none"/>
    <!-- scrap patches -->
    <path d="M44 48 L53 46.5 L54 55 L45 56.5 Z" fill="url(#st-rustD)"/>
    <path d="M54 42 L60 41 L60.5 47 L54.5 47.5 Z" fill="url(#st-patch)"/>
    <path d="M56 39 L60.5 39 L60 43 L56 43 Z" fill="url(#st-copper)"/>
    <path d="M44 55 Q48 53 52 55" stroke="#8e5032" stroke-width=".4" fill="none" opacity=".5" stroke-dasharray="1 .5"/>
    <path d="M47 50 l4 .5 M50 52 l3-.3 M57 45 l2 1.5" stroke="#3a1e10" stroke-width=".5" opacity=".7"/>
    <!-- head -->
    <path d="M55 30 Q56 22 66 22.5 Q74 23.5 74 31 L73 37 L58 38 Z" fill="url(#st-rust)"/>
    <path d="M61 27 L72 26 L72 33 L61 34 Z" fill="url(#st-iron)"/>
    <path d="M63 29 L71.5 28.2 L71 32 L63.5 32.8 Z" fill="#ffd166" filter="url(#st-glow)"/>
    <path d="M63.5 29.5 L71 29 L70.7 31.5 L64 32 Z" fill="#fff4c8"/>
    <path d="M60 24 L62 22.5 L63 24 L61 25.5 Z" fill="url(#st-soot)"/>
    <path d="M64 23 L66 21.5 L67 23.5 L65 25 Z" fill="url(#st-soot)"/>
    <path d="M68 22 l1-3" stroke="#5c5f70" stroke-width=".8" stroke-linecap="round"/>
    <!-- jaw -->
    <path d="M58 37.5 L72 36.5 L70 42.5 L60 43 Z" fill="url(#st-iron)"/>
    <rect x="62" y="37" width="1.2" height="3.5" rx=".3" fill="url(#st-piston)"/>
    <rect x="67" y="36.5" width="1.2" height="3.5" rx=".3" fill="url(#st-piston)"/>
    <path d="M61 42 l1.2-2.6 l1.2 2.4 l1-2.4 l1.2 2.5 l1-2.5 l1.2 2.4 l1-2.5 l1 2.3" stroke="#ffd166" stroke-width=".9" fill="none" stroke-linejoin="bevel"/>
    <!-- front arm -->
    <path d="M58 46 L69 55 L65 59 L55 50 Z" fill="url(#st-rust)"/>
    <circle cx="59" cy="45" r="5.8" fill="url(#st-rust)"/>
    <circle cx="59" cy="45" r="2.5" fill="url(#st-iron)"/>
    <path d="M61 48 Q66 52 67 56" stroke="#222" stroke-width=".7" fill="none"/>
    <path d="M65 53 L80 59 L78 65 L63 60 Z" fill="url(#st-iron)"/>
    <!-- main buzzsaw -->
    <path class="wpn" d="M90.5,62 L95.1,65.5 L89.5,66.6 L92.1,71.7 L86.6,70.2 L86.7,76 L82.3,72.2 L80,77.5 L77.7,72.2 L73.3,76 L73.4,70.2 L67.9,71.7 L70.5,66.6 L64.9,65.5 L69.5,62 L64.9,58.5 L70.5,57.4 L67.9,52.3 L73.4,53.8 L73.3,48 L77.7,51.8 L80,46.5 L82.3,51.8 L86.7,48 L86.6,53.8 L92.1,52.3 L89.5,57.4 L95.1,58.5 Z" fill="url(#st-blade)"/>
    <circle class="wpn" cx="80" cy="62" r="13" fill="none" stroke="#c2c8d6" stroke-width=".4" opacity=".3" filter="url(#st-blur)"/>
    <circle class="wpn" cx="80" cy="62" r="11" fill="none" stroke="#9aa0b0" stroke-width=".3" opacity=".25" filter="url(#st-blur)"/>
    <path class="wpn" d="M93 64 l1.5 1 M85 74 l.5 1.5 M67 70 l-1 1" stroke="#6e7488" stroke-width=".5" opacity=".5"/>
    <circle class="wpn" cx="80" cy="62" r="8.5" fill="none" stroke="#7a7d90" stroke-width=".8" opacity=".9"/>
    <circle class="wpn" cx="80" cy="62" r="5.2" fill="url(#st-yel)"/>
    <path class="wpn" d="M76 59 h1.5 v6 h-1.5 z M82.5 59 h1.5 v6 h-1.5 z" fill="#222" opacity=".7"/>
    <circle class="wpn" cx="80" cy="62" r="1.8" fill="#15121d"/>
  </g>
  <!-- saw sparks -->
  <g class="wpn" fill="#ffd166" opacity=".85">
    <path d="M95 74 l2.5 1.2 l-2.5.6 z"/><path d="M93 78 l2 2.2 l-2.4-.4 z"/>
    <path d="M97 68 l1.8-.3 l-1 1.5 z"/><circle cx="96" cy="76" r=".5"/><circle cx="94" cy="80" r=".4"/>
  </g>
  <path class="wpn" d="M72 55 Q75 50 80 49" stroke="#fff" stroke-width="1.2" fill="none" opacity=".85" stroke-linecap="round"/>
  <path class="wpn" d="M88 70 q3-2.5 4-6" stroke="#ffd166" stroke-width="1" fill="none" opacity=".8" stroke-linecap="round"/>
  <!-- rivets -->
  <g fill="#2c2e3a">
    <circle cx="45.5" cy="49.5" r=".7"/><circle cx="52" cy="48" r=".7"/><circle cx="46.3" cy="55" r=".7"/><circle cx="52.8" cy="54" r=".7"/>
    <circle cx="55.5" cy="43" r=".6"/><circle cx="59" cy="42.5" r=".6"/><circle cx="55.5" cy="46" r=".6"/><circle cx="59" cy="46" r=".6"/>
  </g>
  <!-- rust streaks from bolt holes -->
  <path d="M45.5 50.2 l-.5 3" stroke="#6a3a22" stroke-width=".6" stroke-linecap="round" opacity=".7"/>
  <path d="M52 48.7 l.3 2.5" stroke="#6a3a22" stroke-width=".5" stroke-linecap="round" opacity=".6"/>
  <path d="M55.5 43.6 l-.3 2" stroke="#4a5038" stroke-width=".5" stroke-linecap="round" opacity=".5"/>
  <!-- exposed wiring + grinding marks -->
  <path d="M47 66 Q48 68 47 69.5" stroke="#8b2020" stroke-width=".6" fill="none"/>
  <path d="M57 65 Q58 67 57 69" stroke="#1a1822" stroke-width=".7" fill="none"/>
  <path d="M56 43 l1 1.5 M58 44 l.8 1.2" stroke="#4a2818" stroke-width=".4" opacity=".5"/>
  <!-- exhaust tip ember -->
  <path d="M37 27 l2.5-1" stroke="#ffcc44" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <!-- highlights -->
  <path d="M43 45.5 Q47.5 40 54 39.5" stroke="#fff" stroke-width="1.2" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M58 27 Q60 24.5 64.5 24.5" stroke="#fff" stroke-width="1" fill="none" opacity=".7" stroke-linecap="round"/>
  <path d="M55.5 43 q2-2 4.5-1.5" stroke="#fff" stroke-width=".9" fill="none" opacity=".65" stroke-linecap="round"/>
</svg>
