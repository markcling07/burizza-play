<?xml version="1.0" encoding="UTF-8"?>
<!-- Patchwork (support) - Ashfall Road art v2. Repair drone with welding arms.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece6d6"/><stop offset=".5" stop-color="#ada490"/><stop offset="1" stop-color="#6b6454"/></linearGradient>
    <linearGradient id="hullD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f8774"/><stop offset="1" stop-color="#504a3e"/></linearGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a7765a"/><stop offset="1" stop-color="#5e3d2c"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#737888"/><stop offset="1" stop-color="#2b2e3a"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa3b5"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8ffb0"/><stop offset="1" stop-color="#3fbf5a" stop-opacity="0"/></linearGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#c8ffc0"/><stop offset="1" stop-color="#4fdc5f" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <!-- hover shadow + thrust -->
  <ellipse cx="50" cy="94" rx="18" ry="3" fill="#000" opacity=".3"/>
  <ellipse cx="50" cy="93.5" rx="9" ry="1.8" fill="#8be28b" opacity=".35" filter="url(#glow)"/>
  <path d="M44 72 L56 72 L54 89 L46 89 Z" fill="url(#beam)" opacity=".85" filter="url(#glow)"/>
  <path d="M46.5 72 L53.5 72 L52 83 L48 83 Z" fill="url(#beam)"/>
  <!-- welder spark glow -->
  <circle cx="89" cy="45" r="8" fill="url(#spark)" filter="url(#glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back clamp arm -->
    <path d="M36 52 L27 58 L24.5 55 L33.5 48.5 Z" fill="url(#hullD)"/>
    <path d="M26 56 L19 53 L17 57 L21 59 L17 62 L20 65 L27 60 Z" fill="url(#iron)"/>
    <!-- antenna -->
    <path d="M44 33 L40 19" fill="none" stroke-width="2.6"/>
    <path d="M44 33 L40 19" fill="none" stroke="#a39a86" stroke-width="1.2"/>
    <!-- thruster nozzle -->
    <path d="M42 64 h16 l-2 9 h-12 z" fill="url(#iron)"/>
    <!-- drone shell -->
    <path d="M32 50 Q32 30 50 30 Q68 30 68 50 L65 63 Q50 70 35 63 Z" fill="url(#hull)"/>
    <path d="M33.5 58 Q50 64 66.5 58 L65 63 Q50 70 35 63 Z" fill="url(#iron)"/>
    <!-- bolted patches -->
    <path d="M35 40 L44 37 L46 47 L36.5 49 Z" fill="url(#patch)"/>
    <path d="M47 50 L55 50 L55 56 L47 56.5 Z" fill="url(#hullD)"/>
    <!-- eye housing -->
    <circle cx="59" cy="43" r="7" fill="url(#iron)"/>
    <!-- lower wrench arm -->
    <path d="M60 62 L70 70 L67.5 73 L57.5 65 Z" fill="url(#hull)"/>
    <g transform="rotate(-35 72 72)">
      <rect x="67" y="70.2" width="12" height="3.6" rx="1.2" fill="url(#chrome)"/>
      <path d="M78 67 Q85 66 85.5 72 Q85 78 78 77 L80 74.5 L83 74.5 L83 69.5 L80 69.5 Z" fill="url(#chrome)"/>
    </g>
    <!-- front welder arm -->
    <path d="M63 53 L74 56 L73 60 L62 57.5 Z" fill="url(#hull)"/>
    <path d="M72 55.5 L81 48 L84 51 L75 59.5 Z" fill="url(#hull)"/>
    <circle cx="73.5" cy="57.5" r="2.8" fill="url(#iron)"/>
    <path d="M80 46 L86 43 L88 47 L83 51.5 Z" fill="url(#iron)"/>
    <circle cx="65" cy="54.5" r="4" fill="url(#hull)"/>
  </g>
  <!-- eye lens -->
  <circle cx="59.5" cy="43" r="5" fill="#8be28b" filter="url(#glow)"/>
  <circle cx="59.5" cy="43" r="4" fill="#c8ffc0" stroke="#15121d" stroke-width="1"/>
  <circle cx="60.5" cy="43" r="1.8" fill="#1e5a2a"/>
  <circle cx="58.3" cy="41.6" r=".9" fill="#fff"/>
  <!-- antenna light -->
  <circle cx="40" cy="18" r="3.4" fill="#8be28b" filter="url(#glow)"/>
  <circle cx="40" cy="18" r="2" fill="#d6ffd0" stroke="#15121d" stroke-width="1"/>
  <!-- welder flame + sparks -->
  <path d="M87.5 44 l3 -1.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="#c8ffc0">
    <path d="M92 37 l.7 2 l2 .7 l-2 .7 l-.7 2 l-.7 -2 l-2 -.7 l2 -.7 z"/>
    <path d="M95 47 l.5 1.4 l1.4 .5 l-1.4 .5 l-.5 1.4 l-.5 -1.4 l-1.4 -.5 l1.4 -.5 z"/>
    <path d="M86 36 l.5 1.3 l1.3 .5 l-1.3 .5 l-.5 1.3 l-.5 -1.3 l-1.3 -.5 l1.3 -.5 z"/>
  </g>
  <path d="M91 48 l2.5 3 M89 49.5 l1 3.5" stroke="#8be28b" stroke-width="1" stroke-linecap="round"/>
  <!-- rivets -->
  <g fill="#3a2a20"><circle cx="37" cy="41.5" r=".8"/><circle cx="43" cy="39.5" r=".8"/><circle cx="44.3" cy="45.6" r=".8"/><circle cx="38" cy="47.3" r=".8"/></g>
  <g fill="#3a3530"><circle cx="48.5" cy="51.5" r=".7"/><circle cx="53.5" cy="51.5" r=".7"/><circle cx="48.5" cy="55" r=".7"/><circle cx="53.5" cy="55" r=".7"/></g>
  <!-- stitch weld seam -->
  <path d="M46 34 l1.5 2 M49 33.5 l1.5 2 M52 33.5 l1.5 2" stroke="#6b6454" stroke-width="1" stroke-linecap="round"/>
  <!-- vent glow band -->
  <path d="M40 62 h4 M48 63.5 h4 M56 62 h4" stroke="#8be28b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M36 45 Q37 35 46 32.5" stroke="#fff" stroke-width="1.4" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M62.5 52.5 q1.5 -1.5 3.5 -1" stroke="#fff" stroke-width="1.1" fill="none" opacity=".75" stroke-linecap="round"/>
</svg>
