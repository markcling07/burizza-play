  <path d="M31 50 Q34 43.5 45 42.5" stroke="#fff" stroke-width="1.2" fill="none" opacity=".65" stroke-linecap="round"/>
  <path d="M59 42 Q60 36.5 65.5 36" stroke="#fff" stroke-width="1" fill="none" opacity=".7" stroke-linecap="round"/>
  <path d="M55 30.5 L80 19.5" stroke="#fff" stroke-width="1" opacity=".45" stroke-linecap="round"/>
  <path d="M56 73 L65 75" stroke="#fff" stroke-width=".6" opacity=".35" stroke-linecap="round"/>
</svg>
