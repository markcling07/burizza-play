      <rect x="19.5" y="50.5" width="2.2" height="4.5" rx=".8"/><rect x="23" y="50.5" width="2.2" height="4.5" rx=".8"/><rect x="26.5" y="50.5" width="2.2" height="4.5" rx=".8"/>
      <rect x="19.5" y="56.5" width="2.2" height="4.5" rx=".8"/><rect x="23" y="56.5" width="2.2" height="4.5" rx=".8"/><rect x="26.5" y="56.5" width="2.2" height="4.5" rx=".8"/>
    </g>
