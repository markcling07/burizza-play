  <g fill="url(#hw-brass)" stroke="#a7782b" stroke-width=".3" transform="rotate(25 8 85)"><rect x="6" y="83" width="1.8" height="4.5" rx=".7"/><ellipse cx="6.9" cy="83" rx=".9" ry=".4" fill="#d4b05c"/></g>
  <!-- RIVETS AND BOLTS -->
  <g fill="#2d3426">
    <circle cx="31.5" cy="52" r=".8"/><circle cx="31.5" cy="64" r=".8"/><circle cx="55" cy="66" r=".8"/><circle cx="61" cy="78.5" r=".7"/>
    <circle cx="36" cy="72" r=".6"/><circle cx="66" cy="52" r=".6"/><circle cx="50" cy="77" r=".6"/><circle cx="70" cy="46" r=".6"/>
  </g>
