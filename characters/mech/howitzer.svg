  <rect x="63.5" y="41" width="10" height="4" rx="1.2" fill="#ffd2a8"/>
  <line x1="68.5" y1="41" x2="68.5" y2="45" stroke="#ff7a45" stroke-width=".4" opacity=".5"/>
