<?xml version="1.0" encoding="UTF-8"?>
<!-- Howitzer (ranged) - Ashfall Road art v3. Walking artillery platform.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="73,66.5">
  <defs>
    <linearGradient id="hw-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2ccb0"/><stop offset=".2" stop-color="#9aa885"/><stop offset=".5" stop-color="#6b785c"/><stop offset=".8" stop-color="#4a5440"/><stop offset="1" stop-color="#3c4533"/></linearGradient>
    <linearGradient id="hw-hullD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a664c"/><stop offset=".4" stop-color="#434d38"/><stop offset="1" stop-color="#2d3426"/></linearGradient>
    <linearGradient id="hw-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8fa0"/><stop offset=".3" stop-color="#6a6f80"/><stop offset=".7" stop-color="#3e4150"/><stop offset="1" stop-color="#2a2d38"/></linearGradient>
    <linearGradient id="hw-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb08a"/><stop offset=".5" stop-color="#e8703a"/><stop offset="1" stop-color="#d4501f"/></linearGradient>
    <linearGradient id="hw-brass" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#f8e4a8"/><stop offset=".25" stop-color="#d4b05c"/><stop offset=".5" stop-color="#c49938"/><stop offset=".75" stop-color="#a7782b"/><stop offset="1" stop-color="#7a5518"/></linearGradient>
    <linearGradient id="hw-spring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5a5a"/><stop offset="1" stop-color="#2a2a2a"/></linearGradient>
    <radialGradient id="hw-heat" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e0"/><stop offset=".2" stop-color="#ffcc70"/><stop offset=".45" stop-color="#ff9a5a"/><stop offset=".7" stop-color="#e2461f" stop-opacity=".5"/><stop offset="1" stop-color="#e2461f" stop-opacity="0"/></radialGradient>
    <radialGradient id="hw-weld" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8a8a7a"/><stop offset="1" stop-color="#5a664c"/></radialGradient>
    <filter id="hw-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="hw-sglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>
  <!-- ground shadow -->
