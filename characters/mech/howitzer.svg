  <path d="M36 57 h12 M36 59 h12 M36 61 h12" stroke="#ffcfa8" stroke-width=".8" stroke-linecap="round"/>
  <path d="M39 55 v8 M43 55 v8 M47 55 v8" stroke="#2a2530" stroke-width=".6"/>
  <path d="M38 53 q1 -1.5 2 0 q1 1 2 -.5" stroke="#ff9a5a" stroke-width=".4" fill="none" opacity=".4" filter="url(#hw-sglow)"/>
