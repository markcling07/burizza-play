<?xml version="1.0" encoding="UTF-8"?>
<!-- Howitzer (ranged) - Ashfall Road art v2. Walking artillery platform.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b0bd9e"/><stop offset=".5" stop-color="#6b785c"/><stop offset="1" stop-color="#3c4533"/></linearGradient>
    <linearGradient id="hullD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a664c"/><stop offset="1" stop-color="#2d3426"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#727788"/><stop offset="1" stop-color="#2a2d38"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb08a"/><stop offset="1" stop-color="#d4501f"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d58e"/><stop offset="1" stop-color="#a7782b"/></linearGradient>
    <radialGradient id="heat" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff1c8"/><stop offset=".45" stop-color="#ff9a5a"/><stop offset="1" stop-color="#e2461f" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="28" ry="3.8" fill="#000" opacity=".38"/>
  <!-- muzzle heat + smoke -->
  <circle cx="91" cy="17" r="7" fill="url(#heat)" filter="url(#glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back legs -->
    <path d="M31 70 h12 l-1 17 h-11 z" fill="url(#hullD)"/>
    <path d="M26 86.5 h18 v7 h-19 z" fill="#2a3022"/>
    <!-- ammo drum on the back -->
    <rect x="18" y="44" width="14" height="22" rx="4" fill="url(#hullD)"/>
    <path d="M18 51 h14 M18 58 h14" fill="none"/>
    <!-- squat body -->
    <path d="M27 50 Q30 40 50 40 Q70 40 73 50 L71 74 Q50 81 29 74 Z" fill="url(#hull)"/>
    <path d="M29 68 Q50 75 71 68 L71 74 Q50 81 29 74 Z" fill="url(#orange)"/>
    <!-- front leg -->
    <path d="M54 72 h13 l2 15 h-13 z" fill="url(#hull)"/>
    <path d="M53 86.5 h19 l3 7 h-22 z" fill="#3c4533"/>
    <!-- cabin / head -->
    <path d="M56 44 Q57 35 66 35 Q75 36 75 45 L74 54 L57 54 Z" fill="url(#hull)"/>
    <!-- shoulder cannon -->
    <g transform="rotate(-24 40 38)">
      <rect x="28" y="31" width="22" height="15" rx="3" fill="url(#hull)"/>
      <rect x="48" y="33.5" width="40" height="10" rx="1.5" fill="url(#iron)"/>
      <rect x="62" y="32" width="4" height="13" rx="1" fill="url(#orange)"/>
      <rect x="83" y="31" width="9" height="15" rx="2" fill="url(#iron)"/>
      <rect x="87" y="31" width="2" height="15" fill="url(#orange)" stroke-width="0"/>
    </g>
    <!-- cannon mount -->
    <circle cx="44" cy="42" r="6" fill="url(#hullD)"/>
    <circle cx="44" cy="42" r="2.4" fill="url(#brass)"/>
    <!-- stubby front arm -->
    <path d="M66 56 L74 58 L73 67 L66 66 Z" fill="url(#hull)"/>
    <circle cx="69" cy="56" r="4.6" fill="url(#hull)"/>
    <rect x="70" y="64" width="6" height="5" rx="1.5" fill="url(#iron)"/>
  </g>
  <!-- muzzle bore glow -->
  <circle cx="91.5" cy="16.5" r="2.4" fill="#ffd2a8" opacity=".9" transform="rotate(-24 91.5 16.5)"/>
  <!-- body vents -->
  <rect x="35" y="55" width="16" height="9" rx="1.5" fill="#1d1a22" stroke="#15121d" stroke-width="1.2"/>
  <rect x="36.5" y="56.5" width="13" height="6" rx="1" fill="#ff7a45" opacity=".85" filter="url(#glow)"/>
  <path d="M37 58 h12 M37 61 h12" stroke="#ffcfa8" stroke-width="1" stroke-linecap="round"/>
  <!-- cabin visor -->
  <rect x="64" y="41" width="10" height="4.4" rx="1.5" fill="#ff7a45" filter="url(#glow)"/>
  <rect x="64.5" y="41.5" width="9" height="3.4" rx="1.2" fill="#ffd2a8" stroke="#15121d" stroke-width=".9"/>
  <!-- shells in the drum -->
  <g fill="url(#brass)" stroke="#15121d" stroke-width=".8"><rect x="20.5" y="46" width="2.4" height="4" rx="1"/><rect x="24.3" y="46" width="2.4" height="4" rx="1"/><rect x="28.1" y="46" width="2.4" height="4" rx="1"/></g>
  <!-- rivets -->
  <g fill="#2d3426"><circle cx="31.5" cy="52" r=".9"/><circle cx="55" cy="66" r=".9"/><circle cx="31.5" cy="64" r=".9"/><circle cx="61" cy="78.5" r=".8"/></g>
  <!-- smoke wisp -->
  <path d="M93 9 q2 -2 .5 -4 q2.5 .5 3 -2" stroke="#d9d2c4" stroke-width="1.2" fill="none" opacity=".7" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M31 50 Q34 43.5 45 42.5" stroke="#fff" stroke-width="1.3" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M59 43 Q60 37.5 65.5 37.2" stroke="#fff" stroke-width="1.2" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M55 30.5 L80 19.5" stroke="#fff" stroke-width="1.1" opacity=".55" stroke-linecap="round"/>
</svg>
