    <rect class="wpn" x="80.5" y="44.5" width="3.6" height="13" rx="1.3" fill="url(#al-brass)"/><rect class="wpn" x="81.2" y="46" width="2.2" height="2" rx=".6" fill="#7a4e18" opacity=".35"/>
