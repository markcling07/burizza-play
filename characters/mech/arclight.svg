<?xml version="1.0" encoding="UTF-8"?>
<!-- Arclight (ranged) - Ashfall Road art v2. Tesla-coil sniper unit.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9c0dc"/><stop offset=".5" stop-color="#5a7aa2"/><stop offset="1" stop-color="#2f4462"/></linearGradient>
    <linearGradient id="hullD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a6587"/><stop offset="1" stop-color="#23334a"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#666d82"/><stop offset="1" stop-color="#262a38"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c08a"/><stop offset="1" stop-color="#a5602e"/></linearGradient>
    <radialGradient id="arc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#bff4ff"/><stop offset="1" stop-color="#3fc8ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="22" ry="3.4" fill="#000" opacity=".35"/>
  <!-- coil + muzzle glow -->
  <circle cx="36" cy="13" r="7" fill="url(#arc)" filter="url(#glow)"/>
  <circle cx="93" cy="47" r="8" fill="url(#arc)" filter="url(#glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back tesla coil -->
    <rect x="34.5" y="16" width="3" height="28" fill="url(#iron)"/>
    <rect x="30" y="35" width="12" height="3.2" rx="1.5" fill="url(#copper)"/>
    <rect x="31" y="28.5" width="10" height="3" rx="1.5" fill="url(#copper)"/>
    <rect x="32" y="22" width="8" height="2.8" rx="1.4" fill="url(#copper)"/>
    <circle cx="36" cy="14" r="3.4" fill="#d9f8ff"/>
    <!-- back leg (reverse joint) -->
    <path d="M43 62 L49 63 L44 77 L39 75 Z" fill="url(#hullD)"/>
    <path d="M39 75 L44 77 L47 88.5 L42.5 88.5 Z" fill="url(#iron)"/>
    <path d="M37.5 88 h11 v5.5 h-12 z" fill="#232a3a"/>
    <!-- front leg -->
    <path d="M51 62 L58 63 L60 77 L55 78 Z" fill="url(#hull)"/>
    <path d="M55 77 L60 76.5 L60 88.5 L55.5 88.5 Z" fill="url(#iron)"/>
    <path d="M53 88 h10 l2.5 5.5 h-13 z" fill="#2c3448"/>
    <circle cx="57.5" cy="77" r="2.4" fill="url(#copper)"/>
    <!-- slim torso -->
    <path d="M41 37 Q50 32 59 37 L57 58 Q50 61 43 58 Z" fill="url(#hull)"/>
    <path d="M44 57 h12 l-1 6 h-10 z" fill="url(#iron)"/>
    <!-- head + scope eye -->
    <path d="M45 18 Q45 12 51.5 12 Q58 12 58 18 L58 30 L45 30 Z" fill="url(#hull)"/>
    <path d="M47 30 h9 l-1 4 h-7 z" fill="url(#iron)"/>
    <rect x="55" y="19" width="10" height="5.5" rx="1.2" fill="url(#iron)"/>
    <!-- back arm on the barrel -->
    <path d="M42 41 L70 45 L70 50.5 L44 48 Z" fill="url(#hullD)"/>
    <!-- tesla rifle -->
    <path d="M44 48 L60 47 L62 53 L52 54 L47 59 L42.5 56 Z" fill="url(#iron)"/>
    <rect x="58" y="44" width="30" height="6.5" rx="1.5" fill="url(#iron)"/>
    <rect x="64" y="41.5" width="3.5" height="11.5" rx="1" fill="url(#copper)"/>
    <rect x="70.5" y="41.5" width="3.5" height="11.5" rx="1" fill="url(#copper)"/>
    <rect x="77" y="41.5" width="3.5" height="11.5" rx="1" fill="url(#copper)"/>
    <path d="M87 42.5 L95 42 L91.5 47.2 L95 52.5 L87 52 Z" fill="url(#copper)"/>
    <rect x="60" y="40.5" width="9" height="3" rx="1" fill="url(#hullD)"/>
    <!-- front arm + hand -->
    <path d="M55 39 L62 45 L60 54 L54 51 Z" fill="url(#hull)"/>
    <circle cx="56" cy="40" r="4.6" fill="url(#hull)"/>
    <rect x="57" y="50" width="5.5" height="5" rx="1.5" fill="url(#hullD)"/>
  </g>
  <!-- core + eye -->
  <circle cx="49" cy="53" r="3.6" fill="#7fe3ff" filter="url(#glow)"/>
  <circle cx="49" cy="53" r="2.4" fill="#e8fcff" stroke="#15121d" stroke-width=".9"/>
  <circle cx="65" cy="21.7" r="3" fill="#7fe3ff" filter="url(#glow)"/>
  <circle cx="65" cy="21.7" r="2" fill="#e8fcff" stroke="#15121d" stroke-width=".9"/>
  <path d="M49 24 h7" stroke="#7fe3ff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- crackling arcs -->
  <path d="M94 47 l2 -3 l-1.5 -.5 l2.5 -4" stroke="#bff4ff" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M95 48 l2.5 1.5 l-1 1.5 l2 2" stroke="#bff4ff" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M62 47.2 l3 -1 l2.5 1.2 l3 -1.2 l2.5 1.2 l3 -1.2 l2.5 1.2 l3 -1" stroke="#7fe3ff" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>
  <path d="M36 10 l-2 -3 l1.5 -.5 l-1.5 -3 M38.5 11 l2.5 -2 l-.5 -1.5 l2.5 -1" stroke="#bff4ff" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M44 38.5 Q47 35.5 51 35" stroke="#fff" stroke-width="1.3" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M47 17 Q48 14 51.5 13.8" stroke="#fff" stroke-width="1.2" fill="none" opacity=".85" stroke-linecap="round"/>
  <path d="M60 45.5 h3" stroke="#fff" stroke-width="1" opacity=".7" stroke-linecap="round"/>
</svg>
