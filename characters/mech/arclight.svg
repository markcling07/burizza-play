    <path d="M50 55.5 L58 55 L59 61 L51.5 61.5 Z" fill="url(#al-hull)"/><circle cx="51.5" cy="58.5" r="3.2" fill="url(#al-iron)"/>
    <rect x="56.5" y="54" width="7" height="7.5" rx="2" fill="url(#al-hullD)"/>
