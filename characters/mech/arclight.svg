  <rect x="50.5" y="23" width="13" height="3" rx="1.5" fill="#7fe3ff" filter="url(#al-glow)"/><rect x="51" y="23.4" width="12" height="2.2" rx="1.1" fill="#e8fcff"/>
  <circle cx="65" cy="24.5" r="2.8" fill="#7fe3ff" filter="url(#al-glow)"/><circle cx="65" cy="24.5" r="1.8" fill="#e8fcff"/><circle cx="64.2" cy="23.8" r=".5" fill="#fff" opacity=".9"/>
