  <rect class="wpn" x="49" y="43.8" width="6" height="1.5" rx=".6" fill="#7fe3ff"/>
  <g fill="#23334a"><circle cx="47" cy="51" r=".8"/><circle cx="63" cy="51" r=".8"/><circle cx="43" cy="62" r=".6"/><circle cx="59" cy="62" r=".6"/></g>
