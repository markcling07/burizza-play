<?xml version="1.0" encoding="UTF-8"?>
<!-- Arclight (ranged) - Burizza art v3. Tesla-coil sniper unit.
     Domed visor helm, coil-pylon backpack, ringed tesla rifle at the hip.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="51.5,58.5">
  <defs>
    <linearGradient id="al-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2d6ec"/><stop offset=".3" stop-color="#8aa8c8"/><stop offset=".7" stop-color="#5a7aa2"/><stop offset="1" stop-color="#2f4462"/></linearGradient>
    <linearGradient id="al-hullD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a7a9a"/><stop offset=".4" stop-color="#3e5872"/><stop offset="1" stop-color="#1e2d40"/></linearGradient>
    <linearGradient id="al-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8892a5"/><stop offset=".35" stop-color="#5c6478"/><stop offset=".7" stop-color="#3d4458"/><stop offset="1" stop-color="#1e2230"/></linearGradient>
    <linearGradient id="al-brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8b0"/><stop offset=".3" stop-color="#d4a84e"/><stop offset=".7" stop-color="#b3742a"/><stop offset="1" stop-color="#7a4e18"/></linearGradient>
    <linearGradient id="al-piston" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ccd6e0"/><stop offset=".5" stop-color="#8090a5"/><stop offset="1" stop-color="#4a5568"/></linearGradient>
    <radialGradient id="al-arc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#d4faff"/><stop offset=".6" stop-color="#7fe3ff"/><stop offset="1" stop-color="#3fc8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="al-core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#bff4ff"/><stop offset=".6" stop-color="#4dc8e8"/><stop offset="1" stop-color="#1a6080" stop-opacity=".6"/></radialGradient>
    <filter id="al-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="al-glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>
  <ellipse cx="50" cy="94" rx="24" ry="3.6" fill="#000" opacity=".35"/>
