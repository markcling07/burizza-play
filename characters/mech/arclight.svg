    <path d="M54 41 Q54 32 62 32 Q70.5 32.5 70.5 40.5 L69 45 L55.5 45 Z" fill="url(#al-hull)"/>
    <path d="M55 42.5 Q62.5 40 70 42.5 L69 45 L55.5 45 Z" fill="url(#al-hullD)"/>
    <circle cx="62.5" cy="37" r=".7" fill="#3a5070"/><circle cx="66" cy="38" r=".7" fill="#3a5070"/>
