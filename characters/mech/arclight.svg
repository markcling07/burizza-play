  <rect class="wpn" x="68" y="44" width="18" height="14" rx="3" fill="#3fc8ff" opacity=".6" filter="url(#al-glow)"/>
  <circle cx="33.5" cy="13" r="7.5" fill="url(#al-arc)" filter="url(#al-glow)"/>
  <circle class="wpn" cx="96" cy="51" r="8" fill="url(#al-arc)" filter="url(#al-glow)"/>
  <g stroke="none">
