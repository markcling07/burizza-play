<?xml version="1.0" encoding="UTF-8"?>
<!-- Pip (NPC) - Cinderhold villager art. Soot-smudged street urchin with a slingshot (child-sized).
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="pip-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c8a2"/><stop offset="1" stop-color="#c98f6c"/></linearGradient>
    <linearGradient id="pip-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8683c"/><stop offset=".55" stop-color="#7a4628"/><stop offset="1" stop-color="#4a2a18"/></linearGradient>
    <linearGradient id="pip-tunic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2ae72"/><stop offset=".55" stop-color="#9a7444"/><stop offset="1" stop-color="#5e4426"/></linearGradient>
    <linearGradient id="pip-tunicD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a40"/><stop offset="1" stop-color="#4e3820"/></linearGradient>
    <linearGradient id="pip-rag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6c8a8"/><stop offset="1" stop-color="#9a8a6a"/></linearGradient>
    <linearGradient id="pip-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b08458"/><stop offset="1" stop-color="#5e3e24"/></linearGradient>
  </defs>
  <ellipse cx="51" cy="94" rx="17" ry="3" fill="#000" opacity=".38"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back arm -->
    <path d="M44.5 63.5 Q40 67.5 40.2 75 L43.6 75.6 Q44.2 70 47 67 Z" fill="url(#pip-tunicD)"/>
    <circle cx="41.9" cy="76.6" r="2.1" fill="url(#pip-skin)"/>
    <!-- bare legs + rag-wrapped feet -->
    <path d="M45 80 h4.5 l-.3 9 h-4.5 z" fill="#c98f6c"/>
    <path d="M51.5 80 h4.5 l.8 9 h-4.5 z" fill="url(#pip-skin)"/>
    <path d="M42 88 h7.6 v5.5 h-8.6 z" fill="url(#pip-rag)"/>
    <path d="M51 88 h7.6 l2 5.5 h-9.6 z" fill="url(#pip-rag)"/>
    <!-- oversized ragged tunic -->
    <path d="M42.5 61.5 Q50 58.5 57.5 61.5 L61.5 82 L58.5 80.4 L56 83 L53 81 L50 83.6 L47 81 L44 83 L41.5 80.4 L38.5 82 Z" fill="url(#pip-tunic)"/>
    <!-- patches -->
    <path d="M42.6 76 l5 -.6 l.5 4.6 l-5 .5 z" fill="#6f86a8" stroke-width="1.1"/>
    <path d="M53.5 64.5 l4.2 .3 l-.3 4 l-4.2 -.4 z" fill="#a85a4a" stroke-width="1.1"/>
    <!-- rope belt -->
    <path d="M40.8 71.5 Q50 74 59.6 71.5 L59.9 74 Q50 76.6 40.6 74 Z" fill="#c9ad78"/>
    <path d="M44 74.6 l-.8 4 M45.6 74.8 l.4 3.6" fill="none" stroke-width="1.1"/>
    <!-- slingshot -->
    <path d="M65.2 75 L65.4 64 Q62.4 62.2 62.4 57.5 M65.4 64 Q68.6 62.2 68.6 57.5" stroke-width="3.8" fill="none"/>
    <path d="M65.2 75 L65.4 64 Q62.4 62.2 62.4 57.5 M65.4 64 Q68.6 62.2 68.6 57.5" stroke="url(#pip-wood)" stroke-width="2" fill="none"/>
    <!-- head -->
    <circle cx="47" cy="56" r="2.1" fill="url(#pip-skin)"/>
    <circle cx="52.5" cy="55" r="7.5" fill="url(#pip-skin)"/>
    <!-- scruffy hair -->
    <path d="M45 58.5 Q43 50.5 46.8 47.2 L46.2 43.6 L49.8 45.6 L51.8 42 L54 45 L57.6 43 L57.6 46.6 L61.2 46.5 L59.4 49.3 Q55.4 48.4 52.6 50.4 Q50.4 52.6 50.2 56.6 L48.2 55.2 Z" fill="url(#pip-hair)"/>
    <path d="M57.4 49.6 L56.4 52 L55.3 49.8" fill="url(#pip-hair)" stroke-width="1"/>
    <!-- grin -->
    <path d="M54.3 58.2 Q57.5 62.6 60.2 57.9 Q57.3 59 54.3 58.2 Z" fill="#5a2020" stroke-width="1"/>
    <!-- front arm, rolled oversized sleeve -->
    <path d="M55 62.5 Q61 62.5 63.4 67.2 L66.2 68.6 L63.8 72.4 Q59 70 54.4 68.4 Z" fill="url(#pip-tunic)"/>
    <path d="M62.2 66.2 L66.6 68.2 L64 72.8 L60.6 71 Z" fill="url(#pip-tunicD)" stroke-width="1.2"/>
    <circle cx="65.3" cy="70" r="2.5" fill="url(#pip-skin)"/>
  </g>
  <!-- face -->
  <circle cx="56.8" cy="54.4" r="1.5" fill="#1d2130"/>
  <circle cx="57.3" cy="53.9" r=".5" fill="#fff"/>
  <path d="M55.2 51.7 q1.8 -1 3.7 -.2" stroke="#5a3420" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M59.8 54.8 q1.7 1 .2 2.3" stroke="#a5705a" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M55 58.5 Q57.3 59.3 59.6 58.3 L59.2 59.3 Q57.3 60.1 55.4 59.4 Z" fill="#fff"/>
  <circle cx="55.6" cy="57.2" r="1.1" fill="#f2a08a" opacity=".5"/>
  <!-- soot smudges -->
  <ellipse cx="53.9" cy="57.9" rx="1.7" ry=".9" fill="#3e3844" opacity=".45"/>
  <ellipse cx="50" cy="59.2" rx="1.6" ry="1" fill="#3e3844" opacity=".4"/>
  <path d="M51.5 52.6 q1.4 -.5 2.4 .3" stroke="#3e3844" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".45"/>
  <g fill="#3e3844" opacity=".35"><circle cx="46" cy="70" r=".9"/><circle cx="56" cy="78" r="1"/><circle cx="48.5" cy="85" r=".7"/><circle cx="54" cy="86.5" r=".7"/></g>
  <!-- tunic details -->
  <path d="M48.4 60.6 l2.2 3.4 l2.2 -3.4" stroke="#5e4426" stroke-width=".9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43.4 76.6 l.3 3.4 M47 76.4 l.3 3.3 M54.1 65.4 l3 .2 M54 67.8 l3 .2" stroke="#e8dcc0" stroke-width=".6" stroke-dasharray=".8 .7" fill="none"/>
  <path d="M44.6 64 Q47 61.5 50 61" stroke="#ecd4a2" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".75"/>
  <path d="M42.4 90.4 h7.2 M51.4 90.4 h7.8" stroke="#7a6a4c" stroke-width=".8" stroke-linecap="round"/>
  <!-- sling band + pebble -->
  <path d="M62.4 58 Q65.5 61.2 68.6 58" stroke="#6b4a33" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="65.5" cy="60.4" r="1.1" fill="#8d8986" stroke="#15121d" stroke-width=".7"/>
</svg>
