<?xml version="1.0" encoding="UTF-8"?>
<!-- Elder Ysolde (NPC) - Cinderhold villager art. Village elder and lore-keeper of the Elder's Hut.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
