    <linearGradient id="ysolde-shawlD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e3074"/><stop offset="1" stop-color="#2f1640"/></linearGradient>
    <linearGradient id="ysolde-robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8916a"/><stop offset=".55" stop-color="#75603f"/><stop offset="1" stop-color="#4a3b24"/></linearGradient>
    <linearGradient id="ysolde-robe2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bd8050"/><stop offset="1" stop-color="#7a4628"/></linearGradient>
