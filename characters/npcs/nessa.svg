<?xml version="1.0" encoding="UTF-8"?>
<!-- Nessa (npc) - Cinderhold villager art v2. Tideborn fishmonger up from the coast:
     headscarf, oilskin apron, rubber boots, fish held up by the tail, basket on her hip.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="nessa-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b0d9d0"/><stop offset=".5" stop-color="#7fb3a8"/><stop offset="1" stop-color="#56877d"/></linearGradient>
    <linearGradient id="nessa-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b9a90"/><stop offset="1" stop-color="#436f67"/></linearGradient>
    <linearGradient id="nessa-fin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b4e6f2"/><stop offset=".5" stop-color="#5fb0cc"/><stop offset="1" stop-color="#2f7896"/></linearGradient>
    <linearGradient id="nessa-scarf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a7c"/><stop offset=".5" stop-color="#e0503e"/><stop offset="1" stop-color="#8f2430"/></linearGradient>
    <linearGradient id="nessa-shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e82b4"/><stop offset=".5" stop-color="#3a5688"/><stop offset="1" stop-color="#22345a"/></linearGradient>
    <linearGradient id="nessa-apron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ecbc3e"/><stop offset="1" stop-color="#a8741c"/></linearGradient>
    <linearGradient id="nessa-apronD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a032"/><stop offset="1" stop-color="#8a5c16"/></linearGradient>
    <linearGradient id="nessa-boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e8a72"/><stop offset=".5" stop-color="#3f5a48"/><stop offset="1" stop-color="#22332a"/></linearGradient>
    <linearGradient id="nessa-fish" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f93a8"/><stop offset=".55" stop-color="#d4e8f0"/><stop offset="1" stop-color="#8fb0c2"/></linearGradient>
