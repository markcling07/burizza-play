  <circle cx="66.6" cy="70.2" r="1.5" fill="#fff" stroke="#15121d" stroke-width=".8"/>
  <circle cx="66.4" cy="70.5" r=".7" fill="#15121d"/>
  <path d="M67.4 74.4 q1.2 1.4 2.4 0" stroke="#15121d" stroke-width=".9" fill="none" stroke-linecap="round"/>
