  <g fill="#fff4dc" opacity=".9"><circle cx="49" cy="20.6" r=".9"/><circle cx="54" cy="19.8" r=".9"/><circle cx="58.8" cy="21.2" r=".9"/><circle cx="45" cy="24" r=".9"/><circle cx="51.6" cy="23.2" r=".7"/><circle cx="37" cy="29.6" r=".8"/><circle cx="39.4" cy="35.4" r=".8"/></g>
  <path d="M52.6 23.4 Q56.4 23.2 59.4 25.8 Q56.4 25.2 54.4 26.8 Q53.6 25 52.6 23.4 Z" fill="#2f5f66" stroke="#15121d" stroke-width=".7" stroke-linejoin="round"/>
