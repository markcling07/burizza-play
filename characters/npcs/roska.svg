<?xml version="1.0" encoding="UTF-8"?>
<!-- Roska (NPC) - Cinderhold village art. The Arena's pit master: orc announcer with a brass war horn.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
