  <path d="M58.5 43 Q61 40.5 65 40.5" stroke="#fff" stroke-width="1.2" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M38 66 Q50 69.4 62 66" stroke="#f08a94" stroke-width="1" fill="none" opacity=".75" stroke-linecap="round"/>
