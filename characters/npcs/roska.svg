    <linearGradient id="roska-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66805a"/><stop offset="1" stop-color="#384a32"/></linearGradient>
    <linearGradient id="roska-leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5d44"/><stop offset=".5" stop-color="#5a3a2a"/><stop offset="1" stop-color="#36221a"/></linearGradient>
    <linearGradient id="roska-leatherD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c3123"/><stop offset="1" stop-color="#2a1a13"/></linearGradient>
