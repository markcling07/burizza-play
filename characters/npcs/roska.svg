    <circle cx="57.6" cy="45.6" r=".9"/><circle cx="54.6" cy="49.8" r=".9"/><circle cx="45.6" cy="61.8" r=".9"/><circle cx="42.4" cy="66" r=".9"/>
    <circle cx="59.6" cy="42.2" r=".9"/><circle cx="63.6" cy="41.4" r=".9"/><circle cx="66.8" cy="43.4" r=".9"/>
