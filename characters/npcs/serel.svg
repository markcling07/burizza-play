<?xml version="1.0" encoding="UTF-8"?>
<!-- Serel Vance (NPC) - Cinderhold villager art. Drillmaster of the Training Yard: cropped grey hair,
     scarred cheek, leather training harness, leaning on a wooden practice sword.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="serel-tunic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b4553f"/><stop offset=".55" stop-color="#8d3f2e"/><stop offset="1" stop-color="#5e2a1f"/></linearGradient>
    <linearGradient id="serel-tunicD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d3f2e"/><stop offset="1" stop-color="#472017"/></linearGradient>
    <linearGradient id="serel-leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6a44"/><stop offset="1" stop-color="#53351f"/></linearGradient>
    <linearGradient id="serel-leatherD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4a2e"/><stop offset="1" stop-color="#3a2416"/></linearGradient>
    <linearGradient id="serel-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3b793"/><stop offset="1" stop-color="#b8835f"/></linearGradient>
    <linearGradient id="serel-hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c3bb"/><stop offset="1" stop-color="#7e766d"/></linearGradient>
    <linearGradient id="serel-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49a62"/><stop offset=".5" stop-color="#9a7040"/><stop offset="1" stop-color="#5f4324"/></linearGradient>
    <linearGradient id="serel-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e6e78"/><stop offset="1" stop-color="#2e2e36"/></linearGradient>
  </defs>
  <ellipse cx="51" cy="94" rx="25" ry="3.8" fill="#000" opacity=".38"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back arm, hand on hip -->
    <path d="M42 48 Q33 52 34 64 Q35.5 68 39.5 66.5 Q38 57 45 53 Z" fill="url(#serel-tunicD)"/>
    <!-- legs: braced, one forward -->
    <path d="M41.5 74 h9 l-1.5 14 h-8.5 z" fill="#4a3f36"/>
    <path d="M51.5 74 h9 l2.5 14 h-8.5 z" fill="#5a4d41"/>
    <!-- boots -->
    <path d="M38 87.5 h12 v6.2 h-13 z" fill="url(#serel-leather)"/>
    <path d="M53.5 87.5 h11.5 l2 6.2 h-13.5 z" fill="url(#serel-leather)"/>
    <!-- practice sword, planted point-down in the dirt -->
    <path d="M72.4 57 h5.2 l-1.4 34 h-2.4 z" fill="url(#serel-wood)"/>
    <rect x="66.5" y="53.5" width="17" height="3.6" rx="1.2" fill="url(#serel-leatherD)"/>
    <rect x="73.2" y="43" width="3.6" height="10.5" rx="1.2" fill="url(#serel-leather)"/>
    <circle cx="75" cy="41.6" r="2.8" fill="url(#serel-iron)"/>
    <!-- training tunic -->
    <path d="M38 44 Q50.5 39 62.5 44 L64 78 Q50.5 82 36.5 78 Z" fill="url(#serel-tunic)"/>
    <!-- leather harness over the chest -->
    <path d="M43 42.5 Q51 39 59.5 42.8 L58 47.4 Q50.5 44 44.4 47 Z" fill="url(#serel-leatherD)"/>
    <path d="M45.5 46 L57 71.5 L52.6 73.4 L41.6 48.6 Z" fill="url(#serel-leather)"/>
    <!-- belt -->
    <path d="M36.8 62 Q50.5 65.4 63.8 62 L64 66.8 Q50.5 70 36.6 66.6 Z" fill="url(#serel-leatherD)"/>
    <rect x="49.4" y="63" width="4.8" height="5" rx=".8" fill="url(#serel-iron)" stroke-width="1.1"/>
    <!-- head -->
    <circle cx="53" cy="33.5" r="8.6" fill="url(#serel-skin)"/>
    <circle cx="46.4" cy="35" r="2.1" fill="url(#serel-skin)"/>
    <!-- cropped, bristled grey hair -->
    <path d="M44.2 31 Q44 21.5 53.2 21.4 Q62.4 21.5 61.6 31.4 Q58 26.6 52.6 27 Q47.4 27 44.2 31 Z" fill="url(#serel-hair)"/>
    <!-- front arm, resting on the pommel -->
    <path d="M57 46 Q67 44.5 72 52 L75.6 50.4 L77.2 56 Q68.5 56 57.5 53 Z" fill="url(#serel-tunic)"/>
    <circle cx="75.2" cy="45.6" r="3.1" fill="url(#serel-skin)"/>
  </g>
  <!-- face: level stare, old scar down the cheek -->
  <circle cx="57.4" cy="34.4" r="1.25" fill="#1d2130"/>
  <path d="M55.6 32.4 q2 -1 3.8 .1" stroke="#1d2130" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M51.4 31.8 q1.8 -.9 3.4 .1" stroke="#1d2130" stroke-width="1" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M55.8 39.6 q2.6 .4 4.6 -.8" stroke="#8a5a44" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M59.6 28.8 L57.2 38.4" stroke="#c98a6a" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M60.8 32.4 Q64.4 34.8 62 37.6 Q60.6 38.2 59.6 37.2 Z" fill="url(#serel-skin)" stroke="#15121d" stroke-width="1"/>
  <!-- hair highlights and stubbled nape -->
  <path d="M46.4 25.4 Q49.6 22.4 54.4 22.3" stroke="#e4ded6" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M44.6 29.2 q1.6 -2.4 4 -3.2 M58.4 25 q2.2 1.4 2.8 4" stroke="#6b645c" stroke-width=".8" fill="none" stroke-linecap="round"/>
  <!-- harness stitching and wear -->
  <path d="M46.6 48.6 L56.4 70.4 M44.2 50 L53.6 71.6" stroke="#3a2416" stroke-width=".7" fill="none" opacity=".75"/>
  <path d="M40 48.5 Q42.6 45.4 46.6 44.8" stroke="#dd9a7c" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".55"/>
  <path d="M38.4 72 Q50.5 75.4 62.6 72" stroke="#5e2a1f" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- grain and dirt on the practice sword -->
  <path d="M74.6 60 L73.9 88 M76.2 61.5 L75.6 86" stroke="#5f4324" stroke-width=".7" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M73.2 89.6 q2.4 1.2 4.4 .2" stroke="#4a3a28" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>
</svg>
