<?xml version="1.0" encoding="UTF-8"?>
<!-- Hesta Brewhold (NPC) - Cinderhold village art. Keeper of The Smoldering Mug: tavern keeper with a foaming tankard.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="hesta-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4cdb0"/><stop offset=".5" stop-color="#e0a888"/><stop offset="1" stop-color="#b47858"/></linearGradient>
    <linearGradient id="hesta-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c48c6c"/><stop offset="1" stop-color="#875640"/></linearGradient>
    <linearGradient id="hesta-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8603a"/><stop offset=".5" stop-color="#8a3e22"/><stop offset="1" stop-color="#4e2010"/></linearGradient>
    <linearGradient id="hesta-scarf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa47c"/><stop offset=".5" stop-color="#4c7a52"/><stop offset="1" stop-color="#28462e"/></linearGradient>
