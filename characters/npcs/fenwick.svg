    <linearGradient id="fenwick-overall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a07c54"/><stop offset=".55" stop-color="#6e5034"/><stop offset="1" stop-color="#45301e"/></linearGradient>
    <linearGradient id="fenwick-overallD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4c32"/><stop offset="1" stop-color="#3a2818"/></linearGradient>
