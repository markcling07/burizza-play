<?xml version="1.0" encoding="UTF-8"?>
<!-- Odo Mott (NPC) - Cinderhold village art. The Market trader: portly merchant holding up a glowing potion.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="mott-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6cfae"/><stop offset=".5" stop-color="#e2ab86"/><stop offset="1" stop-color="#b87a58"/></linearGradient>
    <linearGradient id="mott-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c48e6c"/><stop offset="1" stop-color="#8a5a40"/></linearGradient>
    <pattern id="mott-stripe" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#e9e4d8"/><rect width="2.5" height="5" fill="#c0303f"/></pattern>
    <linearGradient id="mott-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#2a0c14" stop-opacity=".5"/></linearGradient>
    <linearGradient id="mott-cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f0"/><stop offset="1" stop-color="#c9c0ac"/></linearGradient>
    <linearGradient id="mott-clothD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfc6b2"/><stop offset="1" stop-color="#958b76"/></linearGradient>
    <linearGradient id="mott-cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa070"/><stop offset=".5" stop-color="#3f7348"/><stop offset="1" stop-color="#1f3f28"/></linearGradient>
    <linearGradient id="mott-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0525f"/><stop offset="1" stop-color="#8a1e2c"/></linearGradient>
    <linearGradient id="mott-pants" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a5a44"/><stop offset="1" stop-color="#3a3024"/></linearGradient>
    <linearGradient id="mott-leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c79a5a"/><stop offset=".5" stop-color="#946a34"/><stop offset="1" stop-color="#5a3c1a"/></linearGradient>
    <linearGradient id="mott-leatherD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3a24"/><stop offset="1" stop-color="#2e1d12"/></linearGradient>
    <linearGradient id="mott-book" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#4a2a1a"/></linearGradient>
    <linearGradient id="mott-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8861f"/></linearGradient>
    <linearGradient id="mott-hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5236"/><stop offset="1" stop-color="#3e2616"/></linearGradient>
    <radialGradient id="mott-potion" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#eaffd8"/><stop offset=".45" stop-color="#6ee08a"/><stop offset="1" stop-color="#1f8a52"/></radialGradient>
    <radialGradient id="mott-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9dffb4" stop-opacity=".8"/><stop offset=".5" stop-color="#5ee08a" stop-opacity=".3"/><stop offset="1" stop-color="#5ee08a" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="27" ry="3.8" fill="#000" opacity=".38"/>
  <!-- potion glow -->
  <circle cx="76" cy="36" r="13" fill="url(#mott-glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back arm + ledger -->
    <path d="M38 47 Q31 54 30.5 64 L37 65.5 Q37.5 58 42.5 53 Z" fill="url(#mott-clothD)"/>
    <rect x="25" y="58.5" width="9" height="12" rx="1" fill="url(#mott-book)" transform="rotate(-12 29.5 64.5)"/>
    <path d="M33.6 59.4 L34.6 69.6" stroke-width="1.1" stroke="#e9e4d8"/>
    <circle cx="33.8" cy="65.6" r="3.4" fill="url(#mott-skinD)"/>
    <!-- legs + shoes -->
    <path d="M40.5 75 h9.5 l-.5 13 h-9.5 z" fill="url(#mott-pants)"/>
    <path d="M35 87.5 h14.5 v6 h-15.5 z" fill="#3a2a22"/>
    <path d="M52.5 75 h9.5 l1.5 13 h-9.5 z" fill="url(#mott-pants)"/>
    <path d="M52.5 87.5 h12 Q69.5 88 70 93.5 h-17.5 z" fill="#4a3428"/>
    <!-- round belly in striped vest -->
    <path d="M37 47 Q50 41 62 46 Q75.5 58 68 74 Q51 82 35 75 Q30 62 37 47 Z" fill="url(#mott-stripe)"/>
    <path d="M37 47 Q50 41 62 46 Q75.5 58 68 74 Q51 82 35 75 Q30 62 37 47 Z" fill="url(#mott-shade)" stroke="none"/>
    <path d="M37 47 Q50 41 62 46 Q75.5 58 68 74 Q51 82 35 75 Q30 62 37 47 Z" fill="none"/>
    <!-- shirt collar -->
    <path d="M46 44.5 L51.5 53 L57 44.5 Q51.5 42.5 46 44.5 Z" fill="url(#mott-cloth)"/>
    <!-- belt under the belly -->
    <path d="M34.5 71.5 Q51 79 68.2 71 L66.6 75.6 Q51 83 35.2 76 Z" fill="url(#mott-leatherD)"/>
    <rect x="46.6" y="74.3" width="5.4" height="5.4" rx="1" fill="url(#mott-gold)" transform="rotate(6 49.3 77)"/>
    <!-- fat coin purse -->
    <path d="M57.5 78.5 Q52.5 83 55.5 88.2 Q61 91 66.5 88.2 Q69.5 83 64.5 78.5 Z" fill="url(#mott-leather)"/>
    <path d="M57 76.6 h8 v2.6 h-8 z" fill="url(#mott-leatherD)"/>
    <path d="M65 77.6 l2.5 -1.4 M57 77.6 l-1.6 -2" stroke-width="1.1" fill="none"/>
    <circle cx="61" cy="84.2" r="2" fill="url(#mott-gold)" stroke-width="1"/>
    <!-- head -->
    <path d="M46 31 Q42 37 45 41 Q47.5 39 48.5 35 Z" fill="url(#mott-hair)"/>
    <circle cx="54" cy="33" r="9.5" fill="url(#mott-skin)"/>
    <circle cx="47.6" cy="34" r="2.4" fill="url(#mott-skinD)"/>
    <!-- floppy cap -->
    <path d="M47 23.5 Q38 17 31.5 22.5 Q29.5 27 32 30.5 Q35.5 25 44 27.5 Z" fill="url(#mott-cap)"/>
    <path d="M31 29.5 h2.4 l1 5 h-4.4 z" fill="url(#mott-gold)" stroke-width="1.1"/>
    <path d="M44 30 Q42.5 19 54 18.5 Q65 18.5 65 28 Z" fill="url(#mott-cap)"/>
    <path d="M43.4 28.6 Q54 24.6 65.4 27.4 L65.6 30.6 Q54 27.8 43.6 32 Z" fill="url(#mott-gold)"/>
    <!-- big round nose -->
    <circle cx="63.6" cy="34.4" r="2.7" fill="url(#mott-skin)"/>
    <!-- curly moustache -->
    <path d="M61.5 36.8 Q58 35.6 55.6 37.8 Q54.3 39.2 55.6 39.8 Q56.5 40.1 56.7 39.2 Q58.6 38.6 61.5 38.8 Q64.5 38.6 66.4 39.2 Q66.6 40.1 67.5 39.8 Q68.8 39.2 67.6 37.8 Q65 35.6 61.5 36.8 Z" fill="url(#mott-hair)" stroke-width="1.1"/>
    <!-- front arm (puffy sleeve) holding up the potion -->
    <path d="M57 46 Q66 44.5 70 51.5 L67.5 59 Q61 57.5 57 54 Z" fill="url(#mott-cloth)"/>
    <path d="M64.5 55.5 L70.5 45.5 L76.5 48 L71 58.5 Z" fill="url(#mott-cloth)"/>
    <path d="M69.4 47.4 L75.7 50 L77 47.2 L70.9 44.6 Z" fill="url(#mott-red)" stroke-width="1.2"/>
    <!-- potion bottle -->
    <rect x="74.1" y="28" width="3.6" height="5" rx=".6" fill="#cfeee0"/>
    <rect x="73.6" y="25.2" width="4.6" height="3.4" rx="1" fill="#9a6a44"/>
    <circle cx="75.9" cy="37.6" r="5.2" fill="url(#mott-potion)"/>
    <circle cx="74.6" cy="44" r="3.4" fill="url(#mott-skin)"/>
  </g>
  <!-- potion shine + sparkles -->
  <path d="M72.8 35.6 Q73.6 33.4 75.6 33" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".95"/>
  <path d="M71.6 38.4 Q76 40.4 80.6 38.2" stroke="#1f8a52" stroke-width=".8" fill="none" opacity=".6"/>
  <g fill="#eaffd8">
    <path d="M84 27 l.7 1.9 l1.9 .7 l-1.9 .7 l-.7 1.9 l-.7 -1.9 l-1.9 -.7 l1.9 -.7 z"/>
    <path d="M68.5 26.5 l.5 1.3 l1.3 .5 l-1.3 .5 l-.5 1.3 l-.5 -1.3 l-1.3 -.5 l1.3 -.5 z"/>
    <circle cx="85.5" cy="41" r=".8"/>
  </g>
  <!-- face -->
  <path d="M55.8 28.6 q2 -1.5 4.4 -.4" stroke="#4a2e1c" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M56.8 32.4 q1.7 -1.9 3.4 0" stroke="#1d2130" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <circle cx="58.6" cy="36" r="2" fill="#e8806a" opacity=".5"/>
  <path d="M60.2 40.9 q1.9 1.3 3.8 -.1" stroke="#7a3a2a" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M51.5 42.3 q4 1.6 8.5 .2" stroke="#b87a58" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- purse stitching + coin glint -->
  <path d="M56.6 82 Q61 84 65.6 82" stroke="#5a3c1a" stroke-width=".8" fill="none" stroke-dasharray="1 1"/>
  <path d="M60.2 83.4 l1.4 1.4" stroke="#fff6c2" stroke-width=".7" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M46.5 25 Q48.5 20.6 54 20" stroke="#fff" stroke-width="1.3" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M39.5 51 Q43 47 48 46" stroke="#fff" stroke-width="1.3" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M58.5 47.5 Q62 46.3 65.5 47.6" stroke="#fff" stroke-width="1.2" fill="none" opacity=".8" stroke-linecap="round"/>
</svg>
