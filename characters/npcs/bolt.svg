<?xml version="1.0" encoding="UTF-8"?>
<!-- Bolt (npc) - Cinderhold villager art v2. Little stray Ironclad drone that does odd jobs:
     one-wheeled, crate on its back, sweeping ash with a broom.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="bolt-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2ecdc"/><stop offset=".5" stop-color="#b3aa94"/><stop offset="1" stop-color="#6b6454"/></linearGradient>
    <linearGradient id="bolt-hullD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f8774"/><stop offset="1" stop-color="#504a3e"/></linearGradient>
    <linearGradient id="bolt-brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset=".5" stop-color="#d6a446"/><stop offset="1" stop-color="#7f5a1e"/></linearGradient>
    <linearGradient id="bolt-patch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a7765a"/><stop offset="1" stop-color="#5e3d2c"/></linearGradient>
    <linearGradient id="bolt-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#737888"/><stop offset="1" stop-color="#2b2e3a"/></linearGradient>
    <linearGradient id="bolt-chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa3b5"/></linearGradient>
    <radialGradient id="bolt-tire" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#5a5f70"/><stop offset="1" stop-color="#1c1e26"/></radialGradient>
    <linearGradient id="bolt-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a468"/><stop offset=".5" stop-color="#a8723e"/><stop offset="1" stop-color="#6a4424"/></linearGradient>
    <linearGradient id="bolt-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b08458"/><stop offset="1" stop-color="#5a3c24"/></linearGradient>
    <linearGradient id="bolt-straw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8de86"/><stop offset="1" stop-color="#b8902e"/></linearGradient>
    <linearGradient id="bolt-rag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f27a62"/><stop offset="1" stop-color="#9a2a30"/></linearGradient>
    <filter id="bolt-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <ellipse cx="54" cy="94" rx="23" ry="3.4" fill="#000" opacity=".38"/>
  <!-- antenna light glow -->
  <circle cx="40" cy="45" r="4" fill="#ffb347" opacity=".9" filter="url(#bolt-glow)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- crate on its back -->
    <g transform="rotate(-6 33 66)">
      <rect x="25.5" y="59" width="13.5" height="13" rx="1" fill="url(#bolt-wood)"/>
      <path d="M25.5 63.4 H39 M25.5 67.8 H39" stroke-width="1"/>
      <path d="M27 60.5 L37.5 70.5" stroke-width="1.1"/>
      <rect x="29" y="54" width="2.4" height="5" rx=".8" fill="url(#bolt-chrome)"/>
      <path d="M33.5 59 l1.5 -4.5 l2.5 .8 l-1 3.7" fill="url(#bolt-iron)"/>
    </g>
    <!-- antenna -->
    <path d="M45 54 L40.5 45.5" fill="none" stroke-width="2.6"/>
    <path d="M45 54 L40.5 45.5" fill="none" stroke="#a39a86" stroke-width="1.2"/>
    <!-- wheel + fork -->
    <circle cx="50" cy="87.5" r="6" fill="url(#bolt-tire)"/>
    <path d="M45 77 h10 l-2.6 10.5 h-4.8 z" fill="url(#bolt-iron)"/>
    <circle cx="50" cy="87.5" r="2.4" fill="url(#bolt-chrome)"/>
    <!-- boxy body -->
    <path d="M38 61 Q38 57 42 57 h17 Q63 57 63 61 v15 Q63 79.5 59 79.5 h-17 Q38 79.5 38 76 Z" fill="url(#bolt-hull)"/>
    <path d="M38 74 h25 v2 Q63 79.5 59 79.5 h-17 Q38 79.5 38 76 Z" fill="url(#bolt-iron)"/>
    <!-- brass dome lid -->
    <path d="M39.5 58 Q40.5 52.5 50.5 52.5 Q60.5 52.5 61.5 58 Z" fill="url(#bolt-brass)"/>
    <!-- bolted patch -->
    <path d="M40.5 62.5 L47 61.8 L47.4 69.6 L41 70.3 Z" fill="url(#bolt-patch)"/>
    <!-- eye housing -->
    <circle cx="55.5" cy="65.5" r="6.2" fill="url(#bolt-iron)"/>
    <!-- red rag kerchief -->
    <path d="M38.5 57.2 Q50 60.5 62.2 57.2 L62.2 59.8 Q50 63 38.5 59.8 Z" fill="url(#bolt-rag)"/>
    <path d="M40 58.6 L33.5 60.6 L35 64 L41.5 60.6 Z" fill="url(#bolt-rag)"/>
    <!-- broom -->
    <g transform="rotate(-20.7 68 70)">
      <rect x="66.8" y="49" width="2.4" height="37" rx="1" fill="url(#bolt-handle)"/>
      <rect x="65" y="85" width="6" height="3.5" rx=".8" fill="url(#bolt-brass)"/>
    </g>
    <path d="M71.7 88.4 L77.4 86.2 L83.5 93.5 L69.5 93.5 Z" fill="url(#bolt-straw)"/>
    <!-- arm -->
    <circle cx="60.8" cy="69.5" r="2.6" fill="url(#bolt-brass)"/>
    <path d="M61 68 L67 69.2 L66.6 72.2 L60.6 71 Z" fill="url(#bolt-hull)"/>
    <path d="M66.2 67.6 Q70.5 66.6 70.8 70.4 Q70.4 73.6 66.4 73 Z" fill="url(#bolt-iron)"/>
  </g>
  <!-- bristle strands -->
  <path d="M73.2 89.5 L72.4 93 M75.2 89 L75.6 93 M77.2 89.2 L78.8 93 M79.2 90.2 L81.4 93" stroke="#8a6a20" stroke-width=".7" stroke-linecap="round"/>
  <!-- ash puff -->
  <g fill="#9a948c" opacity=".7"><circle cx="86" cy="91.5" r="1.6"/><circle cx="89" cy="89.6" r="1.1"/><circle cx="88.4" cy="92.6" r=".8"/></g>
  <!-- eye lens -->
  <circle cx="56" cy="65.5" r="5" fill="#8be28b" filter="url(#bolt-glow)"/>
  <circle cx="56" cy="65.5" r="4.2" fill="#c8ffc0" stroke="#15121d" stroke-width="1"/>
  <circle cx="57" cy="65.3" r="2" fill="#1e5a2a"/>
  <circle cx="54.7" cy="64" r="1" fill="#fff"/>
  <circle cx="57.6" cy="64.6" r=".5" fill="#fff"/>
  <!-- LED smile -->
  <path d="M53 72.4 q3 2.2 6 0" stroke="#15121d" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M53 72.4 q3 2.2 6 0" stroke="#8be28b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- antenna light -->
  <circle cx="40.3" cy="45" r="2.1" fill="#ffd9a0" stroke="#15121d" stroke-width="1"/>
  <circle cx="39.7" cy="44.4" r=".6" fill="#fff"/>
  <!-- rivets -->
  <g fill="#3a2a20"><circle cx="42" cy="63.6" r=".7"/><circle cx="45.8" cy="63.2" r=".7"/><circle cx="46.1" cy="68.3" r=".7"/><circle cx="42.3" cy="68.8" r=".7"/></g>
  <g fill="#4a4436"><circle cx="40.5" cy="72.2" r=".7"/><circle cx="60.6" cy="62" r=".7"/><circle cx="50" cy="54.8" r=".7"/><circle cx="44.5" cy="55.6" r=".6"/><circle cx="55.5" cy="55.6" r=".6"/></g>
  <!-- vent slots + glow band -->
  <path d="M48.5 70.6 h3 M48.5 72.4 h3" stroke="#504a3e" stroke-width=".9" stroke-linecap="round"/>
  <path d="M42 77 h3 M47.5 77.6 h3 M53 77.6 h3" stroke="#8be28b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- wheel spokes -->
  <path d="M50 90.4 v2M45.1 87.5 h2 M52.9 87.5 h2" stroke="#9aa3b5" stroke-width=".8" stroke-linecap="round"/>
  <!-- ash smudges -->
  <g fill="#5a554e" opacity=".45"><circle cx="58" cy="76" r="1.1"/><circle cx="43" cy="59.5" r=".7"/><circle cx="61" cy="73.5" r=".6"/></g>
  <!-- highlights -->
  <path d="M40 72 Q39.6 63 41.6 59.4" stroke="#fff" stroke-width="1.3" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M43 55.4 Q46 53.6 50 53.5" stroke="#fff" stroke-width="1.1" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M46 84.5 q1.4 -1.8 3.4 -2" stroke="#fff" stroke-width=".9" fill="none" opacity=".5" stroke-linecap="round"/>
</svg>
