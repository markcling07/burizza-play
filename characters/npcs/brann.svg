<?xml version="1.0" encoding="UTF-8"?>
<!-- Brann Ashhand (NPC) - Cinderhold village art. The Ironsmith: burly blacksmith with a raised hammer.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="brann-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2c4a0"/><stop offset=".5" stop-color="#d49a74"/><stop offset="1" stop-color="#a66a4a"/></linearGradient>
    <linearGradient id="brann-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b98262"/><stop offset="1" stop-color="#7a4b34"/></linearGradient>
    <linearGradient id="brann-shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5a6c"/><stop offset=".5" stop-color="#413d4d"/><stop offset="1" stop-color="#262330"/></linearGradient>
    <linearGradient id="brann-apron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a67650"/><stop offset=".5" stop-color="#744a2c"/><stop offset="1" stop-color="#452816"/></linearGradient>
    <linearGradient id="brann-leatherD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3a24"/><stop offset="1" stop-color="#2e1d12"/></linearGradient>
    <linearGradient id="brann-beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0703f"/><stop offset=".5" stop-color="#9a4a2e"/><stop offset="1" stop-color="#5e4c4a"/></linearGradient>
    <linearGradient id="brann-iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f6"/><stop offset=".5" stop-color="#9aa3b5"/><stop offset="1" stop-color="#5c6476"/></linearGradient>
    <linearGradient id="brann-ironD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8790a2"/><stop offset="1" stop-color="#3e4454"/></linearGradient>
    <linearGradient id="brann-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6a44"/><stop offset="1" stop-color="#55361f"/></linearGradient>
    <linearGradient id="brann-wrap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4ecda"/><stop offset="1" stop-color="#b8a688"/></linearGradient>
    <radialGradient id="brann-forge" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".5"/><stop offset=".55" stop-color="#ff6a1a" stop-opacity=".18"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="28" ry="3.9" fill="#000" opacity=".38"/>
  <!-- forge glow from the front -->
  <circle cx="90" cy="68" r="24" fill="url(#brann-forge)"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back arm (bare, hanging) -->
    <path d="M35 45 Q28 53 27.5 65 L34.5 67 Q35 58 41 51 Z" fill="url(#brann-skinD)"/>
    <circle cx="31" cy="67" r="4" fill="url(#brann-skinD)"/>
    <path d="M33.5 44 Q30.5 47 30 52 L37.5 54 Q39 49 42 46 Z" fill="url(#brann-shirt)"/>
    <!-- legs + boots -->
    <path d="M39 74 h10.5 l-1 14 h-10.5 z" fill="#38323f"/>
    <path d="M34 87.5 h15 v6 h-16 z" fill="#2a1f1a"/>
    <path d="M52 74 h10.5 l2 14 h-10.5 z" fill="#4a4454"/>
    <path d="M53 87.5 h14 l2.5 6 h-16 z" fill="#3a2a22"/>
    <!-- torso (dark shirt) -->
    <path d="M30 46 Q50 36 70 46 L67 76 Q50 81 33 76 Z" fill="url(#brann-shirt)"/>
    <!-- heavy leather apron -->
    <path d="M39 47 Q50 44.5 61 47 L64.5 82 Q51 85.5 36.5 82 Z" fill="url(#brann-apron)"/>
    <path d="M44 69 h11.5 v6 Q49.75 78 44 75 Z" fill="url(#brann-leatherD)"/>
    <rect x="32" y="61.5" width="36" height="4.5" rx="1" fill="url(#brann-leatherD)"/>
    <rect x="46.5" y="60.6" width="6" height="6.3" rx="1" fill="url(#brann-iron)"/>
    <!-- tongs on the belt -->
    <path d="M34.3 64 L32.4 83 L34.2 83.3 L35.9 64.2 Z" fill="url(#brann-ironD)"/>
    <path d="M37 64 L38.4 83 L36.6 83.4 L35.4 64.2 Z" fill="url(#brann-iron)"/>
    <circle cx="35.6" cy="64" r="1.7" fill="url(#brann-ironD)"/>
    <!-- head (bald) -->
    <path d="M43 28 Q42 16 53 15.5 Q63.5 15.5 64 25 L64.5 29 Q65 35 61 38 L46 38 Q43 34 43 28 Z" fill="url(#brann-skin)"/>
    <circle cx="46.5" cy="28" r="2.8" fill="url(#brann-skinD)"/>
    <!-- thick beard -->
    <path d="M44.5 29 Q41.5 44 47 52.5 Q54 58 61.5 51.5 Q66.5 44 64.5 33 Q61 36 57 35.5 Q52 36 49.5 33 Q47.5 30.5 44.5 29 Z" fill="url(#brann-beard)"/>
    <!-- nose + moustache -->
    <circle cx="64.3" cy="30.8" r="2.5" fill="url(#brann-skin)"/>
    <path d="M54.5 35 Q60 31.8 66.2 34.6 Q63 38 59.5 36.4 Q57 38.5 54.5 35 Z" fill="#7a3a22" stroke-width="1.1"/>
    <!-- smithing hammer (raised) -->
    <g transform="rotate(8 75.5 38)">
      <rect x="74" y="15" width="3" height="31" rx="1" fill="url(#brann-wood)"/>
      <rect x="67" y="9.5" width="15" height="8" rx="1" fill="url(#brann-iron)"/>
      <rect x="64.5" y="8.5" width="3.5" height="10" rx="1" fill="url(#brann-ironD)"/>
      <path d="M82 9.5 L87.5 12.5 L87.5 14.5 L82 17.5 Z" fill="url(#brann-ironD)"/>
    </g>
    <!-- front arm: bare upper arm, wrapped forearm, fist -->
    <path d="M57 45 L71 49.5 L71.5 57.5 L59 54 Z" fill="url(#brann-skin)"/>
    <path d="M67.5 54 L72 39 L79 40.5 L75 56 Z" fill="url(#brann-wrap)"/>
    <circle cx="71.5" cy="55" r="4.2" fill="url(#brann-skin)"/>
    <circle cx="75.5" cy="38" r="4.4" fill="url(#brann-skin)"/>
    <path d="M54.5 46 Q56 40.5 63 41 Q69.5 42.5 69.5 49.5 L58 52.5 Z" fill="url(#brann-shirt)"/>
  </g>
  <!-- forearm wraps + knuckles -->
  <path d="M69.6 49.4 L76.1 51 M70.4 45.4 L77.1 47 M71.3 41.6 L78 43.1" stroke="#9a8768" stroke-width=".9" stroke-linecap="round"/>
  <path d="M76.6 35.2 q1.6 1.2 1.4 3.4" stroke="#a66a4a" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- face -->
  <path d="M56.4 25.4 L63.2 26.2" stroke="#4a3634" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="60.3" cy="28.6" r="1.5" fill="#1d2130"/>
  <path d="M58.6 38.6 q2 .9 3.8 -.2" stroke="#5e2414" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- beard strands (soot-grey streaks) -->
  <path d="M48 41 Q48.5 47 51.5 51.5 M54 43 Q55 49 57.5 52.5 M60 41 Q61.5 45 60.5 49" stroke="#b8aca8" stroke-width="1" fill="none" stroke-linecap="round" opacity=".75"/>
  <!-- soot smudges -->
  <g fill="#1e1a20" opacity=".32">
    <ellipse cx="51" cy="20.5" rx="2.4" ry="1.1"/>
    <ellipse cx="57.5" cy="31.6" rx="1.9" ry=".9"/>
    <ellipse cx="54.5" cy="58.5" rx="3.2" ry="1.6"/>
    <ellipse cx="29.5" cy="58" rx="1.4" ry="2.2"/>
    <ellipse cx="66.5" cy="51.5" rx="1.6" ry="1"/>
  </g>
  <!-- highlights -->
  <path d="M46.5 21.5 Q48.5 17.8 53.5 17.2" stroke="#fff" stroke-width="1.4" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M41 50.5 Q44 48.6 49 48.2" stroke="#c99a6c" stroke-width="1.2" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M57.5 44.5 Q60 42 64 42.4" stroke="#fff" stroke-width="1.2" fill="none" opacity=".4" stroke-linecap="round"/>
  <path d="M67.5 11.6 h9" transform="rotate(8 75.5 38)" stroke="#fff" stroke-width="1.2" opacity=".85" stroke-linecap="round"/>
  <!-- forge rim light on the front edges -->
  <g stroke="#ffa24a" stroke-width="1" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M78.3 43.2 L75.5 54.2"/>
    <path d="M68.7 59 L67.5 73.5"/>
    <path d="M64 83.5 L64.3 87"/>
    <path d="M68.2 89.2 L69.2 92.6"/>
    <path d="M66.6 30 Q67 31.6 65.6 33"/>
    <path d="M85.2 13.2 L87.6 14.6" transform="rotate(8 75.5 38)"/>
  </g>
  <!-- embers -->
  <g fill="#ffb347"><circle cx="88" cy="50" r=".9"/><circle cx="92" cy="60" r=".7"/><circle cx="84" cy="44" r=".6"/></g>
</svg>
