<?xml version="1.0" encoding="UTF-8"?>
<!-- Mira Coalwhistle (NPC) - Cinderhold villager art. Master Crafter; keeper of the Workshop.
     Canvas 100x100, faces right, feet on y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="mira-shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fa0c0"/><stop offset="1" stop-color="#2f5a7a"/></linearGradient>
    <linearGradient id="mira-apron" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6a42"/><stop offset="1" stop-color="#5e3c22"/></linearGradient>
    <linearGradient id="mira-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c8a0"/><stop offset="1" stop-color="#c8926a"/></linearGradient>
    <linearGradient id="mira-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8a548"/><stop offset="1" stop-color="#a8642a"/></linearGradient>
    <linearGradient id="mira-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset="1" stop-color="#9a7428"/></linearGradient>
    <radialGradient id="mira-lens" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9fd6ff"/><stop offset="1" stop-color="#3a6a8a"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="94" rx="20" ry="3.6" fill="#000" opacity=".38"/>
  <g stroke="#15121d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- boots and legs (short and sturdy) -->
    <path d="M43 76 h6 v13 h-6 z" fill="#3a3044"/>
    <path d="M52 76 h6 l1 13 h-6 z" fill="#3a3044"/>
    <path d="M41.5 87.5 h8.5 v6 h-10 z" fill="#4a3020"/>
    <path d="M52.5 87.5 h8 l3 6 h-11 z" fill="#5a3a26"/>
    <!-- shirt -->
    <path d="M43 50 Q37 55 38 66 L38.5 78 Q50 81 61.5 78 L62 66 Q63 55 57 50 Z" fill="url(#mira-shirt)"/>
    <!-- leather apron with pockets and a tool loop -->
    <path d="M44 55 h13 l2.5 25 q-9 2.4 -18 .4 z" fill="url(#mira-apron)"/>
    <path d="M45.5 66 h5 v6 h-5 z M52 66 h5 v6 h-5 z" fill="#4a2e1a" stroke-width="1"/>
    <path d="M47 66 v-3 M54 66 v-4 M55.5 66 v-2" stroke-width="1.1"/>
    <path d="M44 55 Q50 51 57 55" fill="none" stroke-width="1.2"/>
    <!-- soot smudges -->
    <circle cx="48.5" cy="60" r="1.6" fill="#2a2228" stroke="none" opacity=".55"/>
    <circle cx="55" cy="75" r="1.3" fill="#2a2228" stroke="none" opacity=".5"/>
    <!-- hammer on the hip -->
    <path d="M39 64 l-4 13" stroke-width="3.6"/>
    <path d="M39 64 l-4 13" stroke="#7a5434" stroke-width="2"/>
    <rect x="34.5" y="60" width="9" height="5.4" rx="1" fill="#7a8296" transform="rotate(18 39 62.7)"/>
    <!-- neck + head -->
    <path d="M48 45 h5 v5.5 h-5 z" fill="url(#mira-skin)" stroke-width="1.1"/>
    <circle cx="51.5" cy="37.5" r="9" fill="url(#mira-skin)"/>
    <!-- hair: a messy copper bob -->
    <path d="M42.6 40 Q40 26 51 26.5 Q61.5 26 61.5 34 Q57 30.5 51.5 31.5 Q46.5 33 46.4 42 Z" fill="url(#mira-hair)"/>
    <path d="M42.6 40 Q41.5 45 44 47.5 Q45.6 44 46 41 Z" fill="url(#mira-hair)" stroke-width="1.1"/>
    <!-- goggles pushed up on the forehead -->
    <path d="M43 30.5 Q51 26.5 60.5 30" fill="none" stroke="#3a2a20" stroke-width="2.2"/>
    <circle cx="51" cy="28.5" r="3.6" fill="url(#mira-brass)"/><circle cx="51" cy="28.5" r="2.2" fill="url(#mira-lens)" stroke-width=".8"/>
    <circle cx="58" cy="29.5" r="3.4" fill="url(#mira-brass)"/><circle cx="58" cy="29.5" r="2" fill="url(#mira-lens)" stroke-width=".8"/>
    <!-- forward arm holding up a brass gear -->
    <path d="M56 51.5 Q63 50.5 66 45 L69 41.5 L72 44 L68.6 48.8 Q63.5 56 57.5 58 Z" fill="url(#mira-shirt)"/>
    <circle cx="70.6" cy="41" r="2.9" fill="url(#mira-skin)"/>
    <path d="M71 26.5 l2 .3 .6 2.4 2 .9 1.8-1.4 1.5 1.5-1.4 1.8 .9 2 2.4 .6 .3 2-2.2 .8-.4 2.2 1.6 1.6-1.2 1.6-2-1-1.8 1.3 .1 2.4-2 .5-1-2.1-2.2-.1-1.2 2-1.9-.8.5-2.3-1.6-1.5-2.2 .8-.9-1.9 2-1.3v-2.2l-2-1.2 .8-1.9 2.3 .5 1.4-1.7-.9-2.2 1.8-1z" fill="url(#mira-brass)" stroke-width="1"/>
    <circle cx="72.6" cy="34.6" r="2.4" fill="#2a2228" stroke-width=".8"/>
  </g>
  <!-- face -->
  <circle cx="56.2" cy="38.2" r="1.3" fill="#1d2130"/>
  <path d="M54.2 35.4 q2 -1 3.8 0" stroke="#7a4a1a" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M54.6 43 q2.4 1.6 4.6 0" stroke="#7a3a30" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="58.6" cy="41" r="1.4" fill="#f2a08a" opacity=".5"/>
  <circle cx="49.4" cy="41.6" r="1" fill="#2a2228" opacity=".4"/>
  <path d="M59.6 38.6 Q62.2 40.4 60.2 41.8" stroke="#a0705a" stroke-width=".8" fill="none" stroke-linecap="round"/>
  <!-- sparkle off the gear -->
  <path d="M80 26 l.7 1.8 1.8 .7 -1.8 .7 -.7 1.8 -.7 -1.8 -1.8 -.7 1.8 -.7 z" fill="#ffd166"/>
</svg>
