<?xml version="1.0" encoding="UTF-8"?>
<!-- Riven (Stray Banner, ranged, Light) - Burizza art v1. A gaunt wraith of a light-channeler in
     dark olive wrappings and a tattered layered robe, hovering a hand's width off the ground. No
     plate and no heat: a hood, a gold circlet, and two pale gold eyes that never close. Five blades
     of light ride with him - three fanned point-up behind his shoulders, one still streaking away
     from the open hand that loosed it, one waiting off the fingers of the hand he has drawn back.
     The blades are his Force, not a held weapon, so nothing here is class="wpn": a racked weapon
     draws at data-hand and the light stays. Canvas 100x100, faces right, feet near y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="64,46">
  <defs>
    <linearGradient id="rv-robe" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#4e4534"/><stop offset=".55" stop-color="#3a3326"/><stop offset="1" stop-color="#201b14"/></linearGradient>
    <linearGradient id="rv-robedk" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#322c21"/><stop offset=".6" stop-color="#241f17"/><stop offset="1" stop-color="#14110c"/></linearGradient>
    <linearGradient id="rv-tabard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5140"/><stop offset=".6" stop-color="#433b2c"/><stop offset="1" stop-color="#2a241b"/></linearGradient>
    <linearGradient id="rv-wrap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70644a"/><stop offset=".55" stop-color="#4c4433"/><stop offset="1" stop-color="#312b20"/></linearGradient>
    <linearGradient id="rv-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6c7a3"/><stop offset=".6" stop-color="#ab9b79"/><stop offset="1" stop-color="#7d7058"/></linearGradient>
    <linearGradient id="rv-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9ad"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#b9872a"/></linearGradient>
    <linearGradient id="rv-blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6cf"/><stop offset=".45" stop-color="#ffe489"/><stop offset="1" stop-color="#ffbf3c"/></linearGradient>
    <radialGradient id="rv-eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe4" stop-opacity=".95"/><stop offset=".45" stop-color="#ffe489" stop-opacity=".65"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
    <radialGradient id="rv-aura" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#ffe489" stop-opacity=".2"/><stop offset=".6" stop-color="#ffd166" stop-opacity=".07"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
    <radialGradient id="rv-ground" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd166" stop-opacity=".42"/><stop offset=".55" stop-color="#ffd166" stop-opacity=".15"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
    <filter id="rv-glow" x="-70%" y="-250%" width="240%" height="600%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="rv-soft" x="-60%" y="-70%" width="220%" height="240%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- GROUND: he hovers, so a soft shadow sits low and apart, with his own light scattered on it -->
  <ellipse cx="50" cy="95" rx="29" ry="5.5" fill="url(#rv-ground)" filter="url(#rv-soft)"/>
  <ellipse cx="49" cy="96.2" rx="19" ry="3" fill="#000" opacity=".28" filter="url(#rv-soft)"/><ellipse cx="49" cy="96.2" rx="11" ry="1.8" fill="#000" opacity=".26"/>
  <g stroke="#ffd166" stroke-width=".7" stroke-linecap="round" fill="none" opacity=".32">
    <path d="M29 97.5 h8 M60 98.5 h9 M43 99.3 h11 M22 94.5 h5 M72 95.5 h6"/></g>
  <g fill="#ffd166" opacity=".4"><circle cx="26" cy="92.5" r=".6"/><circle cx="75" cy="93.5" r=".5"/><circle cx="37" cy="99" r=".45"/><circle cx="66" cy="92" r=".4"/></g>
  <!-- the light he gives off, hanging around the body -->
  <ellipse cx="49" cy="50" rx="31" ry="38" fill="url(#rv-aura)"/>

  <!-- THE FAN: three blades hovering point-up behind his shoulders, hilts lost behind the robe -->
  <g stroke-linejoin="round">
    <g transform="translate(32 46) rotate(-122) scale(.95)">
      <path d="M-5 0 Q1 -3.4 16 -2.6 L29 0 L16 2.6 Q1 3.4 -5 0 Z" fill="#ffd166" opacity=".45" filter="url(#rv-glow)"/>
      <path d="M-4 0 Q1 -2.1 16 -1.6 L26 0 L16 1.6 Q1 2.1 -4 0 Z" fill="url(#rv-blade)"/>
      <path d="M-2 0 L23 0" stroke="#fffbe8" stroke-width=".65" stroke-linecap="round" opacity=".85"/>
      <path d="M-5.2 -3.1 Q-3.4 0 -5.2 3.1 Q-7.2 0 -5.2 -3.1 Z" fill="#ffd166"/><rect x="-10.6" y="-.95" width="4.6" height="1.9" rx=".95" fill="#b9872a"/></g>
    <g transform="translate(35 45) rotate(-111)">
      <path d="M-5 0 Q1 -3.4 16 -2.6 L29 0 L16 2.6 Q1 3.4 -5 0 Z" fill="#ffd166" opacity=".45" filter="url(#rv-glow)"/>
      <path d="M-4 0 Q1 -2.1 16 -1.6 L26 0 L16 1.6 Q1 2.1 -4 0 Z" fill="url(#rv-blade)"/>
      <path d="M-2 0 L23 0" stroke="#fffbe8" stroke-width=".65" stroke-linecap="round" opacity=".85"/>
      <path d="M-5.2 -3.1 Q-3.4 0 -5.2 3.1 Q-7.2 0 -5.2 -3.1 Z" fill="#ffd166"/><rect x="-10.6" y="-.95" width="4.6" height="1.9" rx=".95" fill="#b9872a"/></g>
    <g transform="translate(39 44) rotate(-100) scale(.95)">
      <path d="M-5 0 Q1 -3.4 16 -2.6 L29 0 L16 2.6 Q1 3.4 -5 0 Z" fill="#ffd166" opacity=".45" filter="url(#rv-glow)"/>
      <path d="M-4 0 Q1 -2.1 16 -1.6 L26 0 L16 1.6 Q1 2.1 -4 0 Z" fill="url(#rv-blade)"/>
      <path d="M-2 0 L23 0" stroke="#fffbe8" stroke-width=".65" stroke-linecap="round" opacity=".85"/>
      <path d="M-5.2 -3.1 Q-3.4 0 -5.2 3.1 Q-7.2 0 -5.2 -3.1 Z" fill="#ffd166"/><rect x="-10.6" y="-.95" width="4.6" height="1.9" rx=".95" fill="#b9872a"/></g>
  </g>

  <!-- hood tail, torn into a point and streaming back off the crown -->
  <path d="M45.5 17 Q39 13 32 10 Q38 16 43.5 22 Z" fill="url(#rv-robedk)"/>

  <!-- ROBE, three layers: a long torn mantle swept back, the skirt, a shorter banded over-tabard -->
  <g stroke="none">
    <path d="M47 37 C38 43 32 60 27 84 Q31 80 34.5 85 Q38 79 41 84 C38 64 41 48 49 42 Z" fill="url(#rv-robedk)"/>
    <path d="M44 55 Q40 71 35 87 L38.5 83 L41 88.5 L45 82 L48.5 88.5 L52 82 L56 88 L59 82 L63 86.5 L65.5 81.5 L67 85 Q62 70 60 55 Q52 60 44 55 Z" fill="url(#rv-robe)"/>
    <!-- wrapped feet, hanging limp below the hem because nothing is standing on anything -->
    <path d="M45.5 84 L43.5 93.5 L47 90.5 L48.5 93.8 L50 84 Z" fill="url(#rv-wrap)"/>
    <path d="M54 83.5 L53 92.5 L55.5 90 L57.5 92.8 L58.5 83.5 Z" fill="#3a3326"/>
    <path d="M44.3 86.5 h5.4 M53.3 86 h4.8 M44.8 89.5 h4 M53.7 89 h3.6" stroke="#ffd166" stroke-width=".55" opacity=".45"/>
    <!-- over-tabard -->
    <path d="M45 53 Q42 65 38 77 L41 73.5 L43.5 79 L47 72.5 L50 78.5 L53.5 72 L57 78 L60 72 L62.5 76 Q60 64 59 53 Q52 57.5 45 53 Z" fill="url(#rv-tabard)"/>
    <path d="M39.6 70.5 Q51 76.5 61.6 70.5" stroke="url(#rv-gold)" stroke-width="1.3" fill="none"/><path d="M40.2 73 Q51 79 61 73" stroke="#ffd166" stroke-width=".65" fill="none" opacity=".5"/>
    <path d="M36 87 Q46 92 56 89.5 Q62 87.5 66.3 85.5" stroke="url(#rv-gold)" stroke-width=".85" fill="none" opacity=".65"/>
    <path d="M53.6 58 L54.6 71" stroke="#ffd166" stroke-width=".6" opacity=".45"/>

    <!-- torso under wrappings -->
    <path d="M44.5 37 Q52 32.5 60.5 37 Q63 45 62 54 Q52 59 43 54 Q42.5 45 44.5 37 Z" fill="url(#rv-wrap)"/>
    <path d="M43.8 41 Q52.5 45 61.2 41.3 M43.4 45.6 Q52.5 49.6 61.6 45.9 M43.2 50.2 Q52.5 54.2 61.8 50.5" stroke="#2d2719" stroke-width=".85" fill="none" opacity=".7"/>
    <!-- sash, gold-banded, with a torn tail trailing back -->
    <path d="M43 56 C38 60 34 66 31 72 Q35 67 38 64.5 C40.5 62 42.5 59.5 43.8 58 Z" fill="#2b2519"/>
    <path d="M42 52 Q52.5 57 63 52 L63.5 58.5 Q52.5 63.5 42 58.5 Z" fill="#2b2519"/>
    <path d="M42.2 53.6 Q52.5 58.6 63.2 53.6" stroke="url(#rv-gold)" stroke-width="1.1" fill="none"/>
    <path d="M42.4 57.8 Q52.5 62.8 63.4 57.8" stroke="#ffd166" stroke-width=".65" fill="none" opacity=".55"/>
    <!-- the sun sigil burned into the chest wrap -->
    <path d="M53 39.4 l1.3 3.3 l3.3 1.3 l-3.3 1.3 l-1.3 3.3 l-1.3 -3.3 l-3.3 -1.3 l3.3 -1.3 Z" fill="url(#rv-gold)" opacity=".9"/>
  </g>

  <!-- ARMS: wrapped at the shoulder, bare from the elbow down, gold cuffs where the cloth ends -->
  <g stroke="none">
    <path d="M46 37 Q38 44 34.3 57 L38.3 58.3 Q40.8 47 48.5 41.5 Z" fill="url(#rv-wrap)"/>
    <path d="M34.4 55.6 L38.6 57" stroke="url(#rv-gold)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M34.3 57 Q31.5 60 30.8 64.5 L34.6 65.4 Q35.3 61 37.9 58.3 Z" fill="url(#rv-skin)"/>
    <!-- back hand, open and empty, the fifth blade waiting a finger's width off it -->
    <path d="M30.6 63.5 Q28.4 65.4 28.8 68.4 L32 69.4 Q34.4 67.6 34.4 64.6 Z" fill="url(#rv-skin)"/>
    <path d="M28.9 68.2 l-2.4 2.6 M30.9 69.4 l-1.2 3.2 M32.6 69 l.5 3.1 M28.3 66.2 l-3.1 1.3" stroke="url(#rv-skin)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <!-- front arm, flung forward, the hand still open from the release -->
    <path d="M56 36 Q63.5 36.5 68 41.5 L65.2 45.5 Q60.5 41.5 55 41.5 Z" fill="url(#rv-wrap)"/>
    <path d="M65.2 39.6 L68.8 43.4" stroke="url(#rv-gold)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M65.4 41 Q68.8 42.6 71.4 45 L69.8 48.3 Q66.8 46 63.6 45 Z" fill="url(#rv-skin)"/>
    <path d="M69.6 43 Q73.8 43.4 74.8 46.2 Q73.8 49.4 70.2 48.6 Q68.3 47.4 68.7 45.4 Z" fill="url(#rv-skin)"/>
    <path d="M74.2 44 l3.6 -2 M75 46 l4.2 -.4 M74.5 47.8 l3.8 1.5 M72.4 49.2 l2.3 2.6 M69.6 43.2 l1.4 -2.7" stroke="url(#rv-skin)" stroke-width="1.35" stroke-linecap="round" fill="none"/>
  </g>

  <!-- HOOD and the face under it: no helm, just cloth, a circlet, and the two eyes -->
  <g stroke="none">
    <path d="M41 32.5 Q38.5 16 51 12.5 Q63.5 13 66 24.5 Q67.5 32 61 34.6 L48 35.8 Q41.5 35.8 41 32.5 Z" fill="url(#rv-robe)"/>
    <path d="M42.5 30 Q40.5 18 51 14 Q58.5 14.3 62 18.5" stroke="#5b5140" stroke-width=".8" fill="none" opacity=".6"/>
    <path d="M48.5 33.4 Q55.5 36.6 62.5 33 Q63.2 37.6 59.5 39.4 Q54 40.8 50 38.7 Q47.9 36.6 48.5 33.4 Z" fill="url(#rv-wrap)"/>
    <ellipse cx="58" cy="26.5" rx="7.2" ry="6" fill="#14110b" transform="rotate(-6 58 26.5)"/>
    <path d="M54.5 30.6 Q59 33.3 64 30.3 Q61 33.7 56.5 33.1 Z" fill="url(#rv-skin)" opacity=".28"/>
    <!-- UNBLINKING: two pale gold eyes, each sitting in its own bloom -->
    <circle cx="56.5" cy="26.2" r="3.4" fill="url(#rv-eye)"/><circle cx="61.8" cy="26.8" r="4" fill="url(#rv-eye)"/>
    <ellipse cx="56.5" cy="26.2" rx="1.3" ry="1" fill="#ffe489"/><ellipse cx="61.8" cy="26.8" rx="1.75" ry="1.3" fill="#ffe489"/>
    <circle cx="56.5" cy="26.1" r=".5" fill="#fffdf0"/><circle cx="61.9" cy="26.6" r=".68" fill="#fffdf0"/>
    <!-- circlet riding the brow, with a single drop of gold hung over the eyes -->
    <path d="M44.5 20.6 Q55 15.9 65.6 21" stroke="url(#rv-gold)" stroke-width="1.4" fill="none"/>
    <path d="M61.9 18.5 l1.7 2.3 l-1.7 2.4 l-1.7 -2.4 Z" fill="#ffd166"/>
    <path d="M46 20 Q55 15.7 64.6 20.2" stroke="#ffe9ad" stroke-width=".45" fill="none" opacity=".6"/>
  </g>

  <!-- THE READY BLADE: hanging point-up a finger off the drawn-back hand, waiting to be spent -->
  <g transform="translate(22 70) rotate(-90) scale(.78)" stroke-linejoin="round">
    <path d="M-5 0 Q1 -3.4 16 -2.6 L29 0 L16 2.6 Q1 3.4 -5 0 Z" fill="#ffd166" opacity=".5" filter="url(#rv-glow)"/>
    <path d="M-4 0 Q1 -2.1 16 -1.6 L26 0 L16 1.6 Q1 2.1 -4 0 Z" fill="url(#rv-blade)"/>
    <path d="M-2 0 L23 0" stroke="#fffbe8" stroke-width=".65" stroke-linecap="round" opacity=".9"/>
    <path d="M-5.2 -3.1 Q-3.4 0 -5.2 3.1 Q-7.2 0 -5.2 -3.1 Z" fill="#ffd166"/>
    <rect x="-10.6" y="-.95" width="4.6" height="1.9" rx=".95" fill="#b9872a"/><circle cx="-11.6" cy="0" r="1.15" fill="#ffd166"/></g>

  <!-- THE THROWN BLADE: already clear of the open hand and running flat at the enemy -->
  <path d="M68 46.6 Q74 46 78.5 45" stroke="#ffd166" stroke-width="1.6" fill="none" opacity=".3" filter="url(#rv-glow)" stroke-linecap="round"/>
  <g transform="translate(78 42.5) rotate(-6) scale(.7)" stroke-linejoin="round">
    <path d="M-5 0 Q1 -3.4 16 -2.6 L29 0 L16 2.6 Q1 3.4 -5 0 Z" fill="#ffd166" opacity=".55" filter="url(#rv-glow)"/>
    <path d="M-4 0 Q1 -2.1 16 -1.6 L26 0 L16 1.6 Q1 2.1 -4 0 Z" fill="url(#rv-blade)"/>
    <path d="M-2 0 L23 0" stroke="#fffbe8" stroke-width=".7" stroke-linecap="round" opacity=".95"/>
    <path d="M-5.2 -3.1 Q-3.4 0 -5.2 3.1 Q-7.2 0 -5.2 -3.1 Z" fill="#ffd166"/>
    <rect x="-10.6" y="-.95" width="4.6" height="1.9" rx=".95" fill="#b9872a"/><circle cx="-11.6" cy="0" r="1.15" fill="#ffd166"/></g>
  <path d="M76 38.4 Q85 37.6 93 38.4 M77.5 47.4 Q85.5 48 92 47.4" stroke="#ffe489" stroke-width=".5" fill="none" opacity=".4" stroke-linecap="round"/>

  <!-- the spark left in the empty palm, and motes shaking loose off every blade -->
  <path d="M80.5 51.5 l1 -3.8 l1 3.8 l3.8 1 l-3.8 1 l-1 3.8 l-1 -3.8 l-3.8 -1 Z" fill="#ffe489" opacity=".85"/>
  <g fill="#ffd166">
    <circle cx="71" cy="39.5" r=".85"/><circle cx="66.5" cy="37" r=".55"/><circle cx="87" cy="34.5" r=".7"/><circle cx="92" cy="45.5" r=".6"/><circle cx="83" cy="36" r=".45"/><circle cx="95" cy="36" r=".5"/>
    <circle cx="28" cy="15" r=".75"/><circle cx="36" cy="11" r=".55"/><circle cx="16" cy="30" r=".65"/><circle cx="22.5" cy="22" r=".45"/><circle cx="31" cy="25" r=".5"/><circle cx="41" cy="14" r=".6"/>
    <circle cx="17" cy="54" r=".6"/><circle cx="26" cy="60" r=".5"/><circle cx="15.5" cy="68" r=".55"/><circle cx="25" cy="80" r=".45"/><circle cx="19" cy="44" r=".5"/><circle cx="29" cy="52" r=".4"/>
  </g>
</svg>
