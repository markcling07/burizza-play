<?xml version="1.0" encoding="UTF-8"?>
<!-- Zul'kan (Stray Banner, melee tank, Red Orc) – Ashfall Road art v3. A hulking red orc
     in a wide battle-ready stance, gripping a massive warhammer with both hands wide apart.
     Arms curve outward from the body, elbows visible outside the torso silhouette.
     Haft runs diagonally lower-left to upper-right, hammerhead high and right.
     Canvas 100x100, faces right, feet on y=94. data-hand marks the dominant grip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="58,38">
  <defs>
    <linearGradient id="zk-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d05040"/><stop offset=".4" stop-color="#b83828"/><stop offset="1" stop-color="#7a1a0e"/></linearGradient>
    <linearGradient id="zk-skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a2a18"/><stop offset="1" stop-color="#5a1208"/></linearGradient>
    <linearGradient id="zk-armor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#686058"/><stop offset=".4" stop-color="#4a4238"/><stop offset="1" stop-color="#2a2420"/></linearGradient>
    <linearGradient id="zk-armorH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8072"/><stop offset="1" stop-color="#5a5248"/></linearGradient>
    <linearGradient id="zk-hide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a5a40"/><stop offset="1" stop-color="#3a3020"/></linearGradient>
    <linearGradient id="zk-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a9284"/><stop offset=".5" stop-color="#6a6258"/><stop offset="1" stop-color="#3a342e"/></linearGradient>
    <linearGradient id="zk-hammer" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8278"/><stop offset=".5" stop-color="#5a5248"/><stop offset="1" stop-color="#2a2420"/></linearGradient>
    <linearGradient id="zk-haft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5a34"/><stop offset="1" stop-color="#3a2a14"/></linearGradient>
    <linearGradient id="zk-tusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4ecd4"/><stop offset=".6" stop-color="#d8c8a0"/><stop offset="1" stop-color="#b0a078"/></linearGradient>
    <linearGradient id="zk-rust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4a32"/><stop offset="1" stop-color="#4a2a18"/></linearGradient>
    <linearGradient id="zk-chain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9080"/><stop offset="1" stop-color="#4a4438"/></linearGradient>
    <linearGradient id="zk-bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dcc0"/><stop offset="1" stop-color="#b0a080"/></linearGradient>
    <linearGradient id="zk-blood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a1008"/><stop offset="1" stop-color="#3a0804"/></linearGradient>
    <linearGradient id="zk-eye" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc040"/><stop offset="1" stop-color="#e08010"/></linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="46" cy="94" rx="30" ry="4.5" fill="#000" opacity=".35"/>
  <g stroke="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- back leg: planted wide, thick hide-wrapped -->
    <path d="M30 72 h10 l-2 18 h-12 z" fill="url(#zk-hide)"/>
    <path d="M26 90 h14 v4 h-16 Q22 91.5 26 90 z" fill="url(#zk-armor)"/>
    <path d="M23 92 Q22.5 91 25 90 h4 v2.5 h-3.5 z" fill="url(#zk-metal)" opacity=".7"/>
    <rect x="30" y="78" width="9" height="1.2" rx=".4" fill="#4a3a20" opacity=".6"/>
    <!-- back knee guard -->
    <rect x="29" y="70" width="12" height="4.5" rx="1.2" fill="url(#zk-metal)"/>
    <circle cx="32" cy="72.2" r=".6" fill="#9a9080"/><circle cx="37" cy="72.2" r=".6" fill="#9a9080"/>

    <!-- front leg: forward, aggressive stance -->
    <path d="M48 72 h11 l4 18 h-12 z" fill="url(#zk-hide)"/>
    <path d="M50 90 h14 l3.5 4 h-18 z" fill="url(#zk-armor)"/>
    <path d="M64 90 h4 l3 3.5 h-5.5 Q64 92 64 90 z" fill="url(#zk-metal)" opacity=".7"/>
    <rect x="49" y="80" width="10" height="1.2" rx=".4" fill="#4a3a20" opacity=".6"/>
    <!-- front knee guard -->
    <rect x="47" y="70" width="13" height="4.5" rx="1.2" fill="url(#zk-metal)"/>
    <ellipse cx="54" cy="70" rx="3" ry="2" fill="url(#zk-armorH)"/>
    <circle cx="50" cy="72.2" r=".6" fill="#9a9080"/><circle cx="56" cy="72.2" r=".6" fill="#9a9080"/>
    <path d="M48 73 h12" stroke="#5a5248" stroke-width=".4" opacity=".4"/>

    <!-- torso: massive barrel chest, leaning forward slightly -->
    <path d="M28 36 Q26 48 28 60 Q32 70 36 74 L60 74 Q64 70 66 60 Q68 48 66 36 z" fill="url(#zk-armor)"/>
    <!-- chest plate -->
    <path d="M30 38 Q29 48 31 58 L38 64 L58 64 L63 58 Q65 48 64 38 z" fill="url(#zk-metal)"/>
    <path d="M32 42 Q40 44 52 40" stroke="#4a3a20" stroke-width="1.8" fill="none" opacity=".45"/>
    <path d="M62 44 Q54 60 36 60" stroke="#4a3a20" stroke-width="1.3" fill="none" opacity=".35"/>
    <!-- dents and scratches -->
    <ellipse cx="40" cy="48" rx="2.5" ry="1.5" fill="#4a4238" opacity=".25"/>
    <ellipse cx="54" cy="50" rx="2" ry="1.2" fill="#4a4238" opacity=".2"/>
    <line x1="36" y1="44" x2="42" y2="46" stroke="#6a6258" stroke-width=".4" opacity=".3"/>
    <line x1="50" y1="43" x2="56" y2="48" stroke="#6a6258" stroke-width=".3" opacity=".25"/>
    <!-- crossed-axes emblem -->
    <line x1="44" y1="46" x2="48" y2="50" stroke="#6a6258" stroke-width=".7" opacity=".35"/>
    <line x1="48" y1="46" x2="44" y2="50" stroke="#6a6258" stroke-width=".7" opacity=".35"/>
    <!-- welded patch -->
    <rect x="34" y="55" width="5" height="4" rx=".5" fill="url(#zk-rust)" opacity=".45"/>
    <!-- chest highlight -->
    <path d="M34 42 Q38 39 44 38" stroke="#fff" stroke-width="1.2" fill="none" opacity=".3"/>

    <!-- belt with buckle, chain and trophy bone -->
    <rect x="30" y="66" width="34" height="5.5" rx="1" fill="#5a4a30"/>
    <rect x="43" y="65.5" width="6.5" height="6.5" rx="1" fill="url(#zk-metal)"/>
    <circle cx="46.2" cy="68.8" r="1.4" fill="#3a342e" opacity=".5"/>
    <path d="M36 71 Q35 74 34 76 Q33 77.5 34 78.5" stroke="url(#zk-chain)" stroke-width="1.2" fill="none"/>
    <circle cx="34" cy="79" r="1.2" fill="url(#zk-chain)" opacity=".8"/>
    <path d="M56 71 L57 76 L56.5 78" stroke="url(#zk-bone)" stroke-width="1.3" fill="none"/>
    <ellipse cx="57" cy="78.5" rx="1.8" ry=".9" fill="url(#zk-bone)" opacity=".8"/>

    <!-- left pauldron: heavy metal with spike and rivets -->
    <path d="M23 36 Q23 29 31 28 L38 34 L32 42 z" fill="url(#zk-metal)"/>
    <path d="M26 32 Q30 30 34 32" fill="none" stroke="#8a8072" stroke-width=".6"/>
    <circle cx="27" cy="34" r=".7" fill="#9a9080"/><circle cx="31" cy="32" r=".7" fill="#9a9080"/><circle cx="35" cy="35" r=".7" fill="#9a9080"/>
    <path d="M27 32 L25 27 L29 32" fill="#5a5248"/>

    <!-- right pauldron: mismatched, leather-wrapped, spike -->
    <path d="M59 36 Q59 30 66 30 L70 36 L64 42 z" fill="url(#zk-armor)"/>
    <path d="M61 33 Q65 31 69 33 M61 35 Q65 33 69 35" stroke="#3a2a14" stroke-width=".5" fill="none" stroke-dasharray="1,.8"/>
    <path d="M66 32 L67 27 L68 32" fill="#4a4238"/>

    <!-- LEFT ARM: massive back arm, proper orc bulk -->
    <path d="M22 34 Q14 40 12 50 Q14 62 24 64 L38 58 L38 48 Q30 54 24 50 Q18 44 20 38 L28 38 z" fill="url(#zk-skinD)"/>
    <path d="M16 42 Q13 48 15 56" stroke="#5a1208" stroke-width="1.5" fill="none" opacity=".4"/>
    <path d="M22 40 Q18 46 18 54" stroke="#5a1208" stroke-width="1" fill="none" opacity=".3"/>
    <path d="M14 44 Q12 50 14 58" stroke="#c04838" stroke-width="1.2" fill="none" opacity=".25"/>
    <path d="M26 40 Q22 46 24 54" stroke="#5a1208" stroke-width=".8" fill="none" opacity=".2"/>
    <circle cx="38" cy="56" r="5" fill="url(#zk-skinD)"/>
    <path d="M35 54 Q37 53 39 54" stroke="#5a1208" stroke-width=".6" fill="none" opacity=".4"/>
    <path d="M35.5 56.5 Q37.5 55.5 39.5 56.5" stroke="#3a0a04" stroke-width=".5" fill="none" opacity=".3"/>

    <!-- RIGHT ARM: elbow curves out right of torso, forearm to upper grip -->
    <path d="M64 34 Q74 34 78 42 Q76 50 66 46 L56 40 L60 36 z" fill="url(#zk-skin)"/>
    <path d="M68 36 Q74 38 76 42" stroke="#7a1a0a" stroke-width=".5" fill="none" opacity=".3"/>
    <circle cx="58" cy="38" r="4.2" fill="url(#zk-skin)"/>
    <path d="M55.5 36.5 Q57 36 58.5 36.5" stroke="#7a1a0a" stroke-width=".5" fill="none" opacity=".4"/>
    <path d="M56 38.5 Q57.5 38 59 38.5" stroke="#5a1208" stroke-width=".4" fill="none" opacity=".3"/>

    <!-- neck muscles -->
    <path d="M38 34 Q40 35 43 34 M51 34 Q53 35 55 34" stroke="#9a2a14" stroke-width=".7" fill="none" opacity=".3"/>

    <!-- HEAD: three-quarter view, looking down the field -->
    <!-- ear behind head -->
    <path d="M34 20 L25 14 L33 28 z" fill="url(#zk-skin)" opacity=".9"/>
    <path d="M33 20 L29 17 L32 25" stroke="#7a1a0a" stroke-width=".55" fill="none" opacity=".4"/>
    <!-- skull: heavy brow, jutting muzzle, thick jaw -->
    <path d="M32 22 Q30 12 40 8.5 Q50 7.5 54 16 L57 21 L55.5 24 Q58 30 51 34 Q44 37 38 34 Q34 29 32 22 z" fill="url(#zk-skin)"/>
    <!-- brow ridge -->
    <path d="M42 17.5 L53 19.5" stroke="#7a1a0a" stroke-width="3" stroke-linecap="round"/>
    <path d="M43 16 Q48 15.2 53 17" stroke="#5a0a04" stroke-width=".5" fill="none" opacity=".4"/>
    <!-- the near eye: fierce amber -->
    <ellipse cx="50" cy="21.5" rx="2.8" ry="2.4" fill="#1a0a00"/>
    <circle cx="50.5" cy="21.3" r="1.2" fill="url(#zk-eye)"/>
    <circle cx="50.9" cy="21" r=".5" fill="#ffdd70"/>
    <circle cx="49.5" cy="22" r=".3" fill="#fff" opacity=".6"/>
    <!-- mouth and visible nostril -->
    <path d="M44 28 Q50 30 55 27.5" stroke="#7a1a0a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="54" cy="24" rx=".9" ry=".65" fill="#6a1a0a" opacity=".55"/>
    <!-- tusks: near one bigger -->
    <path d="M46 30 L45 23.5 L48.5 29 z" fill="url(#zk-tusk)"/>
    <path d="M52 29 L53 23 L54.5 27.8 z" fill="url(#zk-tusk)"/>
    <path d="M46.2 28 L45.5 24.5" stroke="#d8d0b8" stroke-width=".45" opacity=".5"/>
    <path d="M53 27.5 L53.2 24" stroke="#d8d0b8" stroke-width=".45" opacity=".5"/>
    <!-- scar across cheek -->
    <path d="M42 24.5 L48.5 28" stroke="#6a1a0a" stroke-width="1.1" opacity=".5"/>
    <!-- war paint: two stripes down the cheek -->
    <path d="M37 21 L35 25" stroke="#1a0a04" stroke-width="1.1" opacity=".35"/>
    <path d="M39.5 20.5 L37.5 24.5" stroke="#1a0a04" stroke-width="1" opacity=".3"/>
    <!-- skull highlight -->
    <path d="M35 16 Q38 11.5 42 9.5" stroke="#fff" stroke-width="1.3" fill="none" opacity=".45" stroke-linecap="round"/>
    <!-- jaw muscle -->
    <path d="M40 30 Q42 32 44 31" stroke="#9a2a14" stroke-width=".6" fill="none" opacity=".3"/>
  </g>
  <!-- WEAPON: warhammer held diagonally with both hands wide apart -->
  <g class="wpn">
    <g transform="translate(-24 15) rotate(48 72 32)">
      <!-- haft with wood grain -->
      <rect x="70.2" y="10" width="3.6" height="44" rx="1.5" fill="url(#zk-haft)"/>
      <line x1="71.2" y1="14" x2="71.2" y2="50" stroke="#2a1a0a" stroke-width=".3" opacity=".3"/>
      <line x1="72.8" y1="16" x2="72.8" y2="48" stroke="#2a1a0a" stroke-width=".2" opacity=".2"/>
      <!-- upper leather grip (right hand) -->
      <path d="M70 16 l3.8 1.5 M70 18 l3.8 1.5 M70 20 l3.8 1.5" stroke="#4a2a10" stroke-width=".9" fill="none" opacity=".65"/>
      <!-- lower leather grip (left hand) -->
      <path d="M70 44 l3.8 1.5 M70 46 l3.8 1.5 M70 48 l3.8 1.5" stroke="#4a2a10" stroke-width=".9" fill="none" opacity=".65"/>
      <!-- hammer head: massive, battered -->
      <rect x="63" y="4" width="18" height="11" rx="2.5" fill="url(#zk-hammer)"/>
      <!-- strike faces with depth -->
      <rect x="63.5" y="5" width="6" height="9" rx="1.2" fill="#3a342e" opacity=".35"/>
      <rect x="74.5" y="5" width="6" height="9" rx="1.2" fill="#3a342e" opacity=".35"/>
      <!-- impact dents -->
      <ellipse cx="65" cy="8" rx="1.4" ry=".9" fill="#2a2420" opacity=".35"/>
      <ellipse cx="66.5" cy="12" rx=".9" ry=".7" fill="#2a2420" opacity=".3"/>
      <ellipse cx="77" cy="7.5" rx="1.1" ry=".8" fill="#2a2420" opacity=".3"/>
      <!-- blood stain -->
      <path d="M64 7 Q65 6.5 65.5 8 Q66 9.5 65 10" fill="url(#zk-blood)" opacity=".4"/>
      <!-- rune engravings -->
      <line x1="70" y1="6" x2="70" y2="13" stroke="#5a5248" stroke-width=".5" opacity=".4"/>
      <line x1="68.5" y1="9.5" x2="71.5" y2="9.5" stroke="#5a5248" stroke-width=".4" opacity=".35"/>
      <path d="M73 6 L74 9.5 L73 13" stroke="#5a5248" stroke-width=".4" fill="none" opacity=".35"/>
      <!-- spike on top -->
      <path d="M70 4 L72 -3 L74 4" fill="url(#zk-metal)"/>
      <line x1="72" y1="-2.5" x2="73" y2="3" stroke="#9a9080" stroke-width=".35" opacity=".4"/>
      <!-- head highlight -->
      <path d="M64 5.5 h14" stroke="#8a8072" stroke-width=".5" opacity=".4"/>
      <!-- pommel -->
      <circle cx="72" cy="55.5" r="2.6" fill="url(#zk-metal)"/>
      <circle cx="72" cy="55.5" r="1.3" fill="#5a5248" opacity=".5"/>
    </g>
  </g>
  <!-- grip fingers wrapping over haft -->
  <path d="M56.5 36.5 Q58 35 59.5 36.5" stroke="#b83828" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M56 38.5 Q57.5 37 59 38.5" stroke="#9a2818" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M36.5 54.5 Q38 53 39.5 54.5" stroke="#7a1a0a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M36 56.5 Q37.5 55 39 56.5" stroke="#5a1208" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <!-- body scars layered on top -->
  <path d="M56 48 Q58 50 57 53" stroke="#6a1a0a" stroke-width=".6" fill="none" opacity=".35"/>
  <path d="M38 54 l2 1.5" stroke="#6a1a0a" stroke-width=".55" fill="none" opacity=".3"/>
  <!-- dust at feet -->
  <ellipse cx="30" cy="93.5" rx="4" ry="1.5" fill="#8a7a60" opacity=".1"/>
  <ellipse cx="64" cy="93.5" rx="3.5" ry="1.2" fill="#8a7a60" opacity=".08"/>
</svg>
