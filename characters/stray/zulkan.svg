<?xml version="1.0" encoding="UTF-8"?>
<!-- Zul'kan (Stray Banner, melee tank, Red Orc) - Burizza art placeholder. A hulking red orc exile
     with a massive warhammer held in his right hand. Scarred, heavy-set, wearing scavenged plate
     and hide. Canvas 100x100, faces right, feet on y=94. The warhammer head is his weapon
     (class="wpn"): data-hand marks where the grip meets the fist. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="68.9,53.7">
  <defs>
    <linearGradient id="zk-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c04a3a"/><stop offset="1" stop-color="#8a2a1a"/></linearGradient>
    <linearGradient id="zk-armor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5046"/><stop offset=".6" stop-color="#3a342c"/><stop offset="1" stop-color="#2a2420"/></linearGradient>
    <linearGradient id="zk-hide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a5a40"/><stop offset="1" stop-color="#3a3020"/></linearGradient>
    <linearGradient id="zk-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8072"/><stop offset=".5" stop-color="#5a5248"/><stop offset="1" stop-color="#3a342e"/></linearGradient>
    <linearGradient id="zk-hammer" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a7268"/><stop offset=".5" stop-color="#4a4238"/><stop offset="1" stop-color="#2a2420"/></linearGradient>
    <linearGradient id="zk-haft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4a2a"/><stop offset="1" stop-color="#3a2a14"/></linearGradient>
    <linearGradient id="zk-tusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0e8d0"/><stop offset="1" stop-color="#c8b890"/></linearGradient>
    <linearGradient id="zk-rust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4a32"/><stop offset="1" stop-color="#4a2a18"/></linearGradient>
    <linearGradient id="zk-chain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9080"/><stop offset="1" stop-color="#4a4438"/></linearGradient>
    <linearGradient id="zk-bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dcc0"/><stop offset="1" stop-color="#b0a080"/></linearGradient>
    <linearGradient id="zk-blood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a1008"/><stop offset="1" stop-color="#3a0804"/></linearGradient>
    <linearGradient id="zk-scar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a1a0a"/><stop offset="1" stop-color="#4a1008"/></linearGradient>
    <linearGradient id="zk-pauldron-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a6258"/><stop offset="1" stop-color="#2a2620"/></linearGradient>
  </defs>
  <!-- ground shadow, cracked earth, dust -->
  <ellipse cx="48" cy="94" rx="26" ry="4" fill="#000" opacity=".3"/>
  <line x1="36" y1="93" x2="32" y2="96" stroke="#000" stroke-width=".4" opacity=".2"/>
  <line x1="55" y1="93" x2="59" y2="96" stroke="#000" stroke-width=".4" opacity=".18"/>
  <ellipse cx="33" cy="93" rx="4" ry="1.5" fill="#8a7a60" opacity=".12"/><ellipse cx="62" cy="93" rx="3.5" ry="1.2" fill="#8a7a60" opacity=".1"/>
  <!-- STANCE: he is the faction's tank and was reading as its smallest man — 81.5 tall
       against Mogra's 92 and Krug's 89, and the narrowest of the three. Grown about the
       footing line (y=93.5, which every champion shares) so his head reaches the canvas top
       like theirs, and stretched a little wider than tall so the mass reads as bulk rather
       than a taller thin man. The ground shadow is left outside this: it marks where he
       stands, not how big he is. -->
  <g transform="translate(50.0,93.5) scale(1.18,1.12) translate(-50.0,-93.5)">
  <g stroke="none">
    <!-- legs: thick hide-wrapped with straps -->
    <path d="M38 74 L44 74 L43 89 L37 89 Z" fill="url(#zk-hide)"/>
    <path d="M50 74 L56 74 L58 89 L51 89 Z" fill="url(#zk-hide)"/>
    <rect x="37" y="79" width="7" height="1.2" rx=".4" fill="#4a3a20" opacity=".7"/><rect x="51" y="81" width="7" height="1.2" rx=".4" fill="#4a3a20" opacity=".7"/>
    <!-- boots with metal toe caps, straps, studs -->
    <path d="M35 88 h10 v5.5 h-13 Q31 90 35 88 Z" fill="url(#zk-armor)"/>
    <path d="M49 88 h11 l4 5.5 h-16 Z" fill="url(#zk-armor)"/>
    <path d="M32 91 Q31 90 33 89 h5 v3 h-4 Q32 92 32 91 Z" fill="url(#zk-metal)" opacity=".8"/><path d="M61 89 h4 l2.5 3.5 h-5 Q61 91 61 89 Z" fill="url(#zk-metal)" opacity=".8"/>
    <rect x="35" y="89.5" width="9" height=".8" rx=".3" fill="#3a2a14" opacity=".6"/><rect x="51" y="89.5" width="9" height=".8" rx=".3" fill="#3a2a14" opacity=".6"/>
    <circle cx="36" cy="90" r=".5" fill="#7a7060"/><circle cx="39" cy="90" r=".5" fill="#7a7060"/><circle cx="42" cy="90" r=".5" fill="#7a7060"/><circle cx="53" cy="90" r=".5" fill="#7a7060"/><circle cx="56" cy="90" r=".5" fill="#7a7060"/>
    <!-- knee guards with rivets -->
    <rect x="37" y="73" width="8" height="4" rx="1" fill="url(#zk-metal)"/>
    <rect x="49" y="73" width="8" height="4" rx="1" fill="url(#zk-metal)"/>
    <circle cx="39" cy="75" r=".6" fill="#9a9080"/><circle cx="43" cy="75" r=".6" fill="#9a9080"/><circle cx="51" cy="75" r=".6" fill="#9a9080"/><circle cx="55" cy="75" r=".6" fill="#9a9080"/>
    <!-- torso: massive barrel chest -->
    <path d="M32 38 Q30 50 32 62 Q34 72 38 76 L56 76 Q60 72 62 62 Q64 50 62 38 Z" fill="url(#zk-armor)"/>
    <!-- chest plate: dents, scratches, crossed-axes emblem, welded patch, armor straps -->
    <path d="M34 40 Q33 50 35 60 L40 64 L54 64 L59 60 Q61 50 60 40 Z" fill="url(#zk-metal)"/>
    <ellipse cx="42" cy="48" rx="2.5" ry="1.5" fill="#4a4238" opacity=".3"/><ellipse cx="53" cy="52" rx="2" ry="1.2" fill="#4a4238" opacity=".25"/>
    <line x1="38" y1="44" x2="44" y2="46" stroke="#6a6258" stroke-width=".4" opacity=".3"/><line x1="50" y1="42" x2="56" y2="48" stroke="#6a6258" stroke-width=".3" opacity=".25"/>
    <line x1="45" y1="46" x2="49" y2="50" stroke="#6a6258" stroke-width=".6" opacity=".35"/><line x1="49" y1="46" x2="45" y2="50" stroke="#6a6258" stroke-width=".6" opacity=".35"/>
    <rect x="36" y="57" width="5" height="4" rx=".5" fill="url(#zk-rust)" opacity=".5"/>
    <path d="M36 42 Q44 44 56 40" stroke="#4a3a20" stroke-width="1.5" fill="none" opacity=".5"/>
    <path d="M58 44 Q50 64 38 62" stroke="#4a3a20" stroke-width="1.2" fill="none" opacity=".4"/>
    <!-- belt with buckle, hanging chain and trophy bone -->
    <rect x="34" y="68" width="26" height="5" rx="1" fill="#5a4a30"/>
    <rect x="44" y="67.5" width="6" height="6" rx="1" fill="url(#zk-metal)"/><circle cx="47" cy="70.5" r="1.2" fill="#3a342e" opacity=".5"/>
    <path d="M38 72 Q37 75 36 77 Q35 78 36 79" stroke="url(#zk-chain)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="36" cy="79.5" r="1" fill="url(#zk-chain)" opacity=".8"/>
    <path d="M54 72 L55 77 L54.5 79" stroke="url(#zk-bone)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="55" cy="79.5" rx="1.5" ry=".8" fill="url(#zk-bone)" opacity=".8"/>
    <!-- left pauldron: heavy metal, rivets, spike -->
    <ellipse cx="33" cy="38" rx="8" ry="5" fill="url(#zk-metal)"/>
    <circle cx="29" cy="38" r=".6" fill="#9a9080"/><circle cx="33" cy="35" r=".6" fill="#9a9080"/><circle cx="37" cy="38" r=".6" fill="#9a9080"/>
    <path d="M31 35 L30 31 L33 35" fill="#5a5248"/>
    <!-- right pauldron: mismatched, leather-wrapped with stitching and spike -->
    <ellipse cx="61" cy="38" rx="7" ry="4.5" fill="url(#zk-pauldron-r)"/>
    <path d="M57 36 Q61 34 65 36 M57 38 Q61 36 65 38" stroke="#3a2a14" stroke-width=".5" fill="none" stroke-dasharray="1,.8"/>
    <path d="M63 36 L64 32 L65 36" fill="#4a4238"/>
    <!-- left arm: bare, muscle contour, bicep bulge, vein -->
    <path d="M26 40 Q24 50 26 60 L30 62 L34 60 Q36 50 34 40 Z" fill="url(#zk-skin)"/>
    <path d="M28 42 Q26 48 27 54" stroke="#7a1a0a" stroke-width=".5" fill="none" opacity=".35"/>
    <path d="M32 42 Q34 46 33 50" stroke="#9a2a14" stroke-width=".4" fill="none" opacity=".3"/>
    <path d="M29 48 Q28 52 29 56" stroke="#6a1a0a" stroke-width=".4" fill="none" opacity=".25"/>
    <!-- left fist clenched, knuckle lines -->
    <circle cx="28" cy="63" r="4" fill="url(#zk-skin)"/>
    <path d="M25.5 62 Q27 61 29 61.5" stroke="#7a1a0a" stroke-width=".4" fill="none" opacity=".4"/>
    <!-- neck muscles -->
    <path d="M40 36 Q42 37 44 36 M50 36 Q52 37 54 36" stroke="#9a2a14" stroke-width=".6" fill="none" opacity=".3"/>
    <!-- right arm: bare, muscled -->
    <path d="M58 40 Q60 48 62 56 L66 58 L68 56 Q66 48 64 40 Z" fill="url(#zk-skin)"/>
    <path d="M60 42 Q58 46 59 50" stroke="#9a2a14" stroke-width=".5" fill="none" opacity=".3"/>
    <path d="M63 46 Q64 50 63 54" stroke="#6a1a0a" stroke-width=".4" fill="none" opacity=".25"/>
    <!-- right fist gripping haft, knuckle detail -->
    <circle cx="64" cy="59" r="4" fill="url(#zk-skin)"/>
    <path d="M62 57.5 Q63 57 64 57.5" stroke="#7a1a0a" stroke-width=".4" fill="none" opacity=".4"/>
    <!-- HEAD, three-quarter, looking down the field at them.

         He was the only champion on the roster drawn square-on — symmetric eyes, a centred
         nose, both tusks equal — so he stared past the enemy at the viewer. This is the same
         construction Krug and Mogra use, in his colours: the back of the skull is a smooth
         curve, the brow juts forward, a notch marks the bridge, and the muzzle swells out and
         down to the chin. From that angle you only ever see ONE eye and ONE nostril, the ear
         falls behind the skull, and the tusks rise from the jaw with the near one carried
         further forward. Drawn, not transformed: the first two attempts at turning him with a
         <g transform> only skewed a front-on face and made him look broken. -->
    <!-- ear: behind the head, pointing back away from the facing -->
    <path d="M40 24 L30.5 18 L38.5 31.5 Z" fill="url(#zk-skin)" opacity=".92"/>
    <path d="M38 24.5 L34 21.5 L37.5 28.5" stroke="#7a1a0a" stroke-width=".55" fill="none" opacity=".45"/>
    <!-- skull: smooth back, brow, bridge notch, muzzle, jaw -->
    <path d="M37.5 26 Q35.5 15 45 12.5 Q55 11.8 57.5 21 L60.5 25.5 L58.5 28 Q61 33.5 54.5 36.5 Q47 39 41.5 36 Q38 32 37.5 26 Z" fill="url(#zk-skin)"/>
    <!-- brow ridge, heavy over the one eye we can see -->
    <path d="M46.5 21.5 L56 23.6" stroke="#7a1a0a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M47.5 20.2 Q52 19.6 55.8 21.4" stroke="#5a0a04" stroke-width=".4" fill="none" opacity=".4"/>
    <!-- the near eye -->
    <ellipse cx="53.2" cy="25.5" rx="2.5" ry="2.2" fill="#1a0a00"/>
    <circle cx="53.6" cy="25.4" r="1.05" fill="#ffa030"/>
    <circle cx="53.9" cy="25.1" r=".42" fill="#ffcc60"/>
    <!-- mouth line and the single visible nostril, out at the muzzle -->
    <path d="M48.5 31.6 Q53 32.9 57.8 31" stroke="#7a1a0a" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <ellipse cx="57.2" cy="27.5" rx=".85" ry=".6" fill="#6a1a0a" opacity=".55"/>
    <!-- tusks up from the jaw; the near one sits further forward and reads bigger -->
    <path d="M50 33.2 L49.4 27.3 L52.4 32.4 Z" fill="url(#zk-tusk)"/>
    <path d="M55 32.2 L56 26.4 L57.6 30.9 Z" fill="url(#zk-tusk)"/>
    <path d="M50.1 31.6 L50 28.4" stroke="#d8d0b8" stroke-width=".4" opacity=".5"/>
    <path d="M55.9 30.4 L56.2 27.6" stroke="#d8d0b8" stroke-width=".4" opacity=".5"/>
    <!-- his scar, and war paint back along the cheek -->
    <path d="M46.2 28.4 L51.8 31.6" stroke="url(#zk-scar)" stroke-width="1" opacity=".55"/>
    <path d="M41.6 24.6 L39.6 28" stroke="#1a0a04" stroke-width="1" opacity=".33"/>
    <path d="M44 24 L42 27.4" stroke="#1a0a04" stroke-width="1" opacity=".3"/>
    <!-- light down the back of the skull, as the other orcs carry it -->
    <path d="M40 19.5 Q42 15.2 46.5 13.9" stroke="#fff" stroke-width="1.2" fill="none" opacity=".4" stroke-linecap="round"/>
  </g>
  <!-- WEAPON: warhammer -->
  <g class="wpn">
    <!-- Held a touch further out, so the head clears his muzzle now that he is turned
         into it. Nested rather than set on .wpn itself, because the swing animates that
         element's transform and would overwrite anything parked there. -->
    <g transform="translate(4,0)">
    <!-- haft with wood grain -->
    <rect x="61" y="24" width="3.5" height="36" rx="1.5" fill="url(#zk-haft)"/>
    <line x1="62" y1="28" x2="62" y2="56" stroke="#2a1a0a" stroke-width=".3" opacity=".3"/>
    <line x1="63.5" y1="30" x2="63.5" y2="54" stroke="#2a1a0a" stroke-width=".2" opacity=".2"/>
    <!-- leather grip wrapping -->
    <path d="M61 52 L64.5 53.5 M61 54 L64.5 55.5 M61 56 L64.5 57.5" stroke="#4a2a10" stroke-width=".8" fill="none" opacity=".7"/>
    <!-- hammer head with strike faces -->
    <rect x="55" y="18" width="16" height="10" rx="2" fill="url(#zk-hammer)"/>
    <rect x="55.5" y="19" width="5" height="8" rx="1" fill="#3a342e" opacity=".4"/>
    <rect x="66" y="19" width="5" height="8" rx="1" fill="#3a342e" opacity=".4"/>
    <!-- impact dents on faces -->
    <ellipse cx="57" cy="22" rx="1.2" ry=".8" fill="#2a2420" opacity=".35"/>
    <ellipse cx="58.5" cy="25" rx=".8" ry=".6" fill="#2a2420" opacity=".3"/>
    <ellipse cx="68" cy="21" rx="1" ry=".7" fill="#2a2420" opacity=".3"/>
    <!-- blood stain on strike face -->
    <path d="M56 21 Q57 20.5 57.5 22 Q58 23 57 23.5" fill="url(#zk-blood)" opacity=".4"/>
    <!-- rune engravings on head -->
    <line x1="61" y1="20" x2="61" y2="26" stroke="#5a5248" stroke-width=".5" opacity=".4"/>
    <line x1="59.5" y1="23" x2="62.5" y2="23" stroke="#5a5248" stroke-width=".4" opacity=".35"/>
    <path d="M64 20 L65 23 L64 26" stroke="#5a5248" stroke-width=".4" fill="none" opacity=".35"/>
    <!-- spike on top with edge highlight -->
    <path d="M62 18 L63.5 12 L65 18" fill="url(#zk-metal)"/>
    <line x1="63.5" y1="12.5" x2="64.5" y2="17" stroke="#9a9080" stroke-width=".3" opacity=".4"/>
  </g>
    </g>
  </g>
</svg>
