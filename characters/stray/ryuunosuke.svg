<?xml version="1.0" encoding="UTF-8"?>
<!-- Ryuunosuke (Stray Banner, melee assassin, Samurai) - Burizza art placeholder. A dark-armored
     masterless samurai in a low ready stance. Steel mempo mask, heavy layered plates, crimson accents.
     Katana drawn in lead hand, slightly crouched. Canvas 100x100, faces right, feet on y=94.
     The katana blade is his weapon (class="wpn"): data-hand marks the grip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="56,58">
  <defs>
    <linearGradient id="ry-armor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a44"/><stop offset=".5" stop-color="#22222c"/><stop offset="1" stop-color="#14141a"/></linearGradient>
    <linearGradient id="ry-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4a56"/><stop offset="1" stop-color="#2a2a34"/></linearGradient>
    <linearGradient id="ry-crimson" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c04848"/><stop offset="1" stop-color="#6a1a1a"/></linearGradient>
    <linearGradient id="ry-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4c4a8"/><stop offset="1" stop-color="#a89880"/></linearGradient>
    <linearGradient id="ry-blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e8f0"/><stop offset=".3" stop-color="#c8c8d4"/><stop offset=".7" stop-color="#a8a8b8"/><stop offset="1" stop-color="#d0d0dc"/></linearGradient>
    <linearGradient id="ry-wrap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a1a"/><stop offset="1" stop-color="#1a0a0a"/></linearGradient>
    <linearGradient id="ry-mask" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5a66"/><stop offset="1" stop-color="#2a2a34"/></linearGradient>
    <linearGradient id="ry-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a24"/><stop offset="1" stop-color="#0a0a10"/></linearGradient>
    <linearGradient id="ry-glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4444"/><stop offset="1" stop-color="#c04848" stop-opacity=".3"/></linearGradient>
    <linearGradient id="ry-lace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a03030"/><stop offset="1" stop-color="#601818"/></linearGradient>
    <linearGradient id="ry-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#888898"/><stop offset="1" stop-color="#58586a"/></linearGradient>
    <radialGradient id="ry-shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0a0a14" stop-opacity=".6"/><stop offset="1" stop-color="#0a0a14" stop-opacity="0"/></radialGradient>
    <linearGradient id="ry-sandal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3820"/><stop offset="1" stop-color="#2a1a0e"/></linearGradient>
  </defs>
