<?xml version="1.0" encoding="UTF-8"?>
<!-- Ryuunosuke (Stray Banner, melee assassin, Samurai) - Burizza art v2. A masterless samurai in a
     low ready stance, turned to the enemy with the katana up in both hands.
     PROPORTION: the placeholder was ~3.5 heads tall with a head as WIDE as its torso and a slab for
     a body, which read chibi next to the finished roster. Here the head is narrower than the
     shoulders and the figure runs ~4.2 heads, in line with Automaton X and Wren.
     SHAPE: the do is cut wide at the chest and drawn in at the waist, then the hakama flares again
     over the legs - a shape rather than a rectangle.
     STANCE: back leg braced out and straight, front leg forward and bent under him, torso carried
     over the front knee, both elbows dropped and out, hands together in front of the chest.
     The katana is LEVEL - run straight out at the enemy at shoulder height, no rotate on the group
     at all, so the blade itself is the horizontal. Canvas 100x100, faces right, feet on y=94.
     The katana is his weapon (class="wpn"): data-hand marks the front hand on the grip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="56.4,38">
  <defs>
    <linearGradient id="ry-armor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a44"/><stop offset=".5" stop-color="#22222c"/><stop offset="1" stop-color="#14141a"/></linearGradient>
    <linearGradient id="ry-armorD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22222c"/><stop offset="1" stop-color="#0d0d12"/></linearGradient>
    <linearGradient id="ry-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4a56"/><stop offset="1" stop-color="#2a2a34"/></linearGradient>
    <linearGradient id="ry-crimson" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c04848"/><stop offset="1" stop-color="#6a1a1a"/></linearGradient>
    <linearGradient id="ry-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4c4a8"/><stop offset="1" stop-color="#a89880"/></linearGradient>
    <linearGradient id="ry-blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f8"/><stop offset=".45" stop-color="#c8c8d4"/><stop offset="1" stop-color="#9a9aac"/></linearGradient>
    <linearGradient id="ry-wrap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a1a"/><stop offset="1" stop-color="#1a0a0a"/></linearGradient>
    <linearGradient id="ry-mask" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5a66"/><stop offset="1" stop-color="#2a2a34"/></linearGradient>
    <linearGradient id="ry-glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4444"/><stop offset="1" stop-color="#c04848" stop-opacity=".3"/></linearGradient>
    <linearGradient id="ry-lace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a03030"/><stop offset="1" stop-color="#601818"/></linearGradient>
    <linearGradient id="ry-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#888898"/><stop offset="1" stop-color="#58586a"/></linearGradient>
    <linearGradient id="ry-sandal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3820"/><stop offset="1" stop-color="#2a1a0e"/></linearGradient>
    <filter id="ry-soft" x="-60%" y="-70%" width="220%" height="240%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <!-- ground: a long shadow under a braced stance, not a neat disc under a standing figure -->
  <ellipse cx="50" cy="94" rx="25" ry="3.6" fill="#000" opacity=".38" filter="url(#ry-soft)"/>
  <ellipse cx="50" cy="94.4" rx="15" ry="2" fill="#000" opacity=".3"/>
  <g fill="#555" opacity=".25"><circle cx="28" cy="91" r=".7"/><circle cx="72" cy="92" r=".55"/><circle cx="34" cy="93" r=".4"/><circle cx="66" cy="90.5" r=".5"/></g>

  <!-- THE CLONE (Nature: Invulnerable Clone - "a shadow walks behind him"). Deliberately NOT his
       own silhouette offset a few units: that reads as a printing fault, not a second body. It is
       a smaller, dimmer samurai of its own, caught on a different beat - blade wound up overhead
       while he holds his level - so the two never merge into one shape. Cool indigo rather than
       black, because black on the arena's dark floor disappears. Only the eyes carry colour.
       Drawn first, so his own braced back leg passes in front of it. -->
  <g opacity=".72">
    <ellipse cx="21" cy="88.6" rx="12" ry="2.2" fill="#15112a" opacity=".55" filter="url(#ry-soft)"/>
    <!-- hakama and legs -->
    <path d="M15 56 Q10.6 64 12.4 73 L19 74.6 Q19.6 64.6 20.2 56 Z" fill="#241e3a"/>
    <path d="M20.8 56 Q21.4 65.6 22.8 73.6 L31.4 72.8 Q34 64 31 56 Z" fill="#241e3a"/>
    <path d="M12.4 73 L19 74.6 L18.2 81.6 L12 80.2 Z" fill="#1e1931"/>
    <path d="M23.2 73.8 L31.2 72.9 L32.5 80.8 L24.6 81.7 Z" fill="#241e3a"/>
    <path d="M9.4 87.6 L12.6 82 L18.4 83 L18.6 87.9 Z" fill="#1e1931"/>
    <path d="M24.5 82.2 L32.4 81.3 L36.6 86.6 L24.7 87.2 Z" fill="#241e3a"/>
    <!-- torso, drawn in at the waist like his -->
    <path d="M14.6 39.6 Q22.4 36.4 30.2 39.6 Q31.8 45.2 31.3 51 Q30.6 54.8 29.8 57 Q22.2 59.6 15.8 57 Q14.8 54.8 14.2 51 Q13 45.2 14.6 39.6 Z" fill="#241e3a"/>
    <path d="M14.8 51.4 Q22.4 54.2 30.2 51.4 L30 54.6 Q22.4 57.4 15.2 54.6 Z" fill="#2e2648"/>
    <!-- sode -->
    <path d="M11.2 39 Q9.2 41.6 10.4 45.8 L16.4 45 Q17.2 41.2 16 38.6 Z" fill="#2a2342"/>
    <path d="M28.8 38.6 Q32.2 41.2 33.8 46.4 L27.4 47.6 Q26.6 42.4 27.8 38.8 Z" fill="#2a2342"/>
    <!-- both arms up on a raised grip -->
    <path d="M11.8 41.6 L15.8 41 L18 49.4 L14 50.2 Z" fill="#1e1931"/>
    <path d="M14 50.2 L18 49.4 L23 40.6 L19.8 39 Z" fill="#1e1931"/>
    <path d="M28 41 L31.8 41.8 L29.6 50 L25.8 49.2 Z" fill="#241e3a"/>
    <path d="M25.8 49.2 L29.6 50 L25.4 40.6 L22.2 42 Z" fill="#241e3a"/>
    <!-- head -->
    <path d="M14.8 29 Q14.8 23.2 19.6 22.4 Q25.4 22.4 26.8 27.6 Q27.6 31.4 26.8 34.2 L16.2 34.9 Q14.8 32.6 14.8 29 Z" fill="#241e3a"/>
    <path d="M12.3 29.4 Q16.4 27.5 21 27.3 Q25.8 27.5 29.1 29.4 Q26.6 31 21 30.4 Q15.4 30.9 12.3 29.4 Z" fill="#2e2648"/>
    <path d="M20.2 22.4 L18.7 16.9 Q20.6 15.9 22.3 17.1 Z" fill="#241e3a"/>
    <!-- katana, raised past its own shoulder. The CLONE is shadow but its blade is not - the steel
         is grey and lit, so the thing that actually does the cutting reads. Pitched brighter than
         it looks here because the whole group is carried at .72 opacity.
         Angled FORWARD, not back over the head: wound back, the blade cut straight across its own
         face and buried the two red slits that are the only thing identifying it. -->
    <path d="M27.4 39.1 L25.6 37.9 L40.5 15.5 Z" fill="#a6a6b4"/>
    <path d="M26.6 38.4 L39.8 16.6" stroke="#d6d6e2" stroke-width=".45" fill="none" opacity=".8"/>
    <path d="M28.4 39.6 L24.6 37.4" stroke="#4a4a56" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M27.4 39 L24.3 44.1 L22.5 43.1 L25.6 38 Z" fill="#1a1626"/>
    <path d="M24.4 44.3 L22.9 43.4" stroke="#3a3348" stroke-width=".9" stroke-linecap="round"/>
    <!-- the only colour it carries: the same two slits -->
    <rect x="17.6" y="30.6" width="2.8" height="1.4" rx=".55" fill="#c04848" opacity=".8"/>
    <rect x="22.3" y="30.4" width="3.3" height="1.5" rx=".55" fill="#c04848" opacity=".88"/>
  </g>
  <path d="M26 88 Q22 82 24 76 M74 86 Q78 80 76 74" stroke="#1a1a2e" stroke-width=".45" fill="none" opacity=".35"/>

  <g stroke="none">
    <!-- BACK LEG: braced out behind him, straight, taking the weight back -->
    <path d="M40 66 L47 66 L41 83 L34 82 Z" fill="url(#ry-armorD)"/>
    <path d="M34 82 L41 83 L39.5 89.5 L32.5 88.5 Z" fill="url(#ry-armorD)"/>
    <path d="M34.4 83.4 L40.4 84.3 M34 86 L40 86.9" stroke="#3a3a44" stroke-width=".45" opacity=".55"/>
    <path d="M26.5 92.8 L31 87.8 L39.6 89 L40 93.2 Z" fill="url(#ry-sandal)"/>
    <path d="M26.5 92.8 L40 93.2 L40 94.2 L26.3 93.8 Z" fill="#2a1a0e"/>
    <path d="M31.5 89 L38.5 90" stroke="#5a4830" stroke-width=".5"/>
    <!-- BACK ARM: elbow dropped and out, forearm back up to the low hand on the tsuka -->
    <path d="M37.6 39.5 L42.2 39 L44.6 50.6 L40 51.6 Z" fill="url(#ry-armorD)"/>
    <path d="M40 51.6 L44.6 50.6 L50.4 40.6 L46.4 38.4 Z" fill="url(#ry-armorD)"/>
    <path d="M38.6 43 L43 42.3 M39.4 47 L44 46.3" stroke="#3a3a44" stroke-width=".45" opacity=".5"/>
    <path d="M47.4 42.6 L50.4 44.2" stroke="#3a3a44" stroke-width=".4" opacity=".45"/>

    <!-- HAKAMA: flares out over the thighs, then gathers in at the shins -->
    <path d="M39 60 Q33 70 35 80 L44 82 Q45 70 46 60 Z" fill="url(#ry-armor)"/>
    <path d="M46 60 Q47 71 49 80 L62 79 Q65 69 61 60 Z" fill="url(#ry-armor)"/>
    <path d="M38.5 64 Q35.5 72 36.6 79 M42 63 Q41 71 42.2 80" stroke="#15151c" stroke-width=".45" fill="none" opacity=".55"/>
    <path d="M51 63 Q51.6 71 52.6 79 M56 63 Q57.4 70.5 58.6 78.6" stroke="#15151c" stroke-width=".45" fill="none" opacity=".55"/>
    <path d="M35.2 79.4 Q39.5 81 44 81.6 M49.2 79.6 Q56 79.6 61.8 78.8" stroke="#15151c" stroke-width=".4" fill="none" opacity=".5"/>

    <!-- FRONT LEG: forward and bent under him, knee leading -->
    <path d="M50 70 L60 69 L64 82 L54 83 Z" fill="url(#ry-armor)"/>
    <path d="M54 83 L64 82 L65.5 89.5 L56 90 Z" fill="url(#ry-plate)"/>
    <path d="M54.6 84.6 L64.4 83.7 M55.2 87 L65 86.2" stroke="#58586a" stroke-width=".45" opacity=".6"/>
    <circle cx="57.5" cy="85.6" r=".5" fill="#6a6a7a"/><circle cx="62.5" cy="85.1" r=".5" fill="#6a6a7a"/>
    <path d="M55.6 90 L65.4 89.6 L71.5 93 L55.4 93.4 Z" fill="url(#ry-sandal)"/>
    <path d="M55.4 93.4 L71.5 93 L71.6 94 L55.3 94.3 Z" fill="#2a1a0e"/>
    <path d="M58 90.4 L64.5 92" stroke="#5a4830" stroke-width=".55"/>

    <!-- OBI: the crimson sash, cinched at the narrowest part of him -->
    <path d="M42.5 58 Q50.5 61 60.5 58 L61.5 63.4 Q50.5 66.6 41.5 63.4 Z" fill="url(#ry-crimson)"/>
    <path d="M42.2 59.8 Q50.5 62.6 61 59.8" stroke="#a03030" stroke-width=".5" fill="none" opacity=".8"/>
    <path d="M55 61 Q58 64 57 69 L59.5 67.5 Q61 63 59 60.5 Z" fill="#7a2222"/>

    <!-- DO (cuirass): wide across the chest, drawn IN at the waist. This taper is the whole point -->
    <path d="M39.5 37 Q50 33.5 61.5 37 Q63.5 45 62.5 52 Q61.5 57 60.5 59.5 Q50.5 62.5 42.5 59.5 Q41 57 40 52 Q39 45 39.5 37 Z" fill="url(#ry-armor)"/>
    <path d="M40.4 41 Q50.5 44 61 41 L60.8 45 Q50.5 48 40.6 45 Z" fill="url(#ry-plate)" opacity=".55"/>
    <path d="M40.8 46.4 Q50.5 49.4 60.6 46.4 L60.3 50.4 Q50.5 53.4 41.1 50.4 Z" fill="url(#ry-plate)" opacity=".5"/>
    <path d="M41.3 51.8 Q50.5 54.8 60.1 51.8 L59.8 55.6 Q50.5 58.6 41.7 55.6 Z" fill="url(#ry-plate)" opacity=".45"/>
    <path d="M50.5 38 L50.5 60.5" stroke="#c04848" stroke-width=".8" opacity=".45"/>
    <path d="M44.5 40 L44.5 58 M56.5 40 L56.5 58" stroke="url(#ry-lace)" stroke-width=".4" opacity=".4"/>
    <path d="M45 43 L49 45 M45 48 L49 50 M45 53 L49 55 M52 43 L56 45 M52 48 L56 50 M52 53 L56 55" stroke="#a03030" stroke-width=".3" fill="none" opacity=".4"/>
    <circle cx="41.6" cy="43" r=".4" fill="#6a6a7a"/><circle cx="59.4" cy="43" r=".4" fill="#6a6a7a"/>
    <circle cx="42" cy="52" r=".4" fill="#6a6a7a"/><circle cx="59" cy="52" r=".4" fill="#6a6a7a"/>
    <path d="M44 46 L53 50" stroke="#555" stroke-width=".3" opacity=".35"/>

    <!-- SODE: a shoulder guard each side, the near one larger because it is nearer -->
    <path d="M35.5 36 Q33 39 34.5 44 L42 43 Q43 38.5 41.5 35.5 Z" fill="url(#ry-plate)"/>
    <path d="M35.2 38 L41.8 37.2 M34.9 40.6 L41.4 39.9" stroke="#c04848" stroke-width=".5" opacity=".8"/>
    <circle cx="38" cy="37.4" r=".35" fill="#6a6a7a"/><circle cx="37.6" cy="42" r=".35" fill="#6a6a7a"/>
    <path d="M59.5 35.5 Q63.5 38.5 65.5 45 L57.5 46.5 Q56.5 40 58 36 Z" fill="url(#ry-plate)"/>
    <path d="M59.4 38.4 L64.2 40.6 M59 41.4 L64.8 43.4" stroke="#c04848" stroke-width=".55" opacity=".8"/>
    <circle cx="61" cy="38.6" r=".38" fill="#6a6a7a"/><circle cx="61.8" cy="43.4" r=".38" fill="#6a6a7a"/>

    <!-- NECK and the shikoro flaring off the helmet -->
    <path d="M48 29.2 Q51.5 30.4 54.4 29.4 L54.6 34 Q51.4 35.4 48 34.2 Z" fill="url(#ry-skin)"/>
    <path d="M48.2 30.6 Q51.4 31.8 54.5 30.8" stroke="#8a7a62" stroke-width=".4" fill="none" opacity=".7"/>
    <path d="M46 31.5 Q50.5 34.5 56 31.5 L57 35.5 Q50.5 38.5 45 35.5 Z" fill="url(#ry-plate)" opacity=".75"/>

    <!-- HEAD: narrower than the shoulders now. Helmet x43-63 against a 35-65 shoulder span -->
    <path d="M44 20 Q44 12.5 51.5 11.5 Q60 11.5 62 18.5 Q63 24 62 27.5 L46 28.5 Q44 25 44 20 Z" fill="url(#ry-armor)"/>
    <path d="M49 12.4 L47.5 19 M53.5 11.7 L53.5 18.4 M58 12.8 L59.4 18.8" stroke="#2a2a34" stroke-width=".3" opacity=".5"/>
    <circle cx="48.5" cy="15" r=".35" fill="#6a6a7a"/><circle cx="53.5" cy="14.2" r=".35" fill="#6a6a7a"/><circle cx="58.3" cy="15.4" r=".35" fill="#6a6a7a"/>
    <!-- maedate crest -->
    <path d="M53.5 11.5 L51 4.5 Q53.5 3 56 4.8 Z" fill="url(#ry-crimson)"/>
    <path d="M52.8 9.2 L51.8 5.6 Q53.4 4.9 54.8 5.8 Z" fill="#d05050" opacity=".55"/>
    <!-- brim, swept to the facing side -->
    <path d="M41.5 20.5 Q47 18 54 17.8 Q61 18 65.5 20.5 Q62 22.6 54 21.8 Q46 22.4 41.5 20.5 Z" fill="url(#ry-plate)"/>
    <path d="M42.2 20.6 Q47.5 18.7 54 18.5 Q61 18.7 64.8 20.6" stroke="#888898" stroke-width=".3" fill="none" opacity=".8"/>
    <!-- mempo: the mask sits on the forward half of the face, because he is turned -->
    <path d="M47 23 Q46.5 27 48.5 29.5 L60.5 28.8 Q62.5 26 61.5 22.6 Z" fill="url(#ry-mask)"/>
    <path d="M54 23.2 L54.8 25 L55.8 23.2" stroke="#4a4a56" stroke-width=".7" fill="url(#ry-steel)"/>
    <path d="M49.5 28.2 Q54.5 30 60 28.2" stroke="#4a4a56" stroke-width=".45" fill="none"/>
    <path d="M49.4 26.2 L50.4 25.6 L51.4 26.2 L52.4 25.6 L53.4 26.2 L54.4 25.6 L55.4 26.2 L56.4 25.6 L57.4 26.2 L58.4 25.6 L59.4 26.2" stroke="#1a1a24" stroke-width=".45" fill="none"/>
    <path d="M50.4 25.8 v.9 M52.4 25.8 v.9 M54.4 25.8 v.9 M56.4 25.8 v.9 M58.4 25.8 v.9" stroke="#1a1a24" stroke-width=".28"/>
    <circle cx="51" cy="28" r=".35" fill="#1a1a24" opacity=".5"/><circle cx="53" cy="28.4" r=".35" fill="#1a1a24" opacity=".5"/>
    <circle cx="56.5" cy="28.4" r=".35" fill="#1a1a24" opacity=".5"/><circle cx="58.5" cy="28" r=".35" fill="#1a1a24" opacity=".5"/>
    <!-- eyes: both on the forward half, the far one shortened by the turn -->
    <rect x="48.4" y="22.2" width="3.6" height="1.9" rx=".8" fill="#1a0a0a"/><rect x="49.1" y="22.6" width="2.2" height="1" rx=".5" fill="url(#ry-glow)"/>
    <rect x="55.4" y="21.8" width="5" height="2" rx=".8" fill="#1a0a0a"/><rect x="56.2" y="22.3" width="3.2" height="1.1" rx=".5" fill="url(#ry-glow)"/>
    <circle cx="50.2" cy="23.1" r="1.9" fill="#c04848" opacity=".09"/><circle cx="57.8" cy="22.8" r="2.1" fill="#c04848" opacity=".1"/>
  </g>

  <!-- FRONT ARM: near elbow out and down, forearm back in to the high hand. Drawn after the body
       so it reads in front of the do, but before the katana so the blade sits over the knuckles. -->
  <g stroke="none">
    <path d="M59.6 39 L64.2 40 L66.6 50.8 L62 51.4 Z" fill="url(#ry-armor)"/>
    <path d="M62 51.4 L66.6 50.8 L59.4 40.2 L55.6 42 Z" fill="url(#ry-armor)"/>
    <path d="M60.8 43 L65.2 43.8 M61.4 47 L65.8 47.6" stroke="#58586a" stroke-width=".45" opacity=".5"/>
    <path d="M57.4 43 L60.6 44.8" stroke="#58586a" stroke-width=".4" opacity=".45"/>
  </g>

  <!-- KATANA: levelled straight out at the enemy at shoulder height. Drawn horizontally with no
       rotate at all - the blade IS the horizontal, which is the whole point of the pose. -->
  <g class="wpn">
    <path class="wpn" d="M59.5 36.8 Q78 35.8 92 36.4 Q94.5 37 96.5 38 L59.5 39.3 Z" fill="url(#ry-blade)"/>
    <path class="wpn" d="M60.5 37.4 Q78 36.6 91.6 37.2" stroke="#eef0f8" stroke-width=".4" fill="none" opacity=".75"/>
    <path class="wpn" d="M61 38.5 Q76 37.7 90 38 Q93 38.2 95 38.3" stroke="#e0e0ec" stroke-width=".4" fill="none" opacity=".45"/>
    <ellipse class="wpn" cx="58.6" cy="38" rx="1.5" ry="3.6" fill="#4a4a56"/>
    <ellipse class="wpn" cx="58.6" cy="38" rx=".8" ry="2.4" fill="none" stroke="#3a3a44" stroke-width=".3"/>
    <rect class="wpn" x="45.6" y="36.4" width="13" height="3.2" rx="1.1" fill="url(#ry-wrap)"/>
    <path class="wpn" d="M47 36.5 l1.4 3 M49.6 36.5 l1.4 3 M52.2 36.5 l1.4 3 M54.8 36.5 l1.4 3" stroke="#3a2020" stroke-width=".35"/>
    <rect class="wpn" x="44.4" y="36.2" width="1.6" height="3.6" rx=".6" fill="#3a3a44"/>
  </g>

  <!-- HANDS: carried in the katana's own rotate so the fingers wrap the tsuka squarely, but kept
       OUT of the class="wpn" group - that group is hidden wholesale when a gear weapon is racked,
       and his hands must not vanish with it. -->
  <g>
    <!-- front hand, at data-hand -->
    <g transform="translate(56.4 38)">
      <path d="M-2.6 -2.2 Q-2.6 -2.7 -2 -2.7 L1.9 -2.7 Q2.7 -2.7 2.7 -1.9 L2.7 1.9 Q2.7 2.7 1.9 2.7 L-2 2.7 Q-2.6 2.7 -2.6 2.2 Z" fill="url(#ry-skin)" stroke="#6e6049" stroke-width=".4"/>
      <path d="M-1.4 -2.5 V2.5 M.1 -2.6 V2.6 M1.5 -2.5 V2.5" stroke="#8a7a62" stroke-width=".36"/>
      <path d="M-2.4 -1.1 Q-3.5 0 -2.4 1.1" fill="url(#ry-skin)" stroke="#6e6049" stroke-width=".36"/>
    </g>
    <!-- back hand, further down the grip with daylight between the two -->
    <g transform="translate(48.6 38)">
      <path d="M-2.4 -2.1 Q-2.4 -2.6 -1.9 -2.6 L1.8 -2.6 Q2.5 -2.6 2.5 -1.8 L2.5 1.8 Q2.5 2.6 1.8 2.6 L-1.9 2.6 Q-2.4 2.6 -2.4 2.1 Z" fill="url(#ry-skin)" stroke="#6e6049" stroke-width=".4"/>
      <path d="M-1.2 -2.4 V2.4 M.2 -2.5 V2.5 M1.4 -2.4 V2.4" stroke="#8a7a62" stroke-width=".36"/>
      <path d="M-2.2 -1 Q-3.3 0 -2.2 1" fill="url(#ry-skin)" stroke="#6e6049" stroke-width=".36"/>
    </g>
  </g>
</svg>
