<?xml version="1.0" encoding="UTF-8"?>
<!-- Automaton X (Stray Banner, support, Heat) - Burizza art v2. A foundry-cast walking drone rather
     than a humanoid: a rounded triangular hull carried on four jointed legs, with a turret set in
     the face of it. Union livery - bare white plate, hazard yellow along the edges, black trim, and
     yellow banding down the shins where a foot might be stepped on.
     Facing right is read off two things: the right edge carries the lit yellow depth-face, and the
     turret barrel is run out east through that edge, past the hull silhouette. The barrel is the
     strongest facing cue on the model, which is why it sits high and clear of the legs.
     The far pair of legs is drawn first, desaturated and shortened, so the near pair reads in front
     of the hull rather than tangling with it at battlefield size.
     Canvas 100x100, faces right, feet on y=94. He carries no weapon in his look{}, so nothing here
     is marked class="wpn"; data-hand is kept at the hull's right shoulder so a RACKED weapon still
     has a grip to draw from (see syncHeldWeapon). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="66,58">
  <defs>
    <linearGradient id="ax-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".5" stop-color="#dde3ec"/><stop offset="1" stop-color="#9aa3b2"/></linearGradient>
    <linearGradient id="ax-yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe89a"/><stop offset=".4" stop-color="#f6c22e"/><stop offset="1" stop-color="#a87b0e"/></linearGradient>
    <linearGradient id="ax-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c424b"/><stop offset=".55" stop-color="#242930"/><stop offset="1" stop-color="#13161a"/></linearGradient>
    <linearGradient id="ax-limb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".48" stop-color="#ccd3dd"/><stop offset="1" stop-color="#868fa0"/></linearGradient>
    <linearGradient id="ax-limbFar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#99a1ae"/><stop offset="1" stop-color="#5e6572"/></linearGradient>
    <linearGradient id="ax-barrel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset=".42" stop-color="#b9c1cd"/><stop offset="1" stop-color="#6f7784"/></linearGradient>
    <radialGradient id="ax-lens" cx=".36" cy=".32" r=".72"><stop offset="0" stop-color="#fffbe4"/><stop offset=".28" stop-color="#ffe06b"/><stop offset=".62" stop-color="#c9930f"/><stop offset="1" stop-color="#14171b"/></radialGradient>
    <radialGradient id="ax-heat" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffeaa0" stop-opacity=".82"/><stop offset=".55" stop-color="#f6c22e" stop-opacity=".3"/><stop offset="1" stop-color="#d99b0f" stop-opacity="0"/></radialGradient>
    <filter id="ax-glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="ax-glow-sm" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation=".8"/></filter>
  </defs>

  <!-- ground shadow, and the heat he sheds onto it -->
  <ellipse cx="50" cy="93.6" rx="26" ry="3.4" fill="#000" opacity=".34"/>
  <ellipse cx="50" cy="92.6" rx="12" ry="2" fill="#f6c22e" opacity=".2" filter="url(#ax-glow)"/>

  <!-- ===== FAR PAIR. Behind the hull, dimmer and a little shorter, so depth reads instantly. ===== -->
  <g stroke="#13161a" stroke-width=".7" stroke-linejoin="round">
    <!-- far left -->
    <path d="M46 52 L42 51 L34.5 59 L38.5 61.5 Z" fill="url(#ax-limbFar)"/>
    <circle cx="36" cy="60" r="2.6" fill="#2a2f37" stroke="none"/>
    <path d="M34 58.5 L38 61 L32.5 84 L29.8 83.4 Z" fill="url(#ax-limbFar)"/>
    <path d="M29.8 83.4 L32.5 84 L31.4 89.5 L28.6 88.8 Z" fill="#1b1f25" stroke="none"/>
    <!-- far right -->
    <path d="M54 52 L58 51 L65.5 59 L61.5 61.5 Z" fill="url(#ax-limbFar)"/>
    <circle cx="64" cy="60" r="2.6" fill="#2a2f37" stroke="none"/>
    <path d="M66 58.5 L62 61 L67.5 84 L70.2 83.4 Z" fill="url(#ax-limbFar)"/>
    <path d="M70.2 83.4 L67.5 84 L68.6 89.5 L71.4 88.8 Z" fill="#1b1f25" stroke="none"/>
  </g>

  <!-- ===== COLLAR. Segmented dark ring under the hull, with the yellow slot band around it. ===== -->
  <path d="M33 47 L67 47 Q69 47 68.6 49.2 L67.6 54 L32.4 54 L31.4 49.2 Q31 47 33 47 Z" fill="url(#ax-dark)" stroke="#13161a" stroke-width=".7" stroke-linejoin="round"/>
  <path d="M38 47.4 v6.2 M44 47.4 v6.2 M50 47.4 v6.2 M56 47.4 v6.2 M62 47.4 v6.2" stroke="#4a515b" stroke-width=".55" fill="none" opacity=".8"/>
  <!-- yellow slot band -->
  <path d="M32.6 54 L67.4 54 Q68 54 67.8 55.6 L67.2 59.2 Q67.1 60 66.2 60 L33.8 60 Q32.9 60 32.8 59.2 L32.2 55.6 Q32 54 32.6 54 Z" fill="url(#ax-yellow)" stroke="#13161a" stroke-width=".7" stroke-linejoin="round"/>
  <path d="M37 55.6 l-.6 2.8 M42.2 55.6 l-.6 2.8 M47.4 55.6 l-.6 2.8 M52.6 55.6 l-.6 2.8 M57.8 55.6 l-.6 2.8 M63 55.6 l-.6 2.8"
        stroke="#1b1f25" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".85"/>
  <!-- underside plate, catching a little light -->
  <path d="M35.5 60 L64.5 60 Q65 60 64.6 61.4 L63.6 63.4 Q63.3 64 62.6 64 L37.4 64 Q36.7 64 36.4 63.4 L35.4 61.4 Q35 60 35.5 60 Z" fill="url(#ax-shell)" stroke="#13161a" stroke-width=".7" stroke-linejoin="round"/>

  <!-- ===== HULL. Rounded triangle, apex up. ===== -->
  <path d="M50 12.5 Q52.6 12.5 53.9 14.8 L70.8 44.2 Q72.1 46.5 69.4 46.5 L30.6 46.5 Q27.9 46.5 29.2 44.2 L46.1 14.8 Q47.4 12.5 50 12.5 Z"
        fill="url(#ax-shell)" stroke="#13161a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- right edge: the lit depth-face, yellow. This is what turns him east. -->
  <path d="M53.9 14.8 L70.8 44.2 Q72.1 46.5 69.4 46.5 L63.8 46.5 L49.2 19.2 Z" fill="url(#ax-yellow)" stroke="#13161a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M51.6 18.8 L65.6 45" stroke="#13161a" stroke-width="1.1" fill="none" opacity=".75" stroke-linecap="round"/>
  <!-- left edge: black band with a hot sliver along it -->
  <path d="M46.1 14.8 L29.2 44.2 Q27.9 46.5 30.6 46.5 L35.4 46.5 L49 19.6 Z" fill="url(#ax-dark)" stroke="#13161a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M46.4 17.6 L33.6 40.4" stroke="#ffe89a" stroke-width=".9" fill="none" opacity=".75" stroke-linecap="round"/>
  <!-- bottom rail -->
  <path d="M31.6 43.4 L68.4 43.4 L69.4 45.2 Q70 46.5 68.6 46.5 L31.4 46.5 Q30 46.5 30.6 45.2 Z" fill="url(#ax-dark)" stroke="#13161a" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M34 44.6 h32" stroke="#f6c22e" stroke-width=".8" opacity=".8" stroke-linecap="round"/>

  <!-- stencilled markings: a code block and two caution ticks, left of the turret. -->
  <path d="M38.4 38.4 h1 v3 h-1 Z M40 38.4 h.5 v3 h-.5 Z M41.2 38.4 h1.2 v3 h-1.2 Z M43 38.4 h.5 v3 h-.5 Z" fill="#4a515b" opacity=".9"/>
  <path d="M38 28.6 h4.2 M38 30.4 h2.8" stroke="#8d95a2" stroke-width=".55" opacity=".8" stroke-linecap="round"/>

  <!-- ===== TURRET. A drum sunk into the hull face with the barrel run out east, clearing the
       right edge so it breaks the silhouette. Drawn barrel-first so the drum laps over its root. -->
  <ellipse cx="54" cy="32.6" rx="12" ry="10" fill="#f6c22e" opacity=".13" filter="url(#ax-glow)"/>
  <!-- barrel -->
  <path d="M57.5 29.9 L77.2 28.9 L78.4 30.3 L78.4 34.7 L77.2 36.1 L57.5 35.1 Z" fill="url(#ax-barrel)" stroke="#13161a" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M60 31.2 L76 30.4" stroke="#f4f7fa" stroke-width=".65" opacity=".75" stroke-linecap="round"/>
  <path d="M68.6 29.3 v6.2" stroke="#13161a" stroke-width=".55" opacity=".45"/>
  <!-- muzzle brake -->
  <path d="M76.4 27.8 L80.4 27.6 L81 29 L81 36 L80.4 37.4 L76.4 37.2 Z" fill="url(#ax-dark)" stroke="#13161a" stroke-width=".85" stroke-linejoin="round"/>
  <path d="M77.6 30.2 h3 M77.6 34.6 h3" stroke="#4a515b" stroke-width=".6" stroke-linecap="round"/>
  <circle cx="79.8" cy="32.4" r="1.4" fill="#0f1215"/>
  <!-- mantlet: the shoulder the barrel pivots in -->
  <path d="M55.4 27.9 L60.2 28.8 L60.2 36.2 L55.4 37.1 Z" fill="url(#ax-dark)" stroke="#13161a" stroke-width=".85" stroke-linejoin="round"/>
  <!-- drum -->
  <circle cx="51.4" cy="32.5" r="7.6" fill="url(#ax-dark)" stroke="#13161a" stroke-width="1"/>
  <circle cx="51.4" cy="32.5" r="7.6" fill="none" stroke="#f6c22e" stroke-width=".9" opacity=".8"/>
  <circle cx="51.4" cy="32.5" r="5.3" fill="#0f1215" stroke="#4a515b" stroke-width=".5"/>
  <!-- sighting aperture, still lit -->
  <circle cx="51.4" cy="32.5" r="2.7" fill="url(#ax-lens)"/>
  <circle cx="50.5" cy="31.5" r=".85" fill="#fffbe4" opacity=".95"/>
  <circle cx="51.4" cy="32.5" r="4.4" fill="url(#ax-heat)" filter="url(#ax-glow-sm)"/>
  <!-- traverse bolts around the drum -->
  <circle cx="51.4" cy="25.6" r=".7" fill="#4a515b"/><circle cx="51.4" cy="39.4" r=".7" fill="#4a515b"/>
  <circle cx="45.1" cy="32.5" r=".7" fill="#4a515b"/>

  <!-- ===== NEAR PAIR. Brighter, longer, drawn over the hull. ===== -->
  <g stroke="#13161a" stroke-width=".8" stroke-linejoin="round">
    <!-- near left -->
    <path d="M43 55 L38.6 53.6 L25.4 64.2 L30.2 67.8 Z" fill="url(#ax-limb)"/>
    <path d="M39.4 56.2 L29.6 64.2" stroke="#8d95a2" stroke-width=".6" fill="none" opacity=".8"/>
    <circle cx="27.6" cy="66" r="3.3" fill="#2a2f37" stroke="#13161a" stroke-width=".7"/>
    <circle cx="27.6" cy="66" r="1.2" fill="#f6c22e" stroke="none"/>
    <path d="M25 64 L30 67.8 L21.4 89.6 L17.6 88.4 Z" fill="url(#ax-limb)"/>
    <!-- hazard banding down the shin -->
    <path d="M23.6 76.6 L27.8 79.4 L26.8 82 L22.6 79.2 Z" fill="#f6c22e"/>
    <path d="M22.4 82.2 L26.4 84.9 L25.6 87.2 L21.6 84.5 Z" fill="#13161a"/>
    <path d="M17.6 88.4 L21.4 89.6 L19.8 94 L16.2 92.8 Z" fill="#1b1f25" stroke="none"/>
    <!-- near right -->
    <path d="M57 55 L61.4 53.6 L74.6 64.2 L69.8 67.8 Z" fill="url(#ax-limb)"/>
    <path d="M60.6 56.2 L70.4 64.2" stroke="#8d95a2" stroke-width=".6" fill="none" opacity=".8"/>
    <circle cx="72.4" cy="66" r="3.3" fill="#2a2f37" stroke="#13161a" stroke-width=".7"/>
    <circle cx="72.4" cy="66" r="1.2" fill="#f6c22e" stroke="none"/>
    <path d="M75 64 L70 67.8 L78.6 89.6 L82.4 88.4 Z" fill="url(#ax-limb)"/>
    <path d="M76.4 76.6 L72.2 79.4 L73.2 82 L77.4 79.2 Z" fill="#f6c22e"/>
    <path d="M77.6 82.2 L73.6 84.9 L74.4 87.2 L78.4 84.5 Z" fill="#13161a"/>
    <path d="M82.4 88.4 L78.6 89.6 L80.2 94 L83.8 92.8 Z" fill="#1b1f25" stroke="none"/>
  </g>
</svg>
