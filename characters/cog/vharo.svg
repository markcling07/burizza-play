<?xml version="1.0" encoding="UTF-8"?>
<!-- Vharo (Cogbound, ranged, Light) - Burizza art v3. A faceless light-channeler in spiked sage
     plate and a billowing robe, floating, one clawed hand flung forward to loose his blades. The
     red blades of light are his Force, not a held weapon, so nothing here is class="wpn": a racked
     weapon draws at data-hand and the blades stay. Canvas 100x100, faces right, feet near y=94. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" data-hand="64,46">
  <defs>
    <linearGradient id="vh-helm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ece0"/><stop offset=".55" stop-color="#b6ceb6"/><stop offset="1" stop-color="#8aa98d"/></linearGradient>
    <linearGradient id="vh-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bcd3bc"/><stop offset=".55" stop-color="#90ad92"/><stop offset="1" stop-color="#6b8a6f"/></linearGradient>
    <linearGradient id="vh-plated" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9d82"/><stop offset="1" stop-color="#4f6b54"/></linearGradient>
    <linearGradient id="vh-brown" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#836f52"/><stop offset=".6" stop-color="#5c4b36"/><stop offset="1" stop-color="#3b2f22"/></linearGradient>
    <linearGradient id="vh-sage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aec3a6"/><stop offset=".6" stop-color="#8aa283"/><stop offset="1" stop-color="#637c5f"/></linearGradient>
    <linearGradient id="vh-cape" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8aa384"/><stop offset=".6" stop-color="#63795d"/><stop offset="1" stop-color="#3f5039"/></linearGradient>
    <linearGradient id="vh-red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e65a4e"/><stop offset=".7" stop-color="#cf362d"/><stop offset="1" stop-color="#9d211c"/></linearGradient>
    <radialGradient id="vh-rune" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8b7a" stop-opacity=".95"/><stop offset=".5" stop-color="#e0564e" stop-opacity=".8"/><stop offset="1" stop-color="#e0564e" stop-opacity="0"/></radialGradient>
    <filter id="vh-glow" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- floating shadow, scratched onto the ground -->
  <g stroke="none" stroke-width="1.1" stroke-linecap="round" opacity=".5">
    <path d="M34 95.5 L62 95.5 M37 97 L58 97 M41 94 L55 94"/></g>

  <!-- RED BLADES streaking past behind him, points leading toward the enemy (right) -->
  <g stroke="#7e1a16" stroke-width=".6" stroke-linejoin="round">
    <g transform="translate(18 20) rotate(-7)">
      <path d="M-5 -1.5 L38 -1.5 L46 0 L38 1.5 L-5 1.5 Z" fill="url(#vh-red)" opacity=".55" filter="url(#vh-glow)" stroke="none"/>
      <path d="M-5 -1 L38 -1 L44 0 L38 1 L-5 1 Z" fill="url(#vh-red)"/>
      <rect x="-6" y="-3" width="2" height="6" rx=".5" fill="#c23128"/>
      <rect x="-9" y="-1.1" width="3.5" height="2.2" rx=".8" fill="#8f1f1a"/></g>
    <g transform="translate(13 48) rotate(3)">
      <path d="M-5 -1 L52 -1 L58 0 L52 1 L-5 1 Z" fill="url(#vh-red)" opacity=".55" filter="url(#vh-glow)" stroke="none"/>
      <path d="M-5 -1 L52 -1 L57 0 L52 1 L-5 1 Z" fill="url(#vh-red)"/>
      <rect x="-6" y="-3" width="2" height="6" rx=".5" fill="#c23128"/>
      <rect x="-9" y="-1.1" width="3.5" height="2.2" rx=".8" fill="#8f1f1a"/></g>
  </g>

  <!-- cape, blown off the shoulders to his back (left) -->
  <g stroke="none" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M46 37 C33 41 23 59 15 85 Q21 82 26 86 Q30 81 35 85 C33 68 39 52 49 45 Z" fill="url(#vh-cape)"/>
    <path d="M35 84 C33 70 38 56 45 48" fill="none" stroke-width="1"/>

    <!-- robe: two-tone, brown on the near side, sage swept to the far side -->
    <path d="M42 55 Q39 73 32 90 Q50 95 68 90 Q62 73 60 55 Q50 59 42 55 Z" fill="url(#vh-sage)"/>
    <path d="M42 55 Q39 73 32 90 Q41 92.5 50 92.5 L50 57 Q46 58 42 55 Z" fill="url(#vh-brown)"/>
    <path d="M32 90 Q36 87 39 92 Q43 88 46 93 Q50 90 54 93 Q58 88 61 92 Q65 87 68 90" fill="none" stroke-width="1"/>
    <!-- pointed wrapped feet dangling below the hem -->
    <path d="M45 90 L43 97 L46.5 94 L48 97.5 L49 90 Z" fill="#2c2420"/>
    <path d="M53 90.5 L52 97 L55 94.5 L57 97 L57.5 90.5 Z" fill="#241d1a"/>

    <!-- waist cinch -->
    <path d="M41 52 Q50 56 61 52 L61 57 Q50 61 41 57 Z" fill="#372f27"/>

    <!-- cuirass: layered sage plate -->
    <path d="M43 36 Q51 33 59 37 L61 53 Q50 57 41 53 Z" fill="url(#vh-plate)"/>
    <path d="M42.5 42 Q51 45 60.5 42 M42.8 47 Q51 50 60.2 47" fill="none" stroke-width="1"/>
    <path d="M51 35 L51 53" fill="none" stroke-width=".9"/>

    <!-- back (left) arm, hanging along the body with a clawed gauntlet -->
    <path d="M43 40 Q38 47 39 55 L43.5 55 Q43 48 46.5 43 Z" fill="url(#vh-plated)"/>
    <path d="M38.5 54 Q37.5 59 39.5 61 L43.5 60 Q43 56 43.5 54 Z" fill="url(#vh-plate)"/>
    <path d="M38.8 60.5 l-1.5 3 M40.5 61 l0 3.2 M42.3 60.8 l1.3 2.8" fill="none" stroke-width="1.1"/>

    <!-- back (left) pauldron, spiked -->
    <path d="M38 34 l1.5 -4 l2 4 M42 33 l1.5 -4.5 l2 4.5" fill="#6b8a6f" stroke-width="1"/>
    <path d="M37 37 Q40 31 46 34 Q47 40 42 42 Q38 41 37 37 Z" fill="url(#vh-plated)"/>

    <!-- front (right) pauldron, spiked, gold-less sage plate -->
    <path d="M56 33 l1.5 -4.5 l2 4.5 M60 33 l1.8 -4.8 l2 4.8 M64 35 l1.5 -4 l1.8 4" fill="#7f9d82" stroke-width="1"/>
    <path d="M55 37 Q62 31 69 36 Q70 42 63 43 Q57 42 55 39 Z" fill="url(#vh-plate)"/>
    <path d="M57 38 Q62 35 67 38" fill="none" stroke-width=".9"/>

    <!-- front (right) arm, flung forward to loose the blades -->
    <path d="M58 39 L71 43 L70 48 L58 44 Z" fill="url(#vh-plate)"/>
    <path d="M61 41.4 l1 3.2 M64 42.3 l.8 3.2 M67 43.2 l.7 3" fill="none" stroke-width="1"/>
    <path d="M69 42.5 Q75 42.5 77 45 Q76 48.5 72 48 Q69.5 47 69 45 Z" fill="url(#vh-plate)"/>
    <!-- pointing claw, index finger extended -->
    <path d="M75.5 44.4 L83 42.6 L83.6 44.2 L76 46 Z" fill="url(#vh-plate)"/>
    <path d="M83 42.9 l2.2 -.4 l-1.6 1.6 Z" fill="#2a241f" stroke="none"/>
    <path d="M74 46.5 Q77 47 79 46 M74.5 47.6 Q76.5 48 78 47.3" fill="none" stroke-width=".9"/>

    <!-- helm: smooth, faceless, with a swept crown spike -->
    <path d="M50.5 15 Q48 8 52.5 6 Q54 10.5 55 14 Z" fill="url(#vh-plated)"/>
    <path d="M44 28 Q43 15 53 14 Q62 15 63.5 24.5 Q64.5 30 60 31.5 Q60 33.5 56 33.5 L49 33.5 Q44.5 32.5 44 28 Z" fill="url(#vh-helm)"/>
    <!-- a couple of small scale-spikes on the back of the helm -->
    <path d="M45 22 l-3 -1.5 l2.6 3 M45.5 27 l-3.2 -.6 l2.8 2.6" fill="#8aa98d" stroke-width=".8"/>

    <!-- neck gorget -->
    <path d="M49 33 L57 33 L56 37 L50 37 Z" fill="url(#vh-plated)"/>
  </g>

  <!-- visor: a single dark frown, the only feature on the face -->
  <path d="M49.5 25.5 Q54 23.5 59 26" stroke="none" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M55.5 20.5 Q59 20 61.5 22" stroke="none" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- RED RUNE-HAND: a red bloom on the belly, a clawed hand pushing out of it -->
  <ellipse cx="50" cy="66" rx="12" ry="10" fill="url(#vh-rune)"/>
  <g stroke="#7e1a16" stroke-width=".7" stroke-linejoin="round">
    <path d="M46.5 61 Q50 59.5 53.5 61 L54.5 68 Q53.5 72.5 50 72.5 Q46.5 72.5 45.5 68 Z" fill="#cf362d"/>
    <path d="M47.5 62.5 L47 72 M50 61 L50 73 M52.5 62.5 L53 72" fill="none" stroke="#8f1f1a" stroke-width=".7"/>
    <path d="M46 69.5 l-1.4 3.2 M48 72 l-.4 3 M50 72.6 l0 3.2 M52 72 l.5 3 M54 69.5 l1.4 3.2" fill="none" stroke="#9d211c" stroke-width="1"/>
  </g>

  <!-- RED BLADE crossing the robe in front, and the bright spark at the fingertip -->
  <g stroke="#7e1a16" stroke-width=".6" stroke-linejoin="round">
    <g transform="translate(40 58) rotate(58)">
      <path d="M-5 -1.2 L40 -1.2 L47 0 L40 1.2 L-5 1.2 Z" fill="url(#vh-red)" opacity=".5" filter="url(#vh-glow)" stroke="none"/>
      <path d="M-5 -1 L40 -1 L45 0 L40 1 L-5 1 Z" fill="url(#vh-red)"/>
      <rect x="-6" y="-3" width="2" height="6" rx=".5" fill="#c23128"/>
      <rect x="-9" y="-1.1" width="3.5" height="2.2" rx=".8" fill="#8f1f1a"/></g>
    <g transform="translate(26 32) rotate(-5)">
      <path d="M-5 -1 L46 -1 L52 0 L46 1 L-5 1 Z" fill="url(#vh-red)" opacity=".5" filter="url(#vh-glow)" stroke="none"/>
      <path d="M-5 -1 L46 -1 L51 0 L46 1 L-5 1 Z" fill="url(#vh-red)"/>
      <rect x="-6" y="-2.8" width="2" height="5.6" rx=".5" fill="#c23128"/>
      <rect x="-9" y="-1" width="3.5" height="2" rx=".8" fill="#8f1f1a"/></g>
  </g>

  <!-- the spark off the pointing claw, and red motes scattered in the air -->
  <path d="M86 44 l1.4 -4.6 l1.2 4.6 l4.4 -1.2 l-3.6 2.2 l3.6 2.2 l-4.4 -1.2 l-1.2 4.6 l-1.4 -4.6 l-4.4 1.2 l3.4 -2.2 l-3.4 -2.2 Z" fill="#e24a3f" stroke="#9d211c" stroke-width=".5" stroke-linejoin="round"/>
  <g fill="#d83c33">
    <circle cx="80" cy="34" r="1.3"/><circle cx="90" cy="54" r="1"/><circle cx="83" cy="56" r=".8"/>
    <path d="M30 24 q1.6 1.4 0 3 q-1.6 -1.6 0 -3 Z"/><path d="M22 44 q1.6 1.4 0 3 q-1.6 -1.6 0 -3 Z"/><circle cx="34" cy="30" r=".9"/>
  </g>
</svg>
