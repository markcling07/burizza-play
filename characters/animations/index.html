<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burizza Animations</title>
<style>
/* Rigged idle + attack GIFs for every hero, grouped by faction in a wrapping grid.
   Heroes without GIFs yet are hidden. ?f=mech shows one faction only. */
:root { --bg: #1b1e2b; --card: #1e2232; --line: #2c3146; --muted: #8e8aa2; color-scheme: dark; }
html, body { margin: 0; background: var(--bg); color: var(--muted); font: 600 12px/1.4 "Segoe UI", system-ui, sans-serif; }
.wrap { padding: 12px 16px 24px; display: grid; gap: 14px; }
h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
[hidden] { display: none !important; }
.grid { display: flex; flex-wrap: wrap; gap: 8px; }
.card { display: flex; align-items: end; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.card img { display: block; height: 120px; width: auto; }
</style>
</head>
<body>
<div class="wrap" id="list"></div>
<script>
const FACTIONS = {
  human: ['Kingdom of Aldmere', ['wren', 'garrick', 'mara', 'aldous', 'liesl']],
  mech: ['Ironclad Union', ['bulwark', 'sawtooth', 'arclight', 'howitzer', 'patchwork']],
  orc: ['Bloodtusk Horde', ['krug', 'mogra', 'vashka', 'drekka', 'hesk']],
  stoneleaf: ['Stoneleaf Accord', ['durgan', 'hilda', 'aelira', 'faelan', 'elowen']],
  tideborn: ['The Tideborn', ['tharos', 'grubble', 'seraphine', 'octavia', 'maren']],
  crimson: ['The Crimson Court', ['vesper', 'malgrath', 'seraxa', 'gorehound', 'morwenna']],
};
const only = new URLSearchParams(location.search).get('f');
const v = Date.now();
const list = document.getElementById('list');
list.innerHTML = Object.entries(FACTIONS).filter(([k]) => !only || k === only).map(([k, [name, ids]]) => `
  <section data-f="${k}" hidden>
    <h2>${name}</h2>
    <div class="grid">${ids.map((id) => `<div class="card" hidden>
      <img src="${id}-idle.gif?v=${v}" alt="${id} idle"><img src="${id}-attack.gif?v=${v}" alt="${id} attack">
    </div>`).join('')}</div>
  </section>`).join('');
// Reveal a card (and its faction) once its idle GIF loads.
list.querySelectorAll('.card').forEach((card) => {
  const img = card.querySelector('img');
  const show = () => { card.hidden = false; card.closest('section').hidden = false; };
  if (img.complete && img.naturalWidth) show();
  else img.addEventListener('load', show);
});
</script>
</body>
</html>
