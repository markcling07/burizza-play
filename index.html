/* ==================================================================
   SKILL LOADOUT — what each champion brings into battle.
   Slots grow with level: 2 active + 1 passive at first, then
   Lv 5 → 3rd active, Lv 10 → 2nd passive, Lv 15 → 4th active.
   Attack and Guard are always available and never use a slot.
   Pool: the champion's 5 actives (skill a, ★ signature b, then c, d and e) — 6 for the few who
   carry an extra ('f'; see activeIdsOf) —
   the neutral skills below (class-free actives anyone can learn),
   their own passive ('own'), their alternative own passive if they have one ('alt'), and the generic passives below.
   You pick your champion's loadout; recruits and enemies auto-pick.
   ================================================================== */
const SLOT_UNLOCKS = [{ lv: 5, kind: 'act' }, { lv: 10, kind: 'pas' }, { lv: 15, kind: 'act' }];
const activeSlots = (lv) => 2 + SLOT_UNLOCKS.filter((s) => s.kind === 'act' && lv >= s.lv).length;
const passiveSlots = (lv) => 1 + SLOT_UNLOCKS.filter((s) => s.kind === 'pas' && lv >= s.lv).length;
// a = first skill, b = ★ signature, c/d/e = the rest. Five to pick from, four slots at most,
// so from Lv 15 the last one is a real choice rather than a formality.
// A champion may carry a sixth, 'f' (Malgrath's Blood Pact, Morwenna's Blood Ward); it widens the
// pool to choose from without widening the slots. activeIdsOf is the pool for a given champion —
// use it rather than ACTIVE_IDS wherever the champion is known.
const ACTIVE_IDS = ['a', 'b', 'c', 'd', 'e'];
const SIXTH_ID = 'f';
// Beyond the five: 'f' for a sixth skill, 'g' for a seventh (Barrow's Burrow). Same rule — they widen
// the pool to choose from, never the slots.
const EXTRA_IDS = [SIXTH_ID, 'g'];
const activeIdsOf = (c) => (c && c.skills.length > 5 ? [...ACTIVE_IDS, ...EXTRA_IDS.slice(0, c.skills.length - 5)] : ACTIVE_IDS);
// Neutral skills: class-free actives any champion can equip in an active slot.
// Kept modest on purpose — utility that rounds out a kit, never outshines one.
const NEUTRAL_SKILLS = {
  soullink:    B('Soul Link', 'Link an ally for 3 turns: a third of the damage they take from hits is divided among their teammates.', 4, 'ally', [['link', 4]], { mp: 20, aiTarget: 'lowest' }),
  firstaid:    H('First Aid', 'A quick field dressing: a small heal for an ally.', 3, 1.2, { mp: 20 }),
  flashpowder: D('Flash Powder', '60% hit. Blinds the target for 2 turns.', 3, 0.6, { mp: 25, fx: [['blind', 3]] }),
  smokebomb:   B('Smoke Bomb', 'Vanish in smoke: attacks that can miss will miss you until your next turn.', 5, 'self', [['evade', 1]], { mp: 25 }),
  throwingaxe: D('Throwing Axe', 'A hurled axe for 110%.', 2, 1.1, { mp: 20 }),
  lowblow:     D('Low Blow', '80% hit with a 35% chance to Stagger.', 3, 0.8, { mp: 20, chanceFx: [['stagger', 1, 0.35]] }),
  scattershot: D('Scattershot', '50% to all enemies.', 4, 0.5, { mp: 25, aoe: true }),
  caltrops:    D('Caltrops', '35% to all enemies and Slows them.', 5, 0.35, { mp: 25, aoe: true, fx: [['slow', 2]] }),
  battlecry:   B('Battle Cry', 'Bellow a challenge: deal 30% more damage for 2 turns.', 4, 'self', [['empower', 3]], { mp: 20 }),
  wardingcharm: B('Warding Charm', 'An ally resists new debuffs for 2 turns.', 4, 'ally', [['immune', 3]], { mp: 20, aiTarget: 'debuffed' }),
  demoralize:  D('Demoralize', '60% hit. Weakens the target for 2 turns.', 3, 0.6, { mp: 25, fx: [['weaken', 3]] }),
  armorcrack:  D('Armor Crack', '70% hit. Sunders armor: −40% defense for 2 turns.', 4, 0.7, { mp: 25, fx: [['sunder', 3]] }),
  // Provoke: a taunt that lasts for a number of attacks rather than turns (o.charges, see markAttacked).
  provoke:     B('Provoke', 'You or an ally taunts every enemy for the next 2 attacks against them.', 4, 'ally', [['provoke', 99]], { mp: 20, charges: 2, aiTarget: 'tank' }),
};
const NEUTRAL_KEYS = Object.keys(NEUTRAL_SKILLS);
// Generic passives anyone can equip. `stat` bonuses are applied in makeUnit.
const GENERIC_PASSIVES = {
  toughness:  P('Toughness', '+12% max HP.', { stat: { hpPct: 0.12 } }),
  might:      P('Might', '+10% Attack.', { stat: { atkPct: 0.1 } }),
  swiftness:  P('Swiftness', '+2 Agility: more turns and a little more dodge.', { stat: { agi: 2 } }),
  keenedge:   P('Keen Edge', '+8% critical hit chance.', { stat: { crit: 0.08 } }),
  deepwell:   P('Deep Well', '+25 max MP and +3 MP every turn. No effect on Ironclad champions, who have no mana.', { stat: { mp: 25, mpRegen: 3 } }),
  secondwind: P('Second Wind', 'Recover an extra 2% of max HP every turn.', { stat: { hpRegenPct: 0.02 } }),
  hallucinate: P('Hallucinate', 'Enemies that single them out have a 25% chance to lash out at a different target instead — even one of their own.', { hallucinate: 0.25 }),
  finisher:    P('Finisher', 'Deals 15% more damage to enemies below half HP.', { execute: { below: 0.5, bonus: 0.15 } }),
  spikedcloak: P('Spiked Cloak', 'When hit, 20% chance the attacker starts Bleeding.', { onHitTaken: { chance: 0.2, fx: [['bleed', 3, 0.2]] } }),
};
const GENERIC_KEYS = Object.keys(GENERIC_PASSIVES);
// A champion may offer more than one alternative own passive: passiveAlt can be a single P or an
// array of them. They take loadout ids 'alt', 'alt2', 'alt3'… — 'alt' stays index 0 so older
// saves keep the choice they made.
const altList = (c) => (c && c.passiveAlt ? (Array.isArray(c.passiveAlt) ? c.passiveAlt : [c.passiveAlt]) : []);
const altId = (i) => (i === 0 ? 'alt' : `alt${i + 1}`);
const altIndex = (id) => (id === 'alt' ? 0 : /^alt\d+$/.test(id) ? +id.slice(3) - 1 : -1);
const passiveById = (c, id) => (id === 'own' ? c.passive : altIndex(id) >= 0 ? altList(c)[altIndex(id)] : GENERIC_PASSIVES[id]);
const passivePool = (c) => ['own', ...altList(c).map((_, i) => altId(i)), ...GENERIC_KEYS];
const activeById = (c, id) => NEUTRAL_SKILLS[id] || c.skills[{ a: 0, b: 1, c: 2, d: 3, e: 4, f: 5, g: 6 }[id]];

/* THE TRAINING YARD — a neutral skill or a learned passive is a technique, and a champion has to
   drill at the yard before they can carry one into battle. Each technique takes a few drills; the
   gold pays for Serel's time and a morning of bruises. Mastering one both unlocks it and earns a
   skill point, so the yard feeds the ranks you spend on the Skills screen.
   A champion's own kit — their five skills and their own passive — never needs drilling: that is
   what they already are. Recruits and enemies auto-pick and are never gated by your training. */
const TRAIN_HEAVY = new Set(['soullink', 'scattershot', 'caltrops', 'armorcrack', 'deepwell', 'finisher', 'spikedcloak', 'hallucinate']);
const trainNeed = (id) => (TRAIN_HEAVY.has(id) ? 4 : 3);    // drills to master
const trainFee = (id) => (TRAIN_HEAVY.has(id) ? 80 : 50);   // gold per drill
const TRAINABLE = [...NEUTRAL_KEYS, ...GENERIC_KEYS];
const isTrainable = (id) => TRAINABLE.includes(id);
const drillsDone = (cid, id) => profile.training?.[cid]?.[id] || 0;
// Anything that isn't a technique (own skills, own passive, Attack and Guard) is always ready.
const isTrained = (cid, id) => !isTrainable(id) || drillsDone(cid, id) >= trainNeed(id);
const masteredCount = (cid) => TRAINABLE.filter((id) => drillsDone(cid, id) >= trainNeed(id)).length;

// One morning's drill. Returns null if it can't happen, else how the session went.
function drill(id) {
  const cid = profile.hero?.id;
  if (!cid || !isTrainable(id) || isTrained(cid, id) || profile.gold < trainFee(id)) return null;
  profile.gold -= trainFee(id);
  if (!profile.training) profile.training = {};
  const t = (profile.training[cid] = profile.training[cid] || {});
  t[id] = (t[id] || 0) + 1;
  saveProfile();
  return { mastered: isTrained(cid, id), left: trainNeed(id) - t[id] };
}

/* Saves made before the yard opened keep everything they already carry: every technique in the
   loadout that champion was using counts as mastered, so nobody loses a skill they fought with. */
function grandfatherTraining() {
  const cid = profile.hero?.id, c = cid && charById(cid);
  if (!c || profile.trainedLegacy) return;
  const was = profile.loadout || autoLoadout(c, heroLevel());
  if (!profile.training) profile.training = {};
  const t = (profile.training[cid] = profile.training[cid] || {});
  for (const id of [...was.act, ...was.pas]) if (isTrainable(id)) t[id] = Math.max(t[id] || 0, trainNeed(id));
  profile.trainedLegacy = true;
  saveProfile();
}

// Recruits and enemies: skill, ★ signature, then second skill as slots allow; their own passive,
// plus a role-fitting generic once a second passive slot opens.
function autoLoadout(c, lv) {
  const pas = ['own'];
  if (passiveSlots(lv) > 1) pas.push(c.role === 'melee' ? 'toughness' : c.role === 'ranged' ? 'keenedge' : MANA.pool[c.faction] ? 'deepwell' : 'secondwind');
  // A sixth skill would never be reached by taking the pool in order, so for the champions who
  // carry one it takes the last slot. Otherwise only your own hero would ever bring it to a fight.
  const act = ACTIVE_IDS.slice(0, activeSlots(lv));
  if (c.skills[5] && act.length > 2) act[act.length - 1] = SIXTH_ID;
  // ...and a seventh (Barrow's Burrow) takes the slot before it once a fourth slot opens.
  if (c.skills[6] && act.length > 3) act[act.length - 2] = EXTRA_IDS[1];
  return { act, pas };
}

/* Loadouts for your warband. Your champion's saved loadout is trimmed to the slots your level allows
   and to the techniques they have actually drilled; an untrained technique simply drops out, leaving
   the slot empty until you train it at the yard. Recruits can have one too (profile.recruitLoadouts):
   they may carry their own skills, their own passive and the generic passives, but not the neutral
   techniques, which only your champion learns at the Training Yard. A recruit you haven't set auto-picks. */
const isHeroId = (cid) => profile.hero?.id === cid;
const savedLoadoutOf = (cid) => (isHeroId(cid) ? profile.loadout : profile.recruitLoadouts?.[cid]);
const canCarry = (c, id) => (isHeroId(c.id) ? isTrained(c.id, id) : !NEUTRAL_SKILLS[id]);
function loadoutFor(c, lv) {
  const saved = savedLoadoutOf(c.id);
  if (!saved && !isHeroId(c.id)) return autoLoadout(c, lv);
  const base = saved || autoLoadout(c, lv);
  const keep = (ids, known) => ids.filter((id) => known(id) && canCarry(c, id));
  return {
    act: keep(base.act, (id) => activeIdsOf(c).includes(id) || NEUTRAL_SKILLS[id]).slice(0, activeSlots(lv)),
    pas: keep(base.pas, (id) => !!passiveById(c, id)).slice(0, passiveSlots(lv)),
  };
}
const heroLoadout = (c, lv) => loadoutFor(c, lv);

// After a level-up that opens a slot, fill it with the next skill not equipped yet: for your champion,
// and for every recruit you've set skills for.
function fillNewSlots(lv) {
  if (!profile.hero) return;
  const cids = [profile.hero.id, ...Object.keys(profile.recruitLoadouts || {})];
  for (const cid of cids) {
    const lo = savedLoadoutOf(cid), c = charById(cid);
    if (!lo || !c) continue;
    const auto = autoLoadout(c, lv), ready = (id) => canCarry(c, id);   // never a technique they can't carry
    for (const id of [...auto.act, ...activeIdsOf(c), ...NEUTRAL_KEYS]) if (lo.act.length < activeSlots(lv) && !lo.act.includes(id) && ready(id)) lo.act.push(id);
    for (const id of [...auto.pas, ...GENERIC_KEYS]) if (lo.pas.length < passiveSlots(lv) && !lo.pas.includes(id) && ready(id)) lo.pas.push(id);
  }
}

/* SKILL RANKS — every level-up grants a skill point to spend on one of your champion's
   active skills (their own or a neutral one), on the Skills screen, and every technique
   mastered at the Training Yard grants one more. Points are derived from level and
   mastery so none are ever lost: earned = level − 1 + techniques mastered, and
   each champion you play has their own allocation. A rank makes that skill 8% stronger
   (damage, healing, or summoned-unit stats); pure buff skills instead last 1 extra turn
   per 2 ranks (or 1 extra attack, for attack-counted buffs like Provoke). Capped at RANK_CAP per skill. Enemies never benefit from ranks. */
const RANK_CAP = 10, RANK_POWER = 0.08;
const ranksOf = (cid) => profile.skillRanks?.[cid] || {};
const skillRank = (cid, sid) => ranksOf(cid)[sid] || 0;
const ranksSpent = (cid) => Object.values(ranksOf(cid)).reduce((a, b) => a + b, 0);
const skillPoints = (cid) => Math.max(0, heroLevel() - 1 + masteredCount(cid) - ranksSpent(cid));
const rankBonusText = (s, r) => (s.kind === 'buff' && s.o?.charges
  ? `lasts ${Math.floor(r / 2)} more attack${Math.floor(r / 2) === 1 ? '' : 's'}`
  : s.kind === 'buff' && !s.o?.heal
  ? `effects last ${Math.floor(r / 2)} turn${Math.floor(r / 2) === 1 ? '' : 's'} longer`
  : `+${Math.round(RANK_POWER * r * 100)}% power`);
function rankUp(sid) {
  const cid = profile.hero?.id;
  if (!cid || !skillPoints(cid) || skillRank(cid, sid) >= RANK_CAP) return;
  if (!profile.skillRanks) profile.skillRanks = {};
  const r = profile.skillRanks[cid] = profile.skillRanks[cid] || {};
  r[sid] = (r[sid] || 0) + 1;
  saveProfile();
}

// scale < 1 softens a unit (used for early gauntlet enemies).
function makeUnit(c, lv, side, slot, scale = 1) {
  // Loadout: your own champion, and any recruit you've set skills for, use what you picked;
  // everyone else (other recruits, every enemy) auto-picks.
  const lo = side === 'p' && savedLoadoutOf(c.id) || side === 'p' && slot === 0 && isHeroId(c.id) ? loadoutFor(c, lv) : autoLoadout(c, lv);
  const equipped = lo.pas.map((id) => passiveById(c, id)).filter(Boolean);
  const ps = Object.assign({}, ...equipped);                  // passive options the engine reads through pv(u)
  const st = equipped.reduce((sum, p) => addUp(sum, p.stat || {}), {});   // generic passives' stat bonuses
  const r = ROLES[c.role], m = c.mods || {}, g = 1 + 0.12 * (lv - 1);
  // Forged gear only helps your own warband, never an enemy's Rival copy of the same champion.
  const gear = side === 'p' ? gearOf(c.id) : {}, pool = MANA.pool[c.faction] ?? 1;
  const wg = (1 + FORGE.w.per * (gear.w || 0)) * (1 + (gear.atkPct || 0));
  const ag = 1 + FORGE.a.per * (gear.a || 0);
  const maxHp = Math.round(r.hp * (m.hp || 1) * g * scale * ag * (1 + (gear.hpPct || 0)) * (1 + (st.hpPct || 0)));
  const maxMp = pool ? Math.round(r.mp * pool * MANA.poolScale * (1 + 0.08 * (lv - 1))) + (gear.mp || 0) + (st.mp || 0) : 0;
  return {
    uid: `${side}${slot}`, id: c.id, side, name: shortName(c), level: lv,
    faction: c.faction, race: c.race || null, role: c.role, floats: !!c.floats,
    maxHp, hp: maxHp,
    maxMp, mp: maxMp, mpRegen: (gear.mpRegen || 0) + (pool ? st.mpRegen || 0 : 0), manaSteal: gear.manaSteal || 0,
    hpRegen: (gear.hpRegen || 0) + Math.round(maxHp * (st.hpRegenPct || 0)),
    atk: Math.round(r.atk * (m.atk || 1) * g * scale * wg * (1 + (st.atkPct || 0))), def: Math.round(r.def * (m.def || 1) * g * ag),
    agi: Math.round(r.agi * (m.agi || 1)) + (lv - 1) + (gear.agi || 0) + (st.agi || 0),
    crit: (m.crit ?? 0.08) + (st.crit || 0) + (gear.crit || 0), dodge: r.dodge + (ps.dodge || 0),
    // Weapon affixes (see THE ARMORY): harder crits, a second swing, and the three drains.
    critMult: gear.critMult || 0, double: gear.double || 0,
    steal: { max: gear.stealMax || 0, lost: gear.stealLost || 0, foe: gear.stealFoe || 0 },
    // Worn kit (see THE ARMOR STAND): wards against a kind of damage, and amplifiers for dealing it.
    blockPhys: gear.blockPhys || 0, blockMagic: gear.blockMagic || 0, healTaken: gear.healTaken || 0,
    physAmp: gear.physAmp || 0, magicAmp: gear.magicAmp || 0,
    // Gem stones: a share of damage dealt back as HP, and per-battle charges of debuffs shrugged off
    // and of buffs that last a turn longer (counted down in addFx).
    lifesteal: gear.lifesteal || 0, wardDebuffs: gear.wardDebuffs || 0, blessBuffs: gear.blessBuffs || 0,
    pv: ps, loadout: lo.act, passives: lo.pas,
    // The ★ signature (ultimate) starts on cooldown so it first unlocks on the hero's 3rd turn
    // (cooldowns tick down at the start of each of the hero's turns: 3 → 2 → 1 → 0 on turn 3).
    effects: (ps.startFx || []).map(([id, turns]) => ({ id, turns, value: 0 })),
    // Covering Fire's count of the field's turns, and Bolt-On's weld (see THE TURN PULSE).
    watch: c.watch || 0, watchN: 0, attachedTo: null, latchLeft: 0, latchHeal: 0,
    // The champion's Nature (always on, see ROSTER): the engine reads its flags via charNat(u).
    nat: c.nature || {},
    cooldowns: { b: ULT_FIRST_TURN }, heat: 0, stacks: (ps.startStacks || 0) + (c.nature?.brace || 0), hitSince: false, lastAction: null, combo: false,
  };
}

// A monster unit (always on the enemy side). Same stat formula as champions, no mana, fixed skills.
function makeMonster(id, lv, slot, scale = 1) {
  const m = MONSTERS[id], r = ROLES[m.role], g = 1 + 0.12 * (lv - 1), ps = m.passive || {}, st = ps.stat || {};
  const maxHp = Math.round(r.hp * (m.mods.hp || 1) * g * scale);
  return {
    uid: `e${slot}`, id, art: id, side: 'e', monster: true, elite: !!m.elite, boss: !!m.boss, name: m.name, level: lv,
    faction: 'wild', race: null, role: m.role, floats: !!m.floats,
    maxHp, hp: maxHp, maxMp: 0, mp: 0, mpRegen: 0, manaSteal: 0, hpRegen: Math.round(maxHp * (st.hpRegenPct || 0)),
    atk: Math.round(r.atk * (m.mods.atk || 1) * g * scale), def: Math.round(r.def * (m.mods.def || 1) * g),
    agi: Math.round(r.agi * (m.mods.agi || 1)) + (lv - 1), crit: 0.05, dodge: r.dodge,
    pv: ps, passives: [],
    effects: (ps.startFx || []).map(([fx, turns]) => ({ id: fx, turns, value: 0 })),
    cooldowns: {}, heat: 0, stacks: 0, hitSince: false, lastAction: null, combo: false,
  };
}

function skillsOf(u) {
  if (u.summon) return SUMMONS[u.id].skills.map((s, i) => ({ ...s, id: i === 0 ? 'attack' : `s${i}` }));
  if (u.monster) return MONSTERS[u.id].skills.map((s, i) => ({ ...s, id: i === 0 ? 'attack' : `s${i}` }));
  const c = charById(u.id);
  const guard = u.faction === 'mech' ? { ...GUARD, desc: 'Take 50% less damage until your next turn. Vents 50 Heat.' }
    : u.maxMp ? { ...GUARD, desc: `${GUARD.desc} Restores ${MANA.guardGain} MP.` } : GUARD;
  const attack = u.maxMp ? { ...ATTACK, desc: `${ATTACK.desc} Restores ${MANA.attackGain} MP.` } : ATTACK;
  // Mana cost: the skill's own o.mp, else the default; champions with no mana (mechs) cast for free.
  const cost = (s, d) => (u.maxMp ? spellCost(s, d) : 0);
  // Order on the bar: the cheap opener, then the three second-tier skills, with the ★ signature last.
  const actives = [
    { ...c.skills[0], id: 'a', mp: cost(c.skills[0], MANA.skillCost), o: { heat: 25, ...c.skills[0].o } },
    { ...c.skills[2], id: 'c', mp: cost(c.skills[2], MANA.skill2Cost), o: { heat: 30, ...c.skills[2].o } },
    { ...c.skills[3], id: 'd', mp: cost(c.skills[3], MANA.skill2Cost), o: { heat: 30, ...c.skills[3].o } },
    { ...c.skills[4], id: 'e', mp: cost(c.skills[4], MANA.skill2Cost), o: { heat: 30, ...c.skills[4].o } },
    { ...c.skills[1], id: 'b', sig: true, mp: cost(c.skills[1], MANA.ultCost), o: { heat: 40, ...c.skills[1].o } },
  ];
  // A sixth (and seventh) skill, for the few champions who carry one, at the second-tier cost.
  c.skills.slice(5, 5 + EXTRA_IDS.length).forEach((sk, i) =>
    actives.push({ ...sk, id: EXTRA_IDS[i], mp: cost(sk, MANA.skill2Cost), o: { heat: 30, ...sk.o } }));
  // Only the skills in this champion's loadout come into battle; Attack and Guard always do.
  const eq = u.loadout || activeIdsOf(c);
  // Equipped neutral skills come in after the champion's own, at the cheap-skill mana tier.
  const neutrals = eq.filter((id) => NEUTRAL_SKILLS[id])
    .map((id) => ({ ...NEUTRAL_SKILLS[id], id, mp: cost(NEUTRAL_SKILLS[id], MANA.skillCost), o: { heat: 25, ...NEUTRAL_SKILLS[id].o } }));
  // Skill ranks: trained skills fight stronger for your side only (see SKILL RANKS).
  const boost = (s) => {
    const r = u.side === 'p' ? skillRank(u.id, s.id) : 0;
    if (!r) return s;
    const out = { ...s, rank: r };
    if (s.mult) out.mult = s.mult * (1 + RANK_POWER * r);
    if (s.kind === 'buff' && s.o?.charges) out.o = { ...s.o, charges: s.o.charges + Math.floor(r / 2) };
    else if (s.kind === 'buff' && s.fx) out.fx = s.fx.map(([id, t, ...rest]) => [id, t + Math.floor(r / 2), ...rest]);
    if (s.o?.heal) out.o = { ...s.o, heal: s.o.heal * (1 + RANK_POWER * r) };
    return out;
  };
  return [attack, ...actives.filter((s) => eq.includes(s.id)).map(boost), ...neutrals.map(boost), guard];
}

/* THE FRONT LINE — the opening of every battle belongs to the melee.
   Until a warband's melee have been attacked twice — hit or miss, skill or basic attack, by
   player or AI alike — enemies can only target that warband's melee. Each side's count is its
   own (state.frontline[side], reset every battle). Taunt still outranks everything, area
   attacks can't single anyone out (each melee they go for counts toward the two), and a
   warband with no melee standing was never shielded to begin with. */
const FRONTLINE_HITS = 2;
// Bulwark-7's Nature (Built to Hold): while he stands, his side's line takes one blow more.
const frontCap = (side) => FRONTLINE_HITS + (state.teams[side]?.some((x) => x.hp > 0 && !x.summon && charNat(x).front) ? 1 : 0);
const frontlineUp = (side) => (state.frontline?.[side] ?? FRONTLINE_HITS) < frontCap(side)
  && state.teams[side].some((x) => x.hp > 0 && x.role === 'melee');
// Every attack that goes for a unit, hit or miss, single-target or area, counts here once:
// the front line's two blows, and the charges of a Provoke.
function markAttacked(t) {
  frontlineHit(t);
  const pr = t && has(t, 'provoke');
  if (pr && --pr.charges <= 0) {
    t.effects = t.effects.filter((e) => e !== pr);
    log(`${t.name} is no longer provoking.`, 'sys');
  }
}
function frontlineHit(t) {
  if (!t || t.role !== 'melee' || !state.frontline || state.frontline[t.side] >= frontCap(t.side)) return;
  if (++state.frontline[t.side] === frontCap(t.side))
    log(t.side === 'p' ? 'Your front line has taken its two blows — your back line is exposed.'
      : 'The enemy front line has taken its two blows — their back line is open.', 'sys');
}

/* THE COFFIN — Mortessa shuts an ally away for a turn. While the lid is down nothing can pick
   that unit out as a target and nothing with a radius touches it either, so it is filtered out
   of every target list: single blows here, and area attacks and mass blessings through
   openFoes / openAllies. It still takes its own turn — stepping out of the box is what ends the
   effect — and it loses everything that was laid on it in the process (see beginTurn). */
const inBox = (u) => !!has(u, 'coffin');
// Burrowed (Barrow's Burrow) is out of reach the way the coffin is: no single blow, no area attack.
const buried = (u) => !!has(u, 'burrowed');
const outOfReach = (u) => inBox(u) || buried(u);
const openFoes = (u) => foesOf(u).filter((f) => !outOfReach(f) && !f.noAoe);   // area attacks wash past Anchors / Jellies
// A planted Grave Cross stands with its warband but is stone: no heal, buff or coffin is for it.
const openAllies = (u) => alliesOf(u).filter((a) => !outOfReach(a) && !a.inert);
/* Who a SINGLE blow can be aimed at. Deliberately NOT the list an area attack catches. An Anchor
   or a Jelly carries noAoe precisely so sweeps wash past it, but singling it out is the only way
   its host's team gets free of it — so it belongs here even though it is out of openFoes. A
   bolted-on rider is the mirror: area attacks still find him, no single blow can. */
const singleFoes = (u) => foesOf(u).filter((f) => !outOfReach(f) && !f.attachedTo);

function validTargets(u, sk) {
  // Bolt-On: a bolted-on champion cannot be singled out by either side. He stays in openFoes /
  // openAllies, so area attacks and mass blessings still reach him — only single targeting skips him.
  if (sk.target === 'enemy') {
    const foes = singleFoes(u);
    // Graveyard Fence: an iron fence only turns aside a MELEE attacker closing in (not a hurled
    // or gust skill, which come over the top). A ranged attacker shoots clean over it, so it is
    // no wall to them. Whenever every option is walled, a cornered attacker breaks through rather
    // than deadlock — the same soft fallback the front line uses.
    const meleeAtk = u.role === 'melee' && !sk.o?.hurl && !sk.o?.gust;
    const reachable = (list) => {
      if (!meleeAtk) return list;
      const open = list.filter((f) => !has(f, 'protected'));
      return open.length ? open : list;
    };
    const taunters = foes.filter((f) => has(f, 'taunt') || has(f, 'provoke'));
    // A taunter the fence keeps the melee out of reach of cannot hold it — it looks past the
    // taunt to whoever it can actually reach. A ranged attacker is bound by the taunt as ever.
    const openTaunters = meleeAtk ? taunters.filter((f) => !has(f, 'protected')) : taunters;
    if (openTaunters.length) return openTaunters;
    if (taunters.length && !meleeAtk) return taunters;
    // An Anchor or a Jelly is clamped onto a body, not standing in a rank behind one, so no front
    // line shields it whatever role the attachment happens to carry - otherwise the side it is
    // stuck to cannot break it off until their enemy's line has already fallen.
    if (frontlineUp(foes[0]?.side) && !charNat(u).slipline) {   // no line holds a hound (Gorehound)
      const front = reachable(foes.filter((f) => f.role === 'melee' || f.attach));
      if (front.length) return front;
    }
    return reachable(foes);
  }
  if (sk.target === 'ally') {
    let allies = openAllies(u).filter((a) => !a.attachedTo);
    if (sk.o?.championsOnly) allies = allies.filter((a) => !a.summon);   // the fence is for a champion, not a raised servant
    return sk.o?.notSelf ? allies.filter((a) => a !== u) : allies;
  }
  // Second Burial alone looks past the living: its marks are this side's fallen champions. One
  // already standing Undying is not among them — it is still on its feet.
  if (sk.target === 'deadAlly') return state.teams[u.side].filter((a) => a.hp <= 0 && !a.summon && !undyingOn(a));
  return [];
}

// Silenced: Attack and Guard only — every other skill (all slots, neutral skills, a summon's special) is sealed.
const silenced = (u, sk) => !!has(u, 'silence') && sk.id !== 'attack' && sk.id !== 'guard';

// Does taking this skill carry the unit across the field? A melee fighter runs in for a damage skill
// (a hurled or gust skill is loosed where they stand); Second Burial walks to the body it raises;
// Bolt-On walks to the ally it welds to. Everything else is done from the spot. A skill can force the
// answer either way with o.move (true/false) when the default guess is wrong.
function requiresMove(u, sk) {
  const o = sk.o || {};
  if (o.move != null) return o.move;
  if (sk.kind === 'revive' || o.latch) return true;   // walks to a corpse / an ally
  return u.role === 'melee' && sk.kind === 'damage' && !o.hurl && !o.gust;   // runs in
}

function usable(u, sk) {
  if (silenced(u, sk)) return false;
  // Rooted: held in place — anything that would carry the unit across the field is shut off (melee
  // run-ins, Second Burial, Bolt-On). Ranged attacks, in-place casts, self-buffs and Guard still work.
  if (has(u, 'rooted') && requiresMove(u, sk)) return false;
  // Mordrek's cross is in the ground (Plant the Marker): nothing to Attack with, and nothing to plant again.
  if (u.planted && (sk.id === 'attack' || sk.summon === 'gravecross')) return false;
  if (u.cooldowns[sk.id] > 0) return false;
  // Fenced in (Graveyard Fence): the wall holds both ways. A MELEE unit behind it cannot swing
  // out past its own fence — its basic Attack and every melee damage skill are shut off (a hurled
  // or gust skill still goes over the top). A ranged unit fires clean over it, and anyone fenced
  // can still cast a non-attack skill or Guard.
  if (has(u, 'protected') && u.role === 'melee' && sk.kind === 'damage' && !sk.o?.hurl && !sk.o?.gust) return false;
  // Sea-Sung (Seraphine's Nature): at High Tide her songs cost half their mana.
  if ((charNat(u).seasung && highTide() ? Math.ceil((sk.mp || 0) / 2) : (sk.mp || 0)) > (u.mp || 0)) return false;
  if (['enemy', 'ally', 'deadAlly'].includes(sk.target) && !validTargets(u, sk).length) return false;
  if (sk.target === 'allEnemies' && !openFoes(u).length) return false;
  return true;
}

/* ==================================================================
   KILL XP — your champion learns most from the blow that ends a life.
   Whenever anything falls and yours was the last hand on it, you earn
   XP on the spot. It is banked in state.killXp and paid out with the
   battle's own XP on the reward screen (payXp), so a level-up still
   lands in one place: between fights, never mid-swing.
   Only your own killing blows count — a recruit's kill teaches the
   recruit, not you — and a felled summon pays nothing, or a Court
   Necromancer's endless skeletons would be an XP mine.
   ================================================================== */
const KILL_XP_SHARE = 0.25;                      // a monster's worth, as a share of its hunt XP
const KILL_XP_BASE = 6, KILL_XP_PER_LV = 2;      // a champion's worth: 8 XP at Lv 1, 26 at Lv 10

const killXpOf = (v) => (v.summon ? 0 : Math.max(1, Math.round(v.monster
  ? MONSTERS[v.id].xp * KILL_XP_SHARE * (1 + 0.1 * (v.level - 1))
  : KILL_XP_BASE + KILL_XP_PER_LV * v.level)));

// Burn, Poison and Bleed can land the killing blow turns after the hit that lit them, so each
// remembers whose it was. Anything applied with no striker behind it — a dungeon's Grave Damp,
// a monster's own aura — simply has no owner, and pays nobody.
const DOT_IDS = ['burn', 'poison', 'bleed'];
function ownFx(by, t, id) { const e = DOT_IDS.includes(id) && has(t, id); if (e) e.by = by.uid; }

// A share of a blow that someone else is carrying: Soul Link's split, Malgrath's Blood Pact,
// Morwenna's Blood Ward. It lands outside the normal defensive chain on purpose — the blow has
// already been rolled and reduced against whoever it was aimed at — but the striker still takes
// the credit if the share is what fells the one absorbing it.
function shareBlow(m, amount, by) {
  if (!m || m.hp <= 0 || amount < 1) return;
  m.hp = Math.max(0, m.hp - amount);
  float(m, `${amount}`, 'dot');
  if (m.hp <= 0) fell(m, by);
}

// Effects counted in blows rather than turns (o.charges — Provoke, Blood Pact, Blood Ward):
// spend one, and drop the effect when the last is gone.
function spendCharge(u, e, msg) {
  if (!e || e.charges == null) return;
  if (--e.charges <= 0) {
    u.effects = u.effects.filter((x) => x !== e);
    log(msg, 'sys');
  }
}

/* Called the moment a unit's HP reaches 0, from wherever the damage came from: it announces the
   death and settles the credit. `by` is whoever struck the last blow, or null for a nameless
   source. A summon's kill belongs to whoever conjured it — it fights as its owner's hand. */
/* ==================================================================
   UNDYING — the Pale Host's innate.
   A blow that would end an Undead champion does not end it yet. Every
   death in the game funnels through fell() below, whatever dealt it —
   a skill, a Burn tick, thorns, a Firebomb, Soul Link's shared share —
   so this is the only place that has to know about the pact.
   The unit is pinned at 1 HP, lit pale green, and already dead: it can
   take one more instance of damage (two, with Mordrek's Second Grave)
   and that instance ends it, whatever it is — a blow, a tick, a sear.
   Nothing mends it while it stands there. Until something lands, it
   keeps its feet and keeps fighting.
   Summons are not covered — a Shambler is already borrowed time — and
   a champion called back by Second Burial holds the pact afresh.
   ================================================================== */
const undyingOn = (u) => (u.undyingHits || 0) > 0;
// Every body on the field, both sides, champions and summons alike: what Cadris counts.
// A champion standing Undying is at 1 HP, so it is rightly not among them.
const deadCount = () => allUnits().filter((x) => x.hp <= 0 && !x.inert).length;   // a knocked-loose cross is no body

// Absorbs the death of a Pale Host champion that is still owed the pact.
// Returns true when the death was absorbed, so fell() knows to stop short.
function undyingCatch(v) {
  if (v.faction !== 'undead' || v.summon || v.undyingSpent) return false;
  if (undyingOn(v)) {
    // Already standing Undying: this instance spends one of the hits it is owed.
    v.undyingHits--;
    if (v.undyingHits > 0) {         // Second Grave: Mordrek shrugs off one more
      v.hp = Math.max(1, v.hp);
      log(`${v.name} takes the blow and does not fall.`, 'sys');
      return true;
    }
    v.undyingSpent = true;           // the pact is used up; only a revival renews it
    v.effects = v.effects.filter((e) => e.id !== 'undying');
    return false;                    // the death goes through for real
  }
  v.undyingHits = pv(v).undyingHits || 1;   // how many more instances it can take
  v.hp = Math.max(1, v.hp);                 // back on its feet, lit pale green
  addFx(v, 'undying', 99, 0, true);         // the chip on the plate; the next hit is what ends it
  float(v, 'Undying', 'fx');
  log(`${v.name} should be down, and is still standing. The next blow is the end.`, 'sys');
  return true;
}

/* Barrow: Feast of the Fallen. Any real death on the field feeds everyone carrying the passive.
   The grave hands this one over directly rather than mending it in, so it is passed as `innate`
   and the Pale Host's halved healing does not bite on it. */
function feastOfTheFallen(dead) {
  for (const u of allUnits()) {
    const pct = pv(u).deathHeal;
    // At full HP there's nothing to drink, so skip it rather than log and float a "+0".
    if (!pct || u.hp <= 0 || u.hp >= u.maxHp || u === dead || undyingOn(u) || has(u, 'coffin')) continue;
    healUnit(u, u, Math.max(1, Math.round(u.hp * pct)), 'Feast of the Fallen', { innate: true });
  }
}

function fell(v, by) {
  if (undyingCatch(v)) return;   // the Pale Host is owed one more round (see UNDYING)
  if (v.felled) return;   // one death, one payout, however many sources pile onto the corpse
  v.felled = true;
  // An attachment (Anchor / Jelly) breaking is not a death: lift what it held and clear it away.
  if (v.attach) { removeAttachment(v, 'broken'); return; }
  // A felled unit drops whatever was clamped onto it — the chain goes slack, the jelly sloughs off.
  for (const a of [...allUnits()]) if (a.attach && a.hostUid === v.uid) removeAttachment(a, 'host');
  // A Grave Cross is not a death: no feast, no kill XP. It is knocked loose and goes home.
  if (v.inert) { crossFliesHome(v); return; }
  releaseRites(v, `is freed: the Last Rites crumble with ${v.name}.`);
  // Bolt-On: a death on either end of the weld breaks it on the spot.
  if (v.attachedTo) detachLatch(v, 'fell');
  for (const x of allUnits()) if (x.attachedTo === v.uid) detachLatch(x, 'host');
  // Ancestors' Whisper (Hesk's Nature): when one of hers falls, the spirits hurry her hands.
  if (!v.summon) for (const a of state.teams[v.side]) if (a !== v && a.hp > 0 && charNat(a).whisper) {
    for (const k in a.cooldowns) if (a.cooldowns[k] > 0) a.cooldowns[k]--;
    float(a, 'The ancestors lean close', 'fx');
  }
  if (v.summon && v.id === 'zombie') boneThrift(v);   // Bone-Thrift: fired at death too (flag-guarded)
  // Crawling Venom (Faelan's Nature): the poison in a dying thing crawls to the next.
  const venom = has(v, 'poison');
  if (venom && foesOf(v).some((f) => charNat(f).crawl)) {
    const tgt = pick(alliesOf(v).filter((a) => a !== v && !has(a, 'poison')) || []);
    if (tgt) {
      addFx(tgt, 'poison', venom.turns, venom.value);
      const e2 = has(tgt, 'poison');
      if (e2) e2.by = venom.by;
      log(`The venom crawls out of ${v.name} and into ${tgt.name}.`, 'sys');
    }
  }
  log(`${v.name} is down.`, 'sys');
  feastOfTheFallen(v);
  const killer = by && by.summon ? unitBy(by.owner) : by;
  if (!killer || !killer.you || killer.side === v.side) return;
  const xp = killXpOf(v);
  if (!xp) return;
  state.killXp = (state.killXp || 0) + xp;
  state.kills = (state.kills || 0) + 1;
  float(killer, `+${xp} XP`, 'xpf');
  log(`${killer.name} lands the killing blow on ${v.name}: +${xp} XP.`, killer.side);
}

/* ==================================================================
   COMBAT MATH
   ================================================================== */
/* PHYSICAL or MAGIC — every blow that lands is one or the other, and worn kit can ward
   against each kind on its own (see THE ARMOR STAND). A hit is MAGIC when the skill says so
   (o.magic), when it carries an element, or when it draws on mana (manaDamage / manaBurn):
   spellfire, lightning, holy light, venom-song and ink. Everything else is PHYSICAL — steel,
   shot, tusk, fist and the free Attack. Heals, status effects and the ticks of Burn, Poison
   and Bleed are neither, so no ward turns them aside. */
const isMagic = (o = {}) => !!(o.magic || o.element || o.manaDamage || o.manaBurn);

function powerMult(u) {
  let m = 1;
  if (u.faction === 'orc') m *= 1 + 0.5 * (1 - u.hp / u.maxHp);
  if (u.faction === 'mech') m *= 1 + u.heat / 250;
  if (u.faction === 'human' && u.combo) m *= 1 + disciplineBonus() + (charNat(u).rhythm ? 0.05 : 0);   // Wren: Spellblade's Rhythm
  if (u.faction === 'tide' && highTide()) m *= 1.25;
  if (pv(u).deadScale) m *= 1 + pv(u).deadScale * deadCount();   // Cadris: Toll of the Dead
  // Two on the Trail (Vashka's Nature): hunter and called beast strike harder side by side.
  if (charNat(u).pair && summonOf(u)) m *= 1.1;
  if (u.summon) { const ow = unitBy(u.owner); if (ow && ow.hp > 0 && charNat(ow).pair) m *= 1.1; }
  if (favored(u)) m *= wx() === 'sun' ? 1.15 : 1.2;
  if (has(u, 'weaken')) m *= 0.7;
  if (has(u, 'empower')) m *= 1.3;
  if (has(u, 'enraged')) m *= 1.35;   // dungeon bosses below half HP
  if (has(u, 'poison') && foeHas(u, 'weakenPoisoned')) m *= 0.85;   // Faelan: Debilitating Venom
  return m;
}

/* Ironclad overheat bar: it fills in quarters (25 / 50 / 75 / 100 Heat). Every quarter
   the hull runs hotter, so an enemy that trades blows with a Mech is seared for more.
   At 100 Heat the Mech overheats and skips its next turn (handled on the speed bar). */
const HEAT_TIERS = [25, 50, 75, 100];
const heatTier = (u) => (u.faction === 'mech' ? HEAT_TIERS.filter((h) => u.heat >= h).length : 0);
const contactBurn = (u) => heatTier(u) * 10;   // 10 / 20 / 30 / 40 seared per contact

// A hot Mech sears any enemy it trades blows with — whoever it strikes, and whoever strikes it.
// Summons (including Salvage Bots) never build Heat, so this is a no-op for them.
function searContact(mech, foe) {
  if (mech.hp <= 0 || foe.hp <= 0) return;
  const burn = contactBurn(mech);
  if (burn <= 0) return;
  foe.hp = Math.max(0, foe.hp - burn);
  bump(foe, 'hurt');
  float(foe, `${burn}`, 'dot');
  log(`${foe.name} is seared by ${mech.name}'s heat for ${burn}.`, mech.side);
  if (foe.hp <= 0) fell(foe, mech);
}

// One hit: dodge → damage = ATK × mult × (±10%) × 50/(50+DEF) → crit, status and faction modifiers.
function strikeOnce(u, t, mult, label, o) {
  if (t.hp <= 0) return { miss: true };
  // Heroic (Wren, Garrick — their opt-in passive): a melee blow swung at an ally may be met by a
  // sworn guardian who throws themselves into its path, taking it in the ally's place and then
  // answering with a full counter (queued below). Single-target melee only, never off another
  // counter, and the guardian takes the blow deliberately — no stepping in only to dodge it.
  // The usual path decides this up in damageSkill (so the guardian can physically leap in front of
  // the ally before the attacker arrives) and passes o.heroic; this blow is already theirs to take.
  // The search below still covers the odd blow that reaches strikeOnce another way (e.g. Execute).
  let heroicHit = false;
  if (o.heroic) {
    heroicHit = true;
  } else if (!o.counter && !o.aoe && u.role === 'melee' && !o.hurl && !o.gust) {
    const g = alliesOf(t).find((a) => a !== t && a.hp > 0 && !has(a, 'rooted') && pv(a).heroic && chance(pv(a).heroic));
    if (g) {
      float(g, '🛡️ Heroic', 'fx');
      log(`${g.name} throws into the path of the blow meant for ${t.name}, taking it in their place.`, g.side);
      t = g;
      heroicHit = true;
    }
  }
  // Vaun's Breathless: no breath to hold, no waver — his basic Attack cannot be dodged.
  const dodge = heroicHit || o.noDodge || t.inert || (charNat(u).breathless && label === 'Attack') ? 0 : has(t, 'evade') ? 1 : clamp(0.04 + t.dodge + (effAgi(t) - effAgi(u)) * 0.01 + (wx() === 'mist' ? 0.1 : 0), 0.02, 0.4);
  const miss = dodge + (has(u, 'blind') ? 0.35 : 0);
  if (miss > 0 && chance(miss)) {
    float(t, 'Miss', 'miss');
    dodgeHop(t);
    log(`${t.name} avoids ${u.name}'s ${label}.`, u.side);
    // Snapback (Grubblefin's Nature): miss him and he's already biting.
    if (charNat(t).snap && !o.counter && !o.hurl && t.hp > 0 && u.hp > 0
        && !(state.counters ||= []).some((c) => c.by === t)) {
      state.counters.push({ by: t, at: u, mult: 0.5, label: 'Snapback', o: { counter: true } });
    }
    return { miss: true };
  }
  const def = o.pierce ? 0 : t.def * (has(t, 'sunder') ? 0.6 : 1);
  // Mana-scaling skills add a share of the caster's mana (before paying for the cast) to the hit.
  const manaPart = o.manaDamage ? (u.castMp ?? u.mp ?? 0) * o.manaDamage : 0;
  let dmg = (u.atk * mult + manaPart) * powerMult(u) * (0.9 + Math.random() * 0.2) * 50 / (50 + def);
  const P = pv(u), TP = pv(t), magic = isMagic(o);
  const critChance = u.crit + (o.critBonus || 0) + (u.race === 'elf' ? u.stacks * 0.1 : 0)
    + (P.critVs && has(t, P.critVs.fx) ? P.critVs.bonus : 0);
  const crit = o.alwaysCrit || chance(critChance);
  if (crit) dmg *= (P.critMult || 1.5) + (u.critMult || 0);   // a weapon's critMult sharpens the blow further
  if (o.bonusVs && has(t, o.bonusVs)) dmg *= 1.6;
  // Attacker passives
  if (P.vs && has(t, P.vs.fx) && (!P.vs.element || P.vs.element === o.element)) dmg *= 1 + P.vs.bonus;
  if (P.aoeBonus && o.aoe) dmg *= 1 + P.aoeBonus;
  if (P.execute && t.hp / t.maxHp < P.execute.below) dmg *= 1 + P.execute.bonus;
  if (P.grudge && u.lastHitBy === t.uid) dmg *= 1 + P.grudge;
  // Worn kit: an amplifier only lifts the kind of damage this blow is.
  if (magic ? u.magicAmp : u.physAmp) dmg *= 1 + (magic ? u.magicAmp : u.physAmp);
  // Defender side: Exposed, passives and auras
  if (has(t, 'exposed')) dmg *= 1.25;
  if (TP.firstHitDR && !t.plated) { dmg *= 1 - TP.firstHitDR; t.plated = true; }
  if (allyHas(t, 'allyDR', true)) dmg *= 0.9;
  if (has(t, 'hex') && allyHas(u, 'hexVuln')) dmg *= 1.15;
  if (o.element === 'lightning' && soaked(t)) dmg *= 1.3;
  if (o.element === 'lightning' && wx() === 'storm') dmg *= 1.3;
  // Spirit Ward (−60%) and shields (−50%) don't stack; the stronger one applies.
  if (!o.ignoreShield) dmg *= has(t, 'ward') ? 0.4 : has(t, 'shield') ? 0.5 : 1;
  if (has(t, 'guard')) dmg *= 0.5;
  if (t.race === 'dwarf') dmg *= 1 - 0.08 * t.stacks;
  if (charNat(t).mound && deadCount() > 0) dmg *= 0.92;   // Barrow: the dead crowd round their lord
  // Worn kit: a ward turns aside its share of the blow, physical or magic, whichever this was.
  const ward = Math.min(magic ? t.blockMagic || 0 : t.blockPhys || 0, 0.9);
  if (ward) dmg *= 1 - ward;
  dmg = Math.max(1, Math.round(dmg));
  // Soul Link: a third of the blow is divided among the holder's living teammates.
  let taken = dmg;
  if (has(t, 'link')) {
    const mates = alliesOf(t).filter((a) => a.uid !== t.uid);
    if (mates.length) {
      const each = Math.max(1, Math.round((dmg * 0.33) / mates.length));
      taken = Math.max(1, dmg - each * mates.length);
      for (const m of mates) {
        m.hp = Math.max(0, m.hp - each);
        float(m, `${each}`, 'dot');
        if (m.hp <= 0) fell(m, u);
      }
      log(`${t.name}'s Soul Link spreads ${each * mates.length} damage across the team.`, t.side);
    }
  }
  // Malgrath: Blood Pact divides the blow he is taking evenly across the whole living warband,
  // himself included, so a four-strong band leaves him carrying a quarter of it. Spends a charge
  // whether or not anyone is left to share with, and what the others take is routed through
  // shareBlow so a share that fells someone still credits the kill.
  const pact = has(t, 'bloodpact');
  if (pact) {
    const mates = alliesOf(t).filter((a) => a.uid !== t.uid);
    if (mates.length) {
      const share = Math.max(1, Math.round(taken / (mates.length + 1)));
      for (const m of mates) shareBlow(m, share, u);
      taken = share;
      log(`${t.name}'s Blood Pact splits the blow ${mates.length + 1} ways — ${share} each.`, t.side);
    }
    spendCharge(t, pact, `${t.name}'s Blood Pact is spent.`);
  }
  // Morwenna: Blood Ward covers every ally at once out of one pool of charges. She takes half of
  // any blow meant for someone else; a blow aimed at her is hers alone to carry.
  const warden = alliesOf(t).find((a) => a.uid !== t.uid && has(a, 'bloodward'));
  if (warden && taken > 1) {
    const soak = Math.max(1, Math.round(taken * 0.5));
    taken = Math.max(1, taken - soak);
    bloodLink(warden, t);
    shareBlow(warden, soak, u);
    log(`${warden.name}'s Blood Ward takes ${soak} of the blow meant for ${t.name}.`, warden.side);
    spendCharge(warden, has(warden, 'bloodward'), `${warden.name}'s Blood Ward is spent.`);
  }
  // Sworn Shield (Garrick's Nature): once per battle, the blow that would fell an ally finds
  // his shield instead — he takes it whole, whatever it is, and the ally takes nothing.
  if (taken >= t.hp && t.hp > 0 && !t.summon && !o.counter) {
    const g = alliesOf(t).find((a) => a !== t && a.hp > 0 && charNat(a).sworn && !a.swornUsed);
    if (g) {
      g.swornUsed = true;
      float(g, '🛡️ Sworn Shield', 'fx');
      log(`${g.name}'s Sworn Shield: he steps into the blow meant for ${t.name} — all ${taken} of it.`, g.side);
      g.hp = Math.max(0, g.hp - taken);
      bump(g, 'hurt');
      if (g.hp <= 0) fell(g, u);
      taken = 0;
    }
  }
  t.hp = Math.max(0, t.hp - taken);
  if (t.hp <= 0 && TP.lastStand && !t.lastStandUsed) {
    t.hp = 1; t.lastStandUsed = true;
    float(t, 'Unbreakable', 'fx');
    log(`${t.name} refuses to fall!`, t.side);
  }
  // Vanish in Ink (Octavia's Nature): the first blow to drop her below 30% meets a burst of ink.
  if (charNat(t).inkvanish && !t.inkUsed && t.hp > 0 && t.hp / t.maxHp < 0.3) {
    t.inkUsed = true;
    addFx(u, 'blind', 2);
    addFx(t, 'evade', 1);
    float(t, '🖤 Vanish in Ink', 'fx');
    log(`${t.name} vanishes in a burst of ink: ${u.name} is blinded, and anything that can miss her will, until her next turn.`, t.side);
  }
  t.lastHitBy = u.uid;
  // Mirror Dust double: a conjured copy can only soak so much. Every blow that lands spends one of
  // its eight; the eighth shatters it (swept by cleanupSummons on the next pass). Its own HP can drop
  // it sooner, and three of its turns fade it — whichever comes first. Only if it survived this hit.
  if (t.id === 'mirage' && taken > 0 && t.hp > 0 && (t.hitsLeft = (t.hitsLeft ?? 8) - 1) <= 0) t.spent = 'shattered';
  // Garrick: Retribution sends a share of every hit he takes to all of his enemies.
  if (TP.retribution) {
    const back = Math.max(1, Math.round(dmg * TP.retribution));
    log(`${t.name}'s Retribution strikes every enemy for ${back}.`, t.side);
    for (const f of openFoes(t)) {   // an area strike: the coffined and burrowed are out of reach
      f.hp = Math.max(0, f.hp - back);
      float(f, `${back}`, 'dot');
      if (f.hp <= 0) fell(f, t);
    }
  }

  // Fletcher's Line (Aelira's Nature): a hit costs her one Precision stack, never the whole draw.
  if (t.race === 'elf') { t.stacks = charNat(t).line ? Math.max(0, t.stacks - 1) : 0; t.hitSince = true; }
  if (t.race === 'dwarf') t.stacks = Math.min(stackCap(t), t.stacks + 1);

  knock(t, crit);
  if (crit && u.side === 'p' && !o.counter) questEvent('crit');   // bounties count your crits (not riposte counters)
  const mIcon = o.element ? `${ELEM_ICON[o.element] || '✨'} ` : '';   // magic / elemental hits show their element
  float(t, crit ? `${mIcon}${taken}!` : `${mIcon}${taken}`, crit ? 'crit' : 'dmg');   // a linked target pops only its own share
  log(`${u.name}'s ${label} hits ${t.name} for ${dmg}${crit ? ' (critical)' : ''}.`, u.side);

  if (u.faction === 'tide' && t.hp > 0) addFx(t, 'soaked', 2, 0, true);
  if (crit && P.critFx && t.hp > 0) for (const [id, turns, val] of P.critFx) { addFx(t, id, turns, val ? Math.round(u.atk * val) : 0); ownFx(u, t, id); }
  // Hesk: Ancestral Watch wards an ally the first time they drop below the threshold.
  if (t.hp > 0 && !t.watched && !t.summon && t.hp / t.maxHp < 0.3 && allyHas(t, 'guardian')) {
    t.watched = true;
    log(`The ancestors watch over ${t.name}.`, t.side);
    addFx(t, 'ward', 2);
  }
  // Defender passives that answer a hit (Ink Sac, Brimstone Hide, Riposte). Counters never chain.
  const oh = TP.onHitTaken;
  if (oh && !o.counter && t.hp > 0 && u.hp > 0 && (!oh.melee || u.role === 'melee') && chance(oh.chance)) {
    for (const [id, turns, val] of oh.fx) addFx(u, id, turns, val ? Math.round(t.atk * val) : 0);
  }
  // Heroic's answer: the guardian who stepped in lands a guaranteed full counter on the attacker.
  // Queued before the tally below, so it stands in for (not on top of) the generic counterattack.
  if (heroicHit && !o.counter && u.hp > 0 && t.hp > 0) {
    (state.counters ||= []).push({ by: t, at: u, mult: 1, label: 'Heroic', o: { counter: true, noDodge: true } });
  }
  // Ripostes and counterattacks are queued and played out once the attacker's blows have landed
  // (resolveCounters), so the defender visibly swings back. One per defender per action.
  const queued = (state.counters ||= []).some((c) => c.by === t);
  if (TP.riposte && !queued && !o.counter && !o.hurl && t.hp > 0 && u.hp > 0 && u.role === 'melee' && chance(TP.riposte.chance)) {
    state.counters.push({ by: t, at: u, mult: TP.riposte.mult, label: 'Riposte', o: { noDodge: true, counter: true } });
  }
  // Tusk and Board (Mogra's Nature): the first melee blow to land on her Guard is answered, every time.
  if (charNat(t).board && has(t, 'guard') && !t.boardSwung && !queued && !o.counter && !o.hurl
      && t.hp > 0 && u.hp > 0 && u.role === 'melee') {
    t.boardSwung = true;
    state.counters.push({ by: t, at: u, mult: 1, label: 'Tusk and Board', o: { counter: true } });
  }
  // Counterattack: any melee unit struck by another melee unit has a 10% chance to strike back.
  // The counter is a normal hit the original attacker can still dodge (per their stats) and never
  // chains (counter: true). Champions with a Riposte passive use that instead of this.
  else if (!TP.riposte && !queued && !o.counter && !o.hurl && t.hp > 0 && u.hp > 0 && t.role === 'melee' && !t.inert && u.role === 'melee' && chance(0.10)) {
    state.counters.push({ by: t, at: u, mult: 1, label: 'Counterattack', o: { counter: true } });
  }
  const th = has(t, 'thorns');
  if (th && u.hp > 0) {
    const back = Math.max(1, Math.round(dmg * 0.4));
    u.hp = Math.max(0, u.hp - back);
    float(u, `${back}`, 'dot');
    log(`${t.name}'s thorns reflect ${back} damage.`, t.side);
    if (u.hp <= 0) fell(u, t);
  }
  if (t.hp <= 0) fell(t, u);
  // Ironclad heat sears on contact — a living Mech burns whoever actually gets near it.
  // Only melee brings bodies together: a melee Mech closes in to strike, and a melee attacker
  // closes in to strike a Mech. Ranged units trade fire from afar and are never seared.
  if (u.faction === 'mech' && u.role === 'melee') searContact(u, t);   // a melee Mech's blow sears the enemy it struck
  if (t.faction === 'mech' && u.role === 'melee') searContact(t, u);   // striking a hot Mech up close burns the attacker
  return { dmg, crit };
}

// Restores mana (capped at max). Returns how much was actually gained.
function gainMp(u, amount, quiet = false) {
  if (!u.maxMp || u.hp <= 0) return 0;
  const got = Math.max(0, Math.min(amount, u.maxMp - u.mp));
  u.mp += got;
  if (got && !quiet) float(u, `+${got} MP`, 'mpf');
  return got;
}

function applyHitEffects(u, t, o) {
  if (t.hp <= 0) return;
  // Mana Burn: destroy some of the target's mana and deal that much as extra damage. Any mana burned
  // from a body makes it secrete it — blue liquid mana wells up and oozes out (burst 'mana').
  if (o.manaBurn && t.mp > 0) {
    const burned = Math.min(t.mp, o.manaBurn);
    t.mp -= burned;
    t.hp = Math.max(0, t.hp - burned);
    float(t, `-${burned} MP`, 'mpf');
    burst(t, 'mana');
    log(`${u.name} burns ${burned} of ${t.name}'s mana, dealing ${burned} extra damage.`, u.side);
    if (t.hp <= 0) { fell(t, u); return; }
  }
  // Mana Scorch (Wren's Power Slash): burn a share of the target's CURRENT mana — pure denial, no
  // extra damage — and make them bleed it just the same.
  if (o.manaBurnPct && t.mp > 0) {
    const burned = Math.round(t.mp * o.manaBurnPct);
    if (burned > 0) {
      t.mp = Math.max(0, t.mp - burned);
      float(t, `-${burned} MP`, 'mpf');
      burst(t, 'mana');
      log(`${u.name} burns away ${burned} of ${t.name}'s mana.`, u.side);
    }
  }
  // Seraphine: Echo makes her debuffs last longer; Aldous: Kindling makes his Burns hotter.
  const P = pv(u);
  for (const [id, turns, val] of o.fx || []) {
    const boost = P.dotBoost?.[id] || 1;
    const fuse = id === 'burn' && charNat(u).longfuse ? 1 : 0;   // Drekka's Nature: her Burns burn a turn longer
    addFx(t, id, turns + fuse + (P.fxLonger && FX[id].kind === 'bad' ? P.fxLonger : 0), val ? Math.round(u.atk * val * boost) : 0);
    ownFx(u, t, id);
  }
  // Entangle: mark the Slow it landed as rooted, so thorny roots grow at the target's feet (syncStatusFx).
  if (o.roots && has(t, 'slow')) has(t, 'slow').roots = true;
  for (const [id, turns, p] of o.chanceFx || []) if (chance(p)) { addFx(t, id, turns); ownFx(u, t, id); }
  if (o.knockback && t.hp > 0) {
    // Dug In (Howitzer) and The Slow March (Mordrek): some things refuse to be moved.
    if (charNat(t).anchor || charNat(t).march) {
      float(t, 'Unmoved', 'fx');
      log(`${t.name} does not give an inch.`, t.side);
    } else {
      t.pos = Math.max(0, (t.pos || 0) - o.knockback);
      t.recoil = true;   // renderTrack runs the icon back instead of snapping it
      float(t, 'Dragged back', 'fx');
      log(`${t.name} is dragged back along the speed bar.`, u.side);
      renderTrack(300);
    }
  }
  if (o.stun) {
    if (chance(o.stun)) addFx(t, 'stun', 1);
    else log(`${t.name} resists the stun.`, 'sys');
  }
}

// Ripostes and counterattacks queued by strikeOnce: the defender calls it, swings back with their own
// attack animation while the attacker is still in reach, and the blow lands.
async function resolveCounters() {
  const list = state.counters || [];
  state.counters = [];
  for (const c of list) {
    if (c.by.hp <= 0 || c.at.hp <= 0) continue;
    const riposte = c.label === 'Riposte';
    float(c.by, riposte ? 'Riposte!' : 'Counter!', 'fx');
    log(`${c.by.name} ${riposte ? 'ripostes' : 'counterattacks'}!`, c.by.side);
    await strikePose(c.by);
    markAttacked(c.at);
    strikeOnce(c.by, c.at, c.mult, c.label, c.o);
    render();
    await wait(260);
  }
}

/* DOUBLE ATTACK — a melee fighter's basic swing sometimes isn't the end of it: they strike the same
   enemy a second time at full force. Half the time they stay in reach and swing again on the spot;
   the other half they run back to their place, wheel round and charge in again. Only the free Attack
   rolls for it, never a skill, so it never doubles a 200% Blood Frenzy or an area Cleave. It is a
   property of fighting in reach, so melee summons and monsters get it too.
   A weapon's own `double` affix is not about reach — a repeater fires twice where a sledge swings
   twice — so it stacks on top for the melee and gives ranged champions a second shot. */
/* A rampage is a blur, not six separate attacks queued up: the leaps are short, the swings are
   driven through well before the clip would have finished, and barely a breath sits between one
   blow and the next. Six at full length ran about five seconds; this brings it under two. */
const RAMPAGE_DASH = 0.45, RAMPAGE_SWING = 0.38, RAMPAGE_GAP = 60;

const DOUBLE_ATTACK_CHANCE = 0.15;
// Krug's Red Mist: below half HP the whole chance doubles — the axes only get faster.
const doubleChance = (u) => ((u.role === 'melee' ? DOUBLE_ATTACK_CHANCE : 0) + (u.double || 0))
  * (charNat(u).redmist && u.hp / u.maxHp < 0.5 ? 2 : 1);
const rollsDouble = (u, sk) => sk.id === 'attack' && chance(doubleChance(u));

// EXECUTE (Vesper's signature) — he bleeds himself and every living ally for half their CURRENT HP
// and hurls the gathered blood at one enemy as a single Magic blow equal to all the HP taken. The
// sealed (coffined) are spared, the blood never takes a last point, and it costs no mana or blood
// beyond the warband's own. Routed straight through strikeOnce, so there is no Bloodthirst refund.
/* BURROW (Barrow) — he digs down into the grave-dirt for one round of the field's clock (TIMED_FX):
   no blow can be aimed at him and area attacks pass over him (outOfReach), and he holds his place on
   the speed bar meanwhile (frozen), so the whole round passes before he can act again. The figure
   sinks below the ground line and a fresh mound marks the spot (.unit.buried). He climbs back out
   when the round is up (expireTimed); unburrow in beginTurn is only a safety net. */
async function burrowSkill(u) {
  burst(u, 'smoke');
  tremorFx(380);
  addFx(u, 'burrowed', 1);
  render();
  await wait(750);
}
function unburrow(u) {
  if (!buried(u)) return;
  u.effects = u.effects.filter((e) => e.id !== 'burrowed');
  log(`${u.name} claws his way back up out of the grave.`, u.side);
  burst(u, 'smoke');
}

// Shown in three beats (see EXECUTE'S BLOOD RITE below): the blood streams out of every donor into
// Vesper, he throws it at the sky as a red pillar, and it comes back down as a torrent on the target.
async function executeSkill(u, t, sk) {
  const donors = alliesOf(u).filter((a) => a.hp > 0 && !outOfReach(a) && !a.inert);
  const takes = donors.map((a) => [a, Math.min(a.hp - 1, Math.floor(a.hp / 2))]).filter(([, n]) => n > 0);
  const pool = takes.reduce((n, [, take]) => n + take, 0);
  if (pool <= 0) { await castPose(u, true); log(`${u.name}'s Execute finds no blood to spend.`, u.side); return; }
  // The blood leaves each of them as their stream sets out for him, and their HP bars show it going.
  const gatherMs = beat(1300);
  for (const [a, take] of takes) {
    const was = a.hp;
    a.hp -= take;
    bleedBar(a, was, a.hp, gatherMs);
    burst(a, 'blood'); float(a, `${take}`, 'dot'); bump(a, 'hurt');
  }
  render();
  await bloodGather(u, takes.map(([a]) => a));
  log(`${u.name} gathers ${pool} HP of blood from the warband and drives it into ${t.name}.`, u.side);
  await bloodPillar(u);
  await bloodTorrent(t);   // returns as the torrent strikes; the blow lands with it
  strikeOnce(u, t, pool / Math.max(1, u.atk), 'Execute', { magic: true, noDodge: true, pierce: true });
  burst(t, 'blood');
  render();
  await wait(420);
}

async function damageSkill(u, t, sk) {
  const o = sk.o || {};
  state.counters = [];
  // Hallucinate: whoever singles out this target may swing at someone else entirely —
  // any other combatant, including the attacker's own allies. Area attacks are immune.
  if (sk.target === 'enemy' && t && pv(t).hallucinate && chance(pv(t).hallucinate)) {
    const others = [...foesOf(u), ...alliesOf(u)].filter((x) => x.uid !== t.uid && x.uid !== u.uid && !outOfReach(x));
    if (others.length) {
      const nt = pick(others);
      float(u, '🌀 Hallucinating', 'fx');
      log(`${u.name} hallucinates — the blow meant for ${t.name} lands on ${nt.name}!`, 'sys');
      t = nt;
    }
  }
  // Heroic (Wren, Garrick): a melee blow aimed at one of their allies may be intercepted by a sworn
  // guardian who leaps in front of that ally — planting themselves between it and the attacker — so
  // the charge below lands on them instead, and they answer with a full counter (queued in strikeOnce
  // off o.heroic). Decided here, before the dash, so they are already in the way when the blow falls.
  // Single-target melee only, never off a counter; interposeTo also handles the leap home afterwards.
  let heroicGuard = null, heroicTrip = null;
  if (u.role === 'melee' && !o.hurl && !o.gust && sk.target !== 'allEnemies' && t && !o.counter) {
    const g = alliesOf(t).find((a) => a !== t && a.hp > 0 && !has(a, 'rooted') && pv(a).heroic && chance(pv(a).heroic));
    if (g) {
      heroicGuard = g;
      float(g, '🛡️ Heroic', 'fx');
      log(`${g.name} throws into the path of the blow meant for ${t.name}, taking it in their place.`, g.side);
      heroicTrip = await interposeTo(g, t);
      t = g;
    }
  }
  const targets = sk.target === 'allEnemies' ? openFoes(u) : [t];
  // Front line: every melee this attack goes for counts toward their side's two, hit or miss.
  for (const tg of targets) markAttacked(tg);
  if (o.selfCost) {
    const c = Math.round(u.maxHp * o.selfCost);
    u.hp = Math.max(1, u.hp - c);
    float(u, `${c}`, 'dot');
  }
  // Melee champions (and melee summons) run in; everyone else shoots from where they stand.
  // Hurled skills (Last Rites) come down from the sky: no run-in, no shot, the caster stays put.
  // A gust or a wave is called up from where the caster stands: no run-in and no shot, whatever
  // their role - the water and the grave-wind do the traveling for them.
  const melee = u.role === 'melee' && !o.hurl && !o.gust && !o.watersweep;
  const proj = melee || o.hurl || o.gust || o.watersweep ? null : projectileFor(u, sk);
  let trip = melee ? await dashTo(u, targets) : null;   // reassigned if a Double Attack charges in again
  if (o.gust) { await castPose(u, true); await graveGust(u, targets); }   // the green grave-wind sweeps across first
  // Tharos holds his ground: the trident goes up for a Riptide and down into the floor for an
  // Undertow, and the wave rolls out to the targets either way.
  else if (o.watersweep) { await (o.slam ? tridentSlam(u) : tridentRaise(u)); waterSweep(u, targets); }
  else if (!melee && !o.hurl) await aimPose(u);
  if (o.leap && melee) await leapPose(u);      // Trident Lunge: a leap, then the overhead stab
  // Area attacks from range: every projectile flies at once, then the hits resolve.
  if (!melee && !o.gust && !o.watersweep && targets.length > 1) await Promise.all(targets.map((tg) => shoot(u, tg, proj)));
  let total = 0, lastHit = null;   // lastHit = whoever the blow landed on, for a weapon's enemy-HP drain
  // Seraxa: Flurry adds a hit to multi-hit skills. Sawtooth's Flywheel adds one at 50+ Heat.
  const hits = (o.hits || 1) + (o.hits > 1 ? (pv(u).extraHit || 0) + (charNat(u).flywheel && u.heat >= 50 ? 1 : 0) : 0);
  const struck = new Set();   // everyone a blow of this skill actually landed on (Last Rites pins only what it hit)
  const hitOnce = async (tg, mult) => {
    const r = strikeOnce(u, tg, mult, sk.name, tg === heroicGuard ? { ...o, heroic: true } : o);
    if (!r.miss) {
      struck.add(tg);
      total += r.dmg;
      lastHit = tg;
      applyHitEffects(u, tg, o);
      if (tg.hp <= 0 && pv(u).killHeal && u.hp > 0) healUnit(u, u, Math.round(u.maxHp * pv(u).killHeal), 'Bloodlust');
    }
    render();
    await wait(o.rampage ? RAMPAGE_GAP : hits > 1 ? 130 : 160);
  };
  /* RAMPAGE (Blood Frenzy): he throws himself at the one he was sent at, then tears through the
     warband at random for a fixed number of blows, jumping to whoever comes next. He is past
     choosing by then, so the draw is wholly random each time: the same enemy can take two in a
     row, and someone else may be missed entirely. The count is what he commits to - he lands all
     of them as long as anything is still standing and he is still on his feet. */
  if (melee && o.rampage) {
    u.frenzy = true;   // the axes run red for the whole of it (see .unit.frenzied)
    render();
    for (let i = 0; i < o.rampage; i++) {
      const live = singleFoes(u);   // the frenzy can only throw him at someone a blow can reach
      if (!live.length || u.hp <= 0) break;
      // The opener lands on his mark; every blow after it falls where the frenzy takes him.
      const at = i === 0 && t.hp > 0 ? t : pick(live);
      markAttacked(at);
      if (i > 0) trip = (await dashTo(u, [at], RAMPAGE_DASH)) || trip;   // the next leap, even back onto the same one
      await strikePose(u, true, sk, RAMPAGE_SWING);
      burst(at, 'blood');   // it comes off them as the axe goes through
      await hitOnce(at, sk.mult);
    }
    u.frenzy = false;
    render();
  }
  // Slam skills (wave / quake): the blow lands ONCE, and the rolling fire ring or tremor does
  // the traveling — hits land nearest-first, trailing the front as it rolls out from the slam.
  else if (melee && (o.wave || o.quake)) {
    await strikePose(u);
    if (o.wave) fireWave(u);
    if (o.quake) quakeFx(targets);
    const from = stageBox(u);
    const span = (t) => { const b = stageBox(t); return b && from ? Math.abs(b.x - from.x) : 0; };
    for (const tg of [...targets].sort((a, b) => span(a) - span(b))) {
      for (let i = 0; i < hits; i++) {
        if (tg.hp <= 0 || u.hp <= 0) break;
        await hitOnce(tg, sk.mult);
      }
    }
  } else for (const tg of targets) {
    for (let i = 0; i < hits; i++) {
      if (tg.hp <= 0 || u.hp <= 0) break;
      if (melee) await strikePose(u, false, sk, 1, tg);
      else if (o.hurl) await hurlCross(u, tg, i, sk);
      // A wave or a grave-wind does its own traveling (and has no projectile), even onto a single target.
      else if (!o.watersweep && !o.gust && targets.length === 1) await shoot(u, tg, proj);
      if (o.slash && melee) slashFx(tg, facing(u));
      await hitOnce(tg, sk.mult);
    }
  }
  /* A second swing or shot at another enemy, picked at random (Mara's Ricochet, Krug's Reckless
     Swing). A shot ricochets from where the attacker stands; a melee attacker carries himself
     over and swings there, so the blow lands where the enemy actually is. The run home at the
     end of the action picks up the new spot, and counters from it resolve with the rest. */
  if (o.bounce && u.hp > 0) {
    const next = singleFoes(u).filter((f) => !targets.includes(f));
    if (next.length) {
      const tg = pick(next);
      markAttacked(tg);
      if (melee) {
        log(`${u.name} wheels on ${tg.name} and swings again!`, u.side);
        trip = (await dashTo(u, [tg])) || trip;
        await strikePose(u, true, sk);   // fresh: the attack clip restarts for the second swing
      } else await shoot(u, tg, proj);
      await hitOnce(tg, sk.mult * o.bounce);
    }
  }
  // Arc Transfer (Arclight's Nature): lightning into a Soaked body finds a second path to ground.
  if (charNat(u).arc && o.element === 'lightning' && u.hp > 0 && lastHit && soaked(lastHit) && !o.counter) {
    const next = singleFoes(u).filter((f) => f !== lastHit);
    if (next.length) {
      const tg = pick(next);
      markAttacked(tg);
      float(tg, '⚡ Arc Transfer', 'fx');
      await hitOnce(tg, 0.3);
    }
  }
  if (o.hurl) settleCrosses(u, t, o.pin && struck.has(t));
  for (const [id, turns] of o.selfFx || []) if (u.hp > 0) addFx(u, id, turns);
  if (o.selfStacks) gainStacks(u, o.selfStacks);
  if (o.allyHeal && u.hp > 0) for (const a of alliesOf(u)) { burst(a, 'heal'); healUnit(u, a, healPower(u, o.allyHeal), sk.name); }
  if (o.allySteal && total && u.hp > 0) {
    const a = [...alliesOf(u)].sort((x, y) => x.hp / x.maxHp - y.hp / y.maxHp)[0];
    if (a) { burst(a, 'heal'); healUnit(u, a, Math.round(total * o.allySteal), sk.name); }
  }
  // Lifesteal: skill bonus + Crimson Court's Bloodthirst (20%), doubled under a Blood Moon.
  // Kept as a helper because a Double Attack's second swing has to drain exactly the same way.
  const drain = (dealt) => {
    if (!dealt || u.hp <= 0) return;
    let steal = (o.lifesteal || 0) + (u.lifesteal || 0) + (u.faction === 'crimson' ? 0.2 : 0);
    if (wx() === 'moon') steal *= 2;
    if (steal) healUnit(u, u, Math.round(dealt * steal), u.faction === 'crimson' && !o.lifesteal ? 'Bloodthirst' : sk.name);
    // The Court's blood tithe: on top of the share above, every attack drinks a fixed cut of what
    // the victim could hold, so a small cut on something huge is still worth taking. Measured on
    // whoever this swing last landed on — an area attack drinks from the last of them, once.
    if (u.faction === 'crimson' && lastHit) {
      let tithe = lastHit.maxHp * BLOOD_STEAL;
      if (wx() === 'moon') tithe *= 2;
      tithe = Math.round(tithe);
      if (tithe > 0 && u.hp < u.maxHp) healUnit(u, u, tithe, 'Bloodthirst');
    }
    if (u.manaSteal) gainMp(u, Math.round(dealt * u.manaSteal));   // mana lifesteal (from items)
    // Weapon drains (see THE ARMORY). These don't scale with the damage dealt but with a pool of HP:
    // the wielder's own total, the wound they are already carrying, or whatever the target has left.
    // One helping per swing that landed — so a Double Attack drinks twice — and a Blood Moon doubles
    // them like every other lifesteal.
    const w = u.steal;
    if (w && (w.max || w.lost || w.foe)) {
      const foeHp = lastHit && lastHit.hp > 0 ? lastHit.hp : 0;
      let got = u.maxHp * w.max + (u.maxHp - u.hp) * w.lost + foeHp * w.foe;
      if (wx() === 'moon') got *= 2;
      got = Math.round(got);
      // A champion already at full health has nothing to drain into, and one who cannot be mended
      // at all - inert, coffined, or standing Undying - turns every swing into a 'cannot be mended'
      // line. healUnit says so for a potion or an ally's spell, where the player spent something and
      // deserves to know; a passive drain firing it every swing only drowns that out. Mirrors the
      // early returns at the top of healUnit - keep the two in step.
      const mendable = u.hp < u.maxHp && !u.inert && !has(u, 'coffin') && !undyingOn(u);
      if (got > 0 && mendable) healUnit(u, u, got, wepOf(u.id)?.name || 'their weapon');
    }
  };
  drain(total);
  render();
  await wait(160);
  await resolveCounters();   // defenders strike back before the attacker runs home
  // Double Attack: a second full-strength swing at the same enemy. Rolled after the first swing
  // and any counter, so a swing that killed its target, or that cost the attacker their life
  // (thorns, Retribution, a counter), never comes back. Each second swing restarts the attack clip.
  if (rollsDouble(u, sk) && u.hp > 0 && t && t.hp > 0) {
    const stay = !trip || chance(0.5);
    float(u, 'Double Attack!', 'fx');
    const before = total;
    if (stay) {
      // Stay in reach and swing again straight away — or, at range, loose a second shot.
      log(melee ? `${u.name} keeps swinging: a second strike!` : `${u.name} looses a second shot!`, u.side);
      await wait(200);
      if (melee) await strikePose(u, true, sk);
      else { await aimPose(u); await shoot(u, t, proj); }
      await hitOnce(t, sk.mult);
    } else {
      // Run back to their place, wheel round, and charge in again.
      log(`${u.name} wheels around and comes back for a second swing!`, u.side);
      await dashBack(u, trip);
      await wait(260);   // a beat at home so the call-out reads before the second charge
      trip = await dashTo(u, [t]);
      await strikePose(u, true, sk);
      await hitOnce(t, sk.mult);
    }
    drain(total - before);
    render();
    await resolveCounters();
  }
  // A Shambler that falls in front of the enemy (a counter, thorns, Retribution...) doesn't walk
  // home: its corpse stays where it dropped, lying at the enemy's feet until it crumbles.
  if (trip && u.id === 'zombie' && u.hp <= 0) layoutSides();
  else if (trip) await dashBack(u, trip);
  // The guardian who threw themselves in front of an ally leaps back to their own place.
  if (heroicTrip && heroicGuard?.hp > 0) await dashBack(heroicGuard, heroicTrip);
  else if (heroicTrip) layoutSides();   // if they fell taking the blow, just restore the ranks
  await wait(120);
}

function healPower(u, mult, o = {}) {
  let m = u.atk * mult * (0.95 + Math.random() * 0.1);
  if (u.faction === 'tide' && highTide()) m *= 1.25 * (o.tideBonus || 1);
  if (u.faction === 'human' && u.combo) m *= 1 + disciplineBonus() + (charNat(u).rhythm ? 0.05 : 0);
  if (wx() === 'sun') m *= 1.2;
  if (wx() === 'rain' && u.faction === 'tide') m *= 1.2;
  return Math.round(m);
}

function healUnit(src, t, amount, label, o = {}) {
  if (t.hp <= 0 || t.inert) return;   // a Grave Cross is stone: nothing to mend
  // Shut in the coffin, or standing Undying: no mending reaches either of them.
  if (has(t, 'coffin') || undyingOn(t)) {
    float(t, 'No mending', 'fx');
    log(`${t.name} cannot be mended.`, 'sys');
    return;
  }
  const P = src === t ? {} : pv(src);
  if (P.lowHeal && t.hp / t.maxHp < P.lowHeal.below) amount = Math.round(amount * (1 + P.lowHeal.bonus));   // Liesl: Mercy
  if (P.healMp) gainMp(t, P.healMp);   // Maren: Tidecaller
  if (t.healTaken) amount = Math.round(amount * (1 + t.healTaken));   // worn kit: healing received
  if (charNat(src).reefgift && soaked(t)) amount = Math.round(amount * 1.2);   // Maren's Nature: water carries her gift
  if (has(t, 'hex') && !charNat(src).undimmed) amount = Math.round(amount * 0.5);   // Liesl's light goes where it will
  // Grave-flesh mends poorly: the Pale Host takes half of every spell and potion. Their own innate
  // feeding (Feast of the Fallen) comes straight out of the grave and passes `innate` to skip this.
  if (t.faction === 'undead' && !o.innate && !charNat(src).gravetongue) amount = Math.round(amount * 0.5);   // Mortessa speaks the grave's tongue
  if (wx() === 'pall' && !charNat(src).undimmed) amount = Math.round(amount * 0.75);   // Grave Pall dulls every mending but hers
  const got = Math.min(amount, t.maxHp - t.hp);
  t.hp += got;
  float(t, `+${got}`, 'heal');
  log(src === t ? `${t.name} recovers ${got} HP from ${label}.` : `${src.name}'s ${label} heals ${t.name} for ${got}.`, src.side);
  // Oil Can (Patchwork's Nature): every mend he gives carries a little maintenance with it.
  if (charNat(src).oilcan && src !== t) {
    if (t.faction === 'mech' && t.heat > 0) { t.heat = Math.max(0, t.heat - 15); float(t, 'Vented', 'fx'); }
    else if (t.maxMp) gainMp(t, 5);
  }
  // Overflowing Cup (Morwenna's Nature): what she cannot hold pours into her most hurt ally.
  if (charNat(src).overflow && src === t && !o.spill) {
    const spill = Math.round(amount - got);
    const a = spill > 0 && [...alliesOf(t)].filter((x) => x !== t && x.hp < x.maxHp).sort((x, y) => x.hp / x.maxHp - y.hp / y.maxHp)[0];
    if (a) healUnit(src, a, spill, 'Overflowing Cup', { spill: true });
  }
}

function cleanse(u) {
  const before = u.effects.length;
  u.effects = u.effects.filter((e) => FX[e.id].kind !== 'bad' || e.id === 'overheat');
  if (u.effects.length < before) float(u, 'Cleansed', 'fx');
}

async function healSkill(u, t, sk) {
  const o = sk.o || {};
  const targets = sk.target === 'allAllies' ? openAllies(u) : [t];
  await castPose(u, true);
  for (const a of targets) {
    if (o.lightbeam) await sacredLight(a);   // Sacred Light: the shaft lands before the mend pops
    burst(a, 'heal');
    healUnit(u, a, healPower(u, sk.mult, o), sk.name);
    if (o.cleanse) cleanse(a);
    if (o.manaRestore) gainMp(a, o.manaRestore);
    for (const [id, turns, val] of o.fx || []) {
      if (id === 'shield') burst(a, 'shield');
      addFx(a, id, turns, val ? Math.round(u.atk * val) : 0);
    }
  }
  for (const f of o.enemyFx ? openFoes(u) : []) {
    burst(f, 'curse');
    for (const [id, turns] of o.enemyFx) addFx(f, id, turns);
  }
  render();
  await wait(450);
}

async function buffSkill(u, t, sk) {
  const o = sk.o || {};
  const targets = sk.target === 'allAllies' ? openAllies(u) : sk.target === 'self' ? [u] : [t];
  await castPose(u, true);
  const ids = sk.fx.map(([id]) => id);
  const look = ids.includes('taunt') ? 'roar' : ids.some((id) => id === 'shield' || id === 'ward') ? 'shield' : 'buff';
  for (const a of targets) {
    burst(a, look);
    if (o.cleanse) cleanse(a);
    for (const [id, turns, val] of sk.fx) {
      addFx(a, id, turns, val ? Math.round(u.atk * val) : 0);
      if (o.charges && has(a, id)) has(a, id).charges = o.charges;
    }
    if (o.reduceCd) for (const k in a.cooldowns) a.cooldowns[k] = Math.max(0, a.cooldowns[k] - 1);
    if (o.heal) healUnit(u, a, healPower(u, o.heal), sk.name);
  }
  // Bolt-On: the caster welds himself to the target and rides along. The weld's four mends are
  // counted in the field's turns, whoever takes them (see THE TURN PULSE). Ranks mend harder.
  if (o.latch && t && t.hp > 0 && u.hp > 0) {
    if (u.attachedTo) detachLatch(u, 'recast');
    u.attachedTo = t.uid;
    u.latchLeft = 4;
    u.latchHeal = Math.round(15 * (1 + RANK_POWER * (sk.rank || 0)));
    addFx(u, 'bolted', 99, 0, true);
    log(`${u.name} bolts onto ${t.name}'s back: ${u.latchHeal} HP at each of the next 4 turns, and no single blow can find him.`, u.side);
    settleLatch();
  }
  if (o.selfStacks) gainStacks(u, o.selfStacks);
  render();
  await wait(450);
}

// Dwarves' Fortify (and elves' Precision) stacks, capped at 3.
function gainStacks(u, n) {
  if (u.hp <= 0) return;
  u.stacks = Math.min(stackCap(u), u.stacks + n);
  float(u, u.race === 'elf' ? 'Precision' : 'Fortify', 'fx');
}

// Timed effects live on the speed bar's clock instead of counting the unit's turns:
//   stun / overheat: the icon freezes for FREEZE_TIME.
//   stagger: for STAGGER_TIME the icon moves in fits, stopping STAGGER_STOP out of every STAGGER_CYCLE.
const TIMED_FX = { stun: 100, overheat: 100, stagger: 150, burrowed: 100 };   // 100 = one round (ROUND_TIME)
// Toll-counted effects live on the field's GLOBAL clock (Tolls), ticked once per turn in turnPulse,
// never on the owner's own turns. BASH and the coffin hold the unit off the speed bar while they
// last; FEAR only shoves it back (FEAR_BACK of the 1000-long track, about two turns of ground).
// FLEE (Grave Cross) is the slow fear: no shove, but each Toll the unit runs a step back, reaching
// the start line on the last one, and it is held off the bar until then (tollHeld).
const TOLL_FX = { bash: true, fear: true, coffin: true, flee: true };
const FEAR_BACK = 500, FEAR_TOLLS = 2, COFFIN_TOLLS = 2;

function addFx(u, id, turns, value = 0, quiet = false) {
  if (u.inert && id !== 'taunt') return;   // a planted Grave Cross takes nothing but its own Taunt
  // Bone Charm (immune) and Thick Skull (passive immune list) stop new debuffs.
  if (FX[id].kind === 'bad' && id !== 'overheat' && (has(u, 'immune') || pv(u).immune?.includes(id))) {
    if (!quiet) { float(u, 'Resisted', 'fx'); log(`${u.name} resists ${FX[id].label}.`, u.side); }
    return;
  }
  // Warding Pearl: the first N debuffs each battle are shrugged off. (Not Soaked, which the weather and
  // every Tideborn hit lay on quietly, nor the self-inflicted Overheat and wind-up.)
  if (FX[id].kind === 'bad' && !['overheat', 'soaked', 'windup'].includes(id) && (u.wardLeft ?? u.wardDebuffs) > 0) {
    u.wardLeft = (u.wardLeft ?? u.wardDebuffs) - 1;
    float(u, `${FX[id].icon} Warded`, 'fx');
    log(`${u.name}'s Warding Pearl turns aside ${FX[id].label}.`, u.side);
    return;
  }
  // Blessing Citrine: the first N buffs each battle last one turn longer.
  if (FX[id].kind === 'good' && !quiet && turns < 99 && (u.blessLeft ?? u.blessBuffs) > 0) {
