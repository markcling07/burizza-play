  rack: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 29V8M26 29V8M4 14h24M4 24h24" stroke="#7a5434" stroke-width="2"/><path d="M11 25V5M16 25V3M21 25V6" stroke="#c9d1de" stroke-width="2"/><path d="M8 9h6M13 7h6M18 10h6" stroke="#e8a548" stroke-width="1.6"/></svg>',
  bed: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 27V11M29 27V17" stroke="#6b4f32" stroke-width="2.4"/><rect x="3" y="17" width="26" height="6" fill="#7a5a3a"/><rect x="5" y="13" width="7" height="5" rx="2" fill="#e9e4d8"/><path d="M12 14h15q2 0 2 3H12z" fill="#9a2f36"/></svg>',
};

function buyDecor(k) {
  const d = DECOR[k];
  if (!d || ownsDecor(k) || profile.gold < d.price) return false;
  profile.gold -= d.price;
  profile.home.push(k);
  saveProfile();
  return true;
}

// Satchel ↔ stash, one at a time.
function storeItem(k) {
  const n = profile.items[k] || 0, m = profile.stash.items[k] || 0;
  if (!n || m >= stashCap()) return false;
  profile.items[k] = n - 1; profile.stash.items[k] = m + 1;
  saveProfile();
  return true;
}
function takeItem(k) {
  const n = profile.items[k] || 0, m = profile.stash.items[k] || 0;
  if (!m || n >= SATCHEL_MAX) return false;
  profile.items[k] = n + 1; profile.stash.items[k] = m - 1;
  saveProfile();
  return true;
}

// Put a stashed trinket on a champion; whatever they wore goes back into the stash.
function giveTrinket(k, id) {
  const st = profile.stash.trinkets, g = { ...gearRaw(id) };
  if (!TRINKETS[k] || !charById(id) || !(st[k] > 0) || g.t === k || (TRINKETS[k].mana && !hasMana(id))) return false;
  st[k]--;
  if (g.t) st[g.t] = (st[g.t] || 0) + 1;
  g.t = k;
  profile.gear[id] = g;
  saveProfile();
  return true;
}
/* CARNIVAL — booths for mini-games that pay out gold.
   To add a game, give its booth a play() function:
     play(host, finish)  draws the game inside `host` (an empty <div>) and calls finish(coins)
                         once when the round is over. coins = what the player won (0 is fine).
   The carnival charges `cost` gold up front, pays out min(coins, maxPrize), keeps records in
   profile.carnival, and stops redrawing the booth panel while a game is running.
   A booth without play() shows as "Coming soon". */
const CARNIVAL_GAMES = [
  { id: 'ringtoss', name: 'Ring Toss', cost: 10, maxPrize: 40, pitch: 'Land a ring on a bottle neck. Easy! (It is not easy.)',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 29h16" stroke="#7a5434" stroke-width="3"/><path d="M13 28v-9l2-4v-6h2v6l2 4v9z" fill="#3f7a4f" stroke="#1d2130" stroke-width="1"/><ellipse cx="16" cy="11" rx="7" ry="2.6" fill="none" stroke="#e8a548" stroke-width="2.2"/></svg>' },
  { id: 'knives', name: 'Knife Throw', cost: 15, maxPrize: 60, pitch: 'Three knives, one spinning target. Mind the assistant.',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="15" cy="17" r="11" fill="#e9e4d8" stroke="#c0303f" stroke-width="2"/><circle cx="15" cy="17" r="6.5" fill="none" stroke="#c0303f" stroke-width="2"/><circle cx="15" cy="17" r="2.2" fill="#c0303f"/><path d="M29 3l-12 12" stroke="#c9d1de" stroke-width="2.4"/><path d="M29 3l-3 1 2 2z" fill="#c9d1de"/><path d="M19 13l-2 2" stroke="#6b4f32" stroke-width="3"/></svg>' },
  { id: 'wheel', name: 'Wheel of Ash', cost: 20, maxPrize: 100, pitch: 'Spin the great wheel. Gold, glory, or a face full of soot.',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="15" r="12" fill="#e8a548" stroke="#2a2228" stroke-width="1.4"/><path d="M16 3v24M4 15h24M7.5 6.5l17 17M24.5 6.5l-17 17" stroke="#c0303f" stroke-width="2"/><circle cx="16" cy="15" r="2.5" fill="#2a2228"/><path d="M14 30h4l-2-3z" fill="#2a2228"/></svg>' },
  { id: 'bell', name: "Strongman's Bell", cost: 10, maxPrize: 50, pitch: 'Swing the hammer, ring the bell, impress absolutely everyone.',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="14" y="7" width="4" height="22" fill="#7a5434"/><path d="M12 29h8" stroke="#4a3426" stroke-width="3"/><path d="M11 8a5 5 0 0 1 10 0v2H11z" fill="#e8a548" stroke="#b08a2e" stroke-width="1"/><rect x="14.8" y="16" width="2.4" height="5" fill="#c0303f"/><path d="M4 26l6-6" stroke="#6b4f32" stroke-width="2.4"/><rect x="7" y="16" width="7" height="4" rx="1" transform="rotate(45 10 18)" fill="#9aa3b5"/></svg>' },
];
const gameById = (id) => CARNIVAL_GAMES.find((g) => g.id === id);

// Pays the entry fee and opens the booth; the panel then draws #boothHost and runBooth() starts the game.
function startBooth(id) {
  const g = gameById(id);
  if (!g?.play || state.booth || profile.gold < (g.cost || 0)) return false;
  profile.gold -= g.cost || 0;
  profile.carnival.plays++;
  saveProfile();
  state.booth = id;
  state.boothNews = '';
  return true;
}

function runBooth() {
  const g = gameById(state.booth), host = $('#boothHost');
  if (!g || !host) return;
  let over = false;
  g.play(host, (coins) => {
    if (over || state.booth !== g.id) return;   // only the first finish() counts, and only if you're still at the booth
    over = true;
    const prize = clamp(Math.round(coins) || 0, 0, g.maxPrize ?? Infinity);
    profile.gold += prize;
    profile.carnival.won += prize;
    profile.stats.earned += prize;
    saveProfile();
    state.booth = null;
    state.boothNews = prize ? `${g.name}: you won ${prize} gold!` : `${g.name}: no prize this time.`;
    if (prize) keeperReact('carnival');
    render();
  });
}

/* BOUNTY BOARD — three jobs posted each day (local date), paid in gold when claimed.
   profile.bounty = { day: 'YYYY-MM-DD', list: [{ type, n, p, gold, prog, done, claimed }] }
     type = a key of BOUNTY_TYPES, n = how many times it must happen, p = an optional parameter
     (a faction key, a round limit…), prog = progress so far.
   A bounty type is { roll() → { n, p }, gold(b), text(b), count(b, t, info) → how much event t adds }.
   Progress comes from questEvent(t, info), which calls bountyEvent first: 'win' { vs, flawless, rounds, kills },
   'loss' { kills }, 'crit', 'item' { key }, plus any event other systems fire. New bounty kinds
   (monsters, dungeons…) just add a type here and fire their own questEvent. */
const BOUNTY_REROLL = 25;   // gold to have a fresh set posted today
const BOUNTY_TYPES = {
  win:      { roll: () => ({ n: pick([2, 3]) }), gold: (b) => 15 * b.n + 10, text: (b) => `Win ${b.n} battles.`,
              count: (b, t) => (t === 'win' ? 1 : 0) },
  winvs:    { roll: () => ({ n: 1, p: pick(FACTION_KEYS) }), gold: () => 45, text: (b) => `Defeat ${theFaction(FACTIONS[b.p])} in battle.`,
              count: (b, t, i) => (t === 'win' && i.vs === b.p ? 1 : 0) },
  flawless: { roll: () => ({ n: 1 }), gold: () => 60, text: () => 'Win a battle without losing a champion.',
              count: (b, t, i) => (t === 'win' && i.flawless ? 1 : 0) },
  quick:    { roll: () => ({ n: 1, p: pick([4, 5]) }), gold: (b) => (b.p <= 4 ? 70 : 50), text: (b) => `Win a battle within ${b.p} rounds.`,
              count: (b, t, i) => (t === 'win' && i.rounds <= b.p ? 1 : 0) },
  crit:     { roll: () => ({ n: pick([5, 8]) }), gold: (b) => 4 * b.n + 10, text: (b) => `Land ${b.n} critical hits.`,
              count: (b, t) => (t === 'crit' ? 1 : 0) },
  item:     { roll: () => ({ n: pick([2, 3]) }), gold: (b) => 12 * b.n, text: (b) => `Use ${b.n} satchel items in battle.`,
              count: (b, t) => (t === 'item' ? 1 : 0) },
  kill:     { roll: () => ({ n: pick([6, 9]) }), gold: (b) => 5 * b.n, text: (b) => `Defeat ${b.n} enemy champions.`,
              count: (b, t, i) => (t === 'win' || t === 'loss' ? i.kills || 0 : 0) },
  // Emberhollow Cave: slay a kind of monster you can already reach, or win hunts.
  slay:     { roll: () => {
                const lv = heroLevel(), reach = CAVE_DEPTHS.filter((d) => lv >= d.minLv).flatMap((d) => d.pool);
                const p = pick([...new Set(reach)]);
                return { n: ['glowcap', 'bonerattler'].includes(p) ? 3 : 5, p };
              },
              gold: (b) => 8 * b.n + 10, text: (b) => `Slay ${b.n} ${MONSTERS[b.p].plural} in Emberhollow Cave.`,
              count: (b, t, i) => (t === 'slay' && i.monster === b.p ? 1 : 0) },
  hunt:     { roll: () => ({ n: pick([2, 3]) }), gold: (b) => 18 * b.n, text: (b) => `Win ${b.n} hunts in Emberhollow Cave.`,
              count: (b, t) => (t === 'hunt' ? 1 : 0) },
  // Dungeons: only posted once you're strong enough to enter one (see the ok() filter in postBounties).
  delve:    { ok: () => heroLevel() >= DUNGEONS[0].minLv,
              roll: () => ({ n: 1 }), gold: () => 120, text: () => 'Clear a dungeon past the Expedition Gate.',
              count: (b, t, i) => (t === 'dungeon' && i.cleared ? 1 : 0) },
  bossbane: { ok: () => heroLevel() >= DUNGEONS[0].minLv,
              roll: () => ({ n: 1 }), gold: () => 90, text: () => 'Defeat a dungeon boss.',
              count: (b, t) => (t === 'boss' ? 1 : 0) },
};
const enemyKills = () => state.teams.e.filter((u) => !u.summon && !alive(u)).length;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const bountyText = (b) => BOUNTY_TYPES[b.type]?.text(b) ?? 'A job that is no longer posted.';

function postBounties() {
  profile.bounty = {
    day: today(),
    list: shuffle(Object.keys(BOUNTY_TYPES).filter((k) => !BOUNTY_TYPES[k].ok || BOUNTY_TYPES[k].ok())).slice(0, 3).map((type) => {
      const b = { type, ...BOUNTY_TYPES[type].roll(), prog: 0, done: false, claimed: false };
      return { ...b, gold: BOUNTY_TYPES[type].gold(b) };
    }),
  };
  saveProfile();
}
// Today's board, posting a fresh set if the day has changed.
function bountyBoard() {
  if (profile.bounty?.day !== today()) postBounties();
  return profile.bounty;
}

function bountyEvent(t, info = {}) {
  const news = [];
  let moved = false;
  for (const b of bountyBoard().list) {
    const add = !b.done && BOUNTY_TYPES[b.type] ? BOUNTY_TYPES[b.type].count(b, t, info) : 0;
    if (!add) continue;
    b.prog = Math.min(b.n, b.prog + add);
    moved = true;
    if (b.prog >= b.n) { b.done = true; news.push(`Bounty complete: ${bountyText(b)} Claim ${b.gold} gold at the Bounty Board.`); }
  }
  if (moved) saveProfile();
  return news;
}

function claimBounty(i) {
  const b = bountyBoard().list[i];
  if (!b?.done || b.claimed) return false;
  b.claimed = true;
  const pay = guildBountyGold(b.gold);   // the Oathbound take a bigger cut
  profile.gold += pay;
  profile.stats.earned += pay;
  saveProfile();
  return true;
}

function rerollBounties() {
  const cost = guildPct('bounty') ? 0 : BOUNTY_REROLL;   // the Oathbound get fresh postings for free
  if (profile.gold < cost) return false;
  profile.gold -= cost;
  postBounties();
  return true;
}

/* ==================================================================
   GUILDS — the Guild House. You belong to one guild at a time; each
   grants a standing perk that grows with your rank. Favor comes from
   victories (+1, +2 for a gauntlet clear or dungeon boss) and is
   remembered per guild, so switching back picks up where you left.
   ================================================================== */
const GUILDS = {
  purse:    { name: 'The Gilded Purse',  color: '#e8a548', motto: 'Contracts, cuts and coin.',
              perk: 'gold',   desc: (pct) => `Victories pay ${pct}% more gold — arena, duels, hunts and dungeon rooms.` },
  scholars: { name: 'The Ember Scholars', color: '#7fb5e6', motto: 'Every scar is a lesson.',
              perk: 'xp',     desc: (pct) => `Battles teach ${pct}% more XP, even lost ones.` },
  oath:     { name: 'The Oathbound',      color: '#6cc28a', motto: 'The job is the oath.',
              perk: 'bounty', desc: (pct) => `Bounty jobs pay ${pct}% more, and Holt posts fresh jobs for free.` },
};
const GUILD_RANKS = [
  { name: 'Initiate',       at: 0,  pct: 10 },
  { name: 'Journeyman',     at: 10, pct: 15 },
  { name: 'Veteran',        at: 25, pct: 20 },
  { name: 'Guild Champion', at: 50, pct: 25 },
];
const GUILD_SWITCH_COST = 50;
const myGuild = () => (profile.guild?.id ? GUILDS[profile.guild.id] : null);
const guildFavor = (id = profile.guild?.id) => profile.guild?.favor?.[id] || 0;
const guildRankIdx = (favor = guildFavor()) => GUILD_RANKS.reduce((r, x, i) => (favor >= x.at ? i : r), 0);
// The perk percentage you enjoy for `perk`, or 0 if your guild doesn't grant it.
const guildPct = (perk) => (myGuild()?.perk === perk ? GUILD_RANKS[guildRankIdx()].pct : 0);
const guildGold = (n) => Math.round(n * (1 + guildPct('gold') / 100));
const guildBountyGold = (n) => Math.round(n * (1 + guildPct('bounty') / 100));

// A victory's favor. Returns news lines for the battle log and reward screen.
function guildWin(big = false) {
  const g = myGuild();
  if (!g) return [];
  const id = profile.guild.id, gain = 1 + (big ? 1 : 0);
  const before = guildRankIdx();
  profile.guild.favor = profile.guild.favor || {};
  profile.guild.favor[id] = (profile.guild.favor[id] || 0) + gain;
  const after = guildRankIdx();
  return after > before
    ? [`+${gain} favor. You rise to ${GUILD_RANKS[after].name} of ${g.name}!`]
    : [`+${gain} favor with ${g.name}.`];
}

function joinGuild(id) {
  if (!GUILDS[id] || profile.guild?.id === id) return false;
  const first = !profile.guild?.id;
  if (!first && profile.gold < GUILD_SWITCH_COST) return false;
  if (!first) profile.gold -= GUILD_SWITCH_COST;
  profile.guild = { id, favor: { ...(profile.guild?.favor || {}) } };
  saveProfile();
  return true;
}

function unequipTrinket(id) {
  const g = { ...gearRaw(id) };
  if (!g.t) return false;
  profile.stash.trinkets[g.t] = (profile.stash.trinkets[g.t] || 0) + 1;
  delete g.t;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

/* Jeweler: one trinket per champion, saved as profile.gear[id].t. `bonus` feeds gearOf → makeUnit,
   which already reads mp / mpRegen / manaSteal / hpRegen / agi. mana: true = useless without a mana pool. */
const TRINKETS = {
  sapphire:    { name: 'Sapphire Pendant', price: 120, mana: true, bonus: { mp: 30 }, desc: '+30 max MP.' },
  moonstone:   { name: 'Moonstone Ring', price: 140, mana: true, bonus: { mpRegen: 4 }, desc: '+4 MP at the start of every turn.' },
  fang:        { name: 'Leech Fang', price: 160, mana: true, bonus: { manaSteal: 0.15 }, desc: 'Regain MP equal to 15% of the damage this champion deals.' },
  trollblood:  { name: 'Troll-blood Amulet', price: 150, bonus: { hpRegen: 6 }, desc: '+6 HP at the start of every turn, on top of normal regen.' },
  quicksilver: { name: 'Quicksilver Band', price: 220, bonus: { agi: 2 }, desc: '+2 Agility: more turns, and a little more dodge.' },
  phantomlocket:{ name: 'Phantom Locket', price: 240, mana: true, bonus: { mpRegen: 3, hpRegen: 3 }, desc: '+3 MP and +3 HP at the start of every turn.' },
  crownshard:  { name: 'Crown Shard', price: 300, bonus: { atkPct: 0.08 }, desc: '+8% Attack.' },
  hagthorn:    { name: "Hag's Thorn", price: 340, bonus: { hpPct: 0.1 }, desc: '+10% max HP.' },
};
const TRINKET_KEYS = Object.keys(TRINKETS);
const TRINKET_ICON = {
  sapphire: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 4Q16 17 25 4" stroke="#d9b44a" stroke-width="1.6" fill="none"/><path d="M16 13l6 7-6 9-6-9z" fill="#5b97e6" stroke="#e9f8ff" stroke-width="1.2" stroke-linejoin="round"/><path d="M12.5 19.5l3.5-3.5 3.5 3.5" stroke="#bfe0ff" stroke-width="1" fill="none"/></svg>',
  moonstone: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="11" r="8" fill="#bfefff" opacity=".25"/><circle cx="16" cy="21" r="7.5" fill="none" stroke="#c9d1de" stroke-width="3"/><ellipse cx="16" cy="11" rx="5" ry="4.5" fill="#eef3ff" stroke="#9aa3b5" stroke-width="1.2"/><ellipse cx="14.5" cy="10" rx="1.6" ry="1.2" fill="#fff"/></svg>',
  fang: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7Q12 2 17 4" stroke="#8a6a3a" stroke-width="1.4" fill="none"/><path d="M12 4Q20 4 21 10Q20 20 14 28Q15 18 11 10Q10 6 12 4Z" fill="#efe6d2" stroke="#9a8a70" stroke-width="1.2" stroke-linejoin="round"/><path d="M14.5 27Q16.5 22 16 18" stroke="#c0303f" stroke-width="1.6" fill="none"/><circle cx="14" cy="29" r="1.5" fill="#c0303f"/></svg>',
  trollblood: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 4Q16 12 23 4" stroke="#8a6a3a" stroke-width="1.6" fill="none"/><circle cx="16" cy="19" r="8.5" fill="#6b4f32" stroke="#b07d3e" stroke-width="1.6"/><circle cx="16" cy="19" r="5" fill="#6cc28a"/><circle cx="14.5" cy="17.5" r="1.6" fill="#d8ffe0"/></svg>',
  quicksilver: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 12h6M2 17h6M4 22h5" stroke="#9fd6ff" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="19" cy="17" rx="10" ry="7.5" fill="none" stroke="#dfe7f2" stroke-width="3.5"/><ellipse cx="19" cy="17" rx="10" ry="7.5" fill="none" stroke="#9aa3b5" stroke-width="1"/><circle cx="25" cy="12" r="1.3" fill="#fff"/></svg>',
};
const hasMana = (id) => !!MANA.pool[charById(id).faction];
const trinketRefund = (k) => Math.floor(TRINKETS[k].price / 2);

// A new trinket goes on the champion; the one they wore is sent home to the stash.
function buyTrinket(k) {
  const id = forgeHero(), g = { ...gearRaw(id) }, cost = TRINKETS[k]?.price;
  if (!TRINKETS[k] || g.t === k || (TRINKETS[k].mana && !hasMana(id)) || profile.gold < cost) return false;
  profile.gold -= cost;
  if (g.t) profile.stash.trinkets[g.t] = (profile.stash.trinkets[g.t] || 0) + 1;
  g.t = k;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

function sellTrinket() {
  const id = forgeHero(), g = { ...gearRaw(id) };
  if (!g.t) return false;
  profile.gold += trinketRefund(g.t);
  delete g.t;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

/* ==================================================================
   RENDERING — shared bits
   ================================================================== */
function log(text, kind) {
  state.log.unshift({ text, kind });
  if (state.log.length > 120) state.log.length = 120;
  const el = $('#log');
  if (el) el.innerHTML = state.log.map((l) => `<li class="${l.kind}">${l.text}</li>`).join('');
}

function bump(u, cls) {
  const el = document.querySelector(`#u-${u.uid} .upic`);
  if (!el) return;
  el.classList.remove('lunge', 'hurt', 'cast');
  void el.offsetWidth;
  el.classList.add(cls);
}

function float(u, text, kind) {
  const host = document.querySelector(`#u-${u.uid} .upic`);
  if (!host) return;
  const el = document.createElement('span');
  el.className = `float ${kind}`;
  el.textContent = text;
  // Stack popups that land in the same instant (damage, lifesteal, MP, status) so they never overlap.
  const stack = host.querySelectorAll('.float').length;
  el.style.marginTop = `${stack * 18}px`;
  el.style.marginLeft = `${Math.round((Math.random() - 0.5) * 16)}px`;
  host.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

function render() {
  $('#villageScreen').hidden = state.screen !== 'village';
  $('#selectScreen').hidden = state.screen !== 'select';
  $('#skillsScreen').hidden = state.screen !== 'skills';
  $('#battleScreen').hidden = state.screen !== 'battle';
  $('#ladder').hidden = state.screen !== 'battle';
  // In the village the page header steps aside: your champion and purse sit on the map's top-right corner.
  const inTown = state.screen === 'village', hud = inTown ? $('#townHud') : $('.topR');
  $('#top').hidden = inTown;
  document.body.classList.toggle('inTown', inTown);
  document.body.dataset.screen = state.screen;
  if ($('#purse').parentElement !== hud) {
    if (inTown) hud.prepend($('#herotag'), $('#purse'));   // the gear stays rightmost
    else hud.append($('#herotag'), $('#purse'));
  }
  renderPurse();
  renderHeroTag();
  if (state.screen === 'village') renderVillage();
  else if (state.screen === 'select') renderSelect();
  else if (state.screen === 'skills') renderSkills();
  else renderBattle();
}

/* ==================================================================
   RENDERING — Skills screen (your champion's loadout)
   ================================================================== */
const currentLoadout = () => { const c = charById(profile.hero.id); return heroLoadout(c, heroLevel()); };

function loadoutCardHTML(c, kind, id, on) {
  const s = kind === 'act' ? activeById(c, id) : passiveById(c, id);
  const r = kind === 'act' ? skillRank(c.id, id) : 0;
  const canUp = kind === 'act' && skillPoints(c.id) > 0 && r < RANK_CAP;
  const tag = kind === 'act'
    ? (NEUTRAL_SKILLS[id] ? 'Neutral' : id === 'b' ? `★ Signature · from turn ${ULT_FIRST_TURN}` : 'Active')
      + (MANA.pool[c.faction] ? ` · ${s.o?.mp ?? (id === 'a' ? MANA.skillCost : id === 'c' ? MANA.skill2Cost : MANA.ultCost)} MP` : '')
      + (s.cd ? ` · cooldown ${s.cd}` : '')
      + (r ? ` · Rank ${r}/${RANK_CAP}` : '')
    : id === 'own' ? `${shortName(c)}'s passive` : id === 'alt' ? `${shortName(c)}'s other passive` : 'Learned passive';
  const rkrow = r || canUp ? `<span class="rkrow">
      ${r ? `<span class="rkd">Rank ${r}: ${rankBonusText(s, r)}</span>` : ''}
      ${canUp ? `<span class="rkup" role="button" tabindex="0" data-rank="${id}" aria-label="Spend a skill point: raise ${s.name} to rank ${r + 1}">+1 Rank</span>` : ''}
    </span>` : '';
  return `<button class="lcard${on ? ' on' : ''}" type="button" data-sk="${kind}:${id}" aria-pressed="${on}">
    <span class="lic">${skillIcon(s)}</span>
    <span class="lt"><b>${s.name}</b><small>${tag}</small><span class="ld">${s.desc}</span>${rkrow}</span>
    <span class="lstate">${on ? 'Equipped' : 'Equip'}</span>
  </button>`;
}

// Slot row: equipped skills, empty slots you can fill, and slots that unlock at a later level.
function slotRowHTML(c, kind, ids) {
  const lv = heroLevel(), open = kind === 'act' ? activeSlots(lv) : passiveSlots(lv);
  const later = SLOT_UNLOCKS.filter((s) => s.kind === kind && s.lv > lv);
  const cells = [];
  for (let i = 0; i < open; i++) {
    const id = ids[i];
    const s = id ? (kind === 'act' ? activeById(c, id) : passiveById(c, id)) : null;
    cells.push(s ? `<div class="lslot filled">${skillIcon(s)}<span>${s.name}</span></div>` : '<div class="lslot empty"><span>Empty slot</span></div>');
  }
  for (const s of later) cells.push(`<div class="lslot locked"><span>Unlocks at level ${s.lv}</span></div>`);
  return `<div class="lslots">${cells.join('')}</div>`;
}

function renderSkills() {
  if (!profile.hero) { state.screen = 'select'; return render(); }
  const c = charById(profile.hero.id), lv = heroLevel(), lo = currentLoadout();
  $('#tagline').textContent = `Season 1: Ashfall Road. Choose the skills ${heroName()} brings into battle.`;
  const pts = skillPoints(c.id);
  $('#skillsInfo').textContent = `${heroName()} · ${c.name} · level ${lv}. ${activeSlots(lv)} active and ${passiveSlots(lv)} passive slot${passiveSlots(lv) === 1 ? '' : 's'}. Attack and Guard are always available.`
    + ` Skill points: ${pts}${pts ? ' — spend them below with +1 Rank (+8% power each)' : ' — every level-up grants one'}.`;
  $('#skillsBody').innerHTML = `
    <section class="lsec">
      <header><h2>Active skills</h2><p class="rule">Click a skill to equip or unequip it. More slots open at levels ${SLOT_UNLOCKS.filter((s) => s.kind === 'act').map((s) => s.lv).join(' and ')}.</p></header>
      ${slotRowHTML(c, 'act', lo.act)}
      <div class="lpool">${ACTIVE_IDS.map((id) => loadoutCardHTML(c, 'act', id, lo.act.includes(id))).join('')}</div>
    </section>
    <section class="lsec">
      <header><h2>Neutral skills</h2><p class="rule">Tricks any champion can learn, whatever their class. They share your active slots.</p></header>
      <div class="lpool">${NEUTRAL_KEYS.map((id) => loadoutCardHTML(c, 'act', id, lo.act.includes(id))).join('')}</div>
    </section>
    <section class="lsec">
      <header><h2>Passives</h2><p class="rule">Your champion's own passive, or a learned one. A second passive slot opens at level ${SLOT_UNLOCKS.find((s) => s.kind === 'pas').lv}.</p></header>
      ${slotRowHTML(c, 'pas', lo.pas)}
      <div class="lpool">${passivePool(c).map((id) => loadoutCardHTML(c, 'pas', id, lo.pas.includes(id))).join('')}</div>
    </section>`;
}

function toggleLoadout(kind, id) {
  const lv = heroLevel(), lo = currentLoadout(), list = lo[kind];
  const max = kind === 'act' ? activeSlots(lv) : passiveSlots(lv);
  $('#skillsNote').textContent = '';
  const i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1);
  else if (list.length < max) list.push(id);
  else { $('#skillsNote').textContent = `All ${kind === 'act' ? 'active' : 'passive'} slots are full. Unequip one first.`; return; }
  profile.loadout = lo;
  saveProfile();
  renderSkills();
}

function buildSkills() {
  $('#skillsBody').addEventListener('click', (ev) => {
    // The +1 Rank chip sits inside the card button: spend the point, don't toggle the slot.
    const up = ev.target.closest('[data-rank]');
    if (up) {
      const c = charById(profile.hero.id), id = up.dataset.rank;
      rankUp(id);
      const s = activeById(c, id), r = skillRank(c.id, id), left = skillPoints(c.id);
      $('#skillsNote').textContent = `${s.name} is now rank ${r} — ${rankBonusText(s, r)}. ${left} skill point${left === 1 ? '' : 's'} left.`;
      renderSkills();
      return;
    }
    const b = ev.target.closest('[data-sk]');
    if (!b) return;
    const [kind, id] = b.dataset.sk.split(':');
    toggleLoadout(kind, id);
  });
  // The chip is a span inside a button, so Enter/Space need a hand to act like a click.
  $('#skillsBody').addEventListener('keydown', (ev) => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('[data-rank]')) {
      ev.preventDefault();
      ev.target.click();
    }
  });
  $('#skillsBack').addEventListener('click', () => { toVillage(); openPlace('arena'); });
  $('#skillsAuto').addEventListener('click', () => {
    profile.loadout = autoLoadout(charById(profile.hero.id), heroLevel());
    saveProfile();
    $('#skillsNote').textContent = '';
    renderSkills();
  });
}

// Your champion in the header: portrait, name, level and XP progress. Hidden until you create one.
function renderHeroTag() {
  const el = $('#herotag');
  el.hidden = !profile.hero;
  if (!profile.hero) return;
  const key = `${profile.hero.id}|${heroName()}|${heroLevel()}|${profile.xp}`;
  if (el.dataset.k === key) return;
  el.dataset.k = key;
  el.innerHTML = `<span class="hmini">${spriteSVG(profile.hero.id)}</span>
    <span class="hinfo"><b>${heroName()}</b>${xpBarHTML()}</span>`;
}

let shownGold = null;
function renderPurse() {
  const el = $('#purse');
  if (shownGold === profile.gold) return;
  el.innerHTML = `${COIN}<span>${profile.gold}</span>`;
  el.setAttribute('aria-label', `${profile.gold} gold`);
  if (shownGold != null && profile.gold > shownGold) { el.classList.remove('gain'); void el.offsetWidth; el.classList.add('gain'); }
  shownGold = profile.gold;
}

/* ==================================================================
   RENDERING — team select
   ================================================================== */
function buildSelect() {
  $('#filters').innerHTML = [['all', 'All factions'], ...FACTION_KEYS.map((k) => [k, FACTIONS[k].name])]
    .map(([k, n]) => `<button class="fbtn" type="button" data-f="${k}">${n}</button>`).join('');
  $('#filters').addEventListener('click', (ev) => {
    const b = ev.target.closest('.fbtn');
    if (!b) return;
    state.filter = b.dataset.f;
    renderSelect();
  });

  $('#factionList').innerHTML = FACTION_KEYS.map((k) => {
    const f = FACTIONS[k];
    const cards = ROSTER.filter((c) => c.faction === k).map((c) => `
      <button class="pick" type="button" data-id="${c.id}" id="pick-${c.id}">
        <div class="pic">${spriteSVG(c.id)}</div>
        <span class="nm">${c.name}</span>
        <span class="role ${c.role}">${ROLES[c.role].label}</span>
        <p class="bio">${c.bio}</p>
        <ul class="sk">
          <li>${skillIcon(c.skills[0])}<span><b>${c.skills[0].name}.</b> ${c.skills[0].desc}</span></li>
          <li>${skillIcon(c.skills[2])}<span><b>${c.skills[2].name}.</b> ${c.skills[2].desc}</span></li>
          <li>${skillIcon(c.skills[1])}<span><b>★ ${c.skills[1].name}.</b> ${c.skills[1].desc} <i>From turn ${ULT_FIRST_TURN}.</i></span></li>
          <li class="pas">${skillIcon(c.passive)}<span><b>Passive · ${c.passive.name}.</b> ${c.passive.desc}</span></li>
          ${c.passiveAlt ? `<li class="pas">${skillIcon(c.passiveAlt)}<span><b>Or · ${c.passiveAlt.name}.</b> ${c.passiveAlt.desc}</span></li>` : ''}
        </ul>
        <span class="badge" hidden></span>
      </button>`).join('');
    return `<section class="faction" data-faction="${k}">
      <header><h2>${f.name}</h2><p class="rule"><b>${f.mechanic}.</b> ${f.rule}</p>
        <p class="rule"><b>Weather.</b> Favored by ${Object.values(WEATHER).find((w) => w.favors === k).name}. <b>Mana pool.</b> ${poolLabel(k)}.</p></header>
      <div class="grid">${cards}</div>
    </section>`;
  }).join('');

  $('#factionList').addEventListener('click', (ev) => {
    const b = ev.target.closest('.pick');
    if (b) togglePick(b.dataset.id);
  });
  $('#slots').addEventListener('click', (ev) => {
    const b = ev.target.closest('.slot.filled');
    if (b) togglePick(b.dataset.id);
  });
  // Random recruits: two allies whose roles complement your champion.
  $('#randomBtn').addEventListener('click', () => {
    const me = state.team[0];
    if (!me) { $('#trayNote').textContent = 'Pick your own champion first.'; return; }
    const roles = ['melee', 'ranged', 'support'].filter((r) => r !== charById(me).role);
    state.team = [me, ...roles.map((r) => pick(ROSTER.filter((c) => c.role === r && c.id !== me)).id)];
    $('#trayNote').textContent = '';
    renderSelect();
  });
  // Create your champion (first time) or save new recruits, then head to the Arena.
  $('#beginBtn').addEventListener('click', () => {
    const t = state.team;
    if (t.length !== 3) return;
    if (!profile.hero) {
      const name = cleanName($('#heroName').value) || shortName(charById(t[0]));
      profile.hero = { id: t[0], name };
      profile.level = 1;
      profile.xp = 0;
    }
    profile.recruits = t.slice(1);
    saveProfile();
    toVillage();
    openPlace('arena');
  });
  // Starting over as a different champion takes two clicks. Level and XP reset; everything else is kept.
  $('#retireBtn').addEventListener('click', () => {
    if (!state.retireArmed) { state.retireArmed = true; renderSelect(); return; }
    state.retireArmed = false;
    state.runPending = false;
    profile.hero = null;
    profile.level = 1;
    profile.xp = 0;
    saveProfile();
    state.team = [];
    $('#heroName').value = '';
    renderSelect();
  });
}

// Slot 0 is your champion; slots 1–2 are recruits. Your champion can only be swapped while creating.
function togglePick(id) {
  const creating = !profile.hero, t = state.team;
  $('#trayNote').textContent = '';
  if (creating && !t[0]) state.team = [id];
  else if (t[0] === id) {
    if (!creating) { $('#trayNote').textContent = `${heroName()} is you. Use "New champion" to start over as someone else.`; return; }
    state.team = [];
  } else {
    const rec = t.slice(1), i = rec.indexOf(id);
    if (i >= 0) rec.splice(i, 1);
    else if (rec.length < 2) rec.push(id);
    else { $('#trayNote').textContent = 'You already have two recruits. Click one in the tray to send them home first.'; return; }
    state.team = [t[0], ...rec];
  }
  renderSelect();
}

function renderSelect() {
  const creating = !profile.hero, t = state.team;
  $('#tagline').textContent = creating
    ? 'Season 1: Ashfall Road. Choose the champion you will be, give them a name, then recruit two allies to fight beside you.'
    : `Season 1: Ashfall Road. You play ${heroName()}. Pick two recruits; the AI fights for them.`;
  document.querySelectorAll('.fbtn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === state.filter)));
  document.querySelectorAll('.faction').forEach((s) => { s.hidden = state.filter !== 'all' && s.dataset.faction !== state.filter; });
  document.querySelectorAll('.pick').forEach((b) => {
    const i = t.indexOf(b.dataset.id);
    b.classList.toggle('sel', i >= 0);
    b.classList.toggle('me', i === 0);
    b.setAttribute('aria-pressed', String(i >= 0));
    const badge = b.querySelector('.badge');
    badge.hidden = i < 0;
    badge.textContent = i === 0 ? '★' : i;
    badge.title = i === 0 ? 'You' : `Recruit ${i}`;
  });

  $('#slots').innerHTML = [0, 1, 2].map((i) => {
    const id = t[i];
    if (!id) return `<div class="slot empty${i === 0 ? ' you' : ''}"><small>${i === 0 ? 'You: pick your champion below' : `Recruit ${i}: pick below`}</small></div>`;
    const c = charById(id);
    const label = i === 0 ? (creating ? 'You' : heroName()) : `Recruit · ${shortName(c)}`;
    const sub = i === 0 ? `${c.name} · Lv ${creating ? 1 : heroLevel()}` : `${ROLES[c.role].label} · ${FACTIONS[c.faction].name}`;
    const fixed = i === 0 && !creating;
    return `<button class="slot filled${i === 0 ? ' you' : ''}" type="button" data-id="${id}" title="${fixed ? 'This is you' : `Remove ${c.name}`}">
      <div class="mini">${spriteSVG(id)}</div>
      <div class="t"><strong>${label}</strong><small>${sub}</small></div>
    </button>`;
  }).join('');

  $('#nameRow').hidden = !(creating && t[0]);
  if (creating && t[0]) $('#heroName').placeholder = shortName(charById(t[0]));
  $('#retireBtn').hidden = creating;
  $('#retireBtn').textContent = state.retireArmed ? `Click again to retire ${heroName()}` : 'New champion';
  $('#randomBtn').disabled = !t[0];
  $('#beginBtn').textContent = creating ? 'Create champion' : 'Save warband';
  $('#beginBtn').disabled = t.length !== 3;

  const need = 3 - t.length;
  $('#trayInfo').textContent =
    creating && !t[0] ? 'Step 1: click the champion you want to be. This is who you play and level up.'
    : need > 0 ? `${creating ? 'Step 2: r' : 'R'}ecruit ${need} more all${need === 1 ? 'y' : 'ies'}. The AI plays your recruits in battle, at your level.`
    : creating ? 'Ready. Your champion starts at level 1 and keeps every level they earn.'
    : `${heroName()} · level ${heroLevel()}. Your recruits fight at your level and act on their own.`;
  if (state.retireArmed) $('#trayNote').textContent = `Retiring ${heroName()} resets your level and XP. Gold, gear, items and quests are kept.`;
}

const questSt = (q) => profile.quests[q.id] || null;
const goalN = (q) => q.goal.n || 1;
// The quest an NPC is currently offering, running or waiting to pay out (undefined once their list is done).
const questOf = (npcId) => QUESTS.find((q) => q.from === npcId && questSt(q)?.s !== 'done');
const lvlOk = (q) => heroLevel() >= (q.lv || 1);
const offering = (q) => q && !questSt(q) && lvlOk(q);
const lockedFor = (q) => q && !questSt(q) && !lvlOk(q);

// Quests that a level-up from `from` to `to` just made available (only each NPC's next one).
function questsUnlocked(from, to) {
  return QUESTS.filter((q) => q.lv > from && q.lv <= to && questOf(q.from) === q && !questSt(q))
    .map((q) => `New quest at level ${q.lv}: ${q.title}, from ${npcById(q.from).name}.`);
}
const pendingDeliveries = (npcId) => QUESTS.filter((q) => q.goal.t === 'talk' && q.goal.to === npcId && questSt(q)?.s === 'active');

function npcById(id) {
  const place = Object.keys(KEEPERS).find((k) => KEEPERS[k].id === id);
  return place ? { ...KEEPERS[place], place } : { ...TOWNSFOLK[id], id };
}

function goalText(q) {
  const g = q.goal, n = goalN(q), s = n === 1 ? '' : 's';
  if (g.t === 'win' && g.vs) return `Defeat ${theFaction(FACTIONS[g.vs])} in the Arena`;
  if (g.t === 'win' && g.flawless) return 'Win a battle without losing a champion';
  if (g.t === 'win') return `Win ${n} battle${s}`;
  if (g.t === 'clear') return 'Clear the gauntlet';
  if (g.t === 'forge') return `Forge ${n} upgrade${s} at the Ironsmith`;
  if (g.t === 'buy') return `Buy ${n} item${s} at the Market`;
  if (g.t === 'trinket') return `Buy ${n === 1 ? 'a trinket' : `${n} trinkets`} at the Jeweler`;
  if (g.t === 'item' && g.key) return `Use a ${ITEMS[g.key].name} in battle`;
  if (g.t === 'item') return `Use ${n} satchel item${s} in battle`;
  if (g.t === 'talk') { const t = npcById(g.to); return `Speak to ${t.name} at ${PLACES[t.place].name}`; }
  return '';
}
const rewardText = (q) => [q.gold ? `${q.gold} gold` : '', q.item ? `a ${ITEMS[q.item].name}` : ''].filter(Boolean).join(' and ');

// Something happened that quests might care about. Returns news lines for the battle log / victory card.
function questEvent(t, info = {}) {
  const bountyNews = bountyEvent(t, info);   // the Bounty Board listens to the same events
  const news = [];
  for (const q of QUESTS) {
    const st = questSt(q), g = q.goal;
    if (st?.s !== 'active' || g.t !== t) continue;
    if ((g.vs && g.vs !== info.vs) || (g.key && g.key !== info.key) || (g.flawless && !info.flawless) || (g.to && g.to !== info.to)) continue;
    st.n = Math.min(goalN(q), st.n + 1);
    if (st.n >= goalN(q)) {
      st.s = 'ready';
      news.push(`Quest complete: ${q.title}. Return to ${npcById(q.from).name}.`);
    } else news.push(`Quest: ${q.title}, ${st.n} of ${goalN(q)}.`);
  }
  if (news.length) saveProfile();
  return [...bountyNews, ...news];
}

function acceptQuest(id) {
  const q = QUEST_BY_ID[id];
  if (!q || questSt(q) || questOf(q.from) !== q || !lvlOk(q)) return false;
  profile.quests[id] = { s: 'active', n: 0 };
  saveProfile();
  return true;
}

function claimQuest(id) {

  if (st?.s !== 'ready') return null;
  st.s = 'done';
  let gold = q.gold || 0;
  const got = [];
  if (q.item) {
    const n = profile.items[q.item] || 0;
    const m = profile.stash.items[q.item] || 0;
    if (n < SATCHEL_MAX) { profile.items[q.item] = n + 1; got.push(`a ${ITEMS[q.item].name}`); }
    else if (m < stashCap()) { profile.stash.items[q.item] = m + 1; got.push(`a ${ITEMS[q.item].name} (sent to your stash)`); }
    else gold += ITEMS[q.item].price;
  }
  profile.gold += gold;
  profile.stats.earned += gold;
  saveProfile();
  return [gold ? `+${gold} gold` : '', ...got].filter(Boolean).join(' and ');
}

// "!" = has a quest for you, "?" = something to hand in here.
function questMark(npcId) {
  const q = questOf(npcId);
  if (q && questSt(q)?.s === 'ready') return '?';
  if (pendingDeliveries(npcId).length) return '?';
  return offering(q) ? '!' : '';
}

function updateQuestMarks() {
  document.querySelectorAll('#npcs .npc').forEach((b) => {
    const m = questMark(b.dataset.npc), el = b.querySelector('.qmark');
    el.textContent = m;
    el.hidden = !m;
    b.setAttribute('aria-label', b.dataset.label + (m === '!' ? '. Has a quest for you' : m === '?' ? '. Quest to hand in' : ''));
  });
}

// One quest's card, for a keeper's panel or the quest log.
function questCardHTML(q, where) {
  const st = questSt(q), giver = npcById(q.from);
  if (lockedFor(q)) {
    return `<div class="quest locked"><p class="label">Locked · level ${q.lv}</p><h4>${q.title}</h4>
      <p class="note">${giver.name} will have work for you at level <b>${q.lv}</b>. You are level ${heroLevel()}.</p></div>`;
  }
  if (!st) {
    return `<div class="quest offer"><p class="label">Quest offered</p><h4>${q.title}</h4><p class="ask">“${q.ask}”</p>
      <p class="note">Goal: ${goalText(q)}. Reward: <b>${rewardText(q)}</b>.</p>
      <div class="btns"><button class="btn primary small" type="button" data-k="quest:${q.id}">Accept</button></div></div>`;
  }
  const n = goalN(q), pct = Math.round(100 * st.n / n);
  const status = st.s === 'ready' && where === 'giver' ? `${goalText(q)}. Done!`
    : st.s === 'ready' ? `Done. Return to <b>${giver.name}</b>${giver.place ? ` at ${PLACES[giver.place].name}` : ' in the square'}.`
    : `${goalText(q)}.${n > 1 ? ` ${st.n} of ${n}.` : ''}`;
  const claim = st.s === 'ready' && where === 'giver'
    ? `<div class="btns"><button class="btn primary small" type="button" data-k="claim:${q.id}">Claim ${rewardText(q)}</button></div>` : '';
  return `<div class="quest ${st.s}"><p class="label">${st.s === 'ready' ? 'Quest complete' : 'Quest'}${where === 'log' ? ` · from ${giver.name}` : ''}</p>
    <h4>${q.title}</h4><p class="note">${status}</p>
    ${n > 1 && st.s === 'active' ? `<div class="qbar" role="img" aria-label="${st.n} of ${n}"><i style="width:${pct}%"></i></div>` : ''}${claim}</div>`;
}

function questLogHTML() {
  const mine = QUESTS.filter((q) => ['active', 'ready'].includes(questSt(q)?.s));
  const offers = Object.values(KEEPERS).filter((n) => offering(questOf(n.id))).length
    + state.folk.filter((f) => offering(questOf(f.id))).length;
  const hint = offers ? `<p class="note"><b>${offers}</b> ${offers === 1 ? 'person has' : 'people have'} work for you. Look for the <b>!</b> over their heads.</p>` : '';
  const done = QUESTS.filter((q) => questSt(q)?.s === 'done').length;
  const next = [...Object.values(KEEPERS).map((n) => n.id), ...Object.keys(TOWNSFOLK)]
    .map(questOf).filter(lockedFor).sort((a, b) => a.lv - b.lv)[0];
  const soon = next ? `<p class="note">Next unlock: <b>${next.title}</b> from ${npcById(next.from).name} at level ${next.lv}.</p>` : '';
  return `<section class="qlog" aria-label="Quests">
    <div class="phead"><p class="label">Quests</p><span class="note">${done} of ${QUESTS.length} completed</span></div>
    ${mine.length ? `<div class="qlist">${mine.map((q) => questCardHTML(q, 'log')).join('')}</div>` : '<p class="note">No quests in progress.</p>'}
    ${hint}${soon}</section>`;
}

// Victory-card lines for quests that moved during this battle.
const questNewsHTML = () => (state.questNews?.length ? `<ul class="qnews">${state.questNews.map((t) => `<li>${t}</li>`).join('')}</ul>` : '');

// Pick who is out in the square this visit. Anyone waiting to pay you for a finished quest always shows up.
function rollFolk() {
  const lanes = shuffle(FOLK_LANES), ids = Object.keys(TOWNSFOLK);
  const owed = shuffle(ids.filter((id) => questMark(id) === '?'));
  const rest = shuffle(ids.filter((id) => !owed.includes(id)));
  state.folk = [...owed, ...rest].slice(0, FOLK_OUT).map((id, i) => ({ id, lane: lanes[i] }));
  greetedFolk.clear();
}

const QMARK = (id) => `<span class="qmark" style="top:${NPC_HEAD[id] ?? 12}%" aria-hidden="true" hidden></span>`;
function npcsHTML() {
  const keepers = Object.entries(KEEPERS).map(([place, n]) => `
    <button class="npc stand${n.flip ? ' flip' : ''}" type="button" data-place="${place}" data-npc="${n.id}"
      style="left:${mapX(n.at[0])};top:${mapY(n.at[1])};--d:${(-Math.random() * 3).toFixed(2)}s"
      data-label="${n.name}, ${n.title}. Opens ${PLACES[place].name}">
      <span class="tag">${n.name}</span>${QMARK(n.id)}<div class="face"><div class="bob">${npcArt(n.id)}</div></div></button>`);
  const folk = state.folk.map(({ id, lane }) => {
    const n = TOWNSFOLK[id], f0 = lane.x1 > lane.x0 ? 1 : -1;
    return `<button class="npc walker" type="button" data-folk="${id}" data-npc="${id}"
      style="top:${mapY(lane.y)};--x0:${mapX(lane.x0)};--x1:${mapX(lane.x1)};--f0:${f0};--f1:${-f0};--dur:${18 + Math.round(Math.random() * 10)}s;--d:${(-Math.random() * 20).toFixed(2)}s"

}

// Speech bubble over a townsperson. Clicking the same person again moves to their next line.
// If they have a quest for you, the bubble offers it (or pays out) with buttons instead.
const folkTurn = {};
let sayTimer = 0, sayBtn = null;
function folkTalk(btn) {
  const id = btn.dataset.folk, n = TOWNSFOLK[id], q = questOf(id), st = q && questSt(q), you = youName();
  const hi = greetedFolk.has(id) ? '' : salute(id);
  greetedFolk.add(id);
  let body, sticky = false;
  if (q && !st) {
    body = `${hi ? `${hi} ` : ''}${q.ask}<span class="qline">Quest: <b>${q.title}</b>. ${goalText(q)}. Reward: ${rewardText(q)}.</span>
      <span class="btns"><button class="btn primary small" type="button" data-k="quest:${q.id}">Accept</button>
      <button class="btn small" type="button" data-k="hush">Not now</button></span>`;
    sticky = true;
  } else if (st?.s === 'ready') {
    body = `You did it${you ? `, ${you}` : ''}? Really?<span class="btns"><button class="btn primary small" type="button" data-k="claim:${q.id}">Hand in ${q.title}</button></span>`;
    sticky = true;
  } else {
    const lines = linesOf(n.lines);
    folkTurn[id] = folkTurn[id] == null ? Math.floor(Math.random() * lines.length) : folkTurn[id] + 1;
    body = (hi ? `${hi} ` : '') + lines[folkTurn[id] % lines.length]
      + (st?.s === 'active' ? `<span class="qline">Quest: <b>${q.title}</b>. ${goalText(q)}${goalN(q) > 1 ? `, ${st.n} of ${goalN(q)}` : ''}.</span>`
        : lockedFor(q) ? `<span class="qline">${n.name} will have a job for you at level <b>${q.lv}</b>.</span>` : '');
  }
  showSay(btn, `<strong>${n.name} · ${n.title}</strong>${body}`, sticky);
}

function showSay(btn, html, sticky = false) {
  const bub = $('#npcSay'), town = $('#town');
  document.querySelectorAll('.npc.talking').forEach((b) => b.classList.remove('talking'));
  btn.classList.add('talking');
  sayBtn = btn;
  bub.innerHTML = html;
  bub.classList.toggle('ask', sticky);
  bub.hidden = false;
  const tr = town.getBoundingClientRect(), r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2 - tr.left, left = clamp(cx - bub.offsetWidth / 2, 6, tr.width - bub.offsetWidth - 6);
  bub.style.left = `${left}px`;
  bub.style.top = `${Math.max(4, r.top - tr.top + r.height * 0.1 - bub.offsetHeight - 8)}px`;
  bub.style.setProperty('--tail', `${clamp(cx - left, 12, bub.offsetWidth - 12)}px`);
  clearTimeout(sayTimer);
  if (!sticky) sayTimer = setTimeout(hideSay, 7000);
}
function hideSay() {
  clearTimeout(sayTimer);
  sayBtn = null;
  $('#npcSay').hidden = true;
  document.querySelectorAll('.npc.talking').forEach((b) => b.classList.remove('talking'));
}

// Buttons inside a townsperson's bubble.
function sayAction(k) {
  const [verb, id] = k.split(':'), btn = sayBtn;
  if (verb === 'hush' || !btn) return hideSay();
  const q = QUEST_BY_ID[id], who = `<strong>${TOWNSFOLK[q.from].name} · ${TOWNSFOLK[q.from].title}</strong>`;
  if (verb === 'quest' && acceptQuest(id)) showSay(btn, `${who}Thank you${youName() ? `, ${youName()}` : ''}! Come and find me when it is done.<span class="qline">Quest accepted: <b>${q.title}</b>.</span>`);
  else if (verb === 'claim') { const got = claimQuest(id); if (got) showSay(btn, `${who}${q.done}<span class="qline loot">${got}</span>`); }
  render();
}

function keeperGreet(place) {
  const n = KEEPERS[place];
  state.keeperSays = n ? withSalute(n.id, pick(linesOf(n.greet))) : '';
}
function keeperReact(place) {
  const n = KEEPERS[place];
  if (n?.react.length) state.keeperSays = pick(n.react.filter((l) => l !== state.keeperSays));
}
// The keeper greeting you inside their building, with their current quest (if any) below.
function keeperHTML(place) {
  const n = KEEPERS[place];
  if (!n) return '';
  const q = questOf(n.id);
  const loot = state.keeperLoot ? `<p class="loot">${state.keeperLoot}</p>` : '';
  const said = state.keeperSays ? `<div class="keeper"><div class="kpic">${npcArt(n.id)}</div>
    <div><strong>${n.name}</strong> <small>${n.title}</small><p>“${state.keeperSays}”</p>${loot}</div></div>` : '';
  return said + (q ? questCardHTML(q, 'giver') : '');
}

// Opening a keeper's building delivers any messages you carry for them.
function deliverTo(place) {
  const n = KEEPERS[place];
  if (!n) return;
  const due = pendingDeliveries(n.id);
  if (!due.length) return;
  state.keeperSays = due[0].deliver;
  state.keeperLoot = questEvent('talk', { to: n.id }).join(' ');
}

      <div class="depths">${depths}</div>
      <h3 class="bhead">Bestiary</h3>
      <div class="bestiary">${bestiary}</div>`;
  },

  // Expedition Gate: the dungeons along Ashfall Road, each a chain of rooms ending in a boss.
  gate() {
    if (!profile.hero) {
      return `<p class="note">The gate guard wants a name before letting anyone out on the road. Create your champion first.</p>
        <div class="btns"><button class="btn primary" type="button" data-k="team">Create your champion</button></div>`;
    }
    if (state.runPending) return '<p class="note">Your Arena run is paused. Finish or abandon it at the Arena before setting out.</p>';
    const lv = heroLevel();
    const cards = DUNGEONS.map((d) => {
      const open = lv >= d.minLv, rec = profile.dungeons[d.id], boss = MONSTERS[d.boss];
      const kinds = [...new Set(d.rooms.flat())];
      return `<div class="depth dungeon${open ? '' : ' locked'}">
        <div class="dmini">${kinds.map((id) => `<span class="mini" title="${MONSTERS[id].name}">${spriteSVG(id)}</span>`).join('')}
          <span class="mini boss" title="${boss.name}">${spriteSVG(d.boss)}</span></div>
        <h3>${d.name}</h3><p>${d.blurb}</p>
        <small>Level ${d.minLv}+ · ${d.rooms.length} rooms, then <b>${boss.name}</b></small>
        <small class="reward">Chest: ${d.chest.gold} gold and ${d.chest.items} items${rec?.clears ? ` · cleared ${rec.clears}×` : ` · first clear: a ${TRINKETS[d.firstClear].name}`}</small>
        <button class="btn${open ? ' primary' : ''}" type="button" data-k="dungeon:${d.id}"${open ? '' : ' disabled'}>${open ? 'Set out' : `Unlocks at level ${d.minLv}`}</button>
      </div>`;
    }).join('');
    return `<p class="note">A dungeon is a run of rooms with no full heal between them: HP and MP carry over, the fallen get back up at 30%,
        and everyone rests a little. Each room pays XP and gold. The boss at the end guards a chest. Bosses enrage below half HP,
        and before their big attack they warn you a turn ahead: that's the moment to Guard or shield up.
        You can retreat between rooms and keep what you've earned.</p>
      <div class="teamRow">${teamMinis()}</div>
      <div class="depths">${cards}</div>`;
  },

  forge() {
    const sel = forgeHero();
    const list = heroListHTML(sel, (id) => { const g = gearRaw(id); return [`Weapon ${g.w || 0} · Armor ${g.a || 0}`, (g.w || 0) + (g.a || 0) > 0]; });
    return `<div class="forge">${list}${anvilHTML(sel)}</div>
      <p class="note">★ marks your warband. Upgrades are permanent and count in every battle, for this champion only.</p>`;
  },

  jeweler() {
    const sel = forgeHero();
    const list = heroListHTML(sel, (id) => { const t = TRINKETS[gearRaw(id).t]; return [t ? t.name : 'No trinket', !!t]; });
    return `<div class="forge">${list}${trinketCaseHTML(sel)}</div>
      <p class="note">★ marks your warband. Each champion wears one trinket. Buying another sends the old one home to your stash.</p>`;
  },

  market() {
    const tab = state.marketTab || 'supplies';
    const tabs = `<div class="filters" role="group" aria-label="Market stalls">${[['supplies', 'Supplies'], ['home', 'Home goods']]
      .map(([k, n]) => `<button class="fbtn" type="button" data-k="mtab:${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</div>`;
    if (tab === 'home') {
      return `${tabs}<div class="wares">${DECOR_KEYS.map((k) => {
        const d = DECOR[k], own = ownsDecor(k), ok = !own && profile.gold >= d.price;
        return `<div class="ware${own ? ' worn' : ''}"><div class="ico">${DECOR_ICON[k]}</div><strong>${d.name}</strong><p>${d.desc}</p>
          <div class="buy"><span class="note">${d.perk ? '<b>Warband perk</b>' : 'For your home'}</span>
            <button class="btn small${ok ? ' primary' : ''}" type="button" data-k="decor:${k}"${ok ? '' : ' disabled'}>${own ? 'In your house' : `Buy for ${d.price} gold`}</button></div>
        </div>`;
      }).join('')}</div>
      <p class="note">Furniture goes straight to Your House. Perks count in every battle for your whole warband.</p>`;
    }
    const cap = stashCap();
    return `${tabs}<div class="wares">${ITEM_KEYS.map((k) => {
      const it = ITEMS[k], n = profile.items[k] || 0, m = profile.stash.items[k] || 0;
      const full = n >= SATCHEL_MAX && m >= cap, ok = !full && profile.gold >= it.price;
      const label = full ? 'Satchel and stash full' : n >= SATCHEL_MAX ? `Buy for ${it.price} gold, to your stash` : `Buy for ${it.price} gold`;
      return `<div class="ware"><div class="ico">${ITEM_ICON[k]}</div><strong>${it.name}</strong><p>${it.desc}</p>
        <div class="buy"><span class="note">Satchel <b>${n}</b>/${SATCHEL_MAX} · Stash <b>${m}</b>/${cap}</span>
          <button class="btn small${ok ? ' primary' : ''}" type="button" data-k="buy:${k}"${ok ? '' : ' disabled'}>${label}</button></div>
      </div>`;
    }).join('')}</div>
    <p class="note">In battle, each of your champions can use <b>one item per turn</b> and still act (keys 6–0). You carry ${SATCHEL_MAX} of each in your satchel; extras go home to your stash.</p>`;
  },

  home() {
    const s = profile.stash, cap = stashCap(), perks = homePerks();
    const perkText = [perks.hpPct && `+${Math.round(perks.hpPct * 100)}% max HP`, perks.atkPct && `+${Math.round(perks.atkPct * 100)}% Attack`,
      perks.hpRegen && `+${perks.hpRegen} HP each turn`].filter(Boolean).join(', ');
    const items = ITEM_KEYS.map((k) => {
      const n = profile.items[k] || 0, m = s.items[k] || 0;
      return `<div class="inv"><span class="ico">${ITEM_ICON[k]}</span>
        <div class="t"><strong>${ITEMS[k].name}</strong><small>Satchel ${n}/${SATCHEL_MAX} · Stash ${m}/${cap}</small></div>
        <div class="mv"><button class="btn small" type="button" data-k="store:${k}"${n && m < cap ? '' : ' disabled'}>To stash</button>
          <button class="btn small" type="button" data-k="take:${k}"${m && n < SATCHEL_MAX ? '' : ' disabled'}>To satchel</button></div></div>`;
    }).join('');
    const team = state.team.map((id) => {
      const c = charById(id), g = gearRaw(id), t = TRINKETS[g.t];
      return `<div class="inv"><div class="mini">${spriteSVG(id)}</div>
        <div class="t"><strong>${shortName(c)}</strong><small>${TIER[g.w || 0]} weapon · ${TIER[g.a || 0]} armor · ${t ? t.name : 'No trinket'}</small></div>
        ${t ? `<div class="mv"><button class="btn small" type="button" data-k="unequip:${id}">Take off</button></div>` : ''}</div>`;
    }).join('');
    const spare = TRINKET_KEYS.filter((k) => s.trinkets[k] > 0).map((k) => {
      const tr = TRINKETS[k];
      const who = state.team.map((id) => {
        const ok = gearRaw(id).t !== k && !(tr.mana && !hasMana(id));
        return `<button class="btn small" type="button" data-k="give:${k}:${id}"${ok ? '' : ' disabled'}>Give to ${shortName(charById(id))}</button>`;
      }).join('');
      return `<div class="inv"><span class="ico">${TRINKET_ICON[k]}</span>
        <div class="t"><strong>${tr.name}${s.trinkets[k] > 1 ? ` ×${s.trinkets[k]}` : ''}</strong><small>${tr.desc}</small></div><div class="mv">${who}</div></div>`;
    }).join('');
    return `<div class="room">${roomSVG()}</div>
      <p class="note">${profile.home.length ? `${profile.home.length} of ${DECOR_KEYS.length} pieces of furniture.${perkText ? ` Warband perks: <b>${perkText}</b>.` : ''}` : 'Bare walls and a cold floor.'}
        Odo Mott sells furniture under <b>Home goods</b> at the Market.</p>
      <div class="btns"><button class="btn small" type="button" data-k="homeshop">Shop for furniture</button></div>
      <div class="homeGrid">
        <section><p class="label">Satchel and stash</p><div class="invList">${items}</div></section>
        <section><p class="label">Your warband's gear</p><div class="invList">${team}</div>
          <p class="label">Trinkets in your stash</p>
          <div class="invList">${spare || '<p class="note">No spare trinkets. Ones you take off, or replace at the Jeweler, end up here.</p>'}</div></section>
      </div>`;
  },

  bounty() {
    const board = bountyBoard();
    const notes = board.list.map((b, i) => {
      const pct = Math.round((b.prog / b.n) * 100);
      const btn = b.claimed ? '<span class="soon">Paid</span>'
        : b.done ? `<button class="btn small primary" type="button" data-k="bclaim:${i}">Claim ${b.gold} gold</button>`
        : `<span class="note">${b.prog} / ${b.n}</span>`;
      return `<div class="notice${b.claimed ? ' paid' : b.done ? ' ready' : ''}" style="--r:${[-1.5, 1, -0.5][i % 3]}deg">
        <span class="pin" aria-hidden="true"></span><p class="nk">Bounty</p><p class="nt">${bountyText(b)}</p>
        <div class="nbar" role="img" aria-label="${b.prog} of ${b.n} done"><i style="width:${pct}%"></i></div>
        <div class="nfoot"><b>${b.gold} gold</b>${btn}</div></div>`;
    }).join('');
    return `<div class="notices">${notes}</div>
      <p class="note">New jobs are posted every day. Progress counts from any battle, in or out of a gauntlet run.</p>
      <div class="btns"><button class="btn small" type="button" data-k="breroll"${guildPct('bounty') || profile.gold >= BOUNTY_REROLL ? '' : ' disabled'}>Ask Holt for new jobs (${guildPct('bounty') ? 'free for the Oathbound' : `${BOUNTY_REROLL} gold`})</button></div>`;
  },

  carnival() {
    const g = state.booth && gameById(state.booth);
    if (g) {
      return `<div class="booth"><div class="dhead"><strong>${g.name}</strong>
          <button class="btn small" type="button" data-k="leave">Leave the booth</button></div>
        <div class="boothHost" id="boothHost"></div></div>`;
    }
    const c = profile.carnival;
    const booths = CARNIVAL_GAMES.map((b) => {
      const ok = b.play && profile.gold >= (b.cost || 0);
      return `<div class="ware"><div class="ico">${b.icon}</div><strong>${b.name}</strong><p>${b.pitch}</p>
        <div class="buy"><span class="note">Entry ${b.cost || 0} gold · win up to ${b.maxPrize} gold</span>
          ${b.play ? `<button class="btn small${ok ? ' primary' : ''}" type="button" data-k="play:${b.id}"${ok ? '' : ' disabled'}>Play</button>`
            : '<span class="soon">Coming soon</span>'}</div></div>`;
    }).join('');
    return `${state.boothNews ? `<p class="loot">${state.boothNews}</p>` : ''}
      <div class="wares">${booths}</div>
      <p class="note">Rounds played: <b>${c.plays}</b> · Gold won: <b>${c.won}</b>. New booths open as their games are finished.</p>`;
  },

  elder() {
    return `${codexHTML()}
      <p class="note">Ysolde keeps a hand-drawn map of the Ashlands nailed above her hearth: six banners, one road, and every ruin along it.
        <a href="map.html" target="_blank" rel="noopener">Study the map</a>.</p>`;
  },

  tavern() {
    const s = profile.stats;
    return `<p class="rumor">“${TIPS[state.tip % TIPS.length]}”</p>
      <div class="btns"><button class="btn" type="button" data-k="rumor">Hear another rumor</button></div>
      <p class="label">Tales told of you</p>
      <div class="stats">${statHTML(s.runs, 'Gauntlets begun')}${statHTML(s.clears, 'Gauntlets cleared')}${statHTML(s.wins, 'Battles won')}
        ${statHTML(s.best ? `${s.best} / ${FACTION_KEYS.length}` : '–', 'Furthest battle won')}${statHTML(s.earned, 'Gold earned')}</div>`;
  },
};

// Champion picker shared by the Ironsmith and the Jeweler (both use state.forgeHero).
// sub(id) → [small text, highlight?]. Your warband is listed first.
function heroListHTML(sel, sub) {
  const order = [...state.team, ...ROSTER.map((c) => c.id).filter((id) => !state.team.includes(id))];
  return `<div class="heroList">${order.map((id) => {
    const [text, hi] = sub(id);
    return `<button class="hbtn" type="button" data-k="hero:${id}" aria-pressed="${id === sel}">
      <div class="mini">${spriteSVG(id)}</div>
      <div class="t"><strong>${state.team.includes(id) ? '★ ' : ''}${shortName(charById(id))}</strong>
        <small class="${hi ? 'forged' : ''}">${text}</small></div>
    </button>`;
  }).join('')}</div>`;
}

function trinketCaseHTML(id) {
  const c = charById(id), worn = gearRaw(id).t, u = makeUnit(c, 1, 'p', 0), mana = hasMana(id);
  const rows = TRINKET_KEYS.map((k) => {
    const tr = TRINKETS[k], on = worn === k, ok = profile.gold >= tr.price, spare = profile.stash.trinkets[k] || 0;
    const btn = on ? `<button class="btn small" type="button" data-k="sell">Sell back for ${trinketRefund(k)} gold</button>`
      : tr.mana && !mana ? '<span class="note">No use without mana</span>'
      : spare ? `<button class="btn small primary" type="button" data-k="give:${k}:${id}">Wear one from your stash</button>`
      : `<button class="btn small${ok ? ' primary' : ''}" type="button" data-k="trinket:${k}"${ok ? '' : ' disabled'}>Buy for ${tr.price} gold</button>`;
    return `<div class="ware${on ? ' worn' : ''}"><div class="ico">${TRINKET_ICON[k]}</div>
      <strong>${tr.name}${on ? ' · worn' : ''}</strong><p>${tr.desc}</p>
      <div class="buy"><span class="note">${tr.price} gold${spare ? ` · ${spare} in your stash` : ''}</span>${btn}</div></div>`;
  }).join('');
  return `<div class="anvil">
    <div class="who2"><div class="pic">${spriteSVG(id)}</div>
      <div><strong>${c.name}</strong><p class="note">${ROLES[c.role].label} · ${FACTIONS[c.faction].name}</p>
        <p class="note">At level 1: ${mana ? `${u.maxMp} MP · ` : 'No mana · '}${u.agi} Agility · ${u.maxHp} HP</p></div></div>
    <div class="trinkets">${rows}</div>
  </div>`;
}

    <path d="M0 212H640M0 236H640M80 190V212M240 190V212M400 190V212M560 190V212M160 212V236M320 212V236M480 212V236M40 236V260M200 236V260M360 236V260M520 236V260" stroke="#2a1f18" stroke-width="2"/>
    <rect y="186" width="640" height="6" fill="#2a1f18"/><rect width="640" height="14" fill="#2e221a"/>

    p.push(`<rect x="40" y="96" width="140" height="6" fill="#7a5434"/><path d="M52 102v8M168 102v8" stroke="#5a3e28" stroke-width="4"/>
      ${cups ? Array.from({ length: cups }, (_, i) => cup(52 + i * 25)).join('') : '<text x="110" y="90" text-anchor="middle" font-size="11" fill="#a29fb2">No trophies yet</text>'}`);

       <rect x="36" y="160" width="160" height="20" fill="#e9e4d8"/><rect x="80" y="155" width="116" height="26" rx="4" fill="#9a2f36"/>
       <path d="M80 165h116" stroke="#e8a548" stroke-width="2"/><ellipse cx="60" cy="156" rx="18" ry="7" fill="#f4f0e6"/>
       <rect x="38" y="180" width="160" height="8" fill="#5a3e28"/>`
    : '<rect x="40" y="180" width="140" height="9" rx="4" fill="#a3895f"/><path d="M48 184h124" stroke="#8a7048" stroke-dasharray="6 4"/>');
  p.push(own('chest')

       <path d="M236 151V196M282 151V196M222 178H296" stroke="#7a8296" stroke-width="4"/><rect x="254" y="170" width="10" height="12" rx="2" fill="#e8a548"/>`
    : `<rect x="226" y="168" width="64" height="28" fill="#7a5a3a"/><rect x="224" y="160" width="68" height="10" rx="3" fill="#6b4f32"/>
       <path d="M226 182H290" stroke="#5a3e28" stroke-width="2"/><rect x="254" y="166" width="8" height="8" rx="1" fill="#b08a2e"/>`);
  if (own('rug')) p.push('<ellipse cx="330" cy="226" rx="110" ry="22" fill="#9a2f36" stroke="#e8a548" stroke-width="3"/><ellipse cx="330" cy="226" rx="70" ry="12" fill="none" stroke="#e9e4d8" stroke-width="2" stroke-dasharray="6 5"/>');

    <path class="flame" d="M552 196Q550 176 562 166Q564 178 572 180Q570 160 582 150Q590 172 588 180Q596 174 594 164Q604 182 598 196Z" fill="#ff8a3d"/>
    <path class="flame" style="animation-delay:-.2s" d="M562 196Q562 182 570 176Q572 186 578 184Q580 174 586 172Q590 188 584 196Z" fill="#ffd166"/>`);
  p.push('<defs><radialGradient id="hGlow"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/></radialGradient></defs></svg>');

function anvilHTML(id) {
  const c = charById(id), g = gearOf(id), u = makeUnit(c, 1, 'p', 0);
  const row = (slot) => {
    const f = FORGE[slot], t = g[slot] || 0, cost = FORGE_COST[t], ok = profile.gold >= cost;
    const bonus = (n) => `+${Math.round(f.per * n * 100)}% ${f.stat}`;
    const pips = Array.from({ length: FORGE_MAX }, (_, i) => `<i class="${i < t ? 'on' : ''}"></i>`).join('');
    return `<div class="gear">
      <div class="row"><strong>${f.name}: ${TIER[t]}</strong><span class="pips" role="img" aria-label="Tier ${t} of ${FORGE_MAX}">${pips}</span></div>
      <p class="note">${t ? `${bonus(t)} now.` : 'No bonus yet.'} ${t >= FORGE_MAX ? 'Fully forged.' : `Next, ${TIER[t + 1]}: ${bonus(t + 1)}.`}</p>
      ${t >= FORGE_MAX ? '' : `<button class="btn${ok ? ' primary' : ''}" type="button" data-k="up:${slot}"${ok ? '' : ' disabled'}>${ok ? `Forge for ${cost} gold` : `Needs ${cost} gold`}</button>`}
    </div>`;
  };
  return `<div class="anvil">
    <div class="who2"><div class="pic">${spriteSVG(id)}</div>
      <div><strong>${c.name}</strong><p class="note">${ROLES[c.role].label} · ${FACTIONS[c.faction].name}</p>
        <p class="note">At level 1: ${u.maxHp} HP · ${u.atk} Attack · ${u.def} Defense</p></div></div>
    ${row('w')}${row('a')}
  </div>`;
}

// The rules of the road: factions, weather and the speed bar. Shown in the Elder's Hut and on the square.
function codexHTML() {
  const tab = state.codex;
  const tabs = [['factions', 'Factions'], ['weather', 'Weather'], ['speed', 'The speed bar']]
    .map(([k, n]) => `<button class="fbtn" type="button" data-k="codex:${k}" aria-pressed="${k === tab}">${n}</button>`).join('');
  let body;
  if (tab === 'weather') body = Object.values(WEATHER).map((w) => entryHTML(w.name, w.desc)).join('');
  else if (tab === 'speed') body = SPEED_LORE.map(([h, p]) => entryHTML(h, p)).join('');
  else body = FACTION_KEYS.map((k) => {
    const f = FACTIONS[k], w = Object.values(WEATHER).find((x) => x.favors === k);
    return entryHTML(f.name, `<b>${f.mechanic}.</b> ${f.rule} Favored by ${w.name}. Mana pool: ${poolLabel(k)}.`);
  }).join('');
  const foot = tab === 'weather' ? `<p class="note">The weather changes every ${WEATHER_EVERY} rounds. Battles start under Clear Skies, and the next weather is always announced ahead of time.</p>` : '';
  return `<div class="filters" role="group" aria-label="Lore topics">${tabs}</div><div class="codex">${body}</div>${foot}`;
}

function renderVillage() {
