/* VILLAGE STAGE — Cinderhold fills the screen. The map, townies and NPCs share #townView: one
   transform (scale s, then translate tx/ty, in px) pans and zooms them together. On the square the map
   covers the screen at "cover" scale and you drag to look around; opening a building zooms onto it and
   its keeper, centred in the part of the screen the sheet leaves free. The speech bubble, HUD, dock and
   sheet live outside the view, so they never scale. */
let view = null;       // the current { s, tx, ty } of #townView
let zoomedTo = null;   // the place the view is framed on (null = the square)

const stageSize = () => { const t = $('#town'); return { W: t.clientWidth, H: t.clientHeight }; };
// The smallest scale at which the 3:1 map still covers the whole stage.
const coverScale = () => { const { W, H } = stageSize(); return Math.max(1, H / (W / 3)); };

// Keep the map covering the visible part of the stage (what an open sheet leaves free): never show past its edges.
function clampView(v, a = freeArea()) {
  const { W } = stageSize(), mw = v.s * W, mh = v.s * W / 3, aw = a.x1 - a.x0, ah = a.y1 - a.y0;
  return { s: v.s,
    tx: mw <= aw ? a.x0 + (aw - mw) / 2 : clamp(v.tx, a.x1 - mw, a.x0),
    ty: mh <= ah ? a.y0 + (ah - mh) / 2 : clamp(v.ty, a.y1 - mh, a.y0) };
}

// Where the building and its keeper sit, as fractions of the map (0..1 across and down).
// Only solid shapes count: drifting smoke, embers and glows would stretch the box far above the roof.
function placeFrame(k) {
  const v = $('#townView').getBoundingClientRect(), bld = document.querySelector(`.bld[data-place="${k}"]`);
  const solid = bld ? [...bld.querySelectorAll('path, rect, circle, ellipse, polygon, polyline, use, text, line')]
    .filter((e) => !e.closest('.smoke, .plume, .ember, .glow')) : [];
  const parts = [...solid, document.querySelector(`.npc.stand[data-place="${k}"]`)]
    .filter(Boolean).map((e) => e.getBoundingClientRect()).filter((r) => r.width || r.height);
  if (!parts.length || !v.width) return null;
  const x0 = Math.min(...parts.map((r) => r.left)), x1 = Math.max(...parts.map((r) => r.right));
  const y0 = Math.min(...parts.map((r) => r.top)), y1 = Math.max(...parts.map((r) => r.bottom));
  return { cx: ((x0 + x1) / 2 - v.left) / v.width, cy: ((y0 + y1) / 2 - v.top) / v.height,
    w: (x1 - x0) / v.width, h: (y1 - y0) / v.height };
}

// The part of the stage the open sheet leaves free (above a bottom sheet, left of a side sheet).
function freeArea() {
  const { W, H } = stageSize(), p = $('#placePanel');
  if (p.hidden) return { x0: 0, y0: 0, x1: W, y1: H };
  const t = $('#town').getBoundingClientRect(), r = p.getBoundingClientRect();
  return r.left - t.left > W * 0.3 ? { x0: 0, y0: 0, x1: r.left - t.left, y1: H } : { x0: 0, y0: 0, x1: W, y1: r.top - t.top };
}

// Frame place k in the free area: the building and its keeper filling most of it, or (zoom = false)
// at cover scale looking at it. The scale never drops below what keeps the free area covered.
function frameOn(k, zoom = true) {
  const { W } = stageSize(), f = k && placeFrame(k), a = freeArea(), base = coverScale();
  if (!f) return null;
  const aw = a.x1 - a.x0, ah = a.y1 - a.y0, floor = Math.max(1, ah / (W / 3), aw / W);
  const s = zoom ? clamp(Math.min(aw * 0.78 / (f.w * W), ah * 0.8 / (f.h * W / 3)), floor, Math.max(base * 1.3, 3.4)) : base;
  return clampView({ s, tx: (a.x0 + a.x1) / 2 - s * f.cx * W, ty: (a.y0 + a.y1) / 2 - s * f.cy * W / 3 });
}

// The square at first sight: cover scale, looking at the bonfire in the middle of town (map x 600).
function homeView() {
  const { W, H } = stageSize(), s = coverScale(), cx = (600 - MAP_X0) / MAP_W;
  return clampView({ s, tx: W / 2 - s * cx * W, ty: H - s * W / 3 });
}

function setView(v, glide) {
  if (!v) return;
  view = v;
  const el = $('#townView');
  el.classList.toggle('glide', !!glide && !reduced);
  el.style.transform = `translate(${v.tx.toFixed(1)}px, ${v.ty.toFixed(1)}px) scale(${v.s.toFixed(3)})`;
  el.style.setProperty('--zinv', (1 / v.s).toFixed(3));
}

// Called after every village render, and with force on resize.
function zoomTown(force = false) {
  const k = state.place;
  document.querySelectorAll('.npc.stand').forEach((n) => n.classList.toggle('here', n.dataset.place === k));
  $('#town').classList.toggle('sheetOpen', !$('#placePanel').hidden);
  if (!$('#town').clientWidth) { zoomedTo = undefined; view = null; return; }   // screen hidden: frame it on the next render
  if (!force && view && k === zoomedTo) return;
  const from = zoomedTo, first = !view;
  zoomedTo = k;
  if (!force) hideSay();
  if (force || first) {
    // Resize or first sight: frame without a glide. On the square, keep looking where you were.
    const keep = view && !k ? { cx: (stageSize().W / 2 - view.tx) / (view.s * stageSize().W) } : null;
    if (k) return setView(frameOn(k));
    if (!keep) return setView(homeView());
    const { W } = stageSize(), s = coverScale();
    return setView(clampView({ s, tx: W / 2 - s * keep.cx * W, ty: -Infinity }));
  }
  // Into a building: glide onto it. Back to the square: glide out, still looking at the building you left.
  setView(k ? frameOn(k) : frameOn(from, false) || homeView(), true);
}

// Drag (mouse or finger) to look around the village; the wheel pans sideways. A drag never counts as a tap.
function buildStage() {
  const town = $('#town');
  let drag = null, dragged = false;
  town.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0 || !view || ev.target.closest('#placePanel, .townHud, .dock, #npcSay')) return;
    drag = { x: ev.clientX, y: ev.clientY, v: { ...view }, id: ev.pointerId, moved: false };
  });
  town.addEventListener('pointermove', (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 8) return;
      drag.moved = true;
      town.setPointerCapture(drag.id);
      town.classList.add('panning');
      hideSay();
    }
    setView(clampView({ s: drag.v.s, tx: drag.v.tx + dx, ty: drag.v.ty + dy }));
  });
  const end = () => {
    if (drag?.moved) { dragged = true; setTimeout(() => { dragged = false; }, 0); }
    drag = null;
    town.classList.remove('panning');
  };
  town.addEventListener('pointerup', end);
  town.addEventListener('pointercancel', end);
  town.addEventListener('click', (ev) => { if (dragged) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  town.addEventListener('wheel', (ev) => {
    if (!view || ev.target.closest('#placePanel')) return;
    ev.preventDefault();
    hideSay();
    setView(clampView({ s: view.s, tx: view.tx - (ev.deltaX || ev.deltaY), ty: view.ty - (ev.deltaX ? ev.deltaY : 0) }));
  }, { passive: false });
}

function openPlace(k) {
  state.place = k;
  state.booth = null; state.boothNews = '';   // walking away from the carnival abandons any game in progress
  hideSay();
  state.keeperLoot = '';
  keeperGreet(k);
  deliverTo(k);
  if (k === 'pvp') rollDuels();   // fresh challengers wait at the rope every visit
  if (k === 'tavern') state.tip = Math.floor(Math.random() * TIPS.length);
  state.sheet = null;
  render();
}

function villageAction(k) {
  const [verb, arg, arg2] = k.split(':');
  if (verb === 'open') return openPlace(arg);
  if (verb === 'homeshop') { state.marketTab = 'home'; return openPlace('market'); }
  if (verb === 'fight') return startGauntlet();
  if (verb === 'duel') return startDuel(Number(arg));
  if (verb === 'gjoin') { joinGuild(arg); return render(); }
  if (verb === 'hunt') return startHunt(arg);
  if (verb === 'dungeon') return startDungeon(arg);
  if (verb === 'continue') { state.runPending = false; state.battle++; return startBattle(false); }
  if (verb === 'team') { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (verb === 'skills') { state.screen = 'skills'; render(); window.scrollTo(0, 0); return; }
  if (verb === 'play') { if (startBooth(arg)) { render(); runBooth(); } return; }
  if (verb === 'sheet') { state.place = null; state.booth = null; state.sheet = arg && state.sheet !== arg ? arg : null; }
  else if (verb === 'back') { state.place = null; state.booth = null; }
  else if (verb === 'bclaim') claimBounty(Number(arg));
  else if (verb === 'breroll') rerollBounties();
  else if (verb === 'leave') { state.booth = null; state.boothNews = 'You walked away. The entry fee stays with Zazzo.'; }
  else if (verb === 'abandon') { state.runPending = false; state.phase = 'idle'; }
  else if (verb === 'hero') state.forgeHero = arg;
  else if (verb === 'up') { if (forgeUp(arg)) { keeperReact('forge'); questEvent('forge'); } }
  else if (verb === 'buy') { if (buyItem(arg)) { keeperReact('market'); questEvent('buy'); } }
  else if (verb === 'trinket') { if (buyTrinket(arg)) { keeperReact('jeweler'); questEvent('trinket'); } }
  else if (verb === 'sell') { if (sellTrinket()) keeperReact('jeweler'); }
  // Your House: furniture, satchel ↔ stash, and trinkets between the stash and your champions.
  else if (verb === 'mtab') state.marketTab = arg;
  else if (verb === 'decor') { if (buyDecor(arg)) keeperReact('market'); }
  else if (verb === 'store') storeItem(arg);
  else if (verb === 'take') takeItem(arg);
  else if (verb === 'give') { if (giveTrinket(arg, arg2) && state.place === 'jeweler') keeperReact('jeweler'); }
  else if (verb === 'unequip') unequipTrinket(arg);
  else if (verb === 'codex') state.codex = arg;
  else if (verb === 'rumor') state.tip += 1 + Math.floor(Math.random() * (TIPS.length - 1));
  else if (verb === 'quest') { if (acceptQuest(arg)) { state.keeperSays = `Good${youName() ? `, ${youName()}` : ''}. Come back when it is done.`; state.keeperLoot = ''; } }
  else if (verb === 'claim') { const got = claimQuest(arg); if (got) { state.keeperSays = QUEST_BY_ID[arg].done; state.keeperLoot = got; } }
  render();
}

function buildVillage() {
  const town = $('#town');
  town.addEventListener('click', (ev) => {
    if (ev.target.closest('#placePanel, .townHud')) return;   // they have their own handlers
    const dk = ev.target.closest('.dock [data-k]');
    if (dk) return villageAction(dk.dataset.k);
    const said = ev.target.closest('#npcSay [data-k]');
    if (said) return sayAction(said.dataset.k);
    if (ev.target.closest('#npcSay')) return;
    const b = ev.target.closest('.bld, .npc.stand'), folk = ev.target.closest('.npc.walker');
    if (folk) folkTalk(folk);
    else if (b) openPlace(b.dataset.place);
    else hideSay();
  });
  town.addEventListener('keydown', (ev) => {
    const b = ev.target.closest('.bld');
    if (b && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openPlace(b.dataset.place); }
  });
  $('#placePanel').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-k]');
    if (b && !b.disabled) villageAction(b.dataset.k);
  });
  $('#villageBtn').addEventListener('click', toVillage);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') hideSay(); });
  addEventListener('resize', () => { if (!$('#villageScreen').hidden) zoomTown(true); });
  buildStage();
  // Gear → game mechanics window. Its tabs re-render in place; Esc or Close shuts it.
  const dlg = $('#rulesDlg');
  $('#gearBtn').addEventListener('click', () => { hideSay(); $('#rulesBody').innerHTML = codexHTML(); dlg.showModal(); });
  dlg.addEventListener('click', (ev) => {
    if (ev.target === dlg || ev.target.closest('[data-close]')) return dlg.close();   // backdrop or Close
    const tab = ev.target.closest('[data-k^="codex:"]');
    if (tab) { state.codex = tab.dataset.k.split(':')[1]; $('#rulesBody').innerHTML = codexHTML(); }
  });
  rollFolk();
}

/* ==================================================================
   RENDERING — battle
   ================================================================== */
const artOf = (u) => u.art || u.id;
const unitClasses = (u) => `${u.side}${u.summon ? ' summon' : ''}${u.summon && SUMMONS[u.id].copy ? ' illusion' : ''}${u.monster ? ' monster' : ''}${u.elite ? ' elite' : ''}${u.boss ? ' boss' : ''}`;

// A champion standing on the battlefield (--d staggers the idle breathing so nobody bobs in sync).
function unitCardHTML(u) {
  return `
    <div class="unit ${unitClasses(u)}" id="u-${u.uid}" data-uid="${u.uid}" style="--d:${(-Math.random() * 2.6).toFixed(2)}s">
      <ul class="chips"></ul>
      <div class="plate">
        <div class="who"><strong>${u.name}</strong><span class="lvl"></span></div>
        <div class="bar hp"><div class="fill"></div><span></span></div>
        ${u.maxMp ? '<div class="bar mp"><div class="fill"></div><span></span></div>' : ''}
        ${u.faction === 'mech' && !u.summon ? '<div class="bar heat"><div class="fill"></div><span></span></div>' : ''}
      </div>
      <div class="body"><div class="upic">${spriteSVG(artOf(u))}${animImgHTML(u)}<div class="stfx"></div></div></div>
    </div>`;
}

/* Status overlays: characters/animations/status/<id>.webp are looping transparent clips drawn in the
   champion art's own 100x100 space, so they sit straight over .upic (see .stfx in the CSS).
   Soaked follows soaked(u), so wet weather drips on everyone too. */
const STATUS_FX = ['stride', 'roots', 'soaked', 'poison', 'bleed', 'burn', 'stun'];
const ROOTS_GROW_MS = 585;  // roots-grow.webp plays once (13 frames x 45 ms), then the looping roots.webp takes over
// 'stride' = a breeze at the feet of everyone sped up by Elowen's Forest Stride (same test as barAgi).
const statusOn = (u, id) => (id === 'soaked' ? soaked(u)
  : id === 'roots' ? u.effects.some((e) => e.id === 'slow' && e.roots)
  : id === 'stride' ? alliesOf(u).some((a) => pv(a).haste) : has(u, id));
function syncStatusFx(el, u) {
  const host = el.querySelector('.stfx');
  if (!host) return;
  const on = u.hp > 0 ? STATUS_FX.filter((id) => statusOn(u, id)) : [];
  const key = on.join();
  if (host.dataset.on === key) return;  // unchanged: leave the running clips alone
  const was = (host.dataset.on || '').split(',');
  host.dataset.on = key;
  // Freshly entangled: the roots burst out of the ground first, then settle into their idle sway.
  const sprout = on.includes('roots') && !was.includes('roots') && !reduced;
  host.innerHTML = on.map((id) => {
    const src = id === 'roots' && sprout ? `roots-grow.webp?t=${Date.now()}` : `${id}.webp`;
    return `<img src="${ANIM_DIR}status/${src}" alt="" draggable="false" data-fx="${id}">`;
  }).join('');
  if (sprout) {
    setTimeout(() => {
      const img = host.querySelector('img[data-fx="roots"]');
      if (img) img.src = `${ANIM_DIR}status/roots.webp`;
    }, ROOTS_GROW_MS);
  }
  for (const id of STATUS_FX) el.classList.toggle(`st-${id}`, on.includes(id));
}

function tokenHTML(u) {
  return `
    <div class="tok ${unitClasses(u)} body-${lookOf(artOf(u)).body}" id="tok-${u.uid}" title="${u.name}">
      <div class="face">${spriteSVG(artOf(u))}</div>
      <span class="st" hidden></span>
    </div>`;
}

function buildArena() {
  for (const side of ['p', 'e']) $(`#side-${side}`).innerHTML = state.teams[side].map(unitCardHTML).join('');
  $('#acts').dataset.uid = '';
  const track = $('#track');
  track.querySelectorAll('.tok').forEach((t) => t.remove());
  track.insertAdjacentHTML('beforeend', allUnits().map(tokenHTML).join(''));
  layoutSides();
  renderTrack(0);
  prefetchClips();
}

// A summon appearing mid-battle gets its place on the field and a speed-bar icon.
function addUnitDom(u) {
  $(`#side-${u.side}`).insertAdjacentHTML('beforeend', unitCardHTML(u));
  $('#track').insertAdjacentHTML('beforeend', tokenHTML(u));
  layoutSides();
  renderTrack(0);
  prefetchClips();
}

function unitLevelText(u) {
  if (!u.summon) return `Lv ${u.level}`;
  if (u.expires == null) return 'Summon';
  const left = Math.max(1, Math.ceil((u.expires - state.time) / ROUND_TIME));
  return `${left} round${left === 1 ? '' : 's'}`;
}

/* Field formation: [x%, feet y%] for your warband; enemies mirror x.
   Melee champions take the front spot, then ranged, then support. Summons stand closer to the middle. */
const SLOTS = {
  hero:   [[28, 74], [15, 56], [17, 96], [39, 88], [38, 54]],   // 4th and 5th spots are for monster packs
  summon: [[40, 63], [41, 89], [37, 46]],
};
const ROLE_ORDER = { melee: 0, ranged: 1, support: 2 };

function layoutSides() {
  for (const side of ['p', 'e']) {
    const place = (u, [x, y]) => {
      const el = actorEl(u);
      if (!el) return;
      el.style.setProperty('--x', side === 'p' ? x : 100 - x);
      el.style.setProperty('--y', y);
      el.style.zIndex = y;   // lower on the field = closer to you = drawn in front
    };
    state.teams[side].filter((u) => !u.summon)
      .sort((a, b) => (b.boss ? 1 : 0) - (a.boss ? 1 : 0) || ROLE_ORDER[a.role] - ROLE_ORDER[b.role])   // a boss takes the front spot
      .forEach((u, i) => place(u, SLOTS.hero[i % SLOTS.hero.length]));
    state.teams[side].filter((u) => u.summon)
      .forEach((u, i) => place(u, SLOTS.summon[i % SLOTS.summon.length]));
  }
}

/* ==================================================================
   ANIMATED CHAMPIONS
   characters/animations/ holds a looping idle and a one-shot attack
   clip per champion, with manifest.json giving each clip's size, the
   point its feet stand on, and the time the blow lands (hitMs). The
   clips sit on top of the SVG art rather than replacing it: a champion
   with no entry, a clip that fails to load, or a visitor who asked for
   reduced motion all keep the static sprite and the CSS poses below.
   Only battlefield champions animate — speed-bar icons, the village and
   the champion cards stay on the SVGs they were drawn for.
   ================================================================== */
const ANIM_DIR = 'characters/animations/';
const ANIM_FOOT = 0.94;   // the SVGs plant their feet here, so the clips line up when they do too
let ANIM = null;          // manifest.json once it loads, and null for the whole session if it never does

if (!reduced) {
  fetch(`${ANIM_DIR}manifest.json`).then((r) => (r.ok ? r.json() : null)).then((m) => { ANIM = m; })
    .catch(() => { /* no manifest: every champion keeps its SVG */ });
}

const animOf = (u) => ANIM?.[artOf(u)];
const animImg = (u) => actorEl(u)?.querySelector('.upic.animated .anim');

/* A clip's box, in multiples of --size. The SVG stands its feet at the middle of the body box,
   ANIM_FOOT of the way down, so scale the clip by its own foot height and slide its foot point
   onto that same spot. Enemies are mirrored by CSS, which puts their feet the other side of the
   frame's centre, so measure from the far edge for them. */
function clipVars(e, side) {
  const k = ANIM_FOOT / e.footY;
  const footX = side === 'e' ? e.w - e.footX : e.footX;
  return { '--aw': e.w * k, '--ah': e.h * k, '--ax': 0.5 - footX * k };
}
const clipStyle = (e, side) => Object.entries(clipVars(e, side)).map(([k, v]) => `${k}:${v.toFixed(4)}`).join(';');
const sizeClip = (img, e, side) => Object.entries(clipVars(e, side)).forEach(([k, v]) => img.style.setProperty(k, v.toFixed(4)));

// The idle clip, laid over the SVG in the champion's card. Empty for anyone without one.
function animImgHTML(u) {
  const a = animOf(u);
  return a ? `<img class="anim" src="${ANIM_DIR}${a.idle.src}" alt="" draggable="false" style="${clipStyle(a.idle, u.side)}">` : '';
}

/* Attack clips are held as Blobs, because a fresh object URL is what rewinds an animated WebP to
   frame 0 — re-using one URL just leaves it running. The Blob is fetched once per champion, so
   every replay after the first costs nothing but a new handle on bytes already in memory. */
const clipBlobs = new Map();   // file name → its Blob, or null while in flight / if it failed
function fetchClip(src) {
  if (clipBlobs.has(src)) return;
  clipBlobs.set(src, null);
  fetch(ANIM_DIR + src).then((r) => (r.ok ? r.blob() : null)).then((b) => clipBlobs.set(src, b)).catch(() => {});
}
// Warms the attack clips of everyone on the field, so the first swing of a battle doesn't stall on a fetch.
function prefetchClips() {
  for (const u of allUnits()) { const a = animOf(u); if (a) fetchClip(a.attack.src); }
}

/* Starts a champion's attack clip, and returns how long to wait for the blow to land —
   or null when there is no clip to play, which is the signal to fall back to a CSS pose.
   Multi-hit skills call this once per hit: rather than restart on every one, the follow-ups
   ride the clip already playing, paced by its own hit frames where the artist drew several. */
function playAttack(u) {
  const a = animOf(u), img = animImg(u);
  const blob = a && clipBlobs.get(a.attack.src);
  if (!a || !img || !blob) return null;
  const hits = a.attack.hitsMs || [];
  if (img.clipUntil > performance.now()) return hits.length > 1 ? hits[1] - hits[0] : 140;

  const url = URL.createObjectURL(blob);
  img.clipUntil = performance.now() + a.attack.ms;
  sizeClip(img, a.attack, u.side);
  img.src = url;
  setTimeout(() => {
    URL.revokeObjectURL(url);
    if (img.src !== url) return;   // a later swing already took the clip over
    sizeClip(img, a.idle, u.side);
    img.src = ANIM_DIR + a.idle.src;
  }, a.attack.ms);
  return a.attack.hitMs;
}

/* ==================================================================
   BATTLEFIELD CHOREOGRAPHY (whole-sprite movement)
   Champions run, leap, shoot and react to hits. Every helper resolves
   when its motion lands, so the combat code can simply await it.
   Later, champions redrawn as body-part layers can swap in richer poses here.
   ================================================================== */
const actorEl = (u) => document.getElementById(`u-${u.uid}`);
const bodyEl = (u) => actorEl(u)?.querySelector('.body');
const facing = (u) => (u.side === 'p' ? 1 : -1);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Resolves when a Web Animation finishes, or after its duration if the tab is hidden and not painting.
const done = (anim, ms) => Promise.race([anim.finished.catch(() => {}), sleep(ms + 40)]);

// Where a champion stands on the stage, in pixels relative to the battlefield.
function stageBox(u) {
  const b = bodyEl(u);
  if (!b) return null;
  const s = $('#arena').getBoundingClientRect(), r = b.getBoundingClientRect();
  return { x: r.left + r.width / 2 - s.left, feet: r.bottom - s.top, top: r.top - s.top, w: r.width, h: r.height };
}

// Melee: run up to the target (or the front of a group) and stop just in front of it.
async function dashTo(u, targets) {
  const el = actorEl(u), me = stageBox(u);
  const boxes = targets.map(stageBox).filter(Boolean);
  if (reduced || !el || !me || !boxes.length) return null;
  const dir = facing(u);
  const front = dir > 0 ? Math.min(...boxes.map((b) => b.x)) : Math.max(...boxes.map((b) => b.x));
  const tx = targets.length > 1 ? front : boxes[0].x;
  const ty = boxes.reduce((s, b) => s + b.feet, 0) / boxes.length;
  const dx = tx - dir * (boxes[0].w * 0.45 + me.w * 0.3) - me.x;
  const dy = ty + 2 - me.feet;
  const end = `${dx.toFixed(1)}px ${dy.toFixed(1)}px`;
  el.style.zIndex = 200;
  const anim = el.animate(
    [{ translate: '0 0' }, { translate: `${(dx * 0.55).toFixed(1)}px ${(dy * 0.55 - 26).toFixed(1)}px`, offset: 0.5 }, { translate: end }],
    { duration: beat(320), easing: 'ease-in-out', fill: 'forwards' });
  await done(anim, beat(320));
  return { anim, end };
}

async function dashBack(u, trip) {
  if (!trip) return;
  const el = actorEl(u);
  if (el) {
    const back = el.animate([{ translate: trip.end }, { translate: '0 0' }], { duration: beat(280), easing: 'ease-out' });
    trip.anim.cancel();
    await done(back, beat(280));
  }
  layoutSides();   // restores normal depth order
}

function pose(u, frames, ms) {
  const b = bodyEl(u);
  if (!b || reduced || u.hp <= 0) return null;   // the fallen don't flinch, hop or swing
  return b.animate(frames, { duration: beat(ms), easing: 'ease-out' });
}

// Weapon swing: lean in and twist, or the champion's own attack clip. Resolves at the moment of impact.
async function strikePose(u) {
  const hit = playAttack(u);
  if (hit != null) return sleep(hit);
  const d = facing(u);
  if (!pose(u, [{ transform: 'none' }, { transform: `translateX(${d * 14}px) rotate(${d * 12}deg)`, offset: 0.4 }, { transform: 'none' }], 240)) return;
  await sleep(beat(100));
}

// Ranged wind-up: a small recoil before the shot.
async function aimPose(u) {
  const hit = playAttack(u);
  if (hit != null) return sleep(hit);
  const d = facing(u);
  if (!pose(u, [{ transform: 'none' }, { transform: `translateX(${-d * 6}px) rotate(${-d * 4}deg)`, offset: 0.5 }, { transform: 'none' }], 260)) return;
  await sleep(beat(120));
}

/* Spells, buffs, summons, guard and potions: a hop with a golden glow.
   `clip` plays the champion's own attack animation instead, which suits a skill they
   perform — a heal, a ward, a summon — but not raising a guard or drinking a draught. */
async function castPose(u, clip = false) {
  const hit = clip ? playAttack(u) : null;
  if (hit != null) return sleep(hit);
  if (!pose(u, [{ transform: 'none', filter: 'none' },
    { transform: 'translateY(-12px)', filter: 'brightness(1.4) drop-shadow(0 0 8px #e8a548)', offset: 0.4 },
    { transform: 'none', filter: 'none' }], 420)) return;
  await sleep(beat(200));
}

// Getting hit: knocked back toward its own side, flashing white. Crits hit harder and shake the field.
function knock(t, crit) {
  burst(t, 'hit');
  const back = -facing(t);
  pose(t, [{ transform: 'none', filter: 'none' },
    { transform: `translateX(${back * (crit ? 18 : 10)}px) rotate(${back * (crit ? 8 : 4)}deg)`, filter: 'brightness(2.2)', offset: 0.25 },
    { transform: 'none', filter: 'none' }], crit ? 380 : 280);
  if (crit && !reduced) $('#arena').animate([{ translate: '0 0' }, { translate: '5px -3px' }, { translate: '-4px 3px' }, { translate: '0 0' }], { duration: beat(260) });
}

// Dodging: a quick hop backward.
function dodgeHop(t) {
  const back = -facing(t);
  pose(t, [{ transform: 'none' }, { transform: `translate(${back * 22}px, -10px)`, offset: 0.4 }, { transform: 'none' }], 320);
}

function burst(u, kind) {
  const b = bodyEl(u);
  if (!b) return;
  const el = document.createElement('div');
  el.className = `burst burst-${kind}`;
  b.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

  caltrop: [14, 14, `<path d="M7 0 L8.5 5.5 L14 7 L8.5 8.5 L7 14 L5.5 8.5 L0 7 L5.5 5.5 Z" fill="#9aa3b5" ${PI_}/>`],
};

function projectileFor(u, sk) {
  const o = sk.o || {}, a = lookOf(artOf(u)) || {};
  const own = sk.id === 'attack' ? PROJ_ATTACK[u.id] : PROJ_SKILL[sk.name];
  if (own) return own;
  if (o.element === 'lightning') return { kind: 'bolt' };
  if (a.weapon === 'pot') return { kind: 'fire', arc: true };
  if ((o.fx || []).some(([id]) => id === 'burn')) return { kind: 'fire' };
  if (a.body === 'bot') return { kind: 'bullet' };
  switch (a.weapon) {
    case 'bow': return { kind: 'arrow' };
    case 'crossbow': return { kind: 'xbolt' };
    case 'gun': return a.orb ? { kind: 'orb', color: a.orb } : { kind: 'bullet' };
    case 'cannon': return { kind: 'shell', arc: true };
    case 'spear': case 'trident': return { kind: 'spear' };
    default: return { kind: 'orb', color: a.orb || '#9fe08a' };
  }
}

async function shoot(u, t, p) {
  const s = stageBox(u), e = stageBox(t);
  if (reduced || !s || !e) return;
  const d = facing(u);
  const from = { x: s.x + d * s.w * 0.3, y: s.top + s.h * 0.45 };
  const to = { x: e.x, y: e.top + e.h * 0.45 };
  if (p.kind === 'bolt') return zap(from, to);
  const el = document.createElement('div');
  el.className = `proj proj-${p.kind}`;
  if (p.color) el.style.setProperty('--c', p.color);
  const art = PROJ_ART[p.kind];
  if (art) {
    const [w, h, svg] = art;
    Object.assign(el.style, { width: `${w}px`, height: `${h}px`, margin: `${-h / 2}px 0 0 ${-w / 2}px` });
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${svg}</svg>`;
  }
  $('#arena').appendChild(el);
  // Flight time grows with distance; lobbed shots (pots, shells) hang a little longer in the air.
  const dist = Math.hypot(to.x - from.x, to.y - from.y);
  const ms = beat(p.arc ? clamp(dist * 0.6, 240, 400) : clamp(dist * 0.4, 120, 260));
  const deg = (dx, dy) => Math.atan2(dy, dx) * 180 / Math.PI;
  const ang = p.upright ? 0 : deg(to.x - from.x, to.y - from.y);
  const at = (x, y, r) => `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(1)}deg)`;
  let frames;
  if (p.arc) {
    // Lobbed: a smooth parabola (quadratic curve peaking ~70px above the higher end), sampled into keyframes.
    // arc: true tumbles end over end; arc: 'curve' flies nose-first along the curve.
    const c = { x: (from.x + to.x) / 2, y: Math.min(from.y, to.y) - 140 };
    let prev = null;
    frames = Array.from({ length: 13 }, (_, i) => {
      const k = i / 12, j = 1 - k;
      const x = j * j * from.x + 2 * j * k * c.x + k * k * to.x, y = j * j * from.y + 2 * j * k * c.y + k * k * to.y;
      let r = p.upright ? 0 : p.arc === 'curve' ? deg(j * (c.x - from.x) + k * (to.x - c.x), j * (c.y - from.y) + k * (to.y - c.y)) : facing(u) * 360 * k;
      if (prev != null && p.arc === 'curve') r += 360 * Math.round((prev - r) / 360);   // no spinning the long way round
      prev = r;
      return { transform: at(x, y, r) };
    });
  } else frames = [{ transform: at(from.x, from.y, ang) }, { transform: at(to.x, to.y, ang) }];
  const anim = el.animate(frames, { duration: ms, easing: p.arc ? 'ease-in-out' : 'linear' });
  await done(anim, ms);
  el.remove();
  const impact = p.impact || ((p.kind === 'fire' || p.kind === 'shell') ? 'fire' : null);
  if (impact === 'boom') { burst(t, 'fire'); burst(t, 'smoke'); } else if (impact) burst(t, impact);
}

// Lightning: a jagged bolt that flickers between attacker and target.
async function zap(from, to) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'bolt');
  const pts = [[from.x, from.y]];
  for (let i = 1; i < 6; i++) {
    const k = i / 6;
    pts.push([from.x + (to.x - from.x) * k + (Math.random() - 0.5) * 18, from.y + (to.y - from.y) * k + (Math.random() - 0.5) * 28]);
  }
  pts.push([to.x, to.y]);
  svg.innerHTML = `<polyline points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(',')).join(' ')}"/>`;
  $('#arena').appendChild(svg);
  const anim = svg.animate([{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 0.5, offset: 0.5 }, { opacity: 1, offset: 0.7 }, { opacity: 0 }], { duration: beat(300) });
  await done(anim, beat(300));
  svg.remove();
}

// Maren's Backwash / Malgrath's Infernal Toll mark: when an enemy uses a skill, a beam shoots from Maren or
// Malgrath to the caster and bursts on impact. Backwash is a wavy surge of water that sheds droplets; Infernal
// Toll (fire = true) is a jagged hellfire beam that sheds embers. Purely visual (spellToll / infernalToll deal the damage).
async function backwash(src, u, fire = false) {
  const s = stageBox(src), e = stageBox(u);
  if (reduced || !s || !e) return;
  const from = { x: s.x + facing(src) * s.w * 0.22, y: s.top + s.h * 0.3 };
  const to = { x: e.x, y: e.top + e.h * 0.5 };
  const dx = to.x - from.x, dy = to.y - from.y, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;  // unit normal: the wave wobbles across the beam
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const k = i / 28, w = (fire ? (i % 2 ? 1 : -1) * (2 + Math.random() * 4) : Math.sin(k * Math.PI * 5) * 6) * Math.sin(k * Math.PI);
    pts.push(`${(from.x + dx * k + nx * w).toFixed(1)},${(from.y + dy * k + ny * w).toFixed(1)}`);
  }
  const line = pts.join(' ');
  const drops = [0.3, 0.5, 0.7].map((k, i) => {
    const side = i % 2 ? 1 : -1;
    return `<circle cx="${(from.x + dx * k + nx * 9 * side).toFixed(1)}" cy="${(from.y + dy * k + ny * 9 * side).toFixed(1)}" r="2.6"/>`;
  }).join('');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', `bolt backwash${fire ? ' hellfire' : ''}`);
  svg.innerHTML = ['bw-glow', 'bw-body', 'bw-core'].map((c) =>
    `<polyline class="${c}" points="${line}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>`).join('') + drops;
  $('#arena').appendChild(svg);
  const ms = beat(520);
  // The surge races out from Maren to the caster, then the whole beam fades.
  for (const pl of svg.querySelectorAll('polyline')) {
    pl.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0, offset: 0.45 }, { strokeDashoffset: 0 }], { duration: ms, fill: 'forwards' });
  }
  svg.querySelectorAll('circle').forEach((c, i) => c.animate(
    [{ opacity: 0, transform: 'translateY(0)' }, { opacity: 1, offset: 0.25 + i * 0.08 }, { opacity: 0, transform: `translateY(${fire ? -14 : 14}px)` }],
    { duration: ms, fill: 'forwards' }));  // droplets fall, embers rise
  setTimeout(() => burst(u, fire ? 'fire' : 'splash'), ms * 0.45);
  const anim = svg.animate([{ opacity: 1 }, { opacity: 1, offset: 0.6 }, { opacity: 0 }], { duration: ms });
  await done(anim, ms);
  svg.remove();
}

// Positions every icon on the speed bar. ms = glide time for this move.
function renderTrack(ms) {
  for (const u of allUnits()) {
    const el = $(`#tok-${u.uid}`);
    if (!el) continue;
    el.style.setProperty('--dur', `${Math.round(ms)}ms`);
    el.style.setProperty('--x', ((u.pos || 0) / TRACK * 100).toFixed(2));
    const isFrozen = hardFrozen(u), isSlow = !!has(u, 'slow');
    const isStagger = staggerPhase(u) != null, halted = staggerStopped(u);
    el.classList.toggle('frozen', isFrozen);
    el.classList.toggle('stagger', isStagger && !isFrozen);
    el.classList.toggle('halt', halted && !isFrozen);
    el.classList.toggle('slow', isSlow && !isFrozen && !isStagger);
    el.classList.toggle('down', u.hp <= 0);
    el.classList.toggle('acting', state.active === u.uid && !state.moving && !['won', 'lost', 'cleared'].includes(state.phase));
    const st = el.querySelector('.st');
    const label = isFrozen ? (has(u, 'overheat') ? 'Overheated' : 'Stunned')
      : isStagger ? (isSlow ? 'Staggered + Slow' : 'Staggered') : isSlow ? 'Slowed' : '';
    st.hidden = !label;
    st.textContent = label;
    el.setAttribute('aria-label', `${u.side === 'p' ? 'Your' : 'Enemy'} ${u.name}${label ? `, ${label.toLowerCase()}` : ''}`);
  }
}

function passiveText(u) {
  if (u.summon) return `<b>Summon.</b> ${SUMMONS[u.id].desc}`;
  if (u.monster) {
    const m = MONSTERS[u.id];
    return `${m.lore}${m.passive ? `<span class="cpas">${skillIcon(m.passive)}<span><b>Passive · ${m.passive.name}:</b> ${m.passive.desc}</span></span>` : ''}`;
  }
  const weather = favored(u) ? ` <b>${WEATHER[wx()].name}</b> favors this champion.` : '';
  // Every passive in this champion's loadout (their own and any generic ones).
  const c = charById(u.id);
  const list = (u.passives || ['own']).map((id) => passiveById(c, id)).filter(Boolean);
  const own = list.map((ps) => `<span class="cpas">${skillIcon(ps)}<span><b>Passive · ${ps.name}:</b> ${ps.desc}</span></span>`).join('');
  return factionPassive(u) + weather + own;
}

function factionPassive(u) {
  const f = FACTIONS[u.faction];
  if (u.faction === 'mech') {
    const sear = contactBurn(u);
    if (soaked(u)) return `<b>Heat ${u.heat}/100 · Soaked:</b> the water keeps the Heat doused at 0 until the Soaked wears off.`;
    return `<b>Heat ${u.heat}/100:</b> +${Math.round(u.heat / 2.5)}% damage. Overheat bar ${heatTier(u)}/4${sear ? `, sears contact for ${sear}` : ''}. Overheats at 100.`;
  }
  if (u.faction === 'orc') return `<b>Rage:</b> +${Math.round(50 * (1 - u.hp / u.maxHp))}% damage from missing HP.`;
  if (u.faction === 'human') {
    const last = u.lastAction ? skillsOf(u).find((s) => s.id === u.lastAction).name : null;
    return `<b>Discipline:</b> +${Math.round(disciplineBonus() * 100)}% if you don't repeat your last action${last ? ` (${last})` : ''}.`;
  }
  if (u.race === 'elf') return `<b>Precision ${u.stacks}/3:</b> +${u.stacks * 10}% crit. Resets when hit.`;
  if (u.race === 'dwarf') return `<b>Fortify ${u.stacks}/3:</b> −${u.stacks * 8}% damage taken.`;
  if (u.faction === 'tide') return highTide() ? '<b>High Tide:</b> +25% damage and healing this round.' : '<b>Low Tide.</b> High Tide arrives next round.';
  if (u.faction === 'crimson') return `<b>Bloodthirst:</b> every hit drains ${wx() === 'moon' ? 40 : 20}% of the damage dealt as HP.`;
  return f.rule;
}

function passiveChips(u) {
  const c = [];
  if (u.faction === 'orc') { const r = Math.round(50 * (1 - u.hp / u.maxHp)); if (r > 0 && u.hp > 0) c.push(`Rage +${r}%`); }
  if (u.race === 'elf' && u.stacks) c.push(`Precision ${u.stacks}`);
  if (u.race === 'dwarf' && u.stacks) c.push(`Fortify ${u.stacks}`);
  if (u.faction === 'tide' && highTide() && u.hp > 0) c.push('High Tide');
  if (favored(u) && u.hp > 0) c.push(WEATHER[wx()].name);
  return c.map((t) => `<li class="chip pass">${t}</li>`).join('');
}

function renderBattle() {
  const act = unitBy(state.active);
  const pending = pendingAction(act);
  const targets = pending ? validTargets(act, pending) : [];

  const hunt = huntDepth(), dg = dungeonRun();
  $('#tagline').textContent = dg
    ? `${dg.name}, ${dgIsBossRoom() ? 'boss room' : `room ${state.dg.room + 1} of ${dgRooms(dg)}`}. Warband level ${state.level}.`
    : hunt ? `${CAVE.name}, ${hunt.name}. Warband level ${state.level}.`
    : `Ashfall Road, battle ${state.battle + 1} of ${state.order.length}. Warband level ${state.level}.`;
  // Dungeons: the ladder lists the rooms, ending with the boss.
  $('#ladder').innerHTML = dg ? Array.from({ length: dgRooms(dg) }, (_, i) => {
    const done = i < state.dg.room || (i === state.dg.room && state.phase === 'won');
    const cls = done ? 'done' : i === state.dg.room ? 'now' : '';
    return `<li class="${cls}"><span class="n">${i + 1}</span><span class="nm">${i === dg.rooms.length ? MONSTERS[dg.boss].name : `Room ${i + 1}`}</span></li>`;
  }).join('') : hunt ? '' : state.order.map((k, i) => {
    const done = i < state.battle || (i === state.battle && (state.phase === 'won' || state.phase === 'cleared'));
    const cls = done ? 'done' : i === state.battle ? 'now' : '';
    return `<li class="${cls}"><span class="n">${i + 1}</span><span class="nm">${FACTIONS[k].name}</span></li>`;
  }).join('');

  $('#roundTxt').innerHTML = `Round ${state.round}${highTide() ? ' · <b>High Tide</b>' : ''}`;

  const W = WEATHER[wx()], left = roundsUntilWeather();
  const under = hunt || dg;   // caves and dungeons have no weather
  $('#arena').dataset.wx = under ? 'cave' : wx();
  $('#arena').dataset.dg = dg ? dg.look : '';
  const wxName = under ? (dg ? dg.name : 'Underground') : W.name;
  $('#wxIcon').textContent = under ? '🕯️' : WX_ICON[wx()] || '';
  $('#wxName').textContent = $('#wxPopName').textContent = wxName;
  $('#wxLeft').textContent = under ? '' : left === 1 ? 'Last round' : `${left} rounds`;
  $('#weather').setAttribute('aria-label', `Weather: ${wxName}${under ? '' : `, ${left === 1 ? 'last round' : `${left} rounds left`}`}. Tap for its effect.`);
  $('#wxFavors').textContent = !under && W.favors ? `Favors the ${FACTIONS[W.favors].name}` : '';
  $('#wxDesc').textContent = under ? 'No weather reaches this deep. Only the dark and whatever lives in it.' : W.desc;
  $('#wxNext').innerHTML = under ? '' : `Next: <b>${WEATHER[state.nextWeather].name}</b> ${left === 1 ? 'next round' : `in ${left} rounds`}`;

  renderTrack(state.moving ? 400 : 300);

  for (const u of allUnits()) {
    const el = $(`#u-${u.uid}`);
    if (!el) continue;
    el.querySelector('.bar.hp .fill').style.width = `${(u.hp / u.maxHp) * 100}%`;
    el.querySelector('.bar.hp span').textContent = `${u.hp} / ${u.maxHp}`;
    el.querySelector('.lvl').textContent = unitLevelText(u);
    el.classList.toggle('frozen', hardFrozen(u) || staggerStopped(u));
    const heat = el.querySelector('.bar.heat');
    if (heat) {
      heat.querySelector('.fill').style.width = `${u.heat}%`;
      heat.querySelector('span').textContent = `Heat ${u.heat}`;
    }
    // Heat aura: a red-orange glow that grows and reddens as a Mech builds Heat (0 for everyone else).
    const hot = (u.faction === 'mech' && !u.summon && u.hp > 0) ? u.heat : 0;
    el.style.setProperty('--heat-glow', (hot / 100).toFixed(2));
    el.classList.toggle('overheating', hot >= 75);
    const mpBar = el.querySelector('.bar.mp');
    if (mpBar) {
      mpBar.querySelector('.fill').style.width = `${(u.mp / u.maxMp) * 100}%`;
      mpBar.querySelector('span').textContent = `${u.mp} / ${u.maxMp} MP`;
    }
    el.querySelector('.chips').innerHTML = passiveChips(u) + u.effects.map((e) =>
      `<li class="chip ${FX[e.id].kind}"><span class="ico">${FX[e.id].icon}</span>${FX[e.id].label}${e.until != null || e.turns >= 99 ? '' : ` ${e.turns}`}</li>`).join('');
    syncStatusFx(el, u);
    el.classList.toggle('winding', !!u.windup);
    el.classList.toggle('down', u.hp <= 0);
    el.classList.toggle('acting', state.active === u.uid && !state.moving && !['won', 'lost', 'cleared'].includes(state.phase));
    const tgt = targets.includes(u);
    el.classList.toggle('targetable', tgt);
    el.classList.toggle('ally', tgt && pending.target === 'ally');
    el.tabIndex = tgt ? 0 : -1;
    el.setAttribute('role', tgt ? 'button' : 'group');
    el.setAttribute('aria-label', `${u.side === 'p' ? 'Your' : 'Enemy'} ${u.name}, ${u.hp} of ${u.maxHp} HP`);
  }

  // Command deck
  const acts = $('#acts');
  renderSatchel(act);
  if (!act) {
    const over = ['won', 'lost', 'cleared'].includes(state.phase);
    $('#dName').textContent = !over ? 'Get ready' : state.phase === 'lost' ? 'Defeated' : 'Victory';
    $('#dPassive').innerHTML = over ? '' : 'Everyone is racing to the <b>Act</b> gate. The first to reach it takes the first turn.';
    acts.innerHTML = '';
    acts.dataset.uid = '';
    $('#prompt').hidden = true;
    return;
  }
  $('#dName').textContent = act.summon || act.monster ? act.name : act.you ? `${act.name} · ${charById(act.id).name}` : charById(act.id).name;
  $('#dPassive').innerHTML = passiveText(act);

  const skills = skillsOf(act);
  if (acts.dataset.uid !== act.uid) {
    // Keys 1–5 still follow the loadout order (skillsOf), wherever the button sits.
    const btn = (s, i) => `
      <button class="act" type="button" data-id="${s.id}" title="${escHTML(`${s.name}: ${s.desc}`)}" aria-label="${escHTML(`${s.name}. ${s.desc}`)}">
        <span class="aico">${skillIcon(s)}${s.sig ? '<span class="star" aria-hidden="true">★</span>' : ''}${s.rank ? `<span class="rkb" title="Rank ${s.rank}: ${rankBonusText(s, s.rank)}">R${s.rank}</span>` : ''}${act.you ? `<kbd>${i + 1}</kbd>` : ''}<span class="cdn"></span><span class="mpc"></span></span>
        <span class="nm">${s.name}</span>
        <span class="combo" hidden>Discipline +15%</span>
      </button>`;
    const basic = (s) => s.id === 'attack' || s.id === 'guard';
    acts.innerHTML = `<div class="agroup">${skills.map((s, i) => (basic(s) ? '' : btn(s, i))).join('')}</div>
      <div class="agroup basic">${skills.map((s, i) => (basic(s) ? btn(s, i) : '')).join('')}</div>`;
    acts.dataset.uid = act.uid;
  }
  acts.querySelectorAll('.act').forEach((b) => {
    const s = skills.find((x) => x.id === b.dataset.id);
    const cd = act.cooldowns[s.id] || 0;
    const hushed = silenced(act, s), broke = (s.mp || 0) > (act.mp || 0);
    // Blue mana cost on the icon (red when you can't afford it); a cooldown or silence covers the icon.
    const mpc = b.querySelector('.mpc');
    mpc.textContent = s.mp ? s.mp : '';
    mpc.classList.toggle('short', broke);
    b.querySelector('.cdn').textContent = hushed ? '🔇' : cd ? cd : '';
    b.disabled = !(state.phase === 'choose' && act.side === 'p' && usable(act, s));
    b.classList.toggle('armed', state.pending === s.id);
    const combo = b.querySelector('.combo');
    combo.hidden = !(act.faction === 'human' && act.side === 'p' && act.lastAction && act.lastAction !== s.id && !cd);
    combo.textContent = `Discipline +${Math.round(disciplineBonus() * 100)}%`;
  });
  $('#prompt').hidden = !pending;
  if (pending) $('#promptTxt').textContent = `${pending.name}: click a highlighted ${pending.target === 'ally' ? 'ally' : 'enemy'}.`;
}

// Satchel row under the actions: only on your own champion's turn. Keys 6–9 then 0 follow ITEM_KEYS order.
function renderSatchel(act) {
  const mine = !!act && act.you && !['won', 'lost', 'cleared'].includes(state.phase);   // only your champion uses the satchel
  $('#satchel').hidden = !mine;
  if (!mine) return;
  const owned = ITEM_KEYS.filter((k) => profile.items[k] > 0);
  const ready = state.phase === 'choose' && !state.itemUsed;
  $('#satchelHint').textContent = !owned.length ? '' : state.itemUsed ? 'Item used this turn.' : 'One item per turn. Using it does not end your turn.';
  $('#items').innerHTML = owned.length ? owned.map((k) => `
    <button class="item${state.pending === `item:${k}` ? ' armed' : ''}" type="button" data-item="${k}" title="${ITEMS[k].desc}"${ready ? '' : ' disabled'}>
      <kbd>${(ITEM_KEYS.indexOf(k) + 6) % 10}</kbd><span class="ico">${ITEM_ICON[k]}</span>${ITEMS[k].name} ×${profile.items[k]}
    </button>`).join('')
    : '<span class="note">Empty. Buy supplies at the Market in Cinderhold.</span>';
}

// XP bar for your champion: level, progress to the next level.
function xpBarHTML() {
  const need = xpToNext(heroLevel()), maxed = heroLevel() >= LEVEL_CAP;
  const pct = maxed ? 100 : Math.round(((profile.xp || 0) / need) * 100);
  return `<div class="xpbar" role="img" aria-label="Level ${heroLevel()}, ${profile.xp || 0} of ${need} XP"><div style="width:${pct}%"></div></div>
    <small class="xpnum">Lv ${heroLevel()} · ${maxed ? 'max level' : `${profile.xp || 0} / ${need} XP`}</small>`;
}

// XP earned this battle, plus a stat table when your champion levelled up.
function rewardHTML() {
  const r = state.reward;
  if (!r) return '';
  let html = `<div class="xpline"><b class="xpgain">+${r.xp} XP</b>${xpBarHTML()}</div>`;
  if (r.to > r.from) {
    const rows = state.team.map((id, i) => {
      const c = charById(id), a = makeUnit(c, r.from, 'p', 0), b = makeUnit(c, r.to, 'p', 0);
      return `<tr><td>${i === 0 ? heroName() : shortName(c)}</td><td>${a.maxHp} → <span class="up">${b.maxHp}</span></td><td>${a.atk} → <span class="up">${b.atk}</span></td><td>${a.def} → <span class="up">${b.def}</span></td></tr>`;
    }).join('');
    const opened = SLOT_UNLOCKS.filter((s) => s.lv > r.from && s.lv <= r.to);
    const slotNote = opened.map((s) => `New ${s.kind === 'act' ? 'active' : 'passive'} skill slot unlocked!`).join(' ');
    html += `<p class="lvlup">Level up! ${heroName()} is now level ${r.to}, and your recruits rise with you. +${r.to - r.from} skill point${r.to - r.from === 1 ? '' : 's'} — spend ${r.to - r.from === 1 ? 'it' : 'them'} under Choose skills at the Arena.${slotNote ? ` ${slotNote} Choose what goes in it at the Arena.` : ''}</p>
      <table class="gains"><thead><tr><th>Champion</th><th>HP</th><th>Attack</th><th>Defense</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  return html;
}

function showEndOverlay() {
  const { phase } = state;
  let kick, title, body, buttons;
  const d = huntDepth(), dg = dungeonRun();
  // Warband health going into the next room (after the short rest).
  const partyHTML = () => `<ul class="dgparty">${state.team.map((id, i) => {
    const c = state.dg.carry[id], u = state.teams.p.find((x) => x.id === id);
    const pct = c && u ? Math.round((c.hp / u.maxHp) * 100) : 100;
    return `<li><span class="mini">${spriteSVG(id)}</span><b>${i === 0 ? heroName() : shortName(charById(id))}</b><span class="hpbar"><span style="width:${pct}%"></span></span><small>${pct}% HP</small></li>`;
  }).join('')}</ul>`;
  if (dg && phase === 'won' && state.dg.done) {
    const ch = state.dg.chest;
    kick = `Dungeon cleared · ${dg.name}`;
    title = `${MONSTERS[dg.boss].name} falls`;
    body = `<div class="chest"><p class="loot">The chest: +${ch.gold} gold</p>
        <ul>${ch.items.map((t) => `<li>${t}</li>`).join('')}${ch.trinket ? `<li class="first">First clear! A ${TRINKETS[ch.trinket].name} is waiting in your stash.</li>` : ''}</ul></div>
      ${rewardHTML()}
      <p>This run: <b>${state.dg.gold} gold</b> and <b>${state.dg.xp} XP</b> in total.</p>${questNewsHTML()}`;
    buttons = [{ label: 'Return to the village', primary: true, fn: () => { toVillage(); openPlace('gate'); } }];
  } else if (dg && phase === 'won') {
    const next = state.dg.room + 1, bossNext = next === dg.rooms.length;
    kick = `${dg.name} · room ${state.dg.room + 1} of ${dgRooms(dg)} cleared`;
    title = state.reward.to > state.reward.from ? `${heroName()} reaches level ${state.reward.to}` : 'Room cleared';
    body = `<p class="loot">+${state.goldWon} gold</p>${rewardHTML()}
      <p>Your HP and MP carry over. The fallen get back up at 30%, and everyone catches their breath.</p>${partyHTML()}
      <p>${bossNext ? `Ahead: <b>${MONSTERS[dg.boss].name}</b>. Watch for the warning before its big attack, then Guard or shield up.` : `Ahead: room ${next + 1} of ${dgRooms(dg)}.`}</p>${questNewsHTML()}`;
    buttons = [
      { label: bossNext ? `Face ${MONSTERS[dg.boss].name}` : 'Go deeper', primary: true, fn: () => { state.dg.room++; enterRoom(); } },
      { label: 'Retreat with your loot', fn: retreatDungeon },
    ];
  } else if (dg && phase === 'lost') {
    kick = 'Defeat';
    title = `Your warband falls in ${dg.name}`;
    body = `${rewardHTML()}${questNewsHTML()}<p>The run is over, but you keep everything you earned on the way: <b>${state.dg.gold} gold</b> and <b>${state.dg.xp} XP</b>.</p>`;
    buttons = [{ label: 'Return to the village', primary: true, fn: () => { toVillage(); openPlace('gate'); } }];
  } else if (d && phase === 'won') {
    const { from, to } = state.reward;
    kick = `Hunt won · ${CAVE.name}`;
    title = to > from ? `${heroName()} reaches level ${to}` : `The ${d.name} pack is down`;
    body = `<p class="loot">+${state.goldWon} gold</p>${rewardHTML()}
      <p>Hunt again for a fresh pack, or head back to Cinderhold. Your warband is fully healed either way.</p>${questNewsHTML()}`;
    buttons = [
      { label: 'Hunt again', primary: true, fn: () => startHunt(d.id) },
      { label: 'Return to the village', fn: () => { toVillage(); openPlace('cave'); } },
    ];
  } else if (d && phase === 'lost') {
    kick = 'Defeat';
    title = 'The pack drives you back';
    body = `${rewardHTML()}${questNewsHTML()}<p>Try the same pack again, or retreat to the village. You keep your level, XP, gold, gear and items.</p>`;
    buttons = [
      { label: 'Retry the hunt', primary: true, fn: () => startBattle(true) },
      { label: 'Return to the village', fn: () => { toVillage(); openPlace('cave'); } },
    ];
  } else if (state.mode === 'duel' && phase === 'won') {
    const { from, to } = state.reward, du = state.duel;
    kick = 'Duel won · Proving Grounds';
    title = to > from ? `${heroName()} reaches level ${to}` : `${du.band} yield`;
    body = `<p class="loot">+${state.goldWon} gold — your ${du.stake} stake back, with profit</p>${rewardHTML()}
      <p>The crowd at the fence wants more. Fresh challengers are already warming up, and your warband is fully healed.</p>${questNewsHTML()}`;
    buttons = [
      { label: 'Find new challengers', primary: true, fn: () => { toVillage(); openPlace('pvp'); } },
      { label: 'Return to the village', fn: toVillage },
    ];
  } else if (state.mode === 'duel' && phase === 'lost') {
    const du = state.duel;
    kick = 'Defeat · Proving Grounds';
    title = `${du.band} take the purse`;
    body = `${rewardHTML()}${questNewsHTML()}<p>The ${du.stake} gold stake is gone, but nothing else: you keep your level, XP, gear and items.</p>`;
    buttons = [
      { label: 'Back to the Proving Grounds', primary: true, fn: () => { toVillage(); openPlace('pvp'); } },
      { label: 'Return to the village', fn: toVillage },
    ];
  } else if (phase === 'won') {
    const { from, to } = state.reward;
    const next = FACTIONS[state.order[state.battle + 1]];
    kick = `Victory · battle ${state.battle + 1} of ${state.order.length}`;
    title = to > from ? `${heroName()} reaches level ${to}` : `Battle ${state.battle + 1} won`;
    body = `<p class="loot">+${state.goldWon} gold</p>${rewardHTML()}
      <p>Everyone is fully healed. Next up: ${theFaction(next)} (${next.mechanic}). You can stop in Cinderhold first to forge and shop.</p>${questNewsHTML()}`;
    buttons = [
      { label: `Fight ${theFaction(next)}`, primary: true, fn: () => { state.battle++; startBattle(false); } },
      { label: 'Visit the village first', fn: () => { state.runPending = true; toVillage(); } },
    ];
  } else if (phase === 'cleared') {
    kick = 'Gauntlet cleared';
    title = `All ${state.order.length} factions defeated`;
    body = `<p class="loot">+${state.goldWon} gold, including the ${CLEAR_BONUS} gold clearing bonus</p>${rewardHTML()}
      <p>${heroName()} and ${state.team.slice(1).map((id) => shortName(charById(id))).join(' and ')} cleared Ashfall Road.</p>${questNewsHTML()}`;
    buttons = [
      { label: 'Run it again', primary: true, fn: startGauntlet },
      { label: 'Return to the village', fn: toVillage },
    ];
  } else if (phase === 'lost') {
    kick = 'Defeat';
    title = `${theFaction(FACTIONS[state.order[state.battle]], true)} win this one`;
    body = `${rewardHTML()}${questNewsHTML()}<p>Retry this battle against the same warband, or head back to the village. Leaving ends this run, but you keep your level, XP, gold, gear and items.</p>`;
    buttons = [
      { label: 'Retry battle', primary: true, fn: () => startBattle(true) },
      { label: 'Return to the village', fn: toVillage },
    ];
  } else return;

  $('#ovKick').textContent = kick;
  $('#ovTitle').textContent = title;
  $('#ovBody').innerHTML = body;
  const btns = $('#ovBtns');
  btns.innerHTML = '';
  for (const b of buttons) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = `btn${b.primary ? ' primary' : ''}`;
    el.textContent = b.label;
    el.addEventListener('click', () => { $('#overlay').hidden = true; b.fn(); });
    btns.appendChild(el);
  }
  $('#overlay').hidden = false;
  btns.querySelector('.primary')?.focus();
}

/* ==================================================================
   INPUT
   ================================================================== */
$('#acts').addEventListener('click', (ev) => {
  const b = ev.target.closest('.act');
  if (b && !b.disabled) onSkill(b.dataset.id);
});
for (const side of ['p', 'e']) {
  const el = $(`#side-${side}`);
  el.addEventListener('click', (ev) => { const u = ev.target.closest('.unit'); if (u) onUnit(u.dataset.uid); });
  el.addEventListener('keydown', (ev) => {
    const u = ev.target.closest('.unit');
    if (u && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); onUnit(u.dataset.uid); }
  });
}
$('#items').addEventListener('click', (ev) => {
  const b = ev.target.closest('.item');
  if (b && !b.disabled) onItem(b.dataset.item);
});
$('#cancelBtn').addEventListener('click', () => { state.pending = null; render(); });
function setWxPop(open) {
  $('#wxPop').hidden = !open;
  $('#weather').setAttribute('aria-expanded', String(open));
}
$('#weather').addEventListener('click', (ev) => { ev.stopPropagation(); setWxPop($('#wxPop').hidden); });
document.addEventListener('click', (ev) => { if (!$('#wxPop').hidden && !ev.target.closest('#wxPop')) setWxPop(false); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') setWxPop(false); });
$('#abandonBtn').addEventListener('click', () => { state.runPending = false; toVillage(); });
// Battle speed toggle on the speed bar: 1.5× ⇄ 2×, remembered in this browser. Takes effect from the next motion.
function renderSpeedBtn() {
  const b = $('#speedBtn');
  b.textContent = `${SPEED}×`;
  b.setAttribute('aria-pressed', String(SPEED === 2));
  b.title = SPEED === 2 ? 'Double speed. Click for 1.5×' : 'Battle speed 1.5×. Click for 2×';
}
$('#speedBtn').addEventListener('click', () => {
  SPEED = SPEED === 2 ? 1.5 : 2;
  try { localStorage.setItem(SPEED_KEY, String(SPEED)); } catch {}
  renderSpeedBtn();
});
renderSpeedBtn();
document.addEventListener('keydown', (ev) => {
  if (!$('#overlay').hidden || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (state.screen === 'village' && ev.key === 'Escape' && state.place) { state.place = null; render(); return; }
  if (state.screen !== 'battle') return;
  if (ev.key === 'Escape' && state.pending) { state.pending = null; render(); return; }
  const n = parseInt(ev.key, 10);
  if (state.phase === 'choose' && n >= 1 && n <= 5) {
    const s = skillsOf(unitBy(state.active))[n - 1];   // the loadout decides how many actions there are
    if (s) onSkill(s.id);
  }
  const itemIdx = n === 0 ? 4 : n - 6;   // keys 6, 7, 8, 9, 0
  if (state.phase === 'choose' && itemIdx >= 0 && itemIdx < ITEM_KEYS.length) onItem(ITEM_KEYS[itemIdx]);
});

/* ==================================================================
   BOOT (keeps the current screen if the page is live-updated)
   ================================================================== */
function start(data) {
  buildSelect();
  buildSkills();
  buildVillage();
  if (data && data.state) {
    // Older snapshots predate the village; give them its defaults.
    state = { place: null, codex: 'factions', tip: 0, forgeHero: null, runPending: false, itemUsed: false, keeperSays: '', folk: state.folk, ...data.state };
    if (!state.nextWeather) state.nextWeather = rollWeather(wx());
    if (state.screen === 'battle') {
      if (state.time == null) {   // saved before the speed bar existed
        state.time = (state.round - 1) * ROUND_TIME;
        for (const u of allUnits()) u.pos = Math.random() * 80;
      }
      buildArena();
      render();
      if (['won', 'lost', 'cleared'].includes(state.phase)) showEndOverlay();
      else if (state.phase !== 'choose') {
        const u = unitBy(state.active);
        if (u && !state.moving) u.pos = 0;
        state.moving = false;
        nextTurn();
      }
      return;
    }
  }
  // Your warband comes from your saved champion and recruits. A new player starts by creating a champion.
  syncTeam();
  if (!profile.hero) { state.team = []; state.screen = 'select'; }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ state })); } catch (err) { /* not in a viewer */ }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
