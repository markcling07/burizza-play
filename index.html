<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Grenze+Gotisch:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: two screens. Warband select = sticky warband tray over faction sections of champion cards.
   Battle = ladder, turn-order strip, two facing columns of three units, then command deck beside the log.
   Single dusk-themed world (dark on purpose). */
:root {
  --bg: #161925;
  --bg-2: #262036;
  --sky: #2a2943;
  --ground: #231f26;
  --panel: #1e2232;
  --panel-2: #282d43;
  --panel-hi: #323854;
  --card: rgba(30, 34, 50, .88);
  --line: #3a4058;
  --fg: #ece6d8;
  --muted: #a29fb2;
  --accent: #e8a548;
  --accent-ink: #2a1a05;
  --hp: #d6564c;
  --hp-dim: #4a2428;
  --mp: #5b97e6;
  --mp-dim: #22304d;
  --heat: #f08a3d;
  --heat-dim: #3d2a1e;
  --good: #6cc28a;
  --bad: #e0645a;
  --melee: #f08a5d;
  --ranged: #6fb5e6;
  --status: #c48be0;
  --target: #ff8a6b;
  --scrim: rgba(10, 10, 18, .74);
  /* weather skies + particles */
  --sky-ash: #3b2a2c;
  --sky-storm: #1c1f36;
  --sky-rain: #1f3042;
  --sky-sun: #4a3a30;
  --sky-mist: #2b3a3a;
  --rain: rgba(170, 205, 255, .22);
  --flash: rgba(220, 230, 255, .9);
  --ember: rgba(255, 140, 70, .6);
  --ash: rgba(210, 200, 190, .35);
  --mist: rgba(200, 220, 215, .16);
  --sunglow: rgba(255, 200, 120, .28);
  --horizon: #34303d;
  --floorglow: rgba(255, 255, 255, .05);
  --plate: rgba(20, 22, 34, .84);
  --sky-moon: #2e1420;
  --cave-rock: #1d1816;
  --cave-rock-hi: #2c2420;
  --cave-floor: #191513;
  --cave-glow: rgba(255, 122, 47, .12);
  --moon: rgba(214, 70, 82, .85);
  --moonglow: rgba(200, 50, 70, .22);
  --font-display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, var(--bg-2), var(--bg) 65%) fixed, var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--font-body);
}
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 40px; padding-inline: 16px; display: grid; gap: 16px; }
.screen { display: grid; gap: 16px; min-width: 0; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.1rem, 5vw, 2.9rem); line-height: 1; color: var(--accent); text-wrap: balance;
}
.tag { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.label { margin: 0; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Buttons */
.btn {
  font: inherit; font-weight: 800; cursor: pointer;
  padding: 9px 16px; border-radius: 9px;
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn.ghost { background: transparent; }
.btn:focus-visible, .act:focus-visible, .pick:focus-visible, .slot:focus-visible, .fbtn:focus-visible, .unit:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* ---------- Team select ---------- */
.tray {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; gap: 12px; padding: 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
}
.trayRow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.trayRow p { margin: 0; color: var(--muted); font-size: .88rem; }
.trayBtns { display: flex; flex-wrap: wrap; gap: 8px; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot {
  font: inherit; color: inherit; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 58px;
  padding: 6px 8px; border-radius: 10px; border: 1px dashed var(--line); background: var(--panel-2);
}
.slot.filled { border-style: solid; }
.slot.filled:hover { border-color: var(--bad); }
.slot .mini { width: 42px; height: 42px; flex: none; }
.slot .t { min-width: 0; display: grid; }
.slot strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .92rem; }
.slot small { color: var(--muted); font-size: .74rem; }
.slot.empty small { font-size: .82rem; }
.trayNote { color: var(--bad); font-size: .85rem; font-weight: 700; min-height: 1.2em; }
/* Champion creation and progression */
.slot.you { border-color: var(--accent); }
.slot.you.empty small { color: var(--accent); }
.pick.me { box-shadow: 0 0 0 2px var(--accent) inset; }
.nameRow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.nameRow label { font-size: .85rem; font-weight: 800; color: var(--accent); }
.nameRow input {
  font: inherit; font-weight: 700; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; width: min(260px, 100%);
}
.nameRow input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.xpbar { position: relative; height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; min-width: 90px; }
.xpbar > div { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), #f2c46d); }
.xpnum { font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.xpline { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; }
.xpline .xpnum { grid-column: 2; }
.xpgain { color: var(--accent); font-size: 1.05rem; }
.lvlup { font-weight: 800; color: var(--good); }
.herotag {
  display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 4px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); min-width: 0;
}
.herotag .hmini { width: 30px; height: 30px; flex: none; border-radius: 50%; overflow: hidden; background: var(--panel-2); position: relative; }
.herotag .hmini svg, .herotag .hmini img { position: absolute; width: 170%; height: 170%; left: -35%; top: -12%; max-width: none; }
.herotag .hinfo { display: grid; gap: 2px; min-width: 0; }
.herotag b { font-size: .85rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.herotag .xpbar { min-width: 110px; height: 5px; }
/* Dungeon results: the warband's health between rooms, and the chest. */
.dgparty { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.dgparty li { display: grid; grid-template-columns: 32px 90px minmax(0, 1fr) 64px; align-items: center; gap: 8px; font-size: .86rem; }
.dgparty .mini { width: 32px; height: 32px; }
.dgparty .mini svg, .dgparty .mini img { width: 100%; height: 100%; display: block; }
.dgparty b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dgparty .hpbar { height: 8px; border-radius: 4px; background: var(--hp-dim); overflow: hidden; }
.dgparty .hpbar span { display: block; height: 100%; background: var(--hp); }
.dgparty small { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.chest ul { margin: 4px 0 0; padding-left: 18px; }
.chest li.first { color: var(--good); font-weight: 800; }
/* Emberhollow Cave panel: depth cards and the bestiary. */
.depths { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.depth { display: grid; gap: 6px; align-content: start; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.depth.locked { opacity: .6; }
.depth h3 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; }
.depth p { margin: 0; font-size: .86rem; color: var(--muted); }
.depth small { font-size: .74rem; color: var(--accent); font-weight: 700; }
.depth .btn { justify-self: start; }
.depth small.reward { color: var(--good); }
.dmini .mini.boss { width: 52px; height: 52px; margin-left: auto; }
.dmini { display: flex; gap: 4px; }
.dmini .mini, .beast .mini { width: 40px; height: 40px; flex: none; }
.dmini .mini svg, .dmini .mini img, .beast .mini svg, .beast .mini img { width: 100%; height: 100%; display: block; }
.bhead { margin: 6px 0 0; font-family: var(--font-display); font-size: 1.3rem; }
.bestiary { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.beast { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.beast p { margin: 2px 0; font-size: .82rem; color: var(--muted); }
.beast small { font-size: .74rem; color: var(--ranged); font-weight: 700; }
/* Skills screen: slot row on top, the pool of skills below. */
.loadout { display: grid; gap: 22px; }
.lsec { display: grid; gap: 10px; }
.lsec header { display: grid; gap: 4px; }
.lsec h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; }
.lslots { display: flex; flex-wrap: wrap; gap: 8px; }
.lslot {
  display: flex; align-items: center; gap: 8px; min-height: 46px; min-width: 150px; padding: 6px 12px 6px 6px;
  border-radius: 10px; border: 1px dashed var(--line); background: var(--panel-2); font-size: .88rem; font-weight: 700;
}
.lslot.filled { border-style: solid; border-color: var(--accent); }
.lslot.empty span { color: var(--muted); padding-left: 6px; }
.lslot.locked { opacity: .55; }
.lslot.locked span { color: var(--muted); padding-left: 6px; font-weight: 600; }
.lslot .sic { width: 32px; height: 32px; flex: none; }
.lpool { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.lcard {
  font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0;
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: start;
  padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
.lcard:hover { border-color: var(--accent); }
.lcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lcard.on { border-color: var(--accent); background: var(--panel-hi); }
/* Fixed icon box, so a skill without an icon file (generic passives, for now) keeps the layout. */
.lcard .lic { width: 40px; height: 40px; border-radius: 9px; background: var(--panel-2); display: block; }
.lcard .lic .sic { width: 100%; height: 100%; display: block; }
.lcard .lt { display: grid; gap: 2px; min-width: 0; }
.lcard .lt small { font-size: .72rem; font-weight: 700; color: var(--ranged); }
.lcard .ld { font-size: .82rem; color: var(--muted); line-height: 1.3; }
.lcard .lstate { font-size: .74rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
.lcard.on .lstate { color: var(--accent); }
/* Skill ranks: the trained-rank line and +1 Rank chip on loadout cards, and the R badge on battle buttons. */
.lcard .rkrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 3px; }
.lcard .rkd { font-size: .72rem; font-weight: 800; color: var(--accent); }
.rkup {
  font-size: .72rem; font-weight: 800; cursor: pointer; white-space: nowrap;
  padding: 2px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent);
}
.rkup:hover, .rkup:focus-visible { background: var(--accent); color: #1a1407; outline: none; }
.rkb {
  font-size: .62rem; font-weight: 800; line-height: 1; padding: 3px 6px; margin-left: 6px;
  border-radius: 999px; background: var(--accent); color: #1a1407; white-space: nowrap;
}

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fbtn {
  font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
  padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--muted);
}
.fbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: var(--panel-hi); }

.faction { display: grid; gap: 10px; }
.faction header { display: grid; gap: 4px; }
.faction h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; }
.rule { margin: 0; color: var(--muted); font-size: .9rem; max-width: 75ch; }
.rule b { color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.pick {
  font: inherit; color: inherit; text-align: left; cursor: pointer; position: relative; min-width: 0;
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 12px; align-content: start;
  padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  transition: border-color .15s, background .15s;
}
.pick:hover { border-color: var(--accent); }
.pick.sel { border-color: var(--accent); background: var(--panel-hi); }
.pick .pic { width: 64px; height: 64px; grid-row: span 3; }
.pick .nm { font-weight: 800; font-size: 1.02rem; padding-right: 26px; }
.pick .bio { margin: 0; font-size: .82rem; color: var(--muted); }
.pick .sk { grid-column: 1 / -1; list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: .8rem; color: var(--muted); line-height: 1.3; }
.pick .sk b { color: var(--fg); }
.pick .sk li { display: flex; gap: 8px; align-items: flex-start; }
.pick .sk .sic { flex: none; width: 28px; height: 28px; }
.pick .sk .pas b { color: var(--accent); }
.pick .badge {
  position: absolute; top: 9px; right: 9px; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .8rem;
}
.role {
  justify-self: start; font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor;
}
.role.melee { color: var(--melee); }
.role.ranged { color: var(--ranged); }
.role.support { color: var(--good); }

/* ---------- Battle ---------- */
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ladder li {
  display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); font-size: .82rem;
}
.ladder .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); font-weight: 800; font-size: .74rem; }
.ladder li.done { color: var(--fg); }
.ladder li.done .n { background: var(--good); color: var(--bg); }
.ladder li.now { border-color: var(--accent); color: var(--fg); }
.ladder li.now .n { background: var(--accent); color: var(--accent-ink); }

/* Speed bar: allies ride above the rail, enemies below; the Act gate is on the right. */
.speed { display: grid; gap: 6px; padding: 10px 14px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.speedHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
/* Round counter, top-left of the speed bar (High Tide shows beside it on even rounds). */
.speedHead .round { color: var(--muted); font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap; }
.speedHead .round b { color: var(--ranged); }
/* Battle speed toggle: 1.5× (default) ⇄ 2×. Gold when doubled. */
.speedBtn {
  order: 3; margin-left: auto; align-self: center; flex: none; font: inherit; font-size: .74rem; font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer;
  min-width: 46px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
}
.speedBtn:hover { border-color: var(--accent); }
.speedBtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1410; }
.track { position: relative; height: 104px; margin-inline: 22px 52px; }
.rail {
  position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%);
  border-radius: 3px; background: linear-gradient(90deg, var(--panel-2), var(--line) 85%, var(--accent));
}
.lane { position: absolute; left: -2px; font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; opacity: .7; }
.lane.p { bottom: 8px; }
.lane.e { top: 8px; }
.goal {
  position: absolute; right: -46px; top: 4px; bottom: 4px; width: 34px; border-radius: 8px;
  display: grid; place-items: center; writing-mode: vertical-rl; text-orientation: mixed;
  font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink);
}
.tok {
  position: absolute; left: calc(var(--x, 0) * 1%); width: 40px; height: 40px; margin-left: -20px;
  transition: left var(--dur, 400ms) linear, transform .2s; z-index: 1;
}
.tok.p { top: 0; }
.tok.e { bottom: 0; }
.tok .face {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  background: var(--panel-2); border: 2px solid var(--accent);
}
.tok.e .face { border-color: var(--bad); }
.tok .face svg, .tok .face img { position: absolute; width: 170%; height: 170%; left: -35%; top: -12%; max-width: none; object-fit: contain; }
.tok.e .face svg, .tok.e .face img { transform: scaleX(-1); }
/* Four-legged bodies keep their head on the right, so crop there instead. */
.tok.body-beast .face svg, .tok.body-beast .face img,
.tok.body-boar .face svg, .tok.body-boar .face img { left: -72%; top: -37%; }
.tok.e.body-beast .face svg, .tok.e.body-beast .face img,
.tok.e.body-boar .face svg, .tok.e.body-boar .face img { left: 0; }
.tok.body-bot .face svg, .tok.body-bot .face img { top: -2%; }
/* Monster crops: low bodies show their head/eyes, the troll its face. */
.tok.body-spider .face svg, .tok.body-spider .face img { top: -55%; left: -55%; }
.tok.e.body-spider .face svg, .tok.e.body-spider .face img { left: -15%; }
.tok.body-slime .face svg, .tok.body-slime .face img { top: -55%; left: -50%; }
.tok.e.body-slime .face svg, .tok.e.body-slime .face img { left: -20%; }
.tok.body-bat .face svg, .tok.body-bat .face img { top: -30%; }
.tok.body-shroom .face svg, .tok.body-shroom .face img { top: -30%; }
.tok.body-troll .face svg, .tok.body-troll .face img { top: -8%; left: -60%; }
.tok.e.body-troll .face svg, .tok.e.body-troll .face img { left: -10%; }
.tok.body-ghoul .face svg, .tok.body-ghoul .face img { top: -10%; left: -62%; }
.tok.e.body-ghoul .face svg, .tok.e.body-ghoul .face img { left: -8%; }
.tok.body-golem .face svg, .tok.body-golem .face img { top: 0; }
.tok.body-drake .face svg, .tok.body-drake .face img { top: -5%; left: -78%; }
.tok.e.body-drake .face svg, .tok.e.body-drake .face img { left: 6%; }
/* Bosses: biggest on the field, with a gold nameplate; a pulsing red glow while winding up a big attack. */
.unit.boss { --size: clamp(84px, 21cqw, 230px); }
.unit.boss .plate { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.unit.winding .body { animation: windup .8s ease-in-out infinite; }
@keyframes windup { 50% { filter: drop-shadow(0 0 14px #ff5a3a) brightness(1.15); } }
.arena[data-dg="crypt"] { --cave-rock: #141c1e; --cave-rock-hi: #1f2a2c; --cave-floor: #111718; --cave-glow: rgba(90, 200, 180, .14); }
.arena[data-dg="mine"]  { --cave-rock: #211a14; --cave-rock-hi: #30261c; --cave-floor: #18120e; --cave-glow: rgba(255, 170, 80, .14); }
.arena[data-dg="spire"] { --cave-rock: #241210; --cave-rock-hi: #351a16; --cave-floor: #1a0e0c; --cave-glow: rgba(255, 80, 40, .2); }
.arena[data-dg="manor"]  { --cave-rock: #1a1424; --cave-rock-hi: #271d35; --cave-floor: #130f1a; --cave-glow: rgba(180, 120, 230, .16); }
.arena[data-dg="castle"] { --cave-rock: #171b24; --cave-rock-hi: #232a38; --cave-floor: #0f1218; --cave-glow: rgba(120, 150, 210, .16); }
.arena[data-dg="coven"]  { --cave-rock: #121d16; --cave-rock-hi: #1c2c20; --cave-floor: #0d140f; --cave-glow: rgba(120, 220, 140, .18); }
/* Summons: smaller icons; illusions are see-through. */
.tok.summon { width: 32px; height: 32px; margin-left: -16px; }
.tok.p.summon { top: 4px; }
.tok.e.summon { bottom: 4px; }
.tok.summon .face { border-style: dashed; }
.tok.illusion .face, .unit.illusion .upic { opacity: .6; filter: hue-rotate(160deg) saturate(1.4); }
.tok .st {
  position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: .6rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  padding: 0 5px; border-radius: 999px; line-height: 14px; background: var(--bg); border: 1px solid currentColor;
}
.tok.p .st { top: -15px; }
.tok.e .st { bottom: -15px; }
.tok.frozen .face { filter: grayscale(.85) brightness(.8); }
.tok.frozen .st { color: var(--bad); }
.tok.stagger .face { box-shadow: 0 0 0 3px rgba(240, 138, 61, .5); }
.tok.stagger .st { color: var(--heat); }
.tok.halt .face { animation: wobble .3s ease-in-out infinite; }
@keyframes wobble { 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
.tok.slow .face { box-shadow: 0 0 0 3px rgba(111, 181, 230, .5); }
.tok.slow .st { color: var(--ranged); }
.tok.acting { z-index: 3; transform: scale(1.2); }
.tok.acting .face { box-shadow: 0 0 0 3px var(--accent), 0 0 14px var(--accent); }
.tok.down { display: none; }

/* Battlefield: a side-view stage. Champions stand on it by their feet (--x, --y in % of the stage). */
.arena {
  --sky-now: var(--sky);
  position: relative; overflow: hidden; isolation: isolate; container-type: inline-size;
  aspect-ratio: 16 / 8; min-height: 330px; border-radius: 14px;
  background:
    radial-gradient(60% 18% at 50% 72%, var(--floorglow), transparent 70%),
    linear-gradient(to bottom, var(--sky-now) 0 34%, var(--horizon) 34% 36%, var(--ground) 36% 100%);
}
/* No z-index here on purpose: champions from both sides share one layer, so a runner can pass in front. */
.arena > .side { position: absolute; inset: 0; pointer-events: none; }
.arena::before, .arena::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: 0; transition: opacity .8s; }
.arena[data-wx="ash"] { --sky-now: var(--sky-ash); }
.arena[data-wx="storm"] { --sky-now: var(--sky-storm); }
.arena[data-wx="rain"] { --sky-now: var(--sky-rain); }
.arena[data-wx="sun"] { --sky-now: var(--sky-sun); }
.arena[data-wx="mist"] { --sky-now: var(--sky-mist); }
.arena[data-wx="rain"]::before, .arena[data-wx="storm"]::before {
  opacity: 1; background-image: repeating-linear-gradient(100deg, transparent 0 9px, var(--rain) 9px 10px);
  background-size: 60px 60px; animation: rain .5s linear infinite;
}
.arena[data-wx="storm"]::after { background: var(--flash); animation: flash 6s infinite; }
.arena[data-wx="ash"]::before {
  opacity: 1;
  background-image: radial-gradient(circle, var(--ember) 0 1.5px, transparent 2px), radial-gradient(circle, var(--ash) 0 1.2px, transparent 1.8px);
  background-size: 46px 46px, 31px 31px; animation: ashfall 6s linear infinite;
}
.arena[data-wx="mist"]::before {
  opacity: 1; background: linear-gradient(90deg, transparent, var(--mist) 30%, transparent 60%, var(--mist) 85%, transparent);
  background-size: 200% 100%; animation: mist 14s linear infinite;
}
/* Underground: a rock ceiling with stalactites and a faint ember glow instead of a sky. */
.arena[data-wx="cave"] {
  --sky-now: var(--cave-rock);
  background:
    radial-gradient(60% 30% at 50% 100%, var(--cave-glow), transparent 70%),
    linear-gradient(to bottom, var(--sky-now) 0 34%, var(--horizon) 34% 36%, var(--cave-floor) 36% 100%);
}
.arena[data-wx="cave"]::before {
  opacity: 1;
  background:
    linear-gradient(180deg, var(--cave-rock-hi), transparent 14%),
    conic-gradient(from 160deg at 6% 0, transparent 0 40deg, var(--cave-rock-hi) 40deg 46deg, transparent 46deg),
    conic-gradient(from 170deg at 31% 0, transparent 0 18deg, var(--cave-rock-hi) 18deg 24deg, transparent 24deg),
    conic-gradient(from 165deg at 58% 0, transparent 0 28deg, var(--cave-rock-hi) 28deg 33deg, transparent 33deg),
    conic-gradient(from 172deg at 84% 0, transparent 0 14deg, var(--cave-rock-hi) 14deg 20deg, transparent 20deg);
}
.arena[data-wx="moon"] { --sky-now: var(--sky-moon); }
.arena[data-wx="moon"]::before {
  opacity: 1;
  background: radial-gradient(circle at 82% 12%, var(--moon) 0 22px, var(--moonglow) 24px, transparent 90px),
              radial-gradient(120% 60% at 50% 0%, var(--moonglow), transparent 70%);
}
.arena[data-wx="sun"]::before { opacity: 1; background: radial-gradient(80% 55% at 50% 0%, var(--sunglow), transparent 70%); }
@keyframes rain { to { background-position: -12px 60px; } }
@keyframes ashfall { to { background-position: 46px 92px, -31px 62px; } }
@keyframes mist { to { background-position: -200% 0; } }
@keyframes flash { 0%, 92%, 100% { opacity: 0; } 93% { opacity: .45; } 95% { opacity: 0; } 96% { opacity: .3; } }
.wxAnnounce {
  position: absolute; inset: 0; z-index: 300; pointer-events: none; display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05;
  color: var(--fg); text-shadow: 0 2px 0 var(--bg), 0 0 18px var(--bg); opacity: 0;
}
.wxAnnounce small { display: block; font-family: var(--font-body); font-size: .9rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.wxAnnounce.show { animation: announce 1.9s ease; }
@keyframes announce { 0% { opacity: 0; transform: scale(.92); } 15%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }

/* Weather bar */
/* Weather pill: top centre of the battlefield. Icon, name and rounds left; tap for the full effect. */
.wxPill {
  position: absolute; z-index: 250; top: 8px; left: 50%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 6px; max-width: calc(100% - 16px); padding: 4px 12px 4px 8px; cursor: pointer;
  border-radius: 999px; border: 1px solid var(--line); background: rgba(22, 25, 37, .82); backdrop-filter: blur(3px);
  color: var(--fg); font: inherit; font-size: .85rem; white-space: nowrap;
}
.wxPill:hover, .wxPill[aria-expanded="true"] { border-color: var(--accent); }
.wxPill .wxi { font-size: 1.05rem; line-height: 1; }
.wxPill .wxn { font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
.wxPill .wxl { padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: .72rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.wxPill .wxl:empty { display: none; }
.wxPill.changed { animation: wxPulse 1.4s ease; }
.wxPop {
  position: absolute; z-index: 260; top: 46px; left: 50%; transform: translateX(-50%); width: min(320px, calc(100% - 16px));
  display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--accent);
  background: rgba(22, 25, 37, .95); box-shadow: 0 8px 22px rgba(0, 0, 0, .45); font-size: .85rem; line-height: 1.35;
}
.wxPop p { margin: 0; }
.wxPop .wxf { color: var(--accent); font-size: .76rem; font-weight: 800; }
.wxPop .wxf:empty { display: none; }
.wxPop .wxx { color: var(--muted); font-size: .8rem; }
.wxPop .wxx b { color: var(--fg); }
@keyframes wxPulse { 30% { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 165, 72, .25); } }
/* A champion on the battlefield: status chips, nameplate, then the body standing on its feet point. */
.unit {
  --size: clamp(54px, 13cqw, 150px);
  position: absolute; left: calc(var(--x, 50) * 1%); top: calc(var(--y, 90) * 1%);
  transform: translate(-50%, -100%);
  width: calc(var(--size) * 1.2); display: flex; flex-direction: column; align-items: center; gap: 2px;
  pointer-events: auto; transition: left .5s ease, top .5s ease;
}
.unit.summon { --size: clamp(44px, 9.5cqw, 110px); }
.unit.elite { --size: clamp(68px, 17cqw, 190px); }
.unit.elite .plate { border-color: var(--bad); }
.unit .chips { justify-content: center; min-height: 0; gap: 2px; }
.unit .chip { font-size: .56rem; line-height: 13px; padding: 0 4px; background: var(--plate); }
.plate {
  width: 100%; max-width: 150px; display: grid; gap: 2px; padding: 3px 5px 4px;
  border-radius: 7px; background: var(--plate); border: 1px solid var(--line); transition: border-color .15s;
}
.unit.summon .plate { border-style: dashed; }
.unit.acting .plate { border-color: var(--accent); }
.unit.targetable { cursor: pointer; }
.unit.targetable .plate { border-color: var(--target); }
.unit.targetable.ally .plate { border-color: var(--good); }
.who { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; min-width: 0; }
.who strong { font-size: .76rem; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lvl { font-size: .56rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.unit .bar { height: 11px; border-radius: 4px; }
.unit .bar span { font-size: .58rem; line-height: 11px; padding-inline: 4px; }
.unit .bar.heat { height: 7px; }
.unit .bar.heat span { display: none; }
.bar.mp { background: var(--mp-dim); }
.bar.mp .fill { background: var(--mp); }
.unit .bar.mp { height: 7px; }
.unit .bar.mp span { display: none; }
.body {
  position: relative; width: var(--size); height: var(--size); transform-origin: 50% 100%;
  animation: idle 2.6s ease-in-out infinite; animation-delay: var(--d, 0s);
}
/* Ring under the feet: gold for whoever is acting, red/green when you can target them. */
.body::before {
  content: ''; position: absolute; left: 8%; right: 8%; bottom: -5%; height: 16%; border-radius: 50%; z-index: -1;
}
.unit.acting .body::before { background: radial-gradient(closest-side, rgba(232, 165, 72, .65), transparent); }
.unit.targetable .body::before { background: radial-gradient(closest-side, rgba(255, 138, 107, .8), transparent); animation: ringPulse 1s ease-in-out infinite; }
.unit.targetable.ally .body::before { background: radial-gradient(closest-side, rgba(108, 194, 138, .8), transparent); }
/* Heat aura: wraps the sprite in a glow that grows and reddens as --heat-glow (0→1) climbs.
   Driven per-unit in render(); 0 for anyone who isn't a live Ironclad champion. */
.body::after {
  content: ''; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none;
  inset: calc(-6% - 18% * var(--heat-glow, 0));
  opacity: var(--heat-glow, 0);
  background: radial-gradient(closest-side,
    rgba(255, 190, 90, .55) 0%,
    rgba(255, 110, 40, .5) 38%,
    rgba(214, 44, 22, .3) 60%,
    transparent 76%);
  transition: inset .35s ease, opacity .35s ease;
}
.unit.overheating .body::after { animation: heatPulse .7s ease-in-out infinite; }
@keyframes heatPulse { 50% { filter: brightness(1.45) saturate(1.3); transform: scale(1.1); } }
.unit.frozen .body { animation-play-state: paused; filter: grayscale(.45); }
.unit.down .body { animation: none; transform: rotate(var(--fall, -82deg)) translateY(12%); opacity: .45; filter: grayscale(1); transition: transform .5s ease, opacity .5s; }
.unit.e { --fall: 82deg; }
.unit.down .plate, .unit.down .chips { opacity: .35; }
@keyframes idle { 50% { transform: translateY(-2px) scaleY(1.015); } }
@keyframes ringPulse { 50% { opacity: .45; } }
.upic { position: relative; width: 100%; height: 100%; }
.upic svg, .pic svg, .mini svg, .upic img, .pic img, .mini img { width: 100%; height: 100%; display: block; overflow: visible; object-fit: contain; }
.unit.e .upic svg, .unit.e .upic img { transform: scaleX(-1); }
/* Animated champions. The clip lies over the SVG and is sized and offset in multiples of --size
   (see clipVars) so its feet land on the same spot the SVG's do. It only becomes visible once the
   file has loaded, so a champion with no clip — or a clip that 404s — simply keeps the SVG. */
.upic .anim {
  position: absolute; top: 0; left: calc(var(--ax, 0) * var(--size));
  width: calc(var(--aw, 1) * var(--size)); height: calc(var(--ah, 1) * var(--size));
  max-width: none; object-fit: fill; opacity: 0;
}
.upic.animated .anim { opacity: 1; }
.upic.animated .art, .upic.animated > svg { visibility: hidden; }
/* The fallen lie still: the looping idle clip gives way to the static art (which .down tips over and greys),
   and no flinch or lunge plays on them. */
.unit.down .upic .anim { display: none; }
.unit.down .upic.animated .art, .unit.down .upic.animated > svg { visibility: visible; }
.unit.down .upic, .unit.down .body::after { animation: none !important; }
/* The clips breathe on their own, so drop the CSS bob that stands in for it. */
.unit:has(.upic.animated) .body { animation: none; }
/* Status overlays (syncStatusFx). Each clip covers art units (-15,-25)-(115,100): the 100x100 sprite box
   plus room above for smoke and stun stars. The tints tie the sprite into the effect. */
.upic .stfx { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.upic .stfx img { position: absolute; left: -15%; top: -25%; width: 130%; height: 125%; max-width: none; object-fit: fill; }
.unit.st-burn .upic > :is(.art, svg, .anim) { filter: sepia(.25) saturate(1.35) brightness(1.06); }
.unit.st-soaked .upic > :is(.art, svg, .anim) { filter: saturate(.8) brightness(.92) drop-shadow(0 0 2px rgba(110, 180, 255, .55)); }
.unit.st-poison .upic > :is(.art, svg, .anim) { filter: drop-shadow(0 0 3px rgba(140, 220, 80, .6)); }
.unit.st-bleed .upic > :is(.art, svg, .anim) { filter: drop-shadow(0 0 2px rgba(220, 40, 60, .7)); }
.unit.st-burn.st-soaked .upic > :is(.art, svg, .anim) { filter: sepia(.15) saturate(1.1); }

/* Projectiles, lightning and impact effects */
.proj { position: absolute; left: 0; top: 0; z-index: 250; pointer-events: none; will-change: transform; }
.proj-arrow { width: 30px; height: 3px; margin: -1.5px 0 0 -15px; border-radius: 2px; background: linear-gradient(90deg, #d9c58a 0 18%, #8a5a32 18% 84%, #e6e1d3 84%); }
.proj-spear { width: 42px; height: 3px; margin: -1.5px 0 0 -21px; border-radius: 2px; background: linear-gradient(90deg, #7a5434 0 80%, #c9d1de 80%); }
.proj-bullet { width: 11px; height: 4px; margin: -2px 0 0 -5px; border-radius: 2px; background: #ffe9a8; box-shadow: 0 0 8px #ffd166; }
.proj-orb { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: radial-gradient(circle, #fff 0 18%, var(--c, #9fe08a) 45%, transparent 72%); box-shadow: 0 0 14px var(--c, #9fe08a); }
.proj-fire { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle, #fff6c2 0 16%, #ffb347 40%, #ff5a1f 62%, transparent 74%); box-shadow: 0 0 18px #ff7a2f; }
.proj-shell { width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #2a2f3f; box-shadow: 0 0 0 2px #ff7a45 inset, 0 0 8px #ff7a45; }
/* Per-skill projectiles (PROJ_SKILL / PROJ_ATTACK). Drawn pointing right; shoot() rotates them along the flight. */
.proj svg { display: block; overflow: visible; }
.proj svg .pf { transform-box: fill-box; transform-origin: 100% 50%; animation: pflame .07s infinite alternate; }
.proj svg .pk { animation: pspark .1s infinite alternate; }
.proj-leaf svg, .proj-axe svg, .proj-caltrop svg { animation: pspin .32s linear infinite; }
@keyframes pflame { to { transform: scaleX(.6); opacity: .75; } }
@keyframes pspark { to { opacity: .35; } }
@keyframes pspin { to { transform: rotate(360deg); } }
@keyframes ppulse { 50% { filter: brightness(1.5) saturate(1.3); } }   /* never transform: the flight owns it */
.proj-rocket, .proj-missile, .proj-flak, .proj-bomb, .proj-keg { filter: drop-shadow(0 0 3px rgba(255, 170, 60, .7)); }
.proj-firepot, .proj-napalm, .proj-fireball, .proj-meteor { filter: drop-shadow(0 0 6px #ff7a2f); }
.proj-javelin, .proj-dart { filter: drop-shadow(0 0 4px #e0242f); }
.proj-hawkarrow { filter: drop-shadow(0 0 5px #ffd166); }
.proj-venomarrow, .proj-venombolt, .proj-thorn, .proj-vine { filter: drop-shadow(0 0 4px #9fe08a); }
.proj-toxarrow, .proj-inkjet { filter: drop-shadow(0 0 4px #b07ae0); }
.proj-spark { width: 16px; height: 4px; margin: -2px 0 0 -8px; border-radius: 2px; background: linear-gradient(90deg, transparent, #7fe3ff 40%, #fff); box-shadow: 0 0 8px #7fe3ff; }
.proj-plasma { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: radial-gradient(circle, #fff 0 16%, #9fe7ff 34%, #3f8aff 56%, transparent 72%); box-shadow: 0 0 18px #6fb5ff, 0 0 4px #fff inset; animation: ppulse .14s infinite; }
.proj-tracer { width: 30px; height: 2px; margin: -1px 0 0 -15px; border-radius: 1px; background: linear-gradient(90deg, transparent, #ffd166 60%, #fff); box-shadow: 0 0 6px #ffd166; }
.proj-slug { width: 16px; height: 7px; margin: -3.5px 0 0 -8px; border-radius: 3px 50% 50% 3px; background: radial-gradient(circle at 70% 50%, #fff6c2, #ff9a2e 60%, #b8460f); box-shadow: 0 0 12px #ff7a2f, -10px 0 10px rgba(220, 220, 230, .45); }
.proj-ricochet { width: 10px; height: 4px; margin: -2px 0 0 -5px; border-radius: 2px; background: #eef2f8; box-shadow: 0 0 6px #fff, 0 0 12px #9fdcff; }
.proj-ember { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: radial-gradient(circle, #fff6c2 0 20%, #ffb347 45%, #ff5a1f 70%, transparent 76%); box-shadow: 0 0 10px #ff7a2f; }
.proj-flare { width: 32px; height: 5px; margin: -2.5px 0 0 -16px; border-radius: 3px; background: linear-gradient(90deg, transparent, #ff7a2f 30%, #ffd166 70%, #fff); box-shadow: 0 0 12px #ffb347; }
.proj-bubble { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 14%, rgba(180, 244, 255, .5) 30%, rgba(80, 180, 220, .35) 70%); border: 1.5px solid #bff3ff; }
.proj-pearl { width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: radial-gradient(circle at 35% 32%, #fff, #f2e6f0 55%, #b8a8c4); box-shadow: 0 0 10px #f2c6d8; }
.proj-inkball { width: 15px; height: 13px; margin: -6.5px 0 0 -7.5px; border-radius: 50% 40% 50% 45%; background: radial-gradient(circle at 40% 35%, #9474c4, #2a1d40 70%); box-shadow: 0 0 8px #5a4a8a; }
.proj-inkcloud { width: 28px; height: 22px; margin: -11px 0 0 -14px; border-radius: 50% 45% 55% 40%; background: radial-gradient(circle at 40% 35%, #8a6ab8, #2a1d40 65%, transparent 74%); box-shadow: 8px 4px 0 -3px #3a2a5a, -7px 5px 0 -4px #3a2a5a; }
.proj-hexorb { width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: radial-gradient(circle, #e8ffd0 0 12%, #9a4ad0 40%, #3a0f50 64%, transparent 72%); box-shadow: 0 0 14px #b07ae0, 0 0 0 2px rgba(159, 224, 138, .6); animation: ppulse .2s infinite; }
.proj-bloodbolt { width: 28px; height: 6px; margin: -3px 0 0 -14px; border-radius: 3px; background: linear-gradient(90deg, transparent, #7a0f1c 30%, #e0242f 75%, #ff8a8a); box-shadow: 0 0 10px #e0242f; }
.proj-pellets { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #ffe9a8; box-shadow: 0 0 6px #ffd166, 9px -6px 0 -1px #ffe9a8, 7px 7px 0 -1px #ffe9a8, -8px 4px 0 -1px #ffe9a8, -6px -7px 0 -1px #ffe9a8; }
.proj-note, .proj-heartnote, .proj-dirge { width: 26px; height: 26px; margin: -13px 0 0 -13px; display: grid; place-items: center; font: 800 22px/1 Georgia, serif; }
.proj-note::before { content: '\266A'; color: #fff; text-shadow: 0 0 8px #bff3ff, 0 0 2px #15121d; }
.proj-heartnote::before { content: '\2665\266A'; font-size: 17px; color: #ff9ac8; text-shadow: 0 0 8px #ff7ab0, 0 0 2px #15121d; }
.proj-dirge::before { content: '\266B'; color: #7fa8c8; text-shadow: 0 0 8px #3a2a6a, 0 0 2px #15121d; }
.burst-flak { width: 110%; background: radial-gradient(circle at 30% 40%, #ffd166 0 4%, transparent 5%), radial-gradient(circle at 68% 30%, #ffd166 0 3%, transparent 4%), radial-gradient(circle at 60% 70%, #ffb347 0 3%, transparent 4%), radial-gradient(circle, rgba(120, 120, 135, .85) 0 26%, rgba(80, 80, 95, .5) 46%, transparent 66%); animation-duration: .7s; }
.burst-ink { width: 120%; background: radial-gradient(circle, rgba(42, 29, 64, .9) 0 30%, rgba(90, 74, 138, .55) 50%, transparent 68%); animation-duration: .9s; }
.burst-flash { width: 130%; background: radial-gradient(circle, #fff 0 20%, rgba(255, 255, 240, .7) 40%, transparent 66%); animation-duration: .45s; }
.bolt { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 250; pointer-events: none; overflow: visible; }
.bolt polyline { fill: none; stroke: #eaf8ff; stroke-width: 3; stroke-linejoin: round; filter: drop-shadow(0 0 6px #7fe3ff); }
/* Maren's Backwash: a surging water beam from her to the enemy who used a skill (backwash()). */
.bolt.backwash polyline { stroke-linecap: round; filter: none; }
.bolt.backwash .bw-glow { stroke: #3fb6d8; stroke-width: 9; opacity: .45; filter: blur(3px); }
.bolt.backwash .bw-body { stroke: #8fe3f2; stroke-width: 4.5; }
.bolt.backwash .bw-core { stroke: #f2fdff; stroke-width: 1.8; }
.bolt.backwash circle { fill: #dff7ff; stroke: #2a7f8f; stroke-width: 1; }
/* Malgrath's Infernal Toll: the same beam as hellfire, with embers instead of droplets. */
.bolt.backwash.hellfire .bw-glow { stroke: #e0452a; }
.bolt.backwash.hellfire .bw-body { stroke: #ff9a3d; }
.bolt.backwash.hellfire .bw-core { stroke: #fff3b0; }
.bolt.backwash.hellfire circle { fill: #ffc24d; stroke: #8a1f10; }
.burst-splash { width: 115%; background: radial-gradient(circle at 35% 35%, #fff 0 4%, transparent 5%), radial-gradient(circle at 66% 42%, #dff7ff 0 3%, transparent 4%), radial-gradient(circle, rgba(170, 235, 250, .85) 0 22%, rgba(63, 182, 216, .55) 44%, transparent 66%); animation-duration: .6s; }
.burst {
  position: absolute; left: 50%; top: 50%; width: 110%; aspect-ratio: 1; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; z-index: 3; animation: burst .7s ease-out forwards;
}
.burst-hit { width: 55%; background: radial-gradient(circle, #fff 0 14%, rgba(255, 255, 255, .55) 30%, transparent 62%); animation-duration: .35s; }
.burst-fire { width: 95%; background: radial-gradient(circle, #fff3b0 0 14%, #ff9a3d 34%, rgba(255, 80, 30, .5) 55%, transparent 70%); }
.burst-heal { background: radial-gradient(circle, rgba(108, 194, 138, .6), transparent 65%); animation-name: rise; animation-duration: .9s; }
.burst-heal::after { content: '+ + +'; position: absolute; inset: 22% 0 auto; text-align: center; font-weight: 800; font-size: 1.1rem; letter-spacing: .25em; color: #b6f5c9; }
.burst-shield { border: 3px solid rgba(160, 210, 255, .9); box-shadow: inset 0 0 16px rgba(140, 200, 255, .7), 0 0 14px rgba(140, 200, 255, .55); animation-name: bubble; animation-duration: .85s; }
.burst-buff { background: radial-gradient(circle, rgba(232, 165, 72, .6), transparent 65%); animation-name: rise; }
.burst-curse { background: radial-gradient(circle, rgba(196, 139, 224, .65), transparent 65%); }
.burst-roar { border: 3px solid rgba(240, 100, 90, .85); animation-name: ring; }
.burst-smoke { width: 140%; background: radial-gradient(circle, rgba(225, 225, 235, .8) 0 28%, rgba(180, 180, 195, .45) 50%, transparent 70%); animation-duration: .9s; }
@keyframes burst { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.15); opacity: 0; } }
@keyframes rise { from { transform: translate(-50%, -30%) scale(.6); opacity: .95; } to { transform: translate(-50%, -85%) scale(1.1); opacity: 0; } }
@keyframes bubble { 0% { transform: translate(-50%, -50%) scale(.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0; } }
@keyframes ring { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.7); opacity: 0; } }
.bar { position: relative; height: 16px; border-radius: 5px; background: var(--hp-dim); overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--hp); transition: width .35s ease; }
.bar span {
  position: relative; display: block; padding-inline: 6px; text-align: right;
  font-size: .72rem; font-weight: 800; line-height: 16px; font-variant-numeric: tabular-nums; color: var(--fg);
}
.bar.heat { height: 11px; background: var(--heat-dim); }
.bar.heat .fill { background: var(--heat); }
.bar.heat span { line-height: 11px; font-size: .62rem; }
/* Overheat bar divided into quarters: 25 / 50 / 75 / 100. The ticks sit above the fill. */
.bar.heat::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1.5px), rgba(12, 10, 16, .6) calc(25% - 1.5px) 25%);
}
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px; min-height: 18px; }
.chip { font-size: .66rem; font-weight: 800; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; line-height: 16px; }
.chip .ico { margin-right: 2px; font-weight: 400; }
.chip.good { color: var(--good); }
.chip.bad { color: var(--bad); }
.chip.pass { color: var(--accent); }

/* Hit / attack animation */
.unit.p .upic.lunge { animation: lungeR .3s ease; }
.unit.e .upic.lunge { animation: lungeL .3s ease; }
.upic.hurt { animation: hurt .36s ease; }
.upic.cast { animation: cast .45s ease; }
@keyframes lungeR { 45% { transform: translateX(14px); } }
@keyframes lungeL { 45% { transform: translateX(-14px); } }
@keyframes hurt { 20% { transform: translateX(-5px); filter: brightness(2); } 55% { transform: translateX(5px); } }
@keyframes cast { 40% { transform: translateY(-5px); filter: brightness(1.5) drop-shadow(0 0 6px var(--accent)); } }
.float {
  position: absolute; left: 50%; top: 4%; z-index: 2;
  font-weight: 800; font-size: 1.25rem; white-space: nowrap; pointer-events: none;
  text-shadow: 0 2px 0 var(--bg), 0 0 8px var(--bg);
  animation: rise 1s ease-out forwards;
}
.float.dmg { color: var(--fg); }
.float.crit { color: var(--accent); font-size: 1.6rem; }
.float.heal { color: var(--good); }
.float.miss { color: var(--muted); font-size: .95rem; }
.float.dot, .float.fx { color: var(--status); }
.float.fx { font-size: .85rem; }
.float.mpf { color: var(--mp); font-size: .9rem; }
@keyframes rise {
  from { opacity: 0; transform: translate(-50%, 10px); }
  15% { opacity: 1; }
  to { opacity: 0; transform: translate(-50%, -44px); }
}

/* Command deck + log */
/* Battle layout: field (arena with the weather pill, speed bar with the round counter, actions) on the left, battle log on the right. */
.battleGrid { display: grid; gap: 16px; align-items: start; }
.field { display: grid; gap: 14px; min-width: 0; }
@media (min-width: 980px) {
  .battleGrid { grid-template-columns: minmax(0, 1fr) clamp(260px, 26vw, 330px); }
  .chron {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
    height: calc(100vh - 32px); max-height: 900px; display: flex; flex-direction: column;
  }
  .chron .log { flex: 1; min-height: 0; max-height: none; }
}
.deck, .chron {
  display: grid; gap: 10px; align-content: start; min-width: 0;
  padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.dhead h3 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; line-height: 1.1; }
.passive { margin: 0; font-size: .86rem; color: var(--muted); }
.passive .cpas { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.passive .cpas .sic { flex: none; width: 24px; height: 24px; }
.passive b { color: var(--accent); }
/* Actions: your skills on the left, Attack and Guard apart on the right. Each is a bare icon with its
   name underneath; the mana cost is a blue number on the icon, a cooldown a big number over it. */
.acts { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.agroup { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.agroup.basic { flex: none; padding-left: 10px; border-left: 1px solid var(--line); }
.act {
  font: inherit; color: inherit; background: none; border: 0; padding: 2px 0 0; cursor: pointer;
  display: grid; justify-items: center; align-content: start; gap: 5px; width: 70px; text-align: center;
}
.act .aico { position: relative; width: 52px; height: 52px; border-radius: 12px; background: var(--panel-2); transition: transform .12s, box-shadow .15s, opacity .15s; }
.act .aico .sic { width: 100%; height: 100%; display: block; }
.act:hover:not(:disabled) .aico, .act:focus-visible .aico { transform: translateY(-2px); box-shadow: 0 0 0 2px rgba(232, 165, 72, .5); }
.act:focus-visible { outline: none; }
.act.armed .aico { box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(232, 165, 72, .65); }
.act:disabled { cursor: not-allowed; }
.act:disabled .aico { opacity: .4; filter: grayscale(.6); }
.act .mpc {
  position: absolute; right: -5px; bottom: -5px; min-width: 20px; padding: 0 4px; border-radius: 8px;
  background: rgba(12, 14, 22, .92); color: var(--mp); font-size: .8rem; font-weight: 800; line-height: 18px; font-variant-numeric: tabular-nums;
}
.act .mpc.short { color: var(--bad); }
.act .mpc:empty, .act .cdn:empty { display: none; }
.act .cdn { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; color: #fff; text-shadow: 0 1px 4px #000; }
.act .star { position: absolute; left: -6px; top: -7px; color: var(--accent); font-size: .95rem; text-shadow: 0 1px 2px #000; }
.act .rkb { position: absolute; right: -6px; top: -6px; margin: 0; }
.act kbd {
  position: absolute; left: -5px; bottom: -5px; font: 700 .62rem/1 var(--font-body); color: var(--muted);
  padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: rgba(12, 14, 22, .92);
}
@media (pointer: coarse) { .act kbd { display: none; } }
.act .nm { font-size: .78rem; font-weight: 800; line-height: 1.15; }
.act .combo { font-size: .64rem; font-weight: 800; color: var(--accent); line-height: 1.1; }
.prompt {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 8px 10px; border-radius: 9px; border: 1px dashed var(--target); font-size: .9rem; font-weight: 700;
}
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 340px; overflow: auto; font-size: .86rem; }
.log li { padding-left: 10px; border-left: 2px solid var(--line); }
.log li.p { border-color: var(--accent); }
.log li.e { border-color: var(--bad); }
.log li.sys { color: var(--muted); }
.log li.wx { border-color: var(--ranged); color: var(--fg); font-weight: 700; }
.log li.round { border: 0; padding: 6px 0 0; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.foot p { margin: 0; font-size: .8rem; color: var(--muted); }

/* Portrait phones: the battle fits one screen. Ladder on top, the arena,
   a slim speed bar, your actions as a grid of icon buttons, then the latest log lines. */
@media (orientation: portrait) and (max-width: 700px) {
  body[data-screen="battle"] .wrap { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); gap: 8px; }
  body[data-screen="battle"] .top { gap: 6px; }
  body[data-screen="battle"] .top > div:first-child,
  body[data-screen="battle"] .herotag, body[data-screen="battle"] .purse { display: none; }
  body[data-screen="battle"] .topR { width: 100%; justify-content: flex-start; flex-wrap: nowrap; }
  .ladder { flex-wrap: nowrap; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .ladder li { flex: none; padding: 2px 8px 2px 2px; font-size: .74rem; }
  .ladder li:not(.now) { padding-right: 2px; }
  .ladder li:not(.now) .nm { display: none; }
  .battleGrid, .field { gap: 8px; }
  .field .arena { aspect-ratio: auto; height: 36dvh; min-height: 250px; margin-inline: -8px; border-radius: 0; }   /* edge to edge */
  .speed { padding: 6px 10px 8px; gap: 2px; }
  .track { height: 70px; }
  .lane { display: none; }
  .deck { padding: 10px; gap: 8px; }
  .dhead h3 { font-size: 1.15rem; }
  .passive { font-size: .76rem; }
  .act { width: 62px; }
  .act .aico { width: 46px; height: 46px; }
  .chron { padding: 8px 10px; gap: 4px; }
  .chron > .label { display: none; }
  .log { max-height: 72px; font-size: .78rem; }
  .foot p { display: none; }
}

/* Portrait phones: champion select and the Skills screen. A small title, a compact sticky tray
   (buttons in one sideways-scrolling row) and a sideways-scrolling faction filter. */
@media (orientation: portrait) and (max-width: 700px) {
  body[data-screen="select"] .wrap, body[data-screen="skills"] .wrap { padding: 10px 10px 24px; gap: 10px; }
  body[data-screen="select"] h1, body[data-screen="skills"] h1 { font-size: 1.7rem; }
  body[data-screen="select"] .tag, body[data-screen="skills"] .tag { font-size: .82rem; }
  body[data-screen="select"] .topR, body[data-screen="skills"] .topR { display: none; }
  .tray { gap: 6px; padding: 8px; }
  .trayRow p { font-size: .78rem; }
  .trayBtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .trayBtns .btn { padding: 7px 8px; font-size: .84rem; }
  .slot { min-height: 48px; padding: 4px 6px; gap: 5px; }
  .slot .mini { width: 32px; height: 32px; }
  .slot strong { font-size: .8rem; }
  .slot small { font-size: .66rem; }
  #selectScreen .trayRow p { display: none; }
  #filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  #filters > * { flex: none; }
}

/* End-of-battle panel */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: var(--scrim); overflow: auto; }
.card {
  width: min(460px, 100%); display: grid; gap: 12px;
  padding: 22px; border-radius: 14px; background: var(--panel); border: 1px solid var(--accent);
}
.kick { font-size: .74rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; text-wrap: balance; }
.card p { margin: 0; }
.gains { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
.gains th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 0 8px 4px 0; }
.gains td { padding: 3px 8px 3px 0; border-top: 1px solid var(--line); }
.up { color: var(--good); font-weight: 800; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Purse (gold) ---------- */
.topR { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 14px; }
.purse {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 13px 4px 5px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.purse svg { width: 22px; height: 22px; display: block; }
.purse.gain { animation: wxPulse 1.2s ease; }

/* ---------- Village (Cinderhold): a drawn map of clickable buildings, then the open building's panel ---------- */
.town {
  position: relative; overflow: hidden; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(#15152a, #3a2533 45%, #2e2522 46%, #191517);
}
.town.panning { cursor: grabbing; }
/* In the village the page is the village: no page padding, no page scroll (sheets scroll inside). */
body.inTown { overflow: hidden; }
body.inTown .wrap { max-width: none; padding: 0; gap: 0; }
.townMap { display: block; width: 100%; height: auto; }
/* The map and everything standing on it (townies, NPCs) live in one view, so pan and zoom move them together.
   zoomTown/setView set its transform; --zinv undoes the scale for name tags and quest marks so they stay readable. */
.townView { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 3 / 1; transform-origin: 0 0; }
/* Gear: opens the game mechanics window. */
.gearBtn {
  pointer-events: auto; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; cursor: pointer;
  border-radius: 50%; border: 1px solid var(--line); background: rgba(22, 25, 37, .86); color: var(--fg); backdrop-filter: blur(3px);
  transition: color .15s, border-color .15s;
}
.gearBtn svg { width: 22px; height: 22px; transition: transform .4s ease; }
.gearBtn:hover, .gearBtn:focus-visible { color: var(--accent); border-color: var(--accent); }
.gearBtn:hover svg { transform: rotate(60deg); }
.rulesDlg {
  width: min(900px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; overflow: hidden;
  border: 1px solid var(--accent); border-radius: 14px; background: var(--panel); color: var(--fg);
}
.rulesDlg[open] { display: flex; flex-direction: column; }
.rulesDlg::backdrop { background: rgba(8, 8, 14, .65); }
.rulesDlg > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.rulesDlg h2 { margin: 0; font-family: var(--font-display); font-size: 1.6rem; }
.rulesBody { display: grid; gap: 10px; padding: 14px 16px 16px; overflow: auto; min-height: 0; }
/* Your champion and purse, pinned to the map's top-right corner (outside the zoom). */
.townHud { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.townHud .herotag, .townHud .purse { background: rgba(22, 25, 37, .86); backdrop-filter: blur(3px); }
.townView.glide { transition: transform .6s cubic-bezier(.3, .1, .2, 1); }
/* Everything else floats on the village: name tags and quest marks keep a readable size at any zoom. */
.townView .npc .tag { transform: translateX(-50%) scale(var(--zinv, 1)); transform-origin: 50% 100%; }
.townView .npc.here .tag { opacity: 1; }
.townView .qmark { width: 22cqw; min-width: calc(14px * var(--zinv, 1)); font-size: max(calc(10px * var(--zinv, 1)), 16cqw); }
.vwrap { display: block; }
/* The sheet: a building's panel, or your warband / skills. A bottom sheet on portrait screens,
   a card on the right on landscape ones. It scrolls inside; the village never scrolls. */
#placePanel {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; max-height: 55%; overflow: auto; overscroll-behavior: contain;
  touch-action: pan-y; user-select: text; -webkit-user-select: text;
  padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0;
  background: rgba(30, 33, 48, .97); border-top: 1px solid var(--accent); box-shadow: 0 -10px 30px rgba(0, 0, 0, .5);
}
#placePanel > .panel { padding: 0; border: 0; background: none; }
#placePanel .phead h2 { font-size: 1.6rem; }
#placePanel .forge, #placePanel .homeGrid { grid-template-columns: minmax(0, 1fr); }
@media (min-aspect-ratio: 1/1) {
  #placePanel {
    left: auto; top: 60px; right: 10px; bottom: 10px; width: min(460px, 46%); max-height: none;
    border-radius: 16px; border: 1px solid var(--accent); padding: 14px 16px 16px;
  }
}
/* The dock: your warband and skills, bottom-left. Hidden under an open bottom sheet. */
.dock { position: absolute; z-index: 3; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
.dock button {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 5px 14px 5px 6px; cursor: pointer;
  border-radius: 999px; border: 1px solid var(--line); background: rgba(22, 25, 37, .88); backdrop-filter: blur(3px);
  color: var(--fg); font: inherit; font-weight: 800; font-size: .92rem;
}
.dock button:hover, .dock button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.dock .faces { display: flex; }
.dock .faces span { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; position: relative; background: var(--panel-2); border: 1px solid var(--line); }
.dock .faces span + span { margin-left: -10px; }
.dock .faces img, .dock .faces svg { position: absolute; width: 170%; height: 170%; left: -35%; top: -12%; max-width: none; }
.dock .sic { width: 30px; height: 30px; }
.dock .badge { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .74rem; line-height: 20px; text-align: center; }
.town.sheetOpen .dock { display: none; }
@media (min-aspect-ratio: 1/1) { .town.sheetOpen .dock { display: flex; } }
.bld { cursor: pointer; transition: filter .2s; outline: none; }
.bld:hover, .bld:focus-visible, .bld.open { filter: brightness(1.22) drop-shadow(0 0 8px rgba(232, 165, 72, .55)); }
.sign rect { fill: rgba(22, 25, 37, .88); stroke: var(--line); stroke-width: 1.5; }
.sign text { fill: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 21px; text-anchor: middle; }
.bld:hover .sign rect, .bld:focus-visible .sign rect, .bld.open .sign rect { stroke: var(--accent); stroke-width: 2.5; }
.bld:hover .sign text, .bld:focus-visible .sign text, .bld.open .sign text { fill: var(--accent); }
.smoke { transform-box: fill-box; transform-origin: center; animation: smoke 5.1s linear infinite; }
@keyframes smoke { from { transform: translate(0, 0) scale(.6); opacity: .6; } to { transform: translate(24px, -84px) scale(1.9); opacity: 0; } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .45s ease-in-out infinite alternate; }
@keyframes flick { to { transform: scaleY(.8) scaleX(1.06); } }
.glow { animation: glowPulse 2.4s ease-in-out infinite; }
.lit { animation: glowPulse 4.5s ease-in-out infinite; }
@keyframes glowPulse { 50% { opacity: .55; } }
.ember { transform-box: fill-box; animation: ember 9s linear infinite; }
@keyframes ember { from { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } to { transform: translate(40px, -420px); opacity: 0; } }
.flag { transform-box: fill-box; transform-origin: 0 50%; animation: flag 2.2s ease-in-out infinite alternate; }
@keyframes flag { to { transform: skewY(8deg) scaleX(.85); } }
.plume { transform-box: fill-box; transform-origin: center; animation: plume 16s ease-in-out infinite alternate; }
@keyframes plume { to { transform: translateX(30px) scale(1.12); } }
.swing { animation: swing 3s ease-in-out infinite alternate; }
.ferris { animation: ferris 40s linear infinite; }
.mill { animation: ferris 24s linear infinite; }
/* Bounty Board: pinned parchment notices */
.notices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 6px 2px; }
.notice {

<script>
/* ==================================================================
   FACTIONS & ROLES
   ================================================================== */
const FACTIONS = {
  mech:  { name: 'Ironclad Union',     mechanic: 'Heat',
           rule: 'Every action builds Heat, filling the overheat bar in quarters (25 / 50 / 75 / 100) and adding up to 40% damage. Each quarter sears anyone it trades blows with — attacking or being attacked — for 10 / 20 / 30 / 40. At 100 Heat the unit overheats and skips its next turn; Guard vents 50 Heat. Water douses it: a Soaked unit (from Tideborn hits or a Downpour) drops to 0 Heat and cannot build any until the Soaked wears off. A destroyed Ironclad champion leaves a Salvage Bot behind.' },
  orc:   { name: 'Bloodtusk Horde',    mechanic: 'Rage',
           rule: 'Deals more damage the more hurt it is, up to +50% near death.' },
  human: { name: 'Kingdom of Aldmere', mechanic: 'Discipline',
           rule: 'Using a different action than last turn adds 15% damage or healing.' },
  stone: { name: 'Stoneleaf Accord',   mechanic: 'Precision & Fortify',
           rule: 'Elves gain +10% crit for each turn they go unhit (max 3). Dwarves gain a Fortify stack each time they are hit, taking 8% less damage per stack (max 3).' },
  tide:  { name: 'The Tideborn',       mechanic: 'Tide',
           rule: 'Every even round is High Tide: +25% damage and healing. Their hits Soak the target, and Soaked targets take 30% more lightning damage.' },
  crimson: { name: 'The Crimson Court', mechanic: 'Bloodthirst',
           rule: 'Every hit drains 20% of the damage dealt as HP. The Court has no ranged fighters: four melee and a support who Hexes enemies so they heal for half.' },
};
const FACTION_KEYS = Object.keys(FACTIONS);
// "the Bloodtusk Horde", "the Tideborn": names that already start with "The" don't get a second one.
const theFaction = (f, start = false) => `${start ? 'The' : 'the'} ${f.name.replace(/^The /, '')}`;

/* MANA — every champion except Ironclad mechs (they run on Heat) has a mana pool:
   the role's base pool × the faction's multiplier. Skills and ultimates cost mana;
   it regenerates every turn, Attack restores a little and Guard restores more. */
const MANA = {
  pool: { human: 1.5, stone: 1.5, tide: 1, crimson: 1, orc: 0.7, mech: 0 },
  skillCost: 20, skill2Cost: 25, ultCost: 40,   // default costs; a skill can override with o.mp
  regen: 6, regenPct: 0.04,             // per turn: 6 + 4% of max mana
  attackGain: 4, guardGain: 15,
  leakPerAction: 12,                    // Mana Leak: MP burned every time the unit acts
};
// HP regen: every champion recovers this share of max HP at the start of each of their turns.
const HP_REGEN_PCT = 0.03;

const poolLabel = (f) => ({ 1.5: 'Huge', 1: 'Normal', 0.7: 'Small', 0: 'None, runs on Heat' })[MANA.pool[f]];

/* PROFILE — what the village remembers between visits, saved in this browser:
   gold, forged gear per champion, the satchel of battle items, and your records.
   Gear per champion id: { w: weapon tier, a: armor tier } from the Ironsmith (see FORGE).
   Trinket bonuses can plug in here too: { mp, mpRegen, manaSteal, hpRegen }. */
const SAVE_KEY = 'burizza.profile.v1';
// stash = what's kept at Your House ({ items: {key: n}, trinkets: {key: n} }); home = furniture keys you own (see DECOR).
// hero = your one champion { id, name } (null until you create one); level/xp = your champion's progression;
// recruits = the 2 champion ids the AI plays beside you.
const blankProfile = () => ({ gold: 60, gear: {}, items: {}, quests: {}, stash: { items: {}, trinkets: {} }, home: [],
  hero: null, level: 1, xp: 0, recruits: [],
  loadout: null,   // your champion's chosen skills: { act: ['a', 'b'], pas: ['own'] } (see SKILL LOADOUT)
  skillRanks: {},  // skill points spent, per champion id: { a: 2, flashpowder: 1 } (see SKILL RANKS)
  dungeons: {},    // per dungeon id: { clears } (first clear pays a trinket; see DUNGEONS)
  carnival: { plays: 0, won: 0 },   // Carnival records: rounds played, gold won
  bounty: null,                     // today's Bounty Board: { day, list: [bounty…] } (see BOUNTY_TYPES)
  guild: null,     // your guild: { id, favor: { guildId: n } } — favor per guild survives switching (see GUILDS)
  stats: { runs: 0, clears: 0, wins: 0, best: 0, earned: 0 } });
function loadProfile() {
  const p = blankProfile();
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved && typeof saved.gold === 'number') return { ...p, ...saved, stats: { ...p.stats, ...saved.stats } };
  } catch (err) { /* private window or blocked storage: start fresh */ }
  return p;
}
let profile = loadProfile();
function saveProfile() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(profile)); } catch (err) { /* progress just won't persist */ }
  renderPurse();
}
/* PROGRESSION — you are one champion (profile.hero) who levels up for good.
   Recruits are AI-controlled allies who fight beside you at your level.
   Battles pay XP; enough XP raises your level, which raises your whole warband's stats. */
const LEVEL_CAP = 30;
const xpToNext = (lv) => 60 + 40 * lv;               // Lv 1→2: 100 XP, 2→3: 140, 3→4: 180 …
const XP_WIN_BASE = 35, XP_WIN_STEP = 10, XP_CLEAR_BONUS = 120, XP_LOSS = 15;
const battleXp = (i) => XP_WIN_BASE + XP_WIN_STEP * i;   // i = battle index in the gauntlet, 0-based
const heroLevel = () => profile.level || 1;
// Champion names show up inside HTML, so markup characters are never allowed in them.
const cleanName = (s) => String(s || '').replace(/[<>&"'`]/g, '').trim().slice(0, 16);
const heroName = () => (profile.hero ? cleanName(profile.hero.name) || shortName(charById(profile.hero.id)) : '');

// Adds XP and applies any level-ups. Returns { xp, from, to } — xp is what was really
// added (the Ember Scholars' perk boosts every battle's XP here, lost ones included),
// and it wins the spread in `{ xp, ...gainXp(xp) }` so reward screens show the true amount.
function gainXp(n) {
  n = Math.round(n * (1 + guildPct('xp') / 100));
  const from = heroLevel();
  profile.xp = (profile.xp || 0) + n;
  while (profile.level < LEVEL_CAP && profile.xp >= xpToNext(profile.level)) {
    profile.xp -= xpToNext(profile.level);
    profile.level++;
  }
  return { xp: n, from, to: profile.level };
}

// Your warband is always [your champion, recruit, recruit] once you have a champion.
function syncTeam() {
  if (profile.hero) state.team = [profile.hero.id, ...(profile.recruits || [])].slice(0, 3);
}

// gearRaw = what's saved ({ w, a, t }). gearOf adds up the worn trinket's bonus (TRINKETS) and
// the perks of furniture at home (DECOR) for makeUnit: mp, mpRegen, manaSteal, hpRegen, agi, hpPct, atkPct.
const gearRaw = (id) => profile.gear[id] || {};
const addUp = (into, bonus) => { for (const k in bonus) into[k] = (into[k] || 0) + bonus[k]; return into; };
const homePerks = () => profile.home.reduce((sum, k) => addUp(sum, DECOR[k]?.perk || {}), {});
const gearOf = (id) => { const g = gearRaw(id); return addUp(addUp({ ...g }, TRINKETS[g.t]?.bonus || {}), homePerks()); };

const ROLES = {
  melee:   { label: 'Melee',   hp: 150, atk: 18, def: 10, agi: 10, dodge: 0,    mp: 60 },
  ranged:  { label: 'Ranged',  hp: 112, atk: 20, def: 6,  agi: 13, dodge: 0.06, mp: 80 },

};

/* ==================================================================

   turns = how many of the owner's turn-starts before it expires
   ================================================================== */
const FX = {

const ELEM_ICON = { lightning: '⚡', fire: '🔥', holy: '✨' };

/* ==================================================================

   faction and has a side effect for everyone. The next weather is
   announced ahead of time so players can plan.
   ================================================================== */
const WEATHER = {
  clear: { name: 'Clear Skies',  favors: null,    desc: 'No effects.' },
  ash:   { name: 'Ash Storm',    favors: 'orc',   desc: 'Bloodtusk Horde deal 20% more damage. Burn deals 50% more to everyone.' },
  storm: { name: 'Thunderstorm', favors: 'mech',  desc: 'Ironclad Union deal 20% more damage. Everyone counts as Soaked, so Ironclad Heat is doused and cannot build. Lightning deals 30% more to everyone, and 30% more again to the Soaked.' },
  rain:  { name: 'Downpour',     favors: 'tide',  desc: 'Tideborn deal 20% more damage and healing. Everyone counts as Soaked. Burn deals 50% less to everyone. Ironclad Heat is washed out and cannot build.' },
  sun:   { name: 'Golden Dawn',  favors: 'human', desc: 'Kingdom of Aldmere deal 15% more damage and Discipline doubles to +30%. All healing is 20% stronger.' },
  mist:  { name: 'Elder Mist',   favors: 'stone', desc: 'Stoneleaf Accord gain an extra Precision or Fortify stack each turn. Everyone dodges 10% more often.' },
  moon:  { name: 'Blood Moon',   favors: 'crimson', desc: 'The Crimson Court deal 20% more damage. All lifesteal is doubled.' },
};
const WEATHER_EVERY = 3;
// Season 1, Ashfall Road: Ash Storms are twice as common. Future seasons can use their own mix.
const SEASON_WEATHER = { clear: 1, ash: 2, storm: 1, rain: 1, sun: 1, mist: 1, moon: 1 };

function rollWeather(except) {
  const opts = Object.entries(SEASON_WEATHER).filter(([k]) => k !== except);
  let roll = Math.random() * opts.reduce((s, [, w]) => s + w, 0);
  for (const [k, w] of opts) { roll -= w; if (roll <= 0) return k; }
  return opts[0][0];
}

/* ==================================================================
   SKILL BUILDERS
   D = damage skill, H = heal skill, B = buff skill.
   Options (o):
     aoe, hits, noDodge, pierce, ignoreShield, element:'lightning',
     critBonus, alwaysCrit, bonusVs:'<status>', selfCost, lifesteal,
     stun:<chance>, fx:[[status, turns, valuePerAttack]], heat
     heal: all, cleanse, tideBonus, fx     buff: heal, reduceCd, cleanse, selfStacks, aiTarget
     selfFx:[[status, turns]] (on the caster), chanceFx:[[status, turns, chance]], selfStacks:<n>,
     allyHeal:<mult> (heals all allies after hitting), allySteal:<share> (heals the most hurt ally),

// S = summon skill: creates an uncontrolled unit from SUMMONS (one per hero; recasting replaces it).
const S = (name, desc, cd, summon, o = {}) => ({ name, desc, cd, summon, o, kind: 'summon', target: 'self' });
const P = (name, desc, o = {}) => ({ name, desc, ...o });

/* ==================================================================

   ================================================================== */

  // ---- Ironclad Union (Mech) ----

/* EMBERHOLLOW CAVE — hunts against monster packs. Each depth unlocks at a level;
   monsters fight at your level (never below the depth's minimum). A hunt is one
   battle with full HP; it pays XP and gold and counts toward bounties. */
const CAVE = { name: 'Emberhollow Cave' };
const CAVE_DEPTHS = [
  { id: 'tunnels', name: 'Smoke Tunnels', minLv: 1, size: 3, scale: 1, pool: ['cinderbat', 'ashcrawler', 'magmaslime'],
    desc: 'Warm upper tunnels full of bats, spiders and slow, burning slimes.' },
  { id: 'grotto', name: 'Glowcap Grotto', minLv: 4, size: 4, scale: 1.05, pool: ['ashcrawler', 'magmaslime', 'bonerattler', 'glowcap'],
    desc: 'A glowing cavern where mushroom shamans keep the dead miners on their feet.' },
  { id: 'den', name: "Troll's Den", minLv: 8, size: 4, scale: 1.05, pool: ['bonerattler', 'glowcap', 'magmaslime', 'cinderbat'], elite: 'cavetroll',
    desc: 'The deepest chamber. A Cave Troll and whatever it lets live down there.' },
];
const depthById = (id) => CAVE_DEPTHS.find((d) => d.id === id);
const HUNT_GOLD_BASE = 10, HUNT_GOLD_PER = 6;   // gold per hunt: base + per monster

// A pack: the depth's elite (if any) plus random monsters from its pool, at most one shaman.
function rollPack(d) {
  const pack = d.elite ? [d.elite] : [];
  while (pack.length < d.size) {
    const id = pick(d.pool);
    if (id === 'glowcap' && pack.includes('glowcap')) continue;
    pack.push(id);
  }
  return pack;
}
