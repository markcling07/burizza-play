.slashArc { position: absolute; left: 50%; top: 50%; width: 150%; aspect-ratio: 1; margin: -75% 0 0 -75%; z-index: 4; pointer-events: none; animation: slashSweep .34s ease-out forwards; }
.slashArc.flip { scale: -1 1; }
.slashArc svg { width: 100%; height: 100%; overflow: visible; display: block; }
.slashArc path { fill: #eef6ff; filter: drop-shadow(0 0 7px #9fdcff) drop-shadow(0 0 2px #fff); }
@keyframes slashSweep { from { transform: rotate(-75deg); opacity: 0; } 25% { opacity: 1; } to { transform: rotate(50deg); opacity: 0; } }
@keyframes burst { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.15); opacity: 0; } }
@keyframes rise { from { transform: translate(-50%, -30%) scale(.6); opacity: .95; } to { transform: translate(-50%, -85%) scale(1.1); opacity: 0; } }
@keyframes bubble { 0% { transform: translate(-50%, -50%) scale(.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0; } }
@keyframes ring { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.7); opacity: 0; } }
.bar { position: relative; height: 16px; border-radius: 5px; background: var(--hp-dim); overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--hp); transition: width .35s ease; }
.bar span {
  position: relative; display: block; padding-inline: 6px; text-align: right;
  font-size: .72rem; font-weight: 800; line-height: 16px; font-variant-numeric: tabular-nums; color: var(--fg);
}
.bar.heat { height: 11px; background: var(--heat-dim); }
.bar.heat .fill { background: var(--heat); }
.bar.heat span { line-height: 11px; font-size: .62rem; }
/* Overheat bar divided into quarters: 25 / 50 / 75 / 100. The ticks sit above the fill. */
.bar.heat::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1.5px), rgba(12, 10, 16, .6) calc(25% - 1.5px) 25%);
}
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px; min-height: 18px; }
.chip { font-size: .66rem; font-weight: 800; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; line-height: 16px; }
.chip .ico { margin-right: 2px; font-weight: 400; }
.chip.good { color: var(--good); }
.chip.bad { color: var(--bad); }
.chip.neutral { color: #9fb4cf; }   /* the generic Attached marker: neither buff nor debuff on its own */
.chip.pass { color: var(--accent); }

/* Floating champions (ROSTER `floats: true`, e.g. Seraxa): wings hold them a hand above the
   ground. The lift is a plain translate, so it holds even while lunge/hurt/cast play; those
   animate `transform`, and the :where() keeps this rule from outranking them, so they interrupt
   only the bob — which then rests at the lift until they finish. A soft shadow sits where the
   feet would land; the acting/targetable rings replace it when they show. The fallen float no
   more: .unit.down stops .upic animations (see above) and resets the lift so they lie flat. */
.unit.floats :where(.upic) { translate: 0 -7%; animation: hoverBob 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
.unit.down .upic { translate: none; }
.unit.floats:not(.acting):not(.targetable):not(.down) .body::before { background: radial-gradient(closest-side, rgba(10, 8, 14, .4), transparent 72%); }
@keyframes hoverBob { 50% { translate: 0 -13%; } }

/* Hit / attack animation */
.unit.p .upic.lunge { animation: lungeR .3s ease; }
.unit.e .upic.lunge { animation: lungeL .3s ease; }
.upic.hurt { animation: hurt .36s ease; }
.upic.cast { animation: cast .45s ease; }
@keyframes lungeR { 45% { transform: translateX(14px); } }
@keyframes lungeL { 45% { transform: translateX(-14px); } }
@keyframes hurt { 20% { transform: translateX(-5px); filter: brightness(2); } 55% { transform: translateX(5px); } }
@keyframes cast { 40% { transform: translateY(-5px); filter: brightness(1.5) drop-shadow(0 0 6px var(--accent)); } }
.float {
  position: absolute; left: 50%; top: 4%; z-index: 2;
  font-weight: 800; font-size: 1.25rem; white-space: nowrap; pointer-events: none;
  text-shadow: 0 2px 0 var(--bg), 0 0 8px var(--bg);
  animation: rise 1s ease-out forwards;
}
.float.dmg { color: var(--fg); }
.float.crit { color: var(--accent); font-size: 1.6rem; }
.float.heal { color: var(--good); }
.float.miss { color: var(--muted); font-size: .95rem; }
.float.dot, .float.fx { color: var(--status); }
.float.fx { font-size: .85rem; }
.float.mpf { color: var(--mp); font-size: .9rem; }
.float.xpf { color: var(--accent); font-size: .95rem; font-weight: 800; }
@keyframes rise {
  from { opacity: 0; transform: translate(-50%, 10px); }
  15% { opacity: 1; }
  to { opacity: 0; transform: translate(-50%, -44px); }
}

/* Command deck + log */
/* Battle layout: field (arena with the weather pill, speed bar with the round counter, actions) on the left, battle log on the right. */
.battleGrid { display: grid; gap: 16px; align-items: start; }
.field { display: grid; gap: 14px; min-width: 0; }
@media (min-width: 980px) {
  .battleGrid { grid-template-columns: minmax(0, 1fr) clamp(260px, 26vw, 330px); }
  .chron {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
    height: calc(100vh - 32px); max-height: 900px; display: flex; flex-direction: column;
  }
  .chron .log { flex: 1; min-height: 0; max-height: none; }
}
.deck, .chron {
  display: grid; gap: 10px; align-content: start; min-width: 0;
  padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
/* Your turn: the command deck lights up gold so it's plain the game is waiting on you. */
.deck.your-turn {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(232, 165, 72, .45), 0 0 18px rgba(232, 165, 72, .22);
  animation: deckCall 1.7s ease-in-out infinite;
}
@keyframes deckCall { 50% { box-shadow: 0 0 0 1px rgba(232, 165, 72, .8), 0 0 28px rgba(232, 165, 72, .45); } }
@media (prefers-reduced-motion: reduce) { .deck.your-turn { animation: none; } }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.dhead h3 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; line-height: 1.1; }
.passive { margin: 0; font-size: .86rem; color: var(--muted); }
.passive .cpas { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.passive .cpas .sic { flex: none; width: 24px; height: 24px; }
.passive b { color: var(--accent); }
/* Actions: your skills on the left, Attack and Guard apart on the right. Each is a bare icon with its
   name underneath; the mana cost is a blue number on the icon, a cooldown a big number over it. */
/* Skills kept at the top of the deck, the satchel beside them on the right (stacks underneath on
   narrow screens). When the satchel is hidden its auto column collapses and the skills fill the row. */
.deckTop { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.deckTop .satchel { padding: 0 0 0 16px; border-top: 0; border-left: 1px solid var(--line); min-width: 130px; }
@media (max-width: 620px) {
  .deckTop { grid-template-columns: minmax(0, 1fr); }
  .deckTop .satchel { padding: 10px 0 0; border-left: 0; border-top: 1px solid var(--line); }
}
.acts { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.agroup { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.agroup.basic { flex: none; padding-left: 10px; border-left: 1px solid var(--line); }
.act {
  font: inherit; color: inherit; background: none; border: 0; padding: 2px 0 0; cursor: pointer;
  display: grid; justify-items: center; align-content: start; gap: 5px; width: 70px; text-align: center;
}
.act .aico { position: relative; width: 52px; height: 52px; border-radius: 12px; background: var(--panel-2); transition: transform .12s, box-shadow .15s, opacity .15s; }
.act .aico .sic { width: 100%; height: 100%; display: block; }
.act:hover:not(:disabled) .aico, .act:focus-visible .aico { transform: translateY(-2px); box-shadow: 0 0 0 2px rgba(232, 165, 72, .5); }
.act:focus-visible { outline: none; }
.act.armed .aico { box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(232, 165, 72, .65); }
.act:disabled { cursor: not-allowed; }
.act:disabled .aico { opacity: .4; filter: grayscale(.6); }
.act .mpc {
  position: absolute; right: -5px; bottom: -5px; min-width: 20px; padding: 0 4px; border-radius: 8px;
  background: rgba(12, 14, 22, .92); color: var(--mp); font-size: .8rem; font-weight: 800; line-height: 18px; font-variant-numeric: tabular-nums;
}
.act .mpc.short { color: var(--bad); }
/* The Crimson Court pay in blood, not mana, so their badge reads as a wound rather than a pool. */
.act .mpc.blood { color: var(--hp); }
.act .mpc:empty, .act .cdn:empty { display: none; }
.act .cdn { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; color: #fff; text-shadow: 0 1px 4px #000; }
.act .star { position: absolute; left: -6px; top: -7px; color: var(--accent); font-size: .95rem; text-shadow: 0 1px 2px #000; }
.act .rkb { position: absolute; right: -6px; top: -6px; margin: 0; }
.act kbd {
  position: absolute; left: -5px; bottom: -5px; font: 700 .62rem/1 var(--font-body); color: var(--muted);
  padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: rgba(12, 14, 22, .92);
}
@media (pointer: coarse) { .act kbd { display: none; } }
.act .nm { font-size: .78rem; font-weight: 800; line-height: 1.15; }
.act .combo { font-size: .64rem; font-weight: 800; color: var(--accent); line-height: 1.1; }
.prompt {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 8px 10px; border-radius: 9px; border: 1px dashed var(--target); font-size: .9rem; font-weight: 700;
}
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 340px; overflow: auto; font-size: .86rem; }
.log li { padding-left: 10px; border-left: 2px solid var(--line); }
.log li.p { border-color: var(--accent); }
.log li.e { border-color: var(--bad); }
.log li.sys { color: var(--muted); }
.log li.wx { border-color: var(--ranged); color: var(--fg); font-weight: 700; }
.log li.round { border: 0; padding: 6px 0 0; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.foot p { margin: 0; font-size: .8rem; color: var(--muted); }

/* Portrait phones: the battle fits one screen. Ladder on top, the arena,
   a slim speed bar, your actions as a grid of icon buttons, then the latest log lines. */
@media (orientation: portrait) and (max-width: 700px) {
  body[data-screen="battle"] .wrap { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); gap: 8px; }
  body[data-screen="battle"] .top { display: none; }   /* the ladder moved to the foot; nothing else sits here on phones */
  #battleScreen > .ladder { flex-wrap: nowrap; overflow-x: auto; gap: 4px; scrollbar-width: none; justify-content: flex-start; }
  .ladder li { flex: none; padding: 2px 8px 2px 2px; font-size: .74rem; }
  .ladder li:not(.now) { padding-right: 2px; }
  .ladder li:not(.now) .nm { display: none; }
  .battleGrid, .field { gap: 8px; }
  .field .arena { aspect-ratio: auto; height: 36dvh; min-height: 250px; margin-inline: -8px; border-radius: 0; }   /* edge to edge */
  .speed { padding: 6px 10px 8px; gap: 2px; }
  .track { height: 70px; }
  .lane { display: none; }
  .deck { padding: 10px; gap: 8px; }
  .dhead h3 { font-size: 1.15rem; }
  .passive { font-size: .76rem; }
  .act { width: 62px; }
  .act .aico { width: 46px; height: 46px; }
  .chron { padding: 8px 10px; gap: 4px; }
  .chron > .label { display: none; }
  .log { max-height: 72px; font-size: .78rem; }
  .foot p { display: none; }
}

/* Portrait phones: champion select and the Skills screen. A small title, a compact sticky tray
   (buttons in one sideways-scrolling row) and a sideways-scrolling faction filter. */
@media (orientation: portrait) and (max-width: 700px) {
  body[data-screen="select"] .wrap, body[data-screen="skills"] .wrap { padding: 10px 10px 24px; gap: 10px; }
  #selectScreen .tray { --gut: 10px; }
  body[data-screen="select"] h1, body[data-screen="skills"] h1 { font-size: 1.7rem; }
  body[data-screen="select"] .tag, body[data-screen="skills"] .tag { font-size: .82rem; }
  body[data-screen="select"] .topR, body[data-screen="skills"] .topR { display: none; }
  .tray { gap: 6px; padding: 8px; }
  .trayRow p { font-size: .78rem; }
  .trayBtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .trayBtns .btn { padding: 7px 8px; font-size: .84rem; }
  .slot strong { font-size: .74rem; }
  #selectScreen .trayRow p { display: none; }
  #filters .fbtn { font-size: .76rem; }
}

/* End-of-battle panel */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: var(--scrim); overflow: auto; }
.card {
  width: min(460px, 100%); display: grid; gap: 12px;
  padding: 22px; border-radius: 14px; background: var(--panel); border: 1px solid var(--accent);
}
.kick { font-size: .74rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; text-wrap: balance; }
.card p { margin: 0; }
.up { color: var(--good); font-weight: 800; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Purse (gold) ---------- */
.topR { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 14px; }
.purse {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 13px 4px 5px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.purse svg { width: 22px; height: 22px; display: block; }
.purse.gain { animation: wxPulse 1.2s ease; }

/* ---------- Village (Cinderhold): a drawn map of clickable buildings, then the open building's panel ---------- */
.town {
  position: relative; overflow: hidden; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none;
  background: #26301f;   /* the forest beyond the map, if you ever see past its edge */
}
.town.panning { cursor: grabbing; }
/* In the village the page is the village: no page padding, no page scroll (sheets scroll inside). */
body.inTown { overflow: hidden; }
body.inTown .wrap { max-width: none; padding: 0; gap: 0; }
.townMap { display: block; width: 100%; height: auto; }
/* The map and everything standing on it (townies, NPCs) live in one view, so pan and zoom move them together.
   zoomTown/setView set its transform; --zinv undoes the scale for name tags and quest marks so they stay readable. */
/* --map-ar is set from MAP_W / MAP_H at startup, so the map's shape is defined in one place. */
.townView { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: var(--map-ar, 23 / 6); transform-origin: 0 0; }
/* Gear: opens the game mechanics window. */
.gearBtn {
  pointer-events: auto; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; cursor: pointer;
  border-radius: 50%; border: 1px solid var(--line); background: rgba(22, 25, 37, .86); color: var(--fg); backdrop-filter: blur(3px);
  transition: color .15s, border-color .15s;
}
.gearBtn svg { width: 22px; height: 22px; transition: transform .4s ease; }
.gearBtn:hover, .gearBtn:focus-visible { color: var(--accent); border-color: var(--accent); }
.gearBtn:hover svg { transform: rotate(60deg); }
.rulesDlg {
  width: min(900px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; overflow: hidden;
  border: 1px solid var(--accent); border-radius: 14px; background: var(--panel); color: var(--fg);
}
.rulesDlg[open] { display: flex; flex-direction: column; }
.rulesDlg::backdrop { background: rgba(8, 8, 14, .65); }
.rulesDlg > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.rulesDlg h2 { margin: 0; font-family: var(--font-display); font-size: 1.6rem; }
.rulesBody { display: grid; gap: 10px; padding: 14px 16px 16px; overflow: auto; min-height: 0; }
/* Your champion and purse, pinned to the map's top-right corner (outside the zoom). */
.townHud { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.townHud .herotag, .townHud .purse { background: rgba(22, 25, 37, .86); backdrop-filter: blur(3px); }
.townView.glide { transition: transform .6s cubic-bezier(.3, .1, .2, 1); }
/* Everything else floats on the village: name tags and quest marks keep a readable size at any zoom. */
.townView .npc .tag { transform: translateX(-50%) scale(var(--zinv, 1)); transform-origin: 50% 100%; }
.townView .npc.here .tag { opacity: 1; }
/* On the village map the quest mark keeps one on-screen size at any zoom: an 18px badge with a 13px "!". */
.townView .qmark {
  width: calc(18px * var(--zinv, 1)); min-width: 0; height: calc(18px * var(--zinv, 1));
  font-size: calc(13px * var(--zinv, 1)); border-width: calc(2px * var(--zinv, 1)); box-shadow: 0 0 calc(8px * var(--zinv, 1)) rgba(232, 165, 72, .7);
}
.vwrap { display: block; }
/* The sheet: a building's panel, or your warband / skills. A bottom sheet on portrait screens,
   a card on the right on landscape ones. It scrolls inside; the village never scrolls. */
#placePanel {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; max-height: 55%; overflow: auto; overscroll-behavior: contain;
  touch-action: pan-y; user-select: text; -webkit-user-select: text;
  padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0;
  background: rgba(30, 33, 48, .97); border-top: 1px solid var(--accent); box-shadow: 0 -10px 30px rgba(0, 0, 0, .5);
}
#placePanel > .panel { padding: 0; border: 0; background: none; }
/* Panel header: the title on the left, "Back to the square" (or Close) pinned to the top right, never wrapped below. */
#placePanel > .panel > .phead { flex-wrap: nowrap; align-items: flex-start; }
#placePanel > .panel > .phead > div { flex: 1 1 auto; min-width: 0; }
#placePanel > .panel > .phead > .btn { flex: none; margin-left: auto; }
#placePanel .phead h2 { font-size: 1.6rem; }
#placePanel .forge, #placePanel .homeGrid { grid-template-columns: minmax(0, 1fr); }
@media (min-aspect-ratio: 1/1) {
  #placePanel {
    left: auto; top: 60px; right: 10px; bottom: 10px; width: min(460px, 46%); max-height: none;
    border-radius: 16px; border: 1px solid var(--accent); padding: 14px 16px 16px;
  }
}
/* The dock: your warband and skills, bottom-left. Hidden under an open bottom sheet. */
.dock { position: absolute; z-index: 3; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
.dock button {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 5px 14px 5px 6px; cursor: pointer;
  border-radius: 999px; border: 1px solid var(--line); background: rgba(22, 25, 37, .88); backdrop-filter: blur(3px);
  color: var(--fg); font: inherit; font-weight: 800; font-size: .92rem;
}
.dock button:hover, .dock button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.dock .faces { display: flex; }
.dock .faces span { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; position: relative; background: var(--panel-2); border: 1px solid var(--line); }
.dock .faces span + span { margin-left: -10px; }
.dock .faces img, .dock .faces svg { position: absolute; width: 170%; height: 170%; left: -35%; top: -12%; max-width: none; }
.dock .sic { width: 30px; height: 30px; }
/* Narrow phones: the dock's three buttons go icon-only (faces, skill icon, scroll) so they fit across. */
@media (max-width: 480px) {
  .dock { gap: 6px; }
  .dock .lbl { display: none; }
  .dock button { padding: 5px 9px 5px 6px; gap: 6px; }
}
.dock .badge { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .74rem; line-height: 20px; text-align: center; }
.town.sheetOpen .dock { display: none; }
/* Battle: bottom-right of the village, opposite the dock. Opens a menu of the three ways to fight;
   each one walks you to that building. Hidden under any open sheet. */
.battleDock { position: absolute; z-index: 3; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: grid; justify-items: end; gap: 8px; }
.battleBtn {
  display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 18px 6px 14px; cursor: pointer;
  border-radius: 999px; border: 2px solid #2a1a05; background: linear-gradient(#f3bd62, var(--accent) 55%, #c9822f);
  color: var(--accent-ink); font: inherit; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: .02em;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.battleBtn svg { width: 24px; height: 24px; }
.battleBtn:hover, .battleBtn[aria-expanded="true"] { filter: brightness(1.08); }
.battleMenu {
  display: grid; gap: 6px; width: 170px; padding: 8px; border-radius: 14px;
  border: 1px solid var(--accent); background: rgba(22, 25, 37, .96); box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
}
.battleMenu[hidden] { display: none; }
.battleMenu button {
  display: grid; gap: 1px; text-align: left; padding: 9px 12px; cursor: pointer; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font: inherit;
}
.battleMenu button:hover, .battleMenu button:focus-visible { border-color: var(--accent); outline: none; }
.battleMenu b { font-family: var(--font-display); font-size: 1.15rem; color: var(--accent); }
.town.sheetOpen .battleDock { display: none; }
/* Narrow phones: a round Battle button so it sits clear of the dock. */
@media (max-width: 480px) {
  .battleBtn { flex-direction: column; justify-content: center; gap: 0; width: 62px; height: 62px; min-height: 0; padding: 0; border-radius: 50%; font-size: .78rem; }
  .battleBtn svg { width: 26px; height: 26px; }
}
@media (min-aspect-ratio: 1/1) { .town.sheetOpen .dock { display: flex; } }
.bld { cursor: pointer; transition: filter .2s; outline: none; }
.bld:hover, .bld:focus-visible, .bld.open { filter: brightness(1.22) drop-shadow(0 0 8px rgba(232, 165, 72, .55)); }
.sign rect { fill: rgba(22, 25, 37, .88); stroke: var(--line); stroke-width: 1.5; }
.sign text { fill: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 28px; text-anchor: middle; }
.bld:hover .sign rect, .bld:focus-visible .sign rect, .bld.open .sign rect { stroke: var(--accent); stroke-width: 2.5; }
.bld:hover .sign text, .bld:focus-visible .sign text, .bld.open .sign text { fill: var(--accent); }
.smoke { transform-box: fill-box; transform-origin: center; animation: smoke 5.1s linear infinite; }
@keyframes smoke { from { transform: translate(0, 0) scale(.6); opacity: .6; } to { transform: translate(24px, -84px) scale(1.9); opacity: 0; } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .45s ease-in-out infinite alternate; }
@keyframes flick { to { transform: scaleY(.8) scaleX(1.06); } }
.glow { animation: glowPulse 2.4s ease-in-out infinite; }
.lit { animation: glowPulse 4.5s ease-in-out infinite; }
@keyframes glowPulse { 50% { opacity: .55; } }
.ember { transform-box: fill-box; animation: ember 9s linear infinite; }
@keyframes ember { from { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } to { transform: translate(40px, -420px); opacity: 0; } }
.flag { transform-box: fill-box; transform-origin: 0 50%; animation: flag 2.2s ease-in-out infinite alternate; }
@keyframes flag { to { transform: skewY(8deg) scaleX(.85); } }
.plume { transform-box: fill-box; transform-origin: center; animation: plume 16s ease-in-out infinite alternate; }
@keyframes plume { to { transform: translateX(30px) scale(1.12); } }
.swing { animation: swing 3s ease-in-out infinite alternate; }
.ferris { animation: ferris 40s linear infinite; }
.mill { animation: ferris 24s linear infinite; }
/* Bounty Board: pinned parchment notices */
.notices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 6px 2px; }
.notice {
  position: relative; display: grid; gap: 6px; align-content: start; padding: 16px 14px 12px; border-radius: 3px;
  background: #e9dcc0; color: #2a1f18; transform: rotate(var(--r, 0deg)); box-shadow: 0 6px 14px rgba(0, 0, 0, .4);
}
.notice .pin { position: absolute; top: 6px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #c0303f; box-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.notice .nk { margin: 0; font-family: var(--font-display); font-size: 1.15rem; color: #7a1a22; }
.notice .nt { margin: 0; font-weight: 700; font-size: .95rem; line-height: 1.3; }
.notice .nbar { height: 7px; border-radius: 4px; background: #c8b48c; overflow: hidden; }
.notice .nbar i { display: block; height: 100%; background: #7a5a3a; }
.notice.ready .nbar i { background: #3f7a4f; }
.notice .nfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.notice .note { color: #5a4a3a; }
.notice.paid { opacity: .55; }
.notice .soon { color: #5a4a3a; border-color: #8a7048; }
/* Carnival booth: a game draws itself inside .boothHost */
.soon { font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; border: 1px dashed var(--line); border-radius: 999px; }
.booth { display: grid; gap: 10px; }
.boothHost { min-height: 260px; padding: 12px; border-radius: 12px; border: 1px dashed var(--accent); background: var(--panel-2); }
@keyframes ferris { to { transform: rotate(360deg); } }
@keyframes swing { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
/* Your warband stands around the fire in the square. */
.townies { position: absolute; inset: 0; pointer-events: none; }
.townie { position: absolute; width: 2.6%; aspect-ratio: 1; transform: translate(-50%, -94%); }
.townie > div { width: 100%; height: 100%; animation: townIdle 2.8s ease-in-out infinite; }
/* Night in the village: people are a shade dimmer, like the streets they stand in (tags and quest marks stay bright). */
.townView .npc .bob, .townView .townie > div { filter: brightness(.86) saturate(.92); }
.townie img, .townie svg { width: 100%; height: 100%; display: block; overflow: visible; }
.townie.flip img, .townie.flip svg { transform: scaleX(-1); }
@keyframes townIdle { 50% { transform: translateY(-3%); } }
/* NPCs: keepers stand by their buildings, townsfolk stroll a short lane (--x0 ↔ --x1) and talk when clicked. */
.npcs { position: absolute; inset: 0; pointer-events: none; }
.npc {
  position: absolute; width: 2.6%; aspect-ratio: 1; transform: translate(-50%, -94%); pointer-events: auto;
  padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; outline: none;
}
.npc .face, .npc .bob { width: 100%; height: 100%; }
.npc .bob { animation: townIdle 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
.npc img, .npc svg { width: 100%; height: 100%; display: block; overflow: visible; transition: filter .2s; }
.npc.flip .face { transform: scaleX(-1); }
.npc:hover img, .npc:focus-visible img, .npc:hover svg, .npc:focus-visible svg { filter: brightness(1.25) drop-shadow(0 0 5px rgba(232, 165, 72, .8)); }
.npc .tag {
  position: absolute; left: 50%; bottom: calc(100% - 4px); transform: translateX(-50%); white-space: nowrap;
  padding: 2px 8px; border-radius: 6px; background: rgba(22, 25, 37, .92); border: 1px solid var(--accent);
  font-size: .72rem; font-weight: 800; color: var(--accent); opacity: 0; transition: opacity .15s; pointer-events: none;
}
.npc:hover .tag, .npc:focus-visible .tag { opacity: 1; }
.npc.walker { left: var(--x0); top: var(--y0); animation: stroll var(--dur, 22s) ease-in-out infinite; animation-delay: var(--d, 0s); }
.npc.walker .face { animation: strollFace var(--dur, 22s) step-end infinite; animation-delay: var(--d, 0s); }
.npc.walker:hover, .npc.walker:focus-visible, .npc.walker.talking,
.npc.walker:hover .face, .npc.walker:focus-visible .face, .npc.walker.talking .face { animation-play-state: paused; }
@keyframes stroll { 0%, 10% { left: var(--x0); top: var(--y0); } 45%, 60% { left: var(--x1); top: var(--y1); } 95%, 100% { left: var(--x0); top: var(--y0); } }
@keyframes strollFace { 0% { transform: scaleX(var(--f0)); } 52% { transform: scaleX(var(--f1)); } }
.say {
  position: absolute; z-index: 2; max-width: min(260px, 70%); padding: 8px 11px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
  font-size: .86rem; line-height: 1.35; pointer-events: none;
}
.say strong { display: block; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.say::after {
  content: ''; position: absolute; top: 100%; left: var(--tail, 50%); margin-left: -7px;
  border: 7px solid transparent; border-top-color: var(--accent);
}
/* The keeper greeting you inside a building's panel. */
.keeper { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.keeper .kpic { width: 72px; height: 72px; flex: none; }
.keeper .kpic img, .keeper .kpic svg { width: 100%; height: 100%; display: block; }
.keeper p { margin: 2px 0 0; font-size: 1rem; font-style: italic; }
.keeper small { color: var(--muted); font-size: .76rem; }
.keeper .loot { margin-top: 4px; font-style: normal; font-size: .9rem; }
/* Quests: "!" / "?" over an NPC's head, quest cards in panels and the quest log, buttons in a bubble. */
.npc { container-type: inline-size; }
.qmark {
  position: absolute; left: 50%; z-index: 1; width: 34cqw; min-width: 14px; aspect-ratio: 1; transform: translate(-50%, -100%);
  display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  border: 2px solid #2a1a05; font-weight: 900; font-size: max(10px, 24cqw); line-height: 1; pointer-events: none;
  box-shadow: 0 0 10px rgba(232, 165, 72, .7); animation: qbounce 1.6s ease-in-out infinite;
}
.qmark[hidden] { display: none; }
@keyframes qbounce { 50% { transform: translate(-50%, -125%); } }
.quest { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.quest.offer, .quest.ready { border-color: var(--accent); }
.quest.locked { opacity: .7; border-style: dashed; }
.quest h4 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.quest .ask { margin: 0; font-style: italic; }
.quest .note { margin: 0; }
.quest .btns { margin-top: 4px; }
.qbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 2px; }
.qbar i { display: block; height: 100%; background: var(--accent); }
.qlog { display: grid; gap: 10px; margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.qlog .phead { align-items: baseline; }
.panel .qlog { margin: 0; padding: 0; border: 0; background: none; }
.panel .qlog .phead .label { display: none; }
.qlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.qnews { margin: 0; padding-left: 18px; color: var(--accent); font-weight: 700; font-size: .9rem; }
.say.ask { pointer-events: auto; }
.say .qline { display: block; margin-top: 5px; font-size: .78rem; color: var(--muted); }
.say .qline b { color: var(--fg); }
.say .qline.loot { color: var(--accent); font-weight: 800; font-size: .86rem; }
.say .btns { display: flex; gap: 6px; margin-top: 7px; }
@media (pointer: coarse) { .say .btn { min-height: 40px; padding-inline: 16px; } }

.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
/* Warband and skills sheets. */
.wlist { display: grid; gap: 8px; }
.wcard { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.wcard.you { border-color: var(--accent); }
.wcard .wpic { position: relative; width: 54px; height: 54px; flex: none; }
.wcard .wlvl {
  position: absolute; left: -6px; top: -6px; z-index: 1; padding: 1px 6px; border-radius: 999px;
  background: rgba(12, 14, 22, .92); border: 1px solid var(--line); color: var(--accent);
  font-size: .64rem; font-weight: 800; line-height: 15px; white-space: nowrap;
}
.wcard.you .wlvl { border-color: var(--accent); }
.wcard .wname { flex: 1 1 auto; }
.wcard .wskills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 58%; }
.wcard .wsk { width: 30px; height: 30px; flex: none; }
.wcard .wsk .sic { width: 100%; height: 100%; display: block; }
.wcard .wsk.pas { border-radius: 50%; box-shadow: 0 0 0 1.5px var(--accent); }
.wcard .wchange, .wcard .wswap { flex: none; display: inline-flex; align-items: center; gap: 5px; }
/* Inventory */
.invBtn { display: inline-flex; align-items: center; gap: 5px; }
.invBtn svg { width: 16px; height: 16px; }
#placePanel > .panel > .phead > .btn + .btn { margin-left: 6px; }
@media (max-width: 480px) { .invBtn .lbl { display: none; } }
.invWho { display: flex; gap: 6px; flex-wrap: wrap; }
.invWho button { width: 46px; height: 46px; padding: 3px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
.invWho button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 10px rgba(232, 165, 72, .35); }
.invWho img, .invWho svg { width: 100%; height: 100%; display: block; overflow: visible; }
.invGrid { display: grid; grid-template-columns: minmax(104px, 36%) minmax(0, 1fr); gap: 12px; align-items: start; }
.invChamp { display: grid; justify-items: center; gap: 2px; padding: 10px 8px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); text-align: center; }
.invPic { width: 100%; max-width: 150px; aspect-ratio: 1; }
.invPic img, .invPic svg { width: 100%; height: 100%; display: block; overflow: visible; }
.invChamp b { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.1; }
.invChamp small { color: var(--muted); font-size: .76rem; }
.invStats { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; width: 100%; font-size: .78rem; }
.invStats li { display: flex; justify-content: space-between; gap: 6px; }
.invStats li span { color: var(--muted); }
.invItems { display: grid; gap: 6px; align-content: start; min-width: 0; }
.invItems .label { margin: 4px 0 0; }
.invSlots { display: flex; gap: 8px; }
.islot { display: grid; justify-items: center; gap: 3px; }
.islot small { font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.invBag { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.invBag .note { grid-column: 1 / -1; }
.itile {
  position: relative; display: grid; place-items: center; width: 52px; height: 52px; padding: 6px; cursor: pointer;
  border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
}
.invBag .itile { width: 100%; height: auto; aspect-ratio: 1; }
.itile svg, .itile img { width: 100%; height: 100%; display: block; }
.itile:hover:not(.empty), .itile:focus-visible { border-color: var(--accent); outline: none; background: var(--panel-hi); }
.itile.on { border-color: var(--accent); box-shadow: inset 0 0 10px rgba(232, 165, 72, .25); }
.itile.empty { border-style: dashed; cursor: default; background: none; }
.itile.off { opacity: .4; cursor: not-allowed; }
.itile.loot { cursor: pointer; }
.itile.off { cursor: pointer; }
.itile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(232, 165, 72, .45); opacity: 1; }
.fuseList { display: grid; gap: 8px; }
.fuseRow { display: grid; gap: 6px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
.fuseRow > b { font-size: .9rem; }
.fuseGrades { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fuseCell { display: grid; justify-items: center; gap: 2px; min-width: 76px; }
.fuseCell.none { opacity: .4; }
.fuseCell .sico { width: 34px; height: 34px; }
.fuseCell .sico svg { width: 100%; height: 100%; display: block; }
.fuseCell small { font-size: .68rem; color: var(--muted); font-weight: 700; }
.fuseArrow { color: var(--muted); }
.stoneShop { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
.stoneWare { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
.stoneWare .sico { width: 34px; height: 34px; flex: none; }
.stoneWare .sico svg { width: 100%; height: 100%; display: block; }
.stoneWare .st { flex: 1; min-width: 0; display: grid; }
.stoneWare b { font-size: .88rem; }
.stoneWare small { color: var(--muted); font-size: .72rem; }
.stoneWare .btn { flex: none; }
.invDetail { display: grid; gap: 6px; margin-top: 4px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--accent); background: var(--panel-2); }
.invDetail b { font-family: var(--font-display); font-size: 1.15rem; color: var(--accent); }
.invDetail ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: .86rem; }
.icount { position: absolute; right: -4px; bottom: -4px; min-width: 18px; padding: 0 4px; border-radius: 999px; background: rgba(12, 14, 22, .92); border: 1px solid var(--line); font-size: .66rem; font-weight: 800; line-height: 16px; text-align: center; }
.wcard .wswap svg { width: 15px; height: 15px; }
.wcard .wswap[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
@media (max-width: 480px) { .wcard .wswap .lbl { display: none; } .wcard .wswap { padding: 6px 8px; } }
/* The swap picker under a recruit's card: champion models only, no name boxes (names on hover). */
.wpicker {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; margin: -2px 0 4px;
  padding: 8px; border-radius: 10px; border: 1px dashed var(--accent); background: var(--panel);
}
.wpick { aspect-ratio: 1; padding: 3px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
.wpick:hover, .wpick:focus-visible { border-color: var(--accent); outline: none; background: var(--panel-hi); }
.wpick img, .wpick svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wcard .wchange svg { width: 15px; height: 15px; }
@media (max-width: 480px) { .wcard .wchange .lbl { display: none; } .wcard .wchange { padding: 6px 8px; } }
/* Skills screen: your warband across the top, to pick whose skills you're editing. */
.lwho { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.lwho button {
  display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; cursor: pointer; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font: inherit; font-weight: 800; font-size: .9rem;
}
.lwho button .mini { width: 34px; height: 34px; }
.lwho button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(232, 165, 72, .3); }
.wcard .wpic img, .wcard .wpic svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wcard b { display: block; font-family: var(--font-display); font-size: 1.15rem; line-height: 1.1; }
.wcard small { display: block; color: var(--muted); font-size: .78rem; }
.wcard > span { min-width: 0; }
.sklist { display: grid; gap: 6px; }
.skrow { display: flex; gap: 8px; align-items: center; font-size: .88rem; }
.skrow .sic { width: 28px; height: 28px; flex: none; }
.skrow small { color: var(--muted); }
.skrow.locked { color: var(--muted); font-style: italic; }
.place {
  font: inherit; color: inherit; text-align: left; cursor: pointer; display: grid; gap: 3px; align-content: start;
  padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, background .15s;
}
.place:hover { border-color: var(--accent); background: var(--panel-hi); }
.place em { font-style: normal; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.place strong { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; line-height: 1.1; }
.place span { font-size: .85rem; color: var(--muted); }
.panel { display: grid; gap: 14px; padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--accent); scroll-margin-top: 16px; min-width: 0; }
.phead { display: flex; justify-content: space-between; align-items: start; gap: 8px 16px; flex-wrap: wrap; }
.phead h2 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; }
.flavor { margin: 4px 0 0; color: var(--muted); font-size: .92rem; max-width: 70ch; font-style: italic; }
.note { margin: 0; font-size: .86rem; color: var(--muted); }
.note b { color: var(--accent); }
.note a { color: var(--accent); font-weight: 800; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); }
.stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .75rem; color: var(--muted); }
.teamRow { display: flex; gap: 8px; flex-wrap: wrap; }
.teamRow .mini { width: 56px; height: 56px; }
.tmini { margin: 0; display: grid; justify-items: center; gap: 2px; width: 76px; padding: 6px 4px 5px; border-radius: 12px; border: 1px solid transparent; }
.tmini figcaption { max-width: 100%; text-align: center; font-size: .76rem; font-weight: 800; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tmini small { display: block; font-size: .6rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
/* Your own champion: always framed in gold. */
.tmini.you { border-color: var(--accent); background: radial-gradient(closest-side, rgba(232, 165, 72, .26), transparent 90%), var(--panel-2); box-shadow: 0 0 12px rgba(232, 165, 72, .3); }
.tmini.you figcaption, .tmini.you small { color: var(--accent); }
/* Shops: your champion's tile, with every slot they carry beside it (shopHeroHTML). */
.shopHero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.shopHero .tmini { width: 92px; }
.shopHero .tmini .mini { width: 74px; height: 74px; }
.shopHero .tmini .lv { margin-top: 2px; font-size: .66rem; font-weight: 800; color: var(--fg); }
.shopHero .kit { display: grid; gap: 7px; min-width: 0; }
.shopHero .note { margin: 0; }
.hslots { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 6px; }
.hslot { display: flex; gap: 8px; align-items: center; min-width: 0; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.hslot .ico { width: 34px; height: 34px; flex: none; }
.hslot svg, .satch svg { display: block; width: 100%; height: 100%; }
.hslot .t { display: grid; min-width: 0; }
.hslot small { font-size: .6rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hslot strong { font-size: .84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hslot em { font-style: normal; font-size: .72rem; color: var(--muted); }
.hslot.open { border-style: dashed; background: transparent; }
.hslot.open strong { color: var(--muted); }
.hslot.focus, .satch.focus span:not(.none) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.hslot .gems { display: flex; gap: 3px; margin-top: 2px; }
.hslot .gems i { display: block; width: 16px; height: 16px; }
.satch { display: flex; flex-wrap: wrap; gap: 8px; }
.satch span { position: relative; width: 36px; height: 36px; padding: 3px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.satch span.none { opacity: .4; border-style: dashed; background: transparent; }
.satch b { position: absolute; right: -6px; bottom: -6px; padding: 0 4px; border-radius: 6px; font-size: .62rem; background: var(--panel-hi); border: 1px solid var(--line); }
@media (max-width: 520px) { .shopHero .tmini { width: 80px; } .shopHero .tmini .mini { width: 62px; height: 62px; } }
/* Ironsmith */
.forge { display: grid; gap: 14px; min-width: 0; }
@media (min-width: 860px) { .forge { grid-template-columns: minmax(0, 1fr) minmax(300px, 370px); align-items: start; } }
.heroList { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 6px; }
.hbtn {
  font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 4px 8px 4px 4px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line);
}
.hbtn:hover { border-color: var(--accent); }
.hbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-hi); }
.hbtn .mini { width: 36px; height: 36px; flex: none; }
.hbtn .t { display: grid; min-width: 0; }
.hbtn strong { font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn small { font-size: .7rem; color: var(--muted); }
.hbtn small.forged { color: var(--accent); }
.anvil { display: grid; gap: 12px; padding: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.anvil .pic { width: 84px; height: 84px; flex: none; }
.gear { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.gear .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pips { display: flex; gap: 4px; }
.pips i { width: 16px; height: 6px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--accent); }
/* Market + the satchel in battle */
.wares { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ware { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 3px 12px; align-content: start; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.ware .ico { width: 44px; height: 44px; grid-row: span 2; }
.ware p { margin: 0; font-size: .84rem; color: var(--muted); }
.ware .buy { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.ico svg { width: 100%; height: 100%; display: block; }
/* Your House: the room drawing, then inventory lists in two columns */
.room { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.room svg { display: block; width: 100%; height: auto; }
.homeGrid { display: grid; gap: 14px; }
@media (min-width: 860px) { .homeGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
/* Inside a building the panel is a side column: its own two-column layouts stack. */
.homeGrid section { display: grid; gap: 8px; align-content: start; min-width: 0; }
.invList { display: grid; gap: 6px; }
.inv { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.inv .ico { width: 32px; height: 32px; flex: none; }
.inv .mini { width: 40px; height: 40px; flex: none; }
.inv .t { display: grid; flex: 1 1 160px; min-width: 0; }
.inv .t strong { font-size: .92rem; }
.inv .t small { font-size: .76rem; color: var(--muted); }
.inv .mv { display: flex; flex-wrap: wrap; gap: 6px; }
.trinkets { display: grid; gap: 8px; }
/* The Academy: a strip of faces, the lesson card, the stat chart and the library page */
.pickStrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.pickStrip button { flex: none; width: 46px; height: 46px; padding: 2px; border-radius: 10px; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); }
.pickStrip button[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-hi); box-shadow: 0 0 0 1px var(--accent); }
.pickStrip .mini { display: block; width: 100%; height: 100%; }
.lesson { display: grid; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.lesson .lhead { display: flex; gap: 12px; align-items: center; }
.lesson .lhead .pic { width: 72px; height: 72px; flex: none; }
.lesson .lhead p { margin: 2px 0 0; }
.lesson h4 { margin: 6px 0 0; font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.lesson ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: .9rem; line-height: 1.35; }
.fchip { display: inline-block; padding: 0 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-size: .74rem; font-weight: 800; margin-right: 4px; }
.libskills { list-style: none; padding: 0 !important; }
.libskills li { display: flex; gap: 10px; align-items: flex-start; }
.libskills .lsic { width: 34px; height: 34px; flex: none; }
.libskills .lsic img { width: 100%; height: 100%; }
.libskills p { margin: 2px 0 0; font-size: .84rem; color: var(--muted); }
.tableWrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
.chart { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
.chart th { position: sticky; top: 0; background: var(--panel-2); text-align: left; padding: 0; }
.chart th button { font: inherit; font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: none; border: 0; padding: 8px 6px; cursor: pointer; white-space: nowrap; }
.chart th button[aria-pressed="true"] { color: var(--accent); }

<script>
/* ==================================================================
   FACTIONS & ROLES
   ================================================================== */
const FACTIONS = {
  mech:  { name: 'Ironclad Union',     mechanic: 'Heat',
           rule: 'Every action builds Heat, filling the overheat bar in quarters (25 / 50 / 75 / 100) and adding up to 40% damage. Each quarter sears anyone who closes to melee with it — a melee attacker striking the Mech, or a melee Mech striking home — for 10 / 20 / 30 / 40. Ranged units trade fire from a safe distance and are never seared. At 100 Heat the unit overheats and skips its next turn; Guard vents 50 Heat. Water douses it: a Soaked unit (from Tideborn hits or a Downpour) drops to 0 Heat and cannot build any until the Soaked wears off. A destroyed Ironclad champion leaves a Salvage Bot behind. Machines don\'t bleed: Ironclad units are immune to Bleed.' },
  orc:   { name: 'Bloodtusk Horde',    mechanic: 'Rage',
           rule: 'Deals more damage the more hurt it is, up to +50% near death.' },
  human: { name: 'Kingdom of Aldmere', mechanic: 'Discipline',
           rule: 'Using a different action than last turn adds 15% damage or healing.' },
  stone: { name: 'Stoneleaf Accord',   mechanic: 'Precision & Fortify',
           rule: 'Elves gain +10% crit for each turn they go unhit (max 3). Dwarves gain a Fortify stack each time they are hit, taking 8% less damage per stack (max 3).' },
  tide:  { name: 'The Tideborn',       mechanic: 'Tide',
           rule: 'Every even round is High Tide: +25% damage and healing. Their hits Soak the target, and Soaked targets take 30% more lightning damage.' },
  crimson: { name: 'The Crimson Court', mechanic: 'Bloodthirst',
           rule: 'The Court keeps no mana — it pays in blood. A skill costs 15% of the caster\'s current HP and a ★ signature 20%, and no toll can take their last point: they are left standing on 1 HP at worst. Attack and Guard are free. Every hit drains 20% of the damage dealt as HP, and every attack drinks a further 5% of the victim\'s maximum HP on top of whatever the skill itself steals. The Court has no ranged fighters: four melee and a support who Hexes enemies so they heal for half.' },
  undead: { name: 'The Pale Host',     mechanic: 'Undying',
           rule: 'A fallen Pale Host does not stop. When a blow would end one it keeps its feet, lit by a pale green light and already dead: nothing can heal it, and it stands and fights until one more instance of damage lands — a blow, a tick, anything — and that one is the end. Grave-flesh mends poorly besides, so all healing it takes from spells and potions is halved. Raise one again and the pact holds — it will stand past its death a second time. The dead are in no hurry: the whole Host crosses the speed bar 5% slower. And the dead have no blood to spill: nothing can make the Pale Host Bleed.' },
};
const FACTION_KEYS = Object.keys(FACTIONS);
// "the Bloodtusk Horde", "the Tideborn": names that already start with "The" don't get a second one.
const theFaction = (f, start = false) => `${start ? 'The' : 'the'} ${f.name.replace(/^The /, '')}`;

/* MANA — every champion except Ironclad mechs (they run on Heat) has a mana pool:
   the role's base pool × the faction's multiplier. Skills and ultimates cost mana;
   it regenerates every turn, Attack restores a little and Guard restores more. */
const MANA = {
  pool: { human: 1.5, stone: 1.5, tide: 1, crimson: 0, undead: 1, orc: 0.7, mech: 0 },
  skillCost: 20, skill2Cost: 25, ultCost: 40,   // default costs; a skill can override with o.mp
  poolScale: 0.9,                       // champions' own pool runs 10% leaner (gear and passives add on top, in full)
  spellExtra: 10, healExtra: 20,        // every spell costs 10 MP over its listed price; a healing skill 20 more on top of that
  regen: 6, regenPct: 0.04,             // per turn: 6 + 4% of max mana
  attackGain: 4, guardGain: 15,
  leakPerAction: 12,                    // Mana Leak: MP burned every time the unit acts
};
// HP regen: every champion recovers this share of max HP at the start of each of their turns.
const HP_REGEN_PCT = 0.03;
// Morwenna's Crimson Mend channel: the share of max HP each ally is mended for every tick, and the
// share of her own max HP it costs her to do it. Both ends use the same number (see beginTurn).
const CRIMSON_MEND_PCT = 0.07;
/* THE BLOOD PRICE — the Crimson Court keeps no mana pool (MANA.pool.crimson is 0, as it is for
   the mechs). Instead every skill is paid for in blood, as a share of the caster's CURRENT HP:
   the more they have left, the more a cast costs them. Attack and Guard are always free, and
   bloodCost never takes the last point — a Courtier is left on 1 HP at worst, never killed by
   their own spending. BLOOD_STEAL is the other half of the bargain: on top of Bloodthirst's 20%
   of the damage dealt, every attack drinks this share of the victim's MAXIMUM HP, so even a
   glancing blow on something huge is worth drinking. Both ends are doubled by a Blood Moon. */
const BLOOD_COST = { skill: 0.15, sig: 0.2 };
const BLOOD_STEAL = 0.05;

// What a skill actually costs in MP: its own o.mp (or its tier's default) plus the spell surcharge,
// and the healing surcharge on top for a heal. skillsOf and the Training Yard both read this.
const spellCost = (s, base) => (s.o?.mp ?? base) + MANA.spellExtra + (s.kind === 'heal' ? MANA.healExtra : 0);

const poolLabel = (f) => (MANA.pool[f] === 0
  ? (f === 'crimson' ? 'None, runs on blood' : 'None, runs on Heat')
  : ({ 1.5: 'Huge', 1: 'Normal', 0.7: 'Small' })[MANA.pool[f]]);

/* PROFILE — what the village remembers between visits, saved in this browser:
   gold, forged gear per champion, the satchel of battle items, and your records.
   Gear per champion id: { w: weapon tier, a: armor tier } from the Ironsmith (see FORGE),
   plus wp: the named weapon in their hands, eq: the kit they wear (see THE ARMOR STAND)
   and t: the trinket they wear (see THE ARMORY, EQUIPMENT, TRINKETS).
   Trinket bonuses can plug in here too: { mp, mpRegen, manaSteal, hpRegen }. */
const SAVE_KEY = 'burizza.profile.v1';
// stash = what's kept at Your House ({ items: {key: n}, trinkets: {key: n} }); home = furniture keys you own (see DECOR).
// hero = your one champion { id, name } (null until you create one); level/xp = your champion's progression;
// recruits = the TEAM_SIZE − 1 champion ids the AI plays beside you.
const blankProfile = () => ({ gold: 60, gear: {}, items: {}, quests: {}, stash: { items: {}, trinkets: {}, weapons: {}, equipment: {}, stones: {} }, home: [],
  hero: null, level: 1, xp: 0, recruits: [],
  loadout: null,   // your champion's chosen skills: { act: ['a', 'b'], pas: ['own'] } (see SKILL LOADOUT)
  recruitLoadouts: {},   // skills you chose for recruits, per champion id; a recruit with none auto-picks
  skillRanks: {},  // skill points spent, per champion id: { a: 2, flashpowder: 1 } (see SKILL RANKS)
  training: {},    // drills done, per champion id: { smokebomb: 2, might: 3 } (see THE TRAINING YARD)
  dungeons: {},    // per dungeon id: { clears } (first clear pays a trinket; see DUNGEONS)
  carnival: { plays: 0, won: 0 },   // Carnival records: rounds played, gold won
  bounty: null,                     // today's Bounty Board: { day, list: [bounty…] } (see BOUNTY_TYPES)
  guild: null,     // your guild: { id, favor: { guildId: n } } — favor per guild survives switching (see GUILDS)
  stats: { runs: 0, clears: 0, wins: 0, best: 0, earned: 0 } });
function loadProfile() {
  const p = blankProfile();
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    // stash gains shelves over time (weapons came after trinkets), so merge it rather than replace it.
    if (saved && typeof saved.gold === 'number')
      return { ...p, ...saved, stats: { ...p.stats, ...saved.stats }, stash: { ...p.stash, ...saved.stash } };
  } catch (err) { /* private window or blocked storage: start fresh */ }
  return p;
}

// profile. It must never write over the player's real save, so saving is a no-op here.
let TEST_MODE = false;
function saveProfile() {
  if (TEST_MODE) { renderPurse(); return; }
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(profile)); } catch (err) { /* progress just won't persist */ }

/* PROGRESSION — you are one champion (profile.hero) who levels up for good.
   Recruits are AI-controlled allies who fight beside you at your level.
   Battles pay XP, and so does every killing blow you land yourself (see KILL XP);
   enough XP raises your level, which raises your whole warband's stats. */
const LEVEL_CAP = 30;
const xpToNext = (lv) => 60 + 40 * lv;               // Lv 1→2: 100 XP, 2→3: 140, 3→4: 180 …
const XP_WIN_BASE = 35, XP_WIN_STEP = 10, XP_CLEAR_BONUS = 120, XP_LOSS = 15;
const battleXp = (i) => XP_WIN_BASE + XP_WIN_STEP * i;   // i = battle index in the gauntlet, 0-based
const heroLevel = () => profile.level || 1;
// The public play build (the GitHub Pages mirror friends play on) starts every champion at Lv 10, so a
// first visit already has a full kit to try; a local copy starts at Lv 1 as normal. A save on the
// mirror that is still below it is lifted to it.
const PLAY_MIRROR = /(^|\.)github\.io$/.test(location.hostname);
const START_LEVEL = PLAY_MIRROR ? 10 : 1;
if (profile.hero && heroLevel() < START_LEVEL) { profile.level = START_LEVEL; profile.xp = 0; }
// Champion names show up inside HTML, so markup characters are never allowed in them.
const cleanName = (s) => String(s || '').replace(/[<>&"'`]/g, '').trim().slice(0, 16);
const heroName = () => (profile.hero ? cleanName(profile.hero.name) || shortName(charById(profile.hero.id)) : '');

// Adds XP and applies any level-ups. Returns { xp, from, to } — xp is what was really
// added (the Ember Scholars' perk boosts every battle's XP here, lost ones included),
// so reward screens show the true amount. End-of-battle payouts go through payXp below.
function gainXp(n) {
  n = Math.round(n * (1 + guildPct('xp') / 100));
  const from = heroLevel();
  profile.xp = (profile.xp || 0) + n;
  while (profile.level < LEVEL_CAP && profile.xp >= xpToNext(profile.level)) {
    profile.xp -= xpToNext(profile.level);
    profile.level++;
  }
  return { xp: n, from, to: profile.level };
}

/* Settles a battle's XP: what the fight itself pays, plus everything your champion banked with
   killing blows (see KILL XP). Returns the shape every reward screen reads — `xp` is the real
   total after the guild perk, and `kill` is the kills' share of it. */
function payXp(n) {
  const kill = state.killXp || 0, kills = state.kills || 0;
  state.killXp = 0; state.kills = 0;
  const got = gainXp(n + kill);
  return { ...got, kills, kill: n + kill ? Math.round((got.xp * kill) / (n + kill)) : 0 };
}

/* Warband size: you plus TEAM_SIZE − 1 recruits, and enemy champion bands field the same number.
   Monster packs and boss rooms keep their own sizes — the road was never a fair place. */
const TEAM_SIZE = 4;
const numWord = (n) => ['no', 'one', 'two', 'three', 'four', 'five'][n] || String(n);

// Your warband is always [your champion, then your recruits] once you have a champion.
function syncTeam() {
  if (profile.hero) state.team = [profile.hero.id, ...(profile.recruits || [])].slice(0, TEAM_SIZE);
}

// gearRaw = what's saved ({ w, a, t, wp, eq }). gearOf adds up the weapon in hand (ARMORY), the
// kit worn (EQUIPMENT), the worn trinket's bonus (TRINKETS) and the perks of
// furniture at home (DECOR) for makeUnit: mp, mpRegen, manaSteal, hpRegen, agi, hpPct, atkPct,
// crit, critMult, double, stealMax, stealLost, stealFoe, and the kit's own wards and amplifiers
// (blockPhys, blockMagic, healTaken, magicAmp, physAmp).
const gearRaw = (id) => profile.gear[id] || {};
const addUp = (into, bonus) => { for (const k in bonus) into[k] = (into[k] || 0) + bonus[k]; return into; };
const homePerks = () => profile.home.reduce((sum, k) => addUp(sum, DECOR[k]?.perk || {}), {});
const gearOf = (id) => { const g = gearRaw(id);
  return addUp(addUp(addUp(addUp(addUp({ ...g }, TRINKETS[g.t]?.bonus || {}), weaponBonus(id)), equipBonus(id)),
    socketBonus(id)), homePerks()); };

// 'brim' is never rolled — it is drawn whenever ash is, and hands the sky to the Ash Storm after it.
const SEASON_WEATHER = { clear: 1, ash: 2, storm: 1, rain: 1, sun: 1, mist: 1, moon: 1, pall: 1 };
// Golden Dawn mends this share of max HP as it breaks. Brimstone Fall strikes for this share of
// max HP, then sets everyone Burning for BRIMSTONE_BURN of the HP they have left. Both land once,
// on arrival. Brimstone Fall lasts BRIMSTONE_ROUNDS; every other sky lasts WEATHER_EVERY.
const DAWN_HEAL_PCT = 0.10;
const BRIMSTONE_PCT = 0.10;
const BRIMSTONE_BURN = 0.05;
const BRIMSTONE_ROUNDS = 1;

// Draw the next sky. Drawing an Ash Storm gives you its herald instead: Brimstone Fall comes
// first and newRound hands the sky to the ash after it, so no ash ever arrives unannounced.
function rollWeather(except) {
  const opts = Object.entries(SEASON_WEATHER).filter(([k]) => k !== except);
  const herald = (k) => (k === 'ash' ? 'brim' : k);
  let roll = Math.random() * opts.reduce((s, [, w]) => s + w, 0);
  for (const [k, w] of opts) { roll -= w; if (roll <= 0) return herald(k); }
  return herald(opts[0][0]);
}

// A pack: the depth's elite (if any) plus random monsters from its pool, at most one shaman.
function rollPack(d) {
  const pack = d.elite ? [d.elite] : [];
  while (pack.length < d.size) {
    const id = pick(d.pool);
    if (id === 'glowcap' && pack.includes('glowcap')) continue;

  return pack;
}

/* ==================================================================
   DUNGEONS — expeditions from the Expedition Gate. A run is DG_ROOM_COUNT
   rooms (monster packs) and then a boss room: 7 battles in all. The first
   rooms are the dungeon's own `rooms`; the rest are rolled from the same
   monsters when you set out (state.dg.plan). HP and MP carry over between
   rooms: fallen champions get back up at 30%, and everyone catches their
   breath a little. Each room pays XP and gold; the boss guards a chest,
   and the first clear of each dungeon also gives a trinket.
   Every room fields a full war party of DG_PACK_MIN–DG_PACK_MAX monsters:
   the authored packs are grown to size with extra bodies from the same
   dungeon, never stacking a second healer on a pack that already has one.
   Wounded minions flee: on its turn, a monster whose HP has fallen to a
   fifth (DG_FLEE_AT) runs deeper into the dungeon — the first DG_FLEE_CAP
   to break are the only ones who go, never in the boss room, and each
   monster only once. The warband chases straight into the next room,
   where the runaways rejoin the new pack still wounded.
   Abandoning the run keeps everything earned so far.
   Monsters fight at your level, never below the dungeon's minimum.
   ================================================================== */
/* DUNGEON CONDITIONS — a standing rule for every room of a run. Unlike weather it never
   rotates and never lifts: it is the place itself. Shown on the dungeon's card at the
   Expedition Gate, announced in each room's log, and named in the battle's pill.
   Not every dungeon has one (the Spire, Direhold and the Hollow run plain for now). */
const DG_CONDS = {
  damp: { icon: '💧', name: 'Grave Damp', brief: 'Everyone fights Soaked.',
          desc: 'The water never drained out of the abbey. Everyone counts as Soaked: Ironclad Heat is doused and cannot build, and lightning deals 30% more to the soaked.' },
  gas:  { icon: '🔥', name: 'Firedamp',   brief: 'Burn deals 50% more.',
          desc: 'Gas pools in the old shafts and catches on anything alight. Burn deals 50% more to everyone, yours and theirs alike.' },
  haunt:{ icon: '👻', name: 'Haunting',   brief: 'One fighter per side is Hexed each room.',
          desc: 'The house takes an interest in its guests. At the start of every room one fighter on each side is Hexed: all healing they receive is halved until something cleanses it.' },
};

/* PER-ROOM HAZARDS — Castle Harrowgate's battlefields each keep their own trouble
   (roomConds, one entry per room). Two are schedules rather than hazards:
   'ruincycle' rotates round by round — Earthquake (the cave's bar-jolts), Falling
   Rocks, Red Fog, repeat — and 'ballroom' runs Red Fog, a chandelier crash, Red Fog
   over rounds 1–3, then falls calm for the kill. hazardRound applies each round's
   hazard; hazardPace slows the bar under falling debris (allies 25%, enemies 15% —
   the household knows where not to stand). */
const DG_HAZARDS = {
  redfog:      { icon: '🌫️', name: 'Red Fog', brief: 'The fog works on everyone: each round, 30% to be Poisoned and 20% to be Blinded.' },
  rockfall:    { icon: '⛰️', name: 'Falling Rocks', brief: 'Debris rains: allies cross the bar 25% slower, the household 15%.' },
  chandeliers: { icon: '🕯️', name: 'Falling Chandeliers', brief: 'The fittings are coming down: allies 25% slower, the household 15% — and some of them land.' },
  quakephase:  { icon: '🪨', name: 'Earthquake', brief: 'The columns groan: the whole bar is thrown back a step, again and again.' },
};
const dgRoomCond = () => dungeonRun()?.roomConds?.[state.dg.room] || null;
function dgHazard() {
  const c = dgRoomCond();
  if (!c) return null;
  if (c === 'ruincycle') return ['quakephase', 'rockfall', 'redfog'][(state.round - 1) % 3];
  if (c === 'ballroom') return state.round === 2 ? 'chandeliers' : state.round <= 3 ? 'redfog' : null;
  return c;
}
const hazardIs = (id) => dgHazard() === id;
const hazardPace = (u) => (hazardIs('rockfall') || hazardIs('chandeliers')) ? (u.side === 'p' ? 0.75 : 0.85) : 1;

// A chandelier (or a slab of the ruin) comes down: n random fighters are Stunned for a round.
// The hallway drops them on the warband alone; the Ballroom is impartial — but never the lord.
function crashChandeliers(n, bothSides) {
  const pool = shuffle(allUnits().filter((u) => alive(u) && !u.inert && !u.boss && (bothSides || u.side === 'p')));
  for (const u of pool.slice(0, n)) {
    burst(u, 'smoke');
    float(u, '💥 Chandelier', 'fx');
    addFx(u, 'stun', 1);
    log(`A chandelier comes down on ${u.name}: stunned for a round.`, 'sys');
  }
}

// Applies the room's hazard as each round opens (round 1 comes via applyDgCond).
function hazardRound() {
  const d = dungeonRun();
  if (!d?.roomConds) return;
  const hz = dgHazard();
  // The Ruin Columns' quake round borrows the cave's machinery: state.quake drives the bar jolts.
  state.quake = hz === 'quakephase' ? 1 : 0;
  state.quakeJolt = hz === 'quakephase' ? state.time + QUAKE_EVERY : null;
  if (!hz) return;
  const H = DG_HAZARDS[hz];
  log(`${H.name}: ${H.brief}`, 'wx');
  if (hz === 'redfog') for (const u of allUnits()) {
    if (!alive(u) || u.inert) continue;
    if (chance(0.3)) addFx(u, 'poison', 3, Math.max(3, Math.round(u.maxHp * 0.035)));
    if (chance(0.2)) addFx(u, 'blind', 2);
  }
  if (hz === 'chandeliers' && state.round === 2) crashChandeliers(dgRoomCond() === 'ballroom' ? 3 : 2, dgRoomCond() === 'ballroom');
}

const dungeonById = (id) => DUNGEONS.find((d) => d.id === id);
const DG_REVIVE = 0.3, DG_REST_HP = 0.12, DG_REST_MP = 0.15;  // between rooms (a short breather mid-chase)
const BOSS_ENRAGE_AT = 0.5;                                    // bosses enrage below this share of HP
const DG_XP_MULT = 0.35;                                       // a full 7-battle run is worth about a level and a bit
const DG_ROOM_COUNT = 6;                                       // rooms before the boss room
const DG_PACK_MIN = 4, DG_PACK_MAX = 5;                        // monsters in every normal room
const DG_MAX_FOES = 5;                                         // a pack plus its runaways never tops this
const DG_FLEE_AT = 0.20;                                       // a minion runs once its HP falls to this share or less
const DG_FLEE_CAP = 2;                                         // the first 2 to break and run; nobody else flees that room

// Heroes live in their faction folder; summons in characters/summons/; monsters in characters/monsters/.
function spriteSVG(id) {
  const c = charById(id);
  const folder = c ? ART_FOLDER[c.faction] : MONSTERS[id] ? 'monsters' : 'summons';
  return `<img class="art" src="characters/${folder}/${id}.${ART_EXT}" alt="" data-id="${id}" draggable="false">`;
}
const lookOf = (id) => charById(id)?.look || SUMMONS[id]?.look || MONSTERS[id]?.look;

// Skill icons live in skills/<slug>.svg, named after the skill ("Siren's Hush" → sirens-hush.svg).
// skills/make_icons.py draws them; a missing icon is simply left out.
const skillSlug = (name) => name.toLowerCase().replace(/'/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const skillIcon = (s) => `<img class="sic" src="skills/${skillSlug(s.name)}.svg" alt="" draggable="false">`;

// Missing art file → swap in the built-in placeholder.
document.addEventListener('error', (ev) => {
  const img = ev.target;
  if (img.tagName !== 'IMG') return;
  if (img.classList.contains('art')) img.outerHTML = builtinSprite(img.dataset.id);
  else if (img.classList.contains('npcArt')) img.outerHTML = NPC_FALLBACK;
  else if (img.classList.contains('sic')) img.remove();
  else if (img.classList.contains('anim')) img.remove();   // no clip: the SVG underneath is already showing
}, true);

// An animation clip only takes over from the SVG once it has actually arrived.
document.addEventListener('load', (ev) => {
  const img = ev.target;
  if (img.tagName === 'IMG' && img.classList.contains('anim')) img.parentNode.classList.add('animated');
}, true);

// Village NPCs live in characters/npcs/. A missing file shows a plain hooded villager instead.
const npcArt = (id) => `<img class="npcArt" src="characters/npcs/${id}.${ART_EXT}" alt="" draggable="false">`;
const NPC_FALLBACK = '<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="94" rx="20" ry="3.6" fill="#000" opacity=".35"/><path d="M36 93 L39 52 Q50 44 61 52 L64 93 Z" fill="#5a4a52" stroke="#15121d" stroke-width="1.5"/><circle cx="50" cy="38" r="11" fill="#d9b48f" stroke="#15121d" stroke-width="1.5"/><path d="M38 40 Q38 24 50 24 Q62 24 62 40 Q56 32 50 32 Q44 32 38 40 Z" fill="#4a3a42" stroke="#15121d" stroke-width="1.5"/></svg>';

const spriteCache = {};
function builtinSprite(id) {
  if (spriteCache[id]) return spriteCache[id];
  const a = lookOf(id);
  const b = BODIES[a.body](a);
  const [x, y] = b.hand;
  // The weapon is its own group, pivoting on the hand, so an attack pose can swing it (WEAPON_STRIKES).
  // look.weaponScale grows the weapon about the hand (Barrow's oversized headstone); the outer group still pivots there.
  const wpn = a.weapon && WEAPONS[a.weapon](a, x, y);
  let g = b.svg + (a.weapon ? `<g class="wpn" style="transform-origin:${x}px ${y}px">${a.weaponScale ? `<g transform="translate(${x} ${y}) scale(${a.weaponScale}) translate(${-x} ${-y})">${wpn}</g>` : wpn}</g>` : '');
  if (a.shield) g += `<path d="M29 ${50 + b.shieldY} h17 v14 q0 10 -8.5 13 q-8.5 -3 -8.5 -13 z" fill="${a.shield}" stroke="${a.trim}" stroke-width="2"/>`;
  // An off-hand weapon held where a shield would be (Barrow's second headstone), a little smaller.
  if (a.offhand) {
    const oy = 72 + b.shieldY;
    // Outer group = the animatable one (WEAPON_STRIKES .off), pivoting on the off hand; inner = the fixed scale.
    g += `<g class="wpn2" style="transform-origin:37px ${oy}px"><g transform="translate(37 ${oy}) scale(${a.offhandScale || 0.82}) translate(-37 ${-oy})">${WEAPONS[a.offhand](a, 37, oy, a.offhand === 'headstone' ? 6 : undefined)}</g></g>`;
  }
  if (a.scale) g = `<g transform="translate(50 94) scale(${a.scale}) translate(-50 -94)">${g}</g>`;
  const rx = a.body === 'dwarf' || a.scale ? 18 : 23;
  return (spriteCache[id] = `<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="94" rx="${rx}" ry="3.6" fill="#000" opacity=".35"/>${g}</svg>`);
}

/* ==================================================================
   HELPERS & STATE
   ================================================================== */
const $ = (s) => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Battle playback speed. 1 = original pacing; 1.5 = one-and-a-half times faster (the default),
// 2 = double speed from the speed bar's toggle. Applied to every pause (wait) and the
// battlefield choreography (beat). The speed bar itself always runs at the original 1× pace
// (renderTrack, waitBar). The champions' attack clips are pre-rendered WebP files and always
// play at their own pace.
const SPEEDS = [1.5, 2];
const SPEED_KEY = 'burizza.speed';
let SPEED = (() => { try { const v = +localStorage.getItem(SPEED_KEY); return SPEEDS.includes(v) ? v : 1.5; } catch { return 1.5; } })();
/* Fast forward — once your own champion is down the fight is out of your hands, so a ⏩ appears
   beside the speed toggle and hurries the AI through the rest (FFWD_MULT on top of SPEED).
   It lets go on its own the moment the battle ends or something raises you back up. */
const FFWD_MULT = 3;
let FFWD = false;
const youDown = () => { const y = state?.teams?.p?.find((x) => x.you); return !!y && y.hp <= 0; };
const ffwdOn = () => FFWD && youDown() && !['won', 'lost', 'cleared'].includes(state.phase);
const speedNow = () => SPEED * (ffwdOn() ? FFWD_MULT : 1);
const beat = (ms) => ms / speedNow();
const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 150) : ms / speedNow()));
const waitBar = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 150) : ms / (ffwdOn() ? FFWD_MULT : 1)));   // speed bar: always 1×, except fast-forward
const chance = (p) => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const charById = (id) => ROSTER.find((c) => c.id === id);
const shortName = (c) => c.short || c.name;
const has = (u, id) => u.effects.find((e) => e.id === id);

let state = {
  screen: 'village', team: ['wren', 'aelira', 'maren'], filter: 'all', roleFilter: 'all',
  level: 1, battle: 0, order: [], enemyIds: [], teams: { p: [], e: [] },
  round: 0, queue: [], qi: 0, active: null, phase: 'idle', pending: null, log: [], reward: null, token: 0,
  // Village: the open building, Elder's Hut tab, tavern rumor, Ironsmith's chosen champion,
  // and runPending = a gauntlet paused between battles while you visit the village.
  place: null, codex: 'factions', tip: 0, forgeHero: null, forgeTab: 'anvil', runPending: false, itemUsed: false,
  trainNews: '',   // Training Yard: how this morning's drill went
  // Proving Grounds: today's rival warbands, and the challenge being fought right now.
  duels: [], duel: null,
  // NPCs: what the open building's keeper is saying, and which townsfolk are out today.
  keeperSays: '', keeperLoot: '', folk: [], questNews: [],
};

const allUnits = () => [...state.teams.p, ...state.teams.e];
const unitBy = (uid) => allUnits().find((u) => u.uid === uid);
const alive = (u) => u.hp > 0;
const alliesOf = (u) => state.teams[u.side].filter(alive);
const foesOf = (u) => state.teams[u.side === 'p' ? 'e' : 'p'].filter(alive);
const highTide = () => state.round > 0 && state.round % 2 === 0;
const effAgi = (u) => u.agi * (has(u, 'slow') && !charNat(u).march ? 0.6 : 1);   // Mordrek: nothing holds his march
// Speed along the bar: Agility, plus Elowen's Forest Stride for her whole warband (dodge still uses effAgi).
// The Pale Host shamble: every one of them, summons included, crosses the bar 5% slower.
const PALE_HOST_PACE = 0.95;
const barAgi = (u) => effAgi(u) * (u.faction === 'undead' ? PALE_HOST_PACE : 1) * hazardPace(u)
  * (charNat(u).tiderun && highTide() ? 1.15 : 1)   // Tharos: the flood carries him
  * (1 + Math.max(0, ...alliesOf(u).map((a) => pv(a).haste || 0)));
const wx = () => state.weather || 'clear';
const favored = (u) => WEATHER[wx()].favors === u.faction;
const disciplineBonus = () => (wx() === 'sun' ? 0.3 : 0.15);

const ULT_FIRST_TURN = 3;   // the ★ signature can't be used before the hero's 3rd turn

// The champion's passive (P options), or {} for summons and champions without one.
// Sealed in Mortessa's coffin, a unit has no passives at all: nothing it carries can trigger from
// inside the box (Heroic, Riposte, auras like Forest Stride), until the lid opens again.
const pv = (u) => (has(u, 'coffin') ? {} : u.pv || {});
// The champion's Nature flags (makeUnit copies them from ROSTER's nature entry).
// Monsters and summons have no Nature, so this is {} for them — every check stays cheap.
const charNat = (u) => (u && u.nat) || {};
// Hilda's Deep Foundation raises her Fortify ceiling; everyone else stops at 3.
const stackCap = (u) => charNat(u).stackcap || 3;
// Is a living ally (or enemy) of u carrying passive option key? Used by aura passives.
const allyHas = (u, key, notSelf = false) => alliesOf(u).some((a) => pv(a)[key] && !(notSelf && a === u));
const foeHas = (u, key) => foesOf(u).some((f) => pv(f)[key]);
