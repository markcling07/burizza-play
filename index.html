// Who the shops serve: always your own champion (the Ironsmith, the Armory and the Jeweler sell to nobody else).
const forgeHero = () => profile.hero?.id || state.team[0] || ROSTER[0].id;
const shopNeedsHero = () => (profile.hero ? '' : `<p class="note">The shopkeepers here only serve a champion of your own. Create yours first.</p>
  <div class="btns"><button class="btn primary" type="button" data-k="team">Create your champion</button></div>`);

function forgeUp(slot) {
  const id = forgeHero(), g = { ...gearRaw(id) }, t = g[slot] || 0, cost = FORGE_COST[t];
  if (t >= FORGE_MAX || profile.gold < cost) return false;

  g[slot] = t + 1;
  profile.gear[id] = g;

  return true;
}

// Goes into the satchel; once that's full, it's sent home to the stash. True = a purchase happened.
/* THE WORKSHOP — crafting. Five materials (MATS), kept in profile.mats = { key: count }.
   Where they come from, all through questEvent (craftEvent is called first thing, like bountyEvent):
     'slay' { monster }  each monster killed: 55% chance of its own material (matOf); elites and
                         bosses always drop 2 of it plus 1 more of anything
     'boss'              a dungeon boss falls: 3 more of anything
     'win' { vs }        a gauntlet win against a faction: 1 of anything (hunts and dungeons pay in kills)
     'clear'             the whole gauntlet cleared: 4 of anything
   plus SALVAGE at the Workshop: break a spare weapon, piece of kit or trinket from your stash into parts.
   RECIPES turn materials into things that already exist: satchel ITEMS (into the satchel, or the stash
   when it's full), a Tome of Insight (profile.tomes) and two TRINKETS (into stash.trinkets). */
const MATS = {

};
const MAT_KEYS = Object.keys(MATS);
// Which material a monster leaves, read from its id and name; anything unrecognised drops hide.
const MAT_FROM = [['bone', /bone|crypt|wraith|phantom|banshee|knight|necro|mourn|king|abbot|grave|crone|ghoul/],
  ['ore', /golem|clock|iron|gargoyle|stone|rust|foreman/], ['spore', /glowcap|spore|coven|matron|spider|fung|grotto/],
  ['hide', /bat|crawler|troll|hound|beast|boar|wolf/], ['ember', /magma|ember|ash|cinder|drake|wyrm|imp/]];
const matOf = (id) => { const n = `${id} ${MONSTERS[id]?.name || ''}`.toLowerCase(); return MAT_FROM.find(([, re]) => re.test(n))?.[0] || 'hide'; };
const mats = () => (profile.mats ||= {});
const bagText = (bag) => Object.entries(bag).filter(([, n]) => n).map(([k, n]) => `${n} ${MATS[k].name}`).join(', ');
const matChip = (k, n, short = false) => `<span class="mat${short ? ' short' : ''}" title="${MATS[k].name}"><span class="ico">${MATS[k].icon}</span>${n}</span>`;
function gainMats(bag) { const m = mats(); for (const k in bag) m[k] = (m[k] || 0) + bag[k]; }

function craftEvent(t, info = {}) {
  const bag = {}, add = (k, n = 1) => { bag[k] = (bag[k] || 0) + n; };
  if (t === 'slay' && MONSTERS[info.monster]) {
    const m = MONSTERS[info.monster];
    if (m.elite || m.boss) { add(matOf(info.monster), 2); add(pick(MAT_KEYS)); } else if (chance(.55)) add(matOf(info.monster));
  } else if (t === 'boss') { for (let i = 0; i < 3; i++) add(pick(MAT_KEYS)); }
  else if (t === 'win' && info.vs) add(pick(MAT_KEYS));
  else if (t === 'clear') { for (let i = 0; i < 4; i++) add(pick(MAT_KEYS)); }
  if (!Object.keys(bag).length) return [];
  gainMats(bag);
  saveProfile();
  return [`Materials: +${bagText(bag)}.`];
}

const RECIPES = [

function recipeOut(r) {

// Like buying a satchel item, minus the gold: the satchel first, then the stash.
function stowItem(key) {
  const n = profile.items[key] || 0, m = profile.stash.items[key] || 0;

  return true;
}
function craft(id) {
  const r = RECIPES.find((x) => x.id === id);
  if (!r || !canAfford(r.cost)) return '';
  const o = r.out;
  if (o.item && !stowItem(o.item)) return `No room for another ${ITEMS[o.item].name}: your satchel and stash are full.`;
  if (o.tome) profile.tomes = (profile.tomes || 0) + 1;
  if (o.trinket) profile.stash.trinkets[o.trinket] = (profile.stash.trinkets[o.trinket] || 0) + 1;
  for (const [k, n] of Object.entries(r.cost)) mats()[k] -= n;
  saveProfile();
  return `Crafted: ${recipeOut(r).name}, ${recipeOut(r).where}.`;
}

// Salvage: spare gear from your stash, broken into parts. Pricier pieces give more.
const SALVAGE = {
  weapons:   (k) => ARMORY[k] && { ore: 1 + Math.floor(ARMORY[k].price / 70), ember: 1 },
  equipment: (k) => EQUIPMENT[k] && { hide: 1 + Math.floor(EQUIPMENT[k].price / 60), ore: 1 },
  trinkets:  (k) => TRINKETS[k] && { ember: 1 + Math.floor(TRINKETS[k].price / 80), spore: 1 },
};
function salvage(kind, k) {
  const st = profile.stash[kind], bag = SALVAGE[kind]?.(k);
  if (!st || !(st[k] > 0) || !bag) return '';
  st[k]--;
  gainMats(bag);
  saveProfile();
  return `Broken down: +${bagText(bag)}.`;
}

/* TOME OF INSIGHT — the Market's one rare book. Odo Mott keeps a single copy on the shelf; once
   it is bought he restocks it TOME_RESTOCK_MS later (12 hours, by this device's clock), saved as
   profile.tomeBought. Bought tomes wait at home (profile.tomes) until read, and reading one gives
   your champion TOME.share of what their current level needs to level up (see xpToNext). */
const TOME = { name: 'Tome of Insight', price: 150, share: .5 };
const TOME_RESTOCK_MS = 12 * 60 * 60 * 1000;
const TOME_ICON = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="15" r="13" fill="#ffd28a" opacity=".18"/><path d="M5 8q5-3 11 0v18q-6-3-11 0z" fill="#e9dcc0" stroke="#5a3e28" stroke-width="1.2"/><path d="M27 8q-5-3-11 0v18q6-3 11 0z" fill="#f1ead6" stroke="#5a3e28" stroke-width="1.2"/><path d="M4 9v18q6-3 12 0q6-3 12 0V9" fill="none" stroke="#6e3a86" stroke-width="2.2"/><path d="M8 13h5M8 16h5M19 13h5M19 16h4" stroke="#8a7048" stroke-width="1"/><path d="M21.5 19.5l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z" fill="#e8a548"/></svg>';
const tomeXp = () => Math.round(xpToNext(heroLevel()) * TOME.share);
const tomeRestockIn = () => Math.max(0, (profile.tomeBought || 0) + TOME_RESTOCK_MS - Date.now());
const tomeInStock = () => tomeRestockIn() === 0;
const fmtWait = (ms) => { const m = Math.ceil(ms / 60000), h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };

function buyTome() {
  if (!tomeInStock() || profile.gold < TOME.price) return false;
  profile.gold -= TOME.price;
  profile.tomes = (profile.tomes || 0) + 1;
  profile.tomeBought = Date.now();
  saveProfile();
  return true;
}

// Read one tome. Returns a line for the panel (with any level-up and newly offered quests), or '' if it can't be read.
function readTome() {
  if (!(profile.tomes > 0) || !profile.hero || heroLevel() >= LEVEL_CAP) return '';
  profile.tomes--;
  const r = gainXp(tomeXp());
  if (r.to > r.from) { state.level = r.to; fillNewSlots(r.to); }
  saveProfile();
  const up = r.to > r.from ? ` ${heroName()} reaches level ${r.to}!` : '';
  return [`${heroName()} reads the ${TOME.name}: +${r.xp} XP.${up}`, ...(r.to > r.from ? questsUnlocked(r.from, r.to) : [])].join(' ');
}

// The tome's card, shared by the Market (to buy) and Your House (to read).
function tomeHTML(where) {
  const stock = tomeInStock(), ok = stock && profile.gold >= TOME.price, have = profile.tomes || 0;
  const canRead = have && profile.hero && heroLevel() < LEVEL_CAP;
  const xpLine = profile.hero ? (heroLevel() < LEVEL_CAP ? ` Right now that's <b>${tomeXp()} XP</b> for ${heroName()}.` : ` ${heroName()} is already at the level cap.`) : '';
  const shelf = stock ? '<b>1</b> on the shelf' : `Sold out · restocks in <b>${fmtWait(tomeRestockIn())}</b>`;
  return `<div class="ware tome"><div class="ico">${TOME_ICON}</div><strong>${TOME.name}</strong>
    <p>Read it to gain half a level's worth of XP.${xpLine} Odo gets one copy at a time, and a new one 12 hours after it sells.</p>
    ${state.tomeNews ? `<p class="loot">${state.tomeNews}</p>` : ''}
    <div class="buy"><span class="note">${where === 'market' ? shelf : ''}${have ? `${where === 'market' ? ' · ' : ''}<b>${have}</b> at home` : ''}</span>
      <span class="btns">${where === 'market' ? `<button class="btn small${ok ? ' primary' : ''}" type="button" data-k="tbuy"${ok ? '' : ' disabled'}>${stock ? `Buy for ${TOME.price} gold` : 'Sold out'}</button>` : ''}
        ${have ? `<button class="btn small${where === 'home' ? ' primary' : ''}" type="button" data-k="tread"${canRead ? '' : ' disabled'}>Read one</button>` : ''}</span></div>
  </div>`;
}

function buyItem(key) {
  const it = ITEMS[key], n = profile.items[key] || 0, m = profile.stash.items[key] || 0;
  if ((n >= SATCHEL_MAX && m >= stashCap()) || profile.gold < it.price) return false;
  profile.gold -= it.price;
  if (n < SATCHEL_MAX) profile.items[key] = n + 1;
  else profile.stash.items[key] = m + 1;
  saveProfile();
  return true;
}

/* YOUR HOUSE — the stash (spare items and trinkets) and furniture bought under the

const STASH_BASE = 10, STASH_BIG = 25;   // per item; the Iron-bound Chest raises it
const ownsDecor = (k) => profile.home.includes(k);
const stashCap = () => (ownsDecor('chest') ? STASH_BIG : STASH_BASE);

function buyDecor(k) {
  const d = DECOR[k];
  if (!d || ownsDecor(k) || profile.gold < d.price) return false;
  profile.gold -= d.price;
  profile.home.push(k);
  saveProfile();
  return true;
}

// Satchel ↔ stash, one at a time.
function storeItem(k) {
  const n = profile.items[k] || 0, m = profile.stash.items[k] || 0;
  if (!n || m >= stashCap()) return false;
  profile.items[k] = n - 1; profile.stash.items[k] = m + 1;
  saveProfile();
  return true;
}
function takeItem(k) {
  const n = profile.items[k] || 0, m = profile.stash.items[k] || 0;
  if (!m || n >= SATCHEL_MAX) return false;
  profile.items[k] = n + 1; profile.stash.items[k] = m - 1;
  saveProfile();
  return true;
}

// Put a stashed trinket on a champion; whatever they wore goes back into the stash.
function giveTrinket(k, id) {
  const st = profile.stash.trinkets, g = { ...gearRaw(id) };
  if (!TRINKETS[k] || !charById(id) || !(st[k] > 0) || g.t === k || (TRINKETS[k].mana && !hasMana(id))) return false;
  st[k]--;
  if (g.t) st[g.t] = (st[g.t] || 0) + 1;
  g.t = k;
  profile.gear[id] = g;
  saveProfile();
  return true;
}
/* CARNIVAL — booths for mini-games that pay out gold.
   To add a game, give its booth a play() function:
     play(host, finish)  draws the game inside `host` (an empty <div>) and calls finish(coins)
                         once when the round is over. coins = what the player won (0 is fine).
   The carnival charges `cost` gold up front, pays out min(coins, maxPrize), keeps records in
   profile.carnival, and stops redrawing the booth panel while a game is running.
   A booth without play() shows as "Coming soon". */
const CARNIVAL_GAMES = [
  { id: 'ringtoss', name: 'Ring Toss', cost: 10, maxPrize: 40, pitch: 'Land a ring on a bottle neck. Easy! (It is not easy.)',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 29h16" stroke="#7a5434" stroke-width="3"/><path d="M13 28v-9l2-4v-6h2v6l2 4v9z" fill="#3f7a4f" stroke="#1d2130" stroke-width="1"/><ellipse cx="16" cy="11" rx="7" ry="2.6" fill="none" stroke="#e8a548" stroke-width="2.2"/></svg>' },
  { id: 'knives', name: 'Knife Throw', cost: 15, maxPrize: 60, pitch: 'Three knives, one spinning target. Mind the assistant.',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="15" cy="17" r="11" fill="#e9e4d8" stroke="#c0303f" stroke-width="2"/><circle cx="15" cy="17" r="6.5" fill="none" stroke="#c0303f" stroke-width="2"/><circle cx="15" cy="17" r="2.2" fill="#c0303f"/><path d="M29 3l-12 12" stroke="#c9d1de" stroke-width="2.4"/><path d="M29 3l-3 1 2 2z" fill="#c9d1de"/><path d="M19 13l-2 2" stroke="#6b4f32" stroke-width="3"/></svg>' },
  { id: 'wheel', name: 'Wheel of Ash', cost: 20, maxPrize: 100, pitch: 'Spin the great wheel. Gold, glory, or a face full of soot.',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="15" r="12" fill="#e8a548" stroke="#2a2228" stroke-width="1.4"/><path d="M16 3v24M4 15h24M7.5 6.5l17 17M24.5 6.5l-17 17" stroke="#c0303f" stroke-width="2"/><circle cx="16" cy="15" r="2.5" fill="#2a2228"/><path d="M14 30h4l-2-3z" fill="#2a2228"/></svg>' },
  { id: 'bell', name: "Strongman's Bell", cost: 10, maxPrize: 50, pitch: 'Swing the hammer, ring the bell, impress absolutely everyone.',
    icon: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="14" y="7" width="4" height="22" fill="#7a5434"/><path d="M12 29h8" stroke="#4a3426" stroke-width="3"/><path d="M11 8a5 5 0 0 1 10 0v2H11z" fill="#e8a548" stroke="#b08a2e" stroke-width="1"/><rect x="14.8" y="16" width="2.4" height="5" fill="#c0303f"/><path d="M4 26l6-6" stroke="#6b4f32" stroke-width="2.4"/><rect x="7" y="16" width="7" height="4" rx="1" transform="rotate(45 10 18)" fill="#9aa3b5"/></svg>' },
];
const gameById = (id) => CARNIVAL_GAMES.find((g) => g.id === id);

// Pays the entry fee and opens the booth; the panel then draws #boothHost and runBooth() starts the game.
function startBooth(id) {
  const g = gameById(id);
  if (!g?.play || state.booth || profile.gold < (g.cost || 0)) return false;
  profile.gold -= g.cost || 0;
  profile.carnival.plays++;
  saveProfile();
  state.booth = id;
  state.boothNews = '';
  return true;
}

function runBooth() {
  const g = gameById(state.booth), host = $('#boothHost');
  if (!g || !host) return;
  let over = false;
  g.play(host, (coins) => {
    if (over || state.booth !== g.id) return;   // only the first finish() counts, and only if you're still at the booth
    over = true;
    const prize = clamp(Math.round(coins) || 0, 0, g.maxPrize ?? Infinity);
    profile.gold += prize;
    profile.carnival.won += prize;
    profile.stats.earned += prize;
    saveProfile();
    state.booth = null;
    state.boothNews = prize ? `${g.name}: you won ${prize} gold!` : `${g.name}: no prize this time.`;
    if (prize) keeperReact('carnival');
    render();
  });
}

/* BOUNTY BOARD — three jobs posted each day (local date), paid in gold when claimed.
   profile.bounty = { day: 'YYYY-MM-DD', list: [{ type, n, p, gold, prog, done, claimed }] }
     type = a key of BOUNTY_TYPES, n = how many times it must happen, p = an optional parameter
     (a faction key, a round limit…), prog = progress so far.
   A bounty type is { roll() → { n, p }, gold(b), text(b), count(b, t, info) → how much event t adds }.
   Progress comes from questEvent(t, info), which calls bountyEvent first: 'win' { vs, flawless, rounds, kills },
   'loss' { kills }, 'crit', 'item' { key }, plus any event other systems fire. New bounty kinds
   (monsters, dungeons…) just add a type here and fire their own questEvent. */
const BOUNTY_REROLL = 25;   // gold to have a fresh set posted today
const BOUNTY_TYPES = {
  win:      { roll: () => ({ n: pick([2, 3]) }), gold: (b) => 15 * b.n + 10, text: (b) => `Win ${b.n} battles.`,
              count: (b, t) => (t === 'win' ? 1 : 0) },
  winvs:    { roll: () => ({ n: 1, p: pick(FACTION_KEYS) }), gold: () => 45, text: (b) => `Defeat ${theFaction(FACTIONS[b.p])} in battle.`,
              count: (b, t, i) => (t === 'win' && i.vs === b.p ? 1 : 0) },
  flawless: { roll: () => ({ n: 1 }), gold: () => 60, text: () => 'Win a battle without losing a champion.',
              count: (b, t, i) => (t === 'win' && i.flawless ? 1 : 0) },
  quick:    { roll: () => ({ n: 1, p: pick([4, 5]) }), gold: (b) => (b.p <= 4 ? 70 : 50), text: (b) => `Win a battle within ${b.p} rounds.`,
              count: (b, t, i) => (t === 'win' && i.rounds <= b.p ? 1 : 0) },
  crit:     { roll: () => ({ n: pick([5, 8]) }), gold: (b) => 4 * b.n + 10, text: (b) => `Land ${b.n} critical hits.`,
              count: (b, t) => (t === 'crit' ? 1 : 0) },
  item:     { roll: () => ({ n: pick([2, 3]) }), gold: (b) => 12 * b.n, text: (b) => `Use ${b.n} satchel items in battle.`,
              count: (b, t) => (t === 'item' ? 1 : 0) },
  kill:     { roll: () => ({ n: pick([6, 9]) }), gold: (b) => 5 * b.n, text: (b) => `Defeat ${b.n} enemy champions.`,
              count: (b, t, i) => (t === 'win' || t === 'loss' ? i.kills || 0 : 0) },
  // Emberhollow Cave: slay a kind of monster you can already reach, or win hunts.
  slay:     { roll: () => {
                const lv = heroLevel(), reach = CAVE_DEPTHS.filter((d) => lv >= d.minLv).flatMap((d) => d.pool);
                const p = pick([...new Set(reach)]);
                return { n: ['glowcap', 'bonerattler'].includes(p) ? 3 : 5, p };
              },
              gold: (b) => 8 * b.n + 10, text: (b) => `Slay ${b.n} ${MONSTERS[b.p].plural} in Emberhollow Cave.`,
              count: (b, t, i) => (t === 'slay' && i.monster === b.p ? 1 : 0) },
  hunt:     { roll: () => ({ n: pick([2, 3]) }), gold: (b) => 18 * b.n, text: (b) => `Win ${b.n} hunts in Emberhollow Cave.`,
              count: (b, t) => (t === 'hunt' ? 1 : 0) },
  // Dungeons: only posted once you're strong enough to enter one (see the ok() filter in postBounties).
  delve:    { ok: () => heroLevel() >= DUNGEONS[0].minLv,
              roll: () => ({ n: 1 }), gold: () => 120, text: () => 'Clear a dungeon past the Expedition Gate.',
              count: (b, t, i) => (t === 'dungeon' && i.cleared ? 1 : 0) },
  bossbane: { ok: () => heroLevel() >= DUNGEONS[0].minLv,
              roll: () => ({ n: 1 }), gold: () => 90, text: () => 'Defeat a dungeon boss.',
              count: (b, t) => (t === 'boss' ? 1 : 0) },
};
const enemyKills = () => state.teams.e.filter((u) => !u.summon && !alive(u)).length;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const bountyText = (b) => BOUNTY_TYPES[b.type]?.text(b) ?? 'A job that is no longer posted.';

function postBounties() {
  profile.bounty = {
    day: today(),
    list: shuffle(Object.keys(BOUNTY_TYPES).filter((k) => !BOUNTY_TYPES[k].ok || BOUNTY_TYPES[k].ok())).slice(0, 3).map((type) => {
      const b = { type, ...BOUNTY_TYPES[type].roll(), prog: 0, done: false, claimed: false };
      return { ...b, gold: BOUNTY_TYPES[type].gold(b) };
    }),
  };
  saveProfile();
}
// Today's board, posting a fresh set if the day has changed.
function bountyBoard() {
  if (profile.bounty?.day !== today()) postBounties();
  return profile.bounty;
}

function bountyEvent(t, info = {}) {
  const news = [];
  let moved = false;
  for (const b of bountyBoard().list) {
    const add = !b.done && BOUNTY_TYPES[b.type] ? BOUNTY_TYPES[b.type].count(b, t, info) : 0;
    if (!add) continue;
    b.prog = Math.min(b.n, b.prog + add);
    moved = true;
    if (b.prog >= b.n) { b.done = true; news.push(`Bounty complete: ${bountyText(b)} Claim ${b.gold} gold at the Bounty Board.`); }
  }
  if (moved) saveProfile();
  return news;
}

function claimBounty(i) {
  const b = bountyBoard().list[i];
  if (!b?.done || b.claimed) return false;
  b.claimed = true;
  const pay = guildBountyGold(b.gold);   // the Oathbound take a bigger cut
  profile.gold += pay;
  profile.stats.earned += pay;
  saveProfile();
  return true;
}

function rerollBounties() {
  const cost = guildPct('bounty') ? 0 : BOUNTY_REROLL;   // the Oathbound get fresh postings for free
  if (profile.gold < cost) return false;
  profile.gold -= cost;
  postBounties();
  return true;
}

/* ==================================================================
   GUILDS — the Guild House. You belong to one guild at a time; each
   grants a standing perk that grows with your rank. Favor comes from
   victories (+1, +2 for a gauntlet clear or dungeon boss) and is
   remembered per guild, so switching back picks up where you left.
   ================================================================== */
const GUILDS = {
  purse:    { name: 'The Gilded Purse',  color: '#e8a548', motto: 'Contracts, cuts and coin.',
              perk: 'gold',   desc: (pct) => `Victories pay ${pct}% more gold — arena, duels, hunts and dungeon rooms.` },
  scholars: { name: 'The Ember Scholars', color: '#7fb5e6', motto: 'Every scar is a lesson.',
              perk: 'xp',     desc: (pct) => `Battles teach ${pct}% more XP, even lost ones.` },
  oath:     { name: 'The Oathbound',      color: '#6cc28a', motto: 'The job is the oath.',
              perk: 'bounty', desc: (pct) => `Bounty jobs pay ${pct}% more, and Holt posts fresh jobs for free.` },
};
const GUILD_RANKS = [
  { name: 'Initiate',       at: 0,  pct: 10 },
  { name: 'Journeyman',     at: 10, pct: 15 },
  { name: 'Veteran',        at: 25, pct: 20 },
  { name: 'Guild Champion', at: 50, pct: 25 },
];
const GUILD_SWITCH_COST = 50;
const myGuild = () => (profile.guild?.id ? GUILDS[profile.guild.id] : null);
const guildFavor = (id = profile.guild?.id) => profile.guild?.favor?.[id] || 0;
const guildRankIdx = (favor = guildFavor()) => GUILD_RANKS.reduce((r, x, i) => (favor >= x.at ? i : r), 0);
// The perk percentage you enjoy for `perk`, or 0 if your guild doesn't grant it.
const guildPct = (perk) => (myGuild()?.perk === perk ? GUILD_RANKS[guildRankIdx()].pct : 0);
const guildGold = (n) => Math.round(n * (1 + guildPct('gold') / 100));
const guildBountyGold = (n) => Math.round(n * (1 + guildPct('bounty') / 100));

// A victory's favor. Returns news lines for the battle log and reward screen.
function guildWin(big = false) {
  const g = myGuild();
  if (!g) return [];
  const id = profile.guild.id, gain = 1 + (big ? 1 : 0);
  const before = guildRankIdx();
  profile.guild.favor = profile.guild.favor || {};
  profile.guild.favor[id] = (profile.guild.favor[id] || 0) + gain;
  const after = guildRankIdx();
  return after > before
    ? [`+${gain} favor. You rise to ${GUILD_RANKS[after].name} of ${g.name}!`]
    : [`+${gain} favor with ${g.name}.`];
}

function joinGuild(id) {
  if (!GUILDS[id] || profile.guild?.id === id) return false;
  const first = !profile.guild?.id;
  if (!first && profile.gold < GUILD_SWITCH_COST) return false;
  if (!first) profile.gold -= GUILD_SWITCH_COST;
  profile.guild = { id, favor: { ...(profile.guild?.favor || {}) } };
  saveProfile();
  return true;
}

function unequipTrinket(id) {
  const g = { ...gearRaw(id) };
  if (!g.t) return false;
  profile.stash.trinkets[g.t] = (profile.stash.trinkets[g.t] || 0) + 1;
  delete g.t;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

const hasMana = (id) => !!MANA.pool[charById(id).faction];
const trinketRefund = (k) => Math.floor(TRINKETS[k].price / 2);

// A new trinket goes on the champion; the one they wore is sent home to the stash.
function buyTrinket(k) {
  const id = forgeHero(), g = { ...gearRaw(id) }, cost = TRINKETS[k]?.price;
  if (!TRINKETS[k] || g.t === k || (TRINKETS[k].mana && !hasMana(id)) || profile.gold < cost) return false;
  profile.gold -= cost;
  if (g.t) profile.stash.trinkets[g.t] = (profile.stash.trinkets[g.t] || 0) + 1;
  g.t = k;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

function sellTrinket() {
  const id = forgeHero(), g = { ...gearRaw(id) };
  if (!g.t) return false;
  profile.gold += trinketRefund(g.t);
  delete g.t;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

   top of its own damage.

   Two kinds hang on the rack, the same split as the armor stand:
     - Free Company work (faction 'all') - plain, honest steel any champion
       may wield, whatever warband they came from.
     - Faction work - cut for one faction and wielded only by its own
       champions. Each faction's three carry that faction's edge built in,
       picked to suit how it already fights: the Ironclad swing again, the
       Horde drink from a wound, and the Pale Host take back from the grave.

   were already understood by trinkets and furniture (see gearOf).

     double     +N chance the champion's basic Attack strikes twice
     stealMax   every attack drains N of the wielder's max HP

const ARMORY_KEYS = Object.keys(ARMORY);

const wepOf = (id) => ARMORY[gearRaw(id).wp] || null;
// Faction work is wielded only by its own faction; Free Company work by anyone.
// Same shape as fitsKit on the armor stand, so both racks refuse a sale the same way.
const fitsWeapon = (k, id) => {
  const w = ARMORY[k], c = charById(id);
  return !!w && !!c && (w.faction === 'all' || w.faction === c.faction);
};
// What gearOf folds into the unit. A weapon a champion cannot wield gives nothing, so a save
// that still holds one off-faction gets no use out of it before rackIllegalWeapons sweeps it.
function weaponBonus(id) {
  const g = gearRaw(id);
  return g.wp && fitsWeapon(g.wp, id) ? addUp({}, ARMORY[g.wp].bonus) : {};
}
const wepRefund = (k) => Math.floor(ARMORY[k].price / 2);

// Plain English for one bonus object, in the order the rack and the stand read best.
// Shared by weapons (THE ARMORY) and worn kit (THE ARMOR STAND) - one list, one order.
const PCT = (n) => `${Math.round(n * 1000) / 10}%`;
const WEP_TEXT = {

  crit:      (n) => `+${PCT(n)} Critical Chance`,
  critMult:  (n) => `Critical hits deal +${PCT(n)} damage`,
  double:    (n) => `+${PCT(n)} chance to attack twice`,
  stealMax:  (n) => `Every attack drains ${PCT(n)} of your max HP`,
  stealLost: (n) => `Every attack drains ${PCT(n)} of your missing HP`,
  stealFoe:  (n) => `Every attack drains ${PCT(n)} of the target's current HP`,

/* GEM STONES — crafting stones that enhance weapons and kit once socketed (the sockets are built on

   next. A stone id is '<kind>.<grade>' (grade 1 Chipped, 2 Flawless, 3 Perfect), e.g. 'ember.2'.
   They live in profile.stash.stones[id] = count. stoneBonus(id) is the bonus object to fold into a
   champion's gear (gearOf keys, so makeUnit and the battle already read every one of them).
   Stones drop from cave hunts and dungeon chests, and the Jeweler sells Chipped ones. */

  bloodgarnet:{ name: 'Blood Garnet',          color: '#8f1020', key: 'lifesteal',  by: [0.03, 0.05, 0.08] },
  rose:       { name: 'Rose Quartz',           color: '#f29ab8', key: 'healTaken',  by: [0.05, 0.10, 0.15] },
  pearl:      { name: 'Warding Pearl',         color: '#f3efe6', key: 'wardDebuffs',by: [1, 2, 3] },
  citrine:    { name: 'Blessing Citrine',      color: '#e8b22c', key: 'blessBuffs', by: [1, 2, 3] },

const STONE_KINDS = Object.keys(STONES);
const STONE_PRICE = 45;              // a Chipped stone at the Jeweler
const FUSE_COST = [30, 90];          // gold to fuse 3 Chipped → Flawless, 3 Flawless → Perfect
const stoneParts = (id) => { const [k, g] = String(id).split('.'); return [k, Number(g) || 1]; };
const stoneId = (k, g) => `${k}.${g}`;
const stoneName = (id) => { const [k, g] = stoneParts(id); return STONES[k] ? `${STONE_GRADES[g - 1]} ${STONES[k].name}` : ''; };
const stoneBonus = (id) => { const [k, g] = stoneParts(id), d = STONES[k]; return d ? { [d.key]: d.by[g - 1] } : {}; };
const stoneLines = (id) => wepLines(stoneBonus(id));
const stonesHeld = (id) => profile.stash.stones?.[id] || 0;
function addStone(id, n = 1) {
  if (!STONES[stoneParts(id)[0]]) return;
  const st = (profile.stash.stones ||= {});
  st[id] = (st[id] || 0) + n;
}
// A random stone of a grade, for drops.
const rollStone = (g = 1) => stoneId(pick(STONE_KINDS), g);
// Fuse three of a grade into one of the next, for gold. Returns the new stone's id, or null.
function fuseStones(id) {
  const [k, g] = stoneParts(id), cost = FUSE_COST[g - 1];
  if (!STONES[k] || g >= 3 || stonesHeld(id) < 3 || profile.gold < cost) return null;
  profile.gold -= cost;
  profile.stash.stones[id] -= 3;
  if (!profile.stash.stones[id]) delete profile.stash.stones[id];
  const up = stoneId(k, g + 1);
  addStone(up);
  saveProfile();
  return up;
}
function buyStone(k) {
  if (!STONES[k] || profile.gold < STONE_PRICE) return false;
  profile.gold -= STONE_PRICE;
  addStone(stoneId(k, 1));
  saveProfile();
  return true;
}
// The gem itself: the stone's color, cut finer with each grade (rough, faceted, brilliant with a glint).
function stoneIcon(id) {
  const [k, g] = stoneParts(id), d = STONES[k];
  if (!d) return '';
  const c = d.color, edge = 'rgba(12, 10, 16, .75)';
  const shape = g === 1 ? 'M9 13 L15 6 L24 10 L23 22 L12 26 L7 20 Z'
    : g === 2 ? 'M16 4 L26 11 L22 27 L10 27 L6 11 Z'
    : 'M8 12 L12 6 H20 L24 12 L16 28 Z';
  const facets = g === 1 ? '<path d="M15 6 L13 15 L23 22 M13 15 L7 20" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1"/>'
    : g === 2 ? '<path d="M11 13 H21 L18 22 H14 Z M6 11 L11 13 M26 11 L21 13 M10 27 L14 22 M22 27 L18 22" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1"/>'
    : '<path d="M8 12 H24 M12 6 L14 12 L16 28 M20 6 L18 12 L16 28 M14 12 L16 6 L18 12" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1"/>';
  const shine = '<path d="M12 10 L15 8 L14 12 Z" fill="#fff" opacity=".55"/>';
  const glint = g === 3 ? '<path d="M25 4 L26 7 L29 8 L26 9 L25 12 L24 9 L21 8 L24 7 Z" fill="#fff" opacity=".9"/>' : '';
  return `<svg class="stone" viewBox="0 0 32 32" aria-hidden="true"><path d="${shape}" fill="${c}" stroke="${edge}" stroke-width="1.6" stroke-linejoin="round"/>${facets}${shine}${glint}</svg>`;
}
const wepLines = (bonus) => WEP_ORDER.filter((k) => bonus[k]).map((k) => WEP_TEXT[k](bonus[k]));

/* Mana affixes do nothing for a champion with no pool - the Ironclad run on Heat and the Crimson
   Court pays in blood - because gainMp returns early once maxMp is 0. A trinket that is nothing but
   mana is simply refused at the Jeweler, but a weapon carries its damage and the rest of its affixes
   besides, so the rack still sells it and marks only the line that will do nothing in those hands. */
const MANA_AFFIX = new Set(['mp', 'mpRegen', 'manaSteal']);
const affixListHTML = (bonus, id, cls = '') => WEP_ORDER.filter((k) => bonus[k]).map((k) => {
  const dead = MANA_AFFIX.has(k) && !hasMana(id);
  const klass = [cls, dead ? 'dead' : ''].filter(Boolean).join(' ');
  return `<li${klass ? ` class="${klass}"` : ''}>${WEP_TEXT[k](bonus[k])}${dead ? ' \u2014 no use without mana' : ''}</li>`;
}).join('');

/* Weapons were wieldable by anyone until they were cut per faction, so an older save can have
   a champion holding another faction's work. Rather than confiscate it, every such weapon goes
   back on the rack at Your House, where it can be handed to a champion who can actually use it. */
function rackIllegalWeapons() {
  let moved = 0;
  for (const id in profile.gear) {
    const g = profile.gear[id];
    if (!g.wp || fitsWeapon(g.wp, id)) continue;
    profile.stash.weapons[g.wp] = (profile.stash.weapons[g.wp] || 0) + 1;
    popStones(g, 'wp');   // otherwise they would carry over to the next weapon as free stats
    delete g.wp;
    moved++;
  }
  if (moved) saveProfile();
}

// A new weapon goes in the champion's hands; the one they held is sent home to the stash.
function buyWeapon(k) {
  const id = forgeHero(), g = { ...gearRaw(id) }, cost = ARMORY[k]?.price;
  if (!fitsWeapon(k, id) || g.wp === k || profile.gold < cost) return false;
  profile.gold -= cost;
  if (g.wp) profile.stash.weapons[g.wp] = (profile.stash.weapons[g.wp] || 0) + 1;
  popStones(g, 'wp');   // the old weapon's gems come home rather than leaving with it
  g.wp = k;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

function sellWeapon() {
  const id = forgeHero(), g = { ...gearRaw(id) };
  if (!g.wp) return false;
  profile.gold += wepRefund(g.wp);
  popStones(g, 'wp');
  delete g.wp;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

// Out of the stash and into a champion's hands; whatever they held goes back to the stash.
function giveWeapon(k, id) {
  const st = profile.stash.weapons, g = { ...gearRaw(id) };
  if (!fitsWeapon(k, id) || !(st[k] > 0) || g.wp === k) return false;
  st[k]--;
  if (!st[k]) delete st[k];
  if (g.wp) st[g.wp] = (st[g.wp] || 0) + 1;
  popStones(g, 'wp');
  g.wp = k;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

function unequipWeapon(id) {
  const g = { ...gearRaw(id) };
  if (!g.wp) return false;
  profile.stash.weapons[g.wp] = (profile.stash.weapons[g.wp] || 0) + 1;
  popStones(g, 'wp');
  delete g.wp;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

/* Weapon icons reuse the battlefield art recipes (WEAPONS), drawn in each faction's color, so the
   rack shows the same steel the champions actually swing.

   Each recipe draws at a different size and offset around the hand it is given, so an icon that
   simply used the sprite's 100x100 box would sit small and off-center. WEAPON_BOX is the bounding
   box each recipe actually paints when handed (42, 70) — [x, y, width, height] — and wepIcon fits
   a square viewBox around it so every weapon fills its tile. To regenerate after changing the art,
   render a recipe into a <g> and read getBBox(); a look with no entry falls back to the full box. */
const FACTION_INK = { mech: '#7d8aa3', orc: '#6b8f56', human: '#3e5a8c', stone: '#3f7a4f', tide: '#2a7f8f', crimson: '#c0303f', undead: '#6f8f6a' };
const WEAPON_BOX = {
  sword:  [32.1, 34.4, 31.5, 46.2], axe:    [33.1, 35.5, 26.4, 46.5], hammer:   [30.7, 31.0, 29.8, 51.0],
  saw:    [39.0, 57.0, 28.0, 22.0], spear:  [31.5, 24.7, 38.9, 59.4], trident:  [28.9, 21.7, 40.6, 65.7],
  bow:    [36.0, 44.0, 22.0, 50.0], crossbow: [32.0, 56.0, 34.0, 24.0], gun:    [28.0, 60.5, 48.5, 13.0],
  cannon: [36.8, 17.5, 48.4, 28.5], staff:  [33.0, 23.0, 18.0, 59.0], orb:     [39.0, 51.0, 20.0, 20.0],
  pot:    [39.5, 48.0, 13.0, 24.5], fist:   [38.0, 65.0, 15.0, 13.0], rapier:   [33.9, 34.4, 35.1, 44.2],
  dagger: [29.6, 43.5, 32.0, 33.4], wrench: [33.8, 35.8, 31.4, 42.4],
  headstone: [21.2, 38.0, 31.5, 41.1], sling: [36.8, 70.0, 8.8, 21.8], cross: [14.7, 16.6, 60.9, 87.8],
  coffin: [2.8, 20.3, 47.2, 71.5],
};
const ICON_PAD = 1.18;   // a little air around the art so nothing touches the tile edge
function wepIcon(k) {
  const w = ARMORY[k], ink = w.faction === 'all' ? WOOD : FACTION_INK[w.faction], b = WEAPON_BOX[w.look];
  const art = WEAPONS[w.look]({ trim: ink, orb: ink }, 42, 70);
  if (!b) return `<svg viewBox="0 0 100 100" aria-hidden="true">${art}</svg>`;
  const side = Math.max(b[2], b[3]) * ICON_PAD;
  const x = b[0] + b[2] / 2 - side / 2, y = b[1] + b[3] / 2 - side / 2;
  const r = (n) => Math.round(n * 10) / 10;
  return `<svg viewBox="${r(x)} ${r(y)} ${r(side)} ${r(side)}" aria-hidden="true">${art}</svg>`;
}

/* The rack at the Armory: the common rack, then this champion's own faction's work.
   Faction weapons are cut for their own champions, so the other six factions' steel is
   shown when one of theirs is picked rather than greyed out eighteen rows at a time. */
function rackHTML(id) {
  const c = charById(id), held = gearRaw(id).wp;
  const row = (k) => {
    const w = ARMORY[k], on = held === k, ok = profile.gold >= w.price, spare = profile.stash.weapons[k] || 0;
    const btn = on ? `<button class="btn small" type="button" data-k="wsell">Sell back for ${wepRefund(k)} gold</button>`
      : spare ? `<button class="btn small primary" type="button" data-k="wgive:${k}:${id}">Take one from your stash</button>`
      : `<button class="btn small${ok ? ' primary' : ''}" type="button" data-k="wep:${k}"${ok ? '' : ' disabled'}>Buy for ${w.price} gold</button>`;
    return `<div class="ware${on ? ' worn' : ''}"><div class="ico wico">${wepIcon(k)}</div>
      <strong>${w.name}${on ? ' · held' : ''}</strong>
      <p class="note">${w.flavor}</p><ul class="affix">${affixListHTML(w.bonus, id)}</ul>
      <div class="buy"><span class="note">${w.price} gold${spare ? ` · ${spare} in your stash` : ''}${socketsOf(w) ? ` · ${socketsOf(w)} socket${socketsOf(w) === 1 ? '' : 's'}` : ''}</span>${btn}</div></div>`;
  };
  const group = (label, f, own) =>
    `<h4 class="rackHead${own ? ' own' : ''}">${label}</h4>
     <div class="trinkets">${ARMORY_KEYS.filter((k) => ARMORY[k].faction === f).map(row).join('')}</div>`;
  return `<div class="anvil">
    ${socketsHTML(id, 'wp')}
    ${group('Free Company · anyone may wield it', 'all', false)}
    ${group(`${FACTIONS[c.faction].name} · cut for ${shortName(c)}`, c.faction, true)}
  </div>`;
}

    Attack, HP and Defense. The <b>weapon rack</b> at the Armory next door holds named weapons, one per champion, and the
    Armory's <b>armor stand</b> holds worn kit, one piece per champion. Both split the same way: <b>Free Company</b>
    work fits anyone, while a faction's own is cut for its champions alone &mdash; and a faction's three weapons
    carry that faction's edge built into them. The <b>Jeweler</b> sells the one trinket they wear.
    All four stack, and all four count in every battle for that champion only.`],
  ['Where spare gear goes',
   `Replace a weapon, a piece of kit or a trinket and the old one is sent home to Your House rather than sold.
    Weapons wait on the rack there, kit in the chest and trinkets in the stash, and you can hand any of them
    to another champion in your warband for nothing. Selling a piece back at the shop pays half its price.`],
];

/* The stand at the Armory: the common rack, then this champion's own faction's kit.
   Other factions' pieces hang here too, but only their own champions can wear them, so
   they show up when one of theirs is picked rather than greyed out a dozen at a time. */
/* ==================================================================
   SOCKETS - the crafting slots cut into weapons and worn kit, and the
   bench where stones go into them. The stones themselves are GEM STONES
   above; everything here is the hole they sit in.

   Sockets belong to a champion's weapon or kit SLOT, not to the item, because
   gear is stored as a bare key (profile.gear[id].wp = 'oathblade') with no
   instance to hang anything on. So what is set in them lives beside it:

     profile.gear[id].wpStones = ['ember.2', null]   the weapon's sockets
     profile.gear[id].eqStones = [null]              the worn kit's sockets

   When an item leaves that slot - sold, swapped, racked, or swept up by
   rackIllegalWeapons - whatever was set in it is prised out and goes home to
   profile.stash.stones rather than vanishing with it. Nothing is ever destroyed
   by losing track of the thing it was set into.

   How many sockets: the item's own `slots` if it declares one, otherwise a
   count derived from its price, so a piece either side adds later is cut with a
   sensible number instead of silently none. Add `slots: n` to any ARMORY or
   EQUIPMENT entry to override.

   Socketed stats are folded in by socketBonus through gearOf, the same path the
   weapon and the kit already take, so the engine needs to know nothing about
   any of this - a socketed +6% Attack reaches makeUnit indistinguishable from
   one forged into the blade.
   ================================================================== */
const SOCKET_PRICE = [[150, 1], [300, 2]];   // under 150 gold: 1 socket. Under 300: 2. Above that: 3.
const SOCKET_MAX = 3;
const socketsOf = (item) => (item ? item.slots ?? (SOCKET_PRICE.find(([p]) => item.price < p)?.[1] ?? SOCKET_MAX) : 0);

// Prising a stone back out costs gold, by grade - a Perfect stone is a careful job. Putting one in is free.
// A stone that comes out because the item left the slot is NOT a prise and is never charged for.
const PRISE_FEE = [10, 25, 60];   // the stones session's numbers, to sit with its Jeweler and fuse prices
const priseFee = (sid) => PRISE_FEE[(stoneParts(sid)[1] || 1) - 1] ?? PRISE_FEE[0];

// The two socketed slots: where the item key lives, where its stones live, and which map defines it.
const SOCKET_SLOTS = {
  wp: { stones: 'wpStones', label: 'Weapon', items: () => ARMORY, fits: (k, id) => fitsWeapon(k, id) },
  eq: { stones: 'eqStones', label: 'Worn kit', items: () => EQUIPMENT, fits: (k, id) => fitsKit(k, id) },
};
const SOCKET_KEYS = Object.keys(SOCKET_SLOTS);

const looseStones = () => Object.keys(profile.stash.stones || {}).filter((id) => stonesHeld(id) > 0 && stoneName(id));

// The item in a champion's slot, but only if it is really there and they may really use it: an
// off-faction weapon grants nothing (see weaponBonus), so nothing set into it may count either,
// or its sockets would become a way around the faction lock.
function slotItem(id, slot) {
  const S = SOCKET_SLOTS[slot], key = gearRaw(id)[slot];
  if (!key) return null;
  const item = S.items()[key];
  return item && S.fits(key, id) ? item : null;
}

// What is sitting in that slot's sockets, always exactly as long as the item has sockets.
// Anything stale - a stone that no longer exists, or one past the end of a smaller item - reads as empty.
function stonesIn(id, slot) {
  const saved = gearRaw(id)[SOCKET_SLOTS[slot].stones];
  const raw = Array.isArray(saved) ? saved : [];
  return Array.from({ length: socketsOf(slotItem(id, slot)) }, (_, i) => (stoneName(raw[i]) ? raw[i] : null));
}

// Every socketed stat a champion is carrying, for gearOf.
function socketBonus(id) {
  const out = {};
  for (const slot of SOCKET_KEYS) for (const sid of stonesIn(id, slot)) if (sid) addUp(out, stoneBonus(sid));
  return out;
}

// Prise everything out of a slot and send it home, free of charge. Called wherever an item
// leaves that slot, so stones are never stranded in a socket that no longer has an item in it.
// Takes the gear object being edited, so it composes with buy/sell/give/unequip and the sweep.
function popStones(g, slot) {
  const field = SOCKET_SLOTS[slot].stones;
  for (const sid of g[field] || []) if (sid) addStone(sid);
  delete g[field];
}

// Set a stone into an empty socket. Free, and a filled socket must be prised out first.
function setStone(id, slot, i, sid) {
  if (!stoneName(sid) || stonesHeld(sid) < 1) return false;
  const stones = stonesIn(id, slot);
  if (i < 0 || i >= stones.length || stones[i]) return false;
  profile.stash.stones[sid]--;
  if (!profile.stash.stones[sid]) delete profile.stash.stones[sid];
  stones[i] = sid;
  profile.gear[id] = { ...gearRaw(id), [SOCKET_SLOTS[slot].stones]: stones };
  saveProfile();
  return true;
}

// Take one back out for the fee. It goes to the stash whole, never nowhere.
function priseStone(id, slot, i) {
  const stones = stonesIn(id, slot), sid = stones[i];
  if (!sid) return false;
  const fee = priseFee(sid);
  if (profile.gold < fee) return false;
  profile.gold -= fee;
  stones[i] = null;
  profile.gear[id] = { ...gearRaw(id), [SOCKET_SLOTS[slot].stones]: stones };
  addStone(sid);   // saves the profile
  saveProfile();
  return true;
}

/* The socket bench, shown under whatever the champion is actually carrying.
   One row per socket: what is set in it and what it costs to take back, or what may go in. */
function socketsHTML(id, slot) {
  const item = slotItem(id, slot);
  if (!item) return '';
  const S = SOCKET_SLOTS[slot], n = socketsOf(item);
  if (!n) return `<p class="note socketNone">${item.name} is cut with no sockets.</p>`;
  const stones = stonesIn(id, slot), loose = looseStones();
  const rows = stones.map((sid, i) => {
    if (sid) {
      const fee = priseFee(sid), can = profile.gold >= fee;
      return `<div class="socket set"><span class="ico">${stoneIcon(sid)}</span>
        <div class="t"><strong>${stoneName(sid)}</strong><small>${stoneLines(sid).join(' · ') || 'No effect'}</small></div>
        <button class="btn small" type="button" data-k="prise:${id}:${slot}:${i}"${can ? '' : ' disabled'}>
          ${can ? `Prise out · ${fee} gold` : `Needs ${fee} gold`}</button></div>`;
    }
    const pick = loose.length
      ? loose.map((s) => `<button class="btn small" type="button" data-k="setstone:${id}:${slot}:${i}:${s}">
          ${stoneName(s)} ×${stonesHeld(s)}</button>`).join('')
      : '<span class="note">No stones in your stash. They drop in the caves and the dungeons, and the Jeweler sells Chipped ones.</span>';
    return `<div class="socket"><span class="ico empty">${emptySocketSVG()}</span>
      <div class="t"><strong>Empty socket</strong><small>Setting a stone is free.</small></div>
      <div class="mv">${pick}</div></div>`;
  }).join('');
  const filled = stones.filter(Boolean).length;
  return `<div class="sockets"><p class="label">${S.label} sockets · ${filled}/${n} set</p>${rows}
    <p class="note">A stone comes back out whole for a fee, and anything still set in a piece is returned to your stash for nothing when you part with it.</p></div>`;
}
const emptySocketSVG = () => '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="9" fill="#1b1826" stroke="#4a4458" stroke-width="2" stroke-dasharray="3 2.5"/><circle cx="16" cy="16" r="4" fill="#15121d"/></svg>';

// Your House: the cut stones waiting for a socket, and who in the warband has one free.
function stoneStashHTML() {
  const loose = looseStones();
  if (!loose.length) return '<p class="note">No stones in your stash. Anything you prise out of a piece ends up here.</p>';
  return loose.map((sid) => {
    const open = state.team.filter((id) => SOCKET_KEYS.some((s) => stonesIn(id, s).some((x) => !x)));
    return `<div class="inv"><span class="ico">${stoneIcon(sid)}</span>
      <div class="t"><strong>${stoneName(sid)} ×${stonesHeld(sid)}</strong>
        <small>${stoneLines(sid).join(' · ') || 'No effect'}</small></div>
      <div class="mv"><span class="note">${open.length
        ? `Open sockets: ${open.map((id) => shortName(charById(id))).join(', ')} — set them at the Armory.`
        : 'No open sockets in your warband.'}</span></div></div>`;
  }).join('');
}

function kitHTML(id) {
  const c = charById(id), worn = gearRaw(id).eq;
  const row = (k) => {
    const e = EQUIPMENT[k], on = worn === k, ok = profile.gold >= e.price, spare = profile.stash.equipment[k] || 0;
    const lines = wepLines(e.bonus).map((t) => `<li>${t}</li>`).join('');
    const btn = on ? `<button class="btn small" type="button" data-k="eqsell">Sell back for ${kitRefund(k)} gold</button>`
      : spare ? `<button class="btn small primary" type="button" data-k="eqgive:${k}:${id}">Wear one from your stash</button>`
      : `<button class="btn small${ok ? ' primary' : ''}" type="button" data-k="eqbuy:${k}"${ok ? '' : ' disabled'}>Buy for ${e.price} gold</button>`;
    return `<div class="ware${on ? ' worn' : ''}"><div class="ico wico">${kitIcon(k)}</div>
      <strong>${e.name}${on ? ' · worn' : ''}</strong>
      <p class="note">${e.flavor}</p><ul class="affix">${lines}</ul>
      <div class="buy"><span class="note">${e.price} gold${spare ? ` &middot; ${spare} in your stash` : ''}</span>${btn}</div></div>`;
  };
  const group = (label, f, own) =>
    `<h4 class="rackHead${own ? ' own' : ''}">${label}</h4>
     <div class="trinkets">${EQUIP_KEYS.filter((k) => EQUIPMENT[k].faction === f).map(row).join('')}</div>`;
  return `<div class="anvil">
    ${socketsHTML(id, 'eq')}
    ${group('Free Company &middot; anyone may wear it', 'all', false)}
    ${group(`${FACTIONS[c.faction].name} &middot; cut for ${shortName(c)}`, c.faction, true)}
  </div>`;
}

/* ==================================================================
   RENDERING — shared bits
   ================================================================== */
function log(text, kind) {
  state.log.unshift({ text, kind });
  if (state.log.length > 120) state.log.length = 120;
  const el = $('#log');
  if (el) el.innerHTML = state.log.map((l) => `<li class="${l.kind}">${l.text}</li>`).join('');
}

function bump(u, cls) {
  const el = document.querySelector(`#u-${u.uid} .upic`);
  if (!el) return;
  el.classList.remove('lunge', 'hurt', 'cast');
  void el.offsetWidth;
  el.classList.add(cls);
}

function float(u, text, kind) {
  u.chipsAt = Date.now();   // anything popping over a champion re-shows their chip text for a while
  const host = document.querySelector(`#u-${u.uid} .upic`);
  if (!host) return;
  const el = document.createElement('span');
  el.className = `float ${kind}`;
  el.textContent = text;
  // Stack popups that land in the same instant (damage, lifesteal, MP, status) so they never overlap.
  const stack = host.querySelectorAll('.float').length;
  el.style.marginTop = `${stack * 18}px`;
  el.style.marginLeft = `${Math.round((Math.random() - 0.5) * 16)}px`;
  host.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

function render() {
  $('#villageScreen').hidden = state.screen !== 'village';
  $('#selectScreen').hidden = state.screen !== 'select';
  $('#skillsScreen').hidden = state.screen !== 'skills';
  $('#battleScreen').hidden = state.screen !== 'battle';
  $('#ladder').hidden = state.screen !== 'battle';
  // In the village the page header steps aside: your champion and purse sit on the map's top-right corner.
  const inTown = state.screen === 'village', hud = inTown ? $('#townHud') : $('.topR');
  $('#top').hidden = inTown;
  document.body.classList.toggle('inTown', inTown);
  document.body.dataset.screen = state.screen;
  if ($('#purse').parentElement !== hud) {
    if (inTown) hud.prepend($('#herotag'), $('#purse'));   // the gear stays rightmost
    else hud.append($('#herotag'), $('#purse'));
  }
  renderPurse();
  renderHeroTag();
  if (state.screen === 'village') renderVillage();
  else if (state.screen === 'select') renderSelect();
  else if (state.screen === 'skills') renderSkills();
  else { renderBattle(); syncBloodTethers(); settleLatch(); renderFfwd(); }
}

/* ==================================================================
   RENDERING — Skills screen (your champion's loadout)
   ================================================================== */
const currentLoadout = () => { const c = charById(profile.hero.id); return heroLoadout(c, heroLevel()); };
// The champion the Skills screen is editing: your own, or a recruit picked from the Warband sheet.
const skillsCid = () => (state.skillsFor && state.team.includes(state.skillsFor) ? state.skillsFor : profile.hero.id);

function loadoutCardHTML(c, kind, id, on) {
  const s = kind === 'act' ? activeById(c, id) : passiveById(c, id);
  const r = kind === 'act' ? skillRank(c.id, id) : 0;
  // A technique nobody has drilled yet can't be equipped or ranked — the Training Yard comes first.
  const locked = !canCarry(c, id), drills = drillsDone(c.id, id);
  // Skill points and ranks belong to your own champion; recruits never spend them.
  const canUp = isHeroId(c.id) && kind === 'act' && !locked && skillPoints(c.id) > 0 && r < RANK_CAP;
  const tag = kind === 'act'
    ? (NEUTRAL_SKILLS[id] ? 'Neutral' : id === 'b' ? `★ Signature · from turn ${ULT_FIRST_TURN}` : 'Active')
      // Same tiers skillsOf charges: a is the cheap opener, b the signature, c/d/e/f the rest.
      + (MANA.pool[c.faction] ? ` · ${spellCost(s, id === 'a' ? MANA.skillCost : id === 'b' ? MANA.ultCost : MANA.skill2Cost)} MP` : '')
      // The Court pay in blood instead, as a share of whatever they have left when they cast.
      + (c.faction === 'crimson' && !s.o?.noBlood ? ` · ${Math.round((id === 'b' ? BLOOD_COST.sig : BLOOD_COST.skill) * 100)}% HP` : '')
      + (s.cd ? ` · cooldown ${s.cd}` : '')
      + (r ? ` · Rank ${r}/${RANK_CAP}` : '')
      // Worn kit wards physical and magic separately, so a damage skill says which it is.
      + (s.kind === 'damage' && isMagic(s.o) ? ` · Magic` : '')
    : id === 'own' ? `${shortName(c)}'s passive` : altIndex(id) >= 0 ? `${shortName(c)}'s other passive` : isHeroId(c.id) ? 'Learned passive' : 'General passive';
  const rkrow = r || canUp ? `<span class="rkrow">
      ${r ? `<span class="rkd">Rank ${r}: ${rankBonusText(s, r)}</span>` : ''}
      ${canUp ? `<span class="rkup" role="button" tabindex="0" data-rank="${id}" aria-label="Spend a skill point: raise ${s.name} to rank ${r + 1}">+1 Rank</span>` : ''}
    </span>` : '';
  return `<button class="lcard${on ? ' on' : ''}${locked ? ' locked' : ''}" type="button" data-sk="${kind}:${id}" aria-pressed="${on}">
    <span class="lic">${skillIcon(s)}</span>
    <span class="lt"><b>${s.name}</b><small>${locked ? `${tag} · untrained` : tag}</small><span class="ld">${s.desc}</span>${rkrow}</span>
    <span class="lstate">${locked ? `Train ${drills}/${trainNeed(id)}` : on ? 'Equipped' : 'Equip'}</span>
  </button>`;
}

// Slot row: equipped skills, empty slots you can fill, and slots that unlock at a later level.
function slotRowHTML(c, kind, ids) {
  const lv = heroLevel(), open = kind === 'act' ? activeSlots(lv) : passiveSlots(lv);
  const later = SLOT_UNLOCKS.filter((s) => s.kind === kind && s.lv > lv);
  const cells = [];
  for (let i = 0; i < open; i++) {
    const id = ids[i];
    const s = id ? (kind === 'act' ? activeById(c, id) : passiveById(c, id)) : null;
    cells.push(s ? `<div class="lslot filled">${skillIcon(s)}<span>${s.name}</span></div>` : '<div class="lslot empty"><span>Empty slot</span></div>');
  }
  for (const s of later) cells.push(`<div class="lslot locked"><span>Unlocks at level ${s.lv}</span></div>`);
  return `<div class="lslots">${cells.join('')}</div>`;
}

function renderSkills() {
  if (!profile.hero) { state.screen = 'select'; return render(); }
  const cid = skillsCid(), mine = isHeroId(cid);
  const c = charById(cid), lv = heroLevel(), lo = loadoutFor(c, lv), who = mine ? heroName() : c.name;
  $('#tagline').textContent = `Season 1: Ashfall Road. Choose the skills ${who} brings into battle.`;
  const pts = skillPoints(c.id);
  $('#skillsInfo').textContent = `${mine ? `${heroName()} · ${c.name}` : `${c.name} · recruit`} · level ${lv}. ${activeSlots(lv)} active and ${passiveSlots(lv)} passive slot${passiveSlots(lv) === 1 ? '' : 's'}. Attack and Guard are always available.`
    + (mine ? ` Skill points: ${pts}${pts ? ' — spend them below with +1 Rank (+8% power each)' : ' — every level-up grants one'}.`
      : savedLoadoutOf(cid) ? ' You chose these skills; "Use recommended" hands the choice back to them.' : ' They pick their own skills until you choose some.');
  // Your warband across the top: tap a champion to edit their skills.
  const whoRow = `<div class="lwho" role="group" aria-label="Whose skills">${state.team.map((id, i) =>
    `<button type="button" data-who="${id}" aria-pressed="${id === cid}"><span class="mini">${spriteSVG(id)}</span>
      <span>${i === 0 ? heroName() : shortName(charById(id))}</span></button>`).join('')}</div>`;
  $('#skillsBody').innerHTML = `${whoRow}
    <section class="lsec">
      <header><h2>Active skills</h2><p class="rule">Click a skill to equip or unequip it. More slots open at levels ${SLOT_UNLOCKS.filter((s) => s.kind === 'act').map((s) => s.lv).join(' and ')}.</p></header>
      ${slotRowHTML(c, 'act', lo.act)}
      <div class="lpool">${activeIdsOf(c).map((id) => loadoutCardHTML(c, 'act', id, lo.act.includes(id))).join('')}</div>
    </section>
    ${mine ? `<section class="lsec">
      <header><h2>Neutral skills</h2><p class="rule">Tricks any champion can learn, whatever their class. They share your active slots. Drill them at the Training Yard before you can carry them.</p></header>
      <div class="lpool">${NEUTRAL_KEYS.map((id) => loadoutCardHTML(c, 'act', id, lo.act.includes(id))).join('')}</div>
    </section>` : ''}
    <section class="lsec">
      <header><h2>Passives</h2><p class="rule">${mine ? "Your champion's own passive, or a learned one from the Training Yard." : `${shortName(c)}'s own passive, or one of the general passives.`} A second passive slot opens at level ${SLOT_UNLOCKS.find((s) => s.kind === 'pas').lv}.</p></header>
      ${slotRowHTML(c, 'pas', lo.pas)}
      <div class="lpool">${passivePool(c).map((id) => loadoutCardHTML(c, 'pas', id, lo.pas.includes(id))).join('')}</div>
    </section>`;
}

function toggleLoadout(kind, id) {
  const cid = skillsCid(), c = charById(cid), mine = isHeroId(cid);
  const lv = heroLevel(), lo = loadoutFor(c, lv), list = lo[kind];
  const max = kind === 'act' ? activeSlots(lv) : passiveSlots(lv);
  $('#skillsNote').textContent = '';
  if (!canCarry(c, id)) {
    const left = trainNeed(id) - drillsDone(cid, id);
    $('#skillsNote').textContent = `${heroName()} has not learned that yet — ${left} more drill${left === 1 ? '' : 's'} at the Training Yard.`;
    return;
  }
  const i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1);
  else if (list.length < max) list.push(id);
  else { $('#skillsNote').textContent = `All ${kind === 'act' ? 'active' : 'passive'} slots are full. Unequip one first.`; return; }
  if (mine) profile.loadout = lo;
  else (profile.recruitLoadouts ||= {})[cid] = lo;
  saveProfile();
  renderSkills();
}

function buildSkills() {
  $('#skillsBody').addEventListener('click', (ev) => {
    // The +1 Rank chip sits inside the card button: spend the point, don't toggle the slot.
    const up = ev.target.closest('[data-rank]');
    if (up) {
      const c = charById(profile.hero.id), id = up.dataset.rank;
      rankUp(id);
      const s = activeById(c, id), r = skillRank(c.id, id), left = skillPoints(c.id);
      $('#skillsNote').textContent = `${s.name} is now rank ${r} — ${rankBonusText(s, r)}. ${left} skill point${left === 1 ? '' : 's'} left.`;
      renderSkills();
      return;
    }
    // The warband row: switch whose skills you're editing.
    const w = ev.target.closest('[data-who]');
    if (w) { state.skillsFor = w.dataset.who; $('#skillsNote').textContent = ''; renderSkills(); return; }
    const b = ev.target.closest('[data-sk]');
    if (!b) return;
    const [kind, id] = b.dataset.sk.split(':');
    toggleLoadout(kind, id);
  });
  // The chip is a span inside a button, so Enter/Space need a hand to act like a click.
  $('#skillsBody').addEventListener('keydown', (ev) => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('[data-rank]')) {
      ev.preventDefault();
      ev.target.click();
    }
  });
  // Back: to the Warband sheet if that's where you came from, otherwise to the Arena.
  $('#skillsBack').addEventListener('click', () => {
    const fromBand = state.skillsFrom === 'warband';
    state.skillsFrom = null;
    toVillage();
    if (fromBand) { state.place = null; state.sheet = 'warband'; render(); } else openPlace('arena');
  });
  $('#skillsAuto').addEventListener('click', () => {
    const cid = skillsCid();
    if (isHeroId(cid)) profile.loadout = autoLoadout(charById(cid), heroLevel());
    else if (profile.recruitLoadouts) delete profile.recruitLoadouts[cid];   // a recruit goes back to picking their own
    saveProfile();
    $('#skillsNote').textContent = '';
    renderSkills();
  });
}

// Your champion in the header: portrait, name, level and XP progress. Hidden until you create one.
function renderHeroTag() {
  const el = $('#herotag');
  el.hidden = !profile.hero;
  if (!profile.hero) return;
  const key = `${profile.hero.id}|${heroName()}|${heroLevel()}|${profile.xp}`;
  if (el.dataset.k === key) return;
  el.dataset.k = key;
  el.innerHTML = `<span class="hmini">${spriteSVG(profile.hero.id)}</span>
    <span class="hinfo"><b>${heroName()}</b>${xpBarHTML()}</span>`;
}

let shownGold = null;
function renderPurse() {
  const el = $('#purse');
  if (shownGold === profile.gold) return;
  el.innerHTML = `${COIN}<span>${profile.gold}</span>`;
  el.setAttribute('aria-label', `${profile.gold} gold`);
  if (shownGold != null && profile.gold > shownGold) { el.classList.remove('gain'); void el.offsetWidth; el.classList.add('gain'); }
  shownGold = profile.gold;
}

// A tank, for the role filter: any champion whose own kit can Taunt (Bulwark-7, Mogra, Garrick,
// Hilda, Malgrath, Barrow). Role is what they hit with; a taunt is what makes them a wall.
const isTank = (c) => c.skills.some((s) => (s.fx || []).some(([id]) => id === 'taunt'));
const ROLE_FILTERS = [['all', 'All roles'], ['melee', 'Melee'], ['ranged', 'Ranged'], ['support', 'Support'], ['tank', 'Tank']];

function buildSelect() {
  // Every filter in view at once, as an even grid: factions by their short names (Ironclad, Pale Host...)
  // in two rows of four, then the roles in one row. The full faction name is on the button's title.
  const fshort = (n) => n.replace(/^(The|Kingdom of) /, '').replace(/ (Union|Horde|Accord|Court)$/, '');
  $('#filters').innerHTML = `<div class="fgroup" role="group" aria-label="Faction">${[['all', 'All', 'All factions'], ...FACTION_KEYS.map((k) => [k, fshort(FACTIONS[k].name), FACTIONS[k].name])]
    .map(([k, n, full]) => `<button class="fbtn" type="button" data-f="${k}" title="${full}" aria-label="${full}">${n}</button>`).join('')}</div>
    <div class="fgroup roles" role="group" aria-label="Role">${ROLE_FILTERS.map(([k, n]) =>
      `<button class="fbtn rbtn" type="button" data-r="${k}"${k === 'tank' ? ' title="Champions with a taunt in their kit"' : ''}>${n}</button>`).join('')}</div>`;
  $('#filters').addEventListener('click', (ev) => {
    const b = ev.target.closest('.fbtn');
    if (!b) return;
    if (b.dataset.r) state.roleFilter = b.dataset.r;
    else state.filter = b.dataset.f;
    renderSelect();
  });

  // Each faction: its name and a short line (mechanic, favoring weather, mana), then its champions as a
  // roster of tiles. Tapping a tile drops that champion's skills down beneath the roster (pickDetailHTML),
  // with the button that picks them; the faction's full rules live in the mechanics window (the gear).
  $('#factionList').innerHTML = FACTION_KEYS.map((k) => {
    const f = FACTIONS[k];
    const tiles = ROSTER.filter((c) => c.faction === k).map((c) => `
      <button class="pick" type="button" data-id="${c.id}" id="pick-${c.id}" data-role="${c.role}" data-tank="${isTank(c) ? 1 : 0}" aria-expanded="false">
        <div class="pic">${spriteSVG(c.id)}</div>
        <span class="nm">${c.name}</span>
        <span class="badge" hidden></span>
      </button>`).join('');
    return `<section class="faction" data-faction="${k}">
      <header><h2>${f.name}</h2>
        <p class="fmeta"><span>${f.mechanic}</span><span>Favored by ${Object.values(WEATHER).find((w) => w.favors === k).name}</span><span>Mana: ${poolLabel(k)}</span></p></header>
      <div class="roster">${tiles}</div>
      <div class="rdetail" hidden></div>
    </section>`;
  }).join('');

  $('#factionList').addEventListener('click', (ev) => {
    const act = ev.target.closest('[data-pickact]');
    if (act) { togglePick(act.dataset.pickact); return; }
    const b = ev.target.closest('.pick');
    if (b) { state.openPick = state.openPick === b.dataset.id ? null : b.dataset.id; renderSelect(); }
  });
  $('#slots').addEventListener('click', (ev) => {
    const b = ev.target.closest('.slot.filled');
    if (b) togglePick(b.dataset.id);
  });
  // Random recruits: allies covering the roles your champion lacks, then whoever else wants the work.
  $('#randomBtn').addEventListener('click', () => {
    const me = state.team[0];
    if (!me) { $('#trayNote').textContent = 'Pick your own champion first.'; return; }
    const roles = ['melee', 'ranged', 'support'].filter((r) => r !== charById(me).role);
    const team = [me, ...roles.map((r) => pick(ROSTER.filter((c) => c.role === r && c.id !== me)).id)];
    while (team.length < TEAM_SIZE) team.push(pick(ROSTER.filter((c) => !team.includes(c.id))).id);
    state.team = team;
    $('#trayNote').textContent = '';
    renderSelect();
  });
  // Create your champion (first time) or save new recruits, then head to the Arena.
  $('#beginBtn').addEventListener('click', () => {
    const t = state.team;
    if (t.length !== TEAM_SIZE) return;
    if (!profile.hero) {
      const name = cleanName($('#heroName').value) || shortName(charById(t[0]));
      profile.hero = { id: t[0], name };
      profile.level = START_LEVEL;
      profile.xp = 0;
    }
    profile.recruits = t.slice(1);
    grandfatherTraining();
    saveProfile();
    toVillage();
    openPlace('arena');
  });
  // Starting over as a different champion takes two clicks. Level and XP reset; everything else is kept.
  $('#retireBtn').addEventListener('click', () => {
    if (!state.retireArmed) { state.retireArmed = true; renderSelect(); return; }
    state.retireArmed = false;
    state.runPending = false;
    profile.hero = null;
    profile.level = START_LEVEL;
    profile.xp = 0;
    saveProfile();
    state.team = [];
    $('#heroName').value = '';
    renderSelect();
  });
}

// Slot 0 is your champion; the rest are recruits. Your champion can only be swapped while creating.
// The drop-down under a faction's roster (the tile above already shows the model): roles, bio, every skill, passive and nature, and the pick button.
function pickDetailHTML(c) {
  const creating = !profile.hero, t = state.team, i = t.indexOf(c.id);
  const label = i === 0 ? (creating ? 'Choose someone else' : 'This is you')
    : i > 0 ? 'Send home'
    : creating && !t[0] ? 'Choose as your champion'
    : 'Recruit';
  const locked = i === 0 && !creating;
  return `<div class="rdhead">
      <div><b>${c.name}</b><span class="roles"><span class="role ${c.role}">${ROLES[c.role].label}</span>${isTank(c) ? '<span class="role melee" title="Has a taunt in their kit">Tank</span>' : ''}</span>
        <p class="bio">${c.bio}</p></div>
      <button class="btn small${i < 0 ? ' primary' : ''}" type="button" data-pickact="${c.id}"${locked ? ' disabled' : ''}>${label}</button></div>
    <ul class="sk">
      ${[0, 2, 3, 4, ...c.skills.slice(5).map((_, i) => 5 + i)].map((n) => `<li>${skillIcon(c.skills[n])}<span><b>${c.skills[n].name}.</b> ${c.skills[n].desc}</span></li>`).join('')}
      <li>${skillIcon(c.skills[1])}<span><b>★ ${c.skills[1].name}.</b> ${c.skills[1].desc} <i>From turn ${ULT_FIRST_TURN}.</i></span></li>
      <li class="pas">${skillIcon(c.passive)}<span><b>Passive · ${c.passive.name}.</b> ${c.passive.desc}</span></li>
      ${altList(c).map((pa) => `<li class="pas">${skillIcon(pa)}<span><b>Or · ${pa.name}.</b> ${pa.desc}</span></li>`).join('')}
      ${c.nature ? `<li class="pas nat">${skillIcon(c.nature)}<span><b>Nature · ${c.nature.name}.</b> ${c.nature.desc}</span></li>` : ''}
    </ul>`;
}

function togglePick(id) {
  const creating = !profile.hero, t = state.team;
  $('#trayNote').textContent = '';
  if (creating && !t[0]) state.team = [id];
  else if (t[0] === id) {
    if (!creating) { $('#trayNote').textContent = `${heroName()} is you. Use "New champion" to start over as someone else.`; return; }
    state.team = [];
  } else {
    const rec = t.slice(1), i = rec.indexOf(id);
    if (i >= 0) rec.splice(i, 1);
    else if (rec.length < TEAM_SIZE - 1) rec.push(id);
    else { $('#trayNote').textContent = `You already have ${numWord(TEAM_SIZE - 1)} recruits. Click one in the tray to send them home first.`; return; }
    state.team = [t[0], ...rec];
  }
  renderSelect();
}

function renderSelect() {
  const creating = !profile.hero, t = state.team;
  $('#tagline').textContent = creating
    ? `Season 1: Ashfall Road. Choose the champion you will be, give them a name, then recruit ${numWord(TEAM_SIZE - 1)} allies to fight beside you.`
    : `Season 1: Ashfall Road. You play ${heroName()}. Pick ${numWord(TEAM_SIZE - 1)} recruits; the AI fights for them.`;
  const rf = state.roleFilter || 'all';
  document.querySelectorAll('.fbtn').forEach((b) => b.setAttribute('aria-pressed',
    String(b.dataset.r ? b.dataset.r === rf : b.dataset.f === state.filter)));
  // Both filters bite at once: the faction chips hide sections, the role chips hide champions —
  // and a section with nobody left standing steps aside too.
  document.querySelectorAll('.pick').forEach((b) => {
    b.hidden = rf !== 'all' && (rf === 'tank' ? b.dataset.tank !== '1' : b.dataset.role !== rf);
  });
  // With All roles picked, the roster runs without the faction headings (name, mechanic, weather, mana);
  // narrowing to one role brings them back to tell the groups apart.
  $('#factionList').classList.toggle('noHeads', rf === 'all');
  document.querySelectorAll('.faction').forEach((s) => {
    const empty = ![...s.querySelectorAll('.pick')].some((b) => !b.hidden);
    s.hidden = (state.filter !== 'all' && s.dataset.faction !== state.filter) || empty;
    // The open champion's skills drop down under this faction's roster.
    const open = state.openPick && s.querySelector(`.pick[data-id="${state.openPick}"]:not([hidden])`);
    const d = s.querySelector('.rdetail');
    d.hidden = !open;
    d.innerHTML = open ? pickDetailHTML(charById(state.openPick)) : '';
    s.querySelectorAll('.pick').forEach((b) => b.setAttribute('aria-expanded', String(b.dataset.id === state.openPick && !!open)));
  });
  document.querySelectorAll('.pick').forEach((b) => {
    const i = t.indexOf(b.dataset.id);
    b.classList.toggle('sel', i >= 0);
    b.classList.toggle('me', i === 0);
    b.setAttribute('aria-pressed', String(i >= 0));
    const badge = b.querySelector('.badge');
    badge.hidden = i < 0;
    badge.textContent = i === 0 ? '★' : i;
    badge.title = i === 0 ? 'You' : `Recruit ${i}`;
  });

  $('#slots').innerHTML = Array.from({ length: TEAM_SIZE }, (_, i) => {
    const id = t[i];
    if (!id) return `<div class="slot empty${i === 0 ? ' you' : ''}"><span class="ph" aria-hidden="true"></span><small>${i === 0 ? 'You' : `Recruit ${i}`}</small></div>`;
    const c = charById(id);
    const fixed = i === 0 && !creating;
    const name = fixed ? heroName() : shortName(c);
    return `<button class="slot filled${i === 0 ? ' you' : ''}" type="button" data-id="${id}" title="${fixed ? 'This is you' : `Remove ${c.name}`}" aria-label="${i === 0 ? 'You' : `Recruit ${i}`}: ${name}">
      <div class="mini">${spriteSVG(id)}</div>
      <strong>${name}</strong>
    </button>`;
  }).join('');

  $('#nameRow').hidden = !(creating && t[0]);
  if (creating && t[0]) $('#heroName').placeholder = shortName(charById(t[0]));
  $('#retireBtn').hidden = creating;
  $('#retireBtn').textContent = state.retireArmed ? `Click again to retire ${heroName()}` : 'New champion';
  $('#randomBtn').disabled = !t[0];
  $('#beginBtn').textContent = creating ? 'Create champion' : 'Save warband';
  $('#beginBtn').disabled = t.length !== TEAM_SIZE;

  const need = TEAM_SIZE - t.length;
  $('#trayInfo').textContent =
    creating && !t[0] ? 'Step 1: click the champion you want to be. This is who you play and level up.'
    : need > 0 ? `${creating ? 'Step 2: r' : 'R'}ecruit ${need} more all${need === 1 ? 'y' : 'ies'}. The AI plays your recruits in battle, at your level.`
    : creating ? 'Ready. Your champion starts at level 1 and keeps every level they earn.'
    : `${heroName()} · level ${heroLevel()}. Your recruits fight at your level and act on their own.`;
  if (state.retireArmed) $('#trayNote').textContent = `Retiring ${heroName()} resets your level and XP. Gold, gear, items and quests are kept.`;
}

function questsUnlocked(from, to) {
  return QUESTS.filter((q) => q.lv > from && q.lv <= to && questOf(q.from) === q && !questSt(q))
    .map((q) => `New quest at level ${q.lv}: ${q.title}, from ${npcById(q.from).name}.`);
}
const pendingDeliveries = (npcId) => QUESTS.filter((q) => q.goal.t === 'talk' && q.goal.to === npcId && questSt(q)?.s === 'active');

function npcById(id) {
  const place = Object.keys(KEEPERS).find((k) => KEEPERS[k].id === id);
  return place ? { ...KEEPERS[place], place } : { ...TOWNSFOLK[id], id };
}

function goalText(q) {
  const g = q.goal, n = goalN(q), s = n === 1 ? '' : 's';
  if (g.t === 'win' && g.vs) return `Defeat ${theFaction(FACTIONS[g.vs])} in the Arena`;
  if (g.t === 'win' && g.flawless) return 'Win a battle without losing a champion';
  if (g.t === 'win') return `Win ${n} battle${s}`;
  if (g.t === 'clear') return 'Clear the gauntlet';
  if (g.t === 'forge') return `Forge ${n} upgrade${s} at the Ironsmith`;
  if (g.t === 'buy') return `Buy ${n} item${s} at the Market`;
  if (g.t === 'trinket') return `Buy ${n === 1 ? 'a trinket' : `${n} trinkets`} at the Jeweler`;
  if (g.t === 'item' && g.key) return `Use a ${ITEMS[g.key].name} in battle`;
  if (g.t === 'item') return `Use ${n} satchel item${s} in battle`;
  if (g.t === 'talk') { const t = npcById(g.to); return `Speak to ${t.name} at ${PLACES[t.place].name}`; }
  return '';
}
const rewardText = (q) => [q.gold ? `${q.gold} gold` : '', q.item ? `a ${ITEMS[q.item].name}` : ''].filter(Boolean).join(' and ');

// Something happened that quests might care about. Returns news lines for the battle log / victory card.
function questEvent(t, info = {}) {
  if (sparring() && state.screen === 'battle') return [];   // practice doesn't count for anything
  const bountyNews = bountyEvent(t, info);   // the Bounty Board listens to the same events
  const matNews = craftEvent(t, info);        // ...and so does the Workshop (material drops)
  const news = [];
  for (const q of QUESTS) {
    const st = questSt(q), g = q.goal;
    if (st?.s !== 'active' || g.t !== t) continue;
    if ((g.vs && g.vs !== info.vs) || (g.key && g.key !== info.key) || (g.flawless && !info.flawless) || (g.to && g.to !== info.to)) continue;
    st.n = Math.min(goalN(q), st.n + 1);
    if (st.n >= goalN(q)) {
      st.s = 'ready';
      news.push(`Quest complete: ${q.title}. Return to ${npcById(q.from).name}.`);
    } else news.push(`Quest: ${q.title}, ${st.n} of ${goalN(q)}.`);
  }
  if (news.length) saveProfile();
  return [...bountyNews, ...matNews, ...news];
}

function acceptQuest(id) {
  const q = QUEST_BY_ID[id];
  if (!q || questSt(q) || questOf(q.from) !== q || !lvlOk(q)) return false;
  profile.quests[id] = { s: 'active', n: 0 };
  saveProfile();
  return true;
}

// Pay out a finished quest. An item that won't fit in the satchel is paid as its price in gold instead.
function claimQuest(id) {
  const q = QUEST_BY_ID[id], st = q && questSt(q);
  if (st?.s !== 'ready') return null;
  st.s = 'done';
  let gold = q.gold || 0;
  const got = [];
  if (q.item) {
    const n = profile.items[q.item] || 0;
    const m = profile.stash.items[q.item] || 0;
    if (n < SATCHEL_MAX) { profile.items[q.item] = n + 1; got.push(`a ${ITEMS[q.item].name}`); }
    else if (m < stashCap()) { profile.stash.items[q.item] = m + 1; got.push(`a ${ITEMS[q.item].name} (sent to your stash)`); }
    else gold += ITEMS[q.item].price;
  }
  profile.gold += gold;
  profile.stats.earned += gold;
  saveProfile();
  return [gold ? `+${gold} gold` : '', ...got].filter(Boolean).join(' and ');
}

// "!" = has a quest for you, "?" = something to hand in here.
function questMark(npcId) {
  const q = questOf(npcId);
  if (q && questSt(q)?.s === 'ready') return '?';
  if (pendingDeliveries(npcId).length) return '?';
  return offering(q) ? '!' : '';
}

function updateQuestMarks() {
  document.querySelectorAll('#npcs .npc').forEach((b) => {
    const m = questMark(b.dataset.npc), el = b.querySelector('.qmark');
    el.textContent = m;
    el.hidden = !m;
    b.setAttribute('aria-label', b.dataset.label + (m === '!' ? '. Has a quest for you' : m === '?' ? '. Quest to hand in' : ''));
  });
}

// One quest's card, for a keeper's panel or the quest log.
function questCardHTML(q, where) {
  const st = questSt(q), giver = npcById(q.from);
  if (lockedFor(q)) {
    return `<div class="quest locked"><p class="label">Locked · level ${q.lv}</p><h4>${q.title}</h4>
      <p class="note">${giver.name} will have work for you at level <b>${q.lv}</b>. You are level ${heroLevel()}.</p></div>`;
  }
  if (!st) {
    return `<div class="quest offer"><p class="label">Quest offered</p><h4>${q.title}</h4><p class="ask">“${q.ask}”</p>
      <p class="note">Goal: ${goalText(q)}. Reward: <b>${rewardText(q)}</b>.</p>
      <div class="btns"><button class="btn primary small" type="button" data-k="quest:${q.id}">Accept</button></div></div>`;
  }
  const n = goalN(q), pct = Math.round(100 * st.n / n);
  const status = st.s === 'ready' && where === 'giver' ? `${goalText(q)}. Done!`
    : st.s === 'ready' ? `Done. Return to <b>${giver.name}</b>${giver.place ? ` at ${PLACES[giver.place].name}` : ' in the square'}.`
    : `${goalText(q)}.${n > 1 ? ` ${st.n} of ${n}.` : ''}`;
  const claim = st.s === 'ready' && where === 'giver'
    ? `<div class="btns"><button class="btn primary small" type="button" data-k="claim:${q.id}">Claim ${rewardText(q)}</button></div>` : '';
  return `<div class="quest ${st.s}"><p class="label">${st.s === 'ready' ? 'Quest complete' : 'Quest'}${where === 'log' ? ` · from ${giver.name}` : ''}</p>
    <h4>${q.title}</h4><p class="note">${status}</p>
    ${n > 1 && st.s === 'active' ? `<div class="qbar" role="img" aria-label="${st.n} of ${n}"><i style="width:${pct}%"></i></div>` : ''}${claim}</div>`;
}

function questLogHTML() {
  const mine = QUESTS.filter((q) => ['active', 'ready'].includes(questSt(q)?.s));
  const offers = Object.values(KEEPERS).filter((n) => offering(questOf(n.id))).length
    + state.folk.filter((f) => offering(questOf(f.id))).length;
  const hint = offers ? `<p class="note"><b>${offers}</b> ${offers === 1 ? 'person has' : 'people have'} work for you. Look for the <b>!</b> over their heads.</p>` : '';

// Pick who is out in the square this visit. Anyone waiting to pay you for a finished quest always shows up.
function rollFolk() {
  const lanes = shuffle(FOLK_LANES), ids = Object.keys(TOWNSFOLK);
  const owed = shuffle(ids.filter((id) => questMark(id) === '?'));
  const rest = shuffle(ids.filter((id) => !owed.includes(id)));
  state.folk = [...owed, ...rest].slice(0, FOLK_OUT).map((id, i) => ({ id, lane: lanes[i] }));
  greetedFolk.clear();
}

const QMARK = (id) => `<span class="qmark" style="top:${NPC_HEAD[id] ?? 12}%" aria-hidden="true" hidden></span>`;
function npcsHTML() {
