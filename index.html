/* VILLAGE STAGE — Cinderhold fills the screen. The map, townies and NPCs share #townView: one
   transform (scale s, then translate tx/ty, in px) pans and zooms them together. On the square the map
   covers the screen at "cover" scale and you drag to look around; opening a building zooms onto it and
   its keeper, centred in the part of the screen the sheet leaves free. The speech bubble, HUD, dock and
   sheet live outside the view, so they never scale. */
let view = null;       // the current { s, tx, ty } of #townView
let zoomedTo = null;   // the place the view is framed on (null = the square)

const stageSize = () => { const t = $('#town'); return { W: t.clientWidth, H: t.clientHeight }; };
// The smallest scale at which the map still covers the whole stage.
const coverScale = () => { const { W, H } = stageSize(); return Math.max(1, H / (W / MAP_AR)); };

// Keep the map covering the visible part of the stage (what an open sheet leaves free): never show past its edges.
function clampView(v, a = freeArea()) {
  const { W } = stageSize(), mw = v.s * W, mh = v.s * W / MAP_AR, aw = a.x1 - a.x0, ah = a.y1 - a.y0;
  return { s: v.s,
    tx: mw <= aw ? a.x0 + (aw - mw) / 2 : clamp(v.tx, a.x1 - mw, a.x0),
    ty: mh <= ah ? a.y0 + (ah - mh) / 2 : clamp(v.ty, a.y1 - mh, a.y0) };
}

// Where the building and its keeper sit, as fractions of the map (0..1 across and down).
// Only solid shapes count: drifting smoke, embers and glows would stretch the box far above the roof.
function placeFrame(k) {
  const v = $('#townView').getBoundingClientRect(), bld = document.querySelector(`.bld[data-place="${k}"]`);
  const solid = bld ? [...bld.querySelectorAll('path, rect, circle, ellipse, polygon, polyline, use, text, line')]
    .filter((e) => !e.closest('.smoke, .plume, .ember, .glow')) : [];
  const parts = [...solid, document.querySelector(`.npc.stand[data-place="${k}"]`)]
    .filter(Boolean).map((e) => e.getBoundingClientRect()).filter((r) => r.width || r.height);
  if (!parts.length || !v.width) return null;
  const x0 = Math.min(...parts.map((r) => r.left)), x1 = Math.max(...parts.map((r) => r.right));
  const y0 = Math.min(...parts.map((r) => r.top)), y1 = Math.max(...parts.map((r) => r.bottom));
  return { cx: ((x0 + x1) / 2 - v.left) / v.width, cy: ((y0 + y1) / 2 - v.top) / v.height,
    w: (x1 - x0) / v.width, h: (y1 - y0) / v.height };
}

// The part of the stage the open sheet leaves free (above a bottom sheet, left of a side sheet).
function freeArea() {
  const { W, H } = stageSize(), p = $('#placePanel');
  if (p.hidden) return { x0: 0, y0: 0, x1: W, y1: H };
  const t = $('#town').getBoundingClientRect(), r = p.getBoundingClientRect();
  return r.left - t.left > W * 0.3 ? { x0: 0, y0: 0, x1: r.left - t.left, y1: H } : { x0: 0, y0: 0, x1: W, y1: r.top - t.top };
}

// Frame place k in the free area: the building and its keeper filling most of it, or (zoom = false)
// at cover scale looking at it. The scale never drops below what keeps the free area covered.
function frameOn(k, zoom = true) {
  const { W } = stageSize(), f = k && placeFrame(k), a = freeArea(), base = coverScale();
  if (!f) return null;
  const aw = a.x1 - a.x0, ah = a.y1 - a.y0, floor = Math.max(1, ah / (W / MAP_AR), aw / W);
  const s = zoom ? clamp(Math.min(aw * 0.78 / (f.w * W), ah * 0.8 / (f.h * W / MAP_AR)), floor, Math.max(base * 1.3, 3.4)) : base;
  return clampView({ s, tx: (a.x0 + a.x1) / 2 - s * f.cx * W, ty: (a.y0 + a.y1) / 2 - s * f.cy * W / MAP_AR });
}

// The square at first sight: cover scale, centred on the bonfire (MAP_HOME).
function homeView() {
  const { W, H } = stageSize(), s = coverScale(), cx = (MAP_HOME[0] - MAP_X0) / MAP_W, cy = MAP_HOME[1] / MAP_H;
  return clampView({ s, tx: W / 2 - s * cx * W, ty: H / 2 - s * cy * W / MAP_AR });
}

function setView(v, glide) {
  if (!v) return;
  view = v;
  const el = $('#townView');
  el.classList.toggle('glide', !!glide && !reduced);
  el.style.transform = `translate(${v.tx.toFixed(1)}px, ${v.ty.toFixed(1)}px) scale(${v.s.toFixed(3)})`;
  el.style.setProperty('--zinv', (1 / v.s).toFixed(3));
}

// Called after every village render, and with force on resize.
function zoomTown(force = false) {
  const k = state.place;
  document.querySelectorAll('.npc.stand').forEach((n) => n.classList.toggle('here', n.dataset.place === k));
  $('#town').classList.toggle('sheetOpen', !$('#placePanel').hidden);
  if (!$('#town').clientWidth) { zoomedTo = undefined; view = null; return; }   // screen hidden: frame it on the next render
  if (!force && view && k === zoomedTo) return;
  const from = zoomedTo, first = !view;
  zoomedTo = k;
  if (!force) hideSay();
  if (force || first) {
    // Resize or first sight: frame without a glide. On the square, keep looking where you were.
    const { W: sw, H: sh } = stageSize();
    const keep = view && !k ? { cx: (sw / 2 - view.tx) / (view.s * sw), cy: (sh / 2 - view.ty) / (view.s * sw / MAP_AR) } : null;
    if (k) return setView(frameOn(k));
    if (!keep) return setView(homeView());
    const s = coverScale();
    return setView(clampView({ s, tx: sw / 2 - s * keep.cx * sw, ty: sh / 2 - s * keep.cy * sw / MAP_AR }));
  }
  // Into a building: glide onto it. Back to the square: glide out, still looking at the building you left.
  setView(k ? frameOn(k) : frameOn(from, false) || homeView(), true);
}

// Drag (mouse or finger) to look around the village; the wheel pans too. A drag never counts as a tap.
function buildStage() {
  const town = $('#town');
  let drag = null, dragged = false;
  town.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0 || !view || ev.target.closest('#placePanel, .townHud, .dock, #battleDock, #npcSay')) return;
    drag = { x: ev.clientX, y: ev.clientY, v: { ...view }, id: ev.pointerId, moved: false };
  });
  town.addEventListener('pointermove', (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 8) return;
      drag.moved = true;
      town.setPointerCapture(drag.id);
      town.classList.add('panning');
      hideSay();
    }
    setView(clampView({ s: drag.v.s, tx: drag.v.tx + dx, ty: drag.v.ty + dy }));
  });
  const end = () => {
    if (drag?.moved) { dragged = true; setTimeout(() => { dragged = false; }, 0); }
    drag = null;
    town.classList.remove('panning');
  };
  town.addEventListener('pointerup', end);
  town.addEventListener('pointercancel', end);
  town.addEventListener('click', (ev) => { if (dragged) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  town.addEventListener('wheel', (ev) => {
    if (!view || ev.target.closest('#placePanel')) return;
    ev.preventDefault();
    hideSay();
    // The map is wide and tall now: the wheel pans up and down, Shift+wheel (or a trackpad) sideways.
    setView(clampView({ s: view.s, tx: view.tx - (ev.shiftKey ? ev.deltaY : ev.deltaX), ty: view.ty - (ev.shiftKey ? 0 : ev.deltaY) }));
  }, { passive: false });
}

function openPlace(k) {
  state.place = k;
  state.booth = null; state.boothNews = '';   // walking away from the carnival abandons any game in progress
  state.trainNews = '';                       // and the yard forgets this morning's drill
  hideSay();
  state.keeperLoot = '';
  state.tomeNews = ''; state.craftNews = '';
  keeperGreet(k);
  deliverTo(k);
  if (k === 'pvp') rollDuels();   // fresh challengers wait at the rope every visit
  if (k === 'tavern') state.tip = Math.floor(Math.random() * TIPS.length);
  state.sheet = null;
  render();
}

// Weapons and kit are sold at the Armory (and were once at the Ironsmith): the keeper you're facing reacts.
const GEAR_SHOPS = ['armory', 'forge'];
const gearShop = () => (state.place === 'forge' ? 'forge' : 'armory');

function villageAction(k) {
  const [verb, arg, arg2, arg3, arg4] = k.split(':');
  if (verb === 'open') return openPlace(arg);
  if (verb === 'homeshop') { state.marketTab = 'home'; return openPlace('market'); }
  if (verb === 'fight') return startGauntlet();
  if (verb === 'duel') return startDuel(Number(arg));
  if (verb === 'gjoin') { joinGuild(arg); return render(); }
  if (verb === 'hunt') return startHunt(arg);
  if (verb === 'dungeon') return startDungeon(arg);
  if (verb === 'continue') { state.runPending = false; state.battle++; return startBattle(false); }
  if (verb === 'team') { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (verb === 'skills') { state.skillsFor = null; state.skillsFrom = null; state.screen = 'skills'; render(); window.scrollTo(0, 0); return; }
  if (verb === 'skillsfor') { state.skillsFor = arg; state.skillsFrom = 'warband'; state.screen = 'skills'; render(); window.scrollTo(0, 0); return; }
  if (verb === 'play') { if (startBooth(arg)) { render(); runBooth(); } return; }
  if (verb === 'sheet') { state.place = null; state.booth = null; state.swapSlot = null; state.invSel = null; state.sheet = arg && state.sheet !== arg ? arg : null; }
  else if (verb === 'swap') state.swapSlot = state.swapSlot === Number(arg) ? null : Number(arg);
  // Inventory: whose gear, equip from the bag, put an equipped item back.
  else if (verb === 'invfor') { state.invFor = arg; state.invSel = null; }
  else if (verb === 'sbuy') { if (buyStone(arg)) keeperReact('jeweler'); }
  else if (verb === 'sfuse') {
    const up = fuseStones(arg);
    if (up) { state.craftNews = `Three ${stoneName(arg)} stones fuse into a ${stoneName(up)}.`; if (state.place === 'workshop') keeperReact('workshop'); }
  }
  else if (verb === 'isel') state.invSel = state.invSel === `${arg}:${arg2}` ? null : `${arg}:${arg2}`;
  else if (verb === 'iequip') {
    state.invSel = null;
    const cid = invCid();
    if (arg === 'wp') giveWeapon(arg2, cid); else if (arg === 'eq') giveKit(arg2, cid); else if (arg === 't') giveTrinket(arg2, cid);
  }
  else if (verb === 'iunq') {
    state.invSel = null;
    const cid = invCid();
    if (arg === 'wp') unequipWeapon(cid); else if (arg === 'eq') unequipKit(cid); else if (arg === 't') unequipTrinket(cid);
  }
  else if (verb === 'recruit') {
    // Swap a recruit for another champion: slot i of the warband (1..3) is profile.recruits[i - 1].
    const i = Number(arg), rec = [...(profile.recruits || [])];
    if (i >= 1 && i < TEAM_SIZE && charById(arg2) && !state.team.includes(arg2)) {
      rec[i - 1] = arg2;
      profile.recruits = rec;
      syncTeam();
      saveProfile();
    }
    state.swapSlot = null;
  }
  else if (verb === 'back') { state.place = null; state.booth = null; }
  else if (verb === 'bclaim') claimBounty(Number(arg));
  else if (verb === 'breroll') rerollBounties();
  else if (verb === 'leave') { state.booth = null; state.boothNews = 'You walked away. The entry fee stays with Zazzo.'; }
  else if (verb === 'abandon') { state.runPending = false; state.phase = 'idle'; }
  else if (verb === 'hero') state.forgeHero = arg;
  else if (verb === 'drill') {
    const r = drill(arg);
    if (r) {
      keeperReact('train');
      const s = NEUTRAL_SKILLS[arg] || GENERIC_PASSIVES[arg];
      state.trainNews = r.mastered
        ? `${heroName()} has mastered ${s.name}. Equip it under Choose skills — and that is a skill point earned.`
        : `${heroName()} drills ${s.name}. ${r.left} more morning${r.left === 1 ? '' : 's'} of it.`;
    }
  }
  else if (verb === 'up') { if (forgeUp(arg)) { keeperReact('forge'); questEvent('forge'); } }
  // The Ironsmith's weapon rack (see THE ARMORY).
  else if (verb === 'ftab') state.forgeTab = arg;
  else if (verb === 'atab') state.armoryTab = arg;
  else if (verb === 'wep') { if (buyWeapon(arg)) keeperReact(gearShop()); }
  else if (verb === 'wsell') { if (sellWeapon()) keeperReact(gearShop()); }
  else if (verb === 'wgive') { if (giveWeapon(arg, arg2) && GEAR_SHOPS.includes(state.place)) keeperReact(gearShop()); }
  else if (verb === 'wunequip') unequipWeapon(arg);
  // The Ironsmith's armor stand (see THE ARMOR STAND).
  else if (verb === 'eqbuy') { if (buyKit(arg)) keeperReact(gearShop()); }
  else if (verb === 'eqsell') { if (sellKit()) keeperReact(gearShop()); }
  else if (verb === 'eqgive') { if (giveKit(arg, arg2) && GEAR_SHOPS.includes(state.place)) keeperReact(gearShop()); }
  else if (verb === 'equnequip') unequipKit(arg);
  // The socket bench (see SOCKETS): setstone:<champion>:<slot>:<index>:<stone>, prise:<champion>:<slot>:<index>.
  else if (verb === 'setstone') { if (setStone(arg, arg2, Number(arg3), arg4)) keeperReact(gearShop()); }
  else if (verb === 'prise') { if (priseStone(arg, arg2, Number(arg3))) keeperReact(gearShop()); }
  else if (verb === 'buy') { if (buyItem(arg)) { keeperReact('market'); questEvent('buy'); } }
  else if (verb === 'ctab') state.craftTab = arg;
  // Sparring at the Training Yard.
  else if (verb === 'ttab') state.trainTab = arg;
  // The Academy.
  else if (verb === 'ytab') state.acadTab = arg;
  else if (verb === 'ypick') { if (charById(arg)) { state.acadPick = arg; if ((state.acadTab || 'lessons') === 'chart') state.acadTab = 'library'; } }
  else if (verb === 'ysort') { const cur = state.chartSort || { k: 'hp', dir: -1 }; state.chartSort = { k: arg, dir: cur.k === arg ? -cur.dir : (arg === 'name' ? 1 : -1) }; }
  else if (verb === 'yfac') state.chartFac = arg;
  else if (verb === 'ylv') state.chartLv = clamp((state.chartLv || heroLevel()) + Number(arg), 1, LEVEL_CAP);
  else if (verb === 'sslot') sparSetup().slot = [arg, Number(arg2)];
  else if (verb === 'spick') { const m = sparSetup(), [sd, i] = m.slot; if (charById(arg)) m[sd][i] = arg; }
  else if (verb === 'sparlv') { const m = sparSetup(); m.lv = clamp(m.lv + Number(arg), 1, LEVEL_CAP); }
  else if (verb === 'sctl') sparSetup().ctl = arg;
  else if (verb === 'srand') sparSetup().e = randomBand();
  else if (verb === 'sswap') { const m = sparSetup(); [m.p, m.e] = [m.e, m.p]; }
  else if (verb === 'sgo') return startSpar();
  else if (verb === 'craft') { const line = craft(arg); if (line) { state.craftNews = line; if (line.startsWith('Crafted')) keeperReact('workshop'); } }
  else if (verb === 'salv') { const line = salvage(arg, arg2); if (line) { state.craftNews = line; keeperReact('workshop'); } }
  else if (verb === 'tbuy') { if (buyTome()) { keeperReact('market'); questEvent('buy'); state.tomeNews = 'Bought. It waits for you at home, or read it right here.'; } }
  else if (verb === 'tread') { const line = readTome(); if (line) state.tomeNews = line; }
  else if (verb === 'trinket') { if (buyTrinket(arg)) { keeperReact('jeweler'); questEvent('trinket'); } }
  else if (verb === 'sell') { if (sellTrinket()) keeperReact('jeweler'); }
  // Your House: furniture, satchel ↔ stash, and trinkets between the stash and your champions.
  else if (verb === 'mtab') state.marketTab = arg;
  else if (verb === 'decor') { if (buyDecor(arg)) keeperReact('market'); }
  else if (verb === 'store') storeItem(arg);
  else if (verb === 'take') takeItem(arg);
  else if (verb === 'give') { if (giveTrinket(arg, arg2) && state.place === 'jeweler') keeperReact('jeweler'); }
  else if (verb === 'unequip') unequipTrinket(arg);
  else if (verb === 'codex') state.codex = arg;
  else if (verb === 'rumor') state.tip += 1 + Math.floor(Math.random() * (TIPS.length - 1));
  else if (verb === 'quest') { if (acceptQuest(arg)) { state.keeperSays = `Good${youName() ? `, ${youName()}` : ''}. Come back when it is done.`; state.keeperLoot = ''; } }
  else if (verb === 'claim') { const got = claimQuest(arg); if (got) { state.keeperSays = QUEST_BY_ID[arg].done; state.keeperLoot = got; } }
  render();
}

function buildVillage() {
  buildTownMap();
  const town = $('#town');
  town.addEventListener('click', (ev) => {
    if (ev.target.closest('#placePanel, .townHud, #battleDock')) return;   // they have their own handlers
    const dk = ev.target.closest('.dock [data-k]');
    if (dk) return villageAction(dk.dataset.k);
    const said = ev.target.closest('#npcSay [data-k]');
    if (said) return sayAction(said.dataset.k);
    if (ev.target.closest('#npcSay')) return;
    const b = ev.target.closest('.bld, .npc.stand'), folk = ev.target.closest('.npc.walker');
    if (folk) folkTalk(folk);
    else if (b) openPlace(b.dataset.place);
    else hideSay();
  });
  town.addEventListener('keydown', (ev) => {
    const b = ev.target.closest('.bld');
    if (b && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openPlace(b.dataset.place); }
  });
  $('#placePanel').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-k]');
    if (b && !b.disabled) villageAction(b.dataset.k);
  });
  $('#villageBtn').addEventListener('click', toVillage);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') hideSay(); });
  addEventListener('resize', () => { if (!$('#villageScreen').hidden) zoomTown(true); });
  // Battle: the button opens its menu; a choice walks you to that building (its panel has the fights).
  const setBattleMenu = (open) => { $('#battleMenu').hidden = !open; $('#battleBtn').setAttribute('aria-expanded', String(open)); };
  $('#battleBtn').addEventListener('click', (ev) => { ev.stopPropagation(); setBattleMenu($('#battleMenu').hidden); });
  $('#battleMenu').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-go]');
    if (!b) return;
    ev.stopPropagation();
    setBattleMenu(false);
    openPlace(b.dataset.go);
  });
  document.addEventListener('click', (ev) => { if (!ev.target.closest('#battleDock')) setBattleMenu(false); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') setBattleMenu(false); });
  buildStage();
  // Gear → game mechanics window. Its tabs re-render in place; Esc or Close shuts it.
  const dlg = $('#rulesDlg');
  $('#gearBtn').addEventListener('click', () => { hideSay(); $('#rulesBody').innerHTML = codexHTML(); dlg.showModal(); });
  dlg.addEventListener('click', (ev) => {
    if (ev.target === dlg || ev.target.closest('[data-close]')) return dlg.close();   // backdrop or Close
    const tab = ev.target.closest('[data-k^="codex:"]');
    if (tab) { state.codex = tab.dataset.k.split(':')[1]; $('#rulesBody').innerHTML = codexHTML(); }
  });
  rollFolk();
}

/* ==================================================================
   RENDERING — battle
   ================================================================== */
const artOf = (u) => u.art || u.id;
const unitClasses = (u) => `${u.side}${u.you ? ' you' : ''}${u.summon ? ' summon' : ''}${u.inert ? ' inert' : ''}${u.summon && SUMMONS[u.id].copy ? ' illusion' : ''}${u.monster ? ' monster' : ''}${u.elite ? ' elite' : ''}${u.boss ? ' boss' : ''}${u.floats ? ' floats' : ''}`;

// A champion standing on the battlefield (--d staggers the idle breathing so nobody bobs in sync).
function unitCardHTML(u) {
  return `
    <div class="unit ${unitClasses(u)}" id="u-${u.uid}" data-uid="${u.uid}" style="--d:${(-Math.random() * 2.6).toFixed(2)}s">
      <ul class="chips"></ul>
      <div class="plate">
        ${u.watch ? '<div class="watchdial" aria-hidden="true"><b></b></div>' : ''}
        <div class="who"><strong>${u.name}</strong><span class="lvl"></span></div>
        <div class="bar hp"><div class="fill"></div><span></span></div>
        ${u.maxMp ? '<div class="bar mp"><div class="fill"></div><span></span></div>' : ''}
        ${u.faction === 'mech' && !u.summon ? '<div class="bar heat"><div class="fill"></div><span></span></div>' : ''}
      </div>
      <div class="body"><div class="upic">${spriteSVG(artOf(u))}${animImgHTML(u)}<div class="stfx"></div></div><svg class="rites" viewBox="0 0 100 100" aria-hidden="true">${RITES_ART}</svg><svg class="box" viewBox="0 0 100 100" aria-hidden="true">${COFFIN_ART}</svg><svg class="mound" viewBox="0 0 100 100" aria-hidden="true">${MOUND_ART}</svg></div>
    </div>`;
}

/* Status overlays: characters/animations/status/<id>.webp are looping transparent clips drawn in the
   champion art's own 100x100 space, so they sit straight over .upic (see .stfx in the CSS).
   Soaked follows soaked(u), so wet weather drips on everyone too. */
const STATUS_FX = ['stride', 'taunt', 'roots', 'soaked', 'poison', 'bleed', 'burn', 'stun'];
const ROOTS_GROW_MS = 585;  // roots-grow.webp plays once (13 frames x 45 ms), then the looping roots.webp takes over
// 'stride' = a breeze at the feet of everyone sped up by Elowen's Forest Stride (same test as barAgi).
const statusOn = (u, id) => (id === 'soaked' ? soaked(u)
  : id === 'roots' ? u.effects.some((e) => e.id === 'slow' && e.roots)
  : id === 'stride' ? alliesOf(u).some((a) => pv(a).haste) : has(u, id));
function syncStatusFx(el, u) {
  const host = el.querySelector('.stfx');
  if (!host) return;
  const on = u.hp > 0 ? STATUS_FX.filter((id) => statusOn(u, id)) : [];
  const key = on.join();
  if (host.dataset.on === key) return;  // unchanged: leave the running clips alone
  const was = (host.dataset.on || '').split(',');
  host.dataset.on = key;
  // Freshly entangled: the roots burst out of the ground first, then settle into their idle sway.
  const sprout = on.includes('roots') && !was.includes('roots') && !reduced;
  host.innerHTML = on.map((id) => {
    const src = id === 'roots' && sprout ? `roots-grow.webp?t=${Date.now()}` : `${id}.webp`;
    return `<img src="${ANIM_DIR}status/${src}" alt="" draggable="false" data-fx="${id}">`;
  }).join('');
  if (sprout) {
    setTimeout(() => {
      const img = host.querySelector('img[data-fx="roots"]');
      if (img) img.src = `${ANIM_DIR}status/roots.webp`;
    }, ROOTS_GROW_MS);
  }
  for (const id of STATUS_FX) el.classList.toggle(`st-${id}`, on.includes(id));
}

function tokenHTML(u) {
  return `
    <div class="tok ${unitClasses(u)} body-${lookOf(artOf(u)).body}" id="tok-${u.uid}" title="${u.name}">
      <div class="face">${spriteSVG(artOf(u))}</div>
      <span class="st" hidden></span>
    </div>`;
}

function buildArena() {
  for (const side of ['p', 'e']) $(`#side-${side}`).innerHTML = state.teams[side].map(unitCardHTML).join('');
  $('#acts').dataset.uid = '';
  const track = $('#track');
  track.querySelectorAll('.tok').forEach((t) => t.remove());
  track.insertAdjacentHTML('beforeend', allUnits().map(tokenHTML).join(''));
  layoutSides();
  renderTrack(0);
  prefetchClips();
}

// A summon appearing mid-battle gets its place on the field and a speed-bar icon.
function addUnitDom(u) {
  $(`#side-${u.side}`).insertAdjacentHTML('beforeend', unitCardHTML(u));
  $('#track').insertAdjacentHTML('beforeend', tokenHTML(u));
  layoutSides();
  renderTrack(0);
  prefetchClips();
}

function unitLevelText(u) {
  if (!u.summon) return `Lv ${u.level}`;
  if (u.inert) return 'Planted';
  if (u.hp <= 0) return 'Fallen';   // a corpse's `expires` is its clear-away clock, not time left to fight
  if (u.expires == null) return 'Summon';
  const left = Math.max(1, Math.ceil((u.expires - state.time) / ROUND_TIME));
  return `${left} round${left === 1 ? '' : 's'}`;
}

/* Field formation: [x%, feet y%] for your warband; enemies mirror x.
   Two battle lines, melee in front every time: the melee line stands nearest the enemy (a boss
   leads it whatever its role), and the ranged and support fight from the line behind it.
   The first slot of each line is the classic 3-band spot, so small warbands look as they always did.
   Summons stand beside whoever called them, so you can always see whose they are. */
const SLOTS = {
  front:  [[28, 74], [39, 88], [38, 54], [33, 96]],   // the melee line, nearest the enemy
  back:   [[15, 56], [17, 96], [13, 76], [19, 38]],   // the ranged and support line behind it
  summon: [[40, 63], [41, 89], [37, 46]],   // only for a summon whose caster has left the field
};
// Where a summon stands relative to its caster: a step toward the middle and a little nearer the
// front, so it never hides them. A second or third from the same caster fans out instead of stacking
// (a corpse still lying there and a freshly cast one, say).
const SUMMON_OFFSET = [[9, 7], [6, -9], [13, 16]];
const ROLE_ORDER = { melee: 0, ranged: 1, support: 2 };

function layoutSides() {
  for (const side of ['p', 'e']) {
    const at = {};   // uid → [x, y] of everyone placed so far, so summons can find their caster
    const place = (u, [x, y]) => {
      at[u.uid] = [x, y];
      const el = actorEl(u);
      if (!el) return;
      el.style.setProperty('--x', side === 'p' ? x : 100 - x);
      el.style.setProperty('--y', y);
      el.style.zIndex = y;   // lower on the field = closer to you = drawn in front
    };
    // The melee line holds the front every battle; a boss strides out to lead it whatever its role.
    // Everyone else forms the back line, ranged ahead of support. Team order breaks ties, so your
    // own champion stands at the head of their line.
    const fighters = state.teams[side].filter((u) => !u.summon);
    const front = fighters.filter((u) => u.boss || u.role === 'melee')
      .sort((a, b) => (b.boss ? 1 : 0) - (a.boss ? 1 : 0));
    const back = fighters.filter((u) => !front.includes(u))
      .sort((a, b) => ROLE_ORDER[a.role] - ROLE_ORDER[b.role]);
    front.forEach((u, i) => place(u, SLOTS.front[i % SLOTS.front.length]));
    back.forEach((u, i) => place(u, SLOTS.back[i % SLOTS.back.length]));
    // Casters are already placed above (the fallen keep their spot), so every summon has a home to
    // stand next to — including a Salvage Bot, which crawls out beside its own wreck.
    const nth = {};
    let orphan = 0;
    for (const u of state.teams[side].filter((x) => x.summon)) {
      const home = at[u.owner];
      if (!home) { place(u, SLOTS.summon[orphan++ % SLOTS.summon.length]); continue; }
      if (u.inert) { place(u, [49, 72]); continue; }   // the cross: planted out in the open ground between the two lines
      const i = nth[u.owner] = (nth[u.owner] ?? -1) + 1;
      const [dx, dy] = SUMMON_OFFSET[i % SUMMON_OFFSET.length];
      place(u, [clamp(home[0] + dx, 8, 46), clamp(home[1] + dy, 40, 98)]);
    }
  }
}

/* ==================================================================
   ANIMATED CHAMPIONS
   characters/animations/ holds a looping idle and a one-shot attack
   clip per champion, with manifest.json giving each clip's size, the
   point its feet stand on, and the time the blow lands (hitMs). The
   clips sit on top of the SVG art rather than replacing it: a champion
   with no entry, a clip that fails to load, or a visitor who asked for
   reduced motion all keep the static sprite and the CSS poses below.
   Only battlefield champions animate — speed-bar icons, the village and
   the champion cards stay on the SVGs they were drawn for.
   ================================================================== */
const ANIM_DIR = 'characters/animations/';
const ANIM_FOOT = 0.94;   // the SVGs plant their feet here, so the clips line up when they do too
let ANIM = null;          // manifest.json once it loads, and null for the whole session if it never does

if (!reduced) {
  fetch(`${ANIM_DIR}manifest.json`).then((r) => (r.ok ? r.json() : null)).then((m) => { ANIM = m; })
    .catch(() => { /* no manifest: every champion keeps its SVG */ });
}

const animOf = (u) => ANIM?.[artOf(u)];
const animImg = (u) => actorEl(u)?.querySelector('.upic.animated .anim');

/* A clip's box, in multiples of --size. The SVG stands its feet at the middle of the body box,
   ANIM_FOOT of the way down, so scale the clip by its own foot height and slide its foot point
   onto that same spot. Enemies are mirrored by CSS, which puts their feet the other side of the
   frame's centre, so measure from the far edge for them. */
function clipVars(e, side) {
  const k = ANIM_FOOT / e.footY;
  const footX = side === 'e' ? e.w - e.footX : e.footX;
  return { '--aw': e.w * k, '--ah': e.h * k, '--ax': 0.5 - footX * k };
}
const clipStyle = (e, side) => Object.entries(clipVars(e, side)).map(([k, v]) => `${k}:${v.toFixed(4)}`).join(';');
const sizeClip = (img, e, side) => Object.entries(clipVars(e, side)).forEach(([k, v]) => img.style.setProperty(k, v.toFixed(4)));

// The idle clip, laid over the SVG in the champion's card. Empty for anyone without one.
function animImgHTML(u) {
  const a = animOf(u);
  return a ? `<img class="anim" src="${ANIM_DIR}${a.idle.src}" alt="" draggable="false" style="${clipStyle(a.idle, u.side)}">` : '';
}

/* Attack clips are held as Blobs, because a fresh object URL is what rewinds an animated WebP to
   frame 0 — re-using one URL just leaves it running. The Blob is fetched once per champion, so
   every replay after the first costs nothing but a new handle on bytes already in memory. */
const clipBlobs = new Map();   // file name → its Blob, or null while in flight / if it failed
function fetchClip(src) {
  if (clipBlobs.has(src)) return;
  clipBlobs.set(src, null);
  fetch(ANIM_DIR + src).then((r) => (r.ok ? r.blob() : null)).then((b) => clipBlobs.set(src, b)).catch(() => {});
}
// Warms the attack clips of everyone on the field, so the first swing of a battle doesn't stall on a fetch.
function prefetchClips() {
  for (const u of allUnits()) { const a = animOf(u); if (a) fetchClip(a.attack.src); }
}

/* Starts a champion's attack clip, and returns how long to wait for the blow to land —
   or null when there is no clip to play, which is the signal to fall back to a CSS pose.
   Multi-hit skills call this once per hit: rather than restart on every one, the follow-ups
   ride the clip already playing, paced by its own hit frames where the artist drew several. */
// fresh: always restart the clip, even if the last swing's clip is still running (a Double Attack's
// second swing comes round sooner than a clip lasts). Otherwise a multi-hit skill's later hits ride
// the clip already playing.
function playAttack(u, fresh = false) {
  const a = animOf(u), img = animImg(u);
  const blob = a && clipBlobs.get(a.attack.src);
  if (!a || !img || !blob) return null;
  const hits = a.attack.hitsMs || [];
  if (!fresh && img.clipUntil > performance.now()) return hits.length > 1 ? hits[1] - hits[0] : 140;

  const url = URL.createObjectURL(blob);
  img.clipUntil = performance.now() + a.attack.ms;
  sizeClip(img, a.attack, u.side);
  img.src = url;
  setTimeout(() => {
    URL.revokeObjectURL(url);
    if (img.src !== url) return;   // a later swing already took the clip over
    sizeClip(img, a.idle, u.side);
    img.src = ANIM_DIR + a.idle.src;
  }, a.attack.ms);
  return a.attack.hitMs;
}

/* ==================================================================
   BATTLEFIELD CHOREOGRAPHY (whole-sprite movement)
   Champions run, leap, shoot and react to hits. Every helper resolves
   when its motion lands, so the combat code can simply await it.
   Later, champions redrawn as body-part layers can swap in richer poses here.
   ================================================================== */
const actorEl = (u) => document.getElementById(`u-${u.uid}`);
const bodyEl = (u) => actorEl(u)?.querySelector('.body');
const facing = (u) => (u.side === 'p' ? 1 : -1);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Resolves when a Web Animation finishes, or after its duration if the tab is hidden and not painting.
const done = (anim, ms) => Promise.race([anim.finished.catch(() => {}), sleep(ms + 40)]);

// Where a champion stands on the stage, in pixels relative to the battlefield.
function stageBox(u) {
  const b = bodyEl(u);
  if (!b) return null;
  const s = $('#arena').getBoundingClientRect(), r = b.getBoundingClientRect();
  return { x: r.left + r.width / 2 - s.left, feet: r.bottom - s.top, top: r.top - s.top, w: r.width, h: r.height };
}

// Melee: run up to the target (or the front of a group) and stop just in front of it.
// Floating champions don't run: they take wing, climb high and dive onto the target,
// leaning into the dive, then glide home along the same arc (dashBack reads it from trip).
// pace < 1 shortens the run, for a flurry that leaps between enemies rather than charging once.
// "123.4px -56.7px" → [123.4, -56.7]; "none"/empty → [0, 0]. For folding a dash into an attachment.
const dashXY = (s) => { const p = String(s || '').split(/\s+/).map(parseFloat); return [Number.isFinite(p[0]) ? p[0] : 0, Number.isFinite(p[1]) ? p[1] : 0]; };

async function dashTo(u, targets, pace = 1) {
  const el = actorEl(u), me = stageBox(u);
  const boxes = targets.map(stageBox).filter(Boolean);
  if (reduced || !el || !me || !boxes.length) return null;
  const dir = facing(u);
  const front = dir > 0 ? Math.min(...boxes.map((b) => b.x)) : Math.max(...boxes.map((b) => b.x));
  const tx = targets.length > 1 ? front : boxes[0].x;
  const ty = boxes.reduce((s, b) => s + b.feet, 0) / boxes.length;
  /* The dash is written as an absolute `translate` from the unit's HOME spot, but stageBox reads
     where it is standing right now - already carried off by an earlier dash in the same action
     (Krug's Reckless Swing wheels onto a second enemy). Fold that displacement back in, or the
     second dash measures from one origin and is applied from another and the unit lands off its
     feet. With nothing to fold in these are the plain home-relative numbers they always were. */
  const cur = String(getComputedStyle(el).translate || '').split(/\s+/).map(parseFloat);
  const curX = Number.isFinite(cur[0]) ? cur[0] : 0, curY = Number.isFinite(cur[1]) ? cur[1] : 0;
  const dx = tx - dir * (boxes[0].w * 0.45 + me.w * 0.3) - me.x + curX;
  const dy = ty + 2 - me.feet + curY;
  const end = `${dx.toFixed(1)}px ${dy.toFixed(1)}px`;
  const fly = u.floats, ms = beat((fly ? 400 : 320) * pace);
  // Runners hop a little over the ground; flyers climb over half their own height and swoop.
  // The arc runs from wherever it starts to wherever it ends, not from home every time.
  const mx = curX + (dx - curX) * (fly ? 0.5 : 0.55), my = curY + (dy - curY) * (fly ? 0.5 : 0.55);
  const mid = fly ? `${mx.toFixed(1)}px ${(my - me.h * 0.6).toFixed(1)}px`
                  : `${mx.toFixed(1)}px ${(my - 26).toFixed(1)}px`;
  el.style.zIndex = 200;
  // The dive lean rotates the body around its feet, so the plate stays level.
  if (fly) pose(u, [{ transform: 'none' }, { transform: `rotate(${dir * 14}deg)`, offset: 0.5 }, { transform: 'none' }], 400);
  // Start from where it actually stands, so a second dash runs on from there instead of
  // snapping home first and setting off again.
  const from = `${curX.toFixed(1)}px ${curY.toFixed(1)}px`;
  const anim = el.animate(
    [{ translate: from }, { translate: mid, offset: 0.5 }, { translate: end }],
    { duration: ms, easing: 'ease-in-out', fill: 'forwards' });
  // Anything clamped onto this unit rides along with the dash — the same path, offset by the
  // attachment's own resting position, so a Jelly or Anchor stays stuck to it as it runs in.
  // (settleAttachments reads offsetLeft/Top, which ignore transforms, so it can't track a dash itself.)
  const [fX, fY] = dashXY(from), [mX, mY] = dashXY(mid), [eX, eY] = dashXY(end);
  const atts = [];
  for (const a of allUnits()) {
    if (!a.attach || a.hostUid !== u.uid || a.hp <= 0) continue;
    const ael = actorEl(a);
    if (!ael) continue;
    const [rx, ry] = dashXY(getComputedStyle(ael).translate);
    ael.style.zIndex = 201;
    const fwd = ael.animate([
      { translate: `${(rx + fX).toFixed(1)}px ${(ry + fY).toFixed(1)}px` },
      { translate: `${(rx + mX).toFixed(1)}px ${(ry + mY).toFixed(1)}px`, offset: 0.5 },
      { translate: `${(rx + eX).toFixed(1)}px ${(ry + eY).toFixed(1)}px` },
    ], { duration: ms, easing: 'ease-in-out', fill: 'forwards' });
    atts.push({ el: ael, rx, ry, fwd });
  }
  await done(anim, ms);
  return { anim, end, mid, fly, atts };
}

async function dashBack(u, trip) {
  if (!trip) return;
  const el = actorEl(u);
  if (el) {
    const ms = beat(trip.fly ? 340 : 280);
    const back = el.animate(trip.fly
      ? [{ translate: trip.end }, { translate: trip.mid, offset: 0.5 }, { translate: '0 0' }]
      : [{ translate: trip.end }, { translate: '0 0' }], { duration: ms, easing: 'ease-out' });
    trip.anim.cancel();
    // Bring the attachments home with the unit, then hand them back to settleAttachments.
    const [eX, eY] = dashXY(trip.end), [mX, mY] = dashXY(trip.mid);
    for (const { el: ael, rx, ry, fwd } of trip.atts || []) {
      const b = ael.animate(trip.fly
        ? [{ translate: `${(rx + eX).toFixed(1)}px ${(ry + eY).toFixed(1)}px` }, { translate: `${(rx + mX).toFixed(1)}px ${(ry + mY).toFixed(1)}px`, offset: 0.5 }, { translate: `${rx.toFixed(1)}px ${ry.toFixed(1)}px` }]
        : [{ translate: `${(rx + eX).toFixed(1)}px ${(ry + eY).toFixed(1)}px` }, { translate: `${rx.toFixed(1)}px ${ry.toFixed(1)}px` }],
        { duration: ms, easing: 'ease-out', fill: 'forwards' });
      if (fwd) fwd.cancel();
      b.finished.catch(() => {}).then(() => { b.cancel(); ael.style.zIndex = ''; });
    }
    await done(back, ms);
  }
  layoutSides();   // restores normal depth order; settleAttachments re-clamps the attachments
}

// Heroic: the guardian leaps from their place to stand just in front of the ally the blow is meant
// for — planting themselves between that ally and the incoming attacker. Returns a trip dashBack can
// read to send them home afterwards, mirroring dashTo/dashBack so the melee charge lands on them here.
async function interposeTo(g, ally) {
  const el = actorEl(g), me = stageBox(g), a = stageBox(ally);
  if (reduced || !el || !me || !a) return null;
  const dir = facing(g);                         // the way the guardian faces the enemy
  const dx = a.x + dir * (a.w * 0.55) - me.x;     // a half-step in front of the ally, toward the foe
  const dy = a.feet - me.feet;
  const end = `${dx.toFixed(1)}px ${dy.toFixed(1)}px`;
  const mid = `${(dx * 0.5).toFixed(1)}px ${(dy * 0.5 - 30).toFixed(1)}px`;   // a quick arcing leap
  const ms = beat(300);
  el.style.zIndex = 210;                          // over the ally they throw themselves in front of
  const anim = el.animate(
    [{ translate: '0 0' }, { translate: mid, offset: 0.5 }, { translate: end }],
    { duration: ms, easing: 'ease-out', fill: 'forwards' });
  await done(anim, ms);
  return { anim, end, mid, fly: false };
}

function pose(u, frames, ms) {
  const b = bodyEl(u);
  if (!b || reduced || u.hp <= 0) return null;   // the fallen don't flinch, hop or swing
  return b.animate(frames, { duration: beat(ms), easing: 'ease-out' });
}

/* Basic attacks for champions drawn by builtinSprite whose weapon swings on its own (the .wpn group,
   pivoting on the hand). wpn = keyframes for the weapon in the sprite's own space (enemies are
   mirrored as a whole, so the same frames work on both sides); body(d) = keyframes for the body,
   d = facing; hit = the share of ms at which the blow lands. */
const WEAPON_STRIKES = {
  // Barrow plods in, slowly hauls the headstone up over his head... then brings it down.
  barrow: { ms: 1150, hit: 0.8,
    // The hand rises with the stone (translate), so the headstone ends up held high over his head,
    // then it swings over and comes down nose-first in front of him.
    wpn: [{ transform: 'translate(0px, 0px) rotate(0deg)' },
      { transform: 'translate(-14px, -34px) rotate(14deg)', offset: 0.6, easing: 'ease-in-out' },
      { transform: 'translate(-16px, -37px) rotate(6deg)', offset: 0.72, easing: 'cubic-bezier(.6,0,1,.5)' },
      { transform: 'translate(4px, 6px) rotate(140deg)', offset: 0.8 },
      { transform: 'translate(4px, 7px) rotate(136deg)', offset: 0.9 },
      { transform: 'translate(0px, 0px) rotate(0deg)' }],
    body: (d) => [{ transform: 'none' },
      { transform: `translateX(${-d * 3}px) rotate(${-d * 5}deg)`, offset: 0.6 },
      { transform: `translateX(${-d * 4}px) rotate(${-d * 6}deg)`, offset: 0.72 },
      { transform: `translateX(${d * 12}px) translateY(3px) rotate(${d * 9}deg)`, offset: 0.8 },
      { transform: `translateX(${d * 10}px) translateY(3px) rotate(${d * 8}deg)`, offset: 0.9 },
      { transform: 'none' }] },
  // Tomb Slab ('id:Skill name' = a skill's own move): Barrow throws both headstones out wide, then
  // claps them together on the enemy's face. off = keyframes for the off-hand headstone (.wpn2).
  'barrow:Tomb Slab': { ms: 900, hit: 0.6,
    wpn: [{ transform: 'translate(0px, 0px) rotate(0deg)' },
      { transform: 'translate(24px, -16px) rotate(84deg)', offset: 0.4, easing: 'ease-out' },
      { transform: 'translate(26px, -18px) rotate(92deg)', offset: 0.5, easing: 'cubic-bezier(.6,0,1,.4)' },
      { transform: 'translate(24px, -20px) rotate(24deg)', offset: 0.6 },
      { transform: 'translate(23px, -20px) rotate(28deg)', offset: 0.75 },
      { transform: 'translate(0px, 0px) rotate(0deg)' }],
    off: [{ transform: 'translate(0px, 0px) rotate(0deg)' },
      { transform: 'translate(44px, -30px) rotate(-56deg)', offset: 0.4, easing: 'ease-out' },
      { transform: 'translate(44px, -32px) rotate(-64deg)', offset: 0.5, easing: 'cubic-bezier(.6,0,1,.4)' },
      { transform: 'translate(53px, -32px) rotate(-6deg)', offset: 0.6 },
      { transform: 'translate(52px, -32px) rotate(-10deg)', offset: 0.75 },
      { transform: 'translate(0px, 0px) rotate(0deg)' }],
    body: (d) => [{ transform: 'none' },
      { transform: `translateY(-2px) scaleY(1.04)`, offset: 0.4 },
      { transform: `translateX(${d * 8}px) rotate(${d * 6}deg)`, offset: 0.6 },
      { transform: `translateX(${d * 8}px) rotate(${d * 6}deg)`, offset: 0.75 },
      { transform: 'none' }] },
  // Crypt Breaker: both headstones hoisted high overhead, a rise onto his toes, then a double slam
  // that brings them crashing down together in front of him, like smashing open a crypt lid.
  'barrow:Crypt Breaker': { ms: 1000, hit: 0.78,
    wpn: [{ transform: 'translate(0px, 0px) rotate(0deg)' },
      { transform: 'translate(-14px, -34px) rotate(14deg)', offset: 0.5, easing: 'ease-in-out' },
      { transform: 'translate(-16px, -38px) rotate(6deg)', offset: 0.66, easing: 'cubic-bezier(.6,0,1,.5)' },
      { transform: 'translate(4px, 7px) rotate(140deg)', offset: 0.78 },
      { transform: 'translate(4px, 8px) rotate(137deg)', offset: 0.9 },
      { transform: 'translate(0px, 0px) rotate(0deg)' }],
    off: [{ transform: 'translate(0px, 0px) rotate(0deg)' },
      { transform: 'translate(11px, -44px) rotate(8deg)', offset: 0.5, easing: 'ease-in-out' },
      { transform: 'translate(10px, -48px) rotate(2deg)', offset: 0.66, easing: 'cubic-bezier(.6,0,1,.5)' },
      { transform: 'translate(48px, -12px) rotate(120deg)', offset: 0.78 },
      { transform: 'translate(48px, -11px) rotate(117deg)', offset: 0.9 },
      { transform: 'translate(0px, 0px) rotate(0deg)' }],
    body: (d) => [{ transform: 'none' },
      { transform: 'translateY(-3px) scaleY(1.04)', offset: 0.5 },
      { transform: `translateY(-5px) scaleY(1.06) rotate(${-d * 4}deg)`, offset: 0.66 },
      { transform: `translateX(${d * 10}px) translateY(4px) rotate(${d * 9}deg)`, offset: 0.78 },
      { transform: `translateX(${d * 9}px) translateY(4px) rotate(${d * 8}deg)`, offset: 0.9 },
      { transform: 'none' }] },
  // Mordrek hoists the grave cross up over his shoulder and swings it down across the enemy —
  // a gravedigger's full-weight arc, not a thrust. It hangs a beat at the top, then carves through.
  mordrek: { ms: 820, hit: 0.58,
    wpn: [{ transform: 'rotate(0deg)' },
      { transform: 'translate(-9px, -13px) rotate(-134deg)', offset: 0.36, easing: 'ease-in-out' },
      { transform: 'translate(-11px, -15px) rotate(-142deg)', offset: 0.46, easing: 'cubic-bezier(.6,0,1,.4)' },
      { transform: 'translate(17px, 3px) rotate(88deg)', offset: 0.58 },
      { transform: 'translate(15px, 4px) rotate(82deg)', offset: 0.72 },
      { transform: 'rotate(0deg)' }],
    body: (d) => [{ transform: 'none' },
      { transform: `translateX(${-d * 6}px) translateY(-2px) rotate(${-d * 8}deg)`, offset: 0.36 },
      { transform: `translateX(${-d * 7}px) translateY(-3px) rotate(${-d * 9}deg)`, offset: 0.46 },
      { transform: `translateX(${d * 14}px) translateY(2px) rotate(${d * 10}deg)`, offset: 0.58 },
      { transform: `translateX(${d * 12}px) translateY(2px) rotate(${d * 9}deg)`, offset: 0.72 },
      { transform: 'none' }] },
  // Plant the Marker: stand the cross upright, heave it overhead, and drive it down into the earth.
  // (The planted Grave Cross takes over at the hit; his own .wpn is hidden from then on.)
  // Last Rites: he raises the cross to the sky, and a giant iron one comes down on the target (hurlCross).
  'mordrek:Last Rites': { ms: 760, hit: 0.55,
    wpn: [{ transform: 'rotate(0deg)' },
      { transform: 'translate(0px, -22px) rotate(-18deg)', offset: 0.4, easing: 'ease-out' },
      { transform: 'translate(0px, -24px) rotate(-18deg)', offset: 0.7 },
      { transform: 'rotate(0deg)' }],
    body: (d) => [{ transform: 'none' },
      { transform: `translateY(-5px) rotate(${-d * 6}deg)`, offset: 0.4 },
      { transform: `translateY(-5px) rotate(${-d * 6}deg)`, offset: 0.7 },
      { transform: 'none' }] },
  'mordrek:Plant the Marker': { ms: 1000, hit: 0.72,
    wpn: [{ transform: 'rotate(0deg)' },
      { transform: 'translate(2px, -26px) rotate(-18deg)', offset: 0.45, easing: 'ease-in' },
      { transform: 'translate(10px, 10px) rotate(-18deg)', offset: 0.72 },
      { transform: 'translate(10px, 10px) rotate(-18deg)' }],
    body: (d) => [{ transform: 'none' },
      { transform: `translateY(-6px) rotate(${-d * 5}deg)`, offset: 0.45 },
      { transform: `translateY(4px) rotate(${d * 9}deg)`, offset: 0.72 },
      { transform: 'none' }] },
};
// Mordrek's other named cross swing shares his basic-attack arc (strikePose looks skills up by name).
WEAPON_STRIKES['mordrek:Bonebreaker'] = WEAPON_STRIKES.mordrek;

/* The grave-light climbing the iron: 0 = plain cold metal, 1 = full Pale Host green. The same
   filter functions appear at every stop so the keyframes interpolate instead of snapping. */
const GRAVE_IRON = (n) => `sepia(${n}) saturate(${(1 + 4 * n).toFixed(2)}) hue-rotate(${(62 * n).toFixed(0)}deg) `
  + `brightness(${(1 + 0.1 * n).toFixed(2)}) drop-shadow(0 0 ${(10 * n).toFixed(1)}px rgba(126, 230, 150, ${(0.95 * n).toFixed(2)}))`;

/* GRAVE CROSS: no swing at all. Mordrek walks up and lifts the cross upright in front of the
   enemy's face, holding it out like a warding sign, and the grave-light climbs the iron until it
   burns Pale Host green and pours onto them (graveShine) - the light is the blow. Then he lowers it.
   (wpn frames are in the sprite's own space - enemies are mirrored whole, so no `d` there. The cross
   is drawn tilted 18deg in his hand, so rotate(-18deg) stands it straight up.) */
WEAPON_STRIKES['mordrek:Grave Cross'] = {
  ms: 1300, hit: 0.7, shine: true,
  wpn: [{ transform: 'translate(0px, 0px) rotate(0deg)', filter: GRAVE_IRON(0) },
    { transform: 'translate(7px, -15px) rotate(-18deg)', filter: GRAVE_IRON(0.1), offset: 0.26, easing: 'ease-out' },
    { transform: 'translate(8px, -16px) rotate(-18deg)', filter: GRAVE_IRON(0.55), offset: 0.48 },
    { transform: 'translate(10px, -17px) rotate(-18deg)', filter: GRAVE_IRON(1), offset: 0.7 },
    { transform: 'translate(10px, -17px) rotate(-18deg)', filter: GRAVE_IRON(0.9), offset: 0.86, easing: 'ease-in' },
    { transform: 'translate(0px, 0px) rotate(0deg)', filter: GRAVE_IRON(0) }],
  // He plants his feet and leans into the hold, arm out, as if pressing the light onto them.
  body: (d) => [{ transform: 'none' },
    { transform: `translateX(${d * 3}px) translateY(-2px) rotate(${d * 2}deg)`, offset: 0.26 },
    { transform: `translateX(${d * 5}px) translateY(-2px) rotate(${d * 4}deg)`, offset: 0.7 },
    { transform: `translateX(${d * 4}px) translateY(-1px) rotate(${d * 3}deg)`, offset: 0.86 },
    { transform: 'none' }],
};

/* The light of the lifted cross: a cone of grave-green poured from the head of the cross onto the
   target, swelling as the iron heats (0.36 -> hit) and lingering a moment after, with the target
   lit green at the moment it lands. ms = the whole move's length, hit = its impact fraction. */
function graveShine(u, t, ms, hit) {
  const a = stageBox(u), b = stageBox(t);
  if (reduced || !a || !b) return;
  const d = facing(u);
  const from = { x: a.x + d * a.w * 0.42, y: a.top + a.h * 0.16 };   // the crossing of the lifted cross
  const to = { x: b.x, y: b.top + b.h * 0.5 };
  const len = Math.hypot(to.x - from.x, to.y - from.y) + b.w * 0.25;
  const ang = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI;
  const el = document.createElement('div');
  el.className = 'graveshine';
  Object.assign(el.style, { left: `${from.x}px`, top: `${from.y}px`, width: `${len}px`, height: `${Math.max(b.h * 0.9, 50)}px`,
    transform: `translateY(-50%) rotate(${ang}deg)` });
  el.innerHTML = '<i></i>';
  $('#arena').appendChild(el);
  const life = ms * 1.25;
  el.animate([{ opacity: 0 }, { opacity: 0, offset: 0.36 / 1.25 }, { opacity: 1, offset: hit / 1.25 }, { opacity: 0.85, offset: 0.86 / 1.25 }, { opacity: 0 }],
    { duration: life, fill: 'forwards' });
  setTimeout(() => el.remove(), life + 60);
  setTimeout(() => {
    burst(t, 'grave');
    bodyEl(t)?.animate([{ filter: 'none' }, { filter: 'brightness(1.35) drop-shadow(0 0 12px rgba(126, 230, 150, .95))', offset: 0.3 }, { filter: 'none' }],
      { duration: beat(700) });
  }, ms * hit);
}

// Weapon swing: lean in and twist, or the champion's own attack clip. Resolves at the moment of impact.
// sk (optional) = the skill being swung: a basic Attack can use the champion's WEAPON_STRIKES move.
// pace < 1 runs the same swing through quicker, for flurries that would drag at full length.
async function strikePose(u, fresh = false, sk = null, pace = 1, tg = null) {
  const hit = playAttack(u, fresh);
  if (hit != null) return sleep(hit * pace);
  const d = facing(u);
  // A skill's own move ('barrow:Tomb Slab') first, then the champion's basic-Attack move.
  const ws = sk && (WEAPON_STRIKES[`${u.id}:${sk.name}`] || (sk.id === 'attack' && WEAPON_STRIKES[u.id]));
  const wpn = ws && !reduced && u.hp > 0 && bodyEl(u)?.querySelector('.wpn');
  if (wpn) {
    const ms = beat(ws.ms * pace);
    wpn.animate(ws.wpn, { duration: ms });
    if (ws.off) bodyEl(u).querySelector('.wpn2')?.animate(ws.off, { duration: ms });
    pose(u, ws.body(d), ws.ms * pace);
    if (ws.shine && tg) graveShine(u, tg, ms, ws.hit);   // Grave Cross: the lifted cross pours green light onto them
    await sleep(ms * ws.hit);
    return;
  }
  if (!pose(u, [{ transform: 'none' }, { transform: `translateX(${d * 14}px) rotate(${d * 12}deg)`, offset: 0.4 }, { transform: 'none' }], 240)) return;
  await sleep(beat(100));
}

// Ranged wind-up: a small recoil before the shot.
async function aimPose(u) {
  const hit = playAttack(u);
  if (hit != null) return sleep(hit);
  const d = facing(u);
  if (!pose(u, [{ transform: 'none' }, { transform: `translateX(${-d * 6}px) rotate(${-d * 4}deg)`, offset: 0.5 }, { transform: 'none' }], 260)) return;
  await sleep(beat(120));
}

/* Spells, buffs, summons, guard and potions: a hop with a golden glow.
   `clip` plays the champion's own attack animation instead, which suits a skill they
   perform — a heal, a ward, a summon — but not raising a guard or drinking a draught. */
async function castPose(u, clip = false) {
  const hit = clip ? playAttack(u) : null;
  if (hit != null) return sleep(hit);
  if (!pose(u, [{ transform: 'none', filter: 'none' },
    { transform: 'translateY(-12px)', filter: 'brightness(1.4) drop-shadow(0 0 8px #e8a548)', offset: 0.4 },
    { transform: 'none', filter: 'none' }], 420)) return;
  await sleep(beat(200));
}

/* RAISING THE FALLEN (revive skills: Mortessa's Second Burial). She walks over to the body and
   chants — her hair blown outward, her eyes blazing green, grave-light pulsing over the corpse —
   then the fallen ally rises slowly back onto their feet with eyes lit bright green.
   The revive itself happens at the moment they begin to stand (onRise). */
const EYE_SPOTS = {};   // art id → [{ x, y }] eye positions in the 100x100 art box
async function eyeSpots(u) {
  const id = artOf(u);
  if (EYE_SPOTS[id]) return EYE_SPOTS[id];
  // Built-in sprites are drawn inline; file art is read from the SVG itself.
  let svg = bodyEl(u)?.querySelector('.upic > svg');
  if (!svg && ART_FOLDER[u.faction]) {
    try {
      const txt = await (await fetch(`characters/${ART_FOLDER[u.faction]}/${id}.${ART_EXT}`)).text();
      svg = new DOMParser().parseFromString(txt, 'image/svg+xml').documentElement;
    } catch { svg = null; }
  }
  // Eyes = small round shapes in the head's height band; the front-most (champions face right) wins.
  const found = [];
  svg?.querySelectorAll('circle, ellipse').forEach((c) => {
    const r = +(c.getAttribute('r') || c.getAttribute('ry') || 0), x = +c.getAttribute('cx'), y = +c.getAttribute('cy');
    if (r >= 0.8 && r <= 3.4 && y >= 12 && y <= 46 && x >= 42 && x <= 72) found.push({ x, y });
  });
  found.sort((a, b) => b.x - a.x);
  const eyes = found.length ? found.filter((e) => Math.abs(e.y - found[0].y) < 4 && found[0].x - e.x < 11).slice(0, 2) : [{ x: 57, y: 30 }];
  return (EYE_SPOTS[id] = eyes);
}
async function lightEyes(u) {
  const host = bodyEl(u)?.querySelector('.upic');
  if (!host) return;

async function raiseRitual(u, t, onRise) {
  if (!t) return;   // nobody to raise: never leave the turn hanging
  const trip = t !== u ? await dashTo(u, [t]) : null;   // walk over to the body
  const b = bodyEl(u), ms = beat(1500);
  if (!reduced && b) {
    // Hair blown outward on a grave-wind, fluttering; eyes flare bright green.
    b.querySelectorAll('.hair').forEach((h) => {
      const out = h.classList.contains('hair-r') ? -1 : 1;
      h.animate([{ transform: 'rotate(0deg)' }, { transform: `rotate(${out * 34}deg) scaleX(1.12)`, offset: 0.2 },
        { transform: `rotate(${out * 26}deg) scaleX(1.08)`, offset: 0.4 }, { transform: `rotate(${out * 38}deg) scaleX(1.14)`, offset: 0.6 },
        { transform: `rotate(${out * 28}deg) scaleX(1.1)`, offset: 0.8 }, { transform: 'rotate(0deg)' }], { duration: ms, easing: 'ease-in-out' });
    });
    b.querySelectorAll('.eyelight').forEach((e) => e.animate([{ fill: '#8ee6a0', transform: 'scale(1)', filter: 'none' },
      { fill: '#f2fff4', transform: 'scale(2)', filter: 'drop-shadow(0 0 1.6px #6ff09a)', offset: 0.2 },
      { fill: '#f2fff4', transform: 'scale(2)', filter: 'drop-shadow(0 0 1.6px #6ff09a)', offset: 0.85 },
      { fill: '#8ee6a0', transform: 'scale(1)', filter: 'none' }], { duration: ms }));
    pose(u, [{ filter: 'none', transform: 'none' }, { filter: 'drop-shadow(0 0 6px #6ff09a)', transform: 'translateY(-3px)', offset: 0.25 },
      { filter: 'drop-shadow(0 0 8px #6ff09a)', transform: 'translateY(-3px)', offset: 0.85 }, { filter: 'none', transform: 'none' }], 1500);
    // The incantation: grave-light pulses over the body three times.
    for (const k of [0.05, 0.35, 0.65]) setTimeout(() => burst(t, 'grave'), ms * k);
  }
  await sleep(reduced ? 0 : ms * 0.75);
  // The rise: slow the fallen body's stand-up transition, then bring them back.
  const tb = bodyEl(t);
  // The body stands up slowly, but the death-grey and fade clear almost at once, so the green-lit
  // eyes (inside the body) shine at full strength through the whole rise.
  if (tb && !reduced) tb.style.transition = `transform ${beat(1400)}ms ease-out, opacity ${beat(250)}ms ease-out, filter ${beat(250)}ms ease-out`;
  onRise();
  render();
  lightEyes(t);
  await sleep(reduced ? 0 : ms * 0.25);
  await dashBack(u, trip);
  await sleep(reduced ? 0 : beat(1400) * 0.6 + beat(200));   // let them finish standing
  if (tb) tb.style.transition = '';
}

// Getting hit: knocked back toward its own side, flashing white. Crits hit harder and shake the field.
function knock(t, crit) {
  burst(t, 'hit');
  const back = -facing(t);
  pose(t, [{ transform: 'none', filter: 'none' },
    { transform: `translateX(${back * (crit ? 18 : 10)}px) rotate(${back * (crit ? 8 : 4)}deg)`, filter: 'brightness(2.2)', offset: 0.25 },
    { transform: 'none', filter: 'none' }], crit ? 380 : 280);
  if (crit && !reduced) $('#arena').animate([{ translate: '0 0' }, { translate: '5px -3px' }, { translate: '-4px 3px' }, { translate: '0 0' }], { duration: beat(260) });
}

// Dodging: a quick hop backward.
function dodgeHop(t) {
  const back = -facing(t);
  pose(t, [{ transform: 'none' }, { transform: `translate(${back * 22}px, -10px)`, offset: 0.4 }, { transform: 'none' }], 320);
