  --mp-dim: #22304d;
  --heat: #f08a3d;
  --heat-dim: #3d2a1e;
  --good: #6cc28a;
  --bad: #e0645a;
  --melee: #f08a5d;
  --ranged: #6fb5e6;
  --status: #c48be0;
  --target: #ff8a6b;
  --scrim: rgba(10, 10, 18, .74);
  /* weather skies + particles */
  --sky-ash: #3b2a2c;
  --sky-storm: #1c1f36;
  --sky-rain: #1f3042;
  --sky-sun: #4a3a30;
  --sky-mist: #2b3a3a;
  --rain: rgba(170, 205, 255, .22);
  --flash: rgba(220, 230, 255, .9);
  --ember: rgba(255, 140, 70, .6);
  --ash: rgba(210, 200, 190, .35);
  --mist: rgba(200, 220, 215, .16);
  --sunglow: rgba(255, 200, 120, .28);
  --horizon: #34303d;
  --floorglow: rgba(255, 255, 255, .05);
  --plate: rgba(20, 22, 34, .84);
  --sky-moon: #2e1420;
  --sky-pall: #262e26;
  --cave-rock: #1d1816;
  --cave-rock-hi: #2c2420;
  --cave-floor: #191513;
  --cave-glow: rgba(255, 122, 47, .12);
  --moon: rgba(214, 70, 82, .85);
  --moonglow: rgba(200, 50, 70, .22);
  --font-display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, var(--bg-2), var(--bg) 65%) fixed, var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--font-body);
}
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 40px; padding-inline: 16px; display: grid; gap: 16px; }
.screen { display: grid; gap: 16px; min-width: 0; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.1rem, 5vw, 2.9rem); line-height: 1; color: var(--accent); text-wrap: balance;
}
.tag { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.label { margin: 0; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Buttons */
.btn {
  font: inherit; font-weight: 800; cursor: pointer;
  padding: 9px 16px; border-radius: 9px;
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn.ghost { background: transparent; }
.btn:focus-visible, .act:focus-visible, .pick:focus-visible, .slot:focus-visible, .fbtn:focus-visible, .unit:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* ---------- Team select ---------- */
.tray {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; gap: 12px; padding: 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
}
.trayRow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.trayRow p { margin: 0; color: var(--muted); font-size: .88rem; }
.trayBtns { display: flex; flex-wrap: wrap; gap: 8px; }
/* Your warband: four places, no boxes - each champion's model standing free with their name under it.
   An empty place is a faint dashed ring (the spot waiting to be filled) with its label. */
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 520px; }
.slot {
  font: inherit; color: inherit; text-align: center; cursor: pointer; min-width: 0;
  display: grid; grid-template-rows: 64px auto; justify-items: center; align-items: center; gap: 3px;
  padding: 0; border: 0; background: none;
}
.slot.empty { cursor: default; }
.slot .mini { width: 64px; height: 64px; }
.slot .mini img, .slot .mini svg { width: 100%; height: 100%; display: block; overflow: visible; }
.slot.filled:hover .mini { opacity: .7; }
.slot.filled:hover strong { color: var(--bad); }
.slot .ph { width: 52px; height: 52px; border-radius: 50%; border: 2px dashed var(--line); }
.slot strong { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .8rem; }
.slot small { color: var(--muted); font-size: .72rem; font-weight: 700; }
/* The select screen's Back button floats at the top right; the warband tray's header row leaves room for it
   when the tray sticks to the top. Lined up with the page's right edge on wide screens. */
.topBack {
  position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(12px, calc((100vw - 1320px) / 2 + 16px));
  display: inline-flex; align-items: center; gap: 3px; padding-left: 7px;
  background: rgba(22, 25, 37, .9); backdrop-filter: blur(3px); box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
}
.topBack svg { width: 16px; height: 16px; }
/* On the select screen the page header is gone and the warband sits on the page itself, no panel around it.
   It still sticks to the top while you scroll the roster, so it carries the page's own backdrop (the same fixed
   gradient as the body) edge to edge, with only a soft shadow where the roster slides under it. */
body[data-screen="select"] .top { display: none; }
#selectScreen .tray {
  --gut: 16px; margin-inline: calc(-1 * var(--gut)); padding-inline: var(--gut); border: 0; border-radius: 0;
  background: radial-gradient(120% 70% at 50% 0%, var(--bg-2), var(--bg) 65%) fixed, var(--bg);
  box-shadow: 0 10px 12px -10px rgba(0, 0, 0, .7);
}
.trayHead { min-height: 30px; display: flex; align-items: center; padding-right: 90px; font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.trayNote { color: var(--bad); font-size: .85rem; font-weight: 700; min-height: 1.2em; }
/* Champion creation and progression */
.slot.you strong, .slot.you.empty small { color: var(--accent); }
.slot.you .ph { border-color: var(--accent); }
.pick.me { box-shadow: 0 0 0 2px var(--accent) inset; }
/* Roster tiles: portrait and name; your picks keep their badge and gold frame. */
#factionList.noHeads .faction header { display: none; }
.faction .fmeta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.faction .fmeta span { padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: .76rem; font-weight: 700; }
.faction .fmeta span:first-child { color: var(--accent); border-color: var(--accent); }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.roster .pick { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: start; gap: 4px; padding: 8px 4px 7px; text-align: center; }
.roster .pick .badge { top: 5px; right: 5px; width: 20px; height: 20px; font-size: .72rem; }
.roster .pick .pic { width: 60px; height: 60px; grid-row: auto; }
.roster .pick .nm { padding: 0; font-size: .76rem; line-height: 1.15; }
.roster .pick[aria-expanded="true"] { border-color: var(--accent); background: var(--panel-hi); }
/* The drop-down under the roster. */
.rdetail { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--accent); background: var(--panel); }
.rdetail .rdhead { display: flex; gap: 10px; align-items: flex-start; }
.rdetail .rdhead > div:first-child { flex: 1; min-width: 0; display: grid; gap: 3px; }
.rdetail .rdhead b { font-family: var(--font-display); font-size: 1.2rem; }
.rdetail .rdhead .roles { display: flex; gap: 4px; }
.rdetail .rdhead .bio { margin: 0; font-size: .82rem; color: var(--muted); }
.rdetail .rdhead .btn { flex: none; }
.rdetail .sk { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: .82rem; color: var(--muted); line-height: 1.3; }
.rdetail .sk li { display: flex; gap: 8px; align-items: flex-start; }
.rdetail .sk .sic { flex: none; width: 28px; height: 28px; }
.rdetail .sk b { color: var(--fg); }
.rdetail .sk .pas b { color: var(--accent); }
.rdetail .sk li.nat b { color: #8fd6a0; }
.nameRow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.nameRow label { font-size: .85rem; font-weight: 800; color: var(--accent); }
.nameRow input {
  font: inherit; font-weight: 700; color: var(--fg); background: none; border: 0; border-bottom: 2px solid var(--line);
  border-radius: 0; padding: 4px 2px; width: min(260px, 100%);
}
.nameRow input:focus-visible { outline: none; border-bottom-color: var(--accent); }
.xpbar { position: relative; height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; min-width: 90px; }
.xpbar > div { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), #f2c46d); }
.xpnum { font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.xpline { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; }
.xpline .xpnum { grid-column: 2; }
.xpgain { color: var(--accent); font-size: 1.05rem; }
.xpkill { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
.herotag {
  display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 4px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); min-width: 0;
}
.herotag .hmini { width: 30px; height: 30px; flex: none; border-radius: 50%; overflow: hidden; background: var(--panel-2); position: relative; }
.herotag .hmini svg, .herotag .hmini img { position: absolute; width: 170%; height: 170%; left: -35%; top: -12%; max-width: none; }
.herotag .hinfo { display: grid; gap: 2px; min-width: 0; }
.herotag b { font-size: .85rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.herotag .xpbar { min-width: 110px; height: 5px; }
/* Dungeon results: the warband's health between rooms, and the chest. */
.dgparty { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.dgparty li { display: grid; grid-template-columns: 32px 90px minmax(0, 1fr) 64px; align-items: center; gap: 8px; font-size: .86rem; }
.dgparty .mini { width: 32px; height: 32px; }
.dgparty .mini svg, .dgparty .mini img { width: 100%; height: 100%; display: block; }
.dgparty b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dgparty .hpbar { height: 8px; border-radius: 4px; background: var(--hp-dim); overflow: hidden; }
.dgparty .hpbar span { display: block; height: 100%; background: var(--hp); }
.dgparty small { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.chest ul { margin: 4px 0 0; padding-left: 18px; }
.chest li.first { color: var(--good); font-weight: 800; }
/* Emberhollow Cave panel: depth cards and the bestiary. */
.depths { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
/* Training Yard cards: the technique's icon beside its name, and a row of pips counting drills done. */
.trow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; }
.tic > * { width: 100%; height: 100%; display: block; }   /* skill icons come through as <img class="sic"> */
.pips { display: flex; gap: 5px; }
.pip { width: 100%; max-width: 34px; height: 6px; border-radius: 99px; background: var(--line); }
.pip.on { background: var(--accent); }
.depth.learned { border-color: var(--good); opacity: .78; }
.learnt { color: var(--good); font-weight: 700; }
.bsub { font-family: var(--font-body); font-size: .8rem; font-weight: 500; color: var(--muted); }
.depth { display: grid; gap: 6px; align-content: start; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.depth.locked { opacity: .6; }
.depth h3 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; }
.depth p { margin: 0; font-size: .86rem; color: var(--muted); }
.depth small { font-size: .74rem; color: var(--accent); font-weight: 700; }
.depth .btn { justify-self: start; }
.depth small.reward { color: var(--good); }
/* A dungeon's standing condition (DG_CONDS), so the choice is made before setting out. */
.depth small.cond { color: var(--heat); font-weight: 700; }
.dmini .mini.boss { width: 52px; height: 52px; margin-left: auto; }
.dmini { display: flex; gap: 4px; }
.dmini .mini, .beast .mini { width: 40px; height: 40px; flex: none; }
.dmini .mini svg, .dmini .mini img, .beast .mini svg, .beast .mini img { width: 100%; height: 100%; display: block; }
.bhead { margin: 6px 0 0; font-family: var(--font-display); font-size: 1.3rem; }
.bestiary { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.beast { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.beast p { margin: 2px 0; font-size: .82rem; color: var(--muted); }
.beast small { font-size: .74rem; color: var(--ranged); font-weight: 700; }
/* Skills screen: slot row on top, the pool of skills below. */
.loadout { display: grid; gap: 22px; }
.lsec { display: grid; gap: 10px; }
.lsec header { display: grid; gap: 4px; }
.lsec h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; }
.lslots { display: flex; flex-wrap: wrap; gap: 8px; }
.lslot {
  display: flex; align-items: center; gap: 8px; min-height: 46px; min-width: 150px; padding: 6px 12px 6px 6px;
  border-radius: 10px; border: 1px dashed var(--line); background: var(--panel-2); font-size: .88rem; font-weight: 700;
}
.lslot.filled { border-style: solid; border-color: var(--accent); }
.lslot.empty span { color: var(--muted); padding-left: 6px; }
.lslot.locked { opacity: .55; }
.lslot.locked span { color: var(--muted); padding-left: 6px; font-weight: 600; }
.lslot .sic { width: 32px; height: 32px; flex: none; }
.lpool { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.lcard {
  font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0;
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: start;
  padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
.lcard:hover { border-color: var(--accent); }
.lcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lcard.on { border-color: var(--accent); background: var(--panel-hi); }
/* Untrained technique: visible so you know what to aim for, dimmed so you know you can't carry it yet. */
.lcard.locked { opacity: .5; border-style: dashed; }
.lcard.locked:hover { border-color: var(--line); }
.lcard.locked .lstate { color: var(--muted); }
/* Fixed icon box, so a skill without an icon file (generic passives, for now) keeps the layout. */
.lcard .lic { width: 40px; height: 40px; border-radius: 9px; background: var(--panel-2); display: block; }
.lcard .lic .sic { width: 100%; height: 100%; display: block; }
.lcard .lt { display: grid; gap: 2px; min-width: 0; }
.lcard .lt small { font-size: .72rem; font-weight: 700; color: var(--ranged); }
.lcard .ld { font-size: .82rem; color: var(--muted); line-height: 1.3; }
.lcard .lstate { font-size: .74rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
.lcard.on .lstate { color: var(--accent); }
/* Skill ranks: the trained-rank line and +1 Rank chip on loadout cards, and the R badge on battle buttons. */
.lcard .rkrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 3px; }
.lcard .rkd { font-size: .72rem; font-weight: 800; color: var(--accent); }
.rkup {
  font-size: .72rem; font-weight: 800; cursor: pointer; white-space: nowrap;
  padding: 2px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent);
}
.rkup:hover, .rkup:focus-visible { background: var(--accent); color: #1a1407; outline: none; }
.rkb {
  font-size: .62rem; font-weight: 800; line-height: 1; padding: 3px 6px; margin-left: 6px;
  border-radius: 999px; background: var(--accent); color: #1a1407; white-space: nowrap;
}

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
/* The filters as an even grid: the eight faction buttons in two rows of four, the five roles in one row. */
#filters { display: grid; gap: 6px; max-width: 640px; }
#filters .fgroup { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
#filters .fgroup.roles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
#filters .fbtn { min-width: 0; padding: 5px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fbtn {
  font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
  padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--muted);
}
.fbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: var(--panel-hi); }

.faction { display: grid; gap: 10px; }
.faction header { display: grid; gap: 4px; }
.faction h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; }
.rule { margin: 0; color: var(--muted); font-size: .9rem; max-width: 75ch; }
.rule b { color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.pick {
  font: inherit; color: inherit; text-align: left; cursor: pointer; position: relative; min-width: 0;
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 12px; align-content: start;
  padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  transition: border-color .15s, background .15s;
}
.pick:hover { border-color: var(--accent); }
.pick.sel { border-color: var(--accent); background: var(--panel-hi); }
.pick .pic { width: 64px; height: 64px; grid-row: span 3; }
.pick .nm { font-weight: 800; font-size: 1.02rem; padding-right: 26px; }
.pick .roles { display: flex; gap: 4px; align-items: center; }
.pick .bio { margin: 0; font-size: .82rem; color: var(--muted); }
.pick .sk { grid-column: 1 / -1; list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: .8rem; color: var(--muted); line-height: 1.3; }
.pick .sk b { color: var(--fg); }
/* A champion's Nature: the always-on trait no loadout swaps away. Soft green wherever it shows. */
.pick .sk li.nat b, .cpas.nat b { color: #8fd6a0; }
.pick .sk li { display: flex; gap: 8px; align-items: flex-start; }
.pick .sk .sic { flex: none; width: 28px; height: 28px; }
.pick .sk .pas b { color: var(--accent); }
.pick .badge {
  position: absolute; top: 9px; right: 9px; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .8rem;
}
.role {
  justify-self: start; font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor;
}
.role.melee { color: var(--melee); }
.role.ranged { color: var(--ranged); }
.role.support { color: var(--good); }

/* ---------- Battle ---------- */
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
/* The gauntlet ladder now rides at the foot of the battle screen, centred under the field and log. */
#battleScreen > .ladder { justify-content: center; margin: 2px 0; }
.ladder li {
  display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); font-size: .82rem;
}
.ladder .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); font-weight: 800; font-size: .74rem; }
.ladder li.done { color: var(--fg); }
.ladder li.done .n { background: var(--good); color: var(--bg); }
.ladder li.now { border-color: var(--accent); color: var(--fg); }
.ladder li.now .n { background: var(--accent); color: var(--accent-ink); }

/* Speed bar: allies ride above the rail, enemies below; the Act gate is on the right. */
.speed { display: grid; gap: 6px; padding: 10px 14px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
/* Round counter floats on the top-left corner of the battlefield (High Tide shows beside it on even
   rounds); the fast-forward / log / speed buttons group on the bottom-right. Both ride over the arena
   as translucent pills, like the weather pill. */
.arena > .round {
  position: absolute; z-index: 250; top: 8px; left: 8px;
  padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(22, 25, 37, .82); backdrop-filter: blur(3px);
  color: var(--muted); font-size: .78rem; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.arena > .round:empty { display: none; }   /* nothing before the first round starts */
.arena > .round b { color: var(--ranged); }
.fieldCtrls { position: absolute; z-index: 250; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; }
/* Battle controls: speed toggle (1.5× ⇄ 2×, gold when doubled), Hide log, and the fast-forward. */
.speedBtn {
  align-self: center; flex: none; font: inherit; font-size: .74rem; font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer;
  min-width: 46px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(22, 25, 37, .82); backdrop-filter: blur(3px); color: var(--fg);
}
.speedBtn:hover { border-color: var(--accent); }
/* Battle log hidden (the Hide log button, remembered per browser): the field takes the full width. */
body.logHidden .chron { display: none; }
body.logHidden .battleGrid { grid-template-columns: minmax(0, 1fr); }
.speedBtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1410; }
/* Fast forward: appears beside the speed toggle only while your champion is down (see FFWD). */
.ffwdBtn { min-width: 40px; }
.ffwdBtn[aria-pressed="true"] { background: var(--melee); border-color: var(--melee); color: #1a1410; }
/* Bolt-On: the bolted-on drone is carried to the host's slot (settleLatch sets the translate). */
.latched { transition: translate .5s ease; }
.track { position: relative; height: 104px; margin-inline: 22px 52px; }
.rail {
  position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%);
  border-radius: 3px; background: linear-gradient(90deg, var(--panel-2), var(--line) 85%, var(--accent));
}
.lane { position: absolute; left: -2px; font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; opacity: .7; }
.lane.p { bottom: 8px; }
.lane.e { top: 8px; }
.goal {
  position: absolute; right: -46px; top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
}
.goal svg { width: 22px; height: auto; }
.tok {
  position: absolute; left: calc(var(--x, 0) * 1%); width: 40px; height: 40px; margin-left: -20px;
  transition: left var(--dur, 400ms) linear, transform .2s; z-index: 1;
}
.tok.p { top: 0; }
.tok.e { bottom: 0; }
/* Knocked back (renderTrack, FLEE_MS): faces the other way, bobs as it runs, and shows its fright. */
.tok.flee .face { animation: tokFlee .9s ease-out; }
.tok.flee::after { content: '😱'; position: absolute; left: 50%; top: -15px; translate: -50% 0; font-size: 15px; line-height: 1; pointer-events: none; animation: tokFright .9s ease-out forwards; }
.tok.e.flee::after { top: auto; bottom: -15px; }
@keyframes tokFlee { 0%, 100% { transform: none; } 12%, 88% { transform: scaleX(-1); } 30%, 62% { transform: scaleX(-1) translateY(-3px); } 46%, 78% { transform: scaleX(-1) translateY(0); } }
@keyframes tokFright { 0% { opacity: 0; scale: .5; } 15% { opacity: 1; scale: 1.15; } 75% { opacity: 1; scale: 1; } 100% { opacity: 0; } }
.tok .face {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  background: var(--panel-2); border: 2px solid var(--accent);
}
.tok.e .face { border-color: var(--bad); }
.tok .face svg, .tok .face img { position: absolute; width: 170%; height: 170%; left: -35%; top: -12%; max-width: none; object-fit: contain; }
.tok.e .face svg, .tok.e .face img { transform: scaleX(-1); }
/* Four-legged bodies keep their head on the right, so crop there instead. */
.tok.body-beast .face svg, .tok.body-beast .face img,
.tok.body-boar .face svg, .tok.body-boar .face img { left: -72%; top: -37%; }
.tok.e.body-beast .face svg, .tok.e.body-beast .face img,
.tok.e.body-boar .face svg, .tok.e.body-boar .face img { left: 0; }
.tok.body-bot .face svg, .tok.body-bot .face img { top: -2%; }
/* Monster crops: low bodies show their head/eyes, the troll its face. */
.tok.body-spider .face svg, .tok.body-spider .face img { top: -55%; left: -55%; }
.tok.e.body-spider .face svg, .tok.e.body-spider .face img { left: -15%; }
.tok.body-slime .face svg, .tok.body-slime .face img { top: -55%; left: -50%; }
.tok.e.body-slime .face svg, .tok.e.body-slime .face img { left: -20%; }
.tok.body-bat .face svg, .tok.body-bat .face img { top: -30%; }
.tok.body-shroom .face svg, .tok.body-shroom .face img { top: -30%; }
.tok.body-troll .face svg, .tok.body-troll .face img { top: -8%; left: -60%; }
.tok.e.body-troll .face svg, .tok.e.body-troll .face img { left: -10%; }
.tok.body-ghoul .face svg, .tok.body-ghoul .face img { top: -10%; left: -62%; }
.tok.e.body-ghoul .face svg, .tok.e.body-ghoul .face img { left: -8%; }
.tok.body-golem .face svg, .tok.body-golem .face img { top: 0; }
.tok.body-drake .face svg, .tok.body-drake .face img { top: -5%; left: -78%; }
.tok.e.body-drake .face svg, .tok.e.body-drake .face img { left: 6%; }
/* Bosses: biggest on the field, with a gold nameplate; a pulsing red glow while winding up a big attack. */
.unit.boss { --size: clamp(84px, 21cqw, 230px); }
.unit.boss .plate { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.unit.winding .body { animation: windup .8s ease-in-out infinite; }
@keyframes windup { 50% { filter: drop-shadow(0 0 14px #ff5a3a) brightness(1.15); } }
.arena[data-dg="crypt"] { --cave-rock: #141c1e; --cave-rock-hi: #1f2a2c; --cave-floor: #111718; --cave-glow: rgba(90, 200, 180, .14); }
.arena[data-dg="mine"]  { --cave-rock: #211a14; --cave-rock-hi: #30261c; --cave-floor: #18120e; --cave-glow: rgba(255, 170, 80, .14); }
.arena[data-dg="spire"] { --cave-rock: #241210; --cave-rock-hi: #351a16; --cave-floor: #1a0e0c; --cave-glow: rgba(255, 80, 40, .2); }
.arena[data-dg="manor"]  { --cave-rock: #1a1424; --cave-rock-hi: #271d35; --cave-floor: #130f1a; --cave-glow: rgba(180, 120, 230, .16); }
.arena[data-dg="castle"] { --cave-rock: #171b24; --cave-rock-hi: #232a38; --cave-floor: #0f1218; --cave-glow: rgba(120, 150, 210, .16); }
.arena[data-dg="coven"]  { --cave-rock: #121d16; --cave-rock-hi: #1c2c20; --cave-floor: #0d140f; --cave-glow: rgba(120, 220, 140, .18); }
/* Castle Harrowgate: one palette per battlefield — the fogged road, the grey ruin,
   the candlelit hall, and the rose-lit ballroom (see roomLooks). */
.arena[data-dg="hroad"] { --cave-rock: #1d1a16; --cave-rock-hi: #2b2620; --cave-floor: #16130e; --cave-glow: rgba(214, 80, 80, .13); }
.arena[data-dg="hruin"] { --cave-rock: #1b1d22; --cave-rock-hi: #2a2d34; --cave-floor: #121419; --cave-glow: rgba(200, 190, 160, .12); }
.arena[data-dg="hhall"] { --cave-rock: #221a12; --cave-rock-hi: #342818; --cave-floor: #181107; --cave-glow: rgba(240, 200, 120, .15); }
.arena[data-dg="hball"] { --cave-rock: #241620; --cave-rock-hi: #372231; --cave-floor: #170e14; --cave-glow: rgba(240, 160, 200, .16); }
/* Summons: smaller icons; illusions are see-through. */
.tok.summon { width: 32px; height: 32px; margin-left: -16px; }
.tok.p.summon { top: 4px; }
.tok.e.summon { bottom: 4px; }
.tok.summon .face { border-style: dashed; }
.tok.illusion .face, .unit.illusion .upic { opacity: .6; filter: hue-rotate(160deg) saturate(1.4); }
.tok .st {
  position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: .6rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  padding: 0 5px; border-radius: 999px; line-height: 14px; background: var(--bg); border: 1px solid currentColor;
}
.tok.p .st { top: -15px; }
.tok.e .st { bottom: -15px; }
.tok.frozen .face { filter: grayscale(.85) brightness(.8); }
.tok.frozen .st { color: var(--bad); }
.tok.stagger .face { box-shadow: 0 0 0 3px rgba(240, 138, 61, .5); }
.tok.stagger .st { color: var(--heat); }
.tok.halt .face { animation: wobble .3s ease-in-out infinite; }
@keyframes wobble { 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
.tok.slow .face { box-shadow: 0 0 0 3px rgba(111, 181, 230, .5); }
.tok.slow .st { color: var(--ranged); }
/* On their turn, the champion's token leaves its lane and drops into the circular Act gate, filling
   it: left:100% + the token's own -margin pins its centre to the gate's, top:50% with margin-top
   = -half its height centres it vertically (independent of track height), and translateX nudges it
   onto the gate centre. The sword & shield behind is covered by the portrait. */
.tok.acting { left: 100%; top: 50%; bottom: auto; margin-top: -20px; z-index: 4; transform: translateX(23px) scale(1.05); }
.tok.summon.acting { margin-top: -16px; }
.tok.acting .face { box-shadow: 0 0 0 3px var(--accent), 0 0 14px var(--accent); }
.tok.down { display: none; }

/* Battlefield: a side-view stage. Champions stand on it by their feet (--x, --y in % of the stage). */
.arena {
  --sky-now: var(--sky);
  position: relative; overflow: hidden; isolation: isolate; container-type: inline-size;
  aspect-ratio: 16 / 8; min-height: 330px; border-radius: 14px;
  background:
    radial-gradient(60% 18% at 50% 72%, var(--floorglow), transparent 70%),
    linear-gradient(to bottom, var(--sky-now) 0 34%, var(--horizon) 34% 36%, var(--ground) 36% 100%);
}
/* No z-index here on purpose: champions from both sides share one layer, so a runner can pass in front. */
.arena > .side { position: absolute; inset: 0; pointer-events: none; }
.arena::before, .arena::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: 0; transition: opacity .8s; }
.arena[data-wx="ash"] { --sky-now: var(--sky-ash); }
/* Brimstone Fall: the warning sky (yellow and bright orange two rounds out, dusky beige-orange the
   round before) and the burning sky of the round itself. Meteors land in .meteorHit flashes. */
.arena[data-omen="2"] {
  background: radial-gradient(60% 18% at 50% 72%, var(--floorglow), transparent 70%),
    linear-gradient(to bottom, #ffd45c 0%, #f9a53a 18%, #ef7b22 34%, var(--horizon) 34% 36%, var(--ground) 36% 100%);
}
.arena[data-omen="1"] {
  background: radial-gradient(60% 18% at 50% 72%, var(--floorglow), transparent 70%),
    linear-gradient(to bottom, #cfae8a 0%, #b88a62 16%, #9c6040 34%, var(--horizon) 34% 36%, var(--ground) 36% 100%);
}
.arena[data-wx="brim"] {
  background: radial-gradient(60% 18% at 50% 72%, rgba(255, 110, 40, .35), transparent 70%),
    linear-gradient(to bottom, #3a0d08 0%, #7a1f10 20%, #c2441a 34%, var(--horizon) 34% 36%, var(--ground) 36% 100%);
}
.fireball { filter: drop-shadow(0 0 7px #ff7a2f) drop-shadow(0 0 2px #ffd27a); }
.meteorHit {
  position: absolute; left: 0; top: 0; z-index: 240; width: 46px; height: 24px; margin: -12px 0 0 -23px; pointer-events: none;
  border-radius: 50%; background: radial-gradient(closest-side, #fff3b8, #ff9a3a 45%, rgba(255, 80, 30, 0) 78%);
  animation: meteorHit .55s ease-out forwards;
}
@keyframes meteorHit {
  from { transform: translate(var(--x), var(--y)) scale(.3); opacity: 1; }
  to { transform: translate(var(--x), var(--y)) scale(1.7); opacity: 0; }
}
.arena[data-wx="storm"] { --sky-now: var(--sky-storm); }
.arena[data-wx="rain"] { --sky-now: var(--sky-rain); }
.arena[data-wx="sun"] { --sky-now: var(--sky-sun); }
.arena[data-wx="mist"] { --sky-now: var(--sky-mist); }
.arena[data-wx="pall"] { --sky-now: var(--sky-pall); }
.arena[data-wx="rain"]::before, .arena[data-wx="storm"]::before {
  opacity: 1; background-image: repeating-linear-gradient(100deg, transparent 0 9px, var(--rain) 9px 10px);
  background-size: 60px 60px; animation: rain .5s linear infinite;
}
.arena[data-wx="storm"]::after { background: var(--flash); animation: flash 6s infinite; }
.arena[data-wx="ash"]::before {
  opacity: 1;
  background-image: radial-gradient(circle, var(--ember) 0 1.5px, transparent 2px), radial-gradient(circle, var(--ash) 0 1.2px, transparent 1.8px);
  background-size: 46px 46px, 31px 31px; animation: ashfall 6s linear infinite;
}
.arena[data-wx="mist"]::before {
  opacity: 1; background: linear-gradient(90deg, transparent, var(--mist) 30%, transparent 60%, var(--mist) 85%, transparent);
  background-size: 200% 100%; animation: mist 14s linear infinite;
}
/* Underground: a rock ceiling with stalactites and a faint ember glow instead of a sky. */
.arena[data-wx="cave"] {
  --sky-now: var(--cave-rock);
  background:
    radial-gradient(60% 30% at 50% 100%, var(--cave-glow), transparent 70%),
    linear-gradient(to bottom, var(--sky-now) 0 34%, var(--horizon) 34% 36%, var(--cave-floor) 36% 100%);
}
.arena[data-wx="cave"]::before {
  opacity: 1;
  background:
    linear-gradient(180deg, var(--cave-rock-hi), transparent 14%),
    conic-gradient(from 160deg at 6% 0, transparent 0 40deg, var(--cave-rock-hi) 40deg 46deg, transparent 46deg),
    conic-gradient(from 170deg at 31% 0, transparent 0 18deg, var(--cave-rock-hi) 18deg 24deg, transparent 24deg),
    conic-gradient(from 165deg at 58% 0, transparent 0 28deg, var(--cave-rock-hi) 28deg 33deg, transparent 33deg),
    conic-gradient(from 172deg at 84% 0, transparent 0 14deg, var(--cave-rock-hi) 14deg 20deg, transparent 20deg);
}
/* Earthquake (underground only): the whole arena judders and grit rains from the ceiling.
   The shake uses `transform` because the crit hit-shake animates `translate` — both can run at once. */
.arena.quake { animation: quakeShake .42s linear infinite; }
/* Ground Pound (skill option `quake`, quakeFx): the same judder and grit, two beats long. */
.arena.tremor { animation: quakeShake .42s linear 2; }
.arena.quake::after, .arena.tremor::after {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .55;
  background:
    radial-gradient(1.5px 1.5px at 18% 10%, rgba(214, 196, 170, .9), transparent),
    radial-gradient(1.5px 1.5px at 44% 26%, rgba(214, 196, 170, .75), transparent),
    radial-gradient(2px 2px at 67% 8%, rgba(214, 196, 170, .85), transparent),
    radial-gradient(1.5px 1.5px at 88% 30%, rgba(214, 196, 170, .7), transparent);
  background-size: 160px 220px, 130px 180px, 190px 260px, 110px 150px;
  animation: gritfall 1.5s linear infinite;
}
@keyframes quakeShake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(3px, -2px); }
  60% { transform: translate(-2px, -2px); }
  80% { transform: translate(2px, 2px); }
}
@keyframes gritfall { to { background-position: 10px 220px, -8px 180px, 6px 260px, -5px 150px; } }
.arena[data-wx="moon"] { --sky-now: var(--sky-moon); }
.arena[data-wx="moon"]::before {
  opacity: 1;
  background: radial-gradient(circle at 82% 12%, var(--moon) 0 22px, var(--moonglow) 24px, transparent 90px),
              radial-gradient(120% 60% at 50% 0%, var(--moonglow), transparent 70%);
}
.arena[data-wx="sun"]::before { opacity: 1; background: radial-gradient(80% 55% at 50% 0%, var(--sunglow), transparent 70%); }
@keyframes rain { to { background-position: -12px 60px; } }
@keyframes ashfall { to { background-position: 46px 92px, -31px 62px; } }
@keyframes mist { to { background-position: -200% 0; } }
@keyframes flash { 0%, 92%, 100% { opacity: 0; } 93% { opacity: .45; } 95% { opacity: 0; } 96% { opacity: .3; } }
.wxAnnounce {
  position: absolute; inset: 0; z-index: 300; pointer-events: none; display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05;
  color: var(--fg); text-shadow: 0 2px 0 var(--bg), 0 0 18px var(--bg); opacity: 0;
}
.wxAnnounce small { display: block; font-family: var(--font-body); font-size: .9rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.wxAnnounce.show { animation: announce 1.9s ease; }
@keyframes announce { 0% { opacity: 0; transform: scale(.92); } 15%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }

/* Weather bar */
/* Weather pill: top centre of the battlefield. Icon, name and rounds left; tap for the full effect. */
.wxPill {
  position: absolute; z-index: 250; top: 8px; left: 50%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 6px; max-width: calc(100% - 16px); padding: 4px 12px 4px 8px; cursor: pointer;
  border-radius: 999px; border: 1px solid var(--line); background: rgba(22, 25, 37, .82); backdrop-filter: blur(3px);
  color: var(--fg); font: inherit; font-size: .85rem; white-space: nowrap;
}
.wxPill:hover, .wxPill[aria-expanded="true"] { border-color: var(--accent); }
.wxPill .wxi { font-size: 1.05rem; line-height: 1; }
.wxPill .wxn { font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
.wxPill .wxl { padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: .72rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.wxPill .wxl:empty { display: none; }
.wxPill.changed { animation: wxPulse 1.4s ease; }
.wxPop {
  position: absolute; z-index: 260; top: 46px; left: 50%; transform: translateX(-50%); width: min(320px, calc(100% - 16px));
  display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--accent);
  background: rgba(22, 25, 37, .95); box-shadow: 0 8px 22px rgba(0, 0, 0, .45); font-size: .85rem; line-height: 1.35;
}
.wxPop p { margin: 0; }
.wxPop .wxf { color: var(--accent); font-size: .76rem; font-weight: 800; }
.wxPop .wxf:empty { display: none; }
.wxPop .wxx { color: var(--muted); font-size: .8rem; }
.wxPop .wxx b { color: var(--fg); }
@keyframes wxPulse { 30% { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 165, 72, .25); } }
/* A champion on the battlefield: status chips, nameplate, then the body standing on its feet point. */
.unit {
  --size: clamp(54px, 13cqw, 150px);
  position: absolute; left: calc(var(--x, 50) * 1%); top: calc(var(--y, 90) * 1%);
  transform: translate(-50%, -100%);
  width: calc(var(--size) * 1.2); display: flex; flex-direction: column; align-items: center; gap: 2px;
  pointer-events: auto; transition: left .5s ease, top .5s ease;
}
.unit.summon { --size: clamp(44px, 9.5cqw, 110px); }
/* Dungeon chase: a wounded monster turns tail and runs off the right edge; then the warband runs after it. */
.unit.fleeing { transition: left 1s ease-in, opacity .7s ease-in .3s; opacity: 0; pointer-events: none; }
.unit.e.fleeing .upic svg, .unit.e.fleeing .upic img { transform: none; }
.unit.running { transition: left 1.7s ease-in; pointer-events: none; }
.unit.running .body { animation: runBob .3s ease-in-out infinite !important; }
@keyframes runBob { 50% { transform: translateY(-7%) rotate(4deg); } }
.chaseFade { position: absolute; inset: 0; z-index: 50; background: #07060a; opacity: 0; transition: opacity .55s ease; pointer-events: none; }
.chaseFade.dark { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .unit.running .body { animation: none !important; } }
.unit.elite { --size: clamp(68px, 17cqw, 190px); }
.unit.elite .plate { border-color: var(--bad); }
.unit .chips { justify-content: center; min-height: 0; gap: 2px; }
.unit .chip { font-size: .5rem; line-height: 11px; padding: 0 4px; background: var(--plate); }
/* The chip's label slowly fades away, leaving just the icon. Anything that touches the champion —
   damage, a mend, a new status — restamps the unit's last-touched time (float / addFx), and render
   feeds it in as a negative delay (--chipAge), so the fade runs on across re-renders and the words
   come back whenever something new lands. */
.unit .chip .txt {
  display: inline-block; vertical-align: top; overflow: hidden; max-width: 16ch;
  animation: chipTxt 10s linear var(--chipAge, 0ms) forwards;
}
@keyframes chipTxt { 0%, 55% { opacity: 1; max-width: 16ch; } 85% { opacity: 0; } 100% { opacity: 0; max-width: 0; } }
@media (prefers-reduced-motion: reduce) { .unit .chip .txt { animation: none; } }
/* Battle text wears Google Sans a size down: with eight champions (plus summons) on the field,
   plates and chips must hug their content or they hide whoever stands behind them. */
body[data-screen="battle"] { font-family: 'Google Sans', var(--font-body); }
.plate {
  width: 100%; max-width: 118px; display: grid; gap: 1px; padding: 2px 4px 3px;
  border-radius: 7px; background: var(--plate); border: 1px solid var(--line); transition: border-color .15s;
}
.unit.summon .plate { border-style: dashed; }
/* Covering Fire countdown: a round dial hung off the left of the plate. The gold ring fills as the
   field's turns tick by; the number is the turns left until her free shot, and it glows on the last. */
.unit .plate:has(.watchdial) { position: relative; }
.watchdial { position: absolute; right: calc(100% + 3px); top: 0; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--accent) var(--fill, 0deg), rgba(255, 255, 255, .14) 0); box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.watchdial b { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; background: var(--plate);
  font: 700 .58rem/1 var(--font-body); color: var(--accent); }
.watchdial.ready { animation: watchReady 1s ease-in-out infinite; }
.watchdial.ready b { color: #fff3c4; }
@keyframes watchReady { 50% { box-shadow: 0 0 0 2px rgba(232, 165, 72, .35), 0 0 10px rgba(255, 200, 90, .9); } }
.unit.down .watchdial { display: none; }
.unit.acting .plate { border-color: var(--accent); }
/* Your own champion on the field: a gold star and a gold name on the plate, every turn. */
.unit.you .who strong { color: var(--accent); }
.unit.you .who strong::before { content: '★ '; }
.unit.targetable { cursor: pointer; }
.unit.targetable .plate { border-color: var(--target); }
.unit.targetable.ally .plate { border-color: var(--good); }
.who { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; min-width: 0; }
.who strong { font-size: .66rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lvl { font-size: .5rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.unit .bar { height: 9px; border-radius: 4px; }
.unit .bar span { font-size: .52rem; line-height: 9px; padding-inline: 4px; }
.unit .bar.heat { height: 5px; }
.unit .bar.heat span { display: none; }
.bar.mp { background: var(--mp-dim); }
.bar.mp .fill { background: var(--mp); }
.unit .bar.mp { height: 5px; }
.unit .bar.mp span { display: none; }
.body {
  position: relative; width: var(--size); height: var(--size); transform-origin: 50% 100%;
  animation: idle 2.6s ease-in-out infinite; animation-delay: var(--d, 0s);
}
/* Ring under the feet: gold for whoever is acting, red/green when you can target them. */
.body::before {
  content: ''; position: absolute; left: 8%; right: 8%; bottom: -5%; height: 16%; border-radius: 50%; z-index: -1;
}
.unit.acting .body::before { background: radial-gradient(closest-side, rgba(232, 165, 72, .65), transparent); }
.unit.targetable .body::before { background: radial-gradient(closest-side, rgba(255, 138, 107, .8), transparent); animation: ringPulse 1s ease-in-out infinite; }
.unit.targetable.ally .body::before { background: radial-gradient(closest-side, rgba(108, 194, 138, .8), transparent); }
/* Heat aura: wraps the sprite in a glow that grows and reddens as --heat-glow (0→1) climbs.
   Driven per-unit in render(); 0 for anyone who isn't a live Ironclad champion. */
.body::after {
  content: ''; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none;
  inset: calc(-6% - 18% * var(--heat-glow, 0));
  opacity: var(--heat-glow, 0);
  background: radial-gradient(closest-side,
    rgba(255, 190, 90, .55) 0%,
    rgba(255, 110, 40, .5) 38%,
    rgba(214, 44, 22, .3) 60%,
    transparent 76%);
  transition: inset .35s ease, opacity .35s ease;
}
.unit.overheating .body::after { animation: heatPulse .7s ease-in-out infinite; }
@keyframes heatPulse { 50% { filter: brightness(1.45) saturate(1.3); transform: scale(1.1); } }
.unit.frozen .body { animation-play-state: paused; filter: grayscale(.45); }
.unit.down .body { animation: none; transform: rotate(var(--fall, -82deg)) translateY(12%); opacity: .45; filter: grayscale(1); transition: transform .5s ease, opacity .5s; }
.unit.e { --fall: 82deg; }
/* PLANT THE MARKER: the Grave Cross is stone, so it never breathes or falls over; it is never on the
   speed bar; it hides its plate while flying home; and Mordrek's own cross is gone while it stands. */
.unit.inert .body { animation: none; }
.unit.inert.down .body { transform: none; opacity: 1; filter: none; }
.unit.flying .plate, .unit.flying .chips, .unit.flying .stfx { visibility: hidden; }
.tok.inert { display: none; }
.unit.planted .upic .wpn { visibility: hidden; }
/* LAST RITES: two giant iron crosses driven in over the target, crossed above its head like a cage.
   Drawn in the body's own 100x100 space (not mirrored), and the pinned unit stops breathing. */
.body > .rites { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; display: none; z-index: 3; }
.unit.pinned .body > .rites { display: block; }
.unit.pinned .body { animation: none; }
.unit.pinned .plate, .unit.pinned .chips { position: relative; z-index: 4; }   /* the crosses tower over the body, not the name */
.rites-drop { position: absolute; z-index: 250; pointer-events: none; will-change: transform; }
.rites-drop svg { width: 100%; height: 100%; overflow: visible; display: block; }
/* The fallen keep nothing: name, bars and status chips fade out with the fall. visibility
   (not display) so the card's layout holds and the body doesn't jump as they vanish. */
.unit.down .plate, .unit.down .chips { opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s; }
/* UNDYING (the Pale Host): a champion standing past its death burns pale green and keeps
   the colour the fall would have drained out of it. See the UNDYING block in the script. */
.unit.undying .body {
  filter: drop-shadow(0 0 10px rgba(126, 230, 150, .85)) drop-shadow(0 0 22px rgba(90, 200, 120, .45)) saturate(.7) brightness(.94);
  animation: undyingPulse 1.5s ease-in-out infinite;
}
@keyframes undyingPulse { 50% { filter: drop-shadow(0 0 16px rgba(150, 255, 175, .95)) drop-shadow(0 0 30px rgba(90, 200, 120, .6)) saturate(.7) brightness(1.04); } }
.unit.undying .plate { border-color: #7ee696; box-shadow: 0 0 0 1px rgba(126, 230, 150, .6); }
.unit.undying .body::before { background: radial-gradient(closest-side, rgba(126, 230, 150, .5), transparent 70%); }
/* Second Burial can reach a body, so a corpse the revive can target has to be visible and
   clickable again — the fall normally dims it to scenery. */
.unit.down.targetable .body { opacity: .85; filter: grayscale(.35) drop-shadow(0 0 12px rgba(126, 230, 150, .8)); }
.unit.down.targetable { cursor: pointer; }
/* THE COFFIN: shut away means shut away. The champion is not dimmed, they are hidden outright
   (visibility, so the card's layout holds), and the coffin stands on the spot they were holding.
   Drawn in the body's own 100x100 space like the Last Rites crosses, on the same ground line. */
.unit.boxed .body { animation: none; }
.unit.boxed .upic { visibility: hidden; }
.body > .box { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; display: none; z-index: 3; }
.unit.boxed .body > .box {
  display: block;
  filter: drop-shadow(0 0 7px rgba(126, 230, 150, .45)) drop-shadow(0 3px 3px rgba(0, 0, 0, .55));
  transform-origin: bottom center;
  animation: coffinSeal .45s cubic-bezier(.2, .9, .3, 1.2) both;
}
@keyframes coffinSeal {
  from { transform: translateY(-16%) scale(.84); opacity: 0; }
  60% { opacity: 1; }
  to { transform: none; opacity: 1; }
}
.unit.boxed .plate, .unit.boxed .chips { position: relative; z-index: 4; }   /* the name still reads over the lid */
/* BURROW: Barrow sinks below the ground line - the figure slides down while a matching clip keeps
   everything under the ground hidden, so he goes INTO the earth, not through it - and a fresh mound
   rises where he stood. Coming back up runs the same in reverse. Uses the separate translate
   property, so it never fights the transform-based lunges and hurt shakes. */
.unit .upic { transition: translate .6s ease-in, clip-path .6s ease-in; }
.unit.buried .upic { translate: 0 100%; clip-path: inset(0 0 100% 0); }
.body > .mound { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3;
  transform-origin: bottom center; transform: scaleY(0); opacity: 0; transition: transform .45s ease-out .25s, opacity .3s ease .25s; }
.unit.buried .body > .mound { transform: none; opacity: 1; filter: drop-shadow(0 0 6px rgba(126, 230, 150, .3)) drop-shadow(0 3px 3px rgba(0, 0, 0, .5)); }
.unit.buried .plate, .unit.buried .chips { position: relative; z-index: 4; opacity: .8; }
/* THE GRAVEYARD FENCE (Barrow's Obstacle): a row of iron railings with spear tops rises before
   the protected unit, on the side it faces its enemies, lit the Pale Host's grave-green. It is
   scenery, not a unit — pointer-events stay off so clicks fall through to the figure behind it. */
.unit.fenced .upic::after {
  content: ''; position: absolute; z-index: 4; pointer-events: none;
  bottom: 0; right: -15%; width: 68%; height: 92%;   /* the box's bottom edge is the ground it is planted in */
  /* FENCE_ART (the same railing Barrow carries): lit iron, inked edges, grave-green spear tips, and a
     faint green rim so it stands out against the dark field instead of melting into it. */
  background: var(--fence-art) center bottom / 100% 100% no-repeat;
  filter: drop-shadow(0 0 1px rgba(184, 255, 200, .55)) drop-shadow(0 0 4px rgba(126, 230, 150, .3)) drop-shadow(0 4px 4px rgba(0, 0, 0, .6));
  transform-origin: bottom center;
  animation: fenceRise .75s cubic-bezier(.25, .8, .35, 1) both;
}
.unit.e.fenced .upic::after { right: auto; left: -9%; }   /* enemies face left, so the fence stands on their left */
/* ...planted in a churned mound of grave-dirt (FENCE_DIRT), drawn in front of the fence's foot so the
   bars go down into the ground. It is thrown up first, as the fence starts to come through. */
.unit.fenced .upic::before {
  content: ''; position: absolute; z-index: 5; pointer-events: none;
  bottom: -4%; right: -19%; width: 76%; height: 15%;
  background: var(--fence-dirt) center bottom / 100% 100% no-repeat;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5));
  transform-origin: bottom center;
  animation: dirtThrow .45s ease-out both;
}
.unit.e.fenced .upic::before { right: auto; left: -13%; }
/* ...and the barrow-wight who planted it no longer has it in hand (see fenceOut in renderBattle). */
.unit .wpn2 { transition: opacity .35s ease; }
.unit.fenceOut .wpn2 { opacity: 0; }
/* The fence comes UP through the ground: it slides up from below while a matching clip hides
   whatever is still under the ground line, then settles with a small jolt. */
@keyframes fenceRise {
  from { translate: 0 100%; clip-path: inset(0 0 100% 0); }
  78% { translate: 0 0; clip-path: inset(0 0 0 0); rotate: 0deg; }
  88% { rotate: -1.5deg; }
  to { translate: 0 0; clip-path: inset(0 0 0 0); rotate: 0deg; }
}
@keyframes dirtThrow {
  from { transform: scale(.3, .1); opacity: 0; }
  50% { transform: scale(1.08, 1.3); opacity: 1; }
  to { transform: none; opacity: 1; }
}
@keyframes idle { 50% { transform: translateY(-2px) scaleY(1.015); } }
@keyframes ringPulse { 50% { opacity: .45; } }
.upic { position: relative; width: 100%; height: 100%; }
.upic svg, .pic svg, .mini svg, .upic img, .pic img, .mini img { width: 100%; height: 100%; display: block; overflow: visible; object-fit: contain; }
.unit.e .upic svg, .unit.e .upic img { transform: scaleX(-1); }
/* Animated champions. The clip lies over the SVG and is sized and offset in multiples of --size
   (see clipVars) so its feet land on the same spot the SVG's do. It only becomes visible once the
   file has loaded, so a champion with no clip — or a clip that 404s — simply keeps the SVG. */
.upic .anim {
  position: absolute; top: 0; left: calc(var(--ax, 0) * var(--size));
  width: calc(var(--aw, 1) * var(--size)); height: calc(var(--ah, 1) * var(--size));
  max-width: none; object-fit: fill; opacity: 0;
}
.upic.animated .anim { opacity: 1; }
.upic.animated .art, .upic.animated > svg { visibility: hidden; }
/* The fallen lie still: the looping idle clip gives way to the static art (which .down tips over and greys),
   and no flinch or lunge plays on them. */
.unit.down .upic .anim { display: none; }
.unit.down .upic.animated .art, .unit.down .upic.animated > svg { visibility: visible; }
.unit.down .upic, .unit.down .body::after { animation: none !important; }
/* The clips breathe on their own, so drop the CSS bob that stands in for it. */
.unit:has(.upic.animated) .body { animation: none; }
/* Status overlays (syncStatusFx). Each clip covers art units (-15,-25)-(115,100): the 100x100 sprite box
   plus room above for smoke and stun stars. The tints tie the sprite into the effect. */
.upic .stfx { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.upic .stfx img { position: absolute; left: -15%; top: -25%; width: 130%; height: 125%; max-width: none; object-fit: fill; }
.unit.st-burn .upic > :is(.art, svg, .anim) { filter: sepia(.25) saturate(1.35) brightness(1.06); }
.unit.st-soaked .upic > :is(.art, svg, .anim) { filter: saturate(.8) brightness(.92) drop-shadow(0 0 2px rgba(110, 180, 255, .55)); }
.unit.st-poison .upic > :is(.art, svg, .anim) { filter: drop-shadow(0 0 3px rgba(140, 220, 80, .6)); }
.unit.st-bleed .upic > :is(.art, svg, .anim) { filter: drop-shadow(0 0 2px rgba(220, 40, 60, .7)); }
.unit.st-taunt .upic > :is(.art, svg, .anim) { filter: drop-shadow(0 0 3px rgba(255, 90, 60, .8)); }
.unit.st-burn.st-soaked .upic > :is(.art, svg, .anim) { filter: sepia(.15) saturate(1.1); }

/* Projectiles, lightning and impact effects */
.proj { position: absolute; left: 0; top: 0; z-index: 250; pointer-events: none; will-change: transform; }
.proj-arrow { width: 30px; height: 3px; margin: -1.5px 0 0 -15px; border-radius: 2px; background: linear-gradient(90deg, #d9c58a 0 18%, #8a5a32 18% 84%, #e6e1d3 84%); }
.proj-spear { width: 42px; height: 3px; margin: -1.5px 0 0 -21px; border-radius: 2px; background: linear-gradient(90deg, #7a5434 0 80%, #c9d1de 80%); }
/* Mara's round: a thin silver slug with a short bright streak behind it (it flies nose-first). */
.proj-silver { width: 15px; height: 2.6px; margin: -1.3px 0 0 -7px; border-radius: 0 2px 2px 0;
  background: linear-gradient(180deg, #ffffff, #c9d0dc 55%, #8d97a8); box-shadow: 0 0 4px rgba(235, 242, 255, .95), 0 0 9px rgba(190, 205, 230, .55); }
.proj-silver::before { content: ''; position: absolute; right: 100%; top: 50%; width: 26px; height: 1.6px; margin-top: -.8px;
  background: linear-gradient(90deg, rgba(220, 228, 242, 0), rgba(235, 240, 250, .75)); }
/* Muzzle fire and smoke at the barrel of a gun (muzzleFlash): a wrapper flipped to face the shot, the
   flame inside it, and loose puffs of powder smoke. */
.muzzle-fire { position: absolute; z-index: 252; width: 34px; height: 22px; margin-top: -11px; transform-origin: 0 50%; pointer-events: none; }
.muzzle-fire svg { width: 100%; height: 100%; display: block; overflow: visible; transform-origin: 0 50%; filter: drop-shadow(0 0 6px rgba(255, 170, 60, .9)); }
.muzzle-smoke { position: absolute; z-index: 251; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(225, 222, 215, .85), rgba(170, 168, 162, .55) 55%, rgba(150, 148, 142, 0) 72%); }
.proj-bullet { width: 11px; height: 4px; margin: -2px 0 0 -5px; border-radius: 2px; background: #ffe9a8; box-shadow: 0 0 8px #ffd166; }
.proj-orb { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: radial-gradient(circle, #fff 0 18%, var(--c, #9fe08a) 45%, transparent 72%); box-shadow: 0 0 14px var(--c, #9fe08a); }
.proj-fire { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle, #fff6c2 0 16%, #ffb347 40%, #ff5a1f 62%, transparent 74%); box-shadow: 0 0 18px #ff7a2f; }
.proj-shell { width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #2a2f3f; box-shadow: 0 0 0 2px #ff7a45 inset, 0 0 8px #ff7a45; }
/* Per-skill projectiles (PROJ_SKILL / PROJ_ATTACK). Drawn pointing right; shoot() rotates them along the flight. */
.proj svg { display: block; overflow: visible; }
.proj svg .pf { transform-box: fill-box; transform-origin: 100% 50%; animation: pflame .07s infinite alternate; }
.proj svg .pk { animation: pspark .1s infinite alternate; }
.proj-leaf svg, .proj-axe svg, .proj-caltrop svg { animation: pspin .32s linear infinite; }
@keyframes pflame { to { transform: scaleX(.6); opacity: .75; } }
@keyframes pspark { to { opacity: .35; } }
@keyframes pspin { to { transform: rotate(360deg); } }
@keyframes ppulse { 50% { filter: brightness(1.5) saturate(1.3); } }   /* never transform: the flight owns it */
.proj-rocket, .proj-missile, .proj-flak, .proj-bomb, .proj-keg { filter: drop-shadow(0 0 3px rgba(255, 170, 60, .7)); }
.proj-firepot, .proj-napalm, .proj-fireball, .proj-meteor { filter: drop-shadow(0 0 6px #ff7a2f); }
.proj-javelin, .proj-dart { filter: drop-shadow(0 0 4px #e0242f); }
.proj-hawkarrow { filter: drop-shadow(0 0 5px #ffd166); }
.proj-venomarrow, .proj-venombolt, .proj-thorn, .proj-vine { filter: drop-shadow(0 0 4px #9fe08a); }
.proj-toxarrow, .proj-inkjet { filter: drop-shadow(0 0 4px #b07ae0); }
.proj-firefly { filter: drop-shadow(0 0 6px #8ee6a0); }
.proj-skullshot { filter: drop-shadow(0 0 4px rgba(159, 232, 180, .6)); }
.proj-bloodbones { filter: drop-shadow(0 0 3px rgba(179, 32, 46, .7)); }
.proj-spark { width: 16px; height: 4px; margin: -2px 0 0 -8px; border-radius: 2px; background: linear-gradient(90deg, transparent, #7fe3ff 40%, #fff); box-shadow: 0 0 8px #7fe3ff; }
.proj-plasma { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: radial-gradient(circle, #fff 0 16%, #9fe7ff 34%, #3f8aff 56%, transparent 72%); box-shadow: 0 0 18px #6fb5ff, 0 0 4px #fff inset; animation: ppulse .14s infinite; }
.proj-tracer { width: 30px; height: 2px; margin: -1px 0 0 -15px; border-radius: 1px; background: linear-gradient(90deg, transparent, #ffd166 60%, #fff); box-shadow: 0 0 6px #ffd166; }
.proj-slug { width: 16px; height: 7px; margin: -3.5px 0 0 -8px; border-radius: 3px 50% 50% 3px; background: radial-gradient(circle at 70% 50%, #fff6c2, #ff9a2e 60%, #b8460f); box-shadow: 0 0 12px #ff7a2f, -10px 0 10px rgba(220, 220, 230, .45); }
.proj-ricochet { width: 10px; height: 4px; margin: -2px 0 0 -5px; border-radius: 2px; background: #eef2f8; box-shadow: 0 0 6px #fff, 0 0 12px #9fdcff; }
.proj-ember { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: radial-gradient(circle, #fff6c2 0 20%, #ffb347 45%, #ff5a1f 70%, transparent 76%); box-shadow: 0 0 10px #ff7a2f; }
.proj-flare { width: 32px; height: 5px; margin: -2.5px 0 0 -16px; border-radius: 3px; background: linear-gradient(90deg, transparent, #ff7a2f 30%, #ffd166 70%, #fff); box-shadow: 0 0 12px #ffb347; }
.proj-bubble { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 14%, rgba(180, 244, 255, .5) 30%, rgba(80, 180, 220, .35) 70%); border: 1.5px solid #bff3ff; }
.proj-pearl { width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: radial-gradient(circle at 35% 32%, #fff, #f2e6f0 55%, #b8a8c4); box-shadow: 0 0 10px #f2c6d8; }
.proj-inkball { width: 15px; height: 13px; margin: -6.5px 0 0 -7.5px; border-radius: 50% 40% 50% 45%; background: radial-gradient(circle at 40% 35%, #9474c4, #2a1d40 70%); box-shadow: 0 0 8px #5a4a8a; }
.proj-inkcloud { width: 28px; height: 22px; margin: -11px 0 0 -14px; border-radius: 50% 45% 55% 40%; background: radial-gradient(circle at 40% 35%, #8a6ab8, #2a1d40 65%, transparent 74%); box-shadow: 8px 4px 0 -3px #3a2a5a, -7px 5px 0 -4px #3a2a5a; }
.proj-hexorb { width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: radial-gradient(circle, #e8ffd0 0 12%, #9a4ad0 40%, #3a0f50 64%, transparent 72%); box-shadow: 0 0 14px #b07ae0, 0 0 0 2px rgba(159, 224, 138, .6); animation: ppulse .2s infinite; }
.proj-bloodbolt { width: 28px; height: 6px; margin: -3px 0 0 -14px; border-radius: 3px; background: linear-gradient(90deg, transparent, #7a0f1c 30%, #e0242f 75%, #ff8a8a); box-shadow: 0 0 10px #e0242f; }
.proj-pellets { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #ffe9a8; box-shadow: 0 0 6px #ffd166, 9px -6px 0 -1px #ffe9a8, 7px 7px 0 -1px #ffe9a8, -8px 4px 0 -1px #ffe9a8, -6px -7px 0 -1px #ffe9a8; }
.proj-note, .proj-heartnote, .proj-dirge { width: 26px; height: 26px; margin: -13px 0 0 -13px; display: grid; place-items: center; font: 800 22px/1 Georgia, serif; }
.proj-note::before { content: '\266A'; color: #fff; text-shadow: 0 0 8px #bff3ff, 0 0 2px #15121d; }
.proj-heartnote::before { content: '\2665\266A'; font-size: 17px; color: #ff9ac8; text-shadow: 0 0 8px #ff7ab0, 0 0 2px #15121d; }
.proj-dirge::before { content: '\266B'; color: #7fa8c8; text-shadow: 0 0 8px #3a2a6a, 0 0 2px #15121d; }
.burst-flak { width: 110%; background: radial-gradient(circle at 30% 40%, #ffd166 0 4%, transparent 5%), radial-gradient(circle at 68% 30%, #ffd166 0 3%, transparent 4%), radial-gradient(circle at 60% 70%, #ffb347 0 3%, transparent 4%), radial-gradient(circle, rgba(120, 120, 135, .85) 0 26%, rgba(80, 80, 95, .5) 46%, transparent 66%); animation-duration: .7s; }
.burst-ink { width: 120%; background: radial-gradient(circle, rgba(42, 29, 64, .9) 0 30%, rgba(90, 74, 138, .55) 50%, transparent 68%); animation-duration: .9s; }
.burst-flash { width: 130%; background: radial-gradient(circle, #fff 0 20%, rgba(255, 255, 240, .7) 40%, transparent 66%); animation-duration: .45s; }
.bolt { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 250; pointer-events: none; overflow: visible; }
.bolt polyline { fill: none; stroke: #eaf8ff; stroke-width: 3; stroke-linejoin: round; filter: drop-shadow(0 0 6px #7fe3ff); }
/* Maren's Backwash: a surging water beam from her to the enemy who used a skill (backwash()). */
.bolt.backwash polyline { stroke-linecap: round; filter: none; }
.bolt.backwash .bw-glow { stroke: #3fb6d8; stroke-width: 9; opacity: .45; filter: blur(3px); }
.bolt.backwash .bw-body { stroke: #8fe3f2; stroke-width: 4.5; }
.bolt.backwash .bw-core { stroke: #f2fdff; stroke-width: 1.8; }
.bolt.backwash circle { fill: #dff7ff; stroke: #2a7f8f; stroke-width: 1; }
/* Malgrath's Infernal Toll: the same beam as hellfire, with embers instead of droplets. */
.bolt.backwash.hellfire .bw-glow { stroke: #e0452a; }
.bolt.backwash.hellfire .bw-body { stroke: #ff9a3d; }
.bolt.backwash.hellfire .bw-core { stroke: #fff3b0; }
.bolt.backwash.hellfire circle { fill: #ffc24d; stroke: #8a1f10; }
/* Morwenna's Crimson Mend: a vein of blood run from her to each ally, shedding drops as it goes. */
.bolt.backwash.bloodlink .bw-glow { stroke: #7a0f22; opacity: .5; }
.bolt.backwash.bloodlink .bw-body { stroke: #c0303f; }
.bolt.backwash.bloodlink .bw-core { stroke: #ff9aa8; }
.bolt.backwash.bloodlink circle { fill: #c0303f; stroke: #4a0a14; }
/* Sister Liesl's Sacred Light (sacredLight()): a shaft of dawn opens high over the ally and pours
   straight down onto them, pooling where they stand, then lifts away as the mend takes hold. */
.bolt.sacredlight { z-index: 240; }
.bolt.sacredlight polygon { stroke: none; }
.bolt.sacredlight .sl-glow { fill: rgba(255, 214, 106, .22); filter: blur(2px); }
.bolt.sacredlight .sl-body { fill: rgba(255, 233, 168, .5); }
.bolt.sacredlight .sl-core { fill: rgba(255, 251, 230, .92); filter: drop-shadow(0 0 10px rgba(255, 224, 138, .8)); }
.bolt.sacredlight .sl-pool { fill: rgba(255, 224, 138, .55); filter: blur(3px); }
.bolt.sacredlight circle { fill: #fffbe6; filter: drop-shadow(0 0 4px #ffd166); }
.bolt.sacredlight circle, .bolt.sacredlight .sl-pool { transform-box: fill-box; transform-origin: center; }
/* Execute's blood rite (bloodGather / bloodPillar / bloodTorrent): thick red streams, a red pillar to the
   sky and a torrent of blood light back down. Same three-layer build as the beams above. */
/* The streams are stroked curves; the pillar and torrent are filled shapes. */
.bolt.rite path { fill: none; stroke-linecap: round; }
.bolt.rite path.rt-glow { stroke: #8a0c20; stroke-width: 30; opacity: .6; filter: blur(5px); }
.bolt.rite path.rt-body { stroke: #b8142a; stroke-width: 15; }
.bolt.rite path.rt-core { stroke: #ff7a88; stroke-width: 4.5; filter: drop-shadow(0 0 6px #ff2a3e); }
.bolt.rite polygon { stroke: none; }
.bolt.rite polygon.rt-glow { fill: rgba(150, 12, 34, .35); filter: blur(5px); }
.bolt.rite polygon.rt-body { fill: rgba(196, 20, 40, .72); }
.bolt.rite polygon.rt-core { fill: rgba(255, 176, 186, .92); filter: drop-shadow(0 0 10px #ff2a3e); }
.bolt.rite .rt-drop { fill: #d0182c; stroke: #4a0a14; stroke-width: 1; }
.bolt.rite.gather .rt-drop { transform-box: view-box; }
.bolt.rite.torrent .rt-drop, .bolt.rite .rt-pool, .bolt.rite .rt-orb, .bolt.rite .rt-orbcore { transform-box: fill-box; transform-origin: center; }
.bolt.rite .rt-orb { fill: rgba(208, 24, 44, .55); filter: blur(2px) drop-shadow(0 0 12px #ff2a3e); }
.bolt.rite .rt-orbcore { fill: #ff9aa6; }
.bolt.rite .rt-pool { fill: rgba(176, 16, 36, .7); filter: blur(3px); }
/* bleedBar: the HP a donor gives up to Execute, lit on their bar while it streams away. */
/* White-hot stripes, so it never reads as ordinary HP fill, sliding the way the blood is leaving. */
.bar .drain {
  position: absolute; top: 0; bottom: 0;
  background: repeating-linear-gradient(-45deg, #fff2f4 0 4px, #ff5a6c 4px 8px);
  background-size: 11.3px 100%; box-shadow: inset 0 0 0 1px #fff, 0 0 10px #ff2a3e;
  animation: drainSlide .4s linear infinite;
}
@keyframes drainSlide { to { background-position: 11.3px 0; } }
.bar.hp.bleeding span { text-shadow: 0 0 3px #000, 0 1px 2px #000, 0 0 1px #000; }
.bar.hp.bleeding { overflow: visible; transform-origin: 50% 50%; animation: bleedPulse .26s ease-in-out 6 alternate; }
@keyframes bleedPulse {
  from { transform: scaleY(1); box-shadow: 0 0 0 1.5px #ff3a4a, 0 0 10px rgba(255, 42, 62, .7); }
  to { transform: scaleY(1.3); box-shadow: 0 0 0 2px #ffe0e4, 0 0 22px rgba(255, 42, 62, 1); }
}
/* ...and for her whole turn while the channel is open, a standing vein to every ally: blood flows
   along it and a heartbeat pulses where it takes hold (syncBloodTethers). */
.tethers { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 245; pointer-events: none; overflow: visible; animation: tvIn .35s ease-out; }
.tethers .tv-glow { fill: none; stroke: #7a0f22; stroke-width: 8; stroke-linecap: round; opacity: .45; filter: blur(2px); }
.tethers .tv-body { fill: none; stroke: #c0303f; stroke-width: 3.2; stroke-linecap: round; }
.tethers .tv-flow { fill: none; stroke: #ff9aa8; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 3 14; animation: tvFlow .8s linear infinite; }
.tethers .tv-node { fill: #c0303f; stroke: #4a0a14; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: tvBeat 1.1s ease-in-out infinite; }
.tethers .tv-src { fill: rgba(192, 48, 63, .35); stroke: #ff9aa8; stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: tvBeat 1.1s ease-in-out infinite; }
.tethers.still, .tethers.still * { animation: none; }
@keyframes tvFlow { to { stroke-dashoffset: -17; } }   /* the dashes run from Morwenna toward each ally */
@keyframes tvBeat { 15% { transform: scale(1.5); } 30% { transform: scale(1); } 45% { transform: scale(1.3); } 60% { transform: scale(1); } }
@keyframes tvIn { from { opacity: 0; } }
.burst-splash { width: 115%; background: radial-gradient(circle at 35% 35%, #fff 0 4%, transparent 5%), radial-gradient(circle at 66% 42%, #dff7ff 0 3%, transparent 4%), radial-gradient(circle, rgba(170, 235, 250, .85) 0 22%, rgba(63, 182, 216, .55) 44%, transparent 66%); animation-duration: .6s; }
/* Stinging Jelly's shock (jellyShock): a quick blue-white electric crackle with a jagged bolt. */
.burst-shock { width: 108%;
  background: radial-gradient(circle at 42% 30%, #fff 0 3%, transparent 4%),
              radial-gradient(circle at 62% 56%, #cdf3ff 0 3%, transparent 4%),
              radial-gradient(circle at 30% 60%, #9fe3ff 0 2.5%, transparent 3.5%),
              radial-gradient(circle, rgba(127, 227, 255, .8) 0 20%, rgba(74, 168, 255, .45) 42%, transparent 64%);
  filter: drop-shadow(0 0 6px #7fe3ff); animation-duration: .42s;
}
.burst-shock::before {
  content: ''; position: absolute; inset: 0; margin: auto; width: 34%; height: 86%;
  background: linear-gradient(#ffffff, #7fe3ff);
  clip-path: polygon(56% 0, 30% 46%, 49% 46%, 26% 100%, 70% 42%, 50% 42%, 70% 0);
  filter: drop-shadow(0 0 4px #bfefff); animation: shockbolt .42s ease-out forwards;
}
@keyframes shockbolt { 0% { opacity: 0; transform: scaleY(.3); } 22% { opacity: 1; } 100% { opacity: 0; transform: scaleY(1.12); } }
.burst {
  position: absolute; left: 50%; top: 50%; width: 110%; aspect-ratio: 1; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; z-index: 3; animation: burst .7s ease-out forwards;
}
.burst-hit { width: 55%; background: radial-gradient(circle, #fff 0 14%, rgba(255, 255, 255, .55) 30%, transparent 62%); animation-duration: .35s; }
.burst-fire { width: 95%; background: radial-gradient(circle, #fff3b0 0 14%, #ff9a3d 34%, rgba(255, 80, 30, .5) 55%, transparent 70%); }
.burst-heal { background: radial-gradient(circle, rgba(108, 194, 138, .6), transparent 65%); animation-name: rise; animation-duration: .9s; }
.burst-heal::after { content: '+ + +'; position: absolute; inset: 22% 0 auto; text-align: center; font-weight: 800; font-size: 1.1rem; letter-spacing: .25em; color: #b6f5c9; }
.burst-shield { border: 3px solid rgba(160, 210, 255, .9); box-shadow: inset 0 0 16px rgba(140, 200, 255, .7), 0 0 14px rgba(140, 200, 255, .55); animation-name: bubble; animation-duration: .85s; }
.burst-buff { background: radial-gradient(circle, rgba(232, 165, 72, .6), transparent 65%); animation-name: rise; }
.burst-curse { background: radial-gradient(circle, rgba(196, 139, 224, .65), transparent 65%); }
/* Mana Burn (manaBurn / manaBurnPct): the struck body secretes its mana — blue droplets well up and
   ooze downward before fading. Played on any hit that burns an enemy's MP (see applyHitEffects). */
.burst-mana { width: 92%;
  background: radial-gradient(circle at 38% 30%, #dff1ff 0 4%, transparent 5%),
              radial-gradient(circle at 62% 40%, #a7d6ff 0 3.5%, transparent 4.5%),
              radial-gradient(circle at 48% 62%, #6fb8ff 0 5%, transparent 6%),
              radial-gradient(circle, rgba(92, 168, 255, .72) 0 24%, rgba(58, 118, 230, .4) 46%, transparent 66%);
  filter: drop-shadow(0 0 5px rgba(96, 170, 255, .7));
  animation-name: manadrip; animation-duration: .85s;
}
@keyframes manadrip {
  0%   { transform: translate(-50%, -64%) scale(.5); opacity: 0; }
  25%  { opacity: 1; }
  100% { transform: translate(-50%, -10%) scale(1.06); opacity: 0; }
}
.burst-roar { border: 3px solid rgba(240, 100, 90, .85); animation-name: ring; }
/* Second Burial: grave-light pulsing over the body, and the risen's green-lit eyes (raiseRitual). */
/* Grave Cross: the cone of green light from Mordrek's lifted cross onto the enemy (graveShine). */
.graveshine { position: absolute; z-index: 240; pointer-events: none; transform-origin: 0 50%; mix-blend-mode: screen; opacity: 0; }
.graveshine::before { content: ''; position: absolute; inset: 0; clip-path: polygon(0 44%, 100% 0, 100% 100%, 0 56%); filter: blur(1.5px);
  background: linear-gradient(90deg, rgba(225, 255, 230, .95), rgba(126, 230, 150, .7) 35%, rgba(90, 210, 125, .35) 75%, rgba(90, 210, 125, 0)); }
.graveshine i { position: absolute; left: -9px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 18%, rgba(150, 255, 180, .9) 40%, transparent 70%); box-shadow: 0 0 18px 6px rgba(126, 230, 150, .8); }
.burst-grave { width: 120%; border: 2.5px solid rgba(170, 255, 195, .9); background: radial-gradient(circle, rgba(120, 245, 160, .45) 0 22%, rgba(80, 210, 125, .2) 48%, transparent 66%); box-shadow: 0 0 16px rgba(110, 240, 150, .7), inset 0 0 14px rgba(110, 240, 150, .6); animation-name: rise; animation-duration: .9s; }
.upic .eyeglow { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.upic .eyeglow i { position: absolute; width: 10%; height: 10%; margin: -5% 0 0 -5%; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 18%, #c8ffd6 32%, rgba(110, 240, 150, .6) 55%, transparent 72%); animation: eyelit 3s ease-out forwards; }
@keyframes eyelit { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1.2); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.burst-smoke { width: 140%; background: radial-gradient(circle, rgba(225, 225, 235, .8) 0 28%, rgba(180, 180, 195, .45) 50%, transparent 70%); animation-duration: .9s; }
/* Hellfire Slam and kin (skill option `wave`): a ring of pit-fire rolling out from the slam
   point across the ground in every direction (fireWave). Sized and centered by JS through
   width/height/margins, so the `scale` animation grows it from the point of impact. */
.firewave {
  position: absolute; z-index: 240; pointer-events: none; border-radius: 50%;
  background: radial-gradient(closest-side, transparent 50%, rgba(255, 154, 61, .14) 62%, rgba(224, 69, 42, .6) 74%, #ff9a3d 82%, #fff3b0 87%, rgba(224, 69, 42, .4) 93%, transparent 100%);
  filter: drop-shadow(0 0 16px rgba(255, 122, 47, .85));
  animation: firewave .8s ease-out forwards;
}
.firewave::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 243, 176, .75), rgba(255, 122, 47, .4) 45%, transparent 72%);
  animation: firewaveCore .35s ease-out forwards;
}
@keyframes firewave { from { scale: .12; opacity: 1; } 70% { opacity: .95; } to { scale: 1; opacity: 0; } }
@keyframes firewaveCore { to { opacity: 0; } }
/* Blood Frenzy: what comes off an enemy each time an axe lands - a spray and the flecks that
   fling out of it. Same layered-dot build as the flak and splash bursts above. */
.burst-blood {
  width: 108%;
  background:
    radial-gradient(circle at 28% 30%, #ff5a66 0 3.6%, transparent 4.6%),
    radial-gradient(circle at 71% 25%, #c0303f 0 3%, transparent 4%),
    radial-gradient(circle at 18% 60%, #9c1f2c 0 2.6%, transparent 3.6%),
    radial-gradient(circle at 80% 64%, #e04455 0 3.2%, transparent 4.2%),
    radial-gradient(circle at 47% 82%, #8e1a26 0 2.4%, transparent 3.4%),
    radial-gradient(circle at 60% 50%, #ff7a84 0 2.2%, transparent 3.2%),
    radial-gradient(circle, rgba(196, 36, 52, .85) 0 20%, rgba(126, 18, 30, .5) 42%, transparent 64%);
  animation-duration: .55s;
}
/* ...and the red his axes run while the frenzy is on him. His art is one loaded image with no
   separate weapon group, so the light is laid over the spot the axes ride and the figure takes
   the spill. It pulses for as long as he is in it, rather than flashing once per blow. */
.unit.frenzied .upic::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 4;
  background:
    radial-gradient(closest-side, rgba(255, 92, 102, .95), rgba(192, 32, 48, .6) 42%, transparent 72%) 64% 50% / 44% 32% no-repeat,
    radial-gradient(closest-side, rgba(255, 72, 88, .85), rgba(154, 20, 34, .5) 44%, transparent 74%) 34% 58% / 36% 26% no-repeat;
  mix-blend-mode: screen;
  animation: frenzyGlow .34s ease-in-out infinite alternate;
}
.unit.e.frenzied .upic::after { transform: scaleX(-1); }
.unit.frenzied .body { filter: drop-shadow(0 0 11px rgba(204, 28, 46, .85)) saturate(1.2); }
@keyframes frenzyGlow { from { opacity: .5; } to { opacity: 1; } }
/* Graveside Chill (skill option `gust`, graveGust): a green grave-wind sweeps across the enemy
   line, fluttering past each fighter before the cold settles into them. It blows the way its
   caster faces (--gust-dir, set from facing()), so an enemy Mordrek's wind rolls right to left. */
.gravegust {
  position: absolute; z-index: 240; pointer-events: none; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(150, 250, 180, .5), rgba(90, 215, 130, .28) 45%, transparent 72%);
  filter: drop-shadow(0 0 18px rgba(110, 240, 150, .8)); mix-blend-mode: screen;
  animation: gravegust var(--gust-ms, 900ms) ease-in-out forwards;
}
@keyframes gravegust {
  from { transform: translateX(calc(-55% * var(--gust-dir, 1))) scaleX(.7); opacity: 0; }
  20% { opacity: 1; } 80% { opacity: .95; }
  to { transform: translateX(calc(55% * var(--gust-dir, 1))) scaleX(1.15); opacity: 0; }
}
/* Mortessa's Coffin (coffinFly): the coffin lifts off her back and sails to the targeted ally. */
.coffinfly { position: absolute; z-index: 260; pointer-events: none; font-size: 30px; line-height: 1; filter: drop-shadow(0 0 10px rgba(110, 240, 150, .8)); }
/* Tharos's Riptide / Undertow (waterSweep): a blue wave rolls across the targets, the way its
   caster faces (--sweep-dir, set from facing()) - an enemy Tharos washes them right to left. */
.watersweep {
  position: absolute; z-index: 238; pointer-events: none;
  /* A swell rather than a blob: a curling crest up front, white foam along the top, and the
     body of the water falling away darker underneath it. */
  border-radius: 58% 42% 24% 16% / 78% 72% 28% 22%;
  background:
    radial-gradient(120% 44% at 44% 2%, rgba(255, 255, 255, .95) 0 6%, rgba(220, 246, 255, .5) 16%, transparent 46%),
    radial-gradient(44% 80% at 90% 26%, rgba(240, 252, 255, .5), transparent 64%),
    linear-gradient(to bottom, rgba(186, 232, 255, .62) 0 14%, rgba(84, 166, 238, .5) 46%,
      rgba(26, 88, 166, .34) 80%, rgba(12, 50, 100, .08) 100%);
  filter: drop-shadow(0 1px 10px rgba(70, 150, 225, .6)); mix-blend-mode: screen;
  animation: watersweep var(--sweep-ms, 820ms) ease-in-out forwards;
}
@keyframes watersweep {
  from { transform: translateX(calc(-55% * var(--sweep-dir, 1))) scaleX(.7); opacity: 0; }
  20% { opacity: 1; } 80% { opacity: .95; }
  to { transform: translateX(calc(55% * var(--sweep-dir, 1))) scaleX(1.18); opacity: 0; }
}
/* Anchors / Jellies (settleAttachments) are carried onto their host's slot. */
.unit.attached { transition: none; }
/* Power Slash (skill option `slash`, slashFx): a great crescent carved across the struck
   target. The sweep animates `transform: rotate`; the mirror for enemy-side attackers is the
   `scale` property, so the two compose instead of fighting. */
