// Speech bubble over a townsperson. Clicking the same person again moves to their next line.
// If they have a quest for you, the bubble offers it (or pays out) with buttons instead.
const folkTurn = {};
let sayTimer = 0, sayBtn = null;
function folkTalk(btn) {
  const id = btn.dataset.folk, n = TOWNSFOLK[id], q = questOf(id), st = q && questSt(q), you = youName();
  const hi = greetedFolk.has(id) ? '' : salute(id);
  greetedFolk.add(id);
  let body, sticky = false;
  if (q && !st) {
    body = `${hi ? `${hi} ` : ''}${q.ask}<span class="qline">Quest: <b>${q.title}</b>. ${goalText(q)}. Reward: ${rewardText(q)}.</span>
      <span class="btns"><button class="btn primary small" type="button" data-k="quest:${q.id}">Accept</button>
      <button class="btn small" type="button" data-k="hush">Not now</button></span>`;
    sticky = true;
  } else if (st?.s === 'ready') {
    body = `You did it${you ? `, ${you}` : ''}? Really?<span class="btns"><button class="btn primary small" type="button" data-k="claim:${q.id}">Hand in ${q.title}</button></span>`;
    sticky = true;
  } else {
    const lines = linesOf(n.lines);
    folkTurn[id] = folkTurn[id] == null ? Math.floor(Math.random() * lines.length) : folkTurn[id] + 1;
    body = (hi ? `${hi} ` : '') + lines[folkTurn[id] % lines.length]
      + (st?.s === 'active' ? `<span class="qline">Quest: <b>${q.title}</b>. ${goalText(q)}${goalN(q) > 1 ? `, ${st.n} of ${goalN(q)}` : ''}.</span>`
        : lockedFor(q) ? `<span class="qline">${n.name} will have a job for you at level <b>${q.lv}</b>.</span>` : '');
  }
  showSay(btn, `<strong>${n.name} · ${n.title}</strong>${body}`, sticky);
}

function showSay(btn, html, sticky = false) {
  const bub = $('#npcSay'), town = $('#town');
  document.querySelectorAll('.npc.talking').forEach((b) => b.classList.remove('talking'));
  btn.classList.add('talking');
  sayBtn = btn;
  bub.innerHTML = html;
  bub.classList.toggle('ask', sticky);
  bub.hidden = false;
  const tr = town.getBoundingClientRect(), r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2 - tr.left, left = clamp(cx - bub.offsetWidth / 2, 6, tr.width - bub.offsetWidth - 6);
  bub.style.left = `${left}px`;
  bub.style.top = `${Math.max(4, r.top - tr.top + r.height * 0.1 - bub.offsetHeight - 8)}px`;
  bub.style.setProperty('--tail', `${clamp(cx - left, 12, bub.offsetWidth - 12)}px`);
  clearTimeout(sayTimer);
  if (!sticky) sayTimer = setTimeout(hideSay, 7000);
}
function hideSay() {
  clearTimeout(sayTimer);
  sayBtn = null;
  $('#npcSay').hidden = true;
  document.querySelectorAll('.npc.talking').forEach((b) => b.classList.remove('talking'));
}

// Buttons inside a townsperson's bubble.
function sayAction(k) {
  const [verb, id] = k.split(':'), btn = sayBtn;
  if (verb === 'hush' || !btn) return hideSay();
  const q = QUEST_BY_ID[id], who = `<strong>${TOWNSFOLK[q.from].name} · ${TOWNSFOLK[q.from].title}</strong>`;
  if (verb === 'quest' && acceptQuest(id)) showSay(btn, `${who}Thank you${youName() ? `, ${youName()}` : ''}! Come and find me when it is done.<span class="qline">Quest accepted: <b>${q.title}</b>.</span>`);
  else if (verb === 'claim') { const got = claimQuest(id); if (got) showSay(btn, `${who}${q.done}<span class="qline loot">${got}</span>`); }
  render();
}

function keeperGreet(place) {
  const n = KEEPERS[place];
  state.keeperSays = n ? withSalute(n.id, pick(linesOf(n.greet))) : '';
}
function keeperReact(place) {
  const n = KEEPERS[place];
  if (n?.react.length) state.keeperSays = pick(n.react.filter((l) => l !== state.keeperSays));
}
// The keeper greeting you inside their building, with their current quest (if any) below.
function keeperHTML(place) {
  const n = KEEPERS[place];
  if (!n) return '';
  const q = questOf(n.id);
  const loot = state.keeperLoot ? `<p class="loot">${state.keeperLoot}</p>` : '';
  const said = state.keeperSays ? `<div class="keeper"><div class="kpic">${npcArt(n.id)}</div>
    <div><strong>${n.name}</strong> <small>${n.title}</small><p>“${state.keeperSays}”</p>${loot}</div></div>` : '';
  return said + (q ? questCardHTML(q, 'giver') : '');
}

// Opening a keeper's building delivers any messages you carry for them.
function deliverTo(place) {
  const n = KEEPERS[place];
  if (!n) return;
  const due = pendingDeliveries(n.id);
  if (!due.length) return;
  state.keeperSays = due[0].deliver;
  state.keeperLoot = questEvent('talk', { to: n.id }).join(' ');
}

  // Guild House: one membership at a time. Favor is kept per guild, so switching back costs only the fee.
  guild() {
    const member = profile.guild?.id;
    const crest = {
      purse: '<svg viewBox="0 0 40 40" role="img"><circle cx="20" cy="20" r="13" fill="#e8a548" stroke="#8a5a14" stroke-width="2"/><circle cx="20" cy="20" r="8.5" fill="none" stroke="#8a5a14" stroke-width="1.5"/><path d="M20 14.5 v11 M16 17.5 h8 M16 22.5 h8" stroke="#8a5a14" stroke-width="1.8"/></svg>',
      scholars: '<svg viewBox="0 0 40 40" role="img"><path d="M20 10 q-3.5 -4.5 0 -8 q3.5 3.5 0 8" fill="#ff8a3d"/><path d="M8 28 q6 -5 12 -1 q6 -4 12 1 V14 q-6 -5 -12 -1 q-6 -4 -12 1 Z" fill="#e9e4d8" stroke="#3a4a6a" stroke-width="2"/><path d="M20 13 v14" stroke="#3a4a6a" stroke-width="1.6"/></svg>',
      oath: '<svg viewBox="0 0 40 40" role="img"><rect x="12" y="7" width="15" height="23" rx="2" fill="#e9dcc0" stroke="#5a3e28" stroke-width="2"/><path d="M15.5 13 h8 M15.5 17.5 h8 M15.5 22 h6" stroke="#8a7048" stroke-width="1.5"/><circle cx="26.5" cy="28.5" r="5" fill="#c0303f" stroke="#7a1f2a" stroke-width="1.6"/><path d="M24.5 28.5 h4 M26.5 26.5 v4" stroke="#7a1f2a" stroke-width="1.2"/></svg>',
    };
    const cards = Object.entries(GUILDS).map(([id, G]) => {
      const favor = guildFavor(id), ri = guildRankIdx(favor), rank = GUILD_RANKS[ri], next = GUILD_RANKS[ri + 1];
      const mine = member === id, canPay = !member || profile.gold >= GUILD_SWITCH_COST;
      const btn = mine
        ? '<button class="btn" type="button" disabled>Your guild</button>'
        : `<button class="btn${canPay ? ' primary' : ''}" type="button" data-k="gjoin:${id}"${canPay ? '' : ' disabled'}>${member ? `Switch for ${GUILD_SWITCH_COST} gold` : 'Join, no charge'}</button>`;
      return `<div class="depth">
        <div class="dmini"><span class="mini" title="${G.name}">${crest[id]}</span></div>
        <h3>${G.name}${mine ? ' · yours' : ''}</h3>
        <p><i>“${G.motto}”</i> ${G.desc(rank.pct)}</p>
        <small>${rank.name} · ${favor} favor${next ? ` · ${next.at - favor} more to ${next.name}` : ' · the highest rank'}</small>
        ${btn}
      </div>`;
    }).join('');
    return `<p class="note">One guild at a time wears your colors. Every victory earns <b>1 favor</b> — gauntlet clears and dungeon
        bosses earn <b>2</b> — and favor raises your rank: ${GUILD_RANKS.map((r) => `${r.name} at ${r.at}`).join(', ')}.
        Rank grows your guild's perk from ${GUILD_RANKS[0].pct}% to ${GUILD_RANKS[GUILD_RANKS.length - 1].pct}%.
        The first guild takes you in free; after that, switching costs ${GUILD_SWITCH_COST} gold. Favor is remembered by every guild.</p>
      <div class="depths">${cards}</div>`;
  },

  // Emberhollow Cave: pick a depth to hunt; deeper depths unlock with level. Bestiary below.
  cave() {
    if (!profile.hero) {
      return `<p class="note">Nobody goes into the mine without a name. Create your champion first.</p>
        <div class="btns"><button class="btn primary" type="button" data-k="team">Create your champion</button></div>`;
    }
    if (state.runPending) return '<p class="note">Your Arena run is paused. Finish or abandon it at the Arena before heading underground.</p>';
    const lv = heroLevel();
    const depths = CAVE_DEPTHS.map((d) => {
      const open = lv >= d.minLv;
      const kinds = [...new Set([d.elite, ...d.pool].filter(Boolean))];
      return `<div class="depth${open ? '' : ' locked'}">
        <div class="dmini">${kinds.map((id) => `<span class="mini" title="${MONSTERS[id].name}">${spriteSVG(id)}</span>`).join('')}</div>
        <h3>${d.name}</h3><p>${d.desc}</p>
        <small>Level ${d.minLv}+ · packs of ${d.size}${d.elite ? ` · always a ${MONSTERS[d.elite].name}` : ''}</small>
        <button class="btn${open ? ' primary' : ''}" type="button" data-k="hunt:${d.id}"${open ? '' : ' disabled'}>${open ? 'Hunt here' : `Unlocks at level ${d.minLv}`}</button>
      </div>`;
    }).join('');
    const caveIds = new Set(CAVE_DEPTHS.flatMap((x) => [...x.pool, x.elite].filter(Boolean)));
    const bestiary = Object.entries(MONSTERS).filter(([id]) => caveIds.has(id)).map(([id, m]) => `
      <div class="beast"><span class="mini">${spriteSVG(id)}</span>
        <div><b>${m.name}</b>${m.elite ? ' <span class="role melee">Elite</span>' : ''}<p>${m.lore}</p>
        <small>${m.skills.slice(1).map((s) => s.name).join(' · ')}${m.passive ? ` · Passive: ${m.passive.name}` : ''}</small></div></div>`).join('');
    return `<p class="note">Monsters fight at your level and come in packs. Each hunt is one battle with full HP. It pays XP for every monster
        in the pack, plus a little gold, and counts toward bounties. There's no weather underground.</p>
      <div class="teamRow">${teamMinis()}</div>
      <div class="depths">${depths}</div>
      <h3 class="bhead">Bestiary</h3>
      <div class="bestiary">${bestiary}</div>`;
  },

  // Expedition Gate: the dungeons along Ashfall Road, each a chain of rooms ending in a boss.
  gate() {
    if (!profile.hero) {
      return `<p class="note">The gate guard wants a name before letting anyone out on the road. Create your champion first.</p>
        <div class="btns"><button class="btn primary" type="button" data-k="team">Create your champion</button></div>`;
    }
    if (state.runPending) return '<p class="note">Your Arena run is paused. Finish or abandon it at the Arena before setting out.</p>';
    const lv = heroLevel();
    const cards = DUNGEONS.map((d) => {
      const open = lv >= d.minLv, rec = profile.dungeons[d.id], boss = MONSTERS[d.boss];
      const kinds = [...new Set(d.rooms.flat())];
      const c = d.cond ? DG_CONDS[d.cond] : null;   // know what you're walking into before you set out
      return `<div class="depth dungeon${open ? '' : ' locked'}">
        <div class="dmini">${kinds.map((id) => `<span class="mini" title="${MONSTERS[id].name}">${spriteSVG(id)}</span>`).join('')}
          <span class="mini boss" title="${boss.name}">${spriteSVG(d.boss)}</span></div>
        <h3>${d.name}</h3><p>${d.blurb}</p>
        <small>Level ${d.minLv}+ · ${DG_ROOM_COUNT} rooms, then <b>${boss.name}</b></small>
        ${c ? `<small class="cond" title="${c.desc}">${c.icon} <b>${c.name}</b> — ${c.brief}</small>` : ''}
        ${d.hazardBrief ? `<small class="cond">🕯️ <b>The house fights dirty</b> — ${d.hazardBrief}</small>` : ''}
        <small class="reward">Chest: ${d.chest.gold} gold and ${d.chest.items} items${rec?.clears ? ` · cleared ${rec.clears}×` : ` · first clear: a ${TRINKETS[d.firstClear].name}`}</small>
        <button class="btn${open ? ' primary' : ''}" type="button" data-k="dungeon:${d.id}"${open ? '' : ' disabled'}>${open ? 'Set out' : `Unlocks at level ${d.minLv}`}</button>
      </div>`;
    }).join('');
    return `<p class="note">A dungeon is a run of rooms with no full heal between them: HP and MP carry over, the fallen get back up at 30%,
        and everyone rests a little. Each room pays XP and gold. The boss at the end guards a chest. Bosses enrage below half HP,
        and before their big attack they warn you a turn ahead: that's the moment to Guard or shield up.
        Badly wounded monsters flee deeper, and your warband gives chase: they'll be in the next room, still hurt.
        Abandon the run any time and you keep what you've earned.</p>
      <div class="teamRow">${teamMinis()}</div>
      <div class="depths">${cards}</div>`;
  },

  // The Ironsmith: Brann's anvil, which forges a champion's weapon edge and armor tier by tier.
  forge() {
    if (!profile.hero) return shopNeedsHero();
    const sel = forgeHero();
    const list = heroListHTML(sel, (id) => { const g = gearRaw(id); return [`Weapon ${g.w || 0} · Armor ${g.a || 0}`, (g.w || 0) + (g.a || 0) > 0]; });
    return `${shopHeroHTML('forge')}<div class="forge">${list}${anvilHTML(sel)}</div>
      <p class="note">Upgrades are permanent and count in every battle, for this champion only.
        Named weapons and worn kit hang next door at <b>the Armory</b>; the anvil's Weapon tier sharpens whichever weapon a champion holds.</p>
      <div class="btns"><button class="btn small" type="button" data-k="open:armory">Visit the Armory</button></div>`;
  },

  // The Armory: named weapons on the rack (THE ARMORY data) and worn kit on the stand (THE ARMOR STAND).
  armory() {
    if (!profile.hero) return shopNeedsHero();
    const sel = forgeHero(), tab = state.armoryTab || 'rack';
    const tabs = `<div class="filters" role="group" aria-label="The Armory">${[['rack', 'Weapon rack'], ['kit', 'Armor stand']]
      .map(([k, n]) => `<button class="fbtn" type="button" data-k="atab:${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</div>`;
    if (tab === 'kit') {
      const held = heroListHTML(sel, (id) => { const e = kitOf(id); return [e ? e.name : 'No kit', !!e]; });
      return `${shopHeroHTML('eq')}${tabs}<div class="forge">${held}${kitHTML(sel)}</div>
        <p class="note">Your champion wears <b>one piece of kit</b>, and it stacks with the anvil,
          the weapon rack and the Jeweler. <b>Free Company</b> kit fits anyone; a faction's own kit is cut for its
          champions alone. Buying another sends the old piece home to your stash.
          Wards cut a share off every blow of their kind: <b>physical</b> is steel, shot, tusk and fist, while
          <b>magic</b> is spellfire, lightning, holy light, song, ink and curses.</p>`;
    }
    {
      const held = heroListHTML(sel, (id) => { const w = wepOf(id); return [w ? w.name : 'Bare-handed', !!w]; });
      return `${shopHeroHTML('wp')}${tabs}<div class="forge">${held}${rackHTML(sel)}</div>
        <p class="note">Your champion carries <b>one weapon</b>. <b>Free Company</b> steel is wielded
          by anyone; a faction's own three are cut for its champions alone and carry that faction's edge built in.
          Buying another sends the old one home to your stash, and the anvil's Weapon
          tier sharpens whichever one they are holding.</p>`;
    }
  },

  jeweler() {
    if (!profile.hero) return shopNeedsHero();
    const sel = forgeHero();
    const list = heroListHTML(sel, (id) => { const t = TRINKETS[gearRaw(id).t]; return [t ? t.name : 'No trinket', !!t]; });
    return `${shopHeroHTML('t')}<div class="forge">${list}${trinketCaseHTML(sel)}</div>
      <p class="note">Your champion wears one trinket. Buying another sends the old one home to your stash.</p>
      ${stoneShopHTML()}`;
  },

  academy() {
    const tab = state.acadTab || 'lessons';
    const tabs = `<div class="filters" role="group" aria-label="The Academy">${[['lessons', 'Lessons'], ['chart', 'Champion chart'], ['library', 'Library']]
      .map(([k, n]) => `<button class="fbtn" type="button" data-k="ytab:${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</div>`;
    return tabs + (tab === 'chart' ? chartHTML() : tab === 'library' ? libraryHTML() : lessonHTML());
  },

  workshop() {
    const tab = state.craftTab || 'craft';
    const tabs = `<div class="filters" role="group" aria-label="The Workshop">${[['craft', 'Craft'], ['salvage', 'Salvage'], ['fuse', 'Fuse stones']]
      .map(([k, n]) => `<button class="fbtn" type="button" data-k="ctab:${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</div>`;
    const pouch = `<p class="label">Your materials</p><div class="mats">${MAT_KEYS.map((k) => matChip(k, mats()[k] || 0)).join('')}</div>`;
    const news = state.craftNews ? `<p class="loot">${state.craftNews}</p>` : '';
    if (tab === 'fuse') return `${pouch}${tabs}${news}${stoneFuseHTML()}`;
    if (tab === 'salvage') {
      const NAMES = { weapons: ARMORY, equipment: EQUIPMENT, trinkets: TRINKETS };
      const rows = Object.keys(SALVAGE).flatMap((kind) => Object.entries(profile.stash[kind] || {}).filter(([, n]) => n > 0).map(([k, n]) => {
        const bag = SALVAGE[kind](k);
        if (!bag) return '';
        return `<div class="inv"><div class="t"><strong>${NAMES[kind][k].name}${n > 1 ? ` &times;${n}` : ''}</strong>
          <small>Breaks down into</small><div class="mats">${Object.entries(bag).map(([m, c]) => matChip(m, c)).join('')}</div></div>
          <div class="mv"><button class="btn small" type="button" data-k="salv:${kind}:${k}">Break down</button></div></div>`;
      })).join('');
      return `${pouch}${tabs}${news}<div class="invList">${rows || '<p class="note">Nothing spare in your stash. Gear you replace at the Armory or the Jeweler goes there; bring it here to break it down.</p>'}</div>
        <p class="note">Only spare pieces in your stash can be broken down. What your champions wear is safe.</p>`;
    }
    const cards = RECIPES.map((r) => {
      const o = recipeOut(r), ok = canAfford(r.cost);
      return `<div class="ware"><div class="ico">${o.icon}</div><strong>${o.name}</strong><p>${o.desc}</p>
        <div class="buy"><div class="mats">${Object.entries(r.cost).map(([k, n]) => matChip(k, n, (mats()[k] || 0) < n)).join('')}</div>
          <button class="btn small${ok ? ' primary' : ''}" type="button" data-k="craft:${r.id}"${ok ? '' : ' disabled'}>Craft</button></div></div>`;
    }).join('');
    return `${pouch}${tabs}${news}<div class="wares">${cards}</div>
      <p class="note">Monsters in Emberhollow and the dungeons drop materials, elites and bosses more of them. Every gauntlet win brings one more, and clearing the gauntlet a handful. Red counts are what you're short of.</p>`;
  },

  market() {
    const tab = state.marketTab || 'supplies';
    const tabs = `<div class="filters" role="group" aria-label="Market stalls">${[['supplies', 'Supplies'], ['home', 'Home goods']]
      .map(([k, n]) => `<button class="fbtn" type="button" data-k="mtab:${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</div>${profile.hero ? shopHeroHTML('items') : ''}`;
    if (tab === 'home') {
      return `${tabs}<div class="wares">${DECOR_KEYS.map((k) => {
        const d = DECOR[k], own = ownsDecor(k), ok = !own && profile.gold >= d.price;
        return `<div class="ware${own ? ' worn' : ''}"><div class="ico">${DECOR_ICON[k]}</div><strong>${d.name}</strong><p>${d.desc}</p>
          <div class="buy"><span class="note">${d.perk ? '<b>Warband perk</b>' : 'For your home'}</span>
            <button class="btn small${ok ? ' primary' : ''}" type="button" data-k="decor:${k}"${ok ? '' : ' disabled'}>${own ? 'In your house' : `Buy for ${d.price} gold`}</button></div>
        </div>`;
      }).join('')}</div>
      <p class="note">Furniture goes straight to Your House. Perks count in every battle for your whole warband.</p>`;
    }
    const cap = stashCap();
    return `${tabs}<div class="wares">${tomeHTML('market')}${ITEM_KEYS.map((k) => {
      const it = ITEMS[k], n = profile.items[k] || 0, m = profile.stash.items[k] || 0;
      const full = n >= SATCHEL_MAX && m >= cap, ok = !full && profile.gold >= it.price;
      const label = full ? 'Satchel and stash full' : n >= SATCHEL_MAX ? `Buy for ${it.price} gold, to your stash` : `Buy for ${it.price} gold`;
      return `<div class="ware"><div class="ico">${ITEM_ICON[k]}</div><strong>${it.name}</strong><p>${it.desc}</p>
        <div class="buy"><span class="note">Satchel <b>${n}</b>/${SATCHEL_MAX} · Stash <b>${m}</b>/${cap}</span>
          <button class="btn small${ok ? ' primary' : ''}" type="button" data-k="buy:${k}"${ok ? '' : ' disabled'}>${label}</button></div>
      </div>`;
    }).join('')}</div>
    <p class="note">In battle, each of your champions can use <b>one item per turn</b> and still act — you pick yours with keys 6–0, and your recruits help themselves when they are hurt, stunned or out of mana. They share your satchel, so what they drink is gone from your stock. You carry ${SATCHEL_MAX} of each; extras go home to your stash.</p>`;
  },

  home() {
    const s = profile.stash, cap = stashCap(), perks = homePerks();
    const perkText = [perks.hpPct && `+${Math.round(perks.hpPct * 100)}% max HP`, perks.atkPct && `+${Math.round(perks.atkPct * 100)}% Attack`,
      perks.hpRegen && `+${perks.hpRegen} HP each turn`].filter(Boolean).join(', ');
    const items = ITEM_KEYS.map((k) => {
      const n = profile.items[k] || 0, m = s.items[k] || 0;
      return `<div class="inv"><span class="ico">${ITEM_ICON[k]}</span>
        <div class="t"><strong>${ITEMS[k].name}</strong><small>Satchel ${n}/${SATCHEL_MAX} · Stash ${m}/${cap}</small></div>
        <div class="mv"><button class="btn small" type="button" data-k="store:${k}"${n && m < cap ? '' : ' disabled'}>To stash</button>
          <button class="btn small" type="button" data-k="take:${k}"${m && n < SATCHEL_MAX ? '' : ' disabled'}>To satchel</button></div></div>`;
    }).join('');
    const team = state.team.map((id) => {
      const c = charById(id), g = gearRaw(id), t = TRINKETS[g.t], w = ARMORY[g.wp], e = EQUIPMENT[g.eq];
      return `<div class="inv"><div class="mini">${spriteSVG(id)}</div>
        <div class="t"><strong>${shortName(c)}</strong><small>${w ? w.name : 'Bare-handed'} · ${TIER[g.w || 0]} edge · ${TIER[g.a || 0]} armor · ${e ? e.name : 'No kit'} · ${t ? t.name : 'No trinket'}</small></div>
        ${w || t || e ? `<div class="mv">${w ? `<button class="btn small" type="button" data-k="wunequip:${id}">Rack weapon</button>` : ''}${e ? `<button class="btn small" type="button" data-k="equnequip:${id}">Take off kit</button>` : ''}${t ? `<button class="btn small" type="button" data-k="unequip:${id}">Take off trinket</button>` : ''}</div>` : ''}</div>`;
    }).join('');
    const spare = TRINKET_KEYS.filter((k) => s.trinkets[k] > 0).map((k) => {
      const tr = TRINKETS[k];
      const who = state.team.map((id) => {
        const ok = gearRaw(id).t !== k && !(tr.mana && !hasMana(id));
        return `<button class="btn small" type="button" data-k="give:${k}:${id}"${ok ? '' : ' disabled'}>Give to ${shortName(charById(id))}</button>`;
      }).join('');
      return `<div class="inv"><span class="ico">${TRINKET_ICON[k]}</span>
        <div class="t"><strong>${tr.name}${s.trinkets[k] > 1 ? ` ×${s.trinkets[k]}` : ''}</strong><small>${tr.desc}</small></div><div class="mv">${who}</div></div>`;
    }).join('');
    const rack = ARMORY_KEYS.filter((k) => s.weapons[k] > 0).map((k) => {
      const w = ARMORY[k];
      const who = state.team.filter((id) => fitsWeapon(k, id))
        .map((id) => `<button class="btn small" type="button" data-k="wgive:${k}:${id}"${gearRaw(id).wp === k ? ' disabled' : ''}>Give to ${shortName(charById(id))}</button>`).join('');
      return `<div class="inv"><span class="ico wico">${wepIcon(k)}</span>
        <div class="t"><strong>${w.name}${s.weapons[k] > 1 ? ` ×${s.weapons[k]}` : ''}</strong>
          <small>${w.faction === 'all' ? 'Free Company' : FACTIONS[w.faction].name} · ${wepLines(w.bonus).join(' · ')}</small></div>
        <div class="mv">${who || '<span class="note">Nobody in your warband can wield it</span>'}</div></div>`;
    }).join('');
    const chest = EQUIP_KEYS.filter((k) => s.equipment[k] > 0).map((k) => {
      const e = EQUIPMENT[k];
      const who = state.team.filter((id) => fitsKit(k, id))
        .map((id) => `<button class="btn small" type="button" data-k="eqgive:${k}:${id}"${gearRaw(id).eq === k ? ' disabled' : ''}>Give to ${shortName(charById(id))}</button>`).join('');
      return `<div class="inv"><span class="ico wico">${kitIcon(k)}</span>
        <div class="t"><strong>${e.name}${s.equipment[k] > 1 ? ` &times;${s.equipment[k]}` : ''}</strong>
          <small>${e.faction === 'all' ? 'Free Company' : FACTIONS[e.faction].name} · ${wepLines(e.bonus).join(` · `)}</small></div>
        <div class="mv">${who || '<span class="note">Nobody in your warband can wear it</span>'}</div></div>`;
    }).join('');
    return `<div class="room">${roomSVG()}</div>
      <p class="note">${profile.home.length ? `${profile.home.length} of ${DECOR_KEYS.length} pieces of furniture.${perkText ? ` Warband perks: <b>${perkText}</b>.` : ''}` : 'Bare walls and a cold floor.'}
        Odo Mott sells furniture under <b>Home goods</b> at the Market.</p>
      <div class="btns"><button class="btn small" type="button" data-k="homeshop">Shop for furniture</button></div>
      <div class="homeGrid">
        <section><p class="label">Satchel and stash</p><div class="invList">${items}</div>
          ${profile.tomes ? `<div class="wares">${tomeHTML('home')}</div>` : ''}
          ${MAT_KEYS.some((k) => mats()[k] > 0) ? `<p class="label">Materials</p><div class="mats">${MAT_KEYS.map((k) => matChip(k, mats()[k] || 0)).join('')}</div><p class="note">Craft with them at the Workshop.</p>` : ''}</section>
        <section><p class="label">Your warband's gear</p><div class="invList">${team}</div>
          <p class="label">Weapons on the rack</p>
          <div class="invList">${rack || '<p class="note">Nothing spare on the rack. Weapons you unhand, or replace at the Armory, end up here. A faction\'s own work can only be handed to its own champions.</p>'}</div>
          <p class="label">Kit in the chest</p>
          <div class="invList">${chest || '<p class="note">No spare kit. Pieces you take off, or replace at the Armory, end up here. A faction\'s own kit can only be given to its own champions.</p>'}</div>
          <p class="label">Stones in your stash</p>
          <div class="invList">${stoneStashHTML()}</div>
          <p class="label">Trinkets in your stash</p>
          <div class="invList">${spare || '<p class="note">No spare trinkets. Ones you take off, or replace at the Jeweler, end up here.</p>'}</div></section>
      </div>`;
  },

  bounty() {
    const board = bountyBoard();
    const notes = board.list.map((b, i) => {
      const pct = Math.round((b.prog / b.n) * 100);
      const btn = b.claimed ? '<span class="soon">Paid</span>'
        : b.done ? `<button class="btn small primary" type="button" data-k="bclaim:${i}">Claim ${b.gold} gold</button>`
        : `<span class="note">${b.prog} / ${b.n}</span>`;
      return `<div class="notice${b.claimed ? ' paid' : b.done ? ' ready' : ''}" style="--r:${[-1.5, 1, -0.5][i % 3]}deg">
        <span class="pin" aria-hidden="true"></span><p class="nk">Bounty</p><p class="nt">${bountyText(b)}</p>
        <div class="nbar" role="img" aria-label="${b.prog} of ${b.n} done"><i style="width:${pct}%"></i></div>

const emptySlotSVG = () => '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="6" fill="none" stroke="#4a4458" stroke-width="2" stroke-dasharray="4 3"/><path d="M16 11v10M11 16h10" stroke="#4a4458" stroke-width="2" stroke-linecap="round"/></svg>';

function anvilHTML(id) {

    return `<div class="gear">

// The rules of the road: factions, weather and the speed bar. Shown in the Elder's Hut and on the square.
function codexHTML() {
  const tab = state.codex;
  const tabs = [['factions', 'Factions'], ['weather', 'Weather'], ['speed', 'The speed bar'], ['gear', 'Gear & damage']]
    .map(([k, n]) => `<button class="fbtn" type="button" data-k="codex:${k}" aria-pressed="${k === tab}">${n}</button>`).join('');
  let body;
  // The weather tab also covers what stands in for weather underground: the cave's quakes and the dungeon conditions.
  // Each sky carries the small icon it shows in the battle's weather pill; dungeon conditions their own.
  const wxIco = (i) => `<span class="wxIco" aria-hidden="true">${i}</span>`;
  if (tab === 'weather') body = [...Object.entries(WEATHER).map(([k, w]) => entryHTML(`${wxIco(WX_ICON[k])}${w.name}`, w.desc)),
    ...DUNGEONS.filter((d) => d.cond).map((d) => entryHTML(`${wxIco(DG_CONDS[d.cond].icon)}${DG_CONDS[d.cond].name} · ${d.name}`, DG_CONDS[d.cond].desc))].join('');
  else if (tab === 'speed') body = SPEED_LORE.map(([h, p, fx = []]) => entryHTML(`${h}${fx.length ? ` <span class="fxChips">${fx.map(fxChip).join('')}</span>` : ''}`, p)).join('');
  else if (tab === 'gear') body = GEAR_LORE.map(([h, t]) => entryHTML(h, t)).join('');
  else body = FACTION_KEYS.map((k) => {
    const f = FACTIONS[k], w = Object.values(WEATHER).find((x) => x.favors === k);
    return entryHTML(f.name, `<b>${f.mechanic}.</b> ${f.rule} Favored by ${w.name}. Mana pool: ${poolLabel(k)}.`);
  }).join('');
  const foot = tab === 'weather' ? `<p class="note">The weather changes every ${WEATHER_EVERY} rounds. Battles start under Clear Skies, and the next weather is always announced ahead of time.
      No weather reaches underground: Emberhollow Cave gets the odd Earthquake instead, and a dungeon's condition holds for the whole run.</p>` : '';
  return `<div class="filters" role="group" aria-label="Lore topics">${tabs}</div><div class="codex">${body}</div>${foot}`;
}

/* INVENTORY — opened from the Warband sheet. The chosen champion stands on the left with their
   stats; on the right, what they have equipped (weapon, kit, trinket) and the bag: every spare
   weapon, piece of kit and trinket in the stash, plus the loot (battle items in the satchel and
   stash). Tap a bag item to equip it on the champion; tap an equipped item to put it back. */
const invCid = () => (state.invFor && state.team.includes(state.invFor) ? state.invFor : profile.hero.id);
function inventoryHTML(close) {
  const cid = invCid(), c = charById(cid), lv = heroLevel(), g = gearRaw(cid), st = profile.stash;
  const you = isHeroId(cid), name = you ? heroName() : c.name;

  const stats = [['HP', u.maxHp], ['Attack', u.atk], ['Defense', u.def], ['Crit', `${Math.round((u.crit || 0) * 100)}%`],

  // Tapping a tile selects it (sel = 'where-kind:key'); its details and action show below the bag.

  const tile = (icon, label, k, cls = '', count = 0) =>
    `<button class="itile${cls}${k && k === `isel:${sel}` ? ' sel' : ''}" type="button" ${k ? `data-k="${k}"` : ''} title="${escHTML(label)}" aria-label="${escHTML(label)}">${icon}${count > 1 ? `<span class="icount">${count}</span>` : ''}</button>`;
  // Equipped: weapon, kit, trinket.
  const w = ARMORY[g.wp], e = EQUIPMENT[g.eq], t = TRINKETS[g.t];
  const slot = (label, item, icon, kind) => `<div class="islot"><small>${label}</small>${item
    ? tile(icon, item.name, `isel:slot-${kind}:${g[kind]}`, ' on')
    : `<span class="itile empty" aria-label="No ${label.toLowerCase()}"></span>`}</div>`;
  const slots = slot('Weapon', w, w && wepIcon(g.wp), 'wp') + slot('Kit', e, e && kitIcon(g.eq), 'eq') + slot('Trinket', t, t && TRINKET_ICON[g.t], 't');
  // The bag.
  const bag = [
    ...ARMORY_KEYS.filter((k) => st.weapons?.[k] > 0).map((k) =>
      tile(wepIcon(k), ARMORY[k].name, `isel:bag-wp:${k}`, fitsWeapon(k, cid) ? '' : ' off', st.weapons[k])),
    ...EQUIP_KEYS.filter((k) => st.equipment?.[k] > 0).map((k) =>
      tile(kitIcon(k), EQUIPMENT[k].name, `isel:bag-eq:${k}`, fitsKit(k, cid) ? '' : ' off', st.equipment[k])),
    ...TRINKET_KEYS.filter((k) => st.trinkets?.[k] > 0).map((k) =>
      tile(TRINKET_ICON[k], TRINKETS[k].name, `isel:bag-t:${k}`, TRINKETS[k].mana && !hasMana(cid) ? ' off' : '', st.trinkets[k])),
    ...ITEM_KEYS.map((k) => [k, (profile.items[k] || 0) + (st.items?.[k] || 0)]).filter(([, n]) => n > 0).map(([k, n]) =>
      tile(ITEM_ICON[k], ITEMS[k].name, `isel:loot-item:${k}`, ' loot', n)),
    ...Object.keys(st.stones || {}).filter((sid) => st.stones[sid] > 0).sort().map((sid) =>
      tile(stoneIcon(sid), stoneName(sid), `isel:stone-gem:${sid}`, ' loot', st.stones[sid])),
  ].join('');
  // The selected item's details: its name, each bonus as a bullet, and what you can do with it.
  let detail = '';
  if (sel) {
    const [wk, key] = sel.split(':'), [where, kind] = wk.split('-');
    const def = kind === 'gem' ? { name: stoneName(key), bonus: stoneBonus(key) } : { wp: ARMORY, eq: EQUIPMENT, t: TRINKETS, item: ITEMS }[kind]?.[key];
    if (def) {
      const lines = def.bonus && wepLines(def.bonus).length ? wepLines(def.bonus) : [def.desc];
      const why = kind === 'wp' && !fitsWeapon(key, cid) ? `${FACTIONS[def.faction]?.name || 'Another faction'} work: ${name} can't wield it. A faction's own work can only be handed to its own champions.`
        : kind === 'eq' && !fitsKit(key, cid) ? `Cut for ${FACTIONS[def.faction]?.name || 'another faction'}: ${name} can't wear it.`
        : kind === 't' && def.mana && !hasMana(cid) ? `${name} has no mana, so this does nothing for them.` : '';
      const act = where === 'slot' ? `<button class="btn small" type="button" data-k="iunq:${kind}">Put back in the bag</button>`
        : where === 'loot' ? '<span class="note">Used in battle from your satchel.</span>'
        : where === 'stone' ? (() => {
            const [, g] = stoneParts(key), n = stonesHeld(key);
            if (g >= 3) return `<span class="note">${n} held. Perfect is the finest grade. Socket it into a weapon or kit.</span>`;
            return `<span class="note">${n} held. Three fuse into a ${STONE_GRADES[g]} stone at the Workshop (${FUSE_COST[g - 1]} gold)${n < 3 ? `, ${3 - n} more needed` : ''}.</span>`;
          })()
        : why ? `<span class="note">${why}</span>`
        : `<button class="btn small primary" type="button" data-k="iequip:${kind}:${key}">Equip on ${name}</button>`;
      detail = `<div class="invDetail"><b>${def.name}</b><ul>${lines.map((l) => `<li>${l}</li>`).join('')}</ul><div class="btns">${act}</div></div>`;
    }
  }
  return `<section class="panel" id="panel" aria-label="Inventory">
    <div class="phead"><div><p class="label">Inventory</p><h2>${name}</h2></div>
      <button class="btn small" type="button" data-k="sheet:warband">Back</button>${close}</div>
    ${who}
    <div class="invGrid">
      <div class="invChamp"><div class="invPic">${spriteSVG(cid)}</div><b>${name}</b><small>Level ${lv}</small><ul class="invStats">${stats}</ul></div>
      <div class="invItems">
        <p class="label">Equipped</p><div class="invSlots">${slots}</div>
        <p class="label">Bag</p>
        <div class="invBag">${bag || '<p class="note">Your bag is empty. Weapons and kit come from the Armory, trinkets from the Jeweler, and loot from the Market and dungeon chests.</p>'}</div>
        ${detail}
      </div>
    </div>
    <p class="note">Tap any item to see what it does, then equip it on ${name} or put it back in the bag.</p>
  </section>`;
}

// The warband and skills sheets that the dock opens.
function sheetHTML(which) {
  const lv = heroLevel(), c = charById(profile.hero.id);
  const close = '<button class="btn small" type="button" data-k="sheet:">Close</button>';
  if (which === 'inventory') return inventoryHTML(close);
  if (which === 'quests') {
    return `<section class="panel" id="panel" aria-label="Quests">
      <div class="phead"><div><p class="label">Quests</p><h2>Quest log</h2></div>${close}</div>
      ${questLogHTML()}
    </section>`;
  }
  if (which === 'skills') {
    const lo = currentLoadout(), pts = skillPoints(c.id);
    const row = (s, sub) => `<div class="skrow">${skillIcon(s)}<span><b>${s.name}</b> <small>${sub}</small></span></div>`;
    const acts = lo.act.map((id) => {
      const r = skillRank(c.id, id);
      return row(activeById(c, id), `${id === 'b' ? '★ Signature' : NEUTRAL_SKILLS[id] ? 'Neutral' : 'Active'}${r ? ` · Rank ${r}` : ''}`);
    });
    const pas = lo.pas.map((id) => row(passiveById(c, id), 'Passive'));
    const later = SLOT_UNLOCKS.filter((u) => u.lv > lv).map((u) =>
      `<div class="skrow locked">${u.kind === 'act' ? 'Active' : 'Passive'} slot unlocks at level ${u.lv}</div>`);
    return `<section class="panel" id="panel" aria-label="Skills">
      <div class="phead"><div><p class="label">Skills</p><h2>${heroName()}</h2></div>${close}</div>
      <div class="sklist">${[...acts, ...pas, ...later].join('')}</div>
      <p class="note">${pts ? `<b>${pts}</b> skill point${pts === 1 ? '' : 's'} to spend.` : 'Every level-up grants a skill point.'} Attack and Guard are always ready.</p>
      <div><button class="btn${pts ? ' primary' : ''}" type="button" data-k="skills">Choose skills</button></div>
    </section>`;
  }
  // Each champion: portrait with their level, name, and the skills they take into battle
  // (your chosen loadout; recruits pick their own at your level, as makeUnit does).
  const cards = state.team.map((id, i) => {
    const ch = charById(id), you = i === 0, lo = loadoutFor(ch, lv);
    const kit = [...lo.act.map((k) => [activeById(ch, k), '']), ...lo.pas.map((k) => [passiveById(ch, k), ' pas'])]
      .filter(([sk]) => sk).map(([sk, cls]) => `<span class="wsk${cls}" title="${escHTML(sk.name)}">${skillIcon(sk)}</span>`).join('');
    // Recruits can be swapped out right here: Swap opens a grid of champion models to pick the replacement.
    const swap = you ? '' : `<button class="btn small wswap" type="button" data-k="swap:${i}" aria-pressed="${state.swapSlot === i}" aria-label="Swap out ${ch.name}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Swap</span></button>`;
    const picker = !you && state.swapSlot === i ? `<div class="wpicker" role="group" aria-label="Choose who replaces ${ch.name}">${
      ROSTER.filter((x) => !state.team.includes(x.id)).map((x) =>
        `<button class="wpick" type="button" data-k="recruit:${i}:${x.id}" title="${escHTML(x.name)}" aria-label="Recruit ${escHTML(x.name)}">${spriteSVG(x.id)}</button>`).join('')}</div>` : '';
    return `<div class="wcard${you ? ' you' : ''}"><span class="wpic">${spriteSVG(id)}<span class="wlvl">Lv ${lv}</span></span>
      <span class="wname"><b>${you ? heroName() : ch.name}</b></span>
      ${swap}
      <span class="wskills" aria-label="Skills">${kit}</span>
      <button class="btn small wchange" type="button" data-k="skillsfor:${id}" aria-label="Change ${you ? heroName() : ch.name}'s skills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 7l3 3" stroke="currentColor" stroke-width="2"/></svg><span class="lbl">Change</span></button></div>${picker}`;
  }).join('');
  return `<section class="panel" id="panel" aria-label="Your warband">
    <div class="phead"><div><p class="label">Your warband</p><h2>${heroName()}'s warband</h2></div>
      <button class="btn small invBtn" type="button" data-k="sheet:inventory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8V6a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 8h14l-1 12H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h6" stroke="currentColor" stroke-width="2"/></svg><span class="lbl">Inventory</span></button>${close}</div>
    <div class="wlist">${cards}</div>
    <p class="note">Recruits fight at your level and choose their own skills.</p>
    <div><button class="btn" type="button" data-k="team">Change recruits</button></div>
  </section>`;
}

// The Workshop's stone bench: every kind you hold, its three grades, and a Fuse button wherever three wait.
function stoneFuseHTML() {
  const kinds = STONE_KINDS.filter((k) => [1, 2, 3].some((g) => stonesHeld(stoneId(k, g)) > 0));
  const rows = kinds.map((k) => `<div class="fuseRow"><b>${STONES[k].name}</b><div class="fuseGrades">${[1, 2, 3].map((g) => {
    const sid = stoneId(k, g), n = stonesHeld(sid), cost = FUSE_COST[g - 1], ok = g < 3 && n >= 3 && profile.gold >= cost;
    return `<div class="fuseCell${n ? '' : ' none'}" title="${escHTML(`${stoneName(sid)}: ${stoneLines(sid).join(', ')}`)}">
      <span class="sico">${stoneIcon(sid)}</span><small>${STONE_GRADES[g - 1]} ×${n}</small>
      ${g < 3 ? `<button class="btn small${ok ? ' primary' : ''}" type="button" data-k="sfuse:${sid}"${ok ? '' : ' disabled'}>Fuse 3 · ${cost}g</button>` : ''}</div>`;
  }).join('<span class="fuseArrow" aria-hidden="true">→</span>')}</div></div>`).join('');
  return `<div class="fuseList">${rows || '<p class="note">No gem stones yet. They turn up in Emberhollow hunts and dungeon chests, and the Jeweler sells Chipped ones.</p>'}</div>
    <p class="note">Three stones of one grade fuse into one of the next: Chipped → Flawless for ${FUSE_COST[0]} gold, Flawless → Perfect for ${FUSE_COST[1]} gold.</p>`;
}

// The Jeweler's gem counter: Chipped stones of every kind, and how many of each you hold.
function stoneShopHTML() {

  return `<p class="label">Gem stones</p>
    <div class="stoneShop">${STONE_KINDS.map((k) => {
      const sid = stoneId(k, 1), held = STONE_GRADES.map((_, i) => stonesHeld(stoneId(k, i + 1))).reduce((a, b) => a + b, 0);

        <span class="st"><b>${STONES[k].name}</b><small>${stoneLines(sid).join(' · ')}${held ? ` · you hold ${held}` : ''}</small></span>
        <button class="btn small${ok ? ' primary' : ''}" type="button" data-k="sbuy:${k}"${ok ? '' : ' disabled'}>${STONE_PRICE} gold</button></div>`;
    }).join('')}</div>
    <p class="note">Gem stones go into the sockets on weapons and kit. Three of a grade fuse into the next:
      Chipped → Flawless for ${FUSE_COST[0]} gold, Flawless → Perfect for ${FUSE_COST[1]}. Fuse them at the Workshop.</p>`;
}
