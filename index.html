async function hurlCross(u, t, i, sk) {
  await strikePose(u, false, sk);   // he lifts his cross to the sky and calls the next one down
  const box = stageBox(t);
  if (reduced || !box) return;
  const el = document.createElement('div');
  el.className = 'rites-drop';
  el.dataset.on = t.uid;
  Object.assign(el.style, { left: `${box.x - box.w / 2}px`, top: `${box.feet - box.h}px`, width: `${box.w}px`, height: `${box.h}px` });
  el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${RITES_CROSSES[i % 2]}</svg>`;
  $('#arena').appendChild(el);
  const ms = beat(360);
  const fall = el.animate([{ transform: `translateY(${(-(box.feet + box.h * 0.8)).toFixed(1)}px)` }, { transform: 'none' }],
    { duration: ms, easing: 'cubic-bezier(.55, 0, 1, .45)', fill: 'forwards' });
  await done(fall, ms);
  burst(t, 'smoke');
  $('#arena').animate([{ translate: '0 0' }, { translate: '0 7px' }, { translate: '0 -3px' }, { translate: '0 0' }], { duration: beat(280) });
}

// After the second cross: pin the target if a cross landed on it, and swap the falling copies for the standing pair.
function settleCrosses(u, t, landed) {
  if (landed && t && t.hp > 0 && u.hp > 0) {
    addFx(t, 'rites', 99);
    const e = has(t, 'rites');
    if (e) e.by = u.uid;   // resisted (a charm, an inert cross) → no pin
  }
  render();
  for (const d of document.querySelectorAll(`.rites-drop[data-on="${t?.uid}"]`)) {
    if (t.hp > 0 && pinned(t)) { d.remove(); continue; }
    done(d.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(12px)' }], { duration: beat(450), fill: 'forwards' }), beat(450)).then(() => d.remove());
  }
}

// Mordrek's turn comes round, or he truly falls: everything pinned under his Last Rites goes free.
function releaseRites(src, msg) {
  let any = false;
  for (const x of allUnits()) {
    const e = has(x, 'rites');
    if (!e || e.by !== src.uid) continue;
    x.effects = x.effects.filter((f) => f !== e);
    if (x.hp <= 0) continue;
    any = true;
    burst(x, 'smoke');
    float(x, 'Freed', 'fx');
    log(`${x.name} ${msg}`, 'sys');
  }
  if (any) render();
}

/* Knocked loose after its sixth blow: the cross tears out of the ground, tumbles back through the
   air and lands in Mordrek's hand, and he can Attack again. If he is gone, it just topples. */
async function crossFliesHome(s) {
  const owner = unitBy(s.owner);
  const home = owner && owner.hp > 0;
  log(home ? `${s.name} is knocked loose and flies back to ${owner.name}.` : `${s.name} is knocked loose and topples.`, 'sys');
  float(s, 'Knocked loose', 'fx');
  await sleep(beat(380));   // let the blow that broke it land first
  const el = actorEl(s), from = stageBox(s), to = home ? stageBox(owner) : null;
  if (el && from && to && !reduced) {
    el.classList.add('flying');
    el.style.zIndex = 200;
    const dx = to.x - from.x, dy = to.feet - from.feet, ms = beat(700);
    const spin = -facing(s) * 360;
    const a = el.animate([{ translate: '0 0' }, { translate: `${(dx * 0.5).toFixed(1)}px ${(dy * 0.5 - 90).toFixed(1)}px`, offset: 0.5 },
      { translate: `${dx.toFixed(1)}px ${dy.toFixed(1)}px` }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' });
    bodyEl(s)?.animate([{ transform: 'rotate(0deg) scale(1)' }, { transform: `rotate(${spin}deg) scale(.6)` }],
      { duration: ms, easing: 'ease-in', fill: 'forwards' });
    await done(a, ms);
  }
  removeUnit(s);   // hands the weapon back (owner.planted)
  if (home && state.teams[owner.side].includes(owner)) {
    burst(owner, 'shield');
    float(owner, 'Cross returns', 'fx');
  }
  render();
}

/* A Shambler swings the instant it stands, before the speed bar gets any say. It picks its mark
   the way the AI would and throws the one blow it has; anything after that is the bar's business.
   damageSkill is called straight out, because a summon has no mana, cooldown or toll to settle. */
async function strikeOnSpawn(s) {
  if (s.hp <= 0) return;
  const sk = skillsOf(s)[0];
  const opts = validTargets(s, sk);
  if (!opts.length) return;
  const t = chance(0.6) ? [...opts].sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0] : pick(opts);
  log(`${s.name} lurches up and swings at once.`, s.side);
  await damageSkill(s, t, sk);
  cleanupSummons();
  render();
}

/* SECOND BURIAL — Mortessa's ★ signature, and the only skill in the game that targets the dead.
   A fallen champion never leaves the field: the dead stay in state.teams, which is how the body
   goes on lying there. So raising one is a matter of undoing the death rather than building a new
   unit — clear the kill flag, hand back a sliver of HP, drop whatever was lying on the corpse,
   and give the Undying pact back, because the grave never gave up its claim in the first place.
   The ★ signature goes back on a short cooldown so the newly raised cannot open with one. */
function reviveUnit(src, t, pct, label) {
  t.hp = Math.max(1, Math.round(t.maxHp * pct));
  t.felled = false;
  t.undyingHits = 0; t.undyingSpent = false;
  t.effects = [];
  t.downAt = null;
  t.pos = 0;
  t.lastHitBy = null;
  t.cooldowns = { ...t.cooldowns, b: Math.max(t.cooldowns?.b || 0, 2) };
  burst(t, 'heal');
  float(t, 'Raised', 'fx');
  log(`${src.name}'s ${label} calls ${t.name} back onto their feet.`, src.side);
}

// Bone-Thrift (Cadris's Nature): nothing he raises is wasted — a Shambler coming apart
// flings its bones at the living. Fires once per Shambler, whether it dies or collapses.
function boneThrift(z) {
  if (z.bonesFlung) return;
  z.bonesFlung = true;
  const ow = unitBy(z.owner);
  if (!ow || ow.hp <= 0 || !charNat(ow).thrift) return;
  const tg = pick(openFoes(ow));
  if (!tg) return;
  float(tg, '🦴 Bone-Thrift', 'fx');
  strikeOnce(ow, tg, 0.3, 'Bone-Thrift', {});
}

function removeUnit(u) {
  if (u.summon && u.id === 'zombie') boneThrift(u);   // the Shambler's last gift, however it goes
  if (u.inert) { const o = unitBy(u.owner); if (o) o.planted = false; }   // the cross is back in Mordrek's hand
  state.teams[u.side] = state.teams[u.side].filter((x) => x !== u);
  document.getElementById(`u-${u.uid}`)?.remove();
  document.getElementById(`tok-${u.uid}`)?.remove();
  layoutSides();
}

// A destroyed Ironclad champion leaves one Salvage Bot behind. Unlike a normal summon
// it is `independent`: it keeps fighting even though its 'owner' (the fallen Mech) is gone.
/* ==================================================================
   ATTACHMENTS — Tharos's Anchor and Octavia's Jellyfish. A small inert
   unit stands on the CASTER's side but clamps onto a chosen enemy
   (hostUid). It is targetable and blow-counted like a Grave Cross — any
   hit, whatever its size, takes exactly one off (countBlows) — but area
   attacks wash past it (noAoe, filtered from openFoes). The host's own
   team must break it to be free: the Anchor roots the host in place
   (rooted) until it breaks; the Jelly shocks the host for 15 magic
   every 3 Tolls (see turnPulse). independent:true so a fallen caster
   does not drag it off the field, and it is intercepted in fell() before
   the Grave-Cross "flies home" path.
   ================================================================== */
// opts.life (Tolls) makes an attachment fall off on its own after a set time, on top of — or instead
// of — being broken by blows (stats().maxHp). Omit it for a blows-only attachment like today's.
function spawnAttachment(caster, host, kind, opts = {}) {
  const def = SUMMONS[kind], st = def.stats();
  state.summonSeq = (state.summonSeq || 0) + 1;
  const u = {
    uid: `${caster.uid}${kind[0]}${state.summonSeq}`, id: kind, art: kind,
    side: caster.side, summon: true, independent: true, inert: true, noAoe: true,
    attach: kind, hostUid: host.uid, owner: caster.uid,
    name: def.name, level: caster.level, faction: caster.faction, race: null, role: def.role, floats: false,
    ...st, effects: [], cooldowns: {}, heat: 0, stacks: 0, mp: 0, maxMp: 0,
    hitSince: false, lastAction: null, combo: false, shockN: 0,
    pos: host.pos || 300, expires: null,
  };
  state.teams[caster.side].push(u);
  addUnitDom(u);
  countBlows(u);   // hp becomes the number of blows left; every hit of any size takes exactly one
  if (opts.life != null) u.tollLife = opts.life;   // falls off on its own after this many Tolls (see turnPulse)
  addFx(host, 'attached', 99, 0, true);            // the generic marker: something is fixed onto this unit
  return u;
}
const attachmentsOn = (host) => allUnits().filter((a) => a.attach && a.hostUid === host.uid && a.hp > 0);

// An attachment is spent (blows gone) or its host has fallen: lift what it was holding, then clear it.
function removeAttachment(a, why) {
  const host = unitBy(a.hostUid);
  if (a.attach === 'anchor' && host && !attachmentsOn(host).some((x) => x !== a && x.attach === 'anchor')) {
    host.effects = host.effects.filter((e) => e.id !== 'rooted');
    if (host.hp > 0 && why === 'broken') { float(host, 'Uprooted', 'fx'); log(`The anchor breaks — ${host.name} tears free.`, host.side); }
  }
  removeUnit(a);
  // The generic Attached marker lifts once nothing is fixed onto the host anymore.
  if (host && !attachmentsOn(host).length) host.effects = host.effects.filter((e) => e.id !== 'attached');
}

// The Jelly's shock: 15 base magic, mitigated by the host's wards, shields, guard and magic block
// (just as a magic hit is) and sharpened by Exposed. Never dodged — it is already clamped on.
function jellyShock(jelly, host) {
  if (!host || host.hp <= 0) return;
  let d = 15;
  if (has(host, 'exposed')) d *= 1.25;
  d *= has(host, 'ward') ? 0.4 : has(host, 'shield') ? 0.5 : 1;
  if (has(host, 'guard')) d *= 0.5;
  const mw = Math.min(host.blockMagic || 0, 0.9);
  if (mw) d *= 1 - mw;
  d = Math.max(1, Math.round(d));
  host.hp = Math.max(0, host.hp - d);
  // The jelly flares as it discharges, and a blue-white electric crackle snaps over its host.
  pose(jelly, [{ filter: 'none', transform: 'scale(1)' },
    { filter: 'brightness(1.9) drop-shadow(0 0 9px #7fe3ff)', transform: 'scale(1.14)', offset: 0.3 },
    { filter: 'none', transform: 'scale(1)' }], 420);
  bump(host, 'hurt');
  burst(host, 'shock');
  float(host, `⚡ ${d}`, 'dot');
  log(`${host.name} is shocked by the jelly for ${d}.`, jelly.side);
  if (host.hp <= 0) fell(host, unitBy(jelly.owner) || jelly);
}

async function anchorSkill(u, t, sk) {
  await castPose(u, true);
  const a = spawnAttachment(u, t, 'anchor');
  addFx(t, 'rooted', 99, 0, true);
  await anchorDrop(t, a);
  render();
  log(`${u.name} drops a great anchor on ${t.name} — rooted in place until the anchor breaks.`, u.side);
  await wait(380);
}

async function jellySkill(u, t, sk) {
  await castPose(u, true);
  const a = spawnAttachment(u, t, 'jellyfish');
  await jellyThrow(u, t, a);
  jellyShock(a, t);   // the first shock lands at once
  render();
  await wait(340);
}

// The anchor plummets out of the top of the arena and slams down over the host. The element itself
// is parked over the host by settleAttachments; only its body drops, so the parking stays intact.
async function anchorDrop(host, a) {
  render();
  const b = bodyEl(a);
  if (reduced || !b) { burst(host, 'smoke'); return; }
  b.animate([{ transform: 'translateY(-340px)', opacity: 0 }, { transform: 'translateY(-36px)', opacity: 1, offset: 0.7 }, { transform: 'translateY(0)' }],
    { duration: beat(460), easing: 'cubic-bezier(.5,0,.85,1)' });
  await sleep(beat(460));
  burst(host, 'smoke');
  if (!reduced) $('#arena').animate([{ translate: '0 0' }, { translate: '0 5px' }, { translate: '0 -3px' }, { translate: '0 0' }], { duration: beat(260) });
}

// The jelly flies from Octavia and settles onto the host; its body starts back at her and glides in.
async function jellyThrow(u, t, a) {
  render();
  const b = bodyEl(a), from = stageBox(u), to = stageBox(t);
  if (reduced || !b || !from || !to) { burst(t, 'splash'); return; }
  const dx = from.x - to.x, dy = from.top - to.top;
  b.animate([{ transform: `translate(${dx.toFixed(0)}px, ${(dy - 40).toFixed(0)}px) scale(.5)`, opacity: 0.3 },
             { transform: `translate(${(dx * 0.4).toFixed(0)}px, ${(dy * 0.4 - 50).toFixed(0)}px) scale(.85)`, opacity: 1, offset: 0.6 },
             { transform: 'translate(0,0) scale(1)', opacity: 1 }],
    { duration: beat(440), easing: 'cubic-bezier(.3,.7,.3,1)' });
  await sleep(beat(440));
  burst(t, 'splash');
}

// A felled Gorehound comes apart: each head tears loose as an uncontrollable Hell Pup — 50 HP,
// no mana, no skills but a bite. independent:true so they outlive their (now dead) owner, exactly
// as a Salvage Bot outlives its Mech.
function splitGorehound(g) {
  const def = SUMMONS.splithound;
  for (let i = 0; i < (g.splitOnDeath || 2); i++) {
    const st = def.stats(g);
    state.summonSeq = (state.summonSeq || 0) + 1;
    const u = {
      uid: `${g.uid}h${state.summonSeq}`, id: 'splithound', art: 'splithound',
      side: g.side, summon: true, independent: true, owner: g.uid,
      name: def.name, level: g.level, faction: g.faction, race: null, role: def.role, floats: false,
      ...st, hp: st.maxHp, mp: 0, maxMp: 0, effects: [], cooldowns: {}, heat: 0, stacks: 0,
      hitSince: false, lastAction: null, combo: false,
      pos: clamp((g.pos || 300) + (i === 0 ? -60 : 60), 0, 820), expires: null,
    };
    state.teams[g.side].push(u);
    addUnitDom(u);
    burst(u, 'hit');
    float(u, 'Torn loose', 'fx');
  }
  log(`${g.name} is cut down — and both heads tear free as a pair of lesser hounds!`, g.side);
}

function spawnDeathBot(mech) {
  const def = SUMMONS.deathbot;
  const st = def.stats(mech);
  state.summonSeq = (state.summonSeq || 0) + 1;
  const u = {
    uid: `${mech.uid}d${state.summonSeq}`, id: 'deathbot', art: 'scrapbot',
    side: mech.side, summon: true, independent: true, owner: mech.uid,
    name: def.name, level: mech.level, faction: 'mech', race: null, role: def.role, floats: !!def.floats,
    ...st, hp: st.maxHp, effects: [], cooldowns: {}, heat: 0, stacks: 0,
    hitSince: false, lastAction: null, combo: false,
    pos: 300 + Math.random() * 200, expires: null,
  };
  state.teams[mech.side].push(u);
  addUnitDom(u);
  burst(u, 'smoke');
  float(u, 'Salvaged', 'fx');
  log(`${mech.name} is destroyed — a ${u.name} claws out of the wreckage!`, mech.side);
  return u;
}

// After damage resolves, any Ironclad champion that just fell leaves one Salvage Bot.
function sweepDeathBots() {
  for (const u of allUnits()) {
    if (u.faction === 'mech' && !u.summon && u.hp <= 0 && !u.botSpawned) {
      u.botSpawned = true;
      spawnDeathBot(u);
    }
    // A slain Gorehound comes apart into its two heads (see splitGorehound).
    if (u.splitOnDeath && !u.summon && u.hp <= 0 && !u.splitDone) {
      u.splitDone = true;
      splitGorehound(u);
    }
  }
}

// Summons leave when their time runs out or their summoner falls; the fallen lie there a while first.
// A Salvage Bot's last act. Down to its final sparks (≤25% HP), on its turn it stops fighting:
// it drags itself to the ally in the most need — the one lowest on health, and never another
// Salvage Bot (scrap mending scrap saves no one) — and empties whatever charge it has left into
// them as a mend, then comes apart. salvageMendTarget picks who; nextTurn calls salvageLastRites
// in place of the bot's normal action.
function salvageMendTarget(u) {
  return alliesOf(u)
    .filter((a) => a !== u && a.id !== 'deathbot' && !a.inert && !has(a, 'coffin') && !undyingOn(a))
    .sort((a, b) => a.hp - b.hp)[0] || null;   // lowest HP = closest to falling, the one worth saving
}
async function salvageLastRites(u) {
  const t = salvageMendTarget(u);
  if (!t) return false;
  const mend = u.hp;   // everything it has left to give
  float(u, '🔧 Salvage', 'fx');
  log(`${u.name} sputters to its last — it drags itself to ${t.name} and empties its core into them.`, u.side);
  await dashTo(u, [t]);   // crawl over to the wounded ally; it won't be going home again
  await wait(120);
  burst(t, 'heal');
  healUnit(u, t, mend, 'Salvage');
  render();
  await wait(240);
  u.hp = 0;               // the core is spent: the bot falls apart where it stands
  float(u, 'Scrapped', 'dot');
  burst(u, 'smoke');
  fell(u, null);
  render();
  await wait(200);
  return true;
}

function cleanupSummons() {
  sweepDeathBots();
  for (const u of allUnits().filter((x) => x.summon)) {
    const owner = unitBy(u.owner);
    // A broken Grave Cross leaves no body; crossFliesHome takes it off the field once it is home.
    if (u.inert && u.hp <= 0) { if (!u.felled) fell(u, null); continue; }
    if (u.hp <= 0) {
      // Illusions pop; everything else drops a body. The first pass past a fresh corpse starts its
      // clock (overwriting whatever was left of its life timer), later passes clear it away.
      if (!leavesCorpse(u)) removeUnit(u);
      else if (u.downAt == null) { u.downAt = state.time; u.expires = state.time + CORPSE_TIME; }   // == null: it can drop at time 0
      else if (u.expires <= state.time + EPS) removeUnit(u);
      // A corpse stays put even if its summoner falls too: it is already dead, so nothing more can
      // happen to it. Taking the hp <= 0 branch first is what keeps the two rules below off it.
    }
    else if (u.spent) {   // a Mirror Dust double that has given its three turns or soaked its eight blows
      log(`${u.name} ${u.spent === 'shattered' ? 'shatters under the blows' : 'ripples and fades'}.`, u.side);
      burst(u, 'smoke');
      removeUnit(u);
    }
    else if (!u.independent && (!owner || owner.hp <= 0)) { log(`${u.name} vanishes with its summoner.`, 'sys'); removeUnit(u); }
    else if (u.expires != null && u.expires <= state.time + EPS) {
      log(SUMMONS[u.id].leave(u), 'sys');
      removeUnit(u);
    }
  }
}

// Timed effects (stun, overheat) that have run out are removed here.
function expireTimed() {
  for (const u of allUnits()) {
    const done = u.effects.filter((e) => e.until != null && e.until <= state.time + 1e-6);
    if (!done.length) continue;
    u.effects = u.effects.filter((e) => !done.includes(e));
    if (u.hp <= 0) continue;
    for (const e of done) {
      if (e.id === 'overheat') { u.heat = 0; log(`${u.name} has cooled down and moves again.`, 'sys'); }
      else if (e.id === 'burrowed') { log(`${u.name} claws his way back up out of the grave.`, u.side); burst(u, 'smoke'); }
      else if (e.id === 'stagger') log(`${u.name} regains their footing.`, 'sys');
      else log(`${u.name} shakes off the stun and moves again.`, 'sys');
    }
  }
}

// Moves the speed bar forward until someone reaches the end; returns that unit.
// Stops early at round boundaries (weather, High Tide) and when a frozen unit thaws.
async function advanceClock(token) {
  while (token === state.token) {
    const living = allUnits().filter(alive);
    const movers = living.filter((u) => !frozen(u) && !u.inert);   // a planted cross never takes a turn
    // Deadlock guard: if everyone left is held off the bar on the Toll clock (BASH / coffin) and
    // nothing timed will free them, no turn will ever come up to tick a Toll — so pass one by hand.
    if (!movers.length) {
      const held = living.filter((u) => u.effects.some((e) => e.tolls != null));
      const timed = living.some((u) => u.effects.some((e) => e.until != null) || staggerSwitchIn(u) !== Infinity || u.expires != null);
      if (held.length && !timed) {
        for (const u of held) {
          for (const e of u.effects) if (e.tolls != null) e.tolls = Math.max(0, e.tolls - 1);
          const done = u.effects.filter((e) => e.tolls != null && e.tolls <= 0);
          if (done.length) { u.effects = u.effects.filter((e) => !done.includes(e)); for (const e of done) emergeToll(u, e); }
        }
        render();
        await waitBar(beat(220));
        continue;
      }
    }
    let next = null, dtActor = Infinity;
    for (const u of movers) {
      const dt = (TRACK - u.pos) / barAgi(u);
      if (dt < dtActor - 1e-9) { dtActor = dt; next = u; }
    }
    const dtRound = state.round * ROUND_TIME - state.time;
    const thaws = living.flatMap((u) => [
      ...u.effects.filter((e) => e.until != null).map((e) => e.until - state.time),
      staggerSwitchIn(u),
      u.expires != null ? u.expires - state.time : Infinity,
    ]).filter((d) => d > EPS);
    const dtThaw = thaws.length ? Math.min(...thaws) : Infinity;
    // Earthquake: the next tremor on the field's clock (see QUAKE_EVERY). Never during the opening race.
    const dtJolt = quaking() && !state.opening
      ? Math.max(EPS, (state.quakeJolt ??= state.time + QUAKE_EVERY) - state.time) : Infinity;
    const dt = Math.max(0, Math.min(dtActor, dtRound, dtThaw, dtJolt));

    for (const u of movers) u.pos = Math.min(TRACK, u.pos + barAgi(u) * dt);
    state.time += dt;
    // The opening race is shown slower so you can watch everyone run from the start line.
    const ms = state.opening ? clamp(dt * 22, 900, 2200) : clamp(dt * 9, 120, 900);
    renderTrack(ms);
    if (dt > 0) await waitBar(ms);
    if (token !== state.token) return null;

    expireTimed();
    cleanupSummons();
    // The jolt lands: everyone grounded slides back a step, catches their footing, and presses on.
    // No status, no lost turn — flyers hover over it, and a planted cross has no feet to lose.
    if (quaking() && state.quakeJolt != null && state.quakeJolt - state.time <= EPS) {
      for (const u of allUnits()) if (alive(u) && !frozen(u) && !u.inert && !u.floats && !charNat(u).anchor) u.pos = Math.max(0, u.pos - QUAKE_SLIP);
      state.quakeJolt = state.time + QUAKE_EVERY;
      renderTrack(300);
      if (!reduced) $('#arena').animate([{ translate: '0 0' }, { translate: '0 5px' }, { translate: '0 -3px' }, { translate: '0 0' }], { duration: beat(280) });
      await waitBar(320);
      if (token !== state.token) return null;
    }
    if (dtRound <= dt + 1e-9) {
      const changed = newRound();
      render();
      if (changed) {
        await Promise.all([wait(1400), state.wxFx]);   // Brimstone Fall: let every meteor land first
        state.wxFx = null;
        if (token !== state.token) return null;
      }
    }
    if (next && dtActor <= dt + 1e-9 && alive(next) && state.teams[next.side].includes(next)) { next.pos = TRACK; return next; }
  }
  return null;
}

/* ==================================================================
   THE TURN PULSE — what happens as ANY unit's turn comes up, before
   the turn itself is taken. Two things ride the field's clock:
   Bolt-On's weld (each turn-start, whoever's it is, is one of its
   four mends) and Mara's Covering Fire (every 5th turn on the field
   is a free shot). Returns true if a shot ended the battle.
   ================================================================== */
function detachLatch(p, why) {
  const host = p.attachedTo && unitBy(p.attachedTo);
  p.attachedTo = null;
  p.latchLeft = 0;
  p.effects = p.effects.filter((e) => e.id !== 'bolted');
  if (host) host.effects = host.effects.filter((e) => e.id !== 'patchrig');
  if (p.hp > 0 && why !== 'recast')
    log(`${p.name} unbolts${why === 'spent' ? ': the weld is spent.' : why === 'host' ? ` — ${host ? host.name : 'his ally'} is down.` : '.'}`, p.side);
  settleLatch();
}

// A bolted-on champion rides pick-a-back: his figure is carried to the host's slot (offsetLeft /
// offsetTop ignore transforms, so repeated calls never drift). layoutSides and render both run
// often; this is re-applied after them and simply clears itself once nobody is attached.
function settleLatch() {
  for (const p of allUnits()) {
    const el = document.getElementById(`u-${p.uid}`);
    if (!el) continue;
    const host = p.attachedTo && unitBy(p.attachedTo);
    const hel = host && p.hp > 0 ? document.getElementById(`u-${host.uid}`) : null;
    if (hel) {
      const back = (p.side === 'p' ? -1 : 1) * hel.offsetWidth * 0.34;   // behind the host, shoulder high
      const dx = hel.offsetLeft + hel.offsetWidth / 2 - (el.offsetLeft + el.offsetWidth / 2) + back;
      const dy = hel.offsetTop - el.offsetTop - hel.offsetHeight * 0.16;
      el.classList.add('latched');
      el.style.translate = `${Math.round(dx)}px ${Math.round(dy)}px`;
      el.style.zIndex = (parseInt(hel.style.zIndex, 10) || 10) - 1;
    } else if (el.classList.contains('latched')) {
      el.classList.remove('latched');
      el.style.translate = '';
      el.style.zIndex = '';
    }
  }
  settleAttachments();
}

// Anchors and Jellies stand on the caster's side but are carried over to their host's slot, so they
// read as clamped onto the enemy. offsetLeft/Top ignore transforms, so repeated calls never drift.
function settleAttachments() {
  for (const a of allUnits()) {
    if (!a.attach) continue;
    const el = document.getElementById(`u-${a.uid}`);
    if (!el) continue;
    const host = a.hp > 0 && unitBy(a.hostUid);
    const hel = host ? document.getElementById(`u-${host.uid}`) : null;
    if (hel) {
      const anchor = a.attach === 'anchor';
      // The Anchor is planted BEHIND the champion — shifted to their back (away from the way they face)
      // and raised a little, so it reads as standing behind them rather than covering them. The Jelly
      // rides high on the front. zIndex puts the anchor behind the host and the jelly in front.
      const over = anchor ? 0 : -hel.offsetHeight * 0.18;
      const back = anchor ? -facing(host) * hel.offsetWidth * 0.15 : 0;
      const dx = hel.offsetLeft + hel.offsetWidth / 2 - (el.offsetLeft + el.offsetWidth / 2) + back;
      const dy = hel.offsetTop - el.offsetTop + over;
      el.classList.add('attached');
      el.style.translate = `${Math.round(dx)}px ${Math.round(dy)}px`;
      el.style.zIndex = (parseInt(hel.style.zIndex, 10) || 10) + (anchor ? -1 : 2);
    } else if (el.classList.contains('attached')) {
      el.classList.remove('attached');
      el.style.translate = '';
      el.style.zIndex = '';
    }
  }
}

// A Toll-counted effect runs out as this turn comes up: the unit shakes off a BASH, steadies from
// FEAR, or the coffin lid lifts. Hero level decides how much mercy the coffin folds in on the way
// out (set at cast): Lv5+ leaves the curses behind, Lv10+ steps the ally out already warded.
function emergeToll(u, e) {
  if (e.id === 'bash') {
    float(u, 'Comes to', 'fx');
    log(`${u.name} shakes off the Bash and moves again.`, 'sys');
  } else if (e.id === 'fear' || e.id === 'flee') {
    float(u, 'Steadies', 'fx');
    log(`${u.name} masters its fear.`, u.side);
  } else if (e.id === 'coffin') {
    if (e.cleanse) cleanse(u);                                     // Lv5+: ill things stay in the box
    if (e.shield) { burst(u, 'shield'); addFx(u, 'shield', 2); }   // Lv10+: steps out shielded
    burst(u, 'grave');
    float(u, 'Unsealed', 'fx');
    log(`${u.name} steps out of the coffin.`, u.side);
  }
}

async function turnPulse() {
  // Bolt-On: every turn anyone takes is one of the weld's four.
  for (const p of allUnits()) {
    if (!p.attachedTo) continue;
    if (p.hp <= 0 || !has(p, 'bolted')) { detachLatch(p, 'broken'); continue; }   // e.g. stripped in a coffin
    const host = unitBy(p.attachedTo);
    if (!host || host.hp <= 0) { detachLatch(p, 'host'); continue; }
    p.latchLeft--;
    if (host.hp < host.maxHp) {
      burst(host, 'heal');
      healUnit(p, host, p.latchHeal, 'Bolt-On');
      render();
      await wait(300);
    }
    if (p.latchLeft <= 0) detachLatch(p, 'spent');
  }
  // Covering Fire: Mara counts every turn that passes, friend or foe, and the fifth is hers.
  // Frozen, coffined (or dead) she holds the shot and lets it off at the next turn she's free.
  for (const m of allUnits()) {
    if (!m.watch || m.hp <= 0) continue;
    m.watchN = (m.watchN || 0) + 1;
    if (m.watchN < m.watch || hardFrozen(m) || inBox(m) || has(m, 'bash')) continue;
    const picks = validTargets(m, { target: 'enemy' });   // the law of the field: taunters first
    if (!picks.length) continue;
    m.watchN = 0;
    const tg = pick(picks);
    float(m, 'Covering Fire', 'fx');
    log(`${m.name}'s Covering Fire: a free shot, and ${tg.name} is in it.`, m.side);
    markAttacked(tg);
    await aimPose(m);
    await shoot(m, tg, projectileFor(m, { id: 'attack', name: 'Covering Fire', kind: 'damage', o: {} }));
    strikeOnce(m, tg, 1, 'Covering Fire', {});
    render();
    await wait(260);
    if (checkEnd()) return true;
  }
  // THE TOLLS TICK — one turn has come up on the field, so every effect counted on the global clock
  // loses a Toll. BASH and the coffin hold their owner off the speed bar until the count runs out
  // (emergeToll frees them); FEAR simply fades. Everything expires here, never on the owner's turn.
  let fled = false;
  for (const u of allUnits()) {
    if (u.hp <= 0) continue;
    const fl = has(u, 'flee');
    if (fl && u.pos > 0) { u.pos = Math.max(0, u.pos - fl.step); u.recoil = true; fled = true; }
    for (const e of u.effects) if (e.tolls != null) e.tolls = Math.max(0, e.tolls - 1);
    const done = u.effects.filter((e) => e.tolls != null && e.tolls <= 0);
    if (!done.length) continue;
    u.effects = u.effects.filter((e) => !done.includes(e));
    for (const e of done) emergeToll(u, e);
    render();
  }
  if (fled) { renderTrack(300); await wait(FLEE_MS * 0.6); }   // let the frightened run their step back
  // Stinging Jelly (Octavia): every 3 Tolls it shocks its host for 15 magic, until it is burst.
  for (const a of allUnits()) {
    if (a.attach !== 'jellyfish' || a.hp <= 0) continue;
    const host = unitBy(a.hostUid);
    if (!host || host.hp <= 0) continue;
    a.shockN = (a.shockN || 0) + 1;
    if (a.shockN % 3 !== 0) continue;
    jellyShock(a, host);
    render();
    await wait(240);
    if (checkEnd()) return true;
  }
  // Timed attachments (spawned with opts.life): count down one Toll each, and fall away when spent.
  for (const a of allUnits().filter((x) => x.attach && x.hp > 0 && x.tollLife != null)) {
    if (--a.tollLife > 0) continue;
    const host = unitBy(a.hostUid);
    if (host && host.hp > 0) { float(host, 'Freed', 'fx'); log(`The ${a.name} falls away from ${host.name}.`, host.side); }
    removeAttachment(a, 'expired');
  }
  return false;
}

async function nextTurn() {
  const token = state.token;
  while (token === state.token) {
    if (checkEnd()) return;
    cleanupSummons();
    nextWave();   // the Ballroom fills its empty slots between turns
    state.phase = 'busy';
    state.moving = true;
    render();
    if (state.opening) {
      // Hold everyone on the start line for a beat, then release them.
      renderTrack(0);
      announce('Battle start', 'Fight!');
      await wait(1100);
      if (token !== state.token) return;
    }
    const u = await advanceClock(token);
    state.opening = false;
    state.moving = false;
    if (!u || token !== state.token || checkEnd()) return;
    state.active = u.uid;
    state.phase = u.side === 'p' ? 'busy' : 'enemy';
    render();
    // One more turn passes on the field: Bolt-On's weld ticks, Covering Fire counts it.
    if (await turnPulse() || token !== state.token || checkEnd()) return;
    const s = await beginTurn(u);
    if (token !== state.token || checkEnd()) return;
    if (s !== 'ok') { endTurn(u); continue; }
    if (shouldFlee(u)) { await flee(u); continue; }
    // Your heroes wait for you; summons (on either side) act on their own.
    // Only your champion waits for your orders; recruits and summons act on their own.
    if (commandable(u)) { state.phase = 'choose'; state.pending = null; state.itemUsed = false; render(); return; }
    await wait(450);
    // A recruit may spend one satchel item before acting, just as you can on your turn.
    if (usesSatchel(u)) {
      const plan = aiItemPlan(u);
      if (plan) {
        await useItem(u, plan.key, plan.t);
        if (token !== state.token || checkEnd()) return;
        await wait(200);
      }
    }
    // A Salvage Bot on its last sparks gives the rest of itself away instead of swinging: it mends
    // the ally most in need and comes apart (see salvageLastRites). Only if there is someone to save.
    if (u.id === 'deathbot' && u.hp <= u.maxHp * 0.25 && !has(u, 'rooted') && salvageMendTarget(u)) {
      await salvageLastRites(u);
      if (token !== state.token) return;
      endTurn(u);
      await wait(250);
      continue;
    }
    const { sk, t } = bossPlan(u) || aiChoose(u);   // bosses enrage and telegraph their big attacks
    await doAction(u, sk, t);
    // A Mirror Dust double is good for three of its own turns; the third spent, it frays away.
    if (u.id === 'mirage' && --u.actsLeft <= 0 && u.hp > 0) u.spent = u.spent || 'faded';
    endTurn(u);
    await wait(250);
  }
}

// After acting, the unit's icon goes back to the start of the speed bar.
function endTurn(u) {
  u.pos = 0;
  renderTrack(350);
}

// The token check stops a battle you left mid-animation (Abandon run) from carrying on in the background.
async function commit(u, sk, t) {
  const token = state.token;
  await doAction(u, sk, t);
  if (token !== state.token) return;
  endTurn(u);
  await wait(250);
  if (token === state.token) nextTurn();
}

function onSkill(id) {
  if (state.phase !== 'choose') return;
  const u = unitBy(state.active);
  const sk = skillsOf(u).find((s) => s.id === id);
  if (!sk || !usable(u, sk)) return;
  // Single-target skills ask for a target, including a fallen ally for Second Burial (with only one
  // body on the field it is raised straight away).
  if (sk.target === 'enemy' || sk.target === 'ally' || sk.target === 'deadAlly') {
    const opts = validTargets(u, sk);
    if (opts.length === 1) return commit(u, sk, opts[0]);
    state.pending = sk.id;
    render();
    return;
  }
  commit(u, sk, sk.target === 'self' ? u : null);
}

// What the player is picking a target for: a skill id, or 'item:<key>' for a satchel item.
function pendingAction(u) {
  if (!state.pending || !u) return null;
  if (state.pending.startsWith('item:')) {
    const key = state.pending.slice(5);
    return { ...ITEMS[key], id: state.pending, item: key };
  }
  return skillsOf(u).find((s) => s.id === state.pending);
}

function onUnit(uid) {
  if (state.phase !== 'choose' || !state.pending) return;
  const u = unitBy(state.active);
  const sk = pendingAction(u);
  const t = unitBy(uid);
  if (!sk || !validTargets(u, sk).includes(t)) return;
  if (sk.item) useItem(u, sk.item, t);
  else commit(u, sk, t);
}

function onItem(key) {
  if (state.phase !== 'choose' || state.itemUsed || !(profile.items[key] > 0) || sparring()) return;
  const u = unitBy(state.active);
  if (ITEMS[key].target !== 'ally') return useItem(u, key, null);
  const opts = alliesOf(u);
  if (opts.length === 1) return useItem(u, key, opts[0]);
  state.pending = `item:${key}`;
  render();
}

// Satchel items are a free action: one per turn, then the champion still chooses a normal action.
async function useItem(u, key, t) {
  const token = state.token, it = ITEMS[key];
  // Recruits reach into the same satchel mid-turn, so hand the phase back to whatever
  // it was. Forcing 'choose' here would give you the controls during someone else's turn.
  const resume = u.you ? 'choose' : state.phase;
  state.phase = 'busy'; state.pending = null;
  if (u.you) state.itemUsed = true;   // the one-per-turn gate is only on your own satchel row
  profile.items[key]--;
  saveProfile();
  log(`${u.name} uses a ${it.name}.`, u.side);
  for (const t of questEvent('item', { key })) log(t, 'sys');
  render();
  await castPose(u);
  if (key === 'draught') { burst(t, 'heal'); healUnit(u, t, Math.round(t.maxHp * 0.35), it.name); }
  else if (key === 'tonic') {
    burst(t, 'buff');
    if (t.maxMp) gainMp(t, 40);
    else if (t.faction === 'mech') { t.heat = Math.max(0, t.heat - 50); float(t, 'Vented', 'fx'); log(`${t.name} vents Heat.`, t.side); }
  } else if (key === 'salts') { burst(t, 'buff'); cleanse(t); log(`${t.name} is purified.`, t.side); }
  else if (key === 'firebomb') {
    for (const f of openFoes(u)) {
      const dmg = Math.max(1, Math.round(f.maxHp * 0.1));
      f.hp = Math.max(0, f.hp - dmg);
      burst(f, 'fire');
      knock(f, false);
      float(f, `${dmg}`, 'dmg');
      log(`The Firebomb scorches ${f.name} for ${dmg}.`, u.side);
      if (f.hp <= 0) fell(f, u);
      else { addFx(f, 'burn', 3, Math.round(u.atk * 0.25)); ownFx(u, f, 'burn'); }
    }
  } else if (key === 'horn') {
    for (const a of alliesOf(u)) if (a !== u) { a.pos = Math.min(TRACK, (a.pos || 0) + 300); burst(a, 'roar'); float(a, 'Surge', 'fx'); }
    log('The War Horn sounds. Your warband surges forward.', u.side);
  } else if (key === 'mirage') {
    // The dust throws off an uncontrolled copy of the user (stats, reach and fade set in SUMMONS.mirage).
    const s = summonUnit(u, 'mirage');
    burst(s, 'smoke');
    float(s, 'Conjured', 'fx');
  }
  render();
  await wait(450);
  if (token !== state.token) return;
  cleanupSummons();
  if (checkEnd()) return;
  state.phase = resume;
  render();
}

/* Recruits raid the same satchel you do, so they are deliberately stingy: a charge is
   only spent when it clearly beats casting, and never on a fight already won. Returns
   { key, t } or null. Enemies never qualify — see the guard in the turn loop. */
function aiItemPlan(u) {
  const have = (k) => (profile.items[k] || 0) > 0;
  const allies = alliesOf(u).filter((a) => !a.attachedTo);   // both already drop the fallen for us; a bolted-on drone can't be singled out either
  const foes = foesOf(u);
  // 1. Someone is a hit away from going down.
  if (have('draught')) {
    const hurt = allies.filter((a) => a.hp / a.maxHp <= 0.4)
      .sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0];
    if (hurt) return { key: 'draught', t: hurt };
  }
  // 2. A stun or a stack of debuffs costs more than any single cast.
  if (have('salts')) {
    const sick = allies.find((a) => has(a, 'stun') || has(a, 'silence') || debuffs(a) >= 2);
    if (sick) return { key: 'salts', t: sick };
  }
  // 3. A caster who cannot pay for their own skills, or an Ironclad about to overheat.
  if (have('tonic')) {
    const dry = allies.find((a) => (a.maxMp && a.mp < 25) || (a.faction === 'mech' && a.heat >= 75));
    if (dry) return { key: 'tonic', t: dry };
  }
  // 4. The Firebomb earns its 50 gold when it finishes someone off, or when a crowd is
  //    already grinding the warband down. A foe count alone is true on turn one of nearly
  //    every fight, which would throw all three bombs in the opening rounds.
  if (have('firebomb')) {
    const finishes = foes.some((f) => f.hp <= Math.round(f.maxHp * 0.1));
    const pressed = foes.length >= 3 && allies.some((a) => a.hp / a.maxHp < 0.6);
    if (finishes || pressed) return { key: 'firebomb', t: null };
  }
  // The War Horn is left to you on purpose: its value depends on turn order you can
  // read off the speed bar and the AI cannot, so it would only ever be wasted here.
  return null;
}

// Your recruits may use the satchel; summons, monsters and every enemy never touch it.
const usesSatchel = (u) => u.side === 'p' && !u.you && !u.summon && !u.monster && !sparring();   // a spar never touches your satchel

/* ==================================================================
   GAUNTLET FLOW
   ================================================================== */
function pickEnemyTeam(fac) {
  const pool = ROSTER.filter((c) => c.faction === fac);
  const melee = pick(pool.filter((c) => c.role === 'melee'));
  // Factions without ranged fighters (Crimson Court) field a second melee instead.
  const rangedPool = pool.filter((c) => c.role === 'ranged');
  const ranged = pick(rangedPool.length ? rangedPool : pool.filter((c) => c.role === 'melee' && c !== melee));
  // Then more of the faction until the band matches your warband's size.
  const band = [melee, ranged];
  while (band.length < TEAM_SIZE) band.push(pick(pool.filter((c) => !band.includes(c))));
  return band.map((c) => c.id).sort((a, b) => ['melee', 'support', 'ranged'].indexOf(charById(a).role) - ['melee', 'support', 'ranged'].indexOf(charById(b).role));
}

function startGauntlet() {
  if (!profile.hero || state.team.length !== TEAM_SIZE) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  state.mode = 'gauntlet';
  state.level = heroLevel();
  state.battle = 0;
  state.order = shuffle(FACTION_KEYS);
  state.runPending = false;
  profile.stats.runs++;
  saveProfile();
  startBattle(false);
}

// A cave hunt: one battle against a monster pack from the chosen depth. Retry keeps the same pack.
function startHunt(depthId) {
  const d = depthById(depthId);
  if (!profile.hero || state.team.length !== TEAM_SIZE) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (!d || heroLevel() < d.minLv || state.runPending) return;
  state.mode = 'hunt';
  state.hunt = { depth: d.id };
  state.enemyIds = rollPack(d);
  startBattle(true);
}

const huntDepth = () => (state.mode === 'hunt' ? depthById(state.hunt?.depth) : null);

function startBattle(retry) {
  FFWD = false;   // fast-forward never carries into a fresh fight
  const hunt = huntDepth(), dg = dungeonRun(), duel = state.mode === 'duel' ? state.duel : null, spar = sparring() ? state.spar : null;
  const fac = hunt || dg || duel || spar ? null : state.order[state.battle];
  if (!retry && !hunt && !dg && !duel && !spar) state.enemyIds = pickEnemyTeam(fac);
  // Your warband fights at your champion's level. Slot 0 is you: the only unit that takes your orders.
  state.level = spar ? spar.lv : heroLevel();
  state.teams.p = (spar ? spar.p : state.team).map((id, i) => makeUnit(charById(id), state.level, 'p', i));
  if (spar && state.teams.p[0]) {
    // Sparring: slot 0 is still 'you', but it only carries your name when it is your own champion.
    state.teams.p[0].you = true;
    if (profile.hero && spar.p[0] === profile.hero.id) state.teams.p[0].name = heroName();
  } else if (profile.hero && state.teams.p[0]) { state.teams.p[0].you = true; state.teams.p[0].name = heroName(); }
  // Enemies: one level below you at first, rising every two battles, and 85% → 105% strength across the run.
  if (hunt || dg) {
    // Monsters fight at your level, never below the depth's or dungeon's minimum.
    const src = hunt || dg;
    state.teams.e = state.enemyIds.map((id, i) => makeMonster(id, Math.max(src.minLv, state.level), i, src.scale));
    // Dungeons: HP and MP carry over from the previous room.
    if (dg) {
      for (const u of state.teams.p) {
        const c = state.dg.carry[u.id];
        if (c) { u.hp = Math.max(1, Math.min(u.maxHp, c.hp)); u.mp = Math.max(0, Math.min(u.maxMp, c.mp)); }
      }
      // Monsters that fled the last room are here, still wounded, and won't run a second time.
      for (const f of state.dg.fled || []) {
        const u = state.teams.e.find((x) => x.id === f.id && !x.fledOnce && !x.boss);
        if (!u) continue;
        u.fledOnce = true;
        u.hp = Math.max(1, Math.round(u.maxHp * f.hp));
      }
      state.dg.fled = [];
      state.dg.fledNow = 0;
    }
  } else if (spar) {
    // Sparring: the other side at the same level, full strength.
    state.teams.e = spar.e.map((id, i) => makeUnit(charById(id), spar.lv, 'e', i));
    for (const u of state.teams.e) if (spar.p.includes(u.id)) u.name = `Rival ${u.name}`;
  } else if (duel) {
    // Proving Grounds: a rival warband at the tier's level and strength.
    state.teams.e = state.enemyIds.map((id, i) => makeUnit(charById(id), duel.lv, 'e', i, duel.scale));
    for (const u of state.teams.e) if (state.team.includes(u.id)) u.name = `Rival ${u.name}`;
  } else {
    const enemyLv = Math.max(1, state.level - 1 + Math.floor(state.battle / 2));
    const enemyScale = 0.85 + 0.2 * state.battle / (state.order.length - 1);
    state.teams.e = state.enemyIds.map((id, i) => makeUnit(charById(id), enemyLv, 'e', i, enemyScale));
    for (const u of state.teams.e) if (state.team.includes(u.id)) u.name = `Rival ${u.name}`;
  }
  state.round = 1; state.time = 0; state.moving = false; state.active = null;
  state.frontline = { p: 0, e: 0 };   // the front-line rule starts fresh every battle
  // Everyone lines up at the start of the speed bar and races to Act together.
  for (const u of allUnits()) u.pos = 0;
  state.opening = true;
  state.phase = 'busy'; state.pending = null; state.reward = null; state.log = [];
  state.killXp = 0; state.kills = 0;   // what your champion's killing blows earn here, paid out at the end
  state.weather = 'clear'; state.nextWeather = rollWeather('clear'); state.quake = 0; state.quakeJolt = null;
  state.wxNext = 1 + WEATHER_EVERY; state.wxFx = null;   // battles open under Clear Skies; the first change is at round 4
  state.screen = 'battle';
  state.token++;
  $('#overlay').hidden = true;
  if (dg) log(`${dg.name}, ${dgIsBossRoom() ? 'the boss room' : `room ${state.dg.room + 1} of ${dgRooms()}`}: ${state.teams.e.map((u) => `${u.name}${u.fledOnce ? ' (wounded)' : ''}`).join(', ')}.`, 'sys');
  else if (hunt) log(`${CAVE.name}, ${hunt.name}: ${state.teams.e.map((u) => u.name).join(', ')}.`, 'sys');
  else if (spar) log(`Sparring at the Training Yard, level ${spar.lv}: ${state.teams.p.map((u) => u.name).join(', ')} against ${state.teams.e.map((u) => u.name).join(', ')}.`, 'sys');
  else if (duel) log(`The Proving Grounds, ${duel.name} for ${duel.pay} gold: ${duel.band} — ${state.teams.e.map((u) => u.name).join(', ')}.`, 'sys');
  else log(`Battle ${state.battle + 1} of ${state.order.length} against ${theFaction(FACTIONS[fac])}.`, 'sys');
  log('Round 1', 'round');
  buildArena();
  applyDgCond();   // after buildArena: the Haunting's status popups need the units on the field
  render();
  window.scrollTo(0, 0);
  nextTurn();
}

/* The dungeon's standing condition, applied at the top of every room. Grave Damp and Firedamp
   are read where they apply (soaked(), the Burn tick); the Haunting has to pick its marks. */
function applyDgCond() {
  // Castle Harrowgate: name the battlefield and let round 1's hazard open with the room.
  const d = dungeonRun();
  if (d?.roomConds) {
    const where = d.roomNames?.[state.dg.room];
    if (where) log(`${where}.`, 'wx');
    hazardRound();
    return;
  }
  const c = dgCond();
  if (!c) return;
  log(`${c.name}: ${c.desc}`, 'wx');
  if (dgCondIs('haunt')) {
    for (const side of ['p', 'e']) {
      const u = pick(state.teams[side].filter((x) => alive(x) && !x.summon));
      if (u) addFx(u, 'hex', 999);
    }
  }
}

// Hunt results: XP from every monster in the pack, gold per monster, and 'slay'/'hunt' events for
// bounties and quests. Monster fights never count as a win against a faction (vs: null).
function endHunt(won) {
  const d = huntDepth(), lv = state.teams.e[0]?.level || 1;
  const slain = state.teams.e.filter((u) => u.monster && !alive(u));
  const news = slain.flatMap((u) => questEvent('slay', { monster: u.id }));
  state.stoneNews = [];
  if (won) {
    state.phase = 'won';
    // A won hunt sometimes turns up a Chipped gem stone among the pack's leavings.
    if (Math.random() < HUNT_STONE_CHANCE) { const sid = rollStone(1); addStone(sid); state.stoneNews.push(stoneName(sid)); }
    state.goldWon = guildGold(HUNT_GOLD_BASE + HUNT_GOLD_PER * state.teams.e.length);
    profile.gold += state.goldWon;
    profile.stats.earned += state.goldWon; profile.stats.wins++;
    const xp = Math.round(state.teams.e.reduce((s, u) => s + MONSTERS[u.id].xp, 0) * (1 + 0.1 * (lv - 1)));
    state.reward = payXp(xp);
    news.push(...questEvent('win', { vs: null, flawless: state.teams.p.filter((u) => !u.summon).every(alive), rounds: state.round, kills: 0 }),
      ...questEvent('hunt', { cave: 'emberhollow', depth: d.id }), ...guildWin());
  } else {
    state.phase = 'lost';
    state.reward = payXp(XP_LOSS);
    news.push(...questEvent('loss', { kills: 0 }));
  }
  state.level = heroLevel();
  fillNewSlots(state.level);
  saveProfile();
  state.questNews = news;
}

/* ---------- Sparring: the Training Yard's practice ring ----------
   Pick any champions for both sides at any level and, by default, give every one of them their
   orders yourself, enemies included. Nothing is won or lost: no gold, XP, items, quests, bounties
   or materials (questEvent is silent during a spar), and the satchel stays shut.
     state.sparSel  the matchup being set up in the yard: { p: [ids], e: [ids], slot: [side, i], lv, ctl }
     state.spar     the matchup being fought (a copy taken when it starts)
   ctl: 'all' everyone takes your orders · 'side' your side only · 'you' only slot 0, like a real battle. */
const SPAR_CTL = [['all', 'Everyone'], ['side', 'My side only'], ['you', 'Only my champion']];
const sparring = () => state.mode === 'spar';
// Does this unit wait for your orders? Your champion always; in a spar, whoever the matchup says.
const commandable = (u) => !!u && !u.summon && (!!u.you || (sparring() && !u.monster
  && (state.spar.ctl === 'all' || (state.spar.ctl === 'side' && u.side === 'p'))));
const randomBand = () => shuffle(ROSTER.map((c) => c.id)).slice(0, TEAM_SIZE);

// The matchup on the yard's board, set up the first time you look: your warband against a random band.
function sparSetup() {
  if (!state.sparSel) {
    const mine = state.team.length === TEAM_SIZE ? [...state.team] : randomBand();
    state.sparSel = { p: mine, e: randomBand(), slot: ['p', 0], lv: heroLevel(), ctl: 'all' };
  }
  return state.sparSel;
}

function startSpar() {
  const m = sparSetup();
  if (state.runPending) return;   // a paused gauntlet run keeps the field until it's finished or abandoned
  state.mode = 'spar';
  state.spar = { p: [...m.p], e: [...m.e], lv: m.lv, ctl: m.ctl };
  state.enemyIds = state.spar.e;
  startBattle(true);
}

// The Sparring tab: two sides of slots, the roster to fill the picked slot, level and who you command.
function sparHTML() {
  const m = sparSetup(), [ss, si] = m.slot;
  const slot = (side, i) => {
    const id = m[side][i], c = charById(id), on = ss === side && si === i;
    const tag = side === 'p' && i === 0 ? '★ ' : '';
    return `<button class="hbtn" type="button" data-k="sslot:${side}:${i}" aria-pressed="${on}" title="Pick a champion for this slot">
      <div class="mini">${spriteSVG(id)}</div>
      <div class="t"><strong>${tag}${shortName(c)}</strong><small>${ROLES[c.role].label} · ${FACTIONS[c.faction].name}</small></div></button>`;
  };
  const side = (k, title) => `<div class="sside ${k}"><h4>${title}</h4>${m[k].map((_, i) => slot(k, i)).join('')}</div>`;
  const roster = ROSTER.map((c) => `<button class="hbtn" type="button" data-k="spick:${c.id}" aria-pressed="${m[ss][si] === c.id}">
      <div class="mini">${spriteSVG(c.id)}</div><div class="t"><strong>${shortName(c)}</strong><small>${ROLES[c.role].label}</small></div></button>`).join('');
  const ctl = SPAR_CTL.map(([k, n]) => `<button class="fbtn" type="button" data-k="sctl:${k}" aria-pressed="${m.ctl === k}">${n}</button>`).join('');
  const paused = state.runPending;
  return `<div class="spar">
    <p class="note">Set up any fight you like and play it out. <b>Nothing is won or lost</b> here: no gold, XP or items change hands,
      and quests and bounties don't count. Pick a slot, then a champion from the roster below.</p>
    <div class="sparSides">${side('p', 'Your side')}${side('e', 'The other side')}</div>
    <div class="sparRow"><span class="label">Level</span>
      <span class="lvstep"><button class="btn small" type="button" data-k="sparlv:-1"${m.lv <= 1 ? ' disabled' : ''} aria-label="Lower level">−</button>
        <b>${m.lv}</b><button class="btn small" type="button" data-k="sparlv:1"${m.lv >= LEVEL_CAP ? ' disabled' : ''} aria-label="Higher level">+</button></span></div>
    <div class="sparRow"><span class="label">You command</span><div class="filters" role="group" aria-label="Who takes your orders">${ctl}</div></div>
    <div class="btns">
      <button class="btn primary" type="button" data-k="sgo"${paused ? ' disabled' : ''}>Start sparring</button>
      <button class="btn small" type="button" data-k="srand">Random other side</button>
      <button class="btn small" type="button" data-k="sswap">Swap sides</button>
    </div>
    ${paused ? '<p class="note">Your gauntlet run is paused. Finish or abandon it at the Arena before sparring.</p>' : ''}
    <p class="label">Roster · filling ${ss === 'p' ? (si === 0 ? 'your champion' : `your slot ${si + 1}`) : `their slot ${si + 1}`}</p>
    <div class="heroList">${roster}</div>
  </div>`;
}

/* ---------- The Academy: Headmistress Ilse's lessons, the champion chart and the library ----------
   Lessons are read off each champion's own kit (champTags), so a new champion gets a lesson for free.
   They stay basic on purpose: at most two allies, two threats and two combos, and the rest is left
   for players to find out at the sparring ring.
     ALLY_RULES / THREAT_RULES  { f: faction key, when(tags, champion), why } — first matches win
     champCombos(c)             one or two openers built from the champion's own skills */
function champTags(c) {
  const t = new Set(), m = c.mods || {};
  for (const sk of c.skills || []) {
    const o = sk.o || {};
    if (o.element === 'lightning') t.add('lightning');
    if (o.aoe) t.add('aoe');
    if ((o.hits || 1) >= 3) t.add('multihit');
    if (o.stun) t.add('stun');
    for (const [id] of [...(o.fx || []), ...(sk.fx || []), ...(o.enemyFx || [])]) t.add(`fx:${id}`);
    if (o.bonusVs) t.add(`vs:${o.bonusVs}`);
    if (sk.kind === 'heal' || o.heal) t.add('heal');
    if (o.lifesteal) t.add('lifesteal');
    if (o.cleanse) t.add('cleanse');
    if (sk.kind === 'summon') t.add('summon');
    if (isMagic(o)) t.add('magic');
  }
  if (c.faction === 'crimson') t.add('lifesteal');
  if ((m.agi || 1) <= .85) t.add('slow');
  if ((m.agi || 1) >= 1.2) t.add('fast');
  if (t.has('fx:taunt') || ((m.hp || 1) >= 1.15 && (m.def || 1) >= 1.2)) t.add('tank');
  if (['fx:burn', 'fx:bleed', 'fx:poison'].some((k) => t.has(k))) t.add('dot');
  if (t.has('fx:shield') || t.has('fx:ward')) t.add('protect');
  return t;
}

const ALLY_RULES = [
  { f: 'tide', when: (t, c) => t.has('lightning') && c.faction !== 'tide', why: 'The Tideborn Soak everything they hit, and a Soaked foe takes 30% more from your lightning.' },
  { f: 'mech', when: (t, c) => c.faction === 'tide', why: 'Your hits Soak the enemy, and Ironclad lightning hits a Soaked foe 30% harder.' },
  { f: 'crimson', when: (t) => t.has('vs:bleed'), why: 'You hit Bleeding foes much harder, and the Court opens wounds on almost every blow.' },
  { f: 'human', when: (t, c) => c.faction === 'undead', why: 'Once a Pale Host champion is dying no heal can reach it, but Aldmere shields still catch that last blow.' },
  { f: 'stone', when: (t) => t.has('tank'), why: 'You draw the blows. Stoneleaf elves sharpen their aim every turn nobody hits them: +10% crit each, up to three.' },
  { f: 'orc', when: (t, c) => t.has('heal') && c.faction !== 'orc', why: 'The Horde hit hardest when hurt. A healer lets them ride that edge without falling off it.' },
  { f: 'orc', when: (t, c) => t.has('fx:burn') && c.faction !== 'orc', why: 'Ash Storms favour the Horde and make every Burn 50% stronger. You both want the same weather.' },
  { f: 'undead', when: (t) => t.has('protect'), why: 'A fallen Pale Host fights on until one more blow lands. Your shields and wards can keep that blow from landing.' },
  { f: 'crimson', when: (t) => t.has('fx:empower') || t.has('fx:ward'), why: 'Your buffs make every hit land harder, and the Court turns every hit into healing.' },
  { f: 'human', when: (t, c) => c.role === 'ranged' && !t.has('tank'), why: "Aldmere's armoured line holds the front, so you can keep firing from behind it." },
  { f: 'tide', when: (t, c) => c.role === 'melee' && !t.has('heal'), why: 'Tideborn healers mend hardest on High Tide, the even rounds when you are trading blows up front.' },
  { f: 'stone', when: () => true, why: 'A steady pick: dwarves to hold the line, elves to finish what you start.' },
];
const THREAT_RULES = [
  { f: 'crimson', when: (t) => t.has('heal') || t.has('lifesteal'), why: "The Court's Hex halves every heal you give or take, lifesteal included." },
  { f: 'orc', when: (t, c) => t.has('protect') || c.race === 'dwarf' || t.has('tank'), why: 'Horde fire and blades leave Burn and Bleed, which tick right past shields, wards and Fortify.' },
  { f: 'tide', when: (t, c) => c.race === 'elf', why: 'An elf loses its Precision the moment it is hit, and the Tideborn hit many times a turn.' },
  { f: 'crimson', when: (t) => t.has('slow'), why: 'Court duellists are quick. Expect them to act twice before you act once.' },
  { f: 'mech', when: (t) => t.has('summon'), why: 'Ironclad splash damage cuts through your summons and you at the same time.' },
  { f: 'human', when: (t, c) => c.faction === 'orc', why: 'Rage builds as you bleed. Aldmere marksmen hit hard enough to finish you before it does.' },
  { f: 'human', when: (t, c) => c.faction === 'mech', why: 'A stun freezes you while your Heat stays high, and Aldmere carry plenty of stuns.' },
  { f: 'tide', when: (t) => t.has('magic'), why: "A Tideborn siren's song silences: a silenced champion can only Attack or Guard." },
  { f: 'stone', when: (t, c) => c.role !== 'melee', why: 'Stoneleaf archers pick off whoever stands furthest back, and crit hardest when nobody touches them.' },
  { f: 'stone', when: (t, c) => c.role === 'melee', why: 'You have to reach them first. Stoneleaf archers wear you down while you close the distance.' },
  { f: 'mech', when: (t) => t.has('lifesteal'), why: 'Ironclad plating and shields shrink every blow you land, and a smaller blow drains less.' },
  { f: 'crimson', when: () => true, why: 'The Court drains what it hits: a long fight against them only gets longer.' },
  { f: 'orc', when: () => true, why: 'The Horde only get angrier as you hurt them. Finish one quickly or not at all.' },
];
function pickRules(rules, t, c, skipOwn) {
  const out = [];
  for (const r of rules) {
    if (out.length >= 2) break;
    if (skipOwn && r.f === c.faction) continue;
    if (!out.some((x) => x.f === r.f) && r.when(t, c)) out.push(r);
  }
  return out;
}
// One or two openers from the champion's own skills; the faction's habit if nothing pairs up.
function champCombos(c, t) {
  const sk = c.skills || [], out = [], dmg = sk.filter((x) => x.kind === 'damage').sort((a, b) => (b.mult || 0) * ((b.o?.hits) || 1) - (a.mult || 0) * ((a.o?.hits) || 1));
  const hasFx = (x, id) => [...(x.o?.fx || []), ...(x.fx || [])].some(([k]) => k === id);
  const pays = {};
  for (const pay of sk.filter((x) => x.o?.bonusVs)) {
    const app = sk.find((x) => x !== pay && hasFx(x, pay.o.bonusVs));
    if (app) (pays[app.name] ||= { fx: pay.o.bonusVs, list: [] }).list.push(pay.name);
  }
  for (const [app, { fx, list }] of Object.entries(pays)) {
    out.push(`Open with <b>${app}</b> to leave the foe ${FX[fx]?.label || fx}, then <b>${list.join('</b> or <b>')}</b> hits it 60% harder.`);
  }
  const sunder = sk.find((x) => hasFx(x, 'sunder')), big = dmg.find((x) => x !== sunder);
  if (sunder && big) out.push(`<b>${sunder.name}</b> cracks their armour first; <b>${big.name}</b> lands much harder on what's left.`);
  const stun = sk.find((x) => x.o?.stun || hasFx(x, 'stun')), big2 = dmg.find((x) => x !== stun);
  if (stun && big2) out.push(`Land <b>${stun.name}</b> and, while they're stunned, follow with <b>${big2.name}</b>: they can't answer.`);
  const buff = sk.find((x) => x.kind === 'buff' && x.target === 'self' && (hasFx(x, 'empower') || x.o?.reduceCd)), hit = dmg[0];
  if (buff && hit) out.push(`Cast <b>${buff.name}</b> on yourself first, then spend it on <b>${hit.name}</b>.`);
  const taunt = sk.find((x) => hasFx(x, 'taunt'));
  if (taunt) out.push(`Call them in with <b>${taunt.name}</b>, then Guard: every enemy swings at you, for half.`);
  const cl = sk.find((x) => x.o?.cleanse);
  if (cl) out.push(`Keep <b>${cl.name}</b> for when an ally is Burning, Poisoned or stunned: it clears them as it heals.`);
  const sum = sk.find((x) => x.kind === 'summon');
  if (sum) out.push(`Bring out <b>${sum.name.replace(/^Call the |^Assemble |^Summon /, '')}</b> early. It fights on its own and draws blows away from you.`);
  const HABIT = {
    human: 'Never use the same action twice in a row: Discipline adds 15% every time you switch.',
    mech: 'Spend Heat on your big hits, then Guard to vent before you overheat and lose a turn.',
    orc: 'Save your hardest hit for when you are hurt: Rage peaks near death.',
    stone: c.race === 'elf' ? 'Stay out of reach: every turn nobody hits you adds crit.' : 'Let them come. Every hit you take makes the next one hurt less.',
    tide: 'Hold your strongest skill for an even round: High Tide adds 25%.',
    crimson: 'Keep swinging. Every hit you land heals you, so a long fight favours you.',
    undead: 'Fall last. When you go down you keep fighting until one more blow lands, so spend those turns on your biggest skills.',
  };
  const seen = new Set(), kept = out.filter((line) => {
    const names = [...line.matchAll(/<b>([^<]+)<\/b>/g)].map((m) => m[1]);
    if (names.some((n) => seen.has(n))) return false;
    names.forEach((n) => seen.add(n));
    return true;
  });
  if (!kept.length) kept.push(HABIT[c.faction] || 'Mix your skills and watch the speed bar.');
  return kept.slice(0, 2);
}

const acadPick = () => (state.acadPick && charById(state.acadPick) ? state.acadPick : profile.hero?.id || state.team[0] || ROSTER[0].id);
// A scrolling strip of every champion's face, your warband first: tap one to study it.
function pickStripHTML() {

const factionChip = (f) => `<span class="fchip">${FACTIONS[f].name}</span>`;

function lessonHTML() {

      <h4>Fights well beside</h4><ul>${allies.map((r) => `<li>${factionChip(r.f)} ${r.why}</li>`).join('')}</ul>

const CHART_COLS = [['hp', 'HP', (u) => u.maxHp], ['atk', 'Attack', (u) => u.atk], ['def', 'Defense', (u) => u.def],
  ['agi', 'Agility', (u) => u.agi], ['mp', 'Mana', (u) => u.maxMp || 0], ['crit', 'Crit %', (u) => Math.round((u.crit || 0) * 100)]];
function chartHTML() {
  const lv = state.chartLv || heroLevel(), fac = state.chartFac || 'all', sort = state.chartSort || { k: 'hp', dir: -1 };
  const all = ROSTER.map((c) => ({ c, u: makeUnit(c, lv, 'e', 0) }));
  const max = Object.fromEntries(CHART_COLS.map(([k, , f]) => [k, Math.max(1, ...all.map((r) => f(r.u)))]));

  const head = (k, n) => `<th><button type="button" data-k="ysort:${k}" aria-pressed="${sort.k === k}">${n}${sort.k === k ? (sort.dir < 0 ? ' ▾' : ' ▴') : ''}</button></th>`;
  const mine = profile.hero?.id;
  const body = rows.map((r) => `<tr class="${r.c.id === mine ? 'you' : ''}">
      <td><button type="button" class="cname" data-k="ypick:${r.c.id}" title="Open in the library"><span class="mini">${spriteSVG(r.c.id)}</span><span><b>${shortName(r.c)}</b><small>${ROLES[r.c.role].label}</small></span></button></td>
      ${CHART_COLS.map(([k, , f]) => { const v = f(r.u); return `<td><span class="cbar" style="--p:${Math.round((v / max[k]) * 100)}%">${v || '—'}</span></td>`; }).join('')}
    </tr>`).join('');
  const facs = [['all', 'All'], ...FACTION_KEYS.map((k) => [k, FACTIONS[k].name.replace(/^The /, '')])]
    .map(([k, n]) => `<button class="fbtn" type="button" data-k="yfac:${k}" aria-pressed="${fac === k}">${n}</button>`).join('');
  return `<div class="sparRow"><span class="label">Level</span><span class="lvstep">

      <button class="btn small" type="button" data-k="ylv:1"${lv >= LEVEL_CAP ? ' disabled' : ''} aria-label="Higher level">+</button></span></div>
    <div class="filters" role="group" aria-label="Filter by faction">${facs}</div>

    <p class="note">Base stats at level ${lv}, before forging, weapons, kit, trinkets or furniture. A dash means no mana pool. Tap a header to sort, or a champion to read about them in the library.</p>`;

/* ---------- The Proving Grounds: duels against rival warbands ----------
   Three challengers wait whenever you visit: mixed-faction champion bands at
   rising stakes. You pay the stake to step in; a win pays it back with profit.
   Duels never touch a paused gauntlet run and never count as faction wins. */
const DUEL_TIERS = [
  { name: 'Skirmish',    lvOff: -1, scale: 0.9,  stake: 20, pay: 50,  xp: 30 },
  { name: 'Even Match',  lvOff: 0,  scale: 1,    stake: 40, pay: 100, xp: 45 },
  { name: 'High Stakes', lvOff: 2,  scale: 1.05, stake: 80, pay: 220, xp: 70 },
];
const BAND_NAMES = ['Raiders', 'Blades', 'Vanguard', 'Wolves', 'Free Company', 'Oathless', 'Ashwalkers', 'Banner'];

// A fresh set of challengers: one band per tier, any mix of factions.
function rollDuels() {
  state.duels = DUEL_TIERS.map((t, i) => {
    const ids = shuffle(ROSTER.map((c) => c.id)).slice(0, TEAM_SIZE)
      .sort((a, b) => ['melee', 'support', 'ranged'].indexOf(charById(a).role) - ['melee', 'support', 'ranged'].indexOf(charById(b).role));
    return { ...t, tier: i, ids, band: `${shortName(charById(ids[0]))}'s ${pick(BAND_NAMES)}` };
  });
}

function startDuel(i) {
  const d = state.duels[i];
  if (!profile.hero || state.team.length !== TEAM_SIZE) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (!d || state.runPending || profile.gold < d.stake) return;
  profile.gold -= d.stake;
  saveProfile();
  state.mode = 'duel';
  state.duel = { ...d, lv: Math.max(1, heroLevel() + d.lvOff) };
  state.enemyIds = d.ids;
  startBattle(true);
}

// Duel results: the stake is already paid, so a win returns it with profit.
// Like hunts, duels never count as a win against a faction (vs: null).
function endDuel(won) {
  const d = state.duel;
  const news = [];
  if (won) {
    state.phase = 'won';
    state.goldWon = guildGold(d.pay);
    profile.gold += state.goldWon;
    profile.stats.earned += state.goldWon; profile.stats.wins++;
    profile.stats.duelWins = (profile.stats.duelWins || 0) + 1;
    const xp = Math.round(d.xp * (1 + 0.08 * (d.lv - 1)));
    state.reward = payXp(xp);
    const flawless = state.teams.p.filter((u) => !u.summon).every(alive);
    news.push(...questEvent('win', { vs: null, flawless, rounds: state.round, kills: enemyKills() }), ...guildWin());
  } else {
    state.phase = 'lost';
    state.reward = payXp(XP_LOSS);
    news.push(...questEvent('loss', { kills: enemyKills() }));
  }
  state.level = heroLevel();
  fillNewSlots(state.level);
  saveProfile();
  state.questNews = news;
}

/* ---------- Dungeon runs ---------- */
const dungeonRun = () => (state.mode === 'dungeon' ? dungeonById(state.dg?.id) : null);
// The run's standing condition (see DG_CONDS). Null in every other mode and in the plain dungeons.
const dgCond = () => { const d = dungeonRun(); return d?.cond ? DG_CONDS[d.cond] : null; };
const dgCondIs = (id) => dungeonRun()?.cond === id;
const dgRooms = () => DG_ROOM_COUNT + 1;                   // normal rooms + the boss room
const dgIsBossRoom = () => !!dungeonRun() && state.dg.room === DG_ROOM_COUNT;

// The run's rooms: the dungeon's own packs first — each grown to a full war party — then fresh
// packs rolled from the same monsters. Every room fields DG_PACK_MIN–DG_PACK_MAX, and the grow
// never stacks a second healer onto a pack that already has one (the cave's old shaman rule).
function dgPlan(d) {
  const kinds = [...new Set(d.rooms.flat())];
  const healer = (id) => MONSTERS[id].role === 'support';
  const grow = (pack, size) => {
    const out = [...pack];
    while (out.length < size) {
      const id = pick(kinds);
      if (healer(id) && out.some(healer)) continue;
      out.push(id);
    }
    return out;
  };
  const roomSize = () => DG_PACK_MIN + Math.floor(Math.random() * (DG_PACK_MAX - DG_PACK_MIN + 1));
  const plan = d.rooms.slice(0, DG_ROOM_COUNT).map((r) => grow(r, roomSize()));
  while (plan.length < DG_ROOM_COUNT) plan.push(grow([], roomSize()));
  return plan;
}

function startDungeon(id) {
  const d = dungeonById(id);
  if (!profile.hero || state.team.length !== TEAM_SIZE) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (!d || heroLevel() < d.minLv || state.runPending) return;
  state.mode = 'dungeon';
  state.dg = { id, room: 0, gold: 0, xp: 0, carry: {}, done: false, plan: dgPlan(d), fled: [], held: [], waveSeq: 0 };
  enterRoom();
}

// The next room's monsters (or the boss and its adds), then the battle. Monsters that fled the
// last room are waiting here with the new pack; startBattle puts their wounds back on them.
function enterRoom() {
  const d = dungeonRun(), runaways = (state.dg.fled || []).map((f) => f.id);
  const fresh = (state.dg.plan || d.rooms)[state.dg.room] || pick(d.rooms);
  state.enemyIds = dgIsBossRoom()
    ? [d.boss, ...runaways, ...d.bossAdds].slice(0, DG_MAX_FOES)
    : [...runaways, ...fresh].slice(0, Math.max(DG_MAX_FOES, runaways.length));
  startBattle(true);
}

/* THE BALLROOM RALLIES — Castle Harrowgate only (waves: true). Every coward who fled the
   run waits in the Ballroom and steps back in whenever a field slot opens, still carrying
   the wounds they ran with. checkEnd calls this too, so the fight cannot end while anyone
   is still hiding behind the curtains: the boss AND the whole household must fall. */
function nextWave() {
  const d = dungeonRun();
  if (!d?.waves || !dgIsBossRoom() || !state.dg.held?.length) return false;
  if (state.teams.e.filter(alive).length >= DG_MAX_FOES) return false;
  const f = state.dg.held.shift();
  state.dg.waveSeq = (state.dg.waveSeq || 0) + 1;
  const u = makeMonster(f.id, Math.max(d.minLv, state.level), 20 + state.dg.waveSeq, d.scale);
  u.hp = Math.max(1, Math.round(u.maxHp * f.hp));
  u.fledOnce = true;
  state.teams.e.push(u);
  burst(u, 'smoke');
  log(`The household rallies: ${u.name} steps into the Ballroom, still wounded.`, 'sys');
  render();
  return true;
}

// A wounded minion takes its turn to run for it (see DUNGEONS above): the first DG_FLEE_CAP
// whose HP has fallen to DG_FLEE_AT or less break and run; after that the rest stand and die.
function shouldFlee(u) {
  if (!dungeonRun() || dgIsBossRoom() || u.side !== 'e' || !u.monster || u.boss || u.fledOnce || !alive(u)) return false;
  return u.hp / u.maxHp <= DG_FLEE_AT && (state.dg.fledNow || 0) < DG_FLEE_CAP;
}

async function flee(u) {
  const d = dungeonRun();
  state.dg.fledNow = (state.dg.fledNow || 0) + 1;
  // Castle Harrowgate (waves): cowards don't wait in the next room — they run all the way
  // home to the Ballroom, and step in beside their lord as the boss fight thins (nextWave).
  (d.waves ? (state.dg.held ||= []) : state.dg.fled).push({ id: u.id, hp: u.hp / u.maxHp });
  log(`${u.name} is badly hurt and ${d.waves ? 'runs for the great house!' : `flees deeper into ${d.name}!`}`, 'sys');
  float(u, 'Flees!', 'fx');
  const el = document.getElementById(`u-${u.uid}`);
  if (el) { el.classList.add('fleeing'); el.style.setProperty('--x', 115); }
  await wait(950);
  removeUnit(u);   // its summons go with it (cleanupSummons: no owner left)
  render();
}

// Room won: no stopping. The warband runs on after anything that fled, straight into the next room.
async function chaseDeeper() {
  const token = state.token, d = dungeonRun(), runaways = state.dg.fled.length;
  const ahead = state.dg.room + 1 === DG_ROOM_COUNT ? `${MONSTERS[d.boss].name} waits ahead` : `Room ${state.dg.room + 2} of ${dgRooms()}`;
  announce(runaways ? 'After them!' : 'Deeper in', runaways ? `${runaways === 1 ? 'A wounded monster runs' : 'The wounded run'} deeper · ${ahead}` : ahead);
  for (const u of state.teams.p) {
    const el = document.getElementById(`u-${u.uid}`);
    if (!el || !alive(u)) continue;
    el.classList.add('running');
    el.style.setProperty('--x', 112);
  }
  const fade = document.createElement('div');
  fade.className = 'chaseFade';
  $('#arena').appendChild(fade);
  await wait(1700);
  fade.classList.add('dark');
  await wait(600);
  fade.remove();
  if (token !== state.token || !dungeonRun()) return;   // abandoned mid-chase
  state.dg.room++;
  enterRoom();
}

// Bosses: enrage below half HP, and every few turns wind up a big telegraphed attack,
// which lands on their next turn (Guard, shields and wards are the answer).
function bossPlan(u) {
  if (!u.boss) return null;
  const m = MONSTERS[u.id];
  if (!u.enraged && u.hp <= u.maxHp * BOSS_ENRAGE_AT) {
    u.enraged = true;
    addFx(u, 'enraged', 999, 0, true);
    burst(u, 'roar');
    announce('Boss enraged', u.name);
    log(`${u.name} is enraged! It deals 35% more damage.`, 'sys');
  }
  const tg = m.telegraph;
  if (!tg) return null;
  if (u.windup) {
    u.windup = false;
    u.effects = u.effects.filter((e) => e.id !== 'windup');
    const sk = { ...tg.skill, id: 'tele' };
    return { sk, t: sk.target === 'enemy' ? pick(validTargets(u, sk)) : u };
  }
  u.bossTurns = (u.bossTurns || 0) + 1;
  if (u.bossTurns % tg.every === 0) return { sk: { id: 'windup', kind: 'windup', name: tg.name, target: 'self', o: {} }, t: u };
  return null;
}

// Chest loot: satchel items (into the satchel if there's room, else the stash, else their price in gold).
const HUNT_STONE_CHANCE = 0.35;
function chestLoot(d) {
  const got = [];
  let extraGold = 0;
  // Gem stones: one Chipped or Flawless, and from the boss's hoard a Flawless or, now and then, a Perfect.
  for (const sid of [rollStone(Math.random() < 0.5 ? 2 : 1), rollStone(Math.random() < 0.2 ? 3 : 2)]) {
    addStone(sid);
    got.push(`${stoneName(sid)} (stones)`);
  }
  for (let i = 0; i < d.chest.items; i++) {
    const k = pick(ITEM_KEYS);
    if ((profile.items[k] || 0) < SATCHEL_MAX) { profile.items[k] = (profile.items[k] || 0) + 1; got.push(`${ITEMS[k].name} (satchel)`); }
    else if ((profile.stash.items[k] || 0) < stashCap()) { profile.stash.items[k] = (profile.stash.items[k] || 0) + 1; got.push(`${ITEMS[k].name} (stash)`); }
    else { extraGold += ITEMS[k].price; got.push(`${ITEMS[k].price} gold instead of a ${ITEMS[k].name}`); }
  }
  return { got, extraGold };
}

function endDungeonRoom(won) {
  const d = dungeonRun(), boss = dgIsBossRoom(), lv = state.teams.e[0]?.level || 1;
  const slain = state.teams.e.filter((u) => u.monster && !alive(u));
  const news = slain.flatMap((u) => questEvent('slay', { monster: u.id }));
  for (const u of slain) if (u.boss) news.push(...questEvent('boss', { id: u.id }));
  if (won) {
    state.phase = 'won';
    state.goldWon = guildGold(HUNT_GOLD_BASE + HUNT_GOLD_PER * state.teams.e.filter((u) => u.monster).length);
    const xp = Math.round(state.teams.e.filter((u) => u.monster).reduce((s, u) => s + MONSTERS[u.id].xp, 0) * (1 + 0.1 * (lv - 1)) * DG_XP_MULT);
    state.reward = payXp(xp);
    const flawless = state.teams.p.filter((u) => !u.summon).every(alive);
    news.push(...questEvent('win', { vs: null, flawless, rounds: state.round, kills: 0 }), ...guildWin(boss));
    // Carry HP and MP to the next room: the fallen get up at 20%, then everyone rests a little.
    for (const u of state.teams.p.filter((x) => !x.summon)) {
      const hp = u.hp > 0 ? u.hp : Math.round(u.maxHp * DG_REVIVE);
      state.dg.carry[u.id] = {
        hp: Math.min(u.maxHp, hp + Math.round(u.maxHp * DG_REST_HP)),
        mp: Math.min(u.maxMp, (u.mp || 0) + Math.round(u.maxMp * DG_REST_MP)),
      };
    }
    if (boss) {
      // The chest, plus a trinket the first time this dungeon is cleared.
      const rec = profile.dungeons[d.id] = profile.dungeons[d.id] || { clears: 0 };
      const loot = chestLoot(d);
      state.dg.chest = { gold: d.chest.gold + loot.extraGold, items: loot.got, trinket: rec.clears === 0 ? d.firstClear : null };
      state.goldWon += state.dg.chest.gold;
      if (state.dg.chest.trinket) profile.stash.trinkets[d.firstClear] = (profile.stash.trinkets[d.firstClear] || 0) + 1;
      rec.clears++;
      state.dg.done = true;
      news.push(...questEvent('dungeon', { id: d.id, cleared: true, rooms: dgRooms() }));
    }
    profile.gold += state.goldWon;
    profile.stats.earned += state.goldWon; profile.stats.wins++;
  } else {
    state.phase = 'lost';
    state.goldWon = 0;
    state.reward = payXp(XP_LOSS);
    news.push(...questEvent('loss', { kills: 0 }), ...questEvent('dungeon', { id: d.id, cleared: false, rooms: state.dg.room }));
  }
  state.dg.gold += state.goldWon;
  state.dg.xp += state.reward.xp;
  state.level = heroLevel();
  fillNewSlots(state.level);
  saveProfile();
  state.questNews = news;
}

// Leaving between rooms ends the run; everything earned so far is kept.
function retreatDungeon() {
  const d = dungeonRun();
  if (d && !state.dg.done) state.questNews = questEvent('dungeon', { id: d.id, cleared: false, rooms: state.dg.room + 1 });
  toVillage();
  openPlace('gate');
}

async function endBattle(won) {
  state.active = null; state.pending = null;
  if (sparring()) {   // practice: nothing is won or lost
    state.phase = won ? 'won' : 'lost';
    state.reward = null; state.goldWon = 0; state.questNews = [];
    log(won ? 'The spar is over: your side wins.' : 'The spar is over: the other side wins.', 'sys');
    render();
    await wait(700);
    return showEndOverlay();
  }
  if (dungeonRun()) endDungeonRoom(won);
  else if (huntDepth()) endHunt(won);
  else if (state.mode === 'duel') endDuel(won);
  else if (won) {
    const cleared = state.battle === state.order.length - 1;
    // Gold: more for every battle deeper into the gauntlet, plus a bonus for clearing it.
    state.goldWon = guildGold(battleGold(state.battle) + (cleared ? CLEAR_BONUS : 0));
    profile.gold += state.goldWon;
    const s = profile.stats;
    s.earned += state.goldWon; s.wins++; s.best = Math.max(s.best, state.battle + 1);
    state.phase = cleared ? 'cleared' : 'won';
    if (cleared) s.clears++;
    // XP: more for every battle deeper into the run, plus a bonus for clearing it. Levels stick.
    const xp = battleXp(state.battle) + (cleared ? XP_CLEAR_BONUS : 0);
    state.reward = payXp(xp);
    const gnews = guildWin(cleared);
    state.level = heroLevel();
    fillNewSlots(state.level);
    saveProfile();
    const flawless = state.teams.p.filter((u) => !u.summon).every(alive);
    state.questNews = [...questEvent('win', { vs: state.order[state.battle], flawless, rounds: state.round, kills: enemyKills() }), ...(cleared ? questEvent('clear') : []), ...gnews];
  } else {
    state.phase = 'lost';
    state.questNews = questEvent('loss', { kills: enemyKills() });   // bounties still count the enemies you felled
    state.reward = payXp(XP_LOSS);   // even a loss teaches something
    state.level = heroLevel();
    fillNewSlots(state.level);
    saveProfile();
  }
  log(won ? `Victory. +${state.goldWon} gold, +${state.reward.xp} XP.` : `Your warband has fallen. +${state.reward.xp} XP.`, 'sys');
  if (state.reward.to > state.reward.from) log(`${heroName()} reaches level ${state.reward.to}!`, 'sys');
  const unlocked = questsUnlocked(state.reward.from, state.reward.to);
  state.questNews = [...state.questNews, ...unlocked];
  for (const t of state.questNews) log(t, 'sys');
  render();
  await wait(700);
  if (dungeonRun() && state.phase === 'won' && !state.dg.done) return chaseDeeper();
  showEndOverlay();
}

// Back to Cinderhold. A paused run (state.runPending) keeps its place in the gauntlet.
function toVillage() {
  state.token++;
  state.retireArmed = false;
  if (state.screen !== 'village') { rollFolk(); hideSay(); }   // different townsfolk are out each time you come back
  state.screen = 'village';
  if (!state.runPending) state.phase = 'idle';
  state.active = null; state.pending = null;
  $('#overlay').hidden = true;
  render();
  window.scrollTo(0, 0);
}
