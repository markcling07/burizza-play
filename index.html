function renderVillage() {
  $('#tagline').textContent = state.runPending
    ? `Your run is paused after battle ${state.battle + 1}. Return to the Arena to face ${theFaction(FACTIONS[state.order[state.battle + 1]])}.`
    : 'Season 1: Ashfall Road. Cinderhold is the last village before the road. Click a building to go inside.';
  document.querySelectorAll('.bld').forEach((b) => b.classList.toggle('open', b.dataset.place === state.place));

  const townies = $('#townies'), key = state.team.join();
  if (townies.dataset.k !== key) {
    townies.innerHTML = state.team.map((id, i) => {
      const [x, y] = TOWNIE_SPOTS[i];
      return `<div class="townie${i === 2 ? ' flip' : ''}" style="left:${mapX(x)};top:${mapY(y)};z-index:${y}"><div>${spriteSVG(id)}</div></div>`;
    }).join('');
    townies.dataset.k = key;
  }

  const npcs = $('#npcs'), folkKey = state.folk.map((f) => f.id + f.lane.x0).join();
  if (npcs.dataset.k !== folkKey) { npcs.innerHTML = npcsHTML(); npcs.dataset.k = folkKey; }
  updateQuestMarks();

  // A carnival game in progress owns its booth, so don't redraw over it.
  if (state.booth && state.place === 'carnival' && $('#boothHost')) return;

  // Re-render the panel, keeping keyboard focus on the same button if it still exists.
  const host = $('#placePanel');
  const focusKey = host.contains(document.activeElement) ? document.activeElement.dataset.k : null;
  if (state.sheet && !profile.hero) state.sheet = null;
  const html = state.place ? placeHTML(state.place) : state.sheet ? sheetHTML(state.sheet) : '';
  host.hidden = !html;
  host.innerHTML = html;
  if (focusKey) host.querySelector(`[data-k="${focusKey}"]`)?.focus();
  $('#dock').innerHTML = dockHTML();
  $('#battleDock').hidden = !profile.hero;
  zoomTown();
}

/* ==================================================================
   TOWN MAP — Cinderhold seen from above, in 2:1 isometric (a bird's-eye view).
   World positions are tiles: gx runs down-right on screen, gy down-left, z is height
   in map units. isoisoP(gx, gy, z) projects onto the MAP_W × MAP_H map. buildTownMap() draws it
   once at boot. Every place you can visit is a <g class="bld" data-place="…"> (its drawing)
   plus a second one holding only its .sign plate, in a top layer so no roof covers a sign.
   Keepers, townsfolk and your warband are HTML on top, placed in map units
   (KEEPERS[].at, FOLK_LANES, TOWNIE_SPOTS). The village wall runs tiles 3..37 both ways;
   the square's bonfire is at tile (21, 21) = map (1200, 848).
   ================================================================== */
const ISO = { x0: 1200, y0: 260, kx: 28, ky: 14 };
const RX = ISO.kx * Math.SQRT2, RY = ISO.ky * Math.SQRT2;   // a world circle of radius 1 → this ellipse
const n1 = (v) => String(Math.round(v * 10) / 10);
const isoX = (gx, gy) => ISO.x0 + (gx - gy) * ISO.kx;
const isoY = (gx, gy, z = 0) => ISO.y0 + (gx + gy) * ISO.ky - z;
const isoP = (gx, gy, z = 0) => `${n1(isoX(gx, gy))},${n1(isoY(gx, gy, z))}`;
const NS = ' stroke="none"';
const poly = (pts, fill, more = '') => `<polygon points="${pts.join(' ')}" fill="${fill}"${more}/>`;

// Lighten (f > 0) or darken (f < 0) a #rrggbb colour.
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), t = f < 0 ? 0 : 255, p = Math.abs(f);
  return `#${[n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v + (t - v) * p).toString(16).padStart(2, '0')).join('')}`;
}

// A soft shadow cast down-right of a footprint.
const shadowOf = (gx, gy, w, d, o = .35) =>
  poly([isoP(gx + o, gy + o), isoP(gx + w + o * 2, gy + o), isoP(gx + w + o * 2, gy + d + o * 2), isoP(gx + o, gy + d + o * 2)], 'rgba(0,0,0,.28)', NS);
// A circle on the ground (or at height z).
const disc = (cx, cy, r, fill, z = 0, more = '') =>
  `<ellipse cx="${n1(isoX(cx, cy))}" cy="${n1(isoY(cx, cy, z))}" rx="${n1(r * RX)}" ry="${n1(r * RY)}" fill="${fill}"${more}/>`;

// A solid box on tiles [gx, gx+w] × [gy, gy+d], h tall from z0. We see its left face (the gy+d side),
// its right face (the gx+w side) and its top; light comes from the upper left.
function box(gx, gy, w, d, h, col, z0 = 0) {
  const a = z0, b = z0 + h;
  return poly([isoP(gx, gy + d, a), isoP(gx + w, gy + d, a), isoP(gx + w, gy + d, b), isoP(gx, gy + d, b)], shade(col, -.1))
    + poly([isoP(gx + w, gy + d, a), isoP(gx + w, gy, a), isoP(gx + w, gy, b), isoP(gx + w, gy + d, b)], shade(col, -.3))
    + poly([isoP(gx, gy, b), isoP(gx + w, gy, b), isoP(gx + w, gy + d, b), isoP(gx, gy + d, b)], shade(col, .12));
}
// A gable roof on a w×d box of height h: ridge along gx ('x') or gy ('y'), rise rh, overhang o.
function gable(gx, gy, w, d, h, rh, roof, wall, axis = 'x', o = .3) {
  if (axis === 'x') {
    const m = gy + d / 2;
    return poly([isoP(gx - o, gy - o, h), isoP(gx + w + o, gy - o, h), isoP(gx + w + o, m, h + rh), isoP(gx - o, m, h + rh)], shade(roof, .15))
      + poly([isoP(gx + w, gy, h), isoP(gx + w, gy + d, h), isoP(gx + w, m, h + rh)], shade(wall, -.3))
      + poly([isoP(gx - o, m, h + rh), isoP(gx + w + o, m, h + rh), isoP(gx + w + o, gy + d + o, h), isoP(gx - o, gy + d + o, h)], roof);
  }
  const m = gx + w / 2;
  return poly([isoP(gx - o, gy - o, h), isoP(m, gy - o, h + rh), isoP(m, gy + d + o, h + rh), isoP(gx - o, gy + d + o, h)], shade(roof, .15))
    + poly([isoP(gx, gy + d, h), isoP(gx + w, gy + d, h), isoP(m, gy + d, h + rh)], shade(wall, -.1))
    + poly([isoP(m, gy - o, h + rh), isoP(gx + w + o, gy - o, h), isoP(gx + w + o, gy + d + o, h), isoP(m, gy + d + o, h + rh)], shade(roof, -.22));
}
// A four-sided (hip) roof rising to a point.
function hip(gx, gy, w, d, h, rh, roof, o = .3) {
  const A = isoP(gx - o, gy - o, h), B = isoP(gx + w + o, gy - o, h), C = isoP(gx + w + o, gy + d + o, h), D = isoP(gx - o, gy + d + o, h);
  const T = isoP(gx + w / 2, gy + d / 2, h + rh);
  return poly([A, B, T], shade(roof, .18)) + poly([D, A, T], shade(roof, .08)) + poly([B, C, T], shade(roof, -.25)) + poly([C, D, T], roof);
}
// An upright cylinder (towers, round huts, the arena wall).
function cyl(cx, cy, r, h, col, z0 = 0) {
  const x = isoX(cx, cy), yb = isoY(cx, cy, z0), yt = yb - h, rx = r * RX, ry = r * RY;
  return `<path d="M${n1(x - rx)} ${n1(yb)} A${n1(rx)} ${n1(ry)} 0 0 0 ${n1(x + rx)} ${n1(yb)} L${n1(x + rx)} ${n1(yt)} L${n1(x - rx)} ${n1(yt)} Z" fill="${shade(col, -.15)}"/>`
    + `<ellipse cx="${n1(x)}" cy="${n1(yt)}" rx="${n1(rx)}" ry="${n1(ry)}" fill="${shade(col, .1)}"/>`;
}
// Points around the front half of a circle at height z (t: 0 = right rim, π = left rim, through the front).
const rimPt = (cx, cy, r, z, t) => `${n1(isoX(cx, cy) + r * RX * Math.cos(t))},${n1(isoY(cx, cy, z) + r * RY * Math.sin(t))}`;
// A cone roof on a circle of radius r at height z, apex rh higher; stripes = [colourA, colourB, wedges].
function cone(cx, cy, r, z, rh, col, stripes) {
  const x = isoX(cx, cy), y = isoY(cx, cy, z), rx = r * RX, ry = r * RY, apex = `${n1(x)},${n1(y - rh)}`;
  let s = `<path d="M${n1(x - rx)} ${n1(y)} A${n1(rx)} ${n1(ry)} 0 0 0 ${n1(x + rx)} ${n1(y)} L${apex} Z" fill="${col}"/>`;
  if (stripes) {
    const [a, b, n] = stripes;
    for (let i = 0; i < n; i++) {
      const t0 = Math.PI * i / n, t1 = Math.PI * (i + 1) / n;
      s += `<polygon points="${apex} ${rimPt(cx, cy, r, z, t0)} ${rimPt(cx, cy, r, z, (t0 + t1) / 2)} ${rimPt(cx, cy, r, z, t1)}" fill="${i % 2 ? b : a}"/>`;
    }
  }
  return s;
}
// Vertical bands round the front of a cylinder (the carnival tent's striped wall).
function bands(cx, cy, r, z0, h, a, b, n) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const t0 = Math.PI * i / n, t1 = Math.PI * (i + 1) / n;
    s += `<polygon points="${rimPt(cx, cy, r, z0, t0)} ${rimPt(cx, cy, r, z0, t1)} ${rimPt(cx, cy, r, z0 + h, t1)} ${rimPt(cx, cy, r, z0 + h, t0)}" fill="${i % 2 ? b : a}"/>`;
  }
  return s;
}
// A patch painted on a box's left face (the side at gy, running along gx from u0 to u1), or its right face (at gx).
// Night lighting: whatever gives off light registers here as it's drawn: glows (lamps, fires, torches)
// and any window painted with class "lit". buildTownMap then cuts the night open around each one
// (see nightLayer). { x, y in map units, r: how far the light reaches, a: strength 0..1 }
let LIGHTS = [];
const light = (x, y, r, a = 1) => { LIGHTS.push({ x, y, r, a }); return ''; };
const litFace = (more, gx, gy, z) => (more.includes('lit') ? light(isoX(gx, gy), isoY(gx, gy, z), 72, .75) : '');
const onLeft = (gy, u0, u1, z0, z1, fill, more = '') => litFace(more, (u0 + u1) / 2, gy, (z0 + z1) / 2)
  + poly([isoP(u0, gy, z0), isoP(u1, gy, z0), isoP(u1, gy, z1), isoP(u0, gy, z1)], fill, more);
const onRight = (gx, v0, v1, z0, z1, fill, more = '') => litFace(more, gx, (v0 + v1) / 2, (z0 + z1) / 2)
  + poly([isoP(gx, v0, z0), isoP(gx, v1, z0), isoP(gx, v1, z1), isoP(gx, v0, z1)], fill, more);
// A straight line in the world (ropes, fence rails).
const line3 = (a, b, col, w = 2) => `<path d="M${isoP(...a)} L${isoP(...b)}" stroke="${col}" stroke-width="${w}" fill="none"/>`;
// A road between two tiles, w tiles wide.
function road(a, b, w, fill) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), nx = -dy / L * w / 2, ny = dx / L * w / 2;
  return poly([isoP(a[0] + nx, a[1] + ny), isoP(b[0] + nx, b[1] + ny), isoP(b[0] - nx, b[1] - ny), isoP(a[0] - nx, a[1] - ny)], fill, NS);
}
const smokeAt = (x, y, r = 9) => `<g fill="#6a6070" opacity=".6"${NS}>${[0, -1.7, -3.4].map((d) => `<circle class="smoke" cx="${n1(x)}" cy="${n1(y)}" r="${r}" style="animation-delay:${d}s"/>`).join('')}</g>`;
const glowAt = (x, y, r) => light(x, y, Math.min(260, Math.max(80, r * 5)), .95)
  + `<circle cx="${n1(x)}" cy="${n1(y)}" r="${r}" fill="url(#tGlow)" class="glow"${NS}/>`;

// Trees: a leafy one (kind 0), a pine (1) or a dead ash tree (2).
function tree(gx, gy, s = 1, kind = 0) {
  const x = isoX(gx, gy), y = isoY(gx, gy), q = (v) => n1(v * s);
  const shadow = `<ellipse cx="${n1(x + 6 * s)}" cy="${n1(y + 2)}" rx="${q(18)}" ry="${q(8)}" fill="rgba(0,0,0,.28)"${NS}/>`;
  if (kind === 1) return `${shadow}<rect x="${n1(x - 3 * s)}" y="${n1(y - 14 * s)}" width="${q(6)}" height="${q(14)}" fill="#4a3426"/>`
    + [[0, 30, 18], [-4, 46, 14], [-8, 60, 10]].map(([dy, h, w], i) => `<polygon points="${n1(x - w * s)},${n1(y - (10 + dy + i * 12) * s)} ${n1(x + w * s)},${n1(y - (10 + dy + i * 12) * s)} ${n1(x)},${n1(y - (10 + h) * s)}" fill="${['#24382a', '#2c4430', '#355238'][i]}"/>`).join('');
  if (kind === 2) return `${shadow}<path d="M${n1(x)} ${n1(y)} L${n1(x)} ${n1(y - 34 * s)} M${n1(x)} ${n1(y - 20 * s)} L${n1(x - 12 * s)} ${n1(y - 36 * s)} M${n1(x)} ${n1(y - 26 * s)} L${n1(x + 11 * s)} ${n1(y - 42 * s)}" stroke="#2a2026" stroke-width="${q(4)}" fill="none" stroke-linecap="round"/>`;
  return `${shadow}<rect x="${n1(x - 3 * s)}" y="${n1(y - 18 * s)}" width="${q(6)}" height="${q(18)}" fill="#5a3e28"/>`
    + `<circle cx="${n1(x)}" cy="${n1(y - 34 * s)}" r="${q(20)}" fill="#2f4a33"/><circle cx="${n1(x - 10 * s)}" cy="${n1(y - 27 * s)}" r="${q(13)}" fill="#3b5a3a"/>`
    + `<circle cx="${n1(x + 8 * s)}" cy="${n1(y - 42 * s)}" r="${q(12)}" fill="#4a6a40"/>`;
}
function lamp(gx, gy) {
  const x = isoX(gx, gy), y = isoY(gx, gy);
  return `<path d="M${n1(x)} ${n1(y)} V${n1(y - 44)}" stroke="#2a2228" stroke-width="3"/>${glowAt(x, y - 50, 20)}<rect x="${n1(x - 4)}" y="${n1(y - 56)}" width="8" height="11" rx="2" fill="#ffd28a"/>`;
}
// A villager's house: walls, a gable roof, a lit window and a door on the left face.
function house(gx, gy, w, d, h, wall, roof, axis = 'x', chimney = false) {
  let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, h, wall);
  s += onLeft(gy + d, gx + w * .35, gx + w * .35 + .55, 0, h * .62, '#2a1d16');
  s += onLeft(gy + d, gx + w * .65, gx + w * .65 + .6, h * .45, h * .78, '#ffd28a', ' class="lit"');
  s += onRight(gx + w, gy + d * .3, gy + d * .3 + .6, h * .45, h * .78, '#e8b060', ' class="lit"');
  s += gable(gx, gy, w, d, h, axis === 'x' ? d * 9 : w * 9, roof, wall, axis);
  if (chimney) {
    const cx = gx + w * .7, cy = gy + d * .25, top = h + (axis === 'x' ? d * 9 : w * 9) + 14;
    s += box(cx, cy, .5, .5, top, '#5a5460') + smokeAt(isoX(cx + .25, cy + .25), isoY(cx + .25, cy + .25, top) - 8, 7);
  }
  return s;
}

// Each place: [depth (front corner gx+gy, for painter's order), drawing, sign position, sign text].
function townPlaces() {
  const P2 = (gx, gy, z) => [isoX(gx, gy), isoY(gx, gy, z)];
  const out = {};

  // THE ARENA: a colosseum you look down into, gate facing the square.
  {
    const c = [13, 13], R = 4.6, H = 54;
    let s = disc(c[0] + .5, c[1] + .5, R + .3, 'rgba(0,0,0,.3)', 0, NS) + cyl(c[0], c[1], R, H, '#b08e62');
    for (const [r, z, f] of [[4.3, H, '#7a5a40'], [3.95, H - 9, '#a0805a'], [3.6, H - 18, '#8a6a4a'], [3.25, H - 27, '#a0805a'], [2.9, H - 36, '#5e4636'], [2.65, 6, '#c9a773']]) s += disc(c[0], c[1], r, f, z);
    s += disc(c[0], c[1], 1.2, 'none', 6, ' stroke="#a8875c" stroke-width="2" stroke-dasharray="8 6"');
    for (const zRow of [8, 30]) {
      for (let a = -30; a <= 120; a += 15) {
        if (zRow === 8 && Math.abs(a - 45) < 12) continue;
        const t = a * Math.PI / 180, [x, y] = P2(c[0] + R * Math.cos(t), c[1] + R * Math.sin(t), zRow);
        s += `<path d="M${n1(x - 6)} ${n1(y)} v-15 a6 6 0 0 1 12 0 v15z" fill="#3a2a22"/>`;
      }
    }
    const [gx, gy] = P2(c[0] + R * .707, c[1] + R * .707, 0);
    s += `<path d="M${n1(gx - 16)} ${n1(gy)} v-28 a16 16 0 0 1 32 0 v28z" fill="#1a1216"/><path d="M${n1(gx - 10)} ${n1(gy)} v-30 M${n1(gx)} ${n1(gy)} v-38 M${n1(gx + 10)} ${n1(gy)} v-30" stroke="#5a4a3e" stroke-width="2"/>`;
    s += glowAt(gx - 24, gy - 30, 14) + glowAt(gx + 24, gy - 30, 14);
    s += `<path class="flame" d="M${n1(gx - 28)} ${n1(gy - 26)} q2 -10 4 -12 q3 6 4 12z" fill="#ffb347"${NS}/><path class="flame" d="M${n1(gx + 20)} ${n1(gy - 26)} q2 -10 4 -12 q3 6 4 12z" fill="#ffb347"${NS}/>`;
    const flagCols = ['#c0303f', '#e8a548', '#6fb5e6', '#6cc28a', '#c48be0', '#e0645a'];
    [-150, -110, -70, -20, 110, 150].forEach((a, i) => {
      const t = a * Math.PI / 180, [x, y] = P2(c[0] + R * Math.cos(t), c[1] + R * Math.sin(t), H);
      s += `<path d="M${n1(x)} ${n1(y)} V${n1(y - 38)}" stroke="#2a2228" stroke-width="2"/><path class="flag" style="animation-delay:-${i * .4}s" d="M${n1(x + 1)} ${n1(y - 37)} l22 6 l-22 6z" fill="${flagCols[i]}"/>`;
    });
    const [sx, sy] = P2(c[0], c[1], H);
    out.arena = [33, s, [sx, sy - R * RY - 52], 'The Arena'];
  }

  // ELDER'S HUT: a round thatched hut with a skull totem.
  {
    const c = [8, 18];
    let s = disc(c[0] + .3, c[1] + .3, 2.3, 'rgba(0,0,0,.3)', 0, NS) + cyl(c[0], c[1], 1.9, 34, '#7a5a40');
    const [dx, dy] = P2(c[0] + 1.34, c[1] + 1.34, 0);
    s += `<path d="M${n1(dx - 9)} ${n1(dy)} v-22 a9 9 0 0 1 18 0 v22z" fill="#2a1d16"/>`;
    for (const a of [10, 85]) { const t = a * Math.PI / 180, [x, y] = P2(c[0] + 1.9 * Math.cos(t), c[1] + 1.9 * Math.sin(t), 20); light(x, y, 64, .7); s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="5" fill="#ffd28a" class="lit"/>`; }
    s += cone(c[0], c[1], 2.4, 30, 66, '#b08a4a', ['#b08a4a', '#9a7840', 8]);
    s += box(10.4, 15.4, .32, .32, 66, '#6b4f32');
    const [tx, ty] = P2(10.56, 15.56, 66);
    s += `<circle cx="${n1(tx)}" cy="${n1(ty - 4)}" r="7" fill="#e9e4d8"/><path d="M${n1(tx - 6)} ${n1(ty - 8)} q-8 -6 -6 -16 M${n1(tx + 6)} ${n1(ty - 8)} q8 -6 6 -16" stroke="#d8c8a8" stroke-width="2.5" fill="none"/>`;
    const [sx, sy] = P2(c[0], c[1], 96);
    out.elder = [28.7, s, [sx, sy - 34], "Elder's Hut"];
  }

  // CARNIVAL: a striped big top with the Ferris wheel turning behind it.
  {
    const c = [7, 25.5], [wx, wy] = P2(4.2, 22.8, 0), hub = [wx, wy - 118];
    let s = `<path d="M${n1(wx - 44)} ${n1(wy)} L${n1(hub[0])} ${n1(hub[1])} L${n1(wx + 44)} ${n1(wy)} M${n1(wx - 30)} ${n1(wy - 36)} H${n1(wx + 30)}" stroke="#3a2e3e" stroke-width="5" fill="none"/>`;
    const spokes = [0, 45, 90, 135].map((a) => { const t = a * Math.PI / 180; return `M${n1(hub[0] - 84 * Math.cos(t))} ${n1(hub[1] - 84 * Math.sin(t))} L${n1(hub[0] + 84 * Math.cos(t))} ${n1(hub[1] + 84 * Math.sin(t))}`; }).join(' ');
    const cars = ['#c0303f', '#ffd166', '#6fb5e6', '#6cc28a', '#c48be0', '#e8a548', '#e0645a', '#9fd6ff'].map((col, i) => { const t = i * Math.PI / 4; return `<circle cx="${n1(hub[0] + 84 * Math.cos(t))}" cy="${n1(hub[1] + 84 * Math.sin(t))}" r="9" fill="${col}"/>`; }).join('');
    s += `<g class="ferris" style="transform-origin: ${n1(hub[0])}px ${n1(hub[1])}px"><circle cx="${n1(hub[0])}" cy="${n1(hub[1])}" r="84" fill="none" stroke="#5a4a5e" stroke-width="4"/><path d="${spokes}" stroke="#4a3e4e" stroke-width="2" fill="none"/><g class="lit">${cars}</g></g><circle cx="${n1(hub[0])}" cy="${n1(hub[1])}" r="7" fill="#e8a548"/>`;
    light(hub[0], hub[1], 150, .55);   // the wheel's bulbs
    s += disc(c[0] + .4, c[1] + .4, 3, 'rgba(0,0,0,.3)', 0, NS) + cyl(c[0], c[1], 2.8, 34, '#e9e4d8') + bands(c[0], c[1], 2.8, 0, 34, '#c0303f', '#e9e4d8', 10);
    s += cone(c[0], c[1], 3.1, 34, 92, '#c0303f', ['#c0303f', '#e9e4d8', 12]);
    const [ax, ay] = P2(c[0], c[1], 126);
    s += `<path d="M${n1(ax)} ${n1(ay)} V${n1(ay - 22)}" stroke="#2a2228" stroke-width="2"/><path class="flag" d="M${n1(ax + 1)} ${n1(ay - 21)} l20 6 l-20 6z" fill="#e8a548"/>`;
    const [ex, ey] = P2(c[0] + 1.98, c[1] + 1.98, 0);
    s += `<path d="M${n1(ex - 14)} ${n1(ey)} L${n1(ex)} ${n1(ey - 30)} L${n1(ex + 14)} ${n1(ey)}Z" fill="#2a1420"/>` + glowAt(ex, ey - 10, 14);
    out.carnival = [36.5, s, [hub[0] + 40, hub[1] - 110], 'Carnival'];
  }

  // IRONSMITH: a stone forge with a glowing mouth, an anvil out front and a smoking chimney.
  {
    const [gx, gy, w, d, h] = [13, 24, 5, 3.5, 46], wall = '#7a7480';
    let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, h, wall);
    s += onLeft(gy + d, 13.5, 15.4, 0, 28, '#1c1316') + onLeft(gy + d, 13.75, 15.15, 0, 22, '#ff7a2f', ' class="glow"' + NS);
    s += onLeft(gy + d, 16.1, 17.2, 0, 32, '#2a1d16') + onRight(gx + w, 24.5, 25.6, 20, 32, '#ffd28a', ' class="lit"');
    const [gwx, gwy] = P2(14.5, 27.5, 10);
    s += glowAt(gwx, gwy, 40);
    s += gable(gx, gy, w, d, h, 32, '#4a4658', wall, 'x');
    s += box(16.4, 24.3, .8, .8, 112, '#5a5460');
    const [cx, cy] = P2(16.8, 24.7, 112);
    s += smokeAt(cx, cy - 10, 11) + `<g fill="#ffb347"${NS}><circle class="ember" cx="${n1(cx - 4)}" cy="${n1(cy)}" r="1.8" style="animation-duration:2.4s"/><circle class="ember" cx="${n1(cx + 5)}" cy="${n1(cy)}" r="1.5" style="animation-duration:2.9s;animation-delay:-1.2s"/></g>`;
    s += box(17.8, 28.4, .9, .45, 12, '#2a2a32') + box(17.6, 28.3, 1.3, .65, 4, '#3a3a44', 12);
    s += box(12.2, 24.6, .6, 2.6, 30, '#6b4f32') + [24.9, 25.6, 26.3].map((v) => line3([12.5, v, 30], [12.5, v, 62], '#c9d1de', 3)).join('');
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, h + 32);
    out.forge = [45.5, s, [sx, sy - 46], 'Ironsmith'];
  }

  // TRAINING YARD: a fenced sand yard with straw dummies, a target and a weapon rack.
  {
    const [gx, gy, w, d] = [8.5, 30, 5.5, 5];
    let s = poly([isoP(gx, gy), isoP(gx + w, gy), isoP(gx + w, gy + d), isoP(gx, gy + d)], '#c2a273');
    for (const [a, b] of [[[gx, gy], [gx + w, gy]], [[gx, gy], [gx, gy + d]]]) s += line3([...a, 14], [...b, 14], '#7a5434', 3) + line3([...a, 7], [...b, 7], '#7a5434', 3);
    for (let i = 0; i <= w; i += 1.1) s += box(gx + i, gy - .1, .2, .2, 18, '#6b4f32');
    for (let i = 1.1; i <= d; i += 1.1) s += box(gx - .1, gy + i, .2, .2, 18, '#6b4f32');
    for (const [x, y] of [[10, 31.5], [12, 31.5], [10.6, 33.6]]) {
      s += box(x, y, .18, .18, 44, '#6b4f32') + box(x - .6, y, 1.4, .18, 5, '#6b4f32', 34) + cyl(x + .09, y + .09, .45, 22, '#c9b28a', 12);
      const [hx, hy] = P2(x + .09, y + .09, 46);
      s += `<circle cx="${n1(hx)}" cy="${n1(hy)}" r="8" fill="#d8c08a"/>`;
    }
    const [tx, ty] = P2(13, 33.5, 0);
    s += `<path d="M${n1(tx - 10)} ${n1(ty)} L${n1(tx)} ${n1(ty - 30)} L${n1(tx + 10)} ${n1(ty)}" stroke="#6b4f32" stroke-width="3" fill="none"/><circle cx="${n1(tx)}" cy="${n1(ty - 34)}" r="16" fill="#e9e4d8"/><circle cx="${n1(tx)}" cy="${n1(ty - 34)}" r="10" fill="#c0303f"/><circle cx="${n1(tx)}" cy="${n1(ty - 34)}" r="4" fill="#e9e4d8"/>`;
    for (const [a, b] of [[[gx + w, gy], [gx + w, gy + d]], [[gx, gy + d], [gx + w, gy + d]]]) s += line3([...a, 14], [...b, 14], '#7a5434', 3) + line3([...a, 7], [...b, 7], '#7a5434', 3);
    for (let i = 0; i <= d; i += 1.1) s += box(gx + w - .1, gy + i, .2, .2, 18, '#6b4f32');
    for (let i = 0; i <= w; i += 1.1) s += box(gx + i, gy + d - .1, .2, .2, 18, '#6b4f32');
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, 60);
    out.train = [49, s, [sx, sy - 20], 'Training Yard'];
  }

  // GUILD HOUSE: a long hall hung with guild banners.
  {
    const [gx, gy, w, d, h] = [15, 3.8, 5, 4, 56], wall = '#8a6a4a';
    let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, h, wall);
    s += onLeft(gy + d, 16.9, 18.1, 0, 36, '#2a1d16');
    ['#c0303f', '#3e5a8c', '#3f7a4f', '#e8a548'].forEach((col, i) => { const u = [15.3, 16.1, 18.5, 19.3][i]; s += onLeft(gy + d, u, u + .55, 14, 46, col); });
    s += onRight(gx + w, 4.6, 5.4, 24, 40, '#ffd28a', ' class="lit"') + onRight(gx + w, 6.2, 7, 24, 40, '#ffd28a', ' class="lit"');
    s += gable(gx, gy, w, d, h, 40, '#7a2e2a', wall, 'x');
    const [cx, cy] = P2(gx + w, gy + d / 2, h + 18);
    s += `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="11" fill="#2a2228"/><path d="M${n1(cx - 7)} ${n1(cy - 7)} l14 14 M${n1(cx + 7)} ${n1(cy - 7)} l-14 14" stroke="#e8a548" stroke-width="3"/>`;
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, h + 40);
    out.guild = [27.8, s, [sx, sy - 40], 'Guild House'];
  }

  // JEWELER: a slim purple tower with a glowing gem on its spire.
  {
    const c = [24.5, 5.5];
    let s = disc(c[0] + .3, c[1] + .3, 1.5, 'rgba(0,0,0,.3)', 0, NS) + cyl(c[0], c[1], 1.3, 92, '#5a4a7a');
    const [dx, dy] = P2(c[0] + .92, c[1] + .92, 0);
    s += `<path d="M${n1(dx - 8)} ${n1(dy)} v-22 a8 8 0 0 1 16 0 v22z" fill="#1d1622"/><path d="M${n1(dx - 14)} ${n1(dy - 30)} h28 l-4 -8 h-20z" fill="#6e3a86"/>`;
    for (const z of [44, 70]) { const [x, y] = P2(c[0] + .5, c[1] + 1.2, z); light(x, y, 64, .7); s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="6" fill="#ffd28a" class="lit"/>`; }
    s += disc(c[0], c[1], 1.3, 'none', 92, ' stroke="#d9b44a" stroke-width="3"');
    s += cone(c[0], c[1], 1.6, 92, 72, '#2f2840');
    const [gx, gy] = P2(c[0], c[1], 164);
    light(gx, gy - 10, 150, .8);   // the gem lights the rooftops around it
    s += `<circle cx="${n1(gx)}" cy="${n1(gy - 10)}" r="22" fill="url(#tGem)" class="glow"${NS}/><path d="M${n1(gx)} ${n1(gy - 22)} l7 10 l-7 12 l-7 -12z" fill="#7fe3ff" stroke="#e9f8ff" stroke-width="1"/>`;
    out.jeweler = [31.8, s, [gx, gy - 52], 'Jeweler'];
  }

  // TAVERN: The Smoldering Mug, stone below, timber above, a swinging mug sign.
  {
    const [gx, gy, w, d] = [23, 9, 5, 4];
    let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, 34, '#7a6a5a') + box(gx, gy, w, d, 30, '#d2bd96', 34);
    for (let u = gx + .9; u < gx + w; u += 1) s += line3([u, gy + d, 34], [u, gy + d, 64], '#4a3426', 3);
    for (let v = gy + .9; v < gy + d; v += 1) s += line3([gx + w, v, 34], [gx + w, v, 64], '#4a3426', 3);
    s += onLeft(gy + d, 24.9, 26, 0, 26, '#2a1d16');
    for (const u of [23.5, 26.6]) s += onLeft(gy + d, u, u + .7, 10, 24, '#ffd28a', ' class="lit"');
    for (const u of [23.4, 25.2, 27]) s += onLeft(gy + d, u, u + .7, 42, 56, '#ffd28a', ' class="lit"');
    s += onRight(gx + w, 10.2, 10.9, 42, 56, '#e8b060', ' class="lit"') + onRight(gx + w, 11.8, 12.5, 42, 56, '#e8b060', ' class="lit"');
    s += gable(gx, gy, w, d, 64, 38, '#6a3a2a', '#d2bd96', 'x');
    s += box(26.6, 9.5, .7, .7, 122, '#5a5450');
    const [cx, cy] = P2(26.95, 9.85, 122);
    s += smokeAt(cx, cy - 10, 10);
    const [hx, hy] = P2(22.6, 13.2, 46);
    s += `<path d="M${n1(hx + 18)} ${n1(hy - 8)} h-22" stroke="#2a2228" stroke-width="3"/><g class="swing" style="transform-origin:${n1(hx)}px ${n1(hy - 8)}px"><rect x="${n1(hx - 14)}" y="${n1(hy - 4)}" width="28" height="22" rx="3" fill="#6b4f32"/><rect x="${n1(hx - 6)}" y="${n1(hy)}" width="10" height="13" rx="2" fill="#e8a548"/></g>`;
    for (const [x, y] of [[22.4, 11.4], [22.4, 12.3]]) s += cyl(x, y, .35, 16, '#6b4f32');
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, 102);
    out.tavern = [41, s, [sx, sy - 40], 'Tavern'];
  }

  // YOUR HOUSE: a cosy cottage with a flower box, a garden fence and your banner.
  {
    const [gx, gy, w, d, h] = [29.5, 14, 3, 2.5, 38], wall = '#8a6a4a';
    let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, h, wall);
    s += onLeft(gy + d, 30.6, 31.3, 0, 26, '#3a2418') + onLeft(gy + d, 29.8, 30.4, 14, 26, '#ffd28a', ' class="lit"') + onLeft(gy + d, 31.6, 32.2, 14, 26, '#ffd28a', ' class="lit"');
    s += onLeft(gy + d + .05, 29.7, 30.5, 10, 14, '#5a3e28') + onLeft(gy + d + .05, 31.5, 32.3, 10, 14, '#5a3e28');
    s += onRight(gx + w, 14.5, 15.2, 14, 26, '#e8b060', ' class="lit"');
    s += gable(gx, gy, w, d, h, 30, '#a8483a', wall, 'y');
    s += box(31.6, 14.3, .5, .5, 82, '#5a5460');
    const [cx, cy] = P2(31.85, 14.55, 82);
    s += smokeAt(cx, cy - 8, 7);
    const [fx, fy] = P2(gx + w / 2, gy + d / 2, h + 30);
    s += `<path d="M${n1(fx)} ${n1(fy)} V${n1(fy - 26)}" stroke="#2a2228" stroke-width="2"/><path class="flag" d="M${n1(fx + 1)} ${n1(fy - 25)} l18 5 l-18 5z" fill="#e8a548"/>`;
    for (let u = 29.3; u <= 32.9; u += .6) s += box(u, 17.4, .12, .12, 12, '#6b4f32');
    s += line3([29.3, 17.46, 9], [33, 17.46, 9], '#7a5434', 2);
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, h + 30);
    out.home = [49, s, [sx, sy - 52], 'Your House'];
  }

  // MARKET: three striped stalls piled with goods, crates and barrels.
  {
    let s = '';
    const stall = (gx, gy, a, b, goods) => {
      let t = shadowOf(gx, gy, 2, 2, .25);
      for (const [x, y] of [[gx, gy], [gx + 1.85, gy]]) t += box(x, y, .15, .15, 46, '#4a3426');
      t += box(gx, gy + 1.2, 2, .65, 16, '#7a5a3a');
      t += goods.map((col, i) => { const [x, y] = P2(gx + .3 + i * .45, gy + 1.5, 16); return `<circle cx="${n1(x)}" cy="${n1(y - 4)}" r="6" fill="${col}"/>`; }).join('');
      for (const [x, y] of [[gx, gy + 1.85], [gx + 1.85, gy + 1.85]]) t += box(x, y, .15, .15, 38, '#4a3426');
      for (let i = 0; i < 6; i++) {
        const u0 = gx - .15 + i * .383, u1 = u0 + .383;
        t += poly([isoP(u0, gy - .15, 48), isoP(u1, gy - .15, 48), isoP(u1, gy + 2.15, 38), isoP(u0, gy + 2.15, 38)], i % 2 ? b : a);
      }
      const [lx, ly] = P2(gx + 1, gy + 2.15, 38);   // a lantern hung under the awning's front edge
      t += `<path d="M${n1(lx)} ${n1(ly)} v7" stroke="#2a2228" stroke-width="1.5"/>${glowAt(lx, ly + 12, 16)}<rect x="${n1(lx - 3.5)}" y="${n1(ly + 7)}" width="7" height="9" rx="2" fill="#ffd28a"/>`;
      return t;
    };
    s += stall(25, 25, '#c0303f', '#e9e4d8', ['#c0303f', '#6cc28a', '#c0303f', '#e8a548']);
    s += stall(27.6, 25, '#3e5a8c', '#e9e4d8', ['#e0645a', '#9fe08a', '#6fb5e6', '#c48be0']);
    s += stall(30.2, 25, '#e8a548', '#3a2a20', ['#3e5a8c', '#c0303f', '#d9c58a', '#8a5a32']);
    s += box(26, 28.2, .8, .8, 16, '#8a6a4a') + box(26.1, 28.3, .6, .6, 12, '#7a5a3a', 16) + cyl(31.5, 28.6, .38, 18, '#6b4f32');
    const [sx, sy] = P2(28.6, 26, 48);
    out.market = [60, s, [sx, sy - 44], 'Market'];
  }

  // BOUNTY BOARD: a roofed notice board covered in pinned jobs.
  {
    let s = shadowOf(33, 24.4, 2.1, .4) + box(33.1, 24.4, .16, .16, 48, '#4a3426') + box(34.9, 24.4, .16, .16, 48, '#4a3426');
    s += box(33, 24.5, 2.2, .14, 30, '#6b4f32', 14);
    const face = 24.64;
    [[33.15, 33.65, 24, 40, '#e9dcc0'], [33.8, 34.35, 22, 42, '#f1ead6'], [34.45, 35.05, 26, 40, '#e0c79a'], [33.4, 33.9, 16, 22, '#f1ead6'], [34.1, 34.7, 15, 21, '#e9dcc0']]
      .forEach(([u0, u1, z0, z1, f]) => { s += onLeft(face, u0, u1, z0, z1, f); });
    for (const [u, z] of [[33.4, 40], [34.08, 42], [34.75, 40]]) { const [x, y] = P2(u, face, z); s += `<circle cx="${n1(x)}" cy="${n1(y)}" r="2.6" fill="#c0303f"${NS}/>`; }
    s += gable(32.9, 24.3, 2.4, .5, 46, 12, '#4a2f2a', '#4a2f2a', 'x', .1);
    const [lx, ly] = P2(33.18, 24.6, 44);   // a lantern on the left post, so the jobs can be read at night
    s += `${glowAt(lx - 6, ly, 18)}<rect x="${n1(lx - 10)}" y="${n1(ly - 5)}" width="7" height="9" rx="2" fill="#ffd28a"/>`;
    const [sx, sy] = P2(34.1, 24.5, 58);
    out.bounty = [59.6, s, [sx, sy - 34], 'Bounty Board'];
  }

  // PROVING GROUNDS: a roped duelling ring on a wooden platform.
  {
    const [gx, gy, w] = [27.5, 31, 5];
    let s = shadowOf(gx, gy, w, w) + box(gx, gy, w, w, 8, '#8a6a4a');
    const [cx, cy] = P2(gx + w / 2, gy + w / 2, 8);
    s += `<path d="M${n1(cx - 26)} ${n1(cy - 13)} l52 26 M${n1(cx + 26)} ${n1(cy - 13)} l-52 26" stroke="#5a3e28" stroke-width="5"/>`;
    const post = (x, y, col) => box(x - .15, y - .15, .3, .3, 34, col, 8);
    const rope = (a, b) => line3([...a, 36], [...b, 36], '#e9e4d8', 2.5) + line3([...a, 26], [...b, 26], '#e9e4d8', 2.5);
    const A = [gx + .2, gy + .2], B = [gx + w - .2, gy + .2], C = [gx + w - .2, gy + w - .2], D = [gx + .2, gy + w - .2];
    s += post(...A, '#c0303f') + post(...B, '#3e5a8c') + post(...D, '#3e5a8c') + rope(A, B) + rope(A, D);
    s += post(...C, '#c0303f') + rope(B, C) + rope(D, C);
    for (const [x0, y0] of [B, D]) {   // torches on the two side posts
      const [tx, ty] = P2(x0, y0, 44);
      s += glowAt(tx, ty - 6, 18) + `<path class="flame" d="M${n1(tx - 4)} ${n1(ty)} q1 -9 4 -12 q3 6 4 12z" fill="#ffb347"${NS}/>`;
    }
    const [sx, sy] = P2(gx + w / 2, gy + w / 2, 42);
    out.pvp = [68.5, s, [sx, sy - 52], 'Proving Grounds'];
  }

  // EXPEDITION GATE: twin stone towers astride the east road, in the village wall.
  {
    const stone = '#6a6470';
    let s = box(36.6, 18.6, 1.4, 1.4, 96, stone) + hip(36.6, 18.6, 1.4, 1.4, 96, 30, '#4a2f2a');
    s += box(36.8, 20, 1, 3, 22, '#5a5460', 74);
    ['#c0303f', '#e8a548', '#3e5a8c'].forEach((col, i) => { const v = 20.4 + i * .8; s += onRight(37.8, v, v + .5, 40, 74, col); });
    s += box(36.6, 23, 1.4, 1.4, 96, stone) + hip(36.6, 23, 1.4, 1.4, 96, 30, '#4a2f2a');
    for (const v of [19.3, 23.7]) { const [x, y] = P2(38, v, 60); s += glowAt(x, y, 14) + `<rect x="${n1(x - 3)}" y="${n1(y - 5)}" width="6" height="8" rx="2" fill="#ffd28a"/>`; }
    const [sx, sy] = P2(40, 22.5, 0);   // the sign stands outside, on the road it opens onto
    out.gate = [900, s, [sx, sy - 40], 'Expedition Gate'];
  }

  // EMBERHOLLOW CAVE: a dark mouth in a rocky knoll outside the west wall, glowing deep inside.
  {
    const [x, y] = P2(12, 48, 0);   // deep in the western woods, a walk down the forest trail from the wall
    let s = `<ellipse cx="${n1(x + 10)}" cy="${n1(y + 6)}" rx="150" ry="52" fill="rgba(0,0,0,.3)"${NS}/>`;
    s += `<path d="M${n1(x - 140)} ${n1(y + 10)} L${n1(x - 110)} ${n1(y - 70)} L${n1(x - 40)} ${n1(y - 128)} L${n1(x + 30)} ${n1(y - 140)} L${n1(x + 100)} ${n1(y - 96)} L${n1(x + 150)} ${n1(y + 6)} Q${n1(x)} ${n1(y + 50)} ${n1(x - 140)} ${n1(y + 10)}Z" fill="#5a5058"/>`;
    s += `<path d="M${n1(x - 40)} ${n1(y - 128)} L${n1(x + 30)} ${n1(y - 140)} L${n1(x + 100)} ${n1(y - 96)} L${n1(x + 20)} ${n1(y - 86)}Z" fill="#6e6470"/><path d="M${n1(x + 100)} ${n1(y - 96)} L${n1(x + 150)} ${n1(y + 6)} L${n1(x + 60)} ${n1(y + 30)} L${n1(x + 20)} ${n1(y - 86)}Z" fill="#433c46"/>`;
    s += `<path d="M${n1(x - 52)} ${n1(y + 24)} Q${n1(x - 50)} ${n1(y - 66)} ${n1(x - 6)} ${n1(y - 70)} Q${n1(x + 36)} ${n1(y - 60)} ${n1(x + 34)} ${n1(y + 26)}Z" fill="#140c10"/>`;
    s += glowAt(x - 8, y - 6, 44) + `<path d="M${n1(x - 30)} ${n1(y + 22)} q20 -26 46 -2" stroke="#ff7a2f" stroke-width="3" fill="none" opacity=".7"${NS}/>`;
    for (const [dx, dy, r] of [[-120, 4, 16], [118, 12, 20], [70, 28, 12]]) s += `<circle cx="${n1(x + dx)}" cy="${n1(y + dy)}" r="${r}" fill="#4a4450"/>`;
    out.cave = [1060, s, [x, y - 168], 'Emberhollow Cave'];   // outside the wall: drawn among the outer forest
  }

  // THE ARMORY: a stone-and-timber hall beside the Ironsmith, a weapon rack and an armor stand out front.
  {
    const [gx, gy, w, d, h] = [15, 30.4, 3.6, 3, 44], wall = '#8a8070', fy = gy + d;
    let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, h, wall);
    for (let u = gx + .9; u < gx + w; u += .9) s += line3([u, fy, 0], [u, fy, h], '#4a3426', 3);
    s += line3([gx, fy, h * .55], [gx + w, fy, h * .55], '#4a3426', 3);
    s += onLeft(fy, 16.35, 17.25, 0, 30, '#2a1d16') + line3([16.8, fy, 0], [16.8, fy, 30], '#4a3426', 2);
    s += onLeft(fy, 15.25, 15.8, 14, 22, '#ffd28a', ' class="lit"') + onLeft(fy, 17.8, 18.35, 14, 22, '#ffd28a', ' class="lit"');
    s += onRight(gx + w, 31, 31.7, 16, 28, '#e8b060', ' class="lit"') + onRight(gx + w, 32.2, 32.9, 16, 28, '#e8b060', ' class="lit"');
    s += gable(gx, gy, w, d, h, 34, '#3e4a5c', wall, 'y');
    // The crest on the gable end: a red shield bearing an upright sword.
    const [cx, cy] = P2(gx + w / 2, fy, h + 12);
    s += `<path d="M${n1(cx - 10)} ${n1(cy - 11)} h20 v9 q0 9 -10 13 q-10 -4 -10 -13z" fill="#c0303f"/>`
      + `<path d="M${n1(cx)} ${n1(cy - 8)} v15" stroke="#e9eef6" stroke-width="3"/><path d="M${n1(cx - 5)} ${n1(cy + 2)} h10" stroke="#e8a548" stroke-width="2.5"/>`;
    // Weapon rack (left of the door): two posts, two rails, a spear, a sword and an axe.
    s += box(15, 34.1, .14, .14, 32, '#4a3426') + box(16.05, 34.1, .14, .14, 32, '#4a3426');
    s += line3([15.07, 34.17, 28], [16.12, 34.17, 28], '#5a3e28', 3) + line3([15.07, 34.17, 10], [16.12, 34.17, 10], '#5a3e28', 3);
    s += line3([15.3, 34.17, 4], [15.3, 34.17, 50], '#7a5434', 2.5) + line3([15.3, 34.17, 50], [15.3, 34.17, 58], '#c9d1de', 3.5)
      + line3([15.6, 34.17, 6], [15.6, 34.17, 42], '#c9d1de', 3) + line3([15.5, 34.17, 14], [15.7, 34.17, 14], '#e8a548', 3)
      + line3([15.9, 34.17, 4], [15.9, 34.17, 38], '#7a5434', 2.5);
    const [ax, ay] = P2(15.9, 34.17, 36);
    s += `<path d="M${n1(ax)} ${n1(ay)} q8 2 8 9 q-8 -1 -8 -3z" fill="#c9d1de"/>`;
    // Armor stand (right of the door): a post, a breastplate, a helm and a leaning shield.
    s += box(18.05, 34.15, .12, .12, 36, '#4a3426') + cyl(18.11, 34.21, .3, 18, '#9aa3b5', 16);
    const [hx, hy] = P2(18.11, 34.21, 40);
    s += `<path d="M${n1(hx - 7)} ${n1(hy + 2)} v-6 a7 7 0 0 1 14 0 v6z" fill="#7a8296"/><path d="M${n1(hx - 5)} ${n1(hy - 1)} h10" stroke="#2a2228" stroke-width="2"/>`;
    const [bx, by] = P2(18.7, 34.4, 0);
    s += `<path d="M${n1(bx - 8)} ${n1(by - 2)} v-16 q8 -6 16 0 v16 q-8 7 -16 0z" fill="#3e5a8c" stroke="#e8a548" stroke-width="2"/>`;
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, h + 34);
    out.armory = [52.5, s, [sx + 40, sy - 52], 'The Armory'];
  }

  // THE WORKSHOP: a crafter's timber shed outside the south wall, a kiln smoking beside it, a workbench out front.
  {
    const [gx, gy, w, d, h] = [27, 39.4, 3.6, 2.6, 40], wall = '#7a5a3a', fy = gy + d;
    let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, h, wall);
    for (let u = gx + .6; u < gx + w; u += .6) s += line3([u, fy, 0], [u, fy, h], '#5a3e28', 2);
    s += onLeft(fy, 27.35, 29.05, 0, 28, '#2a1d16') + onLeft(fy, 27.55, 28.85, 2, 20, '#ff9a4a', ' class="glow"' + NS);
    s += onLeft(fy, 29.6, 30.25, 14, 26, '#ffd28a', ' class="lit"') + onRight(gx + w, 39.9, 40.6, 14, 26, '#e8b060', ' class="lit"');
    s += gable(gx, gy, w, d, h, 30, '#4f6a4a', wall, 'x');
    // The kiln: a squat stone dome with a glowing mouth and its own chimney.
    s += box(31.75, 39.6, .4, .4, 66, '#5a5460');
    const [cx, cy] = P2(31.95, 39.8, 66);
    s += smokeAt(cx, cy - 8, 8) + cyl(31.7, 40.3, .85, 26, '#6a6470') + cone(31.7, 40.3, .9, 26, 16, '#5a5460');
    const [kx, ky] = P2(31.7 + .6, 40.3 + .6, 6);
    s += glowAt(kx, ky - 6, 22) + `<path d="M${n1(kx - 7)} ${n1(ky + 3)} v-7 a7 7 0 0 1 14 0 v7z" fill="#ff7a2f"${NS}/>`;
    // Workbench, a vice and tools; crates of parts.
    s += box(27.5, 42.5, 1.7, .6, 14, '#8a6a4a') + box(27.8, 42.6, .3, .3, 6, '#4a5164', 14) + box(28.6, 42.55, .5, .2, 3, '#9aa3b5', 14);
    s += box(29.7, 42.5, .7, .7, 14, '#7a5a3a') + box(29.8, 42.6, .5, .5, 10, '#6b4f32', 14) + box(30.6, 42.2, .6, .6, 12, '#8a6a4a');
    const [lx, ly] = P2(29.3, 42.1, 32);
    s += box(29.25, 42.05, .1, .1, 34, '#4a3426') + glowAt(lx, ly, 16) + `<rect x="${n1(lx - 3.5)}" y="${n1(ly - 4)}" width="7" height="9" rx="2" fill="#ffd28a"/>`;
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, h + 30);
    out.workshop = [1072.6, s, [sx, sy - 46], 'The Workshop'];   // outside the wall: drawn among the outer forest
  }

  // THE ACADEMY: a stone schoolhouse beside the Training Yard, a bell cupola on its roof and a
  // slate board out front. Its door faces the yard.
  {
    const [gx, gy, w, d, h] = [4, 30.2, 3.6, 3.4, 50], wall = '#9a8f80', fx = gx + w;
    let s = shadowOf(gx, gy, w, d) + box(gx, gy, w, d, h, wall);
    s += line3([gx, gy + d, 16], [gx + w, gy + d, 16], '#7a7064', 3) + line3([fx, gy, 16], [fx, gy + d, 16], '#7a7064', 3);
    for (const u of [4.5, 5.6, 6.7]) s += onLeft(gy + d, u, u + .55, 22, 42, '#ffd28a', ' class="lit"');
    s += onRight(fx, 31.4, 32.4, 0, 30, '#2a1d16') + onRight(fx, 30.5, 31, 22, 40, '#e8b060', ' class="lit"') + onRight(fx, 32.8, 33.3, 22, 40, '#e8b060', ' class="lit"');
    // A banner by the door: an open book on blue.
    s += onRight(fx + .02, 30.9, 31.25, 30, 48, '#3e5a8c');
    s += hip(gx, gy, w, d, h, 30, '#34465e');
    // The bell cupola.
    const [bx, by] = [gx + w / 2 - .45, gy + d / 2 - .45];
    s += box(bx, by, .9, .9, 22, '#c9b48f', h + 18) + hip(bx, by, .9, .9, h + 40, 16, '#34465e', .15);
    const [cx, cy] = P2(bx + .45, by + .9, h + 30);
    s += `<path d="M${n1(cx - 5)} ${n1(cy + 4)} q5 -10 10 0z" fill="#e8a548"/>`;
    // The slate board on an easel, and a stack of books.
    const [ex, ey] = P2(8.2, 31, 0);
    s += `<path d="M${n1(ex - 12)} ${n1(ey)} L${n1(ex - 4)} ${n1(ey - 40)} M${n1(ex + 12)} ${n1(ey)} L${n1(ex + 4)} ${n1(ey - 40)}" stroke="#6b4f32" stroke-width="3"/>`
      + `<rect x="${n1(ex - 15)}" y="${n1(ey - 44)}" width="30" height="22" rx="2" fill="#2a3a34" stroke="#6b4f32" stroke-width="2"/>`
      + `<path d="M${n1(ex - 10)} ${n1(ey - 38)} h12 M${n1(ex - 10)} ${n1(ey - 33)} h18 M${n1(ex - 10)} ${n1(ey - 28)} h8" stroke="#e9e4d8" stroke-width="1.5"/>`;
    s += box(7.9, 33.9, .55, .4, 4, '#3e5a8c') + box(7.95, 33.95, .45, .35, 4, '#c0303f', 4) + box(7.9, 33.9, .5, .4, 4, '#e8a548', 8);
    const [sx, sy] = P2(gx + w / 2, gy + d / 2, h + 56);
    out.academy = [41.2, s, [sx, sy - 40], 'The Academy'];
  }
  return out;
}

// Seeded random numbers so the forest grows the same way on every visit.
function seeded(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

function buildTownMap() {
  const svg = $('#townMap');
  LIGHTS = [];
  light(810, 124, 230, .9);    // the volcano's crater
  light(1720, 190, 200, .35);  // the last of the sun, low over the hills
  const items = [];                        // [depth, svg] for everything that stands up
  const add = (depth, s) => items.push([depth, s]);
  const rnd = seeded(7);

  // Sky, mountains and the volcano, painted behind the world.
  let back = `<defs>

  <circle cx="1720" cy="190" r="190" fill="url(#tSun)"/><circle cx="1720" cy="190" r="40" fill="#ffd28a" opacity=".5"/>
  <path d="M0 330 L120 250 L260 300 L400 210 L560 280 L680 230 L760 260 L900 200 L1040 270 L1180 220 L1320 290 L1460 230 L1620 280 L1760 210 L1900 270 L2060 220 L2220 280 L2400 230 L2400 420 L0 420Z" fill="#2c2338"/>
  <path d="M520 360 L780 120 Q810 104 840 120 L1110 360Z" fill="#251c27"/>
  <circle cx="810" cy="122" r="50" fill="url(#tGlow)" class="glow"/>
  <path d="M786 124 Q810 140 834 124 Q810 114 786 124Z" fill="#ff7a2f"/>
  <path d="M800 132 Q786 200 760 270 M820 134 Q832 196 860 260" stroke="#ff7a2f" stroke-width="3" fill="none" opacity=".45"/>

// NIGHT.depth is how dark it gets (0 = daylight, 1 = pitch black).
const NIGHT = { color: '#0b0a1f', depth: .5 };

  return `<defs>
      <radialGradient id="nightHole"><stop offset="0" stop-color="#000"/><stop offset=".45" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>

    </defs>
    <g class="night" pointer-events="none"><rect width="${MAP_W}" height="${MAP_H}" fill="${NIGHT.color}" opacity="${NIGHT.depth}" mask="url(#nightMask)"/><g style="mix-blend-mode:screen">${pools}</g></g>`;
}
