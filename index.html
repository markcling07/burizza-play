const dungeonById = (id) => DUNGEONS.find((d) => d.id === id);
const DG_REVIVE = 0.3, DG_REST_HP = 0.25, DG_REST_MP = 0.3;   // between rooms
const BOSS_ENRAGE_AT = 0.5;                                    // bosses enrage below this share of HP
const DG_XP_MULT = 0.6;                                        // a full run is worth about a level and a bit

// Heroes live in their faction folder; summons in characters/summons/; monsters in characters/monsters/.
function spriteSVG(id) {
  const c = charById(id);
  const folder = c ? ART_FOLDER[c.faction] : MONSTERS[id] ? 'monsters' : 'summons';
  return `<img class="art" src="characters/${folder}/${id}.${ART_EXT}" alt="" data-id="${id}" draggable="false">`;
}
const lookOf = (id) => charById(id)?.look || SUMMONS[id]?.look || MONSTERS[id]?.look;

// Skill icons live in skills/<slug>.svg, named after the skill ("Siren's Hush" → sirens-hush.svg).
// skills/make_icons.py draws them; a missing icon is simply left out.
const skillSlug = (name) => name.toLowerCase().replace(/'/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const skillIcon = (s) => `<img class="sic" src="skills/${skillSlug(s.name)}.svg" alt="" draggable="false">`;

// Missing art file → swap in the built-in placeholder.
document.addEventListener('error', (ev) => {
  const img = ev.target;
  if (img.tagName !== 'IMG') return;
  if (img.classList.contains('art')) img.outerHTML = builtinSprite(img.dataset.id);
  else if (img.classList.contains('npcArt')) img.outerHTML = NPC_FALLBACK;
  else if (img.classList.contains('sic')) img.remove();
  else if (img.classList.contains('anim')) img.remove();   // no clip: the SVG underneath is already showing
}, true);

// An animation clip only takes over from the SVG once it has actually arrived.
document.addEventListener('load', (ev) => {
  const img = ev.target;
  if (img.tagName === 'IMG' && img.classList.contains('anim')) img.parentNode.classList.add('animated');
}, true);

// Village NPCs live in characters/npcs/. A missing file shows a plain hooded villager instead.
const npcArt = (id) => `<img class="npcArt" src="characters/npcs/${id}.${ART_EXT}" alt="" draggable="false">`;
const NPC_FALLBACK = '<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="94" rx="20" ry="3.6" fill="#000" opacity=".35"/><path d="M36 93 L39 52 Q50 44 61 52 L64 93 Z" fill="#5a4a52" stroke="#15121d" stroke-width="1.5"/><circle cx="50" cy="38" r="11" fill="#d9b48f" stroke="#15121d" stroke-width="1.5"/><path d="M38 40 Q38 24 50 24 Q62 24 62 40 Q56 32 50 32 Q44 32 38 40 Z" fill="#4a3a42" stroke="#15121d" stroke-width="1.5"/></svg>';

const spriteCache = {};
function builtinSprite(id) {
  if (spriteCache[id]) return spriteCache[id];
  const a = lookOf(id);
  const b = BODIES[a.body](a);
  const [x, y] = b.hand;
  let g = b.svg + (a.weapon ? WEAPONS[a.weapon](a, x, y) : '');
  if (a.shield) g += `<path d="M29 ${50 + b.shieldY} h17 v14 q0 10 -8.5 13 q-8.5 -3 -8.5 -13 z" fill="${a.shield}" stroke="${a.trim}" stroke-width="2"/>`;
  if (a.scale) g = `<g transform="translate(50 94) scale(${a.scale}) translate(-50 -94)">${g}</g>`;
  const rx = a.body === 'dwarf' || a.scale ? 18 : 23;
  return (spriteCache[id] = `<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="94" rx="${rx}" ry="3.6" fill="#000" opacity=".35"/>${g}</svg>`);
}

/* ==================================================================
   HELPERS & STATE
   ================================================================== */
const $ = (s) => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Battle playback speed. 1 = original pacing; 1.5 = one-and-a-half times faster (the default),
// 2 = double speed from the speed bar's toggle. Applied to every pause (wait) and the
// battlefield choreography (beat). The speed bar itself always runs at the original 1× pace
// (renderTrack, waitBar). The champions' attack clips are pre-rendered WebP files and always
// play at their own pace.
const SPEEDS = [1.5, 2];
const SPEED_KEY = 'burizza.speed';
let SPEED = (() => { try { const v = +localStorage.getItem(SPEED_KEY); return SPEEDS.includes(v) ? v : 1.5; } catch { return 1.5; } })();
const beat = (ms) => ms / SPEED;
const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 150) : ms / SPEED));
const waitBar = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 150) : ms));   // speed bar: always 1×
const chance = (p) => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const charById = (id) => ROSTER.find((c) => c.id === id);
const shortName = (c) => c.short || c.name;
const has = (u, id) => u.effects.find((e) => e.id === id);

let state = {
  screen: 'village', team: ['wren', 'aelira', 'maren'], filter: 'all',
  level: 1, battle: 0, order: [], enemyIds: [], teams: { p: [], e: [] },
  round: 0, queue: [], qi: 0, active: null, phase: 'idle', pending: null, log: [], reward: null, token: 0,
  // Village: the open building, Elder's Hut tab, tavern rumor, Ironsmith's chosen champion,
  // and runPending = a gauntlet paused between battles while you visit the village.
  place: null, codex: 'factions', tip: 0, forgeHero: null, runPending: false, itemUsed: false,
  // Proving Grounds: today's rival warbands, and the challenge being fought right now.
  duels: [], duel: null,
  // NPCs: what the open building's keeper is saying, and which townsfolk are out today.
  keeperSays: '', keeperLoot: '', folk: [], questNews: [],
};

const allUnits = () => [...state.teams.p, ...state.teams.e];
const unitBy = (uid) => allUnits().find((u) => u.uid === uid);
const alive = (u) => u.hp > 0;
const alliesOf = (u) => state.teams[u.side].filter(alive);
const foesOf = (u) => state.teams[u.side === 'p' ? 'e' : 'p'].filter(alive);
const highTide = () => state.round > 0 && state.round % 2 === 0;
const effAgi = (u) => u.agi * (has(u, 'slow') ? 0.6 : 1);
// Speed along the bar: Agility, plus Elowen's Forest Stride for her whole warband (dodge still uses effAgi).
const barAgi = (u) => effAgi(u) * (1 + Math.max(0, ...alliesOf(u).map((a) => pv(a).haste || 0)));
const wx = () => state.weather || 'clear';
const favored = (u) => WEATHER[wx()].favors === u.faction;
const disciplineBonus = () => (wx() === 'sun' ? 0.3 : 0.15);

const ULT_FIRST_TURN = 3;   // the ★ signature can't be used before the hero's 3rd turn

// The champion's passive (P options), or {} for summons and champions without one.
const pv = (u) => u.pv || {};
// Is a living ally (or enemy) of u carrying passive option key? Used by aura passives.
const allyHas = (u, key, notSelf = false) => alliesOf(u).some((a) => pv(a)[key] && !(notSelf && a === u));
const foeHas = (u, key) => foesOf(u).some((f) => pv(f)[key]);

/* ==================================================================
   SKILL LOADOUT — what each champion brings into battle.
   Slots grow with level: 2 active + 1 passive at first, then
   Lv 5 → 3rd active, Lv 10 → 2nd passive, Lv 15 → 4th active.
   Attack and Guard are always available and never use a slot.
   Pool: the champion's 3 actives (skill a, ★ signature b, second skill c),
   the neutral skills below (class-free actives anyone can learn),
   their own passive ('own'), their alternative own passive if they have one ('alt'), and the generic passives below.
   You pick your champion's loadout; recruits and enemies auto-pick.
   ================================================================== */
const SLOT_UNLOCKS = [{ lv: 5, kind: 'act' }, { lv: 10, kind: 'pas' }, { lv: 15, kind: 'act' }];
const activeSlots = (lv) => 2 + SLOT_UNLOCKS.filter((s) => s.kind === 'act' && lv >= s.lv).length;
const passiveSlots = (lv) => 1 + SLOT_UNLOCKS.filter((s) => s.kind === 'pas' && lv >= s.lv).length;
const ACTIVE_IDS = ['a', 'b', 'c'];
// Neutral skills: class-free actives any champion can equip in an active slot.
// Kept modest on purpose — utility that rounds out a kit, never outshines one.
const NEUTRAL_SKILLS = {
  soullink:    B('Soul Link', 'Link an ally for 3 turns: a third of the damage they take from hits is divided among their teammates.', 4, 'ally', [['link', 4]], { mp: 20, aiTarget: 'lowest' }),
  firstaid:    H('First Aid', 'A quick field dressing: a small heal for an ally.', 3, 1.2, { mp: 20 }),
  flashpowder: D('Flash Powder', '60% hit. Blinds the target for 2 turns.', 3, 0.6, { mp: 25, fx: [['blind', 3]] }),
  smokebomb:   B('Smoke Bomb', 'Vanish in smoke: attacks that can miss will miss you until your next turn.', 5, 'self', [['evade', 1]], { mp: 25 }),
  throwingaxe: D('Throwing Axe', 'A hurled axe for 110%.', 2, 1.1, { mp: 20 }),
  lowblow:     D('Low Blow', '80% hit with a 35% chance to Stagger.', 3, 0.8, { mp: 20, chanceFx: [['stagger', 1, 0.35]] }),
  scattershot: D('Scattershot', '50% to all enemies.', 4, 0.5, { mp: 25, aoe: true }),
  caltrops:    D('Caltrops', '35% to all enemies and Slows them.', 5, 0.35, { mp: 25, aoe: true, fx: [['slow', 2]] }),
  battlecry:   B('Battle Cry', 'Bellow a challenge: deal 30% more damage for 2 turns.', 4, 'self', [['empower', 3]], { mp: 20 }),
  wardingcharm: B('Warding Charm', 'An ally resists new debuffs for 2 turns.', 4, 'ally', [['immune', 3]], { mp: 20, aiTarget: 'debuffed' }),
  demoralize:  D('Demoralize', '60% hit. Weakens the target for 2 turns.', 3, 0.6, { mp: 25, fx: [['weaken', 3]] }),
  armorcrack:  D('Armor Crack', '70% hit. Sunders armor: −40% defense for 2 turns.', 4, 0.7, { mp: 25, fx: [['sunder', 3]] }),
};
const NEUTRAL_KEYS = Object.keys(NEUTRAL_SKILLS);
// Generic passives anyone can equip. `stat` bonuses are applied in makeUnit.
const GENERIC_PASSIVES = {
  toughness:  P('Toughness', '+12% max HP.', { stat: { hpPct: 0.12 } }),
  might:      P('Might', '+10% Attack.', { stat: { atkPct: 0.1 } }),
  swiftness:  P('Swiftness', '+2 Agility: more turns and a little more dodge.', { stat: { agi: 2 } }),
  keenedge:   P('Keen Edge', '+8% critical hit chance.', { stat: { crit: 0.08 } }),
  deepwell:   P('Deep Well', '+25 max MP and +3 MP every turn. No effect on Ironclad champions, who have no mana.', { stat: { mp: 25, mpRegen: 3 } }),
  secondwind: P('Second Wind', 'Recover an extra 2% of max HP every turn.', { stat: { hpRegenPct: 0.02 } }),
  hallucinate: P('Hallucinate', 'Enemies that single them out have a 25% chance to lash out at a different target instead — even one of their own.', { hallucinate: 0.25 }),
  finisher:    P('Finisher', 'Deals 15% more damage to enemies below half HP.', { execute: { below: 0.5, bonus: 0.15 } }),
  spikedcloak: P('Spiked Cloak', 'When hit, 20% chance the attacker starts Bleeding.', { onHitTaken: { chance: 0.2, fx: [['bleed', 3, 0.2]] } }),
};
const GENERIC_KEYS = Object.keys(GENERIC_PASSIVES);
const passiveById = (c, id) => (id === 'own' ? c.passive : id === 'alt' ? c.passiveAlt : GENERIC_PASSIVES[id]);
const passivePool = (c) => ['own', ...(c.passiveAlt ? ['alt'] : []), ...GENERIC_KEYS];
const activeById = (c, id) => NEUTRAL_SKILLS[id] || c.skills[{ a: 0, b: 1, c: 2 }[id]];

// Recruits and enemies: skill, ★ signature, then second skill as slots allow; their own passive,
// plus a role-fitting generic once a second passive slot opens.
function autoLoadout(c, lv) {
  const pas = ['own'];
  if (passiveSlots(lv) > 1) pas.push(c.role === 'melee' ? 'toughness' : c.role === 'ranged' ? 'keenedge' : MANA.pool[c.faction] ? 'deepwell' : 'secondwind');
  return { act: ACTIVE_IDS.slice(0, activeSlots(lv)), pas };
}

// Your champion's saved loadout, trimmed to the slots your level allows. Before you choose, it's the auto pick.
function heroLoadout(c, lv) {
  const saved = profile.loadout;
  if (!saved) return autoLoadout(c, lv);
  return {
    act: saved.act.filter((id) => ACTIVE_IDS.includes(id) || NEUTRAL_SKILLS[id]).slice(0, activeSlots(lv)),
    pas: saved.pas.filter((id) => passiveById(c, id)).slice(0, passiveSlots(lv)),
  };
}

// After a level-up that opens a slot, fill it with the next skill you don't have equipped yet.
function fillNewSlots(lv) {
  if (!profile.hero || !profile.loadout) return;
  const c = charById(profile.hero.id), lo = profile.loadout, auto = autoLoadout(c, lv);
  for (const id of [...auto.act, ...ACTIVE_IDS, ...NEUTRAL_KEYS]) if (lo.act.length < activeSlots(lv) && !lo.act.includes(id)) lo.act.push(id);
  for (const id of [...auto.pas, ...GENERIC_KEYS]) if (lo.pas.length < passiveSlots(lv) && !lo.pas.includes(id)) lo.pas.push(id);
}

/* SKILL RANKS — every level-up grants a skill point to spend on one of your champion's
   active skills (their own or a neutral one), on the Skills screen. Points are derived
   from level so none are ever lost: earned = level − 1, unspent = earned − spent, and
   each champion you play has their own allocation. A rank makes that skill 8% stronger
   (damage, healing, or summoned-unit stats); pure buff skills instead last 1 extra turn
   per 2 ranks. Capped at RANK_CAP per skill. Enemies never benefit from ranks. */
const RANK_CAP = 10, RANK_POWER = 0.08;
const ranksOf = (cid) => profile.skillRanks?.[cid] || {};
const skillRank = (cid, sid) => ranksOf(cid)[sid] || 0;
const ranksSpent = (cid) => Object.values(ranksOf(cid)).reduce((a, b) => a + b, 0);
const skillPoints = (cid) => Math.max(0, heroLevel() - 1 - ranksSpent(cid));
const rankBonusText = (s, r) => (s.kind === 'buff' && !s.o?.heal
  ? `effects last ${Math.floor(r / 2)} turn${Math.floor(r / 2) === 1 ? '' : 's'} longer`
  : `+${Math.round(RANK_POWER * r * 100)}% power`);
function rankUp(sid) {
  const cid = profile.hero?.id;
  if (!cid || !skillPoints(cid) || skillRank(cid, sid) >= RANK_CAP) return;
  if (!profile.skillRanks) profile.skillRanks = {};
  const r = profile.skillRanks[cid] = profile.skillRanks[cid] || {};
  r[sid] = (r[sid] || 0) + 1;
  saveProfile();
}

// scale < 1 softens a unit (used for early gauntlet enemies).
function makeUnit(c, lv, side, slot, scale = 1) {
  // Loadout: your own champion uses what you picked; everyone else auto-picks.
  const lo = side === 'p' && slot === 0 && profile.hero?.id === c.id ? heroLoadout(c, lv) : autoLoadout(c, lv);
  const equipped = lo.pas.map((id) => passiveById(c, id)).filter(Boolean);
  const ps = Object.assign({}, ...equipped);                  // passive options the engine reads through pv(u)
  const st = equipped.reduce((sum, p) => addUp(sum, p.stat || {}), {});   // generic passives' stat bonuses
  const r = ROLES[c.role], m = c.mods || {}, g = 1 + 0.12 * (lv - 1);
  // Forged gear only helps your own warband, never an enemy's Rival copy of the same champion.
  const gear = side === 'p' ? gearOf(c.id) : {}, pool = MANA.pool[c.faction] ?? 1;
  const wg = (1 + FORGE.w.per * (gear.w || 0)) * (1 + (gear.atkPct || 0));
  const ag = 1 + FORGE.a.per * (gear.a || 0);
  const maxHp = Math.round(r.hp * (m.hp || 1) * g * scale * ag * (1 + (gear.hpPct || 0)) * (1 + (st.hpPct || 0)));
  const maxMp = pool ? Math.round(r.mp * pool * (1 + 0.08 * (lv - 1))) + (gear.mp || 0) + (st.mp || 0) : 0;
  return {
    uid: `${side}${slot}`, id: c.id, side, name: shortName(c), level: lv,
    faction: c.faction, race: c.race || null, role: c.role,
    maxHp, hp: maxHp,
    maxMp, mp: maxMp, mpRegen: (gear.mpRegen || 0) + (pool ? st.mpRegen || 0 : 0), manaSteal: gear.manaSteal || 0,
    hpRegen: (gear.hpRegen || 0) + Math.round(maxHp * (st.hpRegenPct || 0)),
    atk: Math.round(r.atk * (m.atk || 1) * g * scale * wg * (1 + (st.atkPct || 0))), def: Math.round(r.def * (m.def || 1) * g * ag),
    agi: Math.round(r.agi * (m.agi || 1)) + (lv - 1) + (gear.agi || 0) + (st.agi || 0),
    crit: (m.crit ?? 0.08) + (st.crit || 0), dodge: r.dodge + (ps.dodge || 0),
    pv: ps, loadout: lo.act, passives: lo.pas,
    // The ★ signature (ultimate) starts on cooldown so it first unlocks on the hero's 3rd turn
    // (cooldowns tick down at the start of each of the hero's turns: 3 → 2 → 1 → 0 on turn 3).
    effects: (ps.startFx || []).map(([id, turns]) => ({ id, turns, value: 0 })),
    cooldowns: { b: ULT_FIRST_TURN }, heat: 0, stacks: ps.startStacks || 0, hitSince: false, lastAction: null, combo: false,
  };
}

// A monster unit (always on the enemy side). Same stat formula as champions, no mana, fixed skills.
function makeMonster(id, lv, slot, scale = 1) {
  const m = MONSTERS[id], r = ROLES[m.role], g = 1 + 0.12 * (lv - 1), ps = m.passive || {}, st = ps.stat || {};
  const maxHp = Math.round(r.hp * (m.mods.hp || 1) * g * scale);
  return {
    uid: `e${slot}`, id, art: id, side: 'e', monster: true, elite: !!m.elite, boss: !!m.boss, name: m.name, level: lv,
    faction: 'wild', race: null, role: m.role,
    maxHp, hp: maxHp, maxMp: 0, mp: 0, mpRegen: 0, manaSteal: 0, hpRegen: Math.round(maxHp * (st.hpRegenPct || 0)),
    atk: Math.round(r.atk * (m.mods.atk || 1) * g * scale), def: Math.round(r.def * (m.mods.def || 1) * g),
    agi: Math.round(r.agi * (m.mods.agi || 1)) + (lv - 1), crit: 0.05, dodge: r.dodge,
    pv: ps, passives: [],
    effects: (ps.startFx || []).map(([fx, turns]) => ({ id: fx, turns, value: 0 })),
    cooldowns: {}, heat: 0, stacks: 0, hitSince: false, lastAction: null, combo: false,
  };
}

function skillsOf(u) {
  if (u.summon) return SUMMONS[u.id].skills.map((s, i) => ({ ...s, id: i === 0 ? 'attack' : `s${i}` }));
  if (u.monster) return MONSTERS[u.id].skills.map((s, i) => ({ ...s, id: i === 0 ? 'attack' : `s${i}` }));
  const c = charById(u.id);
  const guard = u.faction === 'mech' ? { ...GUARD, desc: 'Take 50% less damage until your next turn. Vents 50 Heat.' }
    : { ...GUARD, desc: `${GUARD.desc} Restores ${MANA.guardGain} MP.` };
  const attack = u.maxMp ? { ...ATTACK, desc: `${ATTACK.desc} Restores ${MANA.attackGain} MP.` } : ATTACK;
  // Mana cost: the skill's own o.mp, else the default; champions with no mana (mechs) cast for free.
  const cost = (s, d) => (u.maxMp ? (s.o?.mp ?? d) : 0);
  const actives = [
    { ...c.skills[0], id: 'a', mp: cost(c.skills[0], MANA.skillCost), o: { heat: 25, ...c.skills[0].o } },
    { ...c.skills[2], id: 'c', mp: cost(c.skills[2], MANA.skill2Cost), o: { heat: 30, ...c.skills[2].o } },
    { ...c.skills[1], id: 'b', sig: true, mp: cost(c.skills[1], MANA.ultCost), o: { heat: 40, ...c.skills[1].o } },
  ];
  // Only the skills in this champion's loadout come into battle; Attack and Guard always do.
  const eq = u.loadout || ACTIVE_IDS;
  // Equipped neutral skills come in after the champion's own, at the cheap-skill mana tier.
  const neutrals = eq.filter((id) => NEUTRAL_SKILLS[id])
    .map((id) => ({ ...NEUTRAL_SKILLS[id], id, mp: cost(NEUTRAL_SKILLS[id], MANA.skillCost), o: { heat: 25, ...NEUTRAL_SKILLS[id].o } }));
  // Skill ranks: trained skills fight stronger for your side only (see SKILL RANKS).
  const boost = (s) => {
    const r = u.side === 'p' ? skillRank(u.id, s.id) : 0;
    if (!r) return s;
    const out = { ...s, rank: r };
    if (s.mult) out.mult = s.mult * (1 + RANK_POWER * r);
    if (s.kind === 'buff' && s.fx) out.fx = s.fx.map(([id, t, ...rest]) => [id, t + Math.floor(r / 2), ...rest]);
    if (s.o?.heal) out.o = { ...s.o, heal: s.o.heal * (1 + RANK_POWER * r) };
    return out;
  };
  return [attack, ...actives.filter((s) => eq.includes(s.id)).map(boost), ...neutrals.map(boost), guard];
}

function validTargets(u, sk) {
  if (sk.target === 'enemy') {
    const foes = foesOf(u);
    const taunters = foes.filter((f) => has(f, 'taunt'));
    return taunters.length ? taunters : foes;
  }
  if (sk.target === 'ally') return alliesOf(u);
  return [];
}

const silenced = (u, sk) => !!has(u, 'silence') && (['a', 'b', 'c'].includes(sk.id) || !!NEUTRAL_SKILLS[sk.id]);

function usable(u, sk) {
  if (silenced(u, sk)) return false;
  if (u.cooldowns[sk.id] > 0) return false;
  if ((sk.mp || 0) > (u.mp || 0)) return false;
  if ((sk.target === 'enemy' || sk.target === 'ally') && !validTargets(u, sk).length) return false;
  return true;
}

/* ==================================================================
   COMBAT MATH
   ================================================================== */
function powerMult(u) {
  let m = 1;
  if (u.faction === 'orc') m *= 1 + 0.5 * (1 - u.hp / u.maxHp);
  if (u.faction === 'mech') m *= 1 + u.heat / 250;
  if (u.faction === 'human' && u.combo) m *= 1 + disciplineBonus();
  if (u.faction === 'tide' && highTide()) m *= 1.25;
  if (favored(u)) m *= wx() === 'sun' ? 1.15 : 1.2;
  if (has(u, 'weaken')) m *= 0.7;
  if (has(u, 'empower')) m *= 1.3;
  if (has(u, 'enraged')) m *= 1.35;   // dungeon bosses below half HP
  if (has(u, 'poison') && foeHas(u, 'weakenPoisoned')) m *= 0.85;   // Faelan: Debilitating Venom
  return m;
}

/* Ironclad overheat bar: it fills in quarters (25 / 50 / 75 / 100 Heat). Every quarter
   the hull runs hotter, so an enemy that trades blows with a Mech is seared for more.
   At 100 Heat the Mech overheats and skips its next turn (handled on the speed bar). */
const HEAT_TIERS = [25, 50, 75, 100];
const heatTier = (u) => (u.faction === 'mech' ? HEAT_TIERS.filter((h) => u.heat >= h).length : 0);
const contactBurn = (u) => heatTier(u) * 10;   // 10 / 20 / 30 / 40 seared per contact

// A hot Mech sears any enemy it trades blows with — whoever it strikes, and whoever strikes it.
// Summons (including Salvage Bots) never build Heat, so this is a no-op for them.
function searContact(mech, foe) {
  if (mech.hp <= 0 || foe.hp <= 0) return;
  const burn = contactBurn(mech);
  if (burn <= 0) return;
  foe.hp = Math.max(0, foe.hp - burn);
  bump(foe, 'hurt');
  float(foe, `${burn}`, 'dot');
  log(`${foe.name} is seared by ${mech.name}'s heat for ${burn}.`, mech.side);
  if (foe.hp <= 0) log(`${foe.name} is down.`, 'sys');
}

// One hit: dodge → damage = ATK × mult × (±10%) × 50/(50+DEF) → crit, status and faction modifiers.
function strikeOnce(u, t, mult, label, o) {
  if (t.hp <= 0) return { miss: true };
  const dodge = o.noDodge ? 0 : has(t, 'evade') ? 1 : clamp(0.04 + t.dodge + (effAgi(t) - effAgi(u)) * 0.01 + (wx() === 'mist' ? 0.1 : 0), 0.02, 0.4);
  const miss = dodge + (has(u, 'blind') ? 0.35 : 0);
  if (miss > 0 && chance(miss)) {
    float(t, 'Miss', 'miss');
    dodgeHop(t);
    log(`${t.name} avoids ${u.name}'s ${label}.`, u.side);
    return { miss: true };
  }
  const def = o.pierce ? 0 : t.def * (has(t, 'sunder') ? 0.6 : 1);
  // Mana-scaling skills add a share of the caster's mana (before paying for the cast) to the hit.
  const manaPart = o.manaDamage ? (u.castMp ?? u.mp ?? 0) * o.manaDamage : 0;
  let dmg = (u.atk * mult + manaPart) * powerMult(u) * (0.9 + Math.random() * 0.2) * 50 / (50 + def);
  const P = pv(u), TP = pv(t);
  const critChance = u.crit + (o.critBonus || 0) + (u.race === 'elf' ? u.stacks * 0.1 : 0)
    + (P.critVs && has(t, P.critVs.fx) ? P.critVs.bonus : 0);
  const crit = o.alwaysCrit || chance(critChance);
  if (crit) dmg *= P.critMult || 1.5;
  if (o.bonusVs && has(t, o.bonusVs)) dmg *= 1.6;
  // Attacker passives
  if (P.vs && has(t, P.vs.fx) && (!P.vs.element || P.vs.element === o.element)) dmg *= 1 + P.vs.bonus;
  if (P.aoeBonus && o.aoe) dmg *= 1 + P.aoeBonus;
  if (P.execute && t.hp / t.maxHp < P.execute.below) dmg *= 1 + P.execute.bonus;
  if (P.grudge && u.lastHitBy === t.uid) dmg *= 1 + P.grudge;
  // Defender side: Exposed, passives and auras
  if (has(t, 'exposed')) dmg *= 1.25;
  if (TP.firstHitDR && !t.plated) { dmg *= 1 - TP.firstHitDR; t.plated = true; }
  if (allyHas(t, 'allyDR', true)) dmg *= 0.9;
  if (has(t, 'hex') && allyHas(u, 'hexVuln')) dmg *= 1.15;
  if (o.element === 'lightning' && soaked(t)) dmg *= 1.3;
  if (o.element === 'lightning' && wx() === 'storm') dmg *= 1.3;
  // Spirit Ward (−60%) and shields (−50%) don't stack; the stronger one applies.
  if (!o.ignoreShield) dmg *= has(t, 'ward') ? 0.4 : has(t, 'shield') ? 0.5 : 1;
  if (has(t, 'guard')) dmg *= 0.5;
  if (t.race === 'dwarf') dmg *= 1 - 0.08 * t.stacks;
  dmg = Math.max(1, Math.round(dmg));
  // Soul Link: a third of the blow is divided among the holder's living teammates.
  let taken = dmg;
  if (has(t, 'link')) {
    const mates = alliesOf(t).filter((a) => a.uid !== t.uid);
    if (mates.length) {
      const each = Math.max(1, Math.round((dmg * 0.33) / mates.length));
      taken = Math.max(1, dmg - each * mates.length);
      for (const m of mates) {
        m.hp = Math.max(0, m.hp - each);
        float(m, `${each}`, 'dot');
        if (m.hp <= 0) log(`${m.name} is down.`, 'sys');
      }
      log(`${t.name}'s Soul Link spreads ${each * mates.length} damage across the team.`, t.side);
    }
  }
  t.hp = Math.max(0, t.hp - taken);
  if (t.hp <= 0 && TP.lastStand && !t.lastStandUsed) {
    t.hp = 1; t.lastStandUsed = true;
    float(t, 'Unbreakable', 'fx');
    log(`${t.name} refuses to fall!`, t.side);
  }
  t.lastHitBy = u.uid;
  // Garrick: Retribution sends a share of every hit he takes to all of his enemies.
  if (TP.retribution) {
    const back = Math.max(1, Math.round(dmg * TP.retribution));
    log(`${t.name}'s Retribution strikes every enemy for ${back}.`, t.side);
    for (const f of foesOf(t)) {
      f.hp = Math.max(0, f.hp - back);
      float(f, `${back}`, 'dot');
      if (f.hp <= 0) log(`${f.name} is down.`, 'sys');
    }
  }

  if (t.race === 'elf') { t.stacks = 0; t.hitSince = true; }
  if (t.race === 'dwarf') t.stacks = Math.min(3, t.stacks + 1);

  knock(t, crit);
  if (crit && u.side === 'p' && !o.counter) questEvent('crit');   // bounties count your crits (not riposte counters)
  const mIcon = o.element ? `${ELEM_ICON[o.element] || '✨'} ` : '';   // magic / elemental hits show their element
  float(t, crit ? `${mIcon}${taken}!` : `${mIcon}${taken}`, crit ? 'crit' : 'dmg');   // a linked target pops only its own share
  log(`${u.name}'s ${label} hits ${t.name} for ${dmg}${crit ? ' (critical)' : ''}.`, u.side);

  if (u.faction === 'tide' && t.hp > 0) addFx(t, 'soaked', 2, 0, true);
  if (crit && P.critFx && t.hp > 0) for (const [id, turns, val] of P.critFx) addFx(t, id, turns, val ? Math.round(u.atk * val) : 0);
  // Hesk: Ancestral Watch wards an ally the first time they drop below the threshold.
  if (t.hp > 0 && !t.watched && !t.summon && t.hp / t.maxHp < 0.3 && allyHas(t, 'guardian')) {
    t.watched = true;
    log(`The ancestors watch over ${t.name}.`, t.side);
    addFx(t, 'ward', 2);
  }
  // Defender passives that answer a hit (Ink Sac, Brimstone Hide, Riposte). Counters never chain.
  const oh = TP.onHitTaken;
  if (oh && !o.counter && t.hp > 0 && u.hp > 0 && (!oh.melee || u.role === 'melee') && chance(oh.chance)) {
    for (const [id, turns, val] of oh.fx) addFx(u, id, turns, val ? Math.round(t.atk * val) : 0);
  }
  // Ripostes and counterattacks are queued and played out once the attacker's blows have landed
  // (resolveCounters), so the defender visibly swings back. One per defender per action.
  const queued = (state.counters ||= []).some((c) => c.by === t);
  if (TP.riposte && !queued && !o.counter && t.hp > 0 && u.hp > 0 && u.role === 'melee' && chance(TP.riposte.chance)) {
    state.counters.push({ by: t, at: u, mult: TP.riposte.mult, label: 'Riposte', o: { noDodge: true, counter: true } });
  }
  // Counterattack: any melee unit struck by another melee unit has a 10% chance to strike back.
  // The counter is a normal hit the original attacker can still dodge (per their stats) and never
  // chains (counter: true). Champions with a Riposte passive use that instead of this.
  else if (!TP.riposte && !queued && !o.counter && t.hp > 0 && u.hp > 0 && t.role === 'melee' && u.role === 'melee' && chance(0.10)) {
    state.counters.push({ by: t, at: u, mult: 1, label: 'Counterattack', o: { counter: true } });
  }
  const th = has(t, 'thorns');
  if (th && u.hp > 0) {
    const back = Math.max(1, Math.round(dmg * 0.4));
    u.hp = Math.max(0, u.hp - back);
    float(u, `${back}`, 'dot');
    log(`${t.name}'s thorns reflect ${back} damage.`, t.side);
    if (u.hp <= 0) log(`${u.name} is down.`, 'sys');
  }
  if (t.hp <= 0) log(`${t.name} is down.`, 'sys');
  // Ironclad heat sears on contact — a living Mech burns whoever it trades blows with.
  if (u.faction === 'mech') searContact(u, t);   // its blow sears the enemy it struck
  if (t.faction === 'mech') searContact(t, u);   // and striking a hot Mech burns the attacker
  return { dmg, crit };
}

// Restores mana (capped at max). Returns how much was actually gained.
function gainMp(u, amount, quiet = false) {
  if (!u.maxMp || u.hp <= 0) return 0;
  const got = Math.max(0, Math.min(amount, u.maxMp - u.mp));
  u.mp += got;
  if (got && !quiet) float(u, `+${got} MP`, 'mpf');
  return got;
}

function applyHitEffects(u, t, o) {
  if (t.hp <= 0) return;
  // Mana Burn: destroy some of the target's mana and deal that much as extra damage.
  if (o.manaBurn && t.mp > 0) {
    const burned = Math.min(t.mp, o.manaBurn);
    t.mp -= burned;
    t.hp = Math.max(0, t.hp - burned);
    float(t, `-${burned} MP`, 'mpf');
    log(`${u.name} burns ${burned} of ${t.name}'s mana, dealing ${burned} extra damage.`, u.side);
    if (t.hp <= 0) { log(`${t.name} is down.`, 'sys'); return; }
  }
  // Seraphine: Echo makes her debuffs last longer; Aldous: Kindling makes his Burns hotter.
  const P = pv(u);
  for (const [id, turns, val] of o.fx || []) {
    const boost = P.dotBoost?.[id] || 1;
    addFx(t, id, turns + (P.fxLonger && FX[id].kind === 'bad' ? P.fxLonger : 0), val ? Math.round(u.atk * val * boost) : 0);
  }
  // Entangle: mark the Slow it landed as rooted, so thorny roots grow at the target's feet (syncStatusFx).
  if (o.roots && has(t, 'slow')) has(t, 'slow').roots = true;
  for (const [id, turns, p] of o.chanceFx || []) if (chance(p)) addFx(t, id, turns);
  if (o.knockback && t.hp > 0) {
    t.pos = Math.max(0, (t.pos || 0) - o.knockback);
    float(t, 'Dragged back', 'fx');
    log(`${t.name} is dragged back along the speed bar.`, u.side);
    renderTrack(300);
  }
  if (o.stun) {
    if (chance(o.stun)) addFx(t, 'stun', 1);
    else log(`${t.name} resists the stun.`, 'sys');
  }
}

// Ripostes and counterattacks queued by strikeOnce: the defender calls it, swings back with their own
// attack animation while the attacker is still in reach, and the blow lands.
async function resolveCounters() {
  const list = state.counters || [];
  state.counters = [];
  for (const c of list) {
    if (c.by.hp <= 0 || c.at.hp <= 0) continue;
    const riposte = c.label === 'Riposte';
    float(c.by, riposte ? 'Riposte!' : 'Counter!', 'fx');
    log(`${c.by.name} ${riposte ? 'ripostes' : 'counterattacks'}!`, c.by.side);
    await strikePose(c.by);
    strikeOnce(c.by, c.at, c.mult, c.label, c.o);
    render();
    await wait(260);
  }
}

async function damageSkill(u, t, sk) {
  const o = sk.o || {};
  state.counters = [];
  // Hallucinate: whoever singles out this target may swing at someone else entirely —
  // any other combatant, including the attacker's own allies. Area attacks are immune.
  if (sk.target === 'enemy' && t && pv(t).hallucinate && chance(pv(t).hallucinate)) {
    const others = [...foesOf(u), ...alliesOf(u)].filter((x) => x.uid !== t.uid && x.uid !== u.uid);
    if (others.length) {
      const nt = pick(others);
      float(u, '🌀 Hallucinating', 'fx');
      log(`${u.name} hallucinates — the blow meant for ${t.name} lands on ${nt.name}!`, 'sys');
      t = nt;
    }
  }
  const targets = sk.target === 'allEnemies' ? foesOf(u) : [t];
  if (o.selfCost) {
    const c = Math.round(u.maxHp * o.selfCost);
    u.hp = Math.max(1, u.hp - c);
    float(u, `${c}`, 'dot');
  }
  // Melee champions (and melee summons) run in; everyone else shoots from where they stand.
  const melee = u.role === 'melee';
  const proj = melee ? null : projectileFor(u, sk);
  const trip = melee ? await dashTo(u, targets) : null;
  if (!melee) await aimPose(u);
  // Area attacks from range: every projectile flies at once, then the hits resolve.
  if (!melee && targets.length > 1) await Promise.all(targets.map((tg) => shoot(u, tg, proj)));
  let total = 0;
  // Seraxa: Flurry adds a hit to multi-hit skills.
  const hits = (o.hits || 1) + (o.hits > 1 ? pv(u).extraHit || 0 : 0);
  const hitOnce = async (tg, mult) => {
    const r = strikeOnce(u, tg, mult, sk.name, o);
    if (!r.miss) {
      total += r.dmg;
      applyHitEffects(u, tg, o);
      if (tg.hp <= 0 && pv(u).killHeal && u.hp > 0) healUnit(u, u, Math.round(u.maxHp * pv(u).killHeal), 'Bloodlust');
    }
    render();
    await wait(hits > 1 ? 130 : 160);
  };
  for (const tg of targets) {
    for (let i = 0; i < hits; i++) {
      if (tg.hp <= 0 || u.hp <= 0) break;
      if (melee) await strikePose(u);
      else if (targets.length === 1) await shoot(u, tg, proj);
      await hitOnce(tg, sk.mult);
    }
  }
  // Ricochet: one more, weaker hit on a different enemy.
  if (o.bounce && u.hp > 0) {
    const next = foesOf(u).filter((f) => !targets.includes(f));
    if (next.length) {
      const tg = pick(next);
      if (melee) await strikePose(u); else await shoot(u, tg, proj);
      await hitOnce(tg, sk.mult * o.bounce);
    }
  }
  for (const [id, turns] of o.selfFx || []) if (u.hp > 0) addFx(u, id, turns);
  if (o.selfStacks) gainStacks(u, o.selfStacks);
  if (o.allyHeal && u.hp > 0) for (const a of alliesOf(u)) { burst(a, 'heal'); healUnit(u, a, healPower(u, o.allyHeal), sk.name); }
  if (o.allySteal && total && u.hp > 0) {
    const a = [...alliesOf(u)].sort((x, y) => x.hp / x.maxHp - y.hp / y.maxHp)[0];
    if (a) { burst(a, 'heal'); healUnit(u, a, Math.round(total * o.allySteal), sk.name); }
  }
  // Lifesteal: skill bonus + Crimson Court's Bloodthirst (20%), doubled under a Blood Moon.
  let steal = (o.lifesteal || 0) + (u.faction === 'crimson' ? 0.2 : 0);
  if (wx() === 'moon') steal *= 2;
  if (steal && total && u.hp > 0) healUnit(u, u, Math.round(total * steal), u.faction === 'crimson' && !o.lifesteal ? 'Bloodthirst' : sk.name);
  if (u.manaSteal && total) gainMp(u, Math.round(total * u.manaSteal));   // mana lifesteal (from items)
  render();
  await wait(160);
  await resolveCounters();   // defenders strike back before the attacker runs home
  if (trip) await dashBack(u, trip);
  await wait(120);
}

function healPower(u, mult, o = {}) {
  let m = u.atk * mult * (0.95 + Math.random() * 0.1);
  if (u.faction === 'tide' && highTide()) m *= 1.25 * (o.tideBonus || 1);
  if (u.faction === 'human' && u.combo) m *= 1 + disciplineBonus();
  if (wx() === 'sun') m *= 1.2;
  if (wx() === 'rain' && u.faction === 'tide') m *= 1.2;
  return Math.round(m);
}

function healUnit(src, t, amount, label) {
  if (t.hp <= 0) return;
  const P = src === t ? {} : pv(src);
  if (P.lowHeal && t.hp / t.maxHp < P.lowHeal.below) amount = Math.round(amount * (1 + P.lowHeal.bonus));   // Liesl: Mercy
  if (P.healMp) gainMp(t, P.healMp);   // Maren: Tidecaller
  if (has(t, 'hex')) amount = Math.round(amount * 0.5);
  const got = Math.min(amount, t.maxHp - t.hp);
  t.hp += got;
  float(t, `+${got}`, 'heal');
  log(src === t ? `${t.name} recovers ${got} HP from ${label}.` : `${src.name}'s ${label} heals ${t.name} for ${got}.`, src.side);
}

function cleanse(u) {
  const before = u.effects.length;
  u.effects = u.effects.filter((e) => FX[e.id].kind !== 'bad' || e.id === 'overheat');
  if (u.effects.length < before) float(u, 'Cleansed', 'fx');
}

async function healSkill(u, t, sk) {
  const o = sk.o || {};
  const targets = sk.target === 'allAllies' ? alliesOf(u) : [t];
  await castPose(u, true);
  for (const a of targets) {
    burst(a, 'heal');
    healUnit(u, a, healPower(u, sk.mult, o), sk.name);
    if (o.cleanse) cleanse(a);
    if (o.manaRestore) gainMp(a, o.manaRestore);
    for (const [id, turns, val] of o.fx || []) {
      if (id === 'shield') burst(a, 'shield');
      addFx(a, id, turns, val ? Math.round(u.atk * val) : 0);
    }
  }
  for (const f of o.enemyFx ? foesOf(u) : []) {
    burst(f, 'curse');
    for (const [id, turns] of o.enemyFx) addFx(f, id, turns);
  }
  render();
  await wait(450);
}

async function buffSkill(u, t, sk) {
  const o = sk.o || {};
  const targets = sk.target === 'allAllies' ? alliesOf(u) : sk.target === 'self' ? [u] : [t];
  await castPose(u, true);
  const ids = sk.fx.map(([id]) => id);
  const look = ids.includes('taunt') ? 'roar' : ids.some((id) => id === 'shield' || id === 'ward') ? 'shield' : 'buff';
  for (const a of targets) {
    burst(a, look);
    if (o.cleanse) cleanse(a);
    for (const [id, turns, val] of sk.fx) addFx(a, id, turns, val ? Math.round(u.atk * val) : 0);
    if (o.reduceCd) for (const k in a.cooldowns) a.cooldowns[k] = Math.max(0, a.cooldowns[k] - 1);
    if (o.heal) healUnit(u, a, healPower(u, o.heal), sk.name);
  }
  if (o.selfStacks) gainStacks(u, o.selfStacks);
  render();
  await wait(450);
}

// Dwarves' Fortify (and elves' Precision) stacks, capped at 3.
function gainStacks(u, n) {
  if (u.hp <= 0) return;
  u.stacks = Math.min(3, u.stacks + n);
  float(u, u.race === 'elf' ? 'Precision' : 'Fortify', 'fx');
}

// Timed effects live on the speed bar's clock instead of counting the unit's turns:
//   stun / overheat: the icon freezes for FREEZE_TIME.
//   stagger: for STAGGER_TIME the icon moves in fits, stopping STAGGER_STOP out of every STAGGER_CYCLE.
const TIMED_FX = { stun: 100, overheat: 100, stagger: 150 };

function addFx(u, id, turns, value = 0, quiet = false) {
  // Bone Charm (immune) and Thick Skull (passive immune list) stop new debuffs.
  if (FX[id].kind === 'bad' && id !== 'overheat' && (has(u, 'immune') || pv(u).immune?.includes(id))) {
    if (!quiet) { float(u, 'Resisted', 'fx'); log(`${u.name} resists ${FX[id].label}.`, u.side); }
    return;
  }
  const ex = has(u, id);
  const until = TIMED_FX[id] ? state.time + TIMED_FX[id] : null;
  if (ex) {
    ex.turns = Math.max(ex.turns, turns); ex.value = Math.max(ex.value, value);
    if (until != null) ex.until = Math.max(ex.until, until);
    if (id === 'stagger') ex.start = state.time;   // a fresh hit restarts the stumble
  } else if (until != null) u.effects.push({ id, turns, value, until, start: state.time });
  else u.effects.push({ id, turns, value });
  if (id === 'soaked') douse(u, 'The soaking');
  if (quiet) return;
  float(u, `${FX[id].icon} ${FX[id].label}`, 'fx');
  log(`${u.name} ${FX[id].verb}.`, FX[id].kind === 'good' ? u.side : 'sys');
}

// Start of a unit's turn: damage/heal over time, faction upkeep, durations and cooldowns tick down.
// (Stun is handled on the speed bar: a stunned unit never reaches the end while frozen.)
async function beginTurn(u) {
  let ticked = false;
  for (const id of ['burn', 'poison', 'bleed']) {
    const e = has(u, id);
    if (!e) continue;
    // Weather and Burn: Ash Storm fans the flames (+50%), Downpour douses them (−50%).
    const burnMult = id !== 'burn' ? 1 : wx() === 'ash' ? 1.5 : wx() === 'rain' ? 0.5 : 1;
    const dmg = Math.max(1, Math.round(e.value * burnMult));
    u.hp = Math.max(0, u.hp - dmg);
    bump(u, 'hurt');
    float(u, `${dmg}`, 'dot');
    log(`${u.name} takes ${dmg} from ${FX[id].label}.`, 'sys');
    ticked = true;
    if (u.hp <= 0) { log(`${u.name} is down.`, 'sys'); render(); await wait(450); return 'dead'; }
  }
  const rg = has(u, 'regen');
  if (rg && u.hp < u.maxHp) {
    const got = Math.min(has(u, 'hex') ? Math.round(rg.value * 0.5) : rg.value, u.maxHp - u.hp);
    u.hp += got;
    float(u, `+${got}`, 'heal');
    log(`${u.name} regenerates ${got} HP.`, u.side);
    ticked = true;
  }
  // Natural HP regen: champions (not summons) recover a small share of max HP each turn. Hex halves it.
  // Elowen's Verdant Aura adds to it for her whole warband.
  if (!u.summon && u.hp < u.maxHp) {
    let amt = Math.round(u.maxHp * (HP_REGEN_PCT + (allyHas(u, 'allyRegen') ? 0.02 : 0))) + (u.hpRegen || 0);
    if (has(u, 'hex')) amt = Math.round(amt * 0.5);
    const got = Math.min(amt, u.maxHp - u.hp);
    if (got > 0) { u.hp += got; float(u, `+${got}`, 'heal'); }
  }
  // Patchwork: Maintenance Drone patches up the most hurt ally.
  if (pv(u).mendPct) {
    const a = [...alliesOf(u)].filter((x) => x.hp < x.maxHp).sort((x, y) => x.hp / x.maxHp - y.hp / y.maxHp)[0];
    if (a) { healUnit(u, a, Math.round(a.maxHp * pv(u).mendPct), 'Maintenance Drone'); ticked = true; }
  }
  u.plated = false;   // Bulwark: Reactive Plating is ready again
  if (ticked) { render(); await wait(450); }

  if (u.maxMp) gainMp(u, Math.round(MANA.regen + u.maxMp * MANA.regenPct + (u.mpRegen || 0)), true);
  if (u.race === 'elf') { if (!u.hitSince) u.stacks = Math.min(3, u.stacks + 1); u.hitSince = false; }
  if (u.faction === 'stone' && wx() === 'mist') u.stacks = Math.min(3, u.stacks + 1);

  u.effects.forEach((e) => { if (e.until == null) e.turns--; });
  u.effects = u.effects.filter((e) => e.until != null || e.turns > 0);
  for (const k in u.cooldowns) if (u.cooldowns[k] > 0) u.cooldowns[k]--;
  return 'ok';
}

// A share of the caster's current HP, taken by an enemy passive. Never lethal on its own.
function spellToll(u, key, label) {
  const src = foesOf(u).find((f) => pv(f)[key]);
  const loss = src ? Math.round(u.hp * pv(src)[key]) : 0;
  if (loss < 1) return;
  u.hp = Math.max(1, u.hp - loss);
  float(u, `${loss}`, 'dot');
  log(`${src.name}'s ${label} costs ${u.name} ${loss} HP.`, src.side);
  if (key === 'spellBacklash') backwash(src, u);  // Maren's water surge to the caster (visual only)
}

// Hellfire Slam's Infernal Toll mark: the marked unit's next skill also costs 5% of its current HP,
// and that spends the mark. A hellfire beam flies from Malgrath to the caster if he's still standing.
const TOLL_PCT = 0.05;
function infernalToll(u) {
  const mark = has(u, 'toll');
  if (!mark) return;
  u.effects = u.effects.filter((e) => e !== mark);
  const loss = Math.round(u.hp * TOLL_PCT);
  if (loss >= 1) {
    u.hp = Math.max(1, u.hp - loss);
    float(u, `${loss}`, 'dot');
  }
  const src = foesOf(u).find((f) => f.id === 'malgrath');
  log(`Infernal Toll costs ${u.name} ${loss} HP.`, u.side === 'p' ? 'e' : 'p');
  if (src) backwash(src, u, true);
  else burst(u, 'fire');
}

async function doAction(u, sk, t) {
  state.phase = u.side === 'p' ? 'busy' : 'enemy';
  state.pending = null;
  u.combo = u.faction === 'human' && u.lastAction !== null && u.lastAction !== sk.id;
  if (u.combo) log(`${u.name}'s Discipline: +${Math.round(disciplineBonus() * 100)}%.`, u.side);
  if (sk.cd) u.cooldowns[sk.id] = sk.cd;
  // Mana: remember the pool before paying (mana-scaling damage uses it), pay the cost, then any leak.
  u.castMp = u.mp || 0;
  if (sk.mp) u.mp -= sk.mp;
  // Skills (anything but Attack and Guard) pay extra HP to an Infernal Toll mark and Maren's Backwash.
  if (sk.id !== 'attack' && sk.id !== 'guard') {
    infernalToll(u);
    spellToll(u, 'spellBacklash', 'Backwash');
  }
  if (has(u, 'leak') && u.mp > 0) {
    const lost = Math.min(u.mp, MANA.leakPerAction);
    u.mp -= lost;
    float(u, `-${lost} MP`, 'mpf');
    log(`${u.name} leaks ${lost} MP.`, 'sys');
  }
  render();

  if (sk.kind === 'damage') await damageSkill(u, t, sk);
  else if (sk.kind === 'heal') await healSkill(u, t, sk);
  else if (sk.kind === 'buff') await buffSkill(u, t, sk);
  else if (sk.kind === 'summon') {
    await castPose(u, true);
    const s = summonUnit(u, sk.summon);
    if (sk.rank) {   // a trained summon skill builds a tougher servant (see SKILL RANKS)
      const m = 1 + RANK_POWER * sk.rank;
      s.maxHp = Math.round(s.maxHp * m); s.hp = s.maxHp; s.atk = Math.round(s.atk * m);
    }
    burst(s, 'smoke');
    render();
    await wait(500);
  }
  else if (sk.kind === 'windup') {
    // A boss announces its big attack; it lands on the boss's next turn.
    const tg = MONSTERS[u.id].telegraph;
    u.windup = true;
    addFx(u, 'windup', 99, 0, true);
    await castPose(u);
    burst(u, 'roar');
    announce('Danger', `${tg.name} next turn`);
    log(`${u.name} ${tg.warn} ${tg.name} lands on its next turn. Guard or shield up!`, 'sys');
    render();
    await wait(900);
  }
  else if (sk.kind === 'guard') {
    await castPose(u);
    burst(u, 'shield');
    addFx(u, 'guard', 1);
    if (u.faction === 'mech' && u.heat > 0) log(`${u.name} vents Heat.`, u.side);
    render();
    await wait(380);
  }

  if (sk.id === 'attack') gainMp(u, MANA.attackGain, true);
  if (sk.id === 'guard') gainMp(u, MANA.guardGain);
  u.lastAction = sk.id;
  u.combo = false;
  if (u.faction === 'mech' && u.hp > 0 && !u.summon) {
    let heat = sk.o?.heat ?? 25;
    if (heat > 0 && wx() === 'storm') heat = Math.round(heat / 2);
    if (heat < 0 && sk.id !== 'guard' && u.heat > 0) { float(u, 'Vented', 'fx'); log(`${u.name} vents Heat.`, u.side); }
    // Soaked (the status or a Downpour): the Heat was doused to 0 and can't build until it dries.
    if (soaked(u)) heat = Math.min(heat, 0);
    u.heat = clamp(u.heat + heat, 0, 100);
    if (u.heat >= 100) addFx(u, 'overheat', 1);
  }
  render();
}

/* ==================================================================
   ENEMY AI
   ================================================================== */
const debuffs = (u) => u.effects.filter((e) => FX[e.id].kind === 'bad' && e.id !== 'soaked').length;
function aiChoose(u) {
  const allies = alliesOf(u);
  const hurt = allies.filter((a) => a.hp / a.maxHp < 0.55).sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp);
  const skills = skillsOf(u).filter((s) => usable(u, s));
  const guard = skills.find((s) => s.id === 'guard');
  if (u.faction === 'mech' && u.heat >= 70 && chance(0.7)) return { sk: guard, t: u };

  const scored = skills.map((s) => {
    let w = s.id === 'attack' ? 1 : s.id === 'guard' ? 0 : s.sig ? 3 : 2;
    if (s.kind === 'heal') w = hurt.length ? 6 : 0;
    if (s.kind === 'buff') w = s.target === 'self' ? (u.hp / u.maxHp < 0.7 ? 3 : 0.5) : 2;
    if (s.kind === 'buff' && s.o?.cleanse) w = allies.some(debuffs) ? 4 : 0.3;
    if (s.id !== 'guard' && s.o?.heat < 0) w = u.heat >= 40 ? 3 : 1;   // venting skills: better when hot
    if (s.kind === 'summon') w = summonOf(u) ? 0 : 4;
    return { s, w };
  }).filter((x) => x.w > 0);
  let roll = Math.random() * scored.reduce((a, x) => a + x.w, 0);
  let sk = scored[0].s;
  for (const x of scored) { roll -= x.w; if (roll <= 0) { sk = x.s; break; } }

  let t = u;
  if (sk.target === 'enemy') {
    const opts = validTargets(u, sk);
    t = chance(0.6) ? [...opts].sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0] : pick(opts);
  } else if (sk.target === 'ally') {
    const opts = validTargets(u, sk);
    t = sk.o?.aiTarget === 'debuffed' ? [...opts].sort((a, b) => debuffs(b) - debuffs(a))[0]
      : sk.kind === 'heal' || sk.o?.aiTarget === 'lowest'
        ? [...opts].sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0]
        : [...opts].sort((a, b) => b.atk - a.atk)[0];
  }
  return { sk, t };
}

/* ==================================================================
   TURN FLOW — the speed bar.
   Every living unit's icon moves along the bar at its Agility (Slow cuts
   that to 60%). The first icon to reach the end acts, then returns to
   the start. Stunned or Overheated units are frozen in place.
   Every ROUND_TIME of bar time is one round (High Tide, weather).
   An Agility-10 hero acts about once per round.
   ================================================================== */
const TRACK = 1000, ROUND_TIME = 100, FREEZE_TIME = 100;
const STAGGER_CYCLE = 40, STAGGER_STOP = 16;   // stop 16, move 24, repeat (starts with a stop)
const EPS = 1e-6;

const hardFrozen = (u) => u.effects.some((e) => (e.id === 'stun' || e.id === 'overheat') && e.until > state.time + EPS);
function staggerPhase(u) {
  const e = has(u, 'stagger');
  if (!e || e.until <= state.time + EPS) return null;
  return (state.time - e.start) % STAGGER_CYCLE;
}
const staggerStopped = (u) => { const ph = staggerPhase(u); return ph != null && ph < STAGGER_STOP - EPS; };
const frozen = (u) => hardFrozen(u) || staggerStopped(u);

// Time until a staggered unit next switches between stopping and moving.
function staggerSwitchIn(u) {
  const ph = staggerPhase(u);
  if (ph == null) return Infinity;
  return ph < STAGGER_STOP - EPS ? STAGGER_STOP - ph : STAGGER_CYCLE - ph;
}

// Water and Heat: a Soaked Ironclad champion (the Soaked status, or anyone out in a Downpour
// or a Thunderstorm) has its Heat doused to 0, and it can't build again until the Soaked wears off.
const wetWeather = () => wx() === 'rain' || wx() === 'storm';
const soaked = (u) => !!has(u, 'soaked') || wetWeather();
function douse(u, by) {
  if (u.faction !== 'mech' || u.summon || u.hp <= 0 || u.heat <= 0) return;
  u.heat = 0;
  float(u, 'Doused', 'fx');
  log(`${by} douses ${u.name}'s Heat.`, u.side);
}
// Downpour or Thunderstorm washes the Heat out of every living Ironclad champion at once.
function douseMechs() {
  for (const u of allUnits()) douse(u, `The ${WEATHER[wx()].name}`);
}

function newRound() {
  state.round++;
  log(`Round ${state.round}${highTide() ? ' · High Tide' : ''}`, 'round');
  // Underground there is no weather.
  if (state.mode !== 'hunt' && state.mode !== 'dungeon' && (state.round - 1) % WEATHER_EVERY === 0) {
    state.weather = state.nextWeather;
    state.nextWeather = rollWeather(state.weather);
    const W = WEATHER[state.weather];
    log(`The weather turns: ${W.name}. ${W.desc}`, 'wx');
    // Downpour or Thunderstorm hits the field: douse every mech's Heat at once. It stays doused until the weather passes.
    if (wetWeather()) douseMechs();
    announceWeather();
    return true;
  }
  return false;
}

// Big centered text over the arena (weather changes, battle start).
function announce(kicker, text) {
  const el = $('#wxAnnounce');
  el.innerHTML = `<div><small>${kicker}</small>${text}</div>`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function announceWeather() {
  announce('The weather turns', WEATHER[wx()].name);
  const bar = $('#weather');
  bar.classList.remove('changed'); void bar.offsetWidth; bar.classList.add('changed');
}

// Weather icons for the battle's weather pill.
const WX_ICON = { clear: '🌤️', ash: '🌋', storm: '⛈️', rain: '🌧️', sun: '🌅', mist: '🌫️', moon: '🌕' };

function roundsUntilWeather() {
  return WEATHER_EVERY - ((state.round - 1) % WEATHER_EVERY);
}

// Battles are decided by heroes only; summons don't count.
const heroesUp = (side) => state.teams[side].some((u) => alive(u) && !u.summon);

function checkEnd() {
  if (['won', 'lost', 'cleared'].includes(state.phase)) return true;
  if (!heroesUp('e')) { endBattle(true); return true; }
  if (!heroesUp('p')) { endBattle(false); return true; }
  return false;
}

/* ---------- Summons ---------- */
const summonOf = (owner) => state.teams[owner.side].find((x) => x.summon && x.owner === owner.uid && alive(x));

function summonUnit(owner, kind) {
  const def = SUMMONS[kind];
  const old = state.teams[owner.side].find((x) => x.summon && x.owner === owner.uid);
  if (old) removeUnit(old);
  const st = def.stats(owner);
  state.summonSeq = (state.summonSeq || 0) + 1;
  const u = {
    uid: `${owner.uid}s${state.summonSeq}`, id: kind, art: def.copy ? owner.id : kind,
    side: owner.side, summon: true, owner: owner.uid,
    name: def.copy ? `Ink ${owner.name}` : def.name,
    level: owner.level, faction: owner.faction, race: null, role: def.role,
    ...st, hp: st.maxHp, effects: [], cooldowns: {}, heat: 0, stacks: 0, hitSince: false, lastAction: null, combo: false,
    pos: 300 + Math.random() * 200, expires: def.life ? state.time + def.life : null,
  };
  state.teams[owner.side].push(u);
  addUnitDom(u);
  log(`${owner.name} summons ${u.name}.`, owner.side);
  float(u, 'Summoned', 'fx');
  if (def.onSpawn) def.onSpawn(u);
  return u;
}

function removeUnit(u) {
  state.teams[u.side] = state.teams[u.side].filter((x) => x !== u);
  document.getElementById(`u-${u.uid}`)?.remove();
  document.getElementById(`tok-${u.uid}`)?.remove();
  layoutSides();
}

// A destroyed Ironclad champion leaves one Salvage Bot behind. Unlike a normal summon
// it is `independent`: it keeps fighting even though its 'owner' (the fallen Mech) is gone.
function spawnDeathBot(mech) {
  const def = SUMMONS.deathbot;
  const st = def.stats(mech);
  state.summonSeq = (state.summonSeq || 0) + 1;
  const u = {
    uid: `${mech.uid}d${state.summonSeq}`, id: 'deathbot', art: 'scrapbot',
    side: mech.side, summon: true, independent: true, owner: mech.uid,
    name: def.name, level: mech.level, faction: 'mech', race: null, role: def.role,
    ...st, hp: st.maxHp, effects: [], cooldowns: {}, heat: 0, stacks: 0,
    hitSince: false, lastAction: null, combo: false,
    pos: 300 + Math.random() * 200, expires: null,
  };
  state.teams[mech.side].push(u);
  addUnitDom(u);
  burst(u, 'smoke');
  float(u, 'Salvaged', 'fx');
  log(`${mech.name} is destroyed — a ${u.name} claws out of the wreckage!`, mech.side);
  return u;
}

// After damage resolves, any Ironclad champion that just fell leaves one Salvage Bot.
function sweepDeathBots() {
  for (const u of allUnits()) {
    if (u.faction === 'mech' && !u.summon && u.hp <= 0 && !u.botSpawned) {
      u.botSpawned = true;
      spawnDeathBot(u);
    }
  }
}

// Summons leave when their time runs out or their summoner falls; dead summons are cleared away.
function cleanupSummons() {
  sweepDeathBots();
  for (const u of allUnits().filter((x) => x.summon)) {
    const owner = unitBy(u.owner);
    if (u.hp <= 0) removeUnit(u);
    else if (!u.independent && (!owner || owner.hp <= 0)) { log(`${u.name} vanishes with its summoner.`, 'sys'); removeUnit(u); }
    else if (u.expires != null && u.expires <= state.time + EPS) {
      log(SUMMONS[u.id].leave(u), 'sys');
      removeUnit(u);
    }
  }
}

// Timed effects (stun, overheat) that have run out are removed here.
function expireTimed() {
  for (const u of allUnits()) {
    const done = u.effects.filter((e) => e.until != null && e.until <= state.time + 1e-6);
    if (!done.length) continue;
    u.effects = u.effects.filter((e) => !done.includes(e));
    if (u.hp <= 0) continue;
    for (const e of done) {
      if (e.id === 'overheat') { u.heat = 0; log(`${u.name} has cooled down and moves again.`, 'sys'); }
      else if (e.id === 'stagger') log(`${u.name} regains their footing.`, 'sys');
      else log(`${u.name} shakes off the stun and moves again.`, 'sys');
    }
  }
}

// Moves the speed bar forward until someone reaches the end; returns that unit.
// Stops early at round boundaries (weather, High Tide) and when a frozen unit thaws.
async function advanceClock(token) {
  while (token === state.token) {
    const living = allUnits().filter(alive);
    const movers = living.filter((u) => !frozen(u));
    let next = null, dtActor = Infinity;
    for (const u of movers) {
      const dt = (TRACK - u.pos) / barAgi(u);
      if (dt < dtActor - 1e-9) { dtActor = dt; next = u; }
    }
    const dtRound = state.round * ROUND_TIME - state.time;
    const thaws = living.flatMap((u) => [
      ...u.effects.filter((e) => e.until != null).map((e) => e.until - state.time),
      staggerSwitchIn(u),
      u.expires != null ? u.expires - state.time : Infinity,
    ]).filter((d) => d > EPS);
    const dtThaw = thaws.length ? Math.min(...thaws) : Infinity;
    const dt = Math.max(0, Math.min(dtActor, dtRound, dtThaw));

    for (const u of movers) u.pos = Math.min(TRACK, u.pos + barAgi(u) * dt);
    state.time += dt;
    // The opening race is shown slower so you can watch everyone run from the start line.
    const ms = state.opening ? clamp(dt * 22, 900, 2200) : clamp(dt * 9, 120, 900);
    renderTrack(ms);
    if (dt > 0) await waitBar(ms);
    if (token !== state.token) return null;

    expireTimed();
    cleanupSummons();
    if (dtRound <= dt + 1e-9) {
      const changed = newRound();
      render();
      if (changed) { await wait(1400); if (token !== state.token) return null; }
    }
    if (next && dtActor <= dt + 1e-9 && alive(next) && state.teams[next.side].includes(next)) { next.pos = TRACK; return next; }
  }
  return null;
}

async function nextTurn() {
  const token = state.token;
  while (token === state.token) {
    if (checkEnd()) return;
    cleanupSummons();
    state.phase = 'busy';
    state.moving = true;
    render();
    if (state.opening) {
      // Hold everyone on the start line for a beat, then release them.
      renderTrack(0);
      announce('Battle start', 'Fight!');
      await wait(1100);
      if (token !== state.token) return;
    }
    const u = await advanceClock(token);
    state.opening = false;
    state.moving = false;
    if (!u || token !== state.token || checkEnd()) return;
    state.active = u.uid;
    state.phase = u.side === 'p' ? 'busy' : 'enemy';
    render();
    const s = await beginTurn(u);
    if (token !== state.token || checkEnd()) return;
    if (s !== 'ok') { endTurn(u); continue; }
    // Your heroes wait for you; summons (on either side) act on their own.
    // Only your champion waits for your orders; recruits and summons act on their own.
    if (u.you) { state.phase = 'choose'; state.pending = null; state.itemUsed = false; render(); return; }
    await wait(450);
    const { sk, t } = bossPlan(u) || aiChoose(u);   // bosses enrage and telegraph their big attacks
    await doAction(u, sk, t);
    endTurn(u);
    await wait(250);
  }
}

// After acting, the unit's icon goes back to the start of the speed bar.
function endTurn(u) {
  u.pos = 0;
  renderTrack(350);
}

// The token check stops a battle you left mid-animation (Abandon run) from carrying on in the background.
async function commit(u, sk, t) {
  const token = state.token;
  await doAction(u, sk, t);
  if (token !== state.token) return;
  endTurn(u);
  await wait(250);
  if (token === state.token) nextTurn();
}

function onSkill(id) {
  if (state.phase !== 'choose') return;
  const u = unitBy(state.active);
  const sk = skillsOf(u).find((s) => s.id === id);
  if (!sk || !usable(u, sk)) return;
  if (sk.target === 'enemy' || sk.target === 'ally') {
    const opts = validTargets(u, sk);
    if (opts.length === 1) return commit(u, sk, opts[0]);
    state.pending = sk.id;
    render();
    return;
  }
  commit(u, sk, sk.target === 'self' ? u : null);
}

// What the player is picking a target for: a skill id, or 'item:<key>' for a satchel item.
function pendingAction(u) {
  if (!state.pending || !u) return null;
  if (state.pending.startsWith('item:')) {
    const key = state.pending.slice(5);
    return { ...ITEMS[key], id: state.pending, item: key };
  }
  return skillsOf(u).find((s) => s.id === state.pending);
}

function onUnit(uid) {
  if (state.phase !== 'choose' || !state.pending) return;
  const u = unitBy(state.active);
  const sk = pendingAction(u);
  const t = unitBy(uid);
  if (!sk || !validTargets(u, sk).includes(t)) return;
  if (sk.item) useItem(u, sk.item, t);
  else commit(u, sk, t);
}

function onItem(key) {
  if (state.phase !== 'choose' || state.itemUsed || !(profile.items[key] > 0)) return;
  const u = unitBy(state.active);
  if (ITEMS[key].target !== 'ally') return useItem(u, key, null);
  const opts = alliesOf(u);
  if (opts.length === 1) return useItem(u, key, opts[0]);
  state.pending = `item:${key}`;
  render();
}

// Satchel items are a free action: one per turn, then the champion still chooses a normal action.
async function useItem(u, key, t) {
  const token = state.token, it = ITEMS[key];
  state.phase = 'busy'; state.pending = null; state.itemUsed = true;
  profile.items[key]--;
  saveProfile();
  log(`${u.name} uses a ${it.name}.`, u.side);
  for (const t of questEvent('item', { key })) log(t, 'sys');
  render();
  await castPose(u);
  if (key === 'draught') { burst(t, 'heal'); healUnit(u, t, Math.round(t.maxHp * 0.35), it.name); }
  else if (key === 'tonic') {
    burst(t, 'buff');
    if (t.maxMp) gainMp(t, 40);
    else if (t.faction === 'mech') { t.heat = Math.max(0, t.heat - 50); float(t, 'Vented', 'fx'); log(`${t.name} vents Heat.`, t.side); }
  } else if (key === 'salts') { burst(t, 'buff'); cleanse(t); log(`${t.name} is purified.`, t.side); }
  else if (key === 'firebomb') {
    for (const f of foesOf(u)) {
      const dmg = Math.max(1, Math.round(f.maxHp * 0.1));
      f.hp = Math.max(0, f.hp - dmg);
      burst(f, 'fire');
      knock(f, false);
      float(f, `${dmg}`, 'dmg');
      log(`The Firebomb scorches ${f.name} for ${dmg}.`, u.side);
      if (f.hp <= 0) log(`${f.name} is down.`, 'sys');
      else addFx(f, 'burn', 3, Math.round(u.atk * 0.25));
    }
  } else if (key === 'horn') {
    for (const a of alliesOf(u)) if (a !== u) { a.pos = Math.min(TRACK, (a.pos || 0) + 300); burst(a, 'roar'); float(a, 'Surge', 'fx'); }
    log('The War Horn sounds. Your warband surges forward.', u.side);
  }
  render();
  await wait(450);
  if (token !== state.token) return;
  cleanupSummons();
  if (checkEnd()) return;
  state.phase = 'choose';
  render();
}

/* ==================================================================
   GAUNTLET FLOW
   ================================================================== */
function pickEnemyTeam(fac) {
  const pool = ROSTER.filter((c) => c.faction === fac);
  const melee = pick(pool.filter((c) => c.role === 'melee'));
  // Factions without ranged fighters (Crimson Court) field a second melee instead.
  const rangedPool = pool.filter((c) => c.role === 'ranged');
  const ranged = pick(rangedPool.length ? rangedPool : pool.filter((c) => c.role === 'melee' && c !== melee));
  const third = pick(pool.filter((c) => c !== melee && c !== ranged));
  return [melee.id, third.id, ranged.id].sort((a, b) => ['melee', 'support', 'ranged'].indexOf(charById(a).role) - ['melee', 'support', 'ranged'].indexOf(charById(b).role));
}

function startGauntlet() {
  if (!profile.hero || state.team.length !== 3) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  state.mode = 'gauntlet';
  state.level = heroLevel();
  state.battle = 0;
  state.order = shuffle(FACTION_KEYS);
  state.runPending = false;
  profile.stats.runs++;
  saveProfile();
  startBattle(false);
}

// A cave hunt: one battle against a monster pack from the chosen depth. Retry keeps the same pack.
function startHunt(depthId) {
  const d = depthById(depthId);
  if (!profile.hero || state.team.length !== 3) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (!d || heroLevel() < d.minLv || state.runPending) return;
  state.mode = 'hunt';
  state.hunt = { depth: d.id };
  state.enemyIds = rollPack(d);
  startBattle(true);
}

const huntDepth = () => (state.mode === 'hunt' ? depthById(state.hunt?.depth) : null);

function startBattle(retry) {
  const hunt = huntDepth(), dg = dungeonRun(), duel = state.mode === 'duel' ? state.duel : null;
  const fac = hunt || dg || duel ? null : state.order[state.battle];
  if (!retry && !hunt && !dg && !duel) state.enemyIds = pickEnemyTeam(fac);
  // Your warband fights at your champion's level. Slot 0 is you: the only unit that takes your orders.
  state.level = heroLevel();
  state.teams.p = state.team.map((id, i) => makeUnit(charById(id), state.level, 'p', i));
  if (profile.hero && state.teams.p[0]) { state.teams.p[0].you = true; state.teams.p[0].name = heroName(); }
  // Enemies: one level below you at first, rising every two battles, and 85% → 105% strength across the run.
  if (hunt || dg) {
    // Monsters fight at your level, never below the depth's or dungeon's minimum.
    const src = hunt || dg;
    state.teams.e = state.enemyIds.map((id, i) => makeMonster(id, Math.max(src.minLv, state.level), i, src.scale));
    // Dungeons: HP and MP carry over from the previous room.
    if (dg) {
      for (const u of state.teams.p) {
        const c = state.dg.carry[u.id];
        if (c) { u.hp = Math.max(1, Math.min(u.maxHp, c.hp)); u.mp = Math.max(0, Math.min(u.maxMp, c.mp)); }
      }
    }
  } else if (duel) {
    // Proving Grounds: a rival warband at the tier's level and strength.
    state.teams.e = state.enemyIds.map((id, i) => makeUnit(charById(id), duel.lv, 'e', i, duel.scale));
    for (const u of state.teams.e) if (state.team.includes(u.id)) u.name = `Rival ${u.name}`;
  } else {
    const enemyLv = Math.max(1, state.level - 1 + Math.floor(state.battle / 2));
    const enemyScale = 0.85 + 0.2 * state.battle / (state.order.length - 1);
    state.teams.e = state.enemyIds.map((id, i) => makeUnit(charById(id), enemyLv, 'e', i, enemyScale));
    for (const u of state.teams.e) if (state.team.includes(u.id)) u.name = `Rival ${u.name}`;
  }
  state.round = 1; state.time = 0; state.moving = false; state.active = null;
  // Everyone lines up at the start of the speed bar and races to Act together.
  for (const u of allUnits()) u.pos = 0;
  state.opening = true;
  state.phase = 'busy'; state.pending = null; state.reward = null; state.log = [];
  state.weather = 'clear'; state.nextWeather = rollWeather('clear');
  state.screen = 'battle';
  state.token++;
  $('#overlay').hidden = true;
  if (dg) log(`${dg.name}, ${dgIsBossRoom() ? 'the boss room' : `room ${state.dg.room + 1} of ${dgRooms(dg)}`}: ${state.teams.e.map((u) => u.name).join(', ')}.`, 'sys');
  else if (hunt) log(`${CAVE.name}, ${hunt.name}: ${state.teams.e.map((u) => u.name).join(', ')}.`, 'sys');
  else if (duel) log(`The Proving Grounds, ${duel.name} for ${duel.pay} gold: ${duel.band} — ${state.teams.e.map((u) => u.name).join(', ')}.`, 'sys');
  else log(`Battle ${state.battle + 1} of ${state.order.length} against ${theFaction(FACTIONS[fac])}.`, 'sys');
  log('Round 1', 'round');
  buildArena();
  render();
  window.scrollTo(0, 0);
  nextTurn();
}

// Hunt results: XP from every monster in the pack, gold per monster, and 'slay'/'hunt' events for
// bounties and quests. Monster fights never count as a win against a faction (vs: null).
function endHunt(won) {
  const d = huntDepth(), lv = state.teams.e[0]?.level || 1;
  const slain = state.teams.e.filter((u) => u.monster && !alive(u));
  const news = slain.flatMap((u) => questEvent('slay', { monster: u.id }));
  if (won) {
    state.phase = 'won';
    state.goldWon = guildGold(HUNT_GOLD_BASE + HUNT_GOLD_PER * state.teams.e.length);
    profile.gold += state.goldWon;
    profile.stats.earned += state.goldWon; profile.stats.wins++;
    const xp = Math.round(state.teams.e.reduce((s, u) => s + MONSTERS[u.id].xp, 0) * (1 + 0.1 * (lv - 1)));
    state.reward = { xp, ...gainXp(xp) };
    news.push(...questEvent('win', { vs: null, flawless: state.teams.p.filter((u) => !u.summon).every(alive), rounds: state.round, kills: 0 }),
      ...questEvent('hunt', { cave: 'emberhollow', depth: d.id }), ...guildWin());
  } else {
    state.phase = 'lost';
    state.reward = { xp: XP_LOSS, ...gainXp(XP_LOSS) };
    news.push(...questEvent('loss', { kills: 0 }));
  }
  state.level = heroLevel();
  fillNewSlots(state.level);
  saveProfile();
  state.questNews = news;
}

/* ---------- The Proving Grounds: duels against rival warbands ----------
   Three challengers wait whenever you visit: mixed-faction champion bands at
   rising stakes. You pay the stake to step in; a win pays it back with profit.
   Duels never touch a paused gauntlet run and never count as faction wins. */
const DUEL_TIERS = [
  { name: 'Skirmish',    lvOff: -1, scale: 0.9,  stake: 20, pay: 50,  xp: 30 },
  { name: 'Even Match',  lvOff: 0,  scale: 1,    stake: 40, pay: 100, xp: 45 },
  { name: 'High Stakes', lvOff: 2,  scale: 1.05, stake: 80, pay: 220, xp: 70 },
];
const BAND_NAMES = ['Raiders', 'Blades', 'Vanguard', 'Wolves', 'Free Company', 'Oathless', 'Ashwalkers', 'Banner'];

// A fresh set of challengers: one band per tier, any mix of factions.
function rollDuels() {
  state.duels = DUEL_TIERS.map((t, i) => {
    const ids = shuffle(ROSTER.map((c) => c.id)).slice(0, 3)
      .sort((a, b) => ['melee', 'support', 'ranged'].indexOf(charById(a).role) - ['melee', 'support', 'ranged'].indexOf(charById(b).role));
    return { ...t, tier: i, ids, band: `${shortName(charById(ids[0]))}'s ${pick(BAND_NAMES)}` };
  });
}

function startDuel(i) {
  const d = state.duels[i];
  if (!profile.hero || state.team.length !== 3) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (!d || state.runPending || profile.gold < d.stake) return;
  profile.gold -= d.stake;
  saveProfile();
  state.mode = 'duel';
  state.duel = { ...d, lv: Math.max(1, heroLevel() + d.lvOff) };
  state.enemyIds = d.ids;
  startBattle(true);
}

// Duel results: the stake is already paid, so a win returns it with profit.
// Like hunts, duels never count as a win against a faction (vs: null).
function endDuel(won) {
  const d = state.duel;
  const news = [];
  if (won) {
    state.phase = 'won';
    state.goldWon = guildGold(d.pay);
    profile.gold += state.goldWon;
    profile.stats.earned += state.goldWon; profile.stats.wins++;
    profile.stats.duelWins = (profile.stats.duelWins || 0) + 1;
    const xp = Math.round(d.xp * (1 + 0.08 * (d.lv - 1)));
    state.reward = { xp, ...gainXp(xp) };
    const flawless = state.teams.p.filter((u) => !u.summon).every(alive);
    news.push(...questEvent('win', { vs: null, flawless, rounds: state.round, kills: enemyKills() }), ...guildWin());
  } else {
    state.phase = 'lost';
    state.reward = { xp: XP_LOSS, ...gainXp(XP_LOSS) };
    news.push(...questEvent('loss', { kills: enemyKills() }));
  }
  state.level = heroLevel();
  fillNewSlots(state.level);
  saveProfile();
  state.questNews = news;
}

/* ---------- Dungeon runs ---------- */
const dungeonRun = () => (state.mode === 'dungeon' ? dungeonById(state.dg?.id) : null);
const dgRooms = (d) => d.rooms.length + 1;                 // normal rooms + the boss room
const dgIsBossRoom = () => { const d = dungeonRun(); return !!d && state.dg.room === d.rooms.length; };

function startDungeon(id) {
  const d = dungeonById(id);
  if (!profile.hero || state.team.length !== 3) { state.screen = 'select'; render(); window.scrollTo(0, 0); return; }
  if (!d || heroLevel() < d.minLv || state.runPending) return;
  state.mode = 'dungeon';
  state.dg = { id, room: 0, gold: 0, xp: 0, carry: {}, done: false };
  enterRoom();
}

// The next room's monsters (or the boss and its adds), then the battle.
function enterRoom() {
  const d = dungeonRun();
  state.enemyIds = dgIsBossRoom() ? [d.boss, ...d.bossAdds] : d.rooms[state.dg.room];
  startBattle(true);
}

// Bosses: enrage below half HP, and every few turns wind up a big telegraphed attack,
// which lands on their next turn (Guard, shields and wards are the answer).
function bossPlan(u) {
  if (!u.boss) return null;
  const m = MONSTERS[u.id];
  if (!u.enraged && u.hp <= u.maxHp * BOSS_ENRAGE_AT) {
    u.enraged = true;
    addFx(u, 'enraged', 999, 0, true);
    burst(u, 'roar');
    announce('Boss enraged', u.name);
    log(`${u.name} is enraged! It deals 35% more damage.`, 'sys');
  }
  const tg = m.telegraph;
  if (!tg) return null;
  if (u.windup) {
    u.windup = false;
    u.effects = u.effects.filter((e) => e.id !== 'windup');
    const sk = { ...tg.skill, id: 'tele' };
    return { sk, t: sk.target === 'enemy' ? pick(validTargets(u, sk)) : u };
  }
  u.bossTurns = (u.bossTurns || 0) + 1;
  if (u.bossTurns % tg.every === 0) return { sk: { id: 'windup', kind: 'windup', name: tg.name, target: 'self', o: {} }, t: u };
  return null;
}

// Chest loot: satchel items (into the satchel if there's room, else the stash, else their price in gold).
function chestLoot(d) {
  const got = [];
  let extraGold = 0;
  for (let i = 0; i < d.chest.items; i++) {
    const k = pick(ITEM_KEYS);
    if ((profile.items[k] || 0) < SATCHEL_MAX) { profile.items[k] = (profile.items[k] || 0) + 1; got.push(`${ITEMS[k].name} (satchel)`); }
    else if ((profile.stash.items[k] || 0) < stashCap()) { profile.stash.items[k] = (profile.stash.items[k] || 0) + 1; got.push(`${ITEMS[k].name} (stash)`); }
    else { extraGold += ITEMS[k].price; got.push(`${ITEMS[k].price} gold instead of a ${ITEMS[k].name}`); }
  }
  return { got, extraGold };
}

function endDungeonRoom(won) {
  const d = dungeonRun(), boss = dgIsBossRoom(), lv = state.teams.e[0]?.level || 1;
  const slain = state.teams.e.filter((u) => u.monster && !alive(u));
  const news = slain.flatMap((u) => questEvent('slay', { monster: u.id }));
  for (const u of slain) if (u.boss) news.push(...questEvent('boss', { id: u.id }));
  if (won) {
    state.phase = 'won';
    state.goldWon = guildGold(HUNT_GOLD_BASE + HUNT_GOLD_PER * state.teams.e.filter((u) => u.monster).length);
    const xp = Math.round(state.teams.e.filter((u) => u.monster).reduce((s, u) => s + MONSTERS[u.id].xp, 0) * (1 + 0.1 * (lv - 1)) * DG_XP_MULT);
    state.reward = { xp, ...gainXp(xp) };
    const flawless = state.teams.p.filter((u) => !u.summon).every(alive);
    news.push(...questEvent('win', { vs: null, flawless, rounds: state.round, kills: 0 }), ...guildWin(boss));
    // Carry HP and MP to the next room: the fallen get up at 20%, then everyone rests a little.
    for (const u of state.teams.p.filter((x) => !x.summon)) {
      const hp = u.hp > 0 ? u.hp : Math.round(u.maxHp * DG_REVIVE);
      state.dg.carry[u.id] = {
        hp: Math.min(u.maxHp, hp + Math.round(u.maxHp * DG_REST_HP)),
        mp: Math.min(u.maxMp, (u.mp || 0) + Math.round(u.maxMp * DG_REST_MP)),
      };
    }
    if (boss) {
      // The chest, plus a trinket the first time this dungeon is cleared.
      const rec = profile.dungeons[d.id] = profile.dungeons[d.id] || { clears: 0 };
      const loot = chestLoot(d);
      state.dg.chest = { gold: d.chest.gold + loot.extraGold, items: loot.got, trinket: rec.clears === 0 ? d.firstClear : null };
      state.goldWon += state.dg.chest.gold;
      if (state.dg.chest.trinket) profile.stash.trinkets[d.firstClear] = (profile.stash.trinkets[d.firstClear] || 0) + 1;
      rec.clears++;
      state.dg.done = true;
      news.push(...questEvent('dungeon', { id: d.id, cleared: true, rooms: dgRooms(d) }));
    }
    profile.gold += state.goldWon;
    profile.stats.earned += state.goldWon; profile.stats.wins++;
  } else {
    state.phase = 'lost';
    state.goldWon = 0;
    state.reward = { xp: XP_LOSS, ...gainXp(XP_LOSS) };
    news.push(...questEvent('loss', { kills: 0 }), ...questEvent('dungeon', { id: d.id, cleared: false, rooms: state.dg.room }));
  }
  state.dg.gold += state.goldWon;
  state.dg.xp += state.reward.xp;
  state.level = heroLevel();
  fillNewSlots(state.level);
  saveProfile();
  state.questNews = news;
}

// Leaving between rooms ends the run; everything earned so far is kept.
function retreatDungeon() {
  const d = dungeonRun();
  if (d && !state.dg.done) state.questNews = questEvent('dungeon', { id: d.id, cleared: false, rooms: state.dg.room + 1 });
  toVillage();
  openPlace('gate');
}

async function endBattle(won) {
  state.active = null; state.pending = null;
  if (dungeonRun()) endDungeonRoom(won);
  else if (huntDepth()) endHunt(won);
  else if (state.mode === 'duel') endDuel(won);
  else if (won) {
    const cleared = state.battle === state.order.length - 1;
    // Gold: more for every battle deeper into the gauntlet, plus a bonus for clearing it.
    state.goldWon = guildGold(battleGold(state.battle) + (cleared ? CLEAR_BONUS : 0));
    profile.gold += state.goldWon;
    const s = profile.stats;
    s.earned += state.goldWon; s.wins++; s.best = Math.max(s.best, state.battle + 1);
    state.phase = cleared ? 'cleared' : 'won';
    if (cleared) s.clears++;
    // XP: more for every battle deeper into the run, plus a bonus for clearing it. Levels stick.
    const xp = battleXp(state.battle) + (cleared ? XP_CLEAR_BONUS : 0);
    state.reward = { xp, ...gainXp(xp) };
    const gnews = guildWin(cleared);
    state.level = heroLevel();
    fillNewSlots(state.level);
    saveProfile();
    const flawless = state.teams.p.filter((u) => !u.summon).every(alive);
    state.questNews = [...questEvent('win', { vs: state.order[state.battle], flawless, rounds: state.round, kills: enemyKills() }), ...(cleared ? questEvent('clear') : []), ...gnews];
  } else {
    state.phase = 'lost';
    state.questNews = questEvent('loss', { kills: enemyKills() });   // bounties still count the enemies you felled
    state.reward = { xp: XP_LOSS, ...gainXp(XP_LOSS) };   // even a loss teaches something
    state.level = heroLevel();
    fillNewSlots(state.level);
    saveProfile();
  }
  log(won ? `Victory. +${state.goldWon} gold, +${state.reward.xp} XP.` : `Your warband has fallen. +${state.reward.xp} XP.`, 'sys');
  if (state.reward.to > state.reward.from) log(`${heroName()} reaches level ${state.reward.to}!`, 'sys');
  const unlocked = questsUnlocked(state.reward.from, state.reward.to);
  state.questNews = [...state.questNews, ...unlocked];
  for (const t of state.questNews) log(t, 'sys');
  render();
  await wait(700);
  showEndOverlay();
}

// Back to Cinderhold. A paused run (state.runPending) keeps its place in the gauntlet.
function toVillage() {
  state.token++;
  state.retireArmed = false;
  if (state.screen !== 'village') { rollFolk(); hideSay(); }   // different townsfolk are out each time you come back
  state.screen = 'village';
  if (!state.runPending) state.phase = 'idle';
  state.active = null; state.pending = null;
  $('#overlay').hidden = true;
  render();
  window.scrollTo(0, 0);
}

const forgeHero = () => (state.forgeHero && charById(state.forgeHero) ? state.forgeHero : state.team[0] || ROSTER[0].id);

function forgeUp(slot) {
  const id = forgeHero(), g = { ...gearRaw(id) }, t = g[slot] || 0, cost = FORGE_COST[t];
  if (t >= FORGE_MAX || profile.gold < cost) return false;
  profile.gold -= cost;
  g[slot] = t + 1;
  profile.gear[id] = g;
  saveProfile();
  return true;
}

// Goes into the satchel; once that's full, it's sent home to the stash. True = a purchase happened.
function buyItem(key) {
  const it = ITEMS[key], n = profile.items[key] || 0, m = profile.stash.items[key] || 0;
  if ((n >= SATCHEL_MAX && m >= stashCap()) || profile.gold < it.price) return false;
  profile.gold -= it.price;
  if (n < SATCHEL_MAX) profile.items[key] = n + 1;
  else profile.stash.items[key] = m + 1;
  saveProfile();
  return true;
}
