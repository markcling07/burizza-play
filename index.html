    u.blessLeft = (u.blessLeft ?? u.blessBuffs) - 1;
    turns += 1;
    float(u, 'Blessed +1', 'fx');
  }
  // Stagger needs footing to take hold, and floating units — champion, monster or summon —
  // have none. Part of their Nature — unlike a passive immunity, no loadout swap turns it
  // off — and the Earthquake's jolts pass under them too (see advanceClock).
  if (id === 'stagger' && u.floats) {
    if (!quiet) { float(u, 'Airborne', 'fx'); log(`${u.name} floats — the Stagger finds no footing.`, u.side); }
    return;
  }
  // Hellfire knows its own: Malgrath's Pit-Forged Nature shrugs every Burn.
  if (id === 'burn' && charNat(u).fireproof) {
    if (!quiet) { float(u, 'Pit-forged', 'fx'); log(`${u.name} is pit-forged — the fire finds nothing left to take.`, u.side); }
    return;
  }
  // Machines don't bleed, and the dead have no blood to spill: every Ironclad unit (champions and
  // their Salvage Bots) and the whole Pale Host are immune to Bleed.
  if (id === 'bleed' && (u.faction === 'mech' || u.faction === 'undead')) {
    if (!quiet) {
      float(u, 'No blood', 'fx');
      log(u.faction === 'mech' ? `${u.name} is a machine — the Bleed finds no blood.`
                               : `${u.name} is long dead — the Bleed finds no blood to spill.`, u.side);
    }
    return;
  }
  if (id === 'flee' && (charNat(u).anchor || charNat(u).march)) {
    if (!quiet) { float(u, 'Unmoved', 'fx'); log(`${u.name} does not give an inch.`, u.side); }
    return;
  }
  const ex = has(u, id);
  const until = TIMED_FX[id] ? state.time + TIMED_FX[id] : null;
  const tollN = TOLL_FX[id] ? turns : null;   // bash/fear/coffin count Tolls, not the owner's turns
  if (ex) {
    ex.turns = Math.max(ex.turns, turns); ex.value = Math.max(ex.value, value);
    if (until != null) ex.until = Math.max(ex.until, until);
    if (tollN != null) ex.tolls = Math.max(ex.tolls || 0, tollN);   // refresh to the longer count, never stack
    if (id === 'stagger') ex.start = state.time;   // a fresh hit restarts the stumble
  } else if (until != null) u.effects.push({ id, turns, value, until, start: state.time });
  else if (tollN != null) u.effects.push({ id, turns: 99, value, tolls: tollN });   // turns is a no-op; tolls drives it
  else u.effects.push({ id, turns, value });
  // FEAR shoves the unit back along the speed bar — a little, never past the start line.
  // Dug In and The Slow March refuse it like any drag: the fear takes hold, the ground isn't lost.
  if (id === 'fear' && !charNat(u).anchor && !charNat(u).march) { u.pos = Math.max(0, (u.pos || 0) - FEAR_BACK); u.recoil = true; }
  if (id === 'soaked') douse(u, 'The soaking');
  // Flee: a step per remaining Toll, so the last Toll puts it exactly on the start line.
  if (id === 'flee') { const e = has(u, 'flee'); e.step = Math.ceil((u.pos || 0) / Math.max(1, e.tolls)); }
  u.chipsAt = Date.now();   // even a quiet status re-shows the chip text (float covers the rest)
  if (quiet) return;
  float(u, `${FX[id].icon} ${FX[id].label}`, 'fx');
  log(`${u.name} ${FX[id].verb}.`, FX[id].kind === 'good' ? u.side : 'sys');
}

// Start of a unit's turn: damage/heal over time, faction upkeep, durations and cooldowns tick down.
// (Stun is handled on the speed bar: a stunned unit never reaches the end while frozen.)
async function beginTurn(u) {
  releaseRites(u, `is released from ${u.name}'s Last Rites.`);   // his turn has come round: the crosses lift
  unburrow(u);   // Burrow: if his turn comes before the round is out, he comes up to take it
  // Evergreen (Elowen's Nature): each of her turns, the oldest curse falls away like a dead leaf —
  // before it can tick, the wood has already shed it.
  if (charNat(u).evergreen) {
    const leaf = u.effects.find((e) => FX[e.id].kind === 'bad' && e.id !== 'overheat');
    if (leaf) { u.effects = u.effects.filter((e) => e !== leaf); float(u, `${FX[leaf.id].icon} Shed`, 'fx'); }
  }
  let ticked = false;
  for (const id of DOT_IDS) {
    const e = has(u, id);
    if (!e) continue;
    // Weather and Burn: Ash Storm fans the flames (+50%), Downpour douses them (−50%).
    // Underground there is no weather, but Rustgut Mine's Firedamp catches just as well (+50%).
    const burnMult = id !== 'burn' ? 1 : dgCondIs('gas') || wx() === 'ash' ? 1.5 : wx() === 'rain' ? 0.5 : 1;
    const dmg = Math.max(1, Math.round(e.value * burnMult));
    u.hp = Math.max(0, u.hp - dmg);
    bump(u, 'hurt');
    float(u, `${dmg}`, 'dot');
    log(`${u.name} takes ${dmg} from ${FX[id].label}.`, 'sys');
    ticked = true;
    // Undying can catch this: fell() puts a Pale Host champion back on 1 HP, and the turn goes on.
    if (u.hp <= 0) { fell(u, unitBy(e.by)); render(); await wait(450); if (u.hp <= 0) return 'dead'; }
  }
  // Nothing mends what is sealed in a coffin or already standing Undying.
  const sealed = has(u, 'coffin') || undyingOn(u);
  const rg = has(u, 'regen');
  if (rg && u.hp < u.maxHp && !sealed) {
    const mend = Math.round(rg.value * (1 + (u.healTaken || 0)) * (wx() === 'pall' ? 0.75 : 1));   // worn kit; Grave Pall dulls it
    const got = Math.min(has(u, 'hex') ? Math.round(mend * 0.5) : mend, u.maxHp - u.hp);
    u.hp += got;
    float(u, `+${got}`, 'heal');
    log(`${u.name} regenerates ${got} HP.`, u.side);
    ticked = true;
  }
  // Natural HP regen: champions (not summons) recover a small share of max HP each turn. Hex halves it.
  // Elowen's Verdant Aura adds to it for her whole warband.
  // The Pale Host keep their own slow mending at full strength: the grave sustains them even
  // though spells barely can. What it cannot do is reach into a coffin or an Undying stand.
  if (!u.summon && u.hp < u.maxHp && !sealed) {
    let amt = Math.round(u.maxHp * (HP_REGEN_PCT + (allyHas(u, 'allyRegen') ? 0.02 : 0))) + (u.hpRegen || 0);
    if (has(u, 'hex')) amt = Math.round(amt * 0.5);
    if (wx() === 'pall') amt = Math.round(amt * 0.75);
    const got = Math.min(amt, u.maxHp - u.hp);
    if (got > 0) { u.hp += got; float(u, `+${got}`, 'heal'); }
  }
  // Patchwork: Maintenance Drone patches up the most hurt ally.
  if (pv(u).mendPct) {
    const a = [...alliesOf(u)].filter((x) => x.hp < x.maxHp).sort((x, y) => x.hp / x.maxHp - y.hp / y.maxHp)[0];
    if (a) { healUnit(u, a, Math.round(a.maxHp * pv(u).mendPct), 'Maintenance Drone'); ticked = true; }
  }
  // Morwenna: Crimson Mend is a channel, so it works from here rather than from the cast. Each of her
  // turns it opens her veins — she pays a share of her own max HP and every living ally is mended by
  // the same share of theirs, with a blood link fired from her to each. alliesOf is already the whole
  // living side, so summoned units are fed by it too. She is not on the receiving end: healing her
  // for the same share she just paid would cancel the cost and leave the channel free.
  if (has(u, 'bloodchannel') && u.hp > 0) {
    const cost = Math.max(1, Math.round(u.maxHp * CRIMSON_MEND_PCT));
    u.hp = Math.max(1, u.hp - cost);   // the channel bleeds her, but it will never be what kills her
    bump(u, 'hurt');
    float(u, `${cost}`, 'dot');
    log(`${u.name} opens her veins for Crimson Mend, paying ${cost} HP.`, u.side);
    for (const a of alliesOf(u)) {
      if (a.uid === u.uid) continue;
      bloodLink(u, a);
      healUnit(u, a, Math.round(a.maxHp * CRIMSON_MEND_PCT), 'Crimson Mend');
    }
    ticked = true;
  }
  u.plated = false;   // Bulwark: Reactive Plating is ready again
  if (ticked) { render(); await wait(450); }

  if (u.maxMp) gainMp(u, Math.round(MANA.regen + u.maxMp * MANA.regenPct + (u.mpRegen || 0)
    + (charNat(u).emberwarm && allUnits().some((x) => x.hp > 0 && has(x, 'burn')) ? 5 : 0)), true);   // Aldous: Ember-Warm
  if (u.race === 'elf') { if (!u.hitSince) u.stacks = Math.min(stackCap(u), u.stacks + 1); u.hitSince = false; }
  if (u.faction === 'stone' && wx() === 'mist') u.stacks = Math.min(stackCap(u), u.stacks + 1);

  /* Durations and cooldowns tick down at the owner's turn-start. Toll-counted effects (BASH, FEAR,
     the coffin) are skipped here — they count the field's global clock in turnPulse instead, and
     both BASH and the coffin hold the unit off the bar so it never reaches this point while sealed. */
  u.effects.forEach((e) => { if (e.until == null && e.tolls == null) e.turns--; });
  u.effects = u.effects.filter((e) => e.until != null || e.tolls != null || e.turns > 0);
  for (const k in u.cooldowns) if (u.cooldowns[k] > 0) u.cooldowns[k]--;
  return 'ok';
}

// THE BLOOD PRICE — what a Crimson Court cast costs its caster, in place of mana (see BLOOD_COST).
// A share of their CURRENT HP, so the toll shrinks as they are worn down, and never their last
// point: a Courtier can always act, even on 1 HP. Attack and Guard are free.
function bloodCost(u, sk) {
  if (u.faction !== 'crimson' || sk.id === 'attack' || sk.id === 'guard' || sk.o?.noBlood) return;
  // Vesper's Noble Blood: old blood spends slowly — a twentieth less of everything.
  const loss = Math.round(u.hp * ((sk.sig ? BLOOD_COST.sig : BLOOD_COST.skill) - (charNat(u).noble ? 0.05 : 0)));
  if (loss < 1) return;
  u.hp = Math.max(1, u.hp - loss);
  bump(u, 'hurt');
  float(u, `${loss}`, 'dot');
  log(`${u.name} pays ${loss} HP in blood for ${sk.name}.`, u.side);
}

// A share of the caster's current HP, taken by an enemy passive. Never lethal on its own.
function spellToll(u, key, label) {
  const src = foesOf(u).find((f) => pv(f)[key]);
  const loss = src ? Math.round(u.hp * pv(src)[key]) : 0;
  if (loss < 1) return;
  u.hp = Math.max(1, u.hp - loss);
  float(u, `${loss}`, 'dot');
  log(`${src.name}'s ${label} costs ${u.name} ${loss} HP.`, src.side);
  if (key === 'spellBacklash') backwash(src, u);  // Maren's water surge to the caster (visual only)
}

// Hellfire Slam's Infernal Toll mark: the marked unit's next skill also costs 5% of its current HP,
// and that spends the mark. A hellfire beam flies from Malgrath to the caster if he's still standing.
const TOLL_PCT = 0.05;
function infernalToll(u) {
  const mark = has(u, 'toll');
  if (!mark) return;
  u.effects = u.effects.filter((e) => e !== mark);
  const loss = Math.round(u.hp * TOLL_PCT);
  if (loss >= 1) {
    u.hp = Math.max(1, u.hp - loss);
    float(u, `${loss}`, 'dot');
  }
  const src = foesOf(u).find((f) => f.id === 'malgrath');
  log(`Infernal Toll costs ${u.name} ${loss} HP.`, u.side === 'p' ? 'e' : 'p');
  if (src) backwash(src, u, 'fire');
  else burst(u, 'fire');
}

async function doAction(u, sk, t) {
  state.phase = u.side === 'p' ? 'busy' : 'enemy';
  state.pending = null;
  u.combo = u.faction === 'human' && u.lastAction !== null && u.lastAction !== sk.id;
  if (u.combo) log(`${u.name}'s Discipline: +${Math.round(disciplineBonus() * 100)}%.`, u.side);
  if (sk.cd) u.cooldowns[sk.id] = sk.cd;
  // Mana: remember the pool before paying (mana-scaling damage uses it), pay the cost, then any leak.
  u.castMp = u.mp || 0;
  if (sk.mp) u.mp -= charNat(u).seasung && highTide() ? Math.ceil(sk.mp / 2) : sk.mp;   // Seraphine: the sea carries the song
  // The Crimson Court pay in blood instead of mana — their own price comes off first, before any
  // toll an enemy has laid on them, so a Courtier is never taxed on blood they have already spent.
  bloodCost(u, sk);
  // Skills (anything but Attack and Guard) pay extra HP to an Infernal Toll mark and Maren's Backwash.
  if (sk.id !== 'attack' && sk.id !== 'guard') {
    infernalToll(u);
    spellToll(u, 'spellBacklash', 'Backwash');
    // Grubblefin's Choking Bite: a skill forced out through a choked throat seals the next turn.
    // Silence ticks down at the start of the owner's turn, so 2 = through its whole next turn.
    if (has(u, 'choke')) {
      u.effects = u.effects.filter((e) => e.id !== 'choke');
      log(`${u.name} chokes on the effort.`, 'sys');
      addFx(u, 'silence', 2);
    }
  }
  if (has(u, 'leak') && u.mp > 0) {
    const lost = Math.min(u.mp, MANA.leakPerAction);
    u.mp -= lost;
    float(u, `-${lost} MP`, 'mpf');
    log(`${u.name} leaks ${lost} MP.`, 'sys');
  }
  render();

  if (sk.kind === 'damage') await damageSkill(u, t, sk);
  else if (sk.kind === 'heal') await healSkill(u, t, sk);
  else if (sk.kind === 'buff') await buffSkill(u, t, sk);
  else if (sk.kind === 'summon' && SUMMONS[sk.summon].plant) await plantMarker(u, sk);
  else if (sk.kind === 'summon') {
    await castPose(u, true);
    const s = summonUnit(u, sk.summon);
    if (sk.rank) {   // a trained summon skill builds a tougher servant (see SKILL RANKS)
      const m = 1 + RANK_POWER * sk.rank;
      s.maxHp = Math.round(s.maxHp * m); s.hp = s.maxHp; s.atk = Math.round(s.atk * m);
    }
    burst(s, 'smoke');
    render();
    await wait(500);
    if (SUMMONS[sk.summon].strikesOnSpawn) await strikeOnSpawn(s);
  }
  else if (sk.kind === 'coffin') {
    const lv = u.side === 'p' ? heroLevel() : 1;   // hero level sets the coffin's mercy: Lv1/5/10
    await coffinFly(u, t);                          // the coffin leaves her back and flies to the ally
    addFx(t, 'coffin', COFFIN_TOLLS);
    const box = has(t, 'coffin');
    if (box) { box.cleanse = lv >= 5; box.shield = lv >= 10; }   // read on the way out, see emergeToll
    render();
    await wait(360);
  }
  else if (sk.kind === 'execute') await executeSkill(u, t, sk);
  else if (sk.kind === 'burrow') await burrowSkill(u);
  else if (sk.kind === 'anchor') await anchorSkill(u, t, sk);
  else if (sk.kind === 'jelly') await jellySkill(u, t, sk);
  else if (sk.kind === 'revive') {
    // Walk to the body, chant, and the fallen rise slowly with green-lit eyes (raiseRitual).
    await raiseRitual(u, t, () => reviveUnit(u, t, sk.pct, sk.name));
  }
  else if (sk.kind === 'windup') {
    // A boss announces its big attack; it lands on the boss's next turn.
    const tg = MONSTERS[u.id].telegraph;
    u.windup = true;
    addFx(u, 'windup', 99, 0, true);
    await castPose(u);
    burst(u, 'roar');
    announce('Danger', `${tg.name} next turn`);
    log(`${u.name} ${tg.warn} ${tg.name} lands on its next turn. Guard or shield up!`, 'sys');
    render();
    await wait(900);
  }
  else if (sk.kind === 'guard') {
    await castPose(u);
    burst(u, 'shield');
    addFx(u, 'guard', 1);
    u.boardSwung = false;   // Tusk and Board: each fresh Guard answers one more blow
    if (u.faction === 'mech' && u.heat > 0) log(`${u.name} vents Heat.`, u.side);
    render();
    await wait(380);
  }

  if (sk.id === 'attack') gainMp(u, MANA.attackGain, true);
  if (sk.id === 'guard') gainMp(u, MANA.guardGain);
  u.lastAction = sk.id;
  u.combo = false;
  if (u.faction === 'mech' && u.hp > 0 && !u.summon) {
    let heat = sk.o?.heat ?? 25;
    if (heat > 0 && wx() === 'storm') heat = Math.round(heat / 2);
    if (heat < 0 && sk.id !== 'guard' && u.heat > 0) { float(u, 'Vented', 'fx'); log(`${u.name} vents Heat.`, u.side); }
    // Soaked (the status or a Downpour): the Heat was doused to 0 and can't build until it dries.
    if (soaked(u)) heat = Math.min(heat, 0);
    u.heat = clamp(u.heat + heat, 0, 100);
    if (u.heat >= 100) addFx(u, 'overheat', 1);
  }
  render();
}

/* ==================================================================
   ENEMY AI
   ================================================================== */
const debuffs = (u) => u.effects.filter((e) => FX[e.id].kind === 'bad' && e.id !== 'soaked').length;
function aiChoose(u) {
  const allies = alliesOf(u).filter((a) => !a.inert);
  const hurt = allies.filter((a) => a.hp / a.maxHp < 0.55).sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp);
  const skills = skillsOf(u).filter((s) => usable(u, s));
  const guard = skills.find((s) => s.id === 'guard');
  if (u.faction === 'mech' && u.heat >= 70 && chance(0.7)) return { sk: guard, t: u };

  const scored = skills.map((s) => {
    let w = s.id === 'attack' ? 1 : s.id === 'guard' ? 0 : s.sig ? 3 : 2;
    if (s.kind === 'heal') w = hurt.length ? 6 : 0;
    if (s.kind === 'buff') w = s.target === 'self' ? (u.hp / u.maxHp < 0.7 ? 3 : 0.5) : 2;
    if (s.kind === 'buff' && s.o?.cleanse) w = allies.some(debuffs) ? 4 : 0.3;
    // Bolt-On: worth it when someone needs the mending (or Patchwork himself needs to vanish).
    if (s.o?.latch) w = u.attachedTo ? 0.3 : hurt.length || u.hp / u.maxHp < 0.45 ? 4 : 1;
    // Provoke's charges are about drawing fire, so they are wasted on a band that already has a
    // taunt up. The Court's two blood buffs are counted in charges as well but play nothing like
    // it, so each is judged on its own below rather than by the charge rule.
    const fxIds = s.fx ? s.fx.map(([id]) => id) : [];
    if (s.o?.charges && fxIds.includes('provoke')) w = allies.some((a) => has(a, 'taunt') || has(a, 'provoke')) ? 0.2 : 2;
    // Blood Pact spreads what he takes, so it is worth opening when he is the one being worn down
    // and there are allies healthy enough to carry a share — never onto a band already bleeding out.
    if (fxIds.includes('bloodpact')) {
      const mates = allies.filter((a) => a.uid !== u.uid);
      w = u.hp / u.maxHp < 0.75 && mates.length && mates.every((a) => a.hp / a.maxHp > 0.45) ? 5 : 0.4;
    }
    // Blood Ward pays out of her own veins, so she wants the band hurt and herself hale.
    if (fxIds.includes('bloodward')) {
      const mates = allies.filter((a) => a.uid !== u.uid);
      w = mates.some((a) => a.hp / a.maxHp < 0.6) && u.hp / u.maxHp > 0.55 ? 5 : 0.4;
    }
    // A channel pays out of the caster's own HP, so the self-buff rule above has it backwards:
    // open it when the warband is hurt and she can afford the bleed, not when she is the hurt one.
    if (s.o?.channel) w = hurt.length && u.hp / u.maxHp > 0.5 ? 5 : 0.2;
    if (s.id !== 'guard' && s.o?.heat < 0) w = u.heat >= 40 ? 3 : 1;   // venting skills: better when hot
    if (s.kind === 'summon') w = summonOf(u) ? 0 : 4;
    // Second Burial: usable() has already checked there is a body to raise, so if it is on the
    // list at all it is worth more than anything else she could do with the turn.
    if (s.kind === 'revive') w = 9;
    // The coffin is for an ally about to be killed, not a routine play.
    if (s.kind === 'coffin') w = allies.some((a) => a.hp / a.maxHp < 0.3) ? 5 : 0.4;
    // Burrow is a way out from under a beating, not an opener.
    if (s.kind === 'burrow') w = u.hp / u.maxHp < 0.4 ? 4 : 0.25;
    return { s, w };
  }).filter((x) => x.w > 0);
  if (!scored.length) return { sk: guard, t: u };   // e.g. Mordrek with his cross planted and every skill cooling down
  let roll = Math.random() * scored.reduce((a, x) => a + x.w, 0);
  let sk = scored[0].s;
  for (const x of scored) { roll -= x.w; if (roll <= 0) { sk = x.s; break; } }

  let t = u;
  if (sk.target === 'enemy') {
    // validTargets already applies both targeting laws — Taunt first, then the front line
    // (melee only until this warband's melee have been attacked twice) — for AI and player alike.
    const opts = validTargets(u, sk);
    t = chance(0.6) ? [...opts].sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0] : pick(opts);
  } else if (sk.target === 'ally') {
    const opts = validTargets(u, sk);
    t = sk.o?.aiTarget === 'debuffed' ? [...opts].sort((a, b) => debuffs(b) - debuffs(a))[0]
      : sk.o?.aiTarget === 'tank' ? [...opts].sort((a, b) => b.hp * (50 + b.def) - a.hp * (50 + a.def))[0]
      : sk.kind === 'heal' || sk.kind === 'coffin' || sk.o?.aiTarget === 'lowest'
        ? [...opts].sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0]
        : [...opts].sort((a, b) => b.atk - a.atk)[0];
  } else if (sk.target === 'deadAlly') {
    // Raise the body worth the most: a champion who can actually fight once they are up.
    t = [...validTargets(u, sk)].sort((a, b) => b.maxHp * b.atk - a.maxHp * a.atk)[0];
  }
  return { sk, t };
}

/* ==================================================================
   TURN FLOW — the speed bar.
   Every living unit's icon moves along the bar at its Agility (Slow cuts
   that to 60%). The first icon to reach the end acts, then returns to
   the start. Stunned or Overheated units are frozen in place.
   Every ROUND_TIME of bar time is one round (High Tide, weather).
   An Agility-10 hero acts about once per round.
   ================================================================== */
const TRACK = 1000, ROUND_TIME = 100, FREEZE_TIME = 100;
const STAGGER_CYCLE = 40, STAGGER_STOP = 16;   // stop 16, move 24, repeat (starts with a stop)
const EPS = 1e-6;

const hardFrozen = (u) => u.effects.some((e) => (e.id === 'stun' || e.id === 'overheat') && e.until > state.time + EPS);
function staggerPhase(u) {
  const e = has(u, 'stagger');
  if (!e || e.until <= state.time + EPS) return null;
  return (state.time - e.start) % STAGGER_CYCLE;
}
const staggerStopped = (u) => { const ph = staggerPhase(u); return ph != null && ph < STAGGER_STOP - EPS; };
const pinned = (u) => !!has(u, 'rites');   // Last Rites: held in place until Mordrek's next turn
// BASH and the coffin hold a unit off the speed bar outright — counted in Tolls (see turnPulse),
// so a held unit never reaches the Act gate until its Tolls run out. FEAR is NOT here: it only
// shoves the unit back along the bar, so it still takes its turns, just later.
const tollHeld = (u) => !!(has(u, 'bash') || has(u, 'coffin') || has(u, 'flee'));
// Rooted (Tharos's Anchor) is NOT here on purpose: a rooted unit keeps reaching the Act gate and
// taking its turns — it just can't cross the field once it acts (see requiresMove / usable).
const frozen = (u) => hardFrozen(u) || staggerStopped(u) || pinned(u) || tollHeld(u) || buried(u);   // Burrow: held for its round

// Time until a staggered unit next switches between stopping and moving.
function staggerSwitchIn(u) {
  const ph = staggerPhase(u);
  if (ph == null) return Infinity;
  return ph < STAGGER_STOP - EPS ? STAGGER_STOP - ph : STAGGER_CYCLE - ph;
}

// Water and Heat: a Soaked Ironclad champion (the Soaked status, anyone out in a Downpour or a
// Thunderstorm, or anyone wading the Sunken Crypt's Grave Damp) has its Heat doused to 0, and it
// can't build again until it dries off.
const wetWeather = () => wx() === 'rain' || wx() === 'storm';
const soaked = (u) => !!has(u, 'soaked') || wetWeather() || dgCondIs('damp');
function douse(u, by) {
  if (u.faction !== 'mech' || u.summon || u.hp <= 0 || u.heat <= 0) return;
  u.heat = 0;
  float(u, 'Doused', 'fx');
  log(`${by} douses ${u.name}'s Heat.`, u.side);
}
// Downpour or Thunderstorm washes the Heat out of every living Ironclad champion at once.
// Clear Skies arriving: the light comes back and every Blind on the field lifts at once.
// (Battles open under Clear Skies too, but nobody is Blinded yet then, so only the turn of the weather counts.)
function clearSight() {
  const seen = allUnits().filter((u) => u.hp > 0 && has(u, 'blind'));
  for (const u of seen) {
    u.effects = u.effects.filter((e) => e.id !== 'blind');
    float(u, 'Sight returns', 'fx');
  }
  if (seen.length) log(`The skies clear: ${listAnd(seen.map((u) => u.name))} can see again.`, 'wx');
}

function douseMechs() {
  for (const u of allUnits()) douse(u, `The ${WEATHER[wx()].name}`);
}

/* EARTHQUAKE — no weather reaches this deep, but in Emberhollow Cave the rock itself
   moves. On a cave hunt a tremor can strike on a weather round and shakes the place for
   QUAKE_ROUNDS rounds. It is not the Stagger effect: no status lands on anyone. Instead,
   every QUAKE_EVERY ticks of the field's clock the floor bucks and every grounded unit
   slides QUAKE_SLIP back along the speed bar, then presses on — everyone still reaches
   the Act gate, just later and on unsteady legs (see advanceClock). Flyers hover over
   it, and a planted cross has no feet to lose. The dungeons off Ashfall Road are cut
   stone, not live rock: they have no weather and no quakes. */
const QUAKE_CHANCE = 0.4, QUAKE_ROUNDS = 2;
const QUAKE_EVERY = 25, QUAKE_SLIP = 50;   // four jolts a round, each sliding units back 5% of the track
const underground = () => state.mode === 'hunt' || state.mode === 'dungeon';
const caveHunt = () => state.mode === 'hunt';
const quaking = () => (state.quake || 0) > 0;

// The quake lays no status on anyone — the jolts themselves live in advanceClock. This just says so.
function quakeRumbles(by) {
  log(`${by}: the floor bucks, and the whole speed bar is thrown back a step, again and again. Everyone presses on.`, 'sys');
}

// Start of a cave-hunt round: run the tremor down, or roll a new one.
function tickQuake() {
  if (!caveHunt()) return false;
  if (quaking()) {
    state.quake--;
    if (quaking()) { quakeRumbles('The aftershock'); return false; }
    state.quakeJolt = null;
    log('The ground settles. The shaking stops.', 'wx');
    return false;
  }
  if (state.round === 1 || (state.round - 1) % WEATHER_EVERY !== 0) return false;
  if (Math.random() >= QUAKE_CHANCE) return false;
  state.quake = QUAKE_ROUNDS;
  state.quakeJolt = state.time + QUAKE_EVERY;   // the first jolt lands a beat after the rumble starts
  const W = WEATHER.quake;
  log(`The rock groans and the floor heaves: ${W.name}. ${W.desc}`, 'wx');
  announce('The ground shakes', W.name);
  const bar = $('#weather');
  bar.classList.remove('changed'); void bar.offsetWidth; bar.classList.add('changed');
  quakeRumbles('The quake');
  return true;
}

function newRound() {
  state.round++;
  log(`Round ${state.round}${highTide() ? ' · High Tide' : ''}`, 'round');
  // Underground there is no weather. Emberhollow Cave has the shifting rock instead, and
  // Castle Harrowgate's battlefields keep their own hazards (hazardRound; a no-op elsewhere).
  if (underground()) { hazardRound(); return tickQuake(); }
  // A new sky is due when its round comes up. (Battles saved before skies had their own length
  // fall back to the old every-WEATHER_EVERY-rounds clock.)
  const due = state.wxNext != null ? state.round >= state.wxNext : (state.round - 1) % WEATHER_EVERY === 0;
  if (!due) { brimstoneOmen(); return false; }
  state.weather = state.nextWeather;
  // Brimstone Fall is only ever the herald: the Ash Storm it announces always follows it, next round.
  state.nextWeather = state.weather === 'brim' ? 'ash' : rollWeather(state.weather);
  state.wxNext = state.round + (state.weather === 'brim' ? BRIMSTONE_ROUNDS : WEATHER_EVERY);
  const W = WEATHER[state.weather];
  log(`The weather turns: ${W.name}. ${W.desc}`, 'wx');
  // Downpour or Thunderstorm hits the field: douse every mech's Heat at once. It stays doused until the weather passes.
  if (wetWeather()) douseMechs();
  if (state.weather === 'clear') clearSight();
  announceWeather();
  // The two skies that strike as they arrive, once each and never again while they hold.
  if (state.weather === 'sun') dawnMend();
  if (state.weather === 'brim') state.wxFx = brimstoneFall();   // the round loop waits for the meteors
  brimstoneOmen();
  return true;
}

// The sky's warning before Brimstone Fall: the arena sky turns (renderBattle sets data-omen from
// roundsUntilWeather) and the log says so, two rounds out and again the round before.
function brimstoneOmen() {
  if (state.nextWeather !== 'brim') return;
  const left = roundsUntilWeather();
  if (left === 2) log('The sky turns yellow and bright orange. Something is burning beyond the clouds.', 'wx');
  else if (left === 1) log('The sky darkens to a dusky orange. Brimstone falls next round.', 'wx');
}

/* Golden Dawn breaking: the light mends everyone still standing, both warbands alike, for a
   share of their max HP. Once, as it arrives — it does not mend again while the dawn holds. */
function dawnMend() {
  const healed = [];
  for (const u of allUnits()) {
    if (u.hp <= 0 || u.hp >= u.maxHp) continue;
    burst(u, 'heal');
    healUnit(u, u, Math.round(u.maxHp * DAWN_HEAL_PCT), 'the Golden Dawn');
    healed.push(u.name);
  }
  log(healed.length ? `The dawn mends the field: ${healed.join(', ')}.` : 'The dawn breaks over a field with no wounds to mend.', 'wx');
}

/* Brimstone Fall: fireballs rain all over the field. As they land, every fighter on both sides
   takes 10% of their max HP, and that can kill (Undying still catches the Pale Host, and a felled
   Ironclad still leaves its Salvage Bot). Then the fires catch: everyone left standing Burns for
   5% of the HP they have left, one tick on their next turn (an Ash Storm fans it, as ever). */
async function brimstoneFall() {
  meteorShower();
  await wait(650);   // the first meteors are landing
  const struck = [];
  for (const u of allUnits()) {
    if (u.hp <= 0) continue;
    const dmg = Math.max(1, Math.round(u.maxHp * BRIMSTONE_PCT));
    u.hp = Math.max(0, u.hp - dmg);
    burst(u, 'fire');
    bump(u, 'hurt');
    float(u, `${dmg}`, 'dot');
    struck.push(`${u.name} ${dmg}`);
    if (u.hp <= 0) fell(u, null);
  }
  log(`Meteors fall across the field: ${struck.join(', ')}.`, 'wx');
  sweepDeathBots();
  if (!reduced) $('#arena').animate([{ translate: '0 0' }, { translate: '6px -4px' }, { translate: '-5px 4px' }, { translate: '0 0' }], { duration: beat(320) });
  render();
  await wait(450);
  const burning = [];
  for (const u of allUnits()) {
    if (u.hp <= 0) continue;
    addFx(u, 'burn', 1, Math.max(1, Math.round(u.hp * BRIMSTONE_BURN)), true);
    if (has(u, 'burn')) burning.push(u.name);
  }
  if (burning.length) log(`The fires catch: ${listAnd(burning)} ${burning.length === 1 ? 'is' : 'are'} burning.`, 'wx');
  render();
}

// Fireballs all over the place: meteors streak down from the upper left onto every part of the
// field, each landing in a flash of fire. Purely visual; brimstoneFall deals the damage.
// A fireball for the shower: a white-hot core trailing an orange flame tail, pointing right.
const FIREBALL_ART = [46, 22, `<defs><linearGradient id="fbTail"><stop offset="0" stop-color="#ff5a1f" stop-opacity="0"/>
    <stop offset=".65" stop-color="#ff8a2a" stop-opacity=".85"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
    <radialGradient id="fbCore"><stop offset="0" stop-color="#fffbe2"/><stop offset=".45" stop-color="#ffd05a"/>
    <stop offset=".8" stop-color="#ff6a1f"/><stop offset="1" stop-color="#ff4a10" stop-opacity="0"/></radialGradient></defs>
  <path d="M0 11 Q15 3 34 4.5 L34 17.5 Q15 19 0 11 Z" fill="url(#fbTail)"/><circle cx="35" cy="11" r="10" fill="url(#fbCore)"/>`];

function meteorShower(n = 32, span = 1100) {
  if (reduced) return;
  const arena = $('#arena'), W = arena.clientWidth, H = arena.clientHeight;
  const [w, h, svg] = FIREBALL_ART;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'proj fireball';
    Object.assign(el.style, { width: `${w}px`, height: `${h}px`, margin: `${-h / 2}px 0 0 ${-w / 2}px` });
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${svg}</svg>`;
    const tx = Math.random() * W, ty = H * (0.42 + Math.random() * 0.52);   // somewhere on the ground
    const fx = tx - 110 - Math.random() * 90, fy = -30 - Math.random() * 40;
    const ang = Math.atan2(ty - fy, tx - fx) * 180 / Math.PI, sc = 0.7 + Math.random() * 0.8;
    const at = (x, y) => `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${ang.toFixed(1)}deg) scale(${sc.toFixed(2)})`;
    arena.appendChild(el);
    const a = el.animate([{ transform: at(fx, fy) }, { transform: at(tx, ty) }],
      { duration: beat(360 + Math.random() * 240), delay: beat(Math.random() * span * 0.8), easing: 'ease-in', fill: 'backwards' });
    a.finished.then(() => {
      el.remove();
      const hit = document.createElement('div');
      hit.className = 'meteorHit';
      hit.style.setProperty('--x', `${tx.toFixed(1)}px`);
      hit.style.setProperty('--y', `${ty.toFixed(1)}px`);
      arena.appendChild(hit);
      setTimeout(() => hit.remove(), 600);
    }).catch(() => el.remove());
  }
}

// Big centered text over the arena (weather changes, battle start).
function announce(kicker, text) {
  const el = $('#wxAnnounce');
  el.innerHTML = `<div><small>${kicker}</small>${text}</div>`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function announceWeather() {
  announce('The weather turns', WEATHER[wx()].name);
  const bar = $('#weather');
  bar.classList.remove('changed'); void bar.offsetWidth; bar.classList.add('changed');
}

// Weather icons for the battle's weather pill.
const WX_ICON = { clear: '🌤️', brim: '☄️', ash: '🌋', storm: '⛈️', rain: '🌧️', sun: '🌅', mist: '🌫️', moon: '🌕', quake: '🪨', pall: '🪦' };

function roundsUntilWeather() {
  if (state.wxNext != null) return state.wxNext - state.round;
  return WEATHER_EVERY - ((state.round - 1) % WEATHER_EVERY);
}

// Battles are decided by heroes only; summons don't count.
const heroesUp = (side) => state.teams[side].some((u) => alive(u) && !u.summon);

function checkEnd() {
  if (['won', 'lost', 'cleared'].includes(state.phase)) return true;
  // The Ballroom rallies before it falls: a waiting coward steps in rather than let the fight end.
  while (!heroesUp('e') && nextWave());
  if (!heroesUp('e')) { endBattle(true); return true; }
  if (!heroesUp('p')) { endBattle(false); return true; }
  return false;
}

/* ---------- Summons ---------- */
const summonOf = (owner) => state.teams[owner.side].find((x) => x.summon && x.owner === owner.uid && alive(x));

/* A fallen summon is not swept up at once: the body lies where it dropped for three rounds of bar
   time before it is cleared away. It takes no part in the fight while it lies there — a dead unit
   never moves on the speed bar and its token is hidden (.tok.down), and it can't be targeted or
   healed, because alliesOf / foesOf only ever return the living. It is scenery.
   An Ink Double is the exception: an illusion has no body to leave, so it vanishes the moment it
   drops. Every summon that is a real thing (copy is unset) leaves a corpse. */
const CORPSE_TIME = 3 * ROUND_TIME;
const leavesCorpse = (u) => !SUMMONS[u.id].copy;

function summonUnit(owner, kind) {
  const def = SUMMONS[kind];
  // Recasting replaces the servant you still have standing. A corpse from an earlier one is left
  // alone to finish lying there — the new summon simply takes the next spot beside the caster.
  const old = summonOf(owner);
  if (old) removeUnit(old);
  const st = def.stats(owner);
  state.summonSeq = (state.summonSeq || 0) + 1;
  const u = {
    uid: `${owner.uid}s${state.summonSeq}`, id: kind, art: def.copy ? owner.id : kind,
    side: owner.side, summon: true, owner: owner.uid,
    name: def.copyName ? def.copyName(owner) : def.copy ? `Ink ${owner.name}` : def.name,
    level: owner.level, faction: owner.faction, race: null, role: def.role, floats: !!def.floats, inert: !!def.inert,
    ...st, hp: st.maxHp, effects: [], cooldowns: {}, heat: 0, stacks: 0, hitSince: false, lastAction: null, combo: false,
    pos: 300 + Math.random() * 200, expires: def.life ? state.time + def.life : null,
  };
  state.teams[owner.side].push(u);
  addUnitDom(u);
  if (!def.plant) {   // a planted cross announces itself when it lands (plantMarker)
    log(`${owner.name} summons ${u.name}.`, owner.side);
    float(u, 'Summoned', 'fx');
  }
  if (def.onSpawn) def.onSpawn(u);
  return u;
}

/* GRAVE CROSS — blows, not damage. The cross's HP is how many blows it has left: whatever a hit
   would have taken off, it loses exactly one, and nothing can put any back. Every damage path in
   the game ends in a write to hp (strikeOnce, sweeps, meteors, shared blows), so counting at the
   write catches them all without each one having to know about the cross. */
function countBlows(u) {
  let left = u.maxHp;
  Object.defineProperty(u, 'hp', {
    enumerable: true, configurable: true,
    get: () => left,
    set: (v) => { if (v < left) left -= 1; },
  });
}

/* Plant the Marker: Mordrek strides forward, heaves the cross up and drives it into the ground.
   The cross is already on the field (so its spot is known) but kept out of sight until it lands. */
async function plantMarker(u, sk) {
  const s = summonUnit(u, sk.summon);
  const sEl = actorEl(s);
  if (sEl) sEl.style.visibility = 'hidden';
  render();
  const trip = await dashTo(u, [s]);
  await strikePose(u, true, sk);   // resolves as the foot of the cross meets the ground
  u.planted = true;
  if (sEl) sEl.style.visibility = '';
  if (!reduced) {
    bodyEl(s)?.animate([{ transform: 'translateY(-34%)', opacity: 0.4 }, { transform: 'none', opacity: 1 }],
      { duration: beat(140), easing: 'ease-in' });
    $('#arena').animate([{ translate: '0 0' }, { translate: '0 4px' }, { translate: '0 -2px' }, { translate: '0 0' }], { duration: beat(260) });
  }
  burst(s, 'smoke');
  float(s, 'Taunt', 'fx');
  log(`${u.name} drives his cross into the ground. Every enemy turns to face it.`, u.side);
  render();
  await wait(500);
  await dashBack(u, trip);
}

/* LAST RITES — Mordrek calls two giant iron crosses down on one enemy, one after the other.
   Each lands as a blow (damageSkill's own hit loop, so armor, dodge and drains work as usual), and
   the pair stays driven in over the target, crossed above its head: it is pinned ('rites', frozen
   on the speed bar) until Mordrek's next turn starts, or until he truly falls (releaseRites).
   Both crosses are drawn in the target's body space (100x100, feet at y=94): the falling copy and
   the standing pair (.body > .rites) use the same art, so the hand-over is seamless. */

/* THE COFFIN (Mortessa's Coffin): a toe-pincher box of grave-wood with two iron bands and the
   Host's green cross on the lid, standing upright on the sprites' own ground line (y 94) so it
   fills the spot its occupant was holding. Flat fills only — no gradient ids to collide

// Graveyard Fence, planted: a wider stretch of the railing Barrow carries (WEAPONS.gravefence),
// drawn once and handed to the CSS as --fence-art for .unit.fenced.
const FENCE_ART = (() => {
