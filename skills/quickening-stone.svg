<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Quickening Stone. 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#2a2440"/><stop offset="1" stop-color="#0e0c1a"/></radialGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#000" flood-opacity=".55"/></filter>
<linearGradient id="qsStone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8a7a"/><stop offset="1" stop-color="#4a4a40"/></linearGradient>
<linearGradient id="qsTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fcad1"/><stop offset="1" stop-color="#2a7a8a"/></linearGradient>
<radialGradient id="qsGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fcad1" stop-opacity=".4"/><stop offset="1" stop-color="#2a7a8a" stop-opacity="0"/></radialGradient>
</defs>
<rect x="2" y="2" width="60" height="60" rx="11" fill="url(#bg)"/>
<rect x="5.5" y="5.5" width="53" height="53" rx="8" fill="none" stroke="#b9c0e0" stroke-width="1" opacity="0.25"/>
<g filter="url(#ds)" stroke="#15121d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
<!-- standing stone — tall, slightly tapered -->
<path d="M27 52 L25 22 Q25 16 32 14 Q39 16 39 22 L37 52 Z" fill="url(#qsStone)"/>
<!-- base slab -->
<ellipse cx="32" cy="52" rx="11" ry="3.5" fill="#5a5a4e" stroke="#15121d" stroke-width="1.6"/>
<!-- speed lines emanating rightward from stone -->
<line x1="42" y1="24" x2="54" y2="22" stroke="#5fcad1" stroke-width="2" opacity="0.9"/>
<line x1="42" y1="32" x2="56" y2="32" stroke="#5fcad1" stroke-width="2.2" opacity="1"/>
<line x1="42" y1="40" x2="54" y2="42" stroke="#5fcad1" stroke-width="2" opacity="0.9"/>
<!-- forward arrows at ends -->
<path d="M52 19 L56 22 L52 25" fill="none" stroke="#5fcad1" stroke-width="2" opacity="0.8"/>
<path d="M54 29 L58 32 L54 35" fill="none" stroke="#5fcad1" stroke-width="2.2" opacity="0.9"/>
<path d="M52 39 L56 42 L52 45" fill="none" stroke="#5fcad1" stroke-width="2" opacity="0.8"/>
<!-- subtle glow lines on left (secondary) -->
<line x1="22" y1="26" x2="12" y2="24" stroke="#5fcad1" stroke-width="1.4" opacity="0.4"/>
<line x1="22" y1="34" x2="10" y2="34" stroke="#5fcad1" stroke-width="1.4" opacity="0.4"/>
<line x1="22" y1="42" x2="12" y2="44" stroke="#5fcad1" stroke-width="1.4" opacity="0.4"/>
</g>
<rect x="2" y="2" width="60" height="60" rx="11" fill="none" stroke="#b9c0e0" stroke-width="2" opacity="0.85"/>
</svg>
