<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Mana Cairn. 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#2a2440"/><stop offset="1" stop-color="#0e0c1a"/></radialGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#000" flood-opacity=".55"/></filter>
<linearGradient id="mcStone1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8a7a"/><stop offset="1" stop-color="#4a4a40"/></linearGradient>
<linearGradient id="mcStone2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9a88"/><stop offset="1" stop-color="#5a5a4e"/></linearGradient>
<linearGradient id="mcStone3" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#7a7a6c"/><stop offset="1" stop-color="#3e3e36"/></linearGradient>
<radialGradient id="mcGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".6"/><stop offset=".6" stop-color="#5fcad1" stop-opacity=".3"/><stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/></radialGradient>
<linearGradient id="mcMana" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#2f6fd0"/></linearGradient>
<filter id="mcBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect x="2" y="2" width="60" height="60" rx="11" fill="url(#bg)"/>
<rect x="5.5" y="5.5" width="53" height="53" rx="8" fill="none" stroke="#b9c0e0" stroke-width="1" opacity="0.25"/>
<!-- mana aura glow behind cairn -->
<ellipse cx="32" cy="36" rx="16" ry="18" fill="url(#mcGlow)" filter="url(#mcBlur)" opacity="0.7"/>
<g filter="url(#ds)" stroke="#15121d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
<!-- bottom stone — wide, flat -->
<ellipse cx="32" cy="48" rx="13" ry="5" fill="url(#mcStone1)"/>
<path d="M19 48 Q19 40 24 39 L40 39 Q45 40 45 48" fill="url(#mcStone1)"/>
<!-- middle stone — medium -->
<ellipse cx="32" cy="38" rx="10" ry="4" fill="url(#mcStone2)"/>
<path d="M22 38 Q22 31 26 30 L38 30 Q42 31 42 38" fill="url(#mcStone2)"/>
<!-- top stone — small, rounder -->
<ellipse cx="32" cy="29" rx="7" ry="3.5" fill="url(#mcStone3)"/>
<path d="M25 29 Q25 22 28 21 L36 21 Q39 22 39 29" fill="url(#mcStone3)"/>
<!-- mana swirl lines -->
<path d="M18 42 Q14 34 20 26 Q24 20 30 18" fill="none" stroke="url(#mcMana)" stroke-width="1.8" opacity="0.7"/>
<path d="M46 42 Q50 34 44 26 Q40 20 34 18" fill="none" stroke="url(#mcMana)" stroke-width="1.8" opacity="0.7"/>
<!-- small mana sparkle at top -->
<path d="M32 14 L33 16 L35 17 L33 18 L32 20 L31 18 L29 17 L31 16 Z" fill="#bfe6ff" stroke="none" opacity="0.9"/>
</g>
<rect x="2" y="2" width="60" height="60" rx="11" fill="none" stroke="#b9c0e0" stroke-width="2" opacity="0.85"/>
</svg>
