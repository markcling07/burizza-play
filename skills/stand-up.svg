<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Stand Up. The anchors unlock and the machine rises. 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<linearGradient id="suSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c4d8"/><stop offset="1" stop-color="#6b7792"/></linearGradient>
</defs>
<!-- the ground it is leaving -->
<path d="M6 52 h52" stroke="#7d6a4e" stroke-width="3" stroke-linecap="round"/>
<path d="M14 56 l3 -4 M26 57 l2 -5 M38 57 l2 -5 M50 56 l-3 -4" stroke="#5a4a36" stroke-width="2" stroke-linecap="round"/>
<!-- the hull, lifted clear -->
<path d="M18 26 h28 a4 4 0 0 1 4 4 v14 H14 V30 a4 4 0 0 1 4 -4 z" fill="url(#suSteel)" stroke="#2b3243" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="21" y="32" width="22" height="5.5" rx="2" fill="#1b2130"/>
<rect x="21" y="32" width="22" height="2.2" rx="1.1" fill="#f0a73a" opacity=".55"/>
<!-- legs under it again, off the floor -->
<path d="M21 44 v5 M43 44 v5" stroke="#2b3243" stroke-width="3" stroke-linecap="round"/>
<!-- rising: the lift arrow -->
<path d="M32 20 V6" stroke="#f0a73a" stroke-width="3.4" stroke-linecap="round"/>
<path d="M24 13 l8 -8 l8 8" fill="none" stroke="#f0a73a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
