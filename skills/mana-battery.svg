<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Mana Battery. 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#2a2440"/><stop offset="1" stop-color="#0e0c1a"/></radialGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#000" flood-opacity=".55"/></filter>
<radialGradient id="mb-orb" cx=".4" cy=".35" r=".65"><stop offset="0" stop-color="#bfe6ff"/><stop offset=".5" stop-color="#5fcad1"/><stop offset="1" stop-color="#2f6fd0"/></radialGradient>
<radialGradient id="mb-glow" cx=".35" cy=".45" r=".55"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".35"/><stop offset=".6" stop-color="#2f6fd0" stop-opacity=".15"/><stop offset="1" stop-color="#2a7a8a" stop-opacity="0"/></radialGradient>
<linearGradient id="mb-mana" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#2f6fd0"/></linearGradient>
<linearGradient id="mb-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fcad1"/><stop offset="1" stop-color="#2a7a8a"/></linearGradient>
</defs>
<rect x="2" y="2" width="60" height="60" rx="11" fill="url(#bg)"/>
<rect x="5.5" y="5.5" width="53" height="53" rx="8" fill="none" stroke="#b9c0e0" stroke-width="1" opacity="0.25"/>
<!-- mana glow behind orb -->
<circle cx="26" cy="32" r="16" fill="url(#mb-glow)"/>
<g filter="url(#ds)" stroke="#15121d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
<!-- central crystal / orb -->
<circle cx="26" cy="32" r="10" fill="url(#mb-orb)"/>
<!-- facet lines on the crystal -->
<line x1="26" y1="22" x2="26" y2="42" stroke="#15121d" stroke-width="1" opacity=".4"/>
<line x1="17" y1="28" x2="35" y2="36" stroke="#15121d" stroke-width="1" opacity=".4"/>
<!-- inner highlight -->
<circle cx="23" cy="28" r="3" fill="#bfe6ff" stroke="none" opacity=".5"/>
<!-- mana streams flowing rightward -->
<path d="M36 28 Q42 26 50 24" fill="none" stroke="url(#mb-mana)" stroke-width="2.4" opacity=".9"/>
<path d="M36 32 Q44 32 52 32" fill="none" stroke="url(#mb-mana)" stroke-width="2.4" opacity=".7"/>
<path d="M36 36 Q42 38 50 40" fill="none" stroke="url(#mb-mana)" stroke-width="2.4" opacity=".9"/>
<!-- mana droplets at stream tips -->
<circle cx="50" cy="24" r="2" fill="#bfe6ff" stroke="#15121d" stroke-width="1"/>
<circle cx="52" cy="32" r="2" fill="#bfe6ff" stroke="#15121d" stroke-width="1"/>
<circle cx="50" cy="40" r="2" fill="#bfe6ff" stroke="#15121d" stroke-width="1"/>
<!-- small sparkle on the orb -->
<path d="M20 32 L18.5 33.5 L20 35 L21.5 33.5 Z" fill="#bfe6ff" stroke="none"/>
</g>
<rect x="2" y="2" width="60" height="60" rx="11" fill="none" stroke="#b9c0e0" stroke-width="2" opacity="0.85"/>
</svg>
