<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Unweaving Stone. 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#2a2440"/><stop offset="1" stop-color="#0e0c1a"/></radialGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#000" flood-opacity=".55"/></filter>
<linearGradient id="usStone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8a7a"/><stop offset="1" stop-color="#4a4a40"/></linearGradient>
<linearGradient id="usThread1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a7ac4"/><stop offset="1" stop-color="#5fcad1"/></linearGradient>
<linearGradient id="usThread2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a5aaa"/><stop offset="1" stop-color="#4ab8be"/></linearGradient>
<linearGradient id="usThread3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b094d8"/><stop offset="1" stop-color="#6adce2"/></linearGradient>
</defs>
<rect x="2" y="2" width="60" height="60" rx="11" fill="url(#bg)"/>
<rect x="5.5" y="5.5" width="53" height="53" rx="8" fill="none" stroke="#b9c0e0" stroke-width="1" opacity="0.25"/>
<g filter="url(#ds)" stroke="#15121d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
<!-- standing stone — centered pillar -->
<path d="M28 52 L26 24 Q26 16 32 14 Q38 16 38 24 L36 52 Z" fill="url(#usStone)"/>
<!-- base slab -->
<ellipse cx="32" cy="52" rx="10" ry="3.5" fill="#5a5a4e" stroke="#15121d" stroke-width="1.6"/>
<!-- threads converging into center then splitting apart -->
<!-- left side: threads bundled, coming in -->
<path d="M10 20 Q18 22 24 28" fill="none" stroke="url(#usThread1)" stroke-width="2" opacity="0.85"/>
<path d="M8 30 Q16 30 24 33" fill="none" stroke="url(#usThread2)" stroke-width="2" opacity="0.85"/>
<path d="M10 42 Q18 40 24 37" fill="none" stroke="url(#usThread3)" stroke-width="1.8" opacity="0.85"/>
<!-- right side: threads fraying apart, splayed out -->
<path d="M40 26 Q46 20 54 14" fill="none" stroke="url(#usThread1)" stroke-width="2" opacity="0.75"/>
<path d="M40 30 Q48 28 56 30" fill="none" stroke="url(#usThread2)" stroke-width="1.6" opacity="0.6"/>
<path d="M40 34 Q46 38 52 46" fill="none" stroke="url(#usThread3)" stroke-width="1.6" opacity="0.6"/>
<!-- frayed ends — short dashes at right ends -->
<line x1="53" y1="13" x2="56" y2="10" stroke="#9a7ac4" stroke-width="1.4" opacity="0.5"/>
<line x1="55" y1="15" x2="58" y2="13" stroke="#9a7ac4" stroke-width="1.4" opacity="0.5"/>
<line x1="55" y1="29" x2="58" y2="27" stroke="#7a5aaa" stroke-width="1.4" opacity="0.4"/>
<line x1="56" y1="32" x2="58" y2="34" stroke="#7a5aaa" stroke-width="1.4" opacity="0.4"/>
<line x1="51" y1="47" x2="53" y2="50" stroke="#b094d8" stroke-width="1.4" opacity="0.4"/>
<line x1="53" y1="45" x2="56" y2="48" stroke="#b094d8" stroke-width="1.4" opacity="0.4"/>
</g>
<rect x="2" y="2" width="60" height="60" rx="11" fill="none" stroke="#b9c0e0" stroke-width="2" opacity="0.85"/>
</svg>
