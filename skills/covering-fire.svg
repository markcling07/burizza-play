<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Covering Fire (Mara Holt's innate). Hand-drawn to match the 64x64 set. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset=".5" stop-color="#aab4c7"/><stop offset="1" stop-color="#5d6780"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8713d"/><stop offset="1" stop-color="#5e3a1d"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#e0a83c"/><stop offset="1" stop-color="#9c6b1e"/></linearGradient>
<radialGradient id="flash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3cf"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="glow" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#e0bb55" stop-opacity=".4"/><stop offset="1" stop-color="#e0bb55" stop-opacity="0"/></radialGradient>
</defs>
<rect x="2" y="2" width="60" height="60" rx="14" fill="#232839"/>
<rect x="2" y="2" width="60" height="60" rx="14" fill="url(#glow)"/>
<!-- watch rings: the turns counted off -->
<circle cx="32" cy="32" r="21" fill="none" stroke="#e0bb55" stroke-width="2" stroke-dasharray="6.5 4.2" opacity=".55"/>
<circle cx="32" cy="32" r="14.5" fill="none" stroke="#e0bb55" stroke-width="1.4" opacity=".3"/>
<!-- the musket, laid across the watch -->
<g transform="rotate(-24 32 32)">
<rect x="8" y="30" width="34" height="4.6" rx="2" fill="url(#steel)" stroke="#161a26" stroke-width="1.8"/>
<path d="M14 34 L24 34 L21 42 Q15 42 12 38 Z" fill="url(#wood)" stroke="#161a26" stroke-width="1.8"/>
<rect x="24" y="33.6" width="5" height="4" rx="1.4" fill="url(#gold)" stroke="#161a26" stroke-width="1.4"/>
<!-- muzzle flash -->
<circle cx="46" cy="32" r="7.5" fill="url(#flash)"/>
<path d="M44 32 l9 0 M46.5 27.5 l6 -4.5 M46.5 36.5 l6 4.5" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round"/>
</g>
<!-- the fifth tick, struck gold -->
<path d="M32 9 v5" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
<circle cx="32" cy="32" r="2.6" fill="#e0bb55" opacity=".7"/>
</svg>
