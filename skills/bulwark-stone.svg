<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Bulwark Stone. 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#2a2440"/><stop offset="1" stop-color="#0e0c1a"/></radialGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#000" flood-opacity=".55"/></filter>
<linearGradient id="bs-stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8a7a"/><stop offset="1" stop-color="#4a4a40"/></linearGradient>
<radialGradient id="bs-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fcad1" stop-opacity=".4"/><stop offset=".6" stop-color="#2a7a8a" stop-opacity=".2"/><stop offset="1" stop-color="#2a7a8a" stop-opacity="0"/></radialGradient>
<linearGradient id="bs-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fcad1"/><stop offset="1" stop-color="#2a7a8a"/></linearGradient>
</defs>
<rect x="2" y="2" width="60" height="60" rx="11" fill="url(#bg)"/>
<rect x="5.5" y="5.5" width="53" height="53" rx="8" fill="none" stroke="#b9c0e0" stroke-width="1" opacity="0.25"/>
<!-- teal glow behind stone -->
<rect x="14" y="14" width="36" height="36" rx="18" fill="url(#bs-glow)"/>
<g filter="url(#ds)" stroke="#15121d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
<!-- wide standing stone / shield silhouette -->
<path d="M22 48 L19 22 Q19 14 32 12 Q45 14 45 22 L42 48 Z" fill="url(#bs-stone)"/>
<!-- horizontal crack lines on the stone -->
<line x1="23" y1="28" x2="41" y2="28" stroke="#15121d" stroke-width="1.2"/>
<line x1="24" y1="38" x2="40" y2="38" stroke="#15121d" stroke-width="1.2"/>
<!-- teal shield emblem on stone face -->
<path d="M32 20 L37 24 L37 31 Q37 35 32 37 Q27 35 27 31 L27 24 Z" fill="none" stroke="#5fcad1" stroke-width="1.8"/>
<!-- impact lines bouncing off left side -->
<line x1="12" y1="24" x2="17" y2="27" stroke="#5fcad1" stroke-width="2"/>
<line x1="10" y1="30" x2="16" y2="32" stroke="#5fcad1" stroke-width="2" opacity=".7"/>
<line x1="12" y1="38" x2="17" y2="36" stroke="#5fcad1" stroke-width="2" opacity=".5"/>
<!-- impact lines bouncing off right side -->
<line x1="52" y1="24" x2="47" y2="27" stroke="#5fcad1" stroke-width="2"/>
<line x1="54" y1="30" x2="48" y2="32" stroke="#5fcad1" stroke-width="2" opacity=".7"/>
<line x1="52" y1="38" x2="47" y2="36" stroke="#5fcad1" stroke-width="2" opacity=".5"/>
</g>
<rect x="2" y="2" width="60" height="60" rx="11" fill="none" stroke="#b9c0e0" stroke-width="2" opacity="0.85"/>
</svg>
