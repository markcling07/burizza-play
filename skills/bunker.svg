<?xml version="1.0" encoding="UTF-8"?>
<!-- Burizza skill icon: Bunker. Bulwark-7 driven into the ground, shots glancing off. 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
<defs>
<linearGradient id="bkSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c4d8"/><stop offset="1" stop-color="#6b7792"/></linearGradient>
<linearGradient id="bkGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4a36"/><stop offset="1" stop-color="#3a2f22"/></linearGradient>
</defs>
<!-- the ground it is driven into -->
<path d="M4 48 h56 v10 H4 z" fill="url(#bkGround)"/>
<path d="M4 48 h56" stroke="#7d6a4e" stroke-width="2"/>
<!-- the hull: a squat, braced block -->
<path d="M14 26 h36 a4 4 0 0 1 4 4 v18 H10 V30 a4 4 0 0 1 4 -4 z" fill="url(#bkSteel)" stroke="#2b3243" stroke-width="2.2" stroke-linejoin="round"/>
<!-- the vision slit -->
<rect x="18" y="33" width="28" height="6" rx="2" fill="#1b2130"/>
<rect x="18" y="33" width="28" height="2.5" rx="1.2" fill="#f0a73a" opacity=".55"/>
<!-- anchors, bitten into the earth -->
<path d="M14 48 l-4 8 M50 48 l4 8" stroke="#2b3243" stroke-width="3.4" stroke-linecap="round"/>
<path d="M22 48 v7 M42 48 v7" stroke="#2b3243" stroke-width="2.6" stroke-linecap="round"/>
<!-- two rounds glancing off the plating -->
<path d="M30 10 l0 9" stroke="#f0a73a" stroke-width="2.6" stroke-linecap="round"/>
<path d="M30 22 q6 2 11 -5" fill="none" stroke="#f0a73a" stroke-width="2.6" stroke-linecap="round"/>
<path d="M46 12 l-3 7" stroke="#f0a73a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
<path d="M44 21 q5 2 9 -3" fill="none" stroke="#f0a73a" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
</svg>
